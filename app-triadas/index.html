<!doctype html><html lang="es-MX"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F0E9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Teoría">
<title>Teoría musical: tríadas, séptimas y examen · App de Eli</title>
<meta name="description" content="App para estudiar teoría musical: tríadas, séptimas, funciones, Drop 2, dominantes secundarias, escalas menores, intercambio modal, simbología, formas y oído, con pentagrama, piano y corrección paso a paso.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233B2A22'/%3E%3Cg fill='%23F3DCDC'%3E%3Cellipse cx='32' cy='46' rx='9' ry='6.5'/%3E%3Cellipse cx='32' cy='32' rx='9' ry='6.5' fill='%23EBD9A6'/%3E%3Cellipse cx='32' cy='18' rx='9' ry='6.5' fill='%23B9D0E2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Music&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero-cafe-rosas.webp">
<style>:root{
--bg:#F6F0E9;--bg2:#EFE6DC;--surface:#FFFCF8;--surface2:#FBF6F0;
--ink:#33241D;--ink2:#6E5D52;--ink3:#A0907F;--line:#E9DED2;--line2:#F1E9E0;
--mocha:#7C5A48;--latte:#C8AE96;
--rose:#B56F78;--rose-d:#9A5560;--rose-l:#E9C7C6;--rose-t:#F7E9E7;
--blue:#5F87A6;--blue-d:#4A6F8C;--blue-l:#BFD3E2;--blue-t:#EAF1F6;
--gold:#B8923F;--gold-l:#EBD9A6;--gold-t:#F8F0DC;
--bad:#C2525E;--bad-t:#FBEDEE;--ok:#4F7FA3;--ok-t:#EAF2F8;
--r0:#B56F78;--r1:#B8923F;--r2:#5F87A6;
--rad:24px;--rad-s:16px;--rad-xs:12px;
--sh1:0 1px 2px rgba(51,36,29,.05),0 2px 8px -2px rgba(51,36,29,.06);
--sh2:0 1px 2px rgba(51,36,29,.04),0 12px 32px -12px rgba(78,52,40,.22);
--sh3:0 24px 64px -20px rgba(51,36,29,.35);
--fd:'Fraunces','Noto Music',Georgia,'Times New Roman',serif;--fu:'DM Sans','Noto Music',system-ui,-apple-system,sans-serif;
--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.4,.5,1);
--nav-h:76px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--fu);color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
b,strong{font-weight:600;color:var(--ink)}
.shell{min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:0 20px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}
#app.full{padding-bottom:120px}
.view{animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.still .view,.still .view *{animation:none!important}
.stag>*{animation:viewIn .55s var(--ease) both}
.stag>*:nth-child(2){animation-delay:.04s}.stag>*:nth-child(3){animation-delay:.08s}.stag>*:nth-child(4){animation-delay:.12s}.stag>*:nth-child(5){animation-delay:.16s}.stag>*:nth-child(6){animation-delay:.2s}.stag>*:nth-child(7){animation-delay:.24s}.stag>*:nth-child(n+8){animation-delay:.28s}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(20px + env(safe-area-inset-top)) 0 16px}
.hello small{display:block;font-size:13px;font-weight:500;color:var(--ink3);letter-spacing:.02em}
.hello h1{font-family:var(--fd);font-weight:500;font-size:28px;line-height:1.1;margin:2px 0 0;letter-spacing:-.01em}
.hello h1 em{font-style:italic;color:var(--rose)}
.chips-top{display:flex;gap:8px;align-items:center}
.stat-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;background:var(--surface);box-shadow:var(--sh1);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.stat-chip svg{width:16px;height:16px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--sh1);display:grid;place-items:center;transition:transform .2s var(--ease)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}

/* ---------- Section titles ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 16px}
.sec-h h2{font-family:var(--fd);font-weight:500;font-size:22px;margin:0;letter-spacing:-.01em}
.sec-h a,.sec-h span{font-size:13px;font-weight:600;color:var(--ink3)}
.page-h{padding:calc(24px + env(safe-area-inset-top)) 0 8px}
.page-h .eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.page-h h1{font-family:var(--fd);font-weight:500;font-size:34px;line-height:1.08;margin:8px 0 8px;letter-spacing:-.02em}
.page-h h1 em{font-style:italic;color:var(--mocha)}
.page-h p{margin:0;color:var(--ink2);font-size:15px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border-radius:var(--rad);box-shadow:var(--sh2);padding:24px;margin-bottom:16px;position:relative}
.card.flat{box-shadow:var(--sh1)}
.card.tight{padding:16px}
.tap{transition:transform .25s var(--ease),box-shadow .25s var(--ease);cursor:pointer}
.tap:active{transform:scale(.98)}
@media (hover:hover){.tap:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(51,36,29,.04),0 20px 40px -16px rgba(78,52,40,.3)}}

/* photo */
.ph{position:relative;overflow:hidden;background:var(--bg2)}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:"";position:absolute;inset:0;pointer-events:none}
.ov-cafe::after{background:linear-gradient(180deg,rgba(51,36,29,.05) 0%,rgba(51,36,29,.25) 45%,rgba(43,29,22,.82) 100%)}
.ov-rose::after{background:linear-gradient(180deg,rgba(181,111,120,.10),rgba(120,62,72,.78))}
.ov-blue::after{background:linear-gradient(180deg,rgba(95,135,166,.10),rgba(46,74,98,.80))}
.ov-gold::after{background:linear-gradient(180deg,rgba(184,146,63,.08),rgba(98,72,30,.80))}
.ov-soft::after{background:linear-gradient(180deg,rgba(246,240,233,0),rgba(51,36,29,.35))}
.tint-rose>img{filter:sepia(.18) saturate(.85)}
.tint-blue>img{filter:saturate(.8) hue-rotate(-6deg)}
.tint-gold>img{filter:sepia(.25) saturate(.9)}

/* hero */
.hero{border-radius:28px;min-height:360px;color:#FFF8F1;box-shadow:var(--sh3);display:flex;flex-direction:column;justify-content:flex-end;padding:24px;isolation:isolate}
.hero>img{object-position:50% 100%}
.hero.ov-cafe::after{background:linear-gradient(180deg,rgba(51,36,29,.38) 0%,rgba(51,36,29,.42) 40%,rgba(38,25,19,.88) 100%)}
.hero .in{position:relative;z-index:2}
.hero .tag svg{width:14px;height:14px}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,248,241,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,248,241,.25);padding:6px 12px;border-radius:99px;margin-bottom:16px}
.hero h2{font-family:var(--fd);font-weight:400;font-size:34px;line-height:1.05;margin:0 0 8px;letter-spacing:-.02em;color:#FFF8F1}
.hero h2 em{font-style:italic;color:#F3D2D0}
.hero p{margin:0 0 20px;color:rgba(255,248,241,.82);font-size:15px;max-width:30ch}
.hero .row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero .ringbox{position:absolute;top:20px;right:20px;z-index:2}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:99px;font-weight:600;font-size:16px;letter-spacing:.005em;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s,opacity .2s;white-space:nowrap;user-select:none}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--ink);color:#FFF8F1;box-shadow:0 8px 20px -8px rgba(51,36,29,.55)}
.btn.rose{background:var(--rose);color:#fff;box-shadow:0 8px 20px -8px rgba(154,85,96,.6)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 8px 20px -8px rgba(74,111,140,.6)}
.btn.light{background:#FFF8F1;color:var(--ink)}
.btn.soft{background:var(--bg2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.38;pointer-events:none;box-shadow:none}
.btn-row{display:flex;gap:8px}.btn-row>.btn{flex:1}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--surface);border-radius:var(--rad-s);padding:16px 12px;box-shadow:var(--sh1);text-align:left}
.stat .v{font-family:var(--fd);font-size:26px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .v small{font-family:var(--fu);font-size:13px;color:var(--ink3);font-weight:500;margin-left:2px}
.stat .t{font-size:12px;color:var(--ink3);margin-top:8px;font-weight:500}
.stat .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;margin-bottom:12px}
.stat .ic svg{width:16px;height:16px}

/* mode carousel */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.mode{flex:0 0 72%;max-width:260px;height:300px;border-radius:var(--rad);scroll-snap-align:start;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;box-shadow:var(--sh2)}
.mode .in{position:relative;z-index:2}
.mode .ico{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;margin-bottom:12px;border:1px solid rgba(255,255,255,.28)}
.mode .ico svg{width:22px;height:22px}
.mode h3{font-family:var(--fd);font-weight:500;font-size:26px;margin:0 0 4px;letter-spacing:-.01em;color:#fff}
.mode p{margin:0;font-size:14px;color:rgba(255,255,255,.85);line-height:1.4}

/* list rows */
.lrow{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--sh1);margin-bottom:8px}
.lrow .thumb{width:72px;height:72px;border-radius:14px;flex:0 0 auto}
.lrow .tx{flex:1;min-width:0}
.lrow .tx small{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.lrow .tx h3{font-family:var(--fd);font-weight:500;font-size:18px;margin:2px 0 2px;line-height:1.2;letter-spacing:-.005em}
.lrow .tx p{margin:0;font-size:13px;color:var(--ink2);line-height:1.35}
.lrow .end{flex:0 0 auto;color:var(--ink3);display:grid;place-items:center;width:32px;height:32px}
.lrow .end svg{width:18px;height:18px}
.check-ok{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.check-ok svg{width:16px!important;height:16px!important}

/* wide feature */
.feat{border-radius:var(--rad);min-height:180px;padding:20px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--sh2);margin-bottom:12px}
.feat .in{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.feat h3{font-family:var(--fd);font-weight:500;font-size:24px;margin:0 0 4px;color:#fff;letter-spacing:-.01em}
.feat p{margin:0;font-size:14px;color:rgba(255,255,255,.85)}
.feat .go{width:44px;height:44px;border-radius:50%;background:#FFF8F1;color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.feat .go svg{width:20px;height:20px}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 8px;border-radius:99px;background:var(--rose);color:#fff;font-size:12px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .feat{min-height:200px;margin:0}
.two .feat h3{font-size:20px}
.verse{text-align:center;font-family:var(--fd);font-style:italic;color:var(--ink3);font-size:15px;margin:40px 0 8px}

/* progress bar & ring */
.pbar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .6s var(--ease)}
.ring{display:block}
.ring circle.fg{transition:stroke-dashoffset 1.1s var(--ease)}

/* ---------- Nav ---------- */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;width:calc(100% - 24px);max-width:480px;transition:transform .35s var(--ease),opacity .3s}
#nav.hide{transform:translate(-50%,140%);opacity:0;pointer-events:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);height:68px;padding:6px;border-radius:26px;background:rgba(255,252,248,.82);backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 0 0 1px rgba(51,36,29,.06),0 18px 40px -16px rgba(51,36,29,.35)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:20px;font-size:11px;font-weight:600;color:var(--ink3);transition:color .25s,background .3s var(--ease)}
.tabs a svg{width:22px;height:22px;transition:transform .3s var(--spring)}
.tabs a.on{color:var(--ink);background:var(--rose-t)}
.tabs a.on svg{transform:translateY(-1px) scale(1.06);color:var(--rose-d)}
.brandrail,.railfoot{display:none}

/* ---------- Lesson ---------- */
.cover{height:320px;margin:0 -20px;border-radius:0 0 32px 32px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 20px 48px}
.cover .in{position:relative;z-index:2}
.cover .top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center}
.glass-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,248,241,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,248,241,.3);display:grid;place-items:center;color:#fff}
.glass-btn svg{width:20px;height:20px}
.glass-pill{height:32px;padding:0 12px;border-radius:99px;background:rgba(255,248,241,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,248,241,.3);display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.04em}
.cover h1{font-family:var(--fd);font-weight:400;font-size:34px;line-height:1.05;margin:8px 0 6px;letter-spacing:-.02em;color:#fff}
.cover p{margin:0;color:rgba(255,255,255,.85);font-size:15px}
.lesson-body{margin-top:-24px;position:relative;z-index:3}
.prose{font-size:16px;line-height:1.6;color:var(--ink2)}
.prose p{margin:0 0 12px}.prose p:last-child{margin:0}
.formula{display:grid;gap:8px;margin:16px 0}
.formula>div{background:var(--surface2);border-radius:var(--rad-xs);padding:12px 16px;font-size:14px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}
.formula>div>b:first-child{display:block;font-size:15px;margin-bottom:2px}
.formula .mono{font-family:var(--fd);font-style:italic;color:var(--mocha);font-size:15px}
.tip{display:flex;gap:12px;background:var(--gold-t);border-radius:var(--rad-s);padding:16px;font-size:14.5px;line-height:1.55;color:var(--ink2);margin-top:16px}
.tip .i{flex:0 0 32px;height:32px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--gold)}
.tip .i svg{width:18px;height:18px}
.tip.blue{background:var(--blue-t)}.tip.blue .i{color:var(--blue)}
.tip.rose{background:var(--rose-t)}.tip.rose .i{color:var(--rose)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
.card-h h3{font-family:var(--fd);font-weight:500;font-size:20px;margin:0;letter-spacing:-.01em}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0 0;font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:0}
.steps li{counter-increment:s;position:relative;padding:0 0 20px 48px;font-size:15px;line-height:1.55;color:var(--ink2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:32px;height:32px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink)}
.steps li::after{content:"";position:absolute;left:15.5px;top:34px;bottom:4px;width:1.5px;background:var(--line)}
.steps li:last-child{padding-bottom:0}.steps li:last-child::after{display:none}
.steps li:last-child::before{background:var(--ink);color:#fff;box-shadow:none}
.quiz-opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 16px;border-radius:var(--rad-s);background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:500;font-size:15px;text-align:left;transition:all .25s var(--ease);width:100%}
.opt:active{transform:scale(.98)}
.opt.on{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.opt.ok{box-shadow:inset 0 0 0 2px var(--ok);background:var(--ok-t);color:var(--blue-d)}
.opt.bad{box-shadow:inset 0 0 0 2px var(--bad);background:var(--bad-t);color:var(--bad)}
.opt .mk{width:24px;height:24px;flex:0 0 auto}
.answer{margin-top:16px;border-radius:var(--rad-s);padding:16px;font-size:14.5px;line-height:1.55;animation:viewIn .4s var(--ease)}
.answer.ok{background:var(--ok-t);color:#2E4E66}.answer.bad{background:var(--bad-t);color:#7A3038}
.answer b{color:inherit}
.lnav{display:flex;gap:8px;margin-top:24px}.lnav .btn{flex:1}

/* ---------- Staff ---------- */
.staff{display:block;width:100%;height:auto;overflow:visible}
.staffbox{background:var(--surface2);border-radius:var(--rad-s);padding:16px 12px 8px;box-shadow:inset 0 0 0 1px var(--line2)}
.staff .slot{cursor:pointer}
.staff .slot .hl{opacity:0;transition:opacity .2s}
.staff .slot:hover .hl{opacity:1}
.staff .nh{transform-box:fill-box;transform-origin:center}
.anim .nh{animation:noteIn .55s var(--spring) both}
@keyframes noteIn{from{opacity:0;transform:translateY(-6px) scale(.6)}to{opacity:1;transform:none}}
.ringpulse{animation:rp 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rp{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- Piano ---------- */
.piano-wrap{position:relative;margin:16px -8px 0;border-radius:18px;overflow:hidden;background:linear-gradient(#2A1D17,#1B120E);padding:10px 0 12px;box-shadow:0 14px 30px -14px rgba(27,18,14,.7)}
.piano-wrap::before,.piano-wrap::after{content:"";position:absolute;top:0;bottom:0;width:22px;z-index:5;pointer-events:none}
.piano-wrap::before{left:0;background:linear-gradient(90deg,#1E1410,rgba(30,20,16,0))}
.piano-wrap::after{right:0;background:linear-gradient(-90deg,#1E1410,rgba(30,20,16,0))}
.piano-felt{position:absolute;left:0;right:0;top:8px;height:3px;background:linear-gradient(90deg,#8E3F4B,#B56F78,#8E3F4B);z-index:4;opacity:.9}
.piano-sc{overflow-x:auto;scrollbar-width:none;padding:0 12px;scroll-behavior:smooth}
.piano-sc::-webkit-scrollbar{display:none}
.piano{position:relative;height:168px;margin-top:3px;--wk:42px}
.wk{position:absolute;top:0;width:var(--wk);height:168px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#F4EEE6 0%,#FFFDF9 12%,#FBF7F1 85%,#EDE5DA 100%);box-shadow:inset -1px 0 0 rgba(0,0,0,.12),inset 0 -6px 0 #E3D9CC,0 2px 2px rgba(0,0,0,.3);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:12px;font-size:11px;font-weight:600;color:#A89888;cursor:pointer;transition:background .15s,transform .08s;user-select:none}
.wk:active,.wk.press{transform:translateY(1px);box-shadow:inset -1px 0 0 rgba(0,0,0,.12),inset 0 -2px 0 #E3D9CC}
.wk .oc{position:absolute;bottom:32px;font-size:9px;color:#C4B6A6;font-weight:600;letter-spacing:.04em}
.bk{position:absolute;top:0;width:28px;height:104px;margin-left:-14px;border-radius:0 0 6px 6px;z-index:2;background:linear-gradient(180deg,#2B211C 0%,#1A1210 70%,#0F0A08 100%);box-shadow:inset 0 -5px 0 rgba(255,255,255,.07),inset 1px 0 0 rgba(255,255,255,.06),0 3px 5px rgba(0,0,0,.45);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;font-size:7.5px;letter-spacing:-.1px;line-height:1.2;color:rgba(255,255,255,.55);font-weight:600;text-align:center;user-select:none;transition:transform .08s}
.bk:active{transform:translateY(1px)}
.wk .dot,.bk .dot{position:absolute;left:50%;width:24px;height:24px;margin-left:-12px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;box-shadow:0 4px 10px -2px rgba(0,0,0,.35);animation:dotIn .35s var(--spring)}
.wk .dot{bottom:44px}.bk .dot{bottom:28px;width:20px;height:20px;margin-left:-10px;font-size:9px}
@keyframes dotIn{from{transform:scale(0)}to{transform:scale(1)}}
.wk.r0,.wk.r1,.wk.r2,.wk.sel{color:var(--ink)}
.wk.r0{background:linear-gradient(180deg,#EED3D2,#F7E6E4 70%,#EBCFCD)}
.wk.r1{background:linear-gradient(180deg,#EFE1BA,#F8EFD6 70%,#EADBAF)}
.wk.r2{background:linear-gradient(180deg,#CFDDE9,#E6EEF5 70%,#C9D8E5)}
.wk.sel{background:linear-gradient(180deg,#EAD9CC,#F6EDE5 70%,#E5D3C4)}
.bk.r0{background:linear-gradient(180deg,#8E4E58,#6E3842)}.bk.r1{background:linear-gradient(180deg,#9A7A33,#735A22)}.bk.r2{background:linear-gradient(180deg,#4F7593,#3A5A73)}.bk.sel{background:linear-gradient(180deg,#6A4B3C,#4A3328)}
.dot.r0{background:var(--r0)}.dot.r1{background:var(--r1)}.dot.r2{background:var(--r2)}.dot.sel{background:var(--ink)}

/* ---------- Quiz ---------- */
.qbar{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 16px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 75%,rgba(246,240,233,0))}
.qbar .pbar{flex:1;height:10px}
.qbar .cnt{font-size:13px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.qhead{border-radius:var(--rad);overflow:hidden;box-shadow:var(--sh2);background:var(--surface);margin-bottom:16px}
.qhead .band{height:72px;display:flex;align-items:flex-end;padding:16px 20px;color:#fff}
.qhead .band .in{position:relative;z-index:2;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.qhead .band .in svg{width:16px;height:16px}
.qhead .body{padding:16px 20px 20px;text-align:center}
.qhead .k{font-size:14px;color:var(--ink2);margin-bottom:4px}
.qhead .cif{font-family:var(--fd);font-weight:500;font-size:52px;line-height:1.05;letter-spacing:-.02em;margin:0 0 12px;font-variant-numeric:lining-nums}
.pos-pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:99px;background:var(--rose-t);color:var(--rose-d);font-weight:600;font-size:14px}
.pos-pill.q{background:var(--gold-t);color:#7D6224}
.hint{font-size:13px;color:var(--ink3);margin-top:8px}
.field-l{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:24px 0 8px}
.field-l:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.choice{min-height:52px;border-radius:var(--rad-xs);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),var(--sh1);font-weight:600;font-size:16px;transition:all .2s var(--ease);display:flex;align-items:center;justify-content:center;padding:4px;text-align:center;line-height:1.15}
.choice:active{transform:scale(.95)}
.choice.on{background:var(--ink);color:#FFF8F1;box-shadow:0 6px 14px -6px rgba(51,36,29,.6)}
.choice.cif{font-family:var(--fd);font-size:24px;font-weight:500;min-height:64px}
.choice.sm{font-size:13px;min-height:44px}
.choice[disabled]{opacity:.35}
.choice.acc{font-size:20px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nslot{height:80px;border-radius:var(--rad-s);background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:all .2s var(--ease)}
.nslot small{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.nslot b{font-family:var(--fd);font-size:26px;font-weight:500;min-height:32px;line-height:32px}
.nslot.act{box-shadow:inset 0 0 0 2px var(--rose);background:#fff}
.nslot.act small{color:var(--rose)}
.ctrls{display:flex;gap:8px;margin-top:16px}.ctrls .btn{flex:1}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:24px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(246,240,233,0),var(--bg) 40%)}
.sticky-cta .btn{max-width:480px;margin:0 auto}
.notepills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.npill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 6px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line2);font-weight:600;font-size:14px}
.npill i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.empty-staff{font-size:13px;color:var(--ink3);text-align:center;margin-top:4px;min-height:20px}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(33,23,18,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:60}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:32px 32px 0 0;box-shadow:0 -20px 60px -20px rgba(33,23,18,.5);transform:translate(-50%,105%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s;z-index:70;padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .5s var(--ease)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 16px}
.fb-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.fb-head .bub{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:0 0 auto}
.fb-head .bub svg{width:28px;height:28px}
.fb-head.ok .bub{background:var(--blue);color:#fff;box-shadow:0 10px 24px -8px rgba(74,111,140,.7);animation:pop .6s var(--spring)}
.fb-head.bad .bub{background:var(--rose-t);color:var(--rose-d)}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}100%{transform:none}}
.fb-head h3{font-family:var(--fd);font-weight:500;font-size:26px;margin:0;line-height:1.1;letter-spacing:-.01em}
.fb-head p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.draw path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pts{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:99px;background:var(--gold-t);color:#7D6224;font-weight:700;font-size:13px;margin-left:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp .pane{border-radius:20px;padding:12px 8px 12px;text-align:center;position:relative}
.cmp .pane.y{background:var(--bad-t)}.cmp .pane.c{background:var(--ok-t)}
.cmp .lab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.cmp .pane.y .lab{color:var(--bad)}.cmp .pane.c .lab{color:var(--ok)}
.cmp .lab svg{width:14px;height:14px}
.cmp .nn{font-size:13px;font-weight:600;color:var(--ink2);margin:4px 0 8px;min-height:20px}
.cmp .play{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:#fff;font-size:12px;font-weight:600;box-shadow:var(--sh1)}
.cmp .play svg{width:12px;height:12px}
.why{background:var(--surface);border-radius:20px;padding:16px 20px;margin-top:12px;box-shadow:var(--sh1)}
.why h4,.how h4{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:8px}
.why ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.why li{position:relative;padding-left:20px;font-size:15px;line-height:1.5;color:var(--ink2)}
.why li::before{content:"";position:absolute;left:2px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--rose)}
.how{background:var(--surface);border-radius:20px;padding:20px;margin-top:12px;box-shadow:var(--sh1)}
.res-c{text-align:center;padding:8px 0 0}
.res-c h3{font-family:var(--fd);font-weight:500;font-size:32px;margin:16px 0 4px;letter-spacing:-.02em}
.res-c p{color:var(--ink2);margin:0}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2);transition:all .25s var(--ease)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}

/* toast + fx */
.toast{visibility:hidden;opacity:0;position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:var(--ink);color:#FFF8F1;padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;z-index:90;transition:transform .45s var(--spring);box-shadow:var(--sh3);white-space:nowrap}
.toast.show{transform:translate(-50%,0);visibility:visible;opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* practice setup */
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mtile{height:168px;border-radius:20px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;box-shadow:var(--sh1);transition:transform .25s var(--ease),box-shadow .25s}
.mtile .in{position:relative;z-index:2}
.mtile h3{font-family:var(--fd);font-weight:500;font-size:20px;margin:0;color:#fff}
.mtile p{margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.85);line-height:1.3}
.mtile .ck{position:absolute;top:12px;right:12px;z-index:3;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;transition:all .25s var(--spring)}
.mtile .ck svg{width:16px;height:16px;opacity:0}
.mtile.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--ink),var(--sh2)}
.mtile.on .ck{background:#fff;color:var(--ink);border-color:#fff}.mtile.on .ck svg{opacity:1}
.src-list{display:grid;gap:8px}
.src{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--rad-s);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;width:100%;transition:all .2s var(--ease)}
.src .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.src .ic svg{width:20px;height:20px}
.src b{display:block;font-size:15px}.src small{color:var(--ink3);font-size:13px}
.src .rd{margin-left:auto;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:0 0 auto;transition:all .2s}
.src.on{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}.src.on .rd{box-shadow:inset 0 0 0 7px var(--ink)}
.src[disabled]{opacity:.45}

/* explore */
.bigcif{text-align:center;padding:8px 0 16px}
.bigcif b{display:block;font-family:var(--fd);font-weight:500;font-size:56px;line-height:1;letter-spacing:-.02em}
.bigcif span{display:inline-block;margin-top:12px}
details.acc{margin-top:16px;border-radius:var(--rad-s);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line2)}
details.acc summary{list-style:none;cursor:pointer;padding:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary svg{width:18px;height:18px;transition:transform .3s var(--ease)}
details.acc[open] summary svg{transform:rotate(180deg)}
details.acc .steps{padding:4px 16px 20px}

/* progress page */
.prog-hero{display:flex;align-items:center;gap:20px}
.prog-hero .tx h3{font-family:var(--fd);font-weight:500;font-size:22px;margin:0 0 4px}
.prog-hero .tx p{margin:0;color:var(--ink2);font-size:14px}
.hbar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:12px;margin:12px 0;font-size:14px}
.hbar span{color:var(--ink2);font-weight:500}
.hbar em{font-style:normal;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
.mist{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.mist:last-of-type{border-bottom:0}
.mist b{font-family:var(--fd);font-weight:500;font-size:20px}
.mist span{font-size:13px;color:var(--ink3);text-align:right}
.tag-s{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600}
.tg-rose{background:var(--rose-t);color:var(--rose-d)}.tg-blue{background:var(--blue-t);color:var(--blue-d)}.tg-gold{background:var(--gold-t);color:#7D6224}

/* tarea */
.chord-card .hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.chord-card .hd b{font-family:var(--fd);font-weight:500;font-size:32px;letter-spacing:-.02em}
.chord-card .hd span{font-size:13px;color:var(--ink3);text-align:right}

/* ---------- Desktop ---------- */
@media (min-width:960px){
 :root{--nav-h:0px}
 body{background:var(--bg)}
 .shell{display:grid;grid-template-columns:260px 1fr}
 #nav{position:sticky;top:0;left:auto;bottom:auto;transform:none!important;opacity:1!important;pointer-events:auto!important;width:auto;max-width:none;height:100vh;padding:32px 20px;display:flex;flex-direction:column}
 #nav.hide{transform:none}
 .railfoot{display:block}
 .brandrail{display:flex;align-items:center;gap:12px;margin:0 8px 40px}
 .brandrail .lg{width:44px;height:44px;border-radius:14px;background:var(--ink);display:grid;place-items:center}
 .brandrail b{font-family:var(--fd);font-weight:500;font-size:22px;display:block;line-height:1}
 .brandrail small{font-size:12px;color:var(--ink3)}
 .tabs{display:flex;flex-direction:column;height:auto;gap:4px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;padding:0;border-radius:0}
 .tabs a{flex-direction:row;justify-content:flex-start;gap:12px;height:48px;padding:0 16px;border-radius:14px;font-size:15px}
 .tabs a:hover{background:var(--bg2);color:var(--ink)}
 .tabs a.on{background:var(--surface);box-shadow:var(--sh1)}
 .railfoot{margin-top:auto;font-family:var(--fd);font-style:italic;color:var(--ink3);font-size:14px;padding:0 8px;line-height:1.4}
 #app{max-width:1040px;width:100%;padding:0 48px 64px}
 #app.full{max-width:720px}
 .topbar{padding-top:40px}
 .hello h1{font-size:36px}
 .home{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"hero stats" "hero cont" "hero feats" "modes modes";column-gap:24px;align-items:start}
 .a-hero{grid-area:hero}.a-stats{grid-area:stats}.a-cont{grid-area:cont}.a-feats{grid-area:feats}.a-modes{grid-area:modes}
 .a-cont .sec-h{margin-top:24px}

 .hero{min-height:460px}
 .hero h2{font-size:44px}
 .stats{margin-top:0}
 .rail{margin:0;padding:4px 0 8px;overflow:visible;display:grid;grid-template-columns:repeat(3,1fr)}
 .mode{max-width:none;height:320px}
 .lesson-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .lesson-grid .lrow{margin:0}
 .cover{margin:24px 0 0;border-radius:32px;height:360px}
 .lesson-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start}
 .page-h{padding-top:48px}
 .page-h h1{font-size:44px}
 .mtiles{grid-template-columns:repeat(4,1fr)}
 .sticky-cta{left:260px}
 .sheet{bottom:50%;border-radius:32px;transform:translate(-50%,calc(50% + 100vh));max-height:88vh}
 .sheet.open{transform:translate(-50%,50%)}
 .piano-wrap{margin:16px 0 0}
 .qhead .cif{font-size:64px}
 .tarea-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
 .tarea-grid .card{margin:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.choice .ag{width:auto;height:26px;display:block}
.live-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.live-row .empty-staff{margin:0;text-align:left;font-weight:600;color:var(--ink2)}
.mini{display:flex;gap:8px}
.icon-btn.sm{width:36px;height:36px}.icon-btn.sm svg{width:16px;height:16px}
.icon-btn[disabled]{opacity:.35;pointer-events:none}
@media (max-width:959px){.qhead .band{height:56px;padding:12px 20px}.qhead .cif{font-size:46px}}
.bigcif .pos-pill{display:inline-flex}
@media (min-width:960px){.sticky-cta{position:sticky;left:auto;right:auto;bottom:24px;padding:0;background:none;margin-top:24px}#app.full{padding-bottom:48px}}
.aci{height:1.05em;width:auto;aspect-ratio:var(--ar,.3);display:inline-block;vertical-align:-.1em;overflow:visible;margin:0 .01em}
.cif .aci,.choice.cif .aci,.bigcif .aci,.chord-card .hd .aci,.mist b .aci{height:.8em;vertical-align:.12em;margin-left:.03em}
/* ===== v3: temas del examen ===== */
:root{--r3:#7A5C4A}
.wk.r3{color:var(--ink);background:linear-gradient(180deg,#E3D3C7,#F2E9E2 70%,#DCCABD)}.bk.r3{background:linear-gradient(180deg,#7A5C4A,#5A4132)}.dot.r3{background:var(--r3)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{position:relative;min-height:188px;border-radius:22px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;box-shadow:var(--sh1);overflow:hidden}
.mcard .in{position:relative;z-index:2}
.mcard small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,248,241,.78);margin-bottom:4px}
.mcard h3{font-family:var(--fd);font-weight:500;font-size:19px;line-height:1.1;margin:0;color:#fff;letter-spacing:-.01em}

 note(m,at,dur,useS){if(useS)AU.smp.triggerAttackRelease(Tone.Frequency(m,'midi').toNote(),dur,at);else AU.synth(m,at,dur+.6);},
 tick(at,hi){const c=AU.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=hi?1760:1320;o.connect(g).connect(AU.out);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.12,at+.004);g.gain.exponentialRampToValueAtTime(.0008,at+.07);o.start(at);o.stop(at+.09);},
 droneOn(m){this.droneOff();const c=AU.ctx;if(!c)return;const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=620;lp.Q.value=.4;lp.connect(g).connect(AU.out);
  const os=[[m-12,'sawtooth',.5],[m-12,'sine',.9],[m-5,'sine',.35],[m-12+.08,'sawtooth',.3]].map(([mm,tp,v])=>{const o=c.createOscillator();o.type=tp;o.frequency.value=440*Math.pow(2,(mm-69)/12);const og=c.createGain();og.gain.value=v;o.connect(og).connect(lp);o.start();return o;});
  g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(.055,c.currentTime+.8);this.dr={g,os};},
 droneOff(){const d=this.dr;if(!d||!AU.ctx)return;const c=AU.ctx;d.g.gain.cancelScheduledValues(c.currentTime);d.g.gain.setValueAtTime(d.g.gain.value,c.currentTime);d.g.gain.linearRampToValueAtTime(0,c.currentTime+.4);d.os.forEach(o=>o.stop(c.currentTime+.5));this.dr=null;},
 stop(){this.timers.forEach(clearTimeout);this.timers=[];this.droneOff();try{if(AU.smp&&AU.smp.releaseAll)AU.smp.releaseAll();}catch(e){}PLAY=null;document.querySelectorAll('.en-on').forEach(e=>e.classList.remove('en-on'));document.querySelectorAll('[data-ent="stop"]').forEach(b=>{b.dataset.ent=b.dataset.was||'';b.innerHTML=b.dataset.lbl||b.innerHTML;});},

function soundOk(){if(typeof S!=='undefined'&&!S.sound){toast('El sonido está apagado · actívalo en Ajustes');return false;}AU.init();return true;}
/* reproduce una secuencia: items[{m,beats?,i?}] ; opts {bpm,piano,drone,count,root,id,onStep,onEnd} */
function run(items,o){A.stop();if(!soundOk())return;const beat=60/(o.bpm||E.bpm);const {useS,t}=A.now();const base=t+.12;let b=0;PLAY=o.id||'x';
 const t0=performance.now()+120;
 if(o.drone&&o.root!=null)A.droneOn(o.root);
 if(o.lead){A.note(o.root,base,beat*1.8,useS);if(o.onStep)A.at(0,()=>o.onStep(-1,'tónica'));b+=2;}
 if(o.count){for(let c=0;c<o.count;c++){A.tick(base+(b+c)*beat,c===0);const cc=o.count-c;A.at((b+c)*beat*1000,()=>o.onStep&&o.onStep(-2,cc));}b+=o.count;}
 items.forEach((it,j)=>{const at=base+b*beat;if(o.piano!==false)A.note(it.m,at,beat*.95*(it.beats||1),useS);A.at((b*beat)*1000,()=>{mark(o.id,it.i??j);o.onStep&&o.onStep(j,it);});b+=it.beats||1;});
 A.at(b*beat*1000+300,()=>{mark(o.id,-1);if(!o.keepDrone)A.droneOff();PLAY=null;o.onEnd&&o.onEnd();});}

/* ---------- Pentagrama de escala ---------- */
function scaleStaff(items,o={}){const id=o.id||'s';const n=items.length;const sp=o.sp||(n>9?38:n>8?30:40);const CL=46;
 const turn=items.findIndex(x=>x.dir==='dn');const bars=o.split&&turn>0?[turn]:[];
 const W=CL+n*sp+bars.length*14+12;const H=BOT+(o.labels?62:30);
 const Y0=16;let s=`<svg class="staff en-staff" viewBox="0 ${Y0} ${W} ${H-Y0}" style="min-width:${n>9?Math.round(W*0.82):0}px" role="img" aria-label="pentagrama">`;
 for(let i=0;i<5;i++){const y=BOT-i*SP;s+=`<line x1="2" x2="${W-2}" y1="${y}" y2="${y}" stroke="${INK}" stroke-width="1" opacity=".42"/>`;}
 s+=`<line x1="2" x2="2" y1="${TOPL}" y2="${BOT}" stroke="${INK}" stroke-width="1.2" opacity=".6"/><line x1="${W-5}" x2="${W-5}" y1="${TOPL}" y2="${BOT}" stroke="${INK}" stroke-width="1" opacity=".6"/><line x1="${W-2}" x2="${W-2}" y1="${TOPL}" y2="${BOT}" stroke="${INK}" stroke-width="3" opacity=".7"/>`;
 s+=gl('gClef',8,BOT-SP,INK);
 let meas={},prev={},x=CL+sp/2;
 items.forEach((it,j)=>{if(bars.includes(j)){const bx=x-sp/2+4;s+=`<line x1="${bx}" x2="${bx}" y1="${TOPL}" y2="${BOT}" stroke="${INK}" stroke-width="1" opacity=".45"/>`;x+=14;prev=meas;meas={};}
  const n=it.n,st=stp(n),y=yOf(st),k=n.l+'_'+n.o;const col=it.alt?'var(--rose)':it.back?'var(--blue)':INK;
  let showA=null;if(k in meas){if(meas[k]!==n.a)showA=n.a;}else if(n.a!==0)showA=n.a;else if(o.courtesy&&prev[k]!=null&&prev[k]!==0)showA=0;
  meas[k]=n.a;
  let g=`<g class="en-n" data-i="${o.base!=null?o.base+j:j}" data-ent="pn" data-m="${midi(n)}" style="color:${col}"><rect x="${x-sp/2+2}" y="${Y0+2}" width="${sp-4}" height="${H-Y0-4}" rx="9" class="en-hl"/>`;
  const lx1=x-HW/2-4,lx2=x+HW/2+4;
  for(let ls=28;ls>=st;ls-=2)g+=`<line x1="${lx1}" x2="${lx2}" y1="${yOf(ls)}" y2="${yOf(ls)}" stroke="${INK}" stroke-width="1.5"/>`;
  for(let ls=40;ls<=st;ls+=2)g+=`<line x1="${lx1}" x2="${lx2}" y1="${yOf(ls)}" y2="${yOf(ls)}" stroke="${INK}" stroke-width="1.5"/>`;
  if(showA!=null){const [gk,w]=AGL[showA];g+=gl(gk,x-HW/2-3-w*SC,y,'currentColor');}
  g+=gl('whole',x-HW/2,y,'currentColor');
  if(o.labels){const lab=o.labels(it,j);g+=`<text x="${x}" y="${BOT+34}" text-anchor="middle" font-family="DM Sans,system-ui,sans-serif" font-size="${n>8?11:12.5}" font-weight="600" fill="currentColor">${lab[0]}</text>`;
   if(lab[1])g+=`<text x="${x}" y="${BOT+50}" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-style="italic" font-size="${n>8?10:11.5}" fill="#A0907F">${lab[1]}</text>`;}
  s+=g+'</g>';x+=sp;});
 return `<div class="en-staffwrap" data-seq="${id}">${s}</svg></div>`;}
const labFixed=it=>[nm(it.n),it.syl?it.syl:(it.deg!=null?ROM[it.deg]:'')];

   refs:['Himno Nacional Mexicano: “Me-xi-ca-nos” = Do–Mi–Sol','“Santo, Santo, Santo” (tono Nicea): Do Do–Mi Mi–Sol Sol'],col:'var(--gold)'},
 m:{t:'Menor',f:'3m + 3M',iv:[3,7],ex:'Do · Mi♭ · Sol',c:'melancólica, íntima',
   refs:['“Oh ven, oh ven, Emanuel”: las primeras notas suben por la tríada menor (Mi–Sol–Si en Mi menor)'],col:'var(--blue)'},
 aum:{t:'Aumentada',f:'3M + 3M',iv:[4,8],ex:'Do · Mi · Sol♯',c:'flotante, de sueño o suspenso; “no se queda quieta”',
   refs:['Truco: es una mayor con la 5ª estirada medio tono. Suena como si pidiera seguir subiendo.'],col:'var(--rose)'},
 dism:{t:'Disminuida',f:'3m + 3m',iv:[3,6],ex:'Do · Mi♭ · Sol♭',c:'tensa, apretada, de alarma',

function playTri(ms,mode){if(!soundOk())return;A.stop();const {useS,t}=A.now();const b=t+.08;
 if(mode!=='block')ms.forEach((m,i)=>A.note(m,b+i*.5,.9,useS));if(mode!=='arp'){const o=mode==='both'?ms.length*.5+.3:0;ms.forEach(m=>A.note(m,b+o,1.8,useS));}}
function vTri(){const st=E.ear;
 return `<div class="view en">${back()}<div class="page-h" style="padding-top:8px"><h1>Tríadas <em>de oído</em></h1><p>Cuatro colores. Escúchalas, ponles una canción en la cabeza y luego adivina.</p></div>
 <div class="en-tri">${Object.entries(TRI).map(([k,x])=>`<div class="card tight en-tc" style="--c:${x.col}"><div class="card-h" style="margin-bottom:6px"><h3>${x.t}</h3><button class="icon-btn sm" data-ent="triPlay" data-k="${k}" aria-label="Oír">${ic('play',2)}</button></div>
  <div class="en-f">${x.f}<span>${x.ex}</span></div><p class="en-c">Suena ${x.c}.</p><ul>${x.refs.map(r=>`<li>${r}</li>`).join('')}</ul></div>`).join('')}</div>
 <div class="card"><div class="card-h"><h3>¿Qué tríada suena?</h3><span class="stat-chip" style="color:var(--rose-d)">${ic('flame',2)}<span style="color:var(--ink)">${st.streak}</span></span></div>
 ${EAR?`<div class="btn-row"><button class="btn pri sm" data-ent="earPlay" data-k="both">${ic('play',2)} Oír</button><button class="btn soft sm" data-ent="earPlay" data-k="arp">Arpegio</button><button class="btn soft sm" data-ent="earPlay" data-k="block">Junta</button></div>

  ${EAR.ans?`<div class="answer ${EAR.ans===EAR.k?'ok':'bad'}"><b>${EAR.ans===EAR.k?'¡Exacto!':'Era '+TRI[EAR.k].t.toLowerCase()+'.'}</b> ${TRI[EAR.k].f}: suena ${TRI[EAR.k].c}. ${EAR.ans!==EAR.k?`La ${TRI[EAR.ans].t.toLowerCase()} es ${TRI[EAR.ans].f}; compáralas abajo.`:''}</div>
   ${EAR.ans!==EAR.k?`<div class="btn-row" style="margin-top:12px"><button class="btn soft sm" data-ent="earCmp" data-k="${EAR.k}">Oír ${TRI[EAR.k].t.toLowerCase()}</button><button class="btn soft sm" data-ent="earCmp" data-k="${EAR.ans}">Oír ${TRI[EAR.ans].t.toLowerCase()}</button></div>`:''}

 :`<p class="en-sub">Suena una tríada desde una nota al azar. Puedes oírla en arpegio o junta las veces que quieras.</p><button class="btn pri block" data-ent="earNew">Empezar ${ic('arrow',2)}</button>`}</div>

function vTabla(){const mk=k=>seq(k).filter(x=>x.dir==='up').map(x=>`<span class="${x.alt?'alt':''}">${nm(x.n)}</span>`).join('');

 return `<div class="view en">${back()}<div class="page-h" style="padding-top:8px"><h1>Acordeón de <em>menores</em></h1><p>Las cuatro en La menor. En rosa, lo que cambia respecto a la natural.</p></div>
 ${R.map(([k,alt,pat,baj])=>`<div class="card tight en-cmp"><div class="card-h" style="margin-bottom:8px"><h3>${SCL[k].t}</h3><button class="icon-btn sm" data-ent="playScale" data-k="${k}" data-id="tb" aria-label="Oír">${ic('play',2)}</button></div>

  <div><b>Tradicional vs jazz</b>La tradicional sube melódica y baja natural. La jazz sube y baja igual.</div>
  <div><b>Melódica jazz = mayor con 3ª menor</b>La Si <span class="alt-t">Do</span> Re Mi Fa♯ Sol♯ La: respecto a La mayor sólo cambia el 3er grado.</div>
  <div><b>Armónica</b>Sólo el 7º sube. El salto de 1½ tono (Fa–Sol♯) es su sello.</div>
  <div><b>Cromática</b>Sube con ♯ (Di Ri Fi Si Li), baja con ♭ (Te Le Se Me Ra). El 7º se canta Ti.</div></div></div>
 <div class="card"><div class="card-h"><h3>Nomenclatura de los grados</h3></div><table class="en-tab"><tbody>
  ${[['I','Tónica'],['II','Supertónica'],['III','Mediante'],['IV','Subdominante'],['V','Dominante'],['VI','Superdominante (o submediante)'],['VII','Sensible si está a ½ tono de la tónica · Subtónica si está a 1 tono']].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div></div>`;}

/* --- Tips --- */
function vTips(){const T=[['Respira antes de empezar','Inhala por la nariz, llenando la cintura y las costillas, no los hombros. Suelta el aire poco a poco: una escala completa (sube y baja) cabe en una o dos respiraciones a tempo lento.','wave'],
 ['Fija la tónica','Cuando te den la nota, cántala por dentro antes de empezar. Si te pierdes a la mitad, regresa mentalmente a la tónica y cuenta grados desde ahí.','fork'],
 ['Piensa en grados, no en teclas','Cada nota es un número con nombre: 3º mediante, 5º dominante, 7º sensible. Cantar “la sensible” te recuerda que va pegadita a la tónica.','music'],
 ['Cuida los medios tonos','En la mayor, 3–4 y 7–8 son cortitos. Lo más común es abrir de más los medios tonos y quedarse corta en los tonos: piensa los medios tonos muy pegaditos y los tonos bien abiertos.','target'],
 ['La sensible sube','El 7º elevado (Sol♯ en La menor) quiere resolver a la tónica: apúntalo un poquito alto, nunca calado.','arrow'],
 ['Menor melódica: cambia al bajar','Al llegar arriba, “apaga” mentalmente los sostenidos: bajas Sol♮ y Fa♮. En la jazz no los apagas.','eye'],
 ['Cromática: no corras','Medios tonos parejos. Apóyate en las notas de la escala mayor (Do, Re, Mi, Fa, Sol, La, Ti) como “escalones”; las cromáticas van en medio.','grid'],
 ['Lectura: lee antes de cantar','Mira la armadura, la clave, el compás y la primera nota. Busca los saltos y las alteraciones antes de que empiece el ejercicio.','book'],
 ['Graba y escúchate','Grabarte en el celular y compararte con el piano de esta app es la forma más rápida de oír si te vas calando.','mic']];
 return `<div class="view en"><div class="ph cover ov-cafe">${ph('ent-latte-teclas')}<div class="top"><a class="glass-btn" href="#ent" aria-label="Volver">${ic('left',2)}</a></div><div class="in"><span class="eyebrow" style="color:rgba(255,255,255,.8)">Entonación</span><h1>Tips para el <em>examen</em></h1><p>Cosas pequeñas que hacen que todo suene afinado.</p></div></div>
 <div class="lesson-body">${T.map(([t,d,i],k)=>`<div class="card tight en-tip"><span class="n">${String(k+1).padStart(2,'0')}</span><div><h3>${t}</h3><p>${d}</p></div><span class="ic">${ic(i,1.8)}</span></div>`).join('')}</div></div>`;}

function view(h){const p=h.split('/');if(p[1]==='escala')return vScale(p[2]);if(p[1]==='canta')return vCanta();if(p[1]==='examen')return vExam();if(p[1]==='triadas')return vTri();if(p[1]==='tabla')return vTabla();if(p[1]==='tips')return vTips();return vHub();}
const full=h=>h.startsWith('ent/');
function refresh(){if(typeof rerenderKeep==='function')rerenderKeep();}
const ACTS={
 pn:d=>{if(!soundOk())return;const {useS,t}=A.now();A.note(+d.m,t+.03,1.1,useS);},
 bpm:d=>{E.bpm=+d.k;persist();A.stop();refresh();},
 playScale:(d,el)=>{const id=d.id||'sc';const it=seq(d.k);const b=el;run(it.map((x,i)=>({m:midi(x.n),i})),{id,bpm:E.bpm,onEnd:()=>{if(location.hash.startsWith('#ent'))swapBtn(b,false);}});swapBtn(b,true);},

 simPlay:(d,el)=>{const it=seq(SIM.key,SIM.t);run(it.map((x,i)=>({m:midi(x.n),i})),{id:'sim',bpm:E.bpm,drone:false,root:midi(SIM.t),onEnd:()=>swapBtn(el,false)});swapBtn(el,true);},
 simRate:d=>{const ok=d.k==='1';const st=E.sim;st.n++;if(ok){st.ok++;st.streak++;st.best=Math.max(st.best,st.streak);}else st.streak=0;
   st.hist.push({k:SIM.key,n:nm(SIM.t),ok});st.hist=st.hist.slice(-30);SIM.done=true;persist();if(ok&&typeof confetti==='function')confetti(60);refresh();},
 inc:d=>{const i=E.inc.indexOf(d.k);if(i>=0){if(E.inc.length>1)E.inc.splice(i,1);}else E.inc.push(d.k);persist();refresh();},
 triPlay:d=>{const r=60;playTri([r,...TRI[d.k].iv.map(x=>r+x)],'both');},
 earNew:()=>{newEar();refresh();setTimeout(()=>earPlay('both'),200);},earPlay:d=>earPlay(d.k),
 earAns:d=>{if(!EAR||EAR.ans)return;EAR.ans=d.k;const ok=d.k===EAR.k;const st=E.ear;st.n++;if(ok){st.ok++;st.streak++;st.best=Math.max(st.best,st.streak);if(typeof confetti==='function')confetti(50);}else st.streak=0;persist();refresh();},
 earCmp:d=>{playTri([EAR.r,...TRI[d.k].iv.map(x=>EAR.r+x)],'both');}
};

function chordSVG(notes,cx,anim){if(!notes.length)return '';
  const arr=notes.map((x,i)=>({...x,st:T.step(x.n)})).sort((a,b)=>a.st-b.st);
  const cols=[];arr.forEach(x=>{let c=0;while((cols[c]||[]).some(s=>Math.abs(s-x.st)<=1))c++;(cols[c]=cols[c]||[]).push(x.st);x.col=c;});
  const gap=arr.some(x=>x.ring)&&cols.length>1?HW+3:HW-1;const nc=cols.length,x0=cx-(gap*(nc-1)+HW)/2;let s='';
  const minSt=arr[0].st,maxSt=arr[arr.length-1].st;const lx1=x0-5,lx2=x0+gap*(nc-1)+HW+5;
  for(let st=28;st>=minSt;st-=2)s+=`<line x1="${lx1}" x2="${lx2}" y1="${yOf(st)}" y2="${yOf(st)}" stroke="${INK}" stroke-width="1.6"/>`;
  for(let st=40;st<=maxSt;st+=2)s+=`<line x1="${lx1}" x2="${lx2}" y1="${yOf(st)}" y2="${yOf(st)}" stroke="${INK}" stroke-width="1.6"/>`;
  const acols=[];[...arr].reverse().forEach(x=>{if(x.n.a==null||(!x.n.a&&!x.nat))return;let c=0;while((acols[c]||[]).some(s=>Math.abs(s-x.st)<6))c++;(acols[c]=acols[c]||[]).push(x.st);x.ac=c;});

    if(x.ac!=null){const [g,w]=AGL[x.n.a];const ax=x0-3-acW(x.ac)-w*SC;s+=gl(g,ax,y,col,'nh',dl);}

  const hasL=slots.some(x=>x.label),hasS=slots.some(x=>x.sub);const lowSt=Math.min(30,...slots.flatMap(x=>x.notes.map(z=>T.step(z.n))));const EX=lowSt<27?(27-lowSt)*5+4:0;const H=BOT+EX+(hasS?66:hasL?50:34);

function pool(src){if(src==='tarea')return [...T.TAREA.map(T.parseChord),...T.SLASH.map(T.parseChord)];

function vProg(){const a=acc();
 const bars=(obj,keys,lab)=>keys.map(k=>{const s=obj[k]||{t:0,r:0};const p=s.t?Math.round(100*s.r/s.t):0;return `<div class="hbar"><span>${lab(k)}</span><div class="pbar"><i style="width:${p}%"></i></div><em>${s.t?p+'%':'—'}</em></div>`;}).join('');
 return `<div class="view"><div class="page-h"><span class="eyebrow">Progreso</span><h1>Tu <em>avance</em></h1><p>Todo se guarda en este teléfono, sin cuentas ni contraseñas.</p></div>

 <div><div class="card"><div class="card-h"><h3>Errores por repasar</h3><span class="badge" style="${S.mistakes.length?'':'background:var(--bg2);color:var(--ink3)'}">${S.mistakes.length}</span></div>
 ${S.mistakes.length?S.mistakes.slice().reverse().slice(0,30).map(m=>`<div class="mist"><b>${H(pretty(qLabel(m)))}</b><span><span class="tag-s ${({build:'tg-rose',id:'tg-blue',spell:'tg-gold'})[m.mode]}">${MODES[m.mode].t}</span> ${T.POSS[m.pos]}${m.n>1?' · '+m.n+'×':''}</span></div>`).join('')+`<button class="btn rose block" style="margin-top:16px" data-start="mix|errores">${I('heal',2)} Repasar errores</button>`:'<p class="prose" style="margin:0">Nada pendiente. Cuando te equivoques, el acorde se guarda aquí para repasarlo.</p>'}</div>

function vQuiz(){if(!Q)return vPrac();const q=Q.qs[Q.i];const pct=Math.round(100*Q.i/Q.qs.length);
 const top=`<div class="qbar"><button class="icon-btn" data-act="quit" aria-label="Salir">${I('x',2)}</button><div class="pbar"><i style="width:${pct}%"></i></div><span class="stat-chip" style="color:var(--rose-d);height:32px">${I('flame',2)}<span style="color:var(--ink)">${S.streak}</span></span><span class="cnt">${Q.i+1}/${Q.qs.length}</span></div>`;
 return `<div class="view" id="qv">${top}${q.mode==='build'?qBuild(q):q.mode==='id'?qId(q):qSpell(q)}</div>`;}
function band(mode){const m=MODES[mode];return `<div class="ph band ${m.ov}">${ph(m.img)}<div class="in">${I(m.ic,2)} ${m.t}</div></div>`;}
function promptCard(q){const lab=qLabel(q);const v=T.voicing(q.root,q.type,q.pos);
 return `<div class="qhead">${band(q.mode)}<div class="body"><div class="k">${q.mode==='build'?'Construye en el piano, de abajo hacia arriba':'Escribe las notas, de abajo hacia arriba'}</div><div class="cif">${H(pretty(lab))}</div>
 ${q.slash?`<span class="pos-pill q">¿Qué posición es?</span><div class="hint">Pista: el bajo es ${nm(v.notes[0])}</div>`:`<span class="pos-pill">${T.POSS[q.pos]}</span>`}</div></div>`;}
function qBuild(q){const sel=A.sel||[];const sorted=[...sel].sort((a,b)=>a-b);const sp=sorted.map(m=>({n:spellMidi(m,q),c:INK}));const mk={};sel.forEach(m=>mk[m]={c:'sel',t:''});
 return promptCard(q)+`<div class="card tight"><div class="staffbox">${staff([{notes:sp}],{sw:130,scale:1.15})}<div class="live-row"><span class="empty-staff">${sp.length?sp.map(x=>nm(x.n)).join(' · '):'Toca 3 teclas en el piano'}</span><span class="mini"><button class="icon-btn sm" data-act="clear" aria-label="Borrar" ${sel.length?'':'disabled'}>${I('refresh',2)}</button><button class="icon-btn sm" data-act="playsel" aria-label="Oír" ${sel.length?'':'disabled'}>${I('play')}</button></span></div></div>
 ${piano(mk,{blabels:1})}</div>
 <div class="sticky-cta"><button class="btn pri block" data-act="check" ${sel.length===3?'':'disabled'}>${sel.length===3?'Comprobar':'Elige '+(3-sel.length)+' nota'+(3-sel.length===1?'':'s')+' más'}</button></div>`;}
function idOptions(q){const ok=cif(q.root,q.type);const out=[{root:q.root,type:q.type}];const seen=new Set([ok]);
 const add=(r,t)=>{if(!r||out.length>=4)return;if(T.maxAcc(r,t)>2)return;const k=cif(r,t);if(seen.has(k))return;seen.add(k);out.push({root:{l:r.l,a:r.a},type:t});};
 for(const r of T.ALLROOTS)if(T.pc({...r,o:4})===T.pc({...q.root,o:4})&&r.l!==q.root.l){add(r,q.type);break;}
 const v=T.voicing(q.root,q.type,q.pos);if(q.pos!=='fund'&&q.pos!=='abierta'){const b=v.notes[0];add({l:b.l,a:b.a},q.type);}
 add(q.root,rnd(Object.keys(T.TYPES).filter(t=>t!==q.type)));
 let g=0;while(out.length<4&&g++<50)add(rnd(T.ALLROOTS),rnd(Object.keys(T.TYPES)));
 return shuffle(out);}
function qId(q){if(!A.opts)A.opts=idOptions(q);const v=T.voicing(q.root,q.type,q.pos);
 return `<div class="qhead">${band('id')}<div class="body"><div class="k" style="margin-bottom:16px">¿Qué acorde es y en qué posición?</div>
 <div class="staffbox">${staff([{notes:v.notes.map(n=>({n}))}],{anim:!A.seen,sw:130,scale:1.3})}</div><button class="btn soft sm" style="margin-top:16px" data-act="playq">${I('vol',2)} Escuchar</button></div></div>
 <div class="card tight"><div class="field-l">Cifrado</div><div class="grid2">${A.opts.map((o,k)=>`<button class="choice cif ${A.c===k?'on':''}" data-act="idc" data-k="${k}">${H(pretty(cif(o.root,o.type)))}</button>`).join('')}</div>
 <div class="field-l">Posición</div><div class="grid2">${POSK.map(k=>`<button class="choice ${A.p===k?'on':''}" data-act="idp" data-k="${k}">${T.POSS[k]}</button>`).join('')}</div></div>
 <div class="sticky-cta"><button class="btn pri block" data-act="check" ${A.c!=null&&A.p?'':'disabled'}>Comprobar</button></div>`;}
function qSpell(q){const sl=A.slots||(A.slots=[null,null,null]);if(A.act==null)A.act=0;const names=S.sys==='let'?T.LET:T.SOL;const filled=sl.filter(Boolean);const cur=sl[A.last??A.act];
 return promptCard(q)+`<div class="card tight"><div class="slots">${sl.map((n,i)=>`<div class="nslot ${A.act===i?'act':''}" data-act="slot" data-k="${i}"><small>${['bajo','medio','arriba'][i]}</small><b>${n?nm(n):''}</b></div>`).join('')}</div>
 <div class="staffbox" style="margin-top:12px">${staff([{notes:stackUp(filled).map(n=>({n,c:INK}))}],{sw:130,scale:1.3})}</div>
 <div class="field-l">Letra</div><div class="grid7">${names.map((x,l)=>`<button class="choice sm" data-act="spL" data-k="${l}">${x}</button>`).join('')}</div>
 <div class="field-l">Alteración</div><div class="grid5">${[-2,-1,0,1,2].map(a=>`<button class="choice acc ${cur&&cur.a===a?'on':''}" data-act="spA" data-k="${a}" title="${T.ACCW[a]}" aria-label="${T.ACCW[a]}">${accSVG(a)}</button>`).join('')}</div></div>
 <div class="sticky-cta"><button class="btn pri block" data-act="check" ${filled.length===3?'':'disabled'}>Comprobar</button></div>`;}
/* --- Comprobación --- */
function evaluate(q){const v=T.voicing(q.root,q.type,q.pos);const rl=T.roles(q.type);const lab=pretty(qLabel(q));
 const R={ok:false,msgs:[],yours:[],correct:v.notes.map(n=>({n,c:OK})),yourM:[],corrM:v.notes.map(T.midi),yourN:[]};
 if(q.mode==='build'){const s=[...A.sel].sort((a,b)=>a-b);const pcs=s.map(m=>m%12),exp=v.notes.map(T.pc);const set=new Set(exp);
   const bad=pcs.map((p,i)=>p!==exp[i]);let spanBad=false;if(!bad.some(Boolean)&&q.pos!=='abierta'&&s[2]-s[0]>=12){spanBad=true;bad[2]=true;}
   if(!bad.some(Boolean)&&q.pos==='abierta'&&s[2]-s[0]<12){bad[2]=true;spanBad=true;}
   R.ok=!bad.some(Boolean);R.yourM=s;R.yours=s.map((m,i)=>({n:spellMidi(m,q),c:bad[i]?BAD:INK,ring:bad[i]}));R.yourN=R.yours.map(x=>x.n);
   if(!R.ok){const allIn=pcs.every(p=>set.has(p))&&new Set(pcs).size===3;
     if(spanBad&&q.pos!=='abierta')R.msgs.push(`Tienes las notas y el orden bien, pero quedaron separadas más de una octava. En <b>${T.POSS[q.pos]}</b> van lo más juntas posible.`);
     else if(spanBad)R.msgs.push(`Tienes las notas bien, pero en <b>abierta</b> la nota de en medio sube una octava: deben abarcar más de una octava.`);
     else if(allIn)R.msgs.push(`Las 3 notas sí son de ${lab}. Solo el <b>orden</b> no: en ${T.POSS[q.pos]} el bajo debe ser la <b>${rl[v.roles[0]]}</b> (${nm(v.notes[0])}).`);
     else s.forEach((m,i)=>{if(!bad[i])return;const n=spellMidi(m,q);if(!set.has(m%12))R.msgs.push(`<b>${nm(n)}</b> no es parte de ${lab}. Sus notas son ${T.tones(q.root,q.type).map(nm).join(', ')}.`);else R.msgs.push(`<b>${nm(n)}</b> sí es del acorde, pero ahí (${['abajo','en medio','arriba'][i]}) va <b>${nm(v.notes[i])}</b>.`);});
     if(q.pos==='abierta'&&!spanBad&&!allIn)R.msgs.push('Recuerda: abierta = fund – 5ª – 3ª (la de en medio sube una octava).');}}
 else if(q.mode==='spell'){const sl=A.slots;const yours=stackUp(sl);R.yourM=yours.map(T.midi);R.yourN=yours;
   const bad=sl.map((n,i)=>!T.same(n,v.notes[i]));R.ok=!bad.some(Boolean);R.yours=yours.map((n,i)=>({n,c:bad[i]?BAD:INK,ring:bad[i]}));
   const LN=c=>S.sys==='let'?T.LET[c.l]:T.SOL[c.l];
   sl.forEach((n,i)=>{if(!bad[i])return;const c=v.notes[i];const pos=['El bajo','La de en medio','La de arriba'][i];
     if(T.pc(n)===T.pc(c))R.msgs.push(`${pos}: <b>${nm(n)}</b> suena igual que <b>${nm(c)}</b>, pero se escribe ${nm(c)}: la letra tiene que ser ${LN(c)} (letra sí, letra no).`);
     else if(n.l===c.l)R.msgs.push(`${pos}: la letra ${LN(c)} está bien, pero la alteración no: es <b>${nm(c)}</b>, no ${nm(n)}.`);
     else if(T.tones(q.root,q.type).some(t=>T.same(t,n)))R.msgs.push(`${pos}: <b>${nm(n)}</b> sí es de ${lab}, pero no va ahí; va <b>${nm(c)}</b> (la ${rl[v.roles[i]]}).`);
     else R.msgs.push(`${pos}: <b>${nm(n)}</b> no es de ${lab}; va <b>${nm(c)}</b> (la ${rl[v.roles[i]]}).`);});}
 else{const o=A.opts[A.c];const cOk=T.same(o.root,q.root)&&o.type===q.type,pOk=A.p===q.pos;R.ok=cOk&&pOk;
   const yv=T.voicing(o.root,o.type,A.p);R.yourM=yv.notes.map(T.midi);R.yourN=yv.notes;R.yours=yv.notes.map((n,i)=>{const b=!(T.same(n,v.notes[i])&&T.step(n)===T.step(v.notes[i]));return {n,c:b?BAD:INK,ring:b};});
   if(!cOk){const yt=T.tones(o.root,o.type).map(nm).join(' – ');R.msgs.push(`Elegiste <b>${pretty(cif(o.root,o.type))}</b>, que se escribe <b>${yt}</b>. Aquí las notas son <b>${T.tones(q.root,q.type).map(nm).join(' – ')}</b> → <b>${pretty(cif(q.root,q.type))}</b>.`);
     if(T.pc({...o.root,o:4})===T.pc({...q.root,o:4})&&o.type===q.type)R.msgs.push('Suenan igual, pero la ortografía manda: fíjate en las letras del pentagrama.');}
   if(!pOk)R.msgs.push(`Posición: elegiste <b>${T.POSS[A.p]}</b>, pero el bajo es <b>${nm(v.notes[0])}</b> = la ${rl[v.roles[0]]}${q.pos==='abierta'?' y las notas pasan de una octava':''} → <b>${T.POSS[q.pos]}</b>.`);}
 R.steps=q.mode==='id'?T.explainIdentify(q.root,q.type,q.pos,S.sys):T.explainBuild(q.root,q.type,q.pos,S.sys);
 if(q.slash)R.steps.push(`Por eso <b>${lab}</b> es ${T.POSS[q.pos]}: lo que va después de la “/” es el bajo.`);
 R.steps=R.steps.map(s=>s.replace(/Cerrada en fundamental/g,'Cerrada').replace(/cerrada \(fundamental\)/gi,'cerrada').replace(/1ª inversión/g,'1ª inv.').replace(/2ª inversión/g,'2ª inv.'));
 return R;}
function record(q,ok){const td=today();S.days[td]=(S.days[td]||0)+1;S.total++;
 const bt=S.byType[q.type]||(S.byType[q.type]={t:0,r:0});bt.t++;const bp=S.byPos[q.pos]||(S.byPos[q.pos]={t:0,r:0});bp.t++;
 const id=qid(q);const ix=S.mistakes.findIndex(m=>qid(m)===id);
 if(ok){S.right++;bt.r++;bp.r++;S.streak++;S.best=Math.max(S.best,S.streak);const pts=10+Math.min(S.streak,10);S.points+=pts;if(ix>=0)S.mistakes.splice(ix,1);Q.right++;save();return pts;}
 S.streak=0;if(ix>=0){S.mistakes[ix].n=(S.mistakes[ix].n||1)+1;}else S.mistakes.push({root:q.root,type:q.type,pos:q.pos,slash:q.slash,mode:q.mode,keepPos:true,n:1,ts:Date.now()});
 if(S.mistakes.length>80)S.mistakes.shift();save();return 0;}
function check(){const q=Q.qs[Q.i];const R=evaluate(q);const pts=record(q,R.ok);A.done=true;
 const lab=pretty(qLabel(q));const v=T.voicing(q.root,q.type,q.pos);const last=Q.i+1>=Q.qs.length;let h;
 if(R.ok){const praise=rnd(['¡Exacto!','¡Perfecto!','¡Muy bien!','¡Así se hace!']);
  h=`<div class="grab"></div><div class="fb-head ok"><div class="bub"><svg class="draw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><div><h3>${praise}</h3><p><span class="pts">+${pts}</span> &nbsp;racha de ${S.streak}</p></div></div>
  <div class="card tight" style="box-shadow:var(--sh1)"><div class="staffbox">${staff([{notes:roleNotes(v),label:pretty(fullCif(q)),sub:T.POSS[q.pos]}],{anim:true,sw:140,end:1,scale:1.3})}</div>${npills(v,q.type)}</div>
  <p class="prose" style="text-align:center;margin:0 0 8px">${lab} = <b>${T.tones(q.root,q.type).map(nm).join(' – ')}</b></p>`;}
 else{h=`<div class="grab"></div><div class="fb-head bad"><div class="bub">${I('heal',2)}</div><div><h3>Casi. Lo corregimos juntas</h3><p>Compara la tuya con la correcta y escúchalas</p></div></div>
  <div class="cmp"><div class="pane y"><div class="lab">${I('x',2.6)} La tuya</div>${staff([{notes:R.yours}],{anim:true,sw:96,scale:1.6})}<div class="nn">${R.yourN.map(nm).join(' · ')}</div><button class="play" data-act="pm1" data-m="${R.yourM.join(',')}">${I('play')} Oír</button></div>
  <div class="pane c"><div class="lab">${I('check',2.6)} Correcta</div>${staff([{notes:R.correct}],{anim:true,sw:96,scale:1.6})}<div class="nn">${v.notes.map(nm).join(' · ')}</div><button class="play" data-act="pm1" data-m="${R.corrM.join(',')}">${I('play')} Oír</button></div></div>
  <div class="why"><h4>${I('bulb',2).replace('<svg','<svg width="16" height="16"')} Qué pasó</h4><ul>${R.msgs.map(m=>`<li>${m}</li>`).join('')}</ul></div>
  <div class="how"><h4>Paso a paso, súper fácil</h4><ol class="steps">${R.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;}
 h+=`<button class="btn ${R.ok?'blue':'pri'} block" style="margin-top:20px" data-act="next">${last?'Ver resultado':R.ok?'Continuar':'Entendido, sigamos'} ${I('arrow',2)}</button>`;
 openSheet(h);
 if(R.ok){AU.play(R.corrM,'block');confetti(S.streak&&S.streak%5===0?140:60);if(S.streak&&S.streak%5===0)toast(`Racha de ${S.streak} seguidas`);}
 else{$('#qv .qhead')?.classList.add('shake');setTimeout(()=>AU.play(R.corrM,'both'),250);}}
function next(){closeSheet();Q.i++;A={};if(Q.i>=Q.qs.length){finish();return;}render();scrollTo({top:0,behavior:'smooth'});}
function finish(){const r=Q.right,n=Q.qs.length;const src=Q.src,mode=Q.mode;Q=null;location.hash='#prac';
 setTimeout(()=>{openSheet(`<div class="grab"></div><div class="res-c">${ring(r,n,{size:120,sw:10,fs:32,txt:r+'/'+n,sub:'correctas'})}<h3>${r===n?'¡Ronda perfecta!':r>=n*.7?'¡Muy bien, Eli!':'Vas creciendo'}</h3>
 <p>${S.points} puntos en total${S.mistakes.length?` · ${S.mistakes.length} errores guardados para repasar`:''}</p></div>
 <div class="btn-row" style="margin-top:24px">${S.mistakes.length?`<button class="btn soft" data-start="mix|errores">Repasar errores</button>`:''}<button class="btn pri" data-start="${mode}|${src==='errores'?'tarea':src}">Otra ronda</button></div><button class="btn ghost block" style="margin-top:8px" data-act="home">Ir al inicio</button>`);
 if(r>=n*.7)confetti(r===n?180:90);},60);}

function openSheet(h){const s=$('#sheet');s.innerHTML=h;decorate(s);s.scrollTop=0;s.classList.add('open');$('#scrim').classList.add('open');}

 mqslot:d=>{A2.act=+d.k;A2.last=null;rerenderKeep();},
 mqL:d=>{const i=A2.act??0;A2.slots[i]={l:+d.k,a:0,o:4};A2.last=i;const nx=A2.slots.findIndex((x,j)=>!x&&j>i);A2.act=nx>=0?nx:A2.slots.findIndex(x=>!x);if(A2.act<0)A2.act=i;rerenderKeep();AU.play([T.midi(A2.slots[i])],'block');},
 mqA:d=>{const i=A2.last??A2.act;if(!A2.slots[i]){toast('Primero elige la letra');return;}A2.slots[i].a=+d.k;rerenderKeep();AU.play([T.midi(A2.slots[i])],'block');},
 mqadd:d=>{(A2.seq=A2.seq||[]).push(d.k);if(A2.seq.length>16)A2.seq.pop();rerenderKeep();},mqundo:()=>{A2.seq.pop();rerenderKeep();},mqseqclear:()=>{A2.seq=[];rerenderKeep();},
 mqcell:d=>{A2.act=+d.k;rerenderKeep();},mqpal:d=>{A2.mv[A2.act]=d.k;const nx=A2.mv.findIndex(x=>!x);if(nx>=0)A2.act=nx;rerenderKeep();},
 mqcheck:()=>mqCheck(),mqnext:()=>mqNext(),mqquit:()=>{const m=Q2&&Q2.mod;Q2=null;A2={};closeSheet();location.hash=m&&MOD[m]?'#m/'+m:'#learn';},
 prog:d=>seqPlay(d.p.split('|').map(x=>x.split(',').map(Number))),
 scl:d=>{d.m.split(',').map(Number).forEach((m,i)=>setTimeout(()=>AU.play([m],'block'),i*380));}
