<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Himnario</title>
<style>
:root{--b:#1f3a5f;--a:#c8a24a}*{box-sizing:border-box}body{margin:0;font:19px/1.55 Georgia,serif;background:#faf7f0;color:#222}
header{background:var(--b);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}h1{margin:0 0 6px;font-size:1.4em;cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap}input,select,button{font-size:18px;padding:9px;border-radius:8px;border:1px solid #ccc}
#q{flex:1;min-width:180px}#jn{width:90px}button{background:var(--a);border:0;color:#222;font-weight:bold;cursor:pointer}
main{max-width:820px;margin:auto;padding:12px}.sec{background:#fff;border-left:6px solid var(--a);padding:12px;margin:8px 0;border-radius:8px;cursor:pointer;font-size:1.1em}
.sec small{color:#666;display:block}.it{display:flex;gap:10px;padding:11px 8px;border-bottom:1px solid #e4dccb;cursor:pointer;background:#fff}
.it:hover{background:#f3ecdc}.num{min-width:64px;font-weight:bold;color:var(--b)}.tag{font-size:.7em;background:#e8e0cc;border-radius:5px;padding:1px 5px;margin-right:4px}
.sn{font-size:.85em;color:#666}h2{color:var(--b)}.v{margin:14px 0}.v b{color:var(--b)}.c{margin:14px 0;padding:10px 14px;background:#fff6dc;border-left:5px solid var(--a);font-style:italic}
.nav{display:flex;justify-content:space-between;gap:8px;margin:18px 0}.nav button{flex:1}.cr{font-size:.8em;color:#666}mark{background:#ffe48a}
</style></head><body>

<main id="m"></main>
<script>
const D=[{"s":"Himnario infantil","n":"1","t":"A Dios debí el nacer","p":"15","c":"","l":[{"t":"v","n":"1","x":"A Dios que es bueno debí el nacer, él me dio padres para mi bien; me da alimento, templami sed, Buenos seamos que Dios nos ve."},{"t":"v","n":"2","x":"Dios hizo el cielo con su poder, hizo la tierra y el mar también; los astros todos brillan por él, Buenos seamos que Dios nos ve."},{"t":"v","n":"3","x":"Si el desvalido pide merced, si al triste aflige suerte muy cruel, ese que llora tu hermano es, Buenos seamos que Dios nos ve."},{"t":"v","n":"4","x":"No al malo envidies, aunque tal vez impune ostente gloria y poder, que allá en los cielos vive otro juez, Buenos seamos que Dios nos ve."}]},{"s":"Himnario infantil","n":"2","t":"Abre mis ojos","p":"15","c":"","l":[{"t":"v","n":"1","x":"Abre mis ojos para ver tu verdadero parecer; muestra a mi alma tu verdad que habrá de darme libertad. En el silencio espero en ti, tu vountad yo acataré, abre mis ojos para ver, Divino Dios. Letra y Música: Charles H. Scott, Tr. S. D. Athans"},{"t":"v","n":"2","x":"Abre mi oído para oír, tu voz viniendome a decir palabras de consolación que traigan paz al corazón. En el sielncio espero en ti, tu voluntad yo acataré, abre mi oído para oír, Divino Dios."},{"t":"v","n":"3","x":"Abre mi boca y hablaré, al mundo la verdad diré; abre mi altivo corazón y anunciaré tu salvación. En el silencio espero en ti, tu voluntad yo acataré, abre mi altivo corazón, Divino Dios."}]},{"s":"Himnario infantil","n":"3","t":"Yo ando con mi Rey","p":"16","c":"","l":[{"t":"v","n":"1","x":"¡Aleluya! yo ando con mi Rey, yo ando con mi Rey, yo ando con mi Rey. ¡Aleluya! yo ando con mi Rey, cada día yo ando con mi Rey. Los del mundo no me quieren porque ando con mi Rey, yo ando con mi Rey, yo ando con mi Rey, los del mundo no me quieren porque ando con mi Rey, cada día yo ando con mi Rey. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"4","t":"Allá en el Monte Horeb","p":"16–17","c":"","l":[{"t":"v","n":"1","x":"Allá en el monte Horeb, la zarza ardía, allá en el monte Horeb, la zarza ardía; Moisés quería saber por qué la zarza ardía, y no se consumía, quería saber; y oyó una voz del cielo que le decía, y oyó una voz del cielo que le decía: Quita, quita, quita las sandalias de tus pies porque el lugar que pisas santo es. Quita, quita, quita las sandalias de tus pies porque el lugar que pisas santo es. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"5","t":"Ama Cristo a niños","p":"17","c":"","l":[{"t":"v","n":"1","x":"Ama Cristo a niños como yo, yo, yo. Ama Cristo a niños como yo, yo, yo. Niños como yo, en brazos tomó. Ama Cristo a niños como yo, yo, yo. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Ama Cristo a niños como tú, tú, tú. Ama Cristo a niños como tú, tú, tú. Niños como tú, en brazos tomó. Ama Cristo a niños como tú y yo."}]},{"s":"Himnario infantil","n":"6","t":"Amigo tengo que me ama","p":"18","c":"","l":[{"t":"v","n":"1","x":"Amigo tengo que me ama, me ama, me ama; amigo tengo que me ama, su nombre es Jesús. me ama domingo, lunes también, martes y miercoles donde esté, jueves y viernes y sábado también, ¡Aleluya! al nombre de mi Salvador. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"7","t":"Aunque me llamen un Aleluya","p":"18–19","c":"","l":[{"t":"v","n":"1","x":"Aunque me llamen un aleluya, aunque me llamen un aleluya, aunque me llamen un aleluya, no vuelvo atrás, no, no, no vuelvo atrás, no vuelvo atrás, no, no, no vuelvo atrás. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Hoy dejo al mundo y sigo a Cristo, hoy dejo al mundo y sigo a Cristo, hoy dejo al mundo y sigo a Cristo, no vuelvo atrás, no, no, no vuelvo atrás, no vuelvo atrás, no, no, no vuelvo atrás."}]},{"s":"Himnario infantil","n":"8","t":"Aunque pequeño soy","p":"19","c":"","l":[{"t":"v","n":"1","x":"Aunquepequeño soy, y nomuygrande soy, y lo quetengo yo, a ti yo te lo doy. Te amaré con el co ra zón, te amaré con el corazon, te amaré con el corazón; aunque pequeño soy, te seguiré con fidelidad, te seguiré con fidelidad, te seguiré con fidelidad, aunque pequeño soy. Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro"}]},{"s":"Himnario infantil","n":"9","t":"Aunque soy pequeñuelo","p":"20","c":"","l":[{"t":"v","n":"1","x":"Aunque soy pequeñuelo, me mira el Santo Dios; él oye desde el cielo mi humilde y tierna voz. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Me ve de su alto Asiento, mi nombre sabe, sí, y cuánto pienso y siento conoce desde allí."},{"t":"v","n":"3","x":"Él mira acada instante lo que hago bien y mal, pues todo está delante de su ojo paternal."}]},{"s":"Himnario infantil","n":"10","t":"Avecita gentil","p":"20–21","c":"","l":[{"t":"v","n":"1","x":"Avecita que gentil cantas sin cesar, interpreta por favor este cantar. haz un eco resonar: \"Dios es amor\". Letra y Música: E. Euresti, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Canta hermosa, blanca flor, gala del pensil, tus hojitas al cimbrar ¿qué quieres decir?."},{"t":"v","n":"3","x":"Lucerito matinal de turquesa azul, que le dices al brillar ¿a quién ve tu luz?."},{"t":"v","n":"4","x":"Esta célica verdad se oye por doquier, y la brisa en el zarzal cantaba también."},{"t":"c","x":"Niño escucha esta verdad y en tu corazón"}]},{"s":"Himnario infantil","n":"11","t":"Brille la luna","p":"21","c":"Letra:    R. Havergal/Severa; Música: I. H. Meredith, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Brille la luna o el fúlgido sol, Dios a los niños los ve sin cesar, él se complace en constante velar sin fatigarse por siempre jamás. Letra: R. Havergal/Severa"},{"t":"v","n":"2","x":"Y de la densa tiniebla a través ve de sus hijos tranquilo el dormir, es el amante y benigno pastor que a sus ovejas conduce al redil. Música: I. H. Meredith, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"3","x":"Si es amoro so contigo el día de hoy, él es el mismo por la eternidad, y te guiará su inefable poder a las delicias del célico hogar."},{"t":"c","x":"Cuida de mí, cuida de mí, bajo su amparo me siento feliz."}]},{"s":"Himnario infantil","n":"12","t":"Caritas Risueñas","p":"22","c":"","l":[{"t":"v","n":"1","x":"Caritas risueñas, miradas de niños, almitas pequeñas, traemos a Cristo. Nuestras son risas mejores, nuestros jueguitos de niños, nuestras risas, nuestras flores, son para el Rey, son para el Rey. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez"}]},{"s":"Himnario infantil","n":"13","t":"Cristo ama a los niñitos","p":"22","c":"","l":[{"t":"v","n":"1","x":"Cristo ama a los niñitos de este mundo en derredor; al latino y al sajón, al de China y de Japón, todos ellos son preciosos al Señor. Letra y Música: George F. Root, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Cristo ama a los niñitos de este mundo en derredor; no le importa su color a Jesús el Salvador, todos ellos son preciosos al Señor."}]},{"s":"Himnario infantil","n":"14","t":"Cristo Bendito","p":"23","c":"","l":[{"t":"v","n":"1","x":"Cristo bendito yo pobre niño, por tu cariño me allego a ti; para rogarte humilde mente tengas clemente piedad de mí. Letra y Música: Desconocido, Fransico Javier Corona Vázquez."},{"t":"v","n":"2","x":"Quiero a tus plantas con alegría sentarme un día donde tú estás. ¡Oh! Cristo mío quiero buscarte, anhelo amarte cada vez más."}]},{"s":"Himnario infantil","n":"15","t":"Cristo el Rey de gloria","p":"23","c":"","l":[{"t":"v","n":"1","x":"Cristo elRey de gloria tanto me amó, que dejó su trono y en una cruz murió. Él ahí su sangre en rescate dio, Jesucristo el Rey de gloria vino y me salvó. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"16","t":"Cristo está en mi corazón","p":"24","c":"","l":[{"t":"v","n":"1","x":"Cristo está en mi corazón, Cristo está en mi corazón. Quedito llamó y la puerta le abrí. Cristo está en mi corazón."}]},{"s":"Himnario infantil","n":"17","t":"Cristo me ama","p":"24","c":"Letra:    Ana B. Warner; Música: William B. Bradbury, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Cristo me ama bien lo sé, pues la biblia dice así, desde el cielo él me vé y me dice: \"Ven a mí\". Letra: Ana B. Warner"},{"t":"v","n":"2","x":"Cristo me ama bien lo sé, su palabra dice así, que los niños son de aquel, quien es nuestro amigo fiel. Música: William B. Bradbury, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"3","x":"Cristo me ama pues murió y la gloria me abrió, mis pecados borrará, reconozco su bondad."},{"t":"v","n":"4","x":"Cristo me ama, es verdad, a mi lado siempre está, viene pronto ya por mí, y con él siempre he de estar."},{"t":"c","x":"Cristo me ama, Cristo me ama, Cristo me ama, la biblia dice así."}]},{"s":"Himnario infantil","n":"18","t":"Cristo rompe las cadenas","p":"25","c":"","l":[{"t":"v","n":"1","x":"Cristo rompe las cadenas, Cristo rompe las cadenas, Cristo rompe las cadenas, Cristo da seguridad. ¿Cómo es posibleque yo viva sin Jesús? si el fundamento de mi vida eres Tú, Tú me libraste del infierno y de la muerte, ¡Cómo es posible que yo viva sin Jesús?. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"19","t":"Cual lirio ha de ser","p":"25","c":"","l":[{"t":"v","n":"1","x":"Cual lirio ha de ser mi corazoncito Cual fresco rocío como un pajarito Tan blanco tan puro gozoso así Alabando a Dios por su amor paramí. Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrillo"}]},{"s":"Himnario infantil","n":"20","t":"Cuando leo en la Biblia","p":"26","c":"Letra:    Jemima T. Luke, Trad. Sebastián Cruellas; Música: Melodía tradicional griega, arr. W. B. Bradbury, 1859, y C. W. Douglas, 1918","l":[{"t":"v","n":"1","x":"Cuando leo en la Biblia cómo llama Jesús y bendice alos niños con amor, Yo también quisiera estar y con ellos descansar en los brazos del tierno Salvador. Letra: Jemima T. Luke, Trad. Sebastián Cruellas"},{"t":"v","n":"2","x":"Ver quisiera sus manos sobre mí reposar, cariñosos abrazos de Él sentir; Sus miradas disfrutar, las palabras escuchar: \"A los niños dejad a mí venir\". Música: Melodía tradicional griega, arr. W. B. Bradbury, 1859, y C. W. Douglas, 1918"},{"t":"v","n":"3","x":"Más aún a su estrado en oración puedo ir, y también de su amor participar; Pués si aquí buscarle sé, Le veré y le escucharé en el reino que Él fue a preparar."},{"t":"v","n":"4","x":"Todos los redimidos y salvados or Él, al Cordero celebran, inmortal; Cantan voces mil y mil en el coro infantil, pues es de ellos el reino celestial."},{"t":"v","n":"5","x":"Muchos hay que no saben, de esa bella mansión, y no quieren a Cristo recibir; Les quisiera yo mostrar que para ellos hay lugar en el cielo, do los convida ir."},{"t":"v","n":"6","x":"Yo ansío aquel tiempo, venturoso, sin fin, El más grande, el más lúcido, el mejor; Cuando de cualquier nación, Niños mil sin distinción a los brazos acudan al Señor."}]},{"s":"Himnario infantil","n":"21","t":"Cuando me acerco a Jesús","p":"27","c":"","l":[{"t":"v","n":"1","x":"Cuandome acerco aJesús soy feliz, yo quiero seguirsus caminosde amor,pues élmurióen lacruz para salvarme a mí. Yo soy feliz, pues él me amó, su vida dio para mi redención. Yo soy feliz, pues me salvó y en una cruz su sangre derramó. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"22","t":"De pie vamos ya a cantar","p":"27","c":"","l":[{"t":"v","n":"1","x":"De pie vamos ya a cantar, sentados la clase escuchar, el rostro inclinado, los brazos cruzados, así adorando al Señor. Letra y Música: Jhoan G. Nagell, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"23","t":"Del trono santo","p":"28","c":"Letra:    A. H. Sheperd; Música: H. E. Mathews, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Del trono Santo en derredor, niñitos mil están, que rescatados del Señor las gracias allí dan. Letra: A. H. Sheperd"},{"t":"v","n":"2","x":"Mas ¿cómo al mundo superior, aquel celeste hogar, en donde todo es paz y amor, pudieron ya llegar?. Música: H. E. Mathews, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"3","x":"Porque el Señor su sangre dio en precio de expiación, con ella los purífico, por grande compasión."},{"t":"v","n":"4","x":"Buscaron ellos a Jesús, su nombre amado aquí, y ahora ya en plena luz su rostro ven ahí."},{"t":"v","n":"5","x":"Ropaje blanco de esplendor, reviste cada cual, están ahí con el Señor en gozo eternal."},{"t":"c","x":"Y cantan ¡Gloria! ¡Gloria! ¡Aleluya al Santo Dios!."}]},{"s":"Himnario infantil","n":"24","t":"Dios donde quiera está","p":"28–29","c":"","l":[{"t":"v","n":"1","x":"Dios donde quiera está, Dios donde quiera está, Dios donde quiera está Aleluya a Je hová. Lo buscas en el cielo, lo buscas en la mar, lo buscas en los montes y allí lo encontrarás. rás. Letra y Música: Desconocido, Arm. Isaac García Contreras"}]},{"s":"Himnario infantil","n":"25","t":"Dios es amor","p":"29","c":"","l":[{"t":"v","n":"1","x":"Dios es amor, Dios es amor, la Biblia lo dice. Dios es amor, Dios es amor, Pablo lo repite. Dios es amor, Dios es amor, Juan también lo dice, en su capítulo cuatro, versículo ocho, primera de Juan, Amén. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"26","t":"Dios Padre","p":"30","c":"","l":[{"t":"v","n":"1","x":"Dios Padre es mi Padre, su hijo es mi Cristo, es mío, es mío su Espíritu también; yo tengo una patria muy linda allá en los cielos, donde cantan los santos y a Dios dicen amén. Cuán glorioso en comunión los santos, alabando al trino y Santo Dios, él nos colma de infinitas bondades pues él es nuestro todo, es nuestro sumo bién. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"27","t":"Dos manecitas","p":"30–31","c":"","l":[{"t":"v","n":"1","x":"Dos manecitas doy a Cristo, dos rojos labios suyos son, y dos oídos te buscamos, ¡oh Señor!, De la vida y del albor tuyo soy Señor. Letra y Música: Desconocido, Arm. Isaac García Contreras"},{"t":"v","n":"2","x":"Dos piecesitos que le siguen hasta los cielos donde está, con mis ojitos"},{"t":"c","x":"que le escuchan, para alabarle tengo voz. De la vida y del albor leo la biblia que habla del Padre Celestial."}]},{"s":"Himnario infantil","n":"28","t":"El canto de Jocabed","p":"31","c":"","l":[{"t":"v","n":"1","x":"Duerme entre juncos, ¡oh, niño!, bajo la bóveda azul, mueven propicias, propicias tu cuna ondas que dora la luz. Letra y Música: M. Coote Brown, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Dios desde el cielo te mira, mi corazón quieto está, pues que las ondas, las ondas tranquilas van la ribera a besar."},{"t":"v","n":"3","x":"Miriam de voces me llama, ¡vuelve a mi seno mi bien! Dios ha escuhado, escuchado mis ruegos, su grande amor cantaré."},{"t":"c","x":"Olas hermosas su sueño arrullad, ángeles puros su rostro velad."}]},{"s":"Himnario infantil","n":"29","t":"El niño Samuel","p":"32–33","c":"","l":[{"t":"v","n":"1","x":"Duerme junto al templo un tierno niño, que es ofrenda grata de piedad; niño que su madre ha consagrado al servicio de Jehová. Mística la lampara está ardiendo, quieta está la noche en derredor, óyese de pronto acento extraño, misteriosa y suave voz. Letra y Música: N. Cejudo, Arm. Francisco Javier Corona Vázquez y le dice \"Heme aquí\". \"Fue el Señor\" dijo Elí, si llamarte vuelve y dí: \"Habla presto Señor, que escuchando te yo estoy\"."},{"t":"v","n":"2","x":"Dios había escogido al niño puro, para que pudiera gobernar con toda justicia y todo acierto, aquel pueblo de Jehová. Hoy de nuevo llama el Padre amante, demos pues oído a su voz, diga todo niño: \"Señor habla, que escuchandote yo estoy."},{"t":"c","x":"¡Oh Samuel! ¡Oh Samuel! así dijo al niño fiel, éste va hacia Elí"}]},{"s":"Himnario infantil","n":"30","t":"El amor de Dios es maravilloso","p":"33","c":"","l":[{"t":"v","n":"1","x":"El amor de Dios es maravilloso, el amor de Dios es maravi lloso, el amor de Dios es maravi lloso, grande es el amor de Dios. Tan alto que no puedo estar arriba de el, tan hondo que no puedo es tar abajo de el, tan hondo que no puedo estar afuera de el, grande es el amor de Dios. Letra y música: Desconocido Arm. Edgar Pineda Fierro"}]},{"s":"Himnario infantil","n":"31","t":"El es mi Rey","p":"34","c":"","l":[{"t":"v","n":"1","x":"El es mi Rey por lo tanto yo le amo, él es mi Rey no hay otro como él, cada día alabanzas yo le canto. ¡Aleluya! él es mi Rey."}]},{"s":"Himnario infantil","n":"32","t":"El hombre sabio","p":"34–35","c":"","l":[{"t":"v","n":"1","x":"El hombre sabio casa construyó y sobre roca él la edificó, el hombre sabio casa construyó y tormenta le cayo. Llovió a torrentes y se inundó, llovió a torrentes y se inundó, llovió a torrentes y se inundó y la casa permaneció."},{"t":"v","n":"2","x":"El hombre necio casa construyó y sobre arena él la edificó, el hombre necio casa construyo y tormenta le cayó. Llovió a torrentes y se inundó, llovió a torrentes y se inundó, llovió a torrentes y se inundó y la casa se cayó."},{"t":"v","n":"3","x":"Tu casa en Cristo puedes cimentar, tu casa en Cristo puedes cimentar, tu casa en Cristo puedes cimentar para nunca fracasar. El Dios del cielo te bendecirá tus oraciones él escuchará, si pruebas vienen a tu lado está porque Cristo la roca es."}]},{"s":"Himnario infantil","n":"33","t":"Esta lucecita","p":"35","c":"","l":[{"t":"v","n":"1","x":"Esta lucecita yo la haré brillar, esta lucecita yo la haré brillar, esta lucecita yo la haré brillar, brillará, brillará, brillará. Letra y Música: Desconocido, Tr. G. P. Simonds, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Cuando esté en el templo yo la haré brillar, cuando esté en la escuela yo la haré brillar, cuando esté en la casa yo la haré brillar, brillará, brillará, brillará."}]},{"s":"Himnario infantil","n":"34","t":"Hondo es como el mar","p":"35","c":"","l":[{"t":"v","n":"1","x":"Hondo es como el mar, alto cual cielo azul, cual oceano en la inmensidad es el amor de Dios por ti, por mí, Sí. Letra y Música: Deconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"35","t":"Jesús de los cielos","p":"36","c":"","l":[{"t":"v","n":"1","x":"Jesús Rey de los cielos al mundo bajó en busca de sol, Brillando en la gloria del Rey Salvador. Letra y Música: George F. Root, Tr. Juan Bautista Cabrera Ivars, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Angustias y muerte y horrible aflicción costaron la"},{"t":"v","n":"3","x":"Los niños y niñas que van al Señor, son todas las"},{"t":"v","n":"4","x":"Venid pues alegres al buen Redentor, él quiere las"},{"t":"c","x":"joyas que amante compró. joyas que amante compró. Los niños salvados serán como el joyas que amante compró. joyas que amante compró."}]},{"s":"Himnario infantil","n":"36","t":"La belleza de Cristo","p":"36","c":"","l":[{"t":"v","n":"1","x":"La belleza deCristo que mora en mí, su blancura ypureza yo quiero, sí, ¡Oh, Divino Jesús! ven y llena mi ser y que puedan de mí tu belleza ver. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"37","t":"La Biblia es cual martillo","p":"37","c":"","l":[{"t":"v","n":"1","x":"La Biblia es cual martillo que parte la roca en dos; Es lámpara que alumbra como faro la tempestad. Espada de dos filos, espejo la Biblia es; Bendito libro de mi Dios Tú eres para mí."},{"t":"v","n":"2","x":"Semilla es que germina cuando entra en el corazón; Cual carne y leche hará crecer a todo el que la lee. El agua que nos limpia y nos da la seguridad Que Cristo es nuestro Salvador, La Biblia es para mí."}]},{"s":"Himnario infantil","n":"38","t":"La canción de la lluvia","p":"37","c":"","l":[{"t":"v","n":"1","x":"Tin, tin, tin, oye bien, es la canción de la lluvia; tin, tin, tin, oye bien, gracias a Dios por la lluvia.¿Quién hizo el arcoiris? ni tú, ni yo, pues ¿quién? ¿Quién hizo el arcoiris? fue Dios el sumo bien. Letra y Música: Bardwell N., Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"39","t":"Estoy contento aquí en la tierra","p":"38","c":"","l":[{"t":"v","n":"1","x":"Estoy contento aquí en la tierra con una casita de pocovalor, pero en el cielo do los ángeles cantan, mansión de gloria yo voy a tedal, un día muy pronto estaré con mi Cristo andando en calles de fino cristal. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Aquí tentado, muchas veces probado, pero no estoy sólo, a mi lado está Dios; soy peregrino sin hogar permanente, pero allá tengo mansión eter -"},{"t":"v","n":"3","x":"Aquí estoy pobre, pero no estoy triste, yo voy buscando la bella ciudad; allá yo tengo un arpa de oro y una corona que es eter -"},{"t":"c","x":"nal. Mansión yo tengo allá En el cielo, en donde al oro abunda en rau -"}]},{"s":"Himnario infantil","n":"40","t":"La gloria de Dios","p":"38–39","c":"","l":[{"t":"v","n":"1","x":"No te he dicho que si creyeres verás la gloria de Dios. No te he dicho que si creyeres verás la gloria de Dios. Verás la gloria de Dios, verás la gloria de Dios. No te he dicho que si creyeres verás la gloria de Dios."}]},{"s":"Himnario infantil","n":"41","t":"La pequeña labor","p":"39","c":"Letra:     A. D. de Rodríguez; Música: E. C. H. de Naylor, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"La pequeña labor que Dios quiera yo haré; trabajando se sirve al Señor y mi humilde trabajo él lo ve. Cada día contento, contento estaré, y lo que Dios quiera gustoso lo haré. tento estaré, y lo que Dios quiera gustoso lo haré. Letra: A. D. de Rodríguez"},{"t":"v","n":"2","x":"Si mamita me llama, pronto acudiré; porque ella me ama le obedeceré, cada día contento, conMúsica: E. C. H. de Naylor, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"42","t":"Los niños de siete años","p":"40","c":"","l":[{"t":"v","n":"1","x":"Los niños de siete años, de cinco y tres también entrar al cielo pueden, Jesús la puerta es. Creyendo siempre en Cristo de todo corazón, reciben de él la vida la paz y el perdón. Letra y Música: G. J. Webb, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"43","t":"Los niños son de Cristo","p":"40–41","c":"","l":[{"t":"v","n":"1","x":"Los niños son de Cristo, él es su Salvador, son joyas muy preciosas compradas con su amor. Joyas, joyas, joyas, joyas del Salvador, están en esta tierra cuan dulce y santo amor. Letra y Música: J. S. Fearis, Tr. H. C. Ball"},{"t":"v","n":"2","x":"Los niños son tesoros, pues que del cielo son, luz refulgente esparcen, en horas de aflicción."},{"t":"v","n":"3","x":"Los niños son estrellas de grata claridad, quiere Jesús que anuncien al mundo su verdad."},{"t":"v","n":"4","x":"Los niños son de Cristo, por ellos él vendrá, y con él para siempre dichosos vivirán."}]},{"s":"Himnario infantil","n":"44","t":"Los niños son de Cristo","p":"41","c":"","l":[{"t":"v","n":"1","x":"Los niños son de Cristo nos dice el Señor, que en su palabra santa nos da su dirección. Que siempre estemos prestos para glorificar, tu nombre a cada paso por la eternidad. Señor te pedimos nos des más de tu amor, nos hagas niños fieles, nos des tu direción, Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"45","t":"Los que cantan","p":"42","c":"","l":[{"t":"v","n":"1","x":"Losque cantan,cantan gloria al Cordero de la cruz.Los que cantancuentanla historia,la historia que habla de Cristo Jesús. Los que cantan sienten el gozo, el gozo del alma que les da Jesús. Letra y Música: Desconocido, Arm. Isaac García Contreras."}]},{"s":"Himnario infantil","n":"46","t":"Maravilla","p":"42","c":"","l":[{"t":"v","n":"1","x":"Maravilla es saber que Cristo fue un niñito como yo, que una Cristo, como él yo quiero ser, que su belleza los otros en mí la puedan ver. Letra y Música: H. H. Lemmel, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Me sorprende más saber que Cristo en los cielos hoy está, prepa-"},{"t":"c","x":"vida pura y santa aquí a este mundo él mostró. Cuán admirable es mi rando para mí un lugar do con él me llevará. ´"}]},{"s":"Himnario infantil","n":"47","t":"Me gusta cantar","p":"43","c":"","l":[{"t":"v","n":"1","x":"Me gusta cantar, me gusta cantar, me gusta cantarle a Cristo, me gusta cantar. Canto al rayar el día, canto en la noche azul, cada día siempre igual, a cantar, cantar."}]},{"s":"Himnario infantil","n":"48","t":"Mi barco es pequeño","p":"43","c":"","l":[{"t":"v","n":"1","x":"Mi barco es pequeño, inmenso es el mar, Jesús es mi buen capitán. Él guía mi barco y todo va bién, hasta el país celestial. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"49","t":"Mira cual amor","p":"44","c":"","l":[{"t":"v","n":"1","x":"Mira cuál amor nos ha dado el Padre que seamos hechos los hijos de Dios. Por eso el mundo ya no nos conoce porque a él tampoco no le conoció. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"50","t":"Necesitamos más de la oración","p":"44","c":"","l":[{"t":"v","n":"1","x":"Necesitamos más de la oración, de la oración, de la oración; no es el hermano, ni la hermana, ni el pastor, sino yo que necesito la oración, sino yo que necesito la oración. Letra y Música: Desconocido, Arm. Isaac García Contreras."}]},{"s":"Himnario infantil","n":"51","t":"Oh que gozo en el cielo","p":"45","c":"","l":[{"t":"v","n":"1","x":"Oh que gozo en el cielo los niños tendrán, Sí, los niños que aman a Jesús, arpas y coronas de oro tendrán y vestidos blanqueados de luz. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"En las calles de oro allí andarán, del maná celestial comerán, noche y muerte no habrá más allá, siempre Cristo les alumbrará."}]},{"s":"Himnario infantil","n":"52","t":"Oh, sí, yo soy feliz","p":"45","c":"","l":[{"t":"v","n":"1","x":"¡Oh,sí,soyfeliz, feliz! ¡Oh,sí,soyfeliz, feliz! Cristome amó y su gozo me dio, ¡Oh, sí, soy feliz! Letra y Música: M. E. Sullivan, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"53","t":"Pajarito Canta tú","p":"45","c":"","l":[{"t":"v","n":"1","x":"Pajarito canta tú, canta tú, canta tú. Pajarito canta tú, cantale al Señor. Cantale a las flores que hay en el jardín, cantale alos niños que aman a Jesús. Letra y Música: Desconocido, Arm. Isaac García Contreras."}]},{"s":"Himnario infantil","n":"54","t":"Por mi niñez venturosa","p":"46","c":"Letra:    Kate L. Brown; Música: Dueño Colón, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Por mi niñez venturosa te rindo gracias buen Dios, y te quiero y te bendigo por haber creado el sol, la lluvia que nos refresca, la fuente el ave y la flor. Letra: Kate L. Brown"},{"t":"v","n":"2","x":"Gracias te doy por mis padres y también gracias te doy por la estrella de la tarde de tan vivo resplandor, como los ojos de un ángel de tu celestial mansión. Música: Dueño Colón, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"3","x":"Gracias te doy por los seres que están a mi derredor, por la escuela, por los libros en que aprendo la lección; y te doy gracias por todo lo que ama mi corazón."}]},{"s":"Himnario infantil","n":"55","t":"Qué gozo tengo","p":"46–47","c":"","l":[{"t":"v","n":"1","x":"¡Qué gozo tengo! ¡qué gozo tengo! ¡qué gozo tengo! por que Jesús, ha perdonado ya mis pecados,los ha borrado con su poder. Hay unas campanas en mi ser, ¡suenan tan alegres con poder!, repiten un canto que yo ya soy salvo, salvo por su gracia y su poder. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"56","t":"Quiere Jesús que yo brille","p":"47","c":"Letra:    Ernesto Barocio; Música: Edwin O Excell","l":[{"t":"v","n":"1","x":"Quiere Jesús que yo brille cual rayo de alba luz, en medio de las tinieblas reflejaré a Jesús. Que brille, que brille, quiere Jesús que yo brille; y siempre, do quiera, yo brillaré por Jesús. Letra: Ernesto Barocio"},{"t":"v","n":"2","x":"Quiere Jesús que yo muestre a todos mi bondad, para que el mundo contemple mi gran felicidad. Música: Edwin O Excell"},{"t":"v","n":"3","x":"A mi Jesús yo le pido me libre del pecar, y al reflejar sus bondades así podré brillar."},{"t":"v","n":"4","x":"Yo brillaré en las tinieblas cual rayo de alba luz, como brilló aquí en el mundo mi Salvador Jesús."}]},{"s":"Himnario infantil","n":"57","t":"Si a Jesús acudes","p":"48","c":"","l":[{"t":"v","n":"1","x":"Si a Jesús acudes todo bien está, si a Jesús acudes todo bien lo hará; tus pruebas trae a él, él es tu amigo fiel, si a Jesús acudes todo bien lo hará. Letra y Música: Desconocido, Arm. Isaac García Contreras."}]},{"s":"Himnario infantil","n":"58","t":"Sí, la biblia es","p":"48","c":"","l":[{"t":"v","n":"1","x":"Sí, la biblia es libro de verdad, es el Don de Dios, siempre la verdad. ¡Oh, Sí! la biblia es la verdad, ¡Oh, Sí!, la biblia es la verdad, Palabra es de Dios y es verdad. Letra y Música: M. T. Mc Pherson, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"59","t":"Si perseverares hasta el fin","p":"49","c":"","l":[{"t":"v","n":"1","x":"Si perseverares hasta el fin, una corona heredarás, y cuando suene el clarín con los fieles redimidos irás, Cristo ha dichoqueha ido hapreparar una morada para mí. Oh hermano yo no me quiero quedar, porque aquí mucho se va a sufrir. Oh hermano yo no me quiero quedar porque aquí mucho se va a sufrir."}]},{"s":"Himnario infantil","n":"60","t":"Soldado soy de Jesús","p":"49","c":"","l":[{"t":"v","n":"1","x":"Aunque no marche en la infantería, caballería, artillería Aunque en avión no valla volando pero soldado soy. Soldado soy de Jesús Soldado soy de Jesús Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrillo"}]},{"s":"Himnario infantil","n":"61","t":"Somos peregrinos","p":"50","c":"","l":[{"t":"v","n":"1","x":"Somos peregrinos, vamos a Jesús, nuestra hermosa enseña es la de la cruz, vamos hacia el cielo, Dios su luz nos da, y él en sus mansiones nos espera ya. somos muy pequeños mas nos ama él, y en nuestro camino él nos guarda fiel. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Dios amante cuida al que débil es, cuida no resbalen sus pequeños pies, vamos por el mundo con seguridad, siempre asegurados de su fiel bondad."},{"t":"v","n":"3","x":"Fuerza recibimos sólo del Señor, nada nos inspíra ya ningún temor, fieles seguiremos su bendita voz, hasta que nos lleve hacia su mansión."},{"t":"c","x":"Somos peregrinos: marchad, vamos a la gloria: marchad,"}]},{"s":"Himnario infantil","n":"62","t":"Soy feliz","p":"50–51","c":"","l":[{"t":"v","n":"1","x":"Soy feliz y te diré por qué: sé queJesucristo mesalvó. De su gracia siempre cantaré. sé que Jesucristo mesalvó. Tristey angustiadami alma se sintió, mas Jesús quitó la carga y paz me dio. Canto alegre y es por que yo sé, que mis culpas Cristo las quitó. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"63","t":"Soy feliz","p":"51","c":"","l":[{"t":"v","n":"1","x":"Soy feliz y muy contento estoy porque Cristo el Rey de gloria aquí bajó, paz me dio en el corazón y me trajo salvación. Soy feliz y muy contento estoy. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"64","t":"Tan alto como una montaña","p":"51","c":"","l":[{"t":"v","n":"1","x":"Tan alto como una montaña fueron todos mis pecados, Jesús los borró, él me perdonó, por siempre con él viviré, ¡Amén!. Escrito está me coronará, por siempre con él viviré, ¡Amén!. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"65","t":"Tengo paz y perdón","p":"52","c":"","l":[{"t":"v","n":"1","x":"Tengo paz y perdón desde que hallé a mi Salvador amante, lo pasado se fue ¿cómo, a dónde? No sé, ¡Aleluya! Tengo paz y perdón, gozo sin igual, el diablo ha huido y estoy convertido, tengo alegría, gozo, paz, perdón. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"66","t":"Tengo un hogar en la gloria","p":"52","c":"","l":[{"t":"v","n":"1","x":"Tengo un hogar de gloria mas allá del azul. Tengo un hogar de gloria mas allá del azul Tengo un hogar de gloria mas allá del azul más allá del cielo azul Nunca olvides al Señor Nunca olvides al Señor Nunca olvides al Señor, al Señor del cielo azul Letra y Música: Desconocido, Arm. Daniel Cruz Fuentes"}]},{"s":"Himnario infantil","n":"67","t":"Todas mis culpas se fueron rodando","p":"53","c":"","l":[{"t":"v","n":"1","x":"Todas mis culpas se fueron rodando se fueron rodando se fueron rodando Todas mis culpas se fueron rodando allá en la cruz por mí."},{"t":"v","n":"2","x":"Paz como un río que llena mi ser quellena mi ser que llena mi ser Paz como un río que llena mi ser allá en la cruz por mí"}]},{"s":"Himnario infantil","n":"68","t":"Tres veces oraba Daniel en el día","p":"53","c":"","l":[{"t":"v","n":"1","x":"Tres vecesoraba Daniel en el día tres vecesoraba el profeta Elías Daniel en el pozo un angel veía el profeta oraba y la lluvia caía. Dos estarán moliendo en un molino dos estarán durmiendo muy tranquilos uno se irá y el otroquedará debesestar listo porque el vendrá Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrrillo"}]},{"s":"Himnario infantil","n":"69","t":"Tu santa palabra Señor","p":"54","c":"","l":[{"t":"v","n":"1","x":"Tu Santa Palabra Señor en mi corazón guardaré. para no pecar, para no pecar, para no pecar contra ti. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vazquez"}]},{"s":"Himnario infantil","n":"70","t":"Toda la semana","p":"54–55","c":"","l":[{"t":"v","n":"1","x":"Toda la semana, los siete días todos, el Salvador me guarda en su amor; ya perdonado soy, a su morada voy, por siempre viviré con mi Señor. Me guarda del pecado, me libra de Satán, me libra de tristesa y todo mal, y toda la semana estoy día con día con gozo alabando al Salvador. Domingo tengo gozo, lunes continuará, el martes tengo paz que nadie quitará, el miércoles y jueves camino con Jesús, el viernes gozo su bondad y el sábado su luz. ¡Oh,"},{"t":"v","n":"2","x":"Gloria, gloria, gloria! ¡Oh, gloria a Jesús, ¡Oh, aleluya ya soy salvo por muerte de cruz."}]},{"s":"Himnario infantil","n":"71","t":"Todos deben conocer","p":"55","c":"","l":[{"t":"v","n":"1","x":"Todos deben conocer, todos deben conocer, todos deben conocer quién es Jesús. Es el lirio de los valles, es la rosa de Sarón, es la estrella matutina; todos deben conocer. Letra y Música: Harry Dixon, Tr. G.P. Simmonds, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Todos deben de saber, todos deben de saber, todos deben de saber qué hizo Jesús. Es amigo de los niños y los quiere proteger, él murió para salvarlos, todos deben de saber."}]},{"s":"Himnario infantil","n":"72","t":"Un cuervo aleteó","p":"56","c":"","l":[{"t":"v","n":"1","x":"Un cuervo alete ale teo ale teo llegando al arroyo bajo y lle baba pan y llevaba carne por que Dios se lo mando Y una viejecita juntaba su leñita cuando Elias por ahi pasó le hizo pan con aceite y harina que nunca se le a cabo Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrillo"}]},{"s":"Himnario infantil","n":"73","t":"Ved la iglesia","p":"56–57","c":"Letra:    C. E. Ballesteros; Música: William S. Pitts","l":[{"t":"v","n":"1","x":"Ved la iglesia que ufana levanta, al SeLetra: C. E. Ballesteros ñor su glorioso pendón, es la iglesia do todo creyente alza a Dios su ferviente oración. ven a adorad al Señor; no hay sitio más dulce en la tierra, que la casa del Padre de amor."},{"t":"v","n":"2","x":"Todo allí en armonioso concierto, rinde Música: William S. Pitts culto supremo al Creador; ¿por qué tú que su gracia recibes, no le adoras, viviendo en su amor."},{"t":"v","n":"3","x":"Si es que alientas en tu alma el deseo de encontrar el alivio al dolor, llevatu alma ante el trono de gracia, y a la iglesia de Cristo el Señor."},{"t":"c","x":"Oh, ven, ven, ven, ven, ven a la iglesia conmigo, oh,"}]},{"s":"Himnario infantil","n":"74","t":"Yo amo a mi Señor","p":"58","c":"","l":[{"t":"v","n":"1","x":"Yo amo a mi Señor, mi Señor, mi Señor. Yo amo a mi Señor, ¡Sí! ¡Sí! ¡Sí! Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Su vida dio por mí, dio por mí, dio por mí. Su vida dio por mí, ¡Sí! ¡Sí! ¡Sí!"},{"t":"v","n":"3","x":"Él me ama yo lo sé, yo lo sé, yo lo sé. Él me ama yo lo sé, ¡Sí! ¡Sí! ¡Sí!"},{"t":"v","n":"4","x":"Yo quiero a marte más mi Jesús, mi Señor. Yo quiero amarte más, ¡Sí! ¡Sí! ¡Sí!"}]},{"s":"Himnario infantil","n":"75","t":"Yo ascenderé","p":"58","c":"","l":[{"t":"v","n":"1","x":"Yo ascenderé, yo ascenderé, yo ascenderé en la primer resurrección. Del norte vendrán, también vendrán del sur, del este y oeste se levantarán. Todos nos iremos, al cielo llegaremos, a morar allá con el Señor Jesús. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"76","t":"Yo estoy contento","p":"59","c":"","l":[{"t":"v","n":"1","x":"Yo estoy contento, sí, siempre estoy contento, sí, desde que conozco al Señor, estoy contento, sí."},{"t":"v","n":"2","x":"Y por él yo salvo soy, y por él yo salvo soy, por la sangre de mi redentor, yo sé que salvo soy."},{"t":"v","n":"3","x":"A la gloria celestial, a la gloria celestial, pronto él me llevará con él, en gloria celestial."}]},{"s":"Himnario infantil","n":"77","t":"Yo pequé pero Dios me ama","p":"59","c":"","l":[{"t":"v","n":"1","x":"Yo pequé pero Dios me ama y Cristo murió por mí, yo le recibo y ya soy su hijo y es un plan para mí. Es un plan para mí, es un plan para mí, yo le recibo y ya soy su hijo y es un plan para mí Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrillo"}]},{"s":"Himnario infantil","n":"78","t":"Yo soy de Cristo","p":"60","c":"","l":[{"t":"v","n":"1","x":"Yo soy de Cristo, el es mi vida por que en mi alma sembró una preciosa semilla que es la palabra de Dios. Letra y Música: Desconocido, Arm. Daniel Cruz Flores"},{"t":"v","n":"2","x":"De e sa semilla nació una planta con lluvias pentecostés; con sus ra í ces de fuego y su hojitas de fe."}]},{"s":"Himnario infantil","n":"79","t":"Yo tengo un amigo que me ama","p":"60","c":"","l":[{"t":"v","n":"1","x":"Yo tengo un amigo que me ama, me ama, me ama Yo tengo un amigo que me ama su nombre es Jesùs. Que me ama que me ama que me ama si con tierno aAmor. Que me ama que me ama, Su nombre es Jesús. Letra Y Música: desconocida, Arm. Francisco Sixtos Carrillo"}]},{"s":"Himnario infantil","n":"80","t":"Yo tengo un tesoro","p":"61","c":"","l":[{"t":"v","n":"1","x":"Yo tengo un tesoro precioso, por gracia de Dios me fue dado, compañeros seremos mi biblia y yo. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"81","t":"Yo tengo una corona","p":"61","c":"","l":[{"t":"v","n":"1","x":"Yo tengo una corona allá en el cielo que Cristo ha preparado para mí, y oí una voz del cielo que decía: \"hijo mío no te tardes en venir\"; no pudo resistir mi corazón y a la voz de Cristo me humillé; y me dijo levantate hijo mío que tus culpas con mi sangre yo lavé. Letra y Música: esconocido, Arm. Francisco Javier Corona Vázquez."}]},{"s":"Himnario infantil","n":"82","t":"Yo vivo contento","p":"62","c":"","l":[{"t":"v","n":"1","x":"Yo vivo contento, con Cristo en mi vida; toda la paz y alegría, la da Jesús, la da Jesús. El anhelar de mi vida, que te conozcan Jesús; pues tú cambias te mi vida, con ese amor que tienes tú, que tienes tú, mi Salvador, con ese amor que tienes tú. Letra y Música: Desconocido, Arm. Isaac García Contreras."},{"t":"v","n":"2","x":"Yo vivo contento, con Cristo en mi vida; toda la paz y alegría, la da Jesús, la da Jesús. El anhelar de mi vida, al suplicarte Señor, que santifiques mi vida, con ese amor que tienes tú, que tienes tú, mi Salvador, con ese a - - - - - - mor que tienes tú."}]},{"s":"Himnario infantil","n":"83","t":"Zaqueo era un chaparrito así","p":"63","c":"","l":[{"t":"v","n":"1","x":"Zaqueo era un chaparrito así que vivió en Jericó Y al pasarJesús porahí se subió a un Sicomoro El Salvador lo vió ahi y le dijo así: Zaqueo bajate de ahi porque atu casa voy a ir porque a tu casavoy a ir"}]},{"s":"Himnario infantil","n":"84","t":"Aleluya, aleluya","p":"63","c":"","l":[{"t":"v","n":"1","x":"¡Aleluya, aleluya que acaba de nacer, el Rey de los cielos, el Cristo redentor. Cantemos aleluya en esta navidad. Letra y Música: Desconocido, Arm. Isaac García Contreras"}]},{"s":"Himnario infantil","n":"85","t":"La bienvenida dad","p":"64","c":"","l":[{"t":"v","n":"1","x":"La bienvenida dad al día de Navidad, del año más feliz es sin dudar. El gozo y el placer se dejan luego ver, en todos los presentes al cantar. Su cabeza coronad pues es el verdadero Rey. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Ya vino el Salvador, de Dios el Don de amor, enviado como prueba de bondad. Un ángel lo anunció y el coro replitió al hombre paz y buena voluntad."},{"t":"c","x":"Nuevos himnos con afán cantad, de Belén al niño celebrad,"}]},{"s":"Himnario infantil","n":"86","t":"La noticia sin igual","p":"65","c":"","l":[{"t":"v","n":"1","x":"La noticia sin igual el ángel la dio, A los fieles pastores del campo en Belén; Y aunque el frío invernal en la noche cundió, Las ovejas estaban cuidadas muy bien. Noel, Noel, Noel, Noel Hoy ha nacido el Rey de Israel. Letra y Música: Villancico tradicional francés"},{"t":"v","n":"2","x":"Y una estrella todos vieron arriba brillar, Que viajaba hacia el Oeste del vasto confín; Y a la tierra alumbró con su luz estelar, Día y noche continuos en regio festín."},{"t":"v","n":"3","x":"Y los magos por fe siempre en pos de esa luz, Cami naron de lejos en busca de un Rey; Y al llegar hasta Belén donde es taba Jesús, Le adoraron con gozo cual su santa grey."},{"t":"v","n":"4","x":"Adoremos a Jesús en unión y amor, Por los muchos favores que él siempre nos da; De la tierra y el mar y del cielo es Creador, Por su sangre nuestra alma salvada está."}]},{"s":"Himnario infantil","n":"87","t":"Bendita noche buena","p":"66","c":"","l":[{"t":"v","n":"1","x":"Bendita noche buena, del Padre rico don. Mayor que tú es Cristo, Eterna salvación. Por nuestra dicha vino, por darnos dirección, trazando el camino directo hasta Sión. Cantad la hermosa historia de Cristo nacido en Belén. El es Rey y Señor de la gloria, nos dejó la grata Navidad. Letra y Música: Autor desconocido, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Bendita noche buena, del Principe de paz. Amor nos muestra Cristo, que nunca cesará. Calienta, noche buena, mi tibio corazón, ofrenda le daremos y nuestra adoración."}]},{"s":"Himnario infantil","n":"88","t":"Campanas por doquier","p":"67","c":"","l":[{"t":"v","n":"1","x":"Campanas por doquier, resuenen sin cesar, proclamen con amor ¡Que hoy es Navidad! Los niños con canción la grata nueva dan de ese día de amor y buena voluntad. ¡Navidad! ¡Navidad! ¡Hoy es Navidad! es un día de alegria y felicidad, Alegraosy gozaos que Jesús nació, gozaos ¡Navidad! ¡Navidad! ¡Hoy es Navidad! es un día de alegria y felicidad. Alegraos y gozaos que Jesús nació, gozaos"},{"t":"v","n":"2","x":"El día celebrar, el día tan feliz, su júbilo sin par podamos compartir. Y compartiendo así con otros cada cual, será el día más feliz y el gozo aumentará. Letra y Música: Tradicional, Arr. Isaac García Contreras"}]},{"s":"Himnario infantil","n":"89","t":"Campanitas","p":"68","c":"","l":[{"t":"v","n":"1","x":"Din, dan, din, dan, cada muchachito es una campanita de cristal que suena sin cesar, que suena sin cesar. Din, dan, din, dan, anunciando a todos que hoy es navidad. Viene navidad con dicha y gozo para ti y para mí, todos muy contentos debemos cantar así ¡Sí! ¡Sí! Letra y Música: Desconocido, Arm. Isaac García Contreras."}]},{"s":"Himnario infantil","n":"90","t":"Escucha mi niña, te voy a contar","p":"69","c":"","l":[{"t":"v","n":"1","x":"Escucha, mi niña te voy a contar del niño más lindo que hubiera jamás quisiera en tu almita su historia grabar, la historia que el tiempo hace amar más y más. Letra y Música: Ira D. Sankey, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"La madre un encanto y el niño un primor, la cuna un pesebre, la casa un mesón; ¿mantillas? ¿quién tuvo indumenta peor, que aquel niño envuelto en un pobre girón."},{"t":"v","n":"3","x":"Tú tienes hijito un esplendido hogar, amigos, juguetes, vestidos calor, muchisimas cosas que te hacen gozar; mas eso aquel niño no vió en su redor."},{"t":"v","n":"4","x":"Y aquel pequeñito que pobre nació, ¿no sabes quien era el mismísimo Dios que desde su trono a este mundo bajó, por ver si pudiéramos de Él ir en pos."},{"t":"v","n":"5","x":"Te hedicho en esencia la historia sin par del niño que honra la fiel cristiandad, aprendela hijita y aprende a estimar al niño sublime de la Navidad."}]},{"s":"Himnario infantil","n":"91","t":"Hermosas velitas","p":"70","c":"","l":[{"t":"v","n":"1","x":"Hermosas velitas En la oscuridad Hablande la estrella De la Navidad. Ved vuestras velitas Vedque alumbran bien Hablan de la estrella Que brillo en Belén. Letra y Música: Vicente Mendoza"},{"t":"v","n":"2","x":"En silencio brillan Brillan sin cesar Y en su luz de Cristo nos vienen a hablar."},{"t":"v","n":"3","x":"Son muy pequeñitas Dan muy poca luz Mas la buena nueva nos dan de Jesús."},{"t":"v","n":"4","x":"Este mundo oscuro Cristo alumbrará Y alos hombres todos Él los salvará."}]},{"s":"Himnario infantil","n":"92","t":"Hoy alegres las campanas","p":"70–71","c":"Letra:    Desconcido; Música: Melodía tradicional Galesa, Arr. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Hoy alegres las campanas por doquier se oyen resonar, Jubilosas y ufanas anunciando que es la Navidad, Es un día de alabanza, día de amistad y amor. Día de placer precioso, día de alabanza y canción. Letra: Desconcido"},{"t":"v","n":"2","x":"Oh, sonad, sonad campanas, anunciad el día sin igual Y con voz sonora y clara difundid la nueva celestial, Proclamad con alegria Cristo ha nacido en un por tal: \"Gloria a Dios en las alturas y a los hombres buena voluntad\". Música: Melodía tradicional Galesa, Arr. Isaac García Contreras"}]},{"s":"Himnario infantil","n":"93","t":"Hoy es la grata navidad","p":"71","c":"","l":[{"t":"v","n":"1","x":"Hoy es la grata Navidad el día de felicidad, de amistad y amor, de amistad y amor. De nuestros corazones alcemos mil canciones, con jubilosas voces y tierna devoción. Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro"},{"t":"v","n":"2","x":"Con regocijo en cada hogar los niños cantan sin cesar hoy es la Navidad, hoy es la Navidad. Es día de alborozo de canto melodioso de rica paz y gozo de santa devoción."}]},{"s":"Himnario infantil","n":"94","t":"Navidad, ¡Que felicidad!","p":"72","c":"Letra:    Desconocido; Música: Tradicional Inglés, Arr. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Navidad ¡Que felicidad! Es un día de alegria y de dulce melodia, hoy es Navidad, ¡Que felicidad! Letra: Desconocido"},{"t":"v","n":"2","x":"Navidad ¡Que felicidad! Es un día aún más grato cuando a otros alegramos, hoy es Navidad, ¡Que felicidad! Música: Tradicional Inglés, Arr. Francisco Javier Corona Vázquez"}]},{"s":"Himnario infantil","n":"95","t":"Campanas de Navidad","p":"72","c":"","l":[{"t":"v","n":"1","x":"¿Porqué de las campanas hoy se oyen resonar? anuncian con su dulce voz que hoy es Navidad que hoy es Navidad Letra y Música: Autor desconocido, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"¿Porqué alegres cantan hoy los niños por doquier es esta su feliz canción Jesús nacio en Belén, Jesús nacio en Belén"},{"t":"v","n":"3","x":"¿Que le daremos a Jesús en su cumpleaños hoy? nuestra obediencia y gratitud, son dones de su amor, son dones de su amor"}]},{"s":"Himnario infantil","n":"96","t":"¿Por qué hay gozo y felicidad?","p":"73","c":"","l":[{"t":"v","n":"1","x":"¿Por qué hay en navidad gozo y felicidad? Hombres de la antigüedad vieron una claridad, astro hermoso señaló y al pesebre los llevó. Encontraron un bebé, cuya cuna el heno fue. Su mamá feliz cantó: Cristo el Santo ya nació. Por lo tanto en navidad, gozo hay y felicidad, gozo hay y felicidad. Letra y Música: Desconocido, Arm. Isaac García Contreras."}]},{"s":"Himnario infantil","n":"97","t":"¡Qué bonita Navidad!","p":"74","c":"Letra:    Desconocido, Trad. A. Espinoza; Música: W. A. Post,  Arr. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"¡Qué bonita Navidad! todo el mundo alegre esta con sencillo corazón, hoy entona su canción. Al niñito de Belén, a Jesús que es nuestro bién le venimos a cantar hoy en esta Navidad. Letra: Desconocido, Trad. A. Espinoza"},{"t":"v","n":"2","x":"Niños vamos a cantar, esta noche no hay pesar, ni tristeza ni dolor, todo es gozo paz y amor. a los pies del buén Jesús, hallaremos dulce luz, ángeles anuncian yá, que Jesús nacido ha. Música: W. A. Post, Arr. Francisco Javier Corona Vázquez"}]},{"s":"Himnario infantil","n":"98","t":"Qué contento y feliz","p":"74–75","c":"","l":[{"t":"v","n":"1","x":"Qué contemto y feliz hoy se siente el corazón, que ha naD G Coro C júbilo Israel que el Señor vino ya, nuestro hermoso Rey. Letra y Música: Autor desconocido, Arr. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"De Isaí vastago es El que ofrece el perdón, y Su"},{"t":"v","n":"3","x":"Almas puras venid a los pies del Salvador, sois de"},{"t":"c","x":"cido Jesús Principe de amor gracia dará con su bendición, ¡Aleluya! sin cesar dé con rosa un botón que abre con la luz."}]},{"s":"Himnario infantil","n":"99","t":"Qué día tan feliz","p":"75","c":"","l":[{"t":"v","n":"1","x":"Qué día tan feliz Navidad, de alegrias mil Navidad, día de amistad y de amor, de gozo lleno el corazón, de gozo lleno el corazón Letra y Música: Desconocido, Arr. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"De las campanas hoy Navidad, se oye el dulce son Navidad, la grata nueva dan que en Belén nació Jesús el niño Rey, nació Jesús el niño Rey"},{"t":"v","n":"3","x":"Cantan en cada hogar Navidad, los niños al gozar Navidad, el día celebrar reina el placer, la buena voluntad doquier, la buena voluntad doquier."}]},{"s":"Himnario infantil","n":"100","t":"Suenen hoy las campanas","p":"76","c":"","l":[{"t":"v","n":"1","x":"Suenen hoy las campanas dulces de Navidad diciendo al mundo ufanas de Dios la gran bondad. tan, tan, diciendo al mundo ufanas que en Belén Jesús nació. Letra y Música: E. Velasco, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Digan el gran mensaje que absorto el hombre oyó, por su terreno viaje \"Cristo en Belén nació\"."},{"t":"v","n":"3","x":"Digan con alborozo la gran nueva de amor, que el niño prodigioso es nuestro Salvador."},{"t":"c","x":"Tan, tan, resuenen las campanas, tan, tan cual candidas hermanas,"}]},{"s":"Himnario infantil","n":"101","t":"Un hermoso pequeñuelo","p":"76–77","c":"","l":[{"t":"v","n":"1","x":"Un hermoso pequeñuelo acaba de nacer tan bello es que arroCristo nació en Belén ¡Hosanna! ¡Hosanna! el prometido Emanuel. Letra y Música: E. O. Excell, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Cantos celestiales oyen, pastores de Belén ángeles son que ce-"},{"t":"v","n":"3","x":"Magos del oriente vienen sus dones a ofrecer oro incienso y mirra"},{"t":"v","n":"4","x":"No tengo oro ni riquezas que darle al Niño Rey Solo un corazón de"},{"t":"c","x":"bados los ángeles lo ven. lebran la Navidad del Rey. ¡Hosanna! ¡Hosanna! ponen, humildes a sus pies. niño que lo ama y cree en Él."}]},{"s":"Himnario infantil","n":"102","t":"Venid, pastorcillos","p":"77","c":"Letra:    Francisco Martínez de la Rosa; Música: Carl Müller","l":[{"t":"v","n":"1","x":"Venid, pastorcillos, venid a adorar Al Rey de los cielos que nacido está. Sin ricas ofrendas no temáis llegar, Que al niño le agradan la fe y voluntad. Letra: Francisco Martínez de la Rosa"},{"t":"v","n":"2","x":"Un rústico techo abrigo le da, Por cuna un pesebre, por templo un portal; En lecho de pajas incógnito está Quien ve alas estrellas a sus pies brillar. Música: Carl Müller"},{"t":"v","n":"3","x":"Hermoso lucero le vino a anunciar, Y magos de oriente buscandole van; Delante se postran del Rey de Judá, De incienso oro y mirra tributo le dan."}]},{"s":"Himnario infantil","n":"103","t":"Es el Rey de los cielos","p":"78","c":"","l":[{"t":"v","n":"1","x":"Es el Rey de los cielos, es el Rey de la mar, es el Rey de la tierra, es el Rey de mi alma ya. El que lava mis pecados y me da la libertad Jesucristo es Rey. Jesucristo es Rey ¡Aleluya!, Jesucristo es Rey ¡Aleluya! Jesucristo es Rey ¡Aleluya! Jesucristo es Rey. Letra y Música: Desconocido, Arm. Isaí Torres Rivero"}]},{"s":"Himnario infantil","n":"104","t":"Hosanna, hosanna niñitos prorrumpid","p":"78–79","c":"","l":[{"t":"v","n":"1","x":"¡Hosanna, hosanna!, niñitos prorrumpiid, ¡hosan na, hosanna! al hijo de David, abrid cami no a Cristo que llega vencedor, en Él Dios ha provisto al mundo un Redentor. ¡Hosanna, hosanna al trino Dios! Letra y música: Desconocido, Arr. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"¡Hosanna, hosanna!, al principe de paz, ¡hosanna, hosanna! luz brota de su faz, alcelmos nuestras palmas su triunfo celebrar, que a nuestras pobres almas Él viene a rescatar. ¡Hosanna, hosanna al niño Dios!"},{"t":"v","n":"3","x":"¡Hosanna, hosanna!, adórenle los vientos, ¡hosanna, hosanna! la luna como el sol, la tierra le responda temblando de emoción, las flores y el niño a ambién los lienzos."}]},{"s":"Himnario infantil","n":"108","t":"Somos blancos lirios","p":"82–84","c":"","l":[{"t":"v","n":"1","x":"Somos blancos lirios, tipos de candor, día y noche damos suave y grato olor. Todo lo que somos, tierna flor, botón, lirios, blancos lirios, frescos lirios en botón, tipos de pureza, tipos de candor. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Somos blancos lirios en botón cierto es, somos pequeñitos, hemos de crecer. ¡Cuántas maravillas nuestros ojos ven!,"},{"t":"v","n":"3","x":"Formas y perfumes, agua y cielo azul, nos ha dado el Padre que creó la luz. Somos para Cristo, que es virtud, candor"},{"t":"c","x":"plácidos brindamos con el corazón. bella es estavida si se vive bién. Blancos símbolo de gracia de inocente amor."}]},{"s":"Coros especiales","n":"1","t":"Abre tú mi corazón","p":"85","c":"","l":[{"t":"v","n":"1","x":"Mi pueblo, oye tú mi voz, escucha mi llamar, yo te salvé, yo soy tu Dios, te quiero perdonar. zón! ¡Oh abre Tú mi corazón! saciado yo seré Letra y Música: W. T. Wiley, Tr. J. N. de los Santos Consultese una versión diferente del coro en el HE126b"},{"t":"v","n":"2","x":"¡Oh! si mi pueblo fuera fiel, le diera salvación, del enemigo duro, cruel, rompiera su prisión. zón! ¡Oh llena Tú mi corazón! saciado yo seré"},{"t":"v","n":"3","x":"Mi pueblo no me quiere oír, no quiere obredecer, se quedará en su sufrir, si no obedece fiel."},{"t":"v","n":"4","x":"Si arrepentido vuelve ya, tendré de él piedad, con sólo mi poder tendrá salud y libertad."},{"t":"v","n":"5","x":"Yo les daré mi bendición de ricamiel y pan, sus almas con satisfacción de gozo cantarán."},{"t":"c","x":"¡Oh abre Tú mi corazón! ¡Oh Abre Tú mi cora - ¡Oh Llena Tú mi corazón! ¡Oh llena Tú mi cora -"}]},{"s":"Coros especiales","n":"2","t":"Acaríciame, Señor","p":"86–87","c":"","l":[{"t":"v","n":"1","x":"Acaríciame, Señor, quiero sentir tu presencia, quiero escuchar tu voz; acaríciame, acaríciame. Dame de tu bendición y no me dejes caer; ayudame, ayudame, para andar en tus caminos de amor. 2.Señor Letra y Música: Leonardo Flores Esparza, Arm. Isaac García Contreras en tu amor ¿qué puede faltar? Si eres tú mi Dios, dame más y más. Si tú estás en mí ¿qué me importa sufrir?. Acaríciame, acaríciame, que contigo no me importa morir."}]},{"s":"Coros especiales","n":"3","t":"Al estar aquí","p":"88–89","c":"","l":[{"t":"v","n":"1","x":"Al estar en la presencia de tu divinidad y al contemplar la hermosura de tu santidad, mi espíritu se alegra en tu majestad, te adoro a ti, te adoro a ti, cuando veo la grandeza de tu dulce amor y compruebo la pureza de tu corazón, mi espíritu se alegra en tu majestad, te aLetra y Música: Marcos Witt. ©1989 CanZion Producciones, Adm. por CanZion Editora doro a ti, te adoro a ti, y al estar aquí, delante de ti te adoraré, postrado anteti mi corazón te adora oh Dios y siempre quiero estar para adorar y contemplar tu santidad, te adoro a ti Señor, te ado - - - - ro a ti."},{"t":"v","n":"2","x":"Arm. Edgar Obed Pineda Fierro."}]},{"s":"Coros especiales","n":"4","t":"Alabad a Jehová","p":"90","c":"","l":[{"t":"v","n":"1","x":"Alabad, a Jehová, naciones todas pueblos todos alabadle; porque ha engrandecido sobre nosotros su misericordia, y la verdad de Jehová es para siempre aleluya amén, y la verdad de Jehová es parasiempre aleluya amén. Letra y Música: Desconocido, Arr. Felipe Blycker J."}]},{"s":"Coros especiales","n":"5","t":"Alabad a nuestro Dios en su santuario","p":"90–91","c":"","l":[{"t":"v","n":"1","x":"Alabad a nuestro Dios en su santuario, en la hermosura de su cielo, por sus proezas alabadle a él. tad Alabadle con el alegre pandero, con el candor de la danza, cantad con gozo al Señor nantes, en su lenguaje todo lo que respira alabe a Jehová. vá. A - - - - - mén Letra y Música: Osdy Soriano, México 1976, Arr. Obed Valencia"},{"t":"v","n":"2","x":"Alabadle por la grandeza de su nombre, con el sonido de bocina, salterio y arpa a la vez can - - - - - - Alabadle con cuerdas flautas y cimbalos, de júbilo reso -"}]},{"s":"Coros especiales","n":"6","t":"Alegres pajarillos","p":"92","c":"","l":[{"t":"v","n":"1","x":"Alegres pajarillos que se despiertan en la alborada, vengan contentos aquí a cantar, que ya la luz de oriente viene anunciando otronuevo día, día venturoso lleno de felicidad. Letra y Música: Desconocido, Arm. Isaac García Contreras"},{"t":"v","n":"2","x":"Que vivas muchos años, todos alegres y muy contentos, te lo deseamos de corazón; que el Padre amante y bueno, Dios de los cielos telo conceda, y haga efectiva nuestra feli citación."}]},{"s":"Coros especiales","n":"7","t":"Algo sucedió el día que me rendí a él","p":"92–93","c":"","l":[{"t":"v","n":"1","x":"Algo sucedió el día en que me rendí a Él, algo cambió en mi ser. Con su amor me enseñó a amar a los debió, me cambió, me cambió, alegría, gozo y paz hay en mi ser; Sí, en mi ser; me cambió y puede hacer lo mismo para ti. Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro"},{"t":"v","n":"2","x":"Ahora vivo solamente para mi Jesús, y para servir a los demás Quitó la venda de mis ojos y veo"},{"t":"c","x":"más y ahoquiero serle siempre fiel. Me cambió, me camluz y siempre mi amigo el será."}]},{"s":"Coros especiales","n":"8","t":"Allá en el cielo, allá en el cielo","p":"93","c":"","l":[{"t":"v","n":"1","x":"Allá enel cielo, allá enel cielo, allá enel cielo no habrá más llanto, ni mástristeza, ni másdolor; Y cuando estemos los redimidos allá en el cielo alabaremos al Señor. Letra y Música: Desconocido"}]},{"s":"Coros especiales","n":"9","t":"Amarte sólo a ti","p":"94","c":"","l":[{"t":"v","n":"1","x":"Amarte sólo a Ti, Señor, amarte sólo a ti, Señor; Amarte sólo a Tí, Señor, y no mirar atrás. Seguir tu caminar, Señor; Seguir sin desmayar, Señor; Postrado an te tu altar, Señor, y no mirar atrás. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Amarte sólo a Ti, Señor, siempre llevar tu cruz, Señor; Amarte sólo a Ti, Señor, y hacer tu voluntad. Al ","c":"","l":[{"t":"v","n":"1","x":"Aviva nuestros días como al principio, concéde nos volvamos al primer amor. Que las almas se salven y en fermos sanen y el fuego de tu Espíritu descienda hoy. Respóndenos Jehová, respóndenos Jehová que sepa este pueblo que tu eres Dios de Abraham,respondenos Jehová, respondenos Jehová que sepa este pueblo que tu eres Dios de Abraham Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro"}]},{"s":"Coros especiales","n":"16","t":"Ayúdamos, Ayúdanos","p":"99","c":"","l":[{"t":"v","n":"1","x":"Ayúdanos, Ayúdanos, Ayúdanos, Señor, Tu Pa labra sea cumplida, Ayúdanos, Ayúdanos Señor Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Bendícenos, Bendícenos, Bendícenos, Señor, Tu Palabra sea cumplida, Bendícenos, Bendícenos, Señor."}]},{"s":"Coros especiales","n":"17","t":"Bajo la sangre de Jesús","p":"99","c":"","l":[{"t":"v","n":"1","x":"Bajo la sangre de Jesús, Bajo la sangre de Jesús, Siempre bajo aquel raudal Guárdanos buen Señor Letra y Música: Desconocido"}]},{"s":"Coros especiales","n":"18","t":"Bellas palabras de vida","p":"100","c":"","l":[{"t":"v","n":"1","x":"Bellas palabras de vida son las de Cristo Jesús, ellas alientan mi vida, dan fortaleza y salud; Bellas palabras de vida, resplandecen en mi ser. Bellas palabras que nunca en la vida había yo escuchado hasta hoy. hoy. Letra y Música: Desconocido, Arr. Francisco Javier Corona Vázquez."}]},{"s":"Coros especiales","n":"19","t":"Bendición y honra","p":"100–101","c":"","l":[{"t":"v","n":"1","x":"Bendición y honra y gloria sea a Dios, y gloria sea a Dios, y gloria sea a Dios, Bendición y honra y gloria sea aDiospor la eternidad. Alabadle, adoradle, todos santos, todos. Alabadle, adoradle por la eternidad ¡Aleluya! Letra y Música: Desconocido, Arr. Francisco Javier Corona Vázquez."}]},{"s":"Coros especiales","n":"20","t":"Bendito seas Jehová la Roca","p":"101","c":"","l":[{"t":"v","n":"1","x":"Bendito seas Jehová la roca, Por toda la Eternidad, Mi es condedero y mi refugio Er "Coros especiales","n":"162","t":"Viene ya, viene ya","p":"206","c":"","l":[{"t":"v","n":"1","x":"Viene ya, viene ya, Mi Jesús viene ya, viene ya, Rodeado de gloria y majestad, En las nubes mi Jesús viene ya, Viene ya, viene ya, Mi Jesús viene ya, viene ya, Por su pueblo que le ama en verdad, En las nubes mi Jesús viene ya. Letra y Música: Desconocido"}]},{"s":"Coros especiales","n":"163","t":"Vine a alabar a Dios","p":"206–207","c":"","l":[{"t":"v","n":"1","x":"Vine a alabar a Dios, vine a alabar a Dios, Vine a alabar su santo nombre, vine a alabar a Dios. El vino a mi vida un día muy especial cambio mi corazón me enseño un camino mejor, y esa es la razón por la que canto yo Vine a alabar a Dios."}]},{"s":"Coros especiales","n":"164","t":"Voy al cielo, aleluya","p":"207","c":"","l":[{"t":"v","n":"1","x":"Voy al cielo ¡Aleluya! Es mi anhelo ¡Aleluya! Voy al cielo, voy al cielo; Voy al cielo ¡Aleluya! Es mi anhelo ¡Aleluya! Voy al cielo con mi Señor. Letra y Música: Desconocido"}]},{"s":"Coros especiales","n":"165","t":"Y en aquel día","p":"207","c":"","l":[{"t":"v","n":"1","x":"Y en aquel día diré a mi Cristo, valió la pena sufrir por ti. Y cuan do al fin veré su dulce rostro allí con gozo cantaré ¡Al fin vencí! Letra y Música: Desconocido, Arm. Isaac García Contreras"},{"t":"v","n":"2","x":"Y en aquel día veré a mi Cristo, en gloria eterna, llena de luz. Gozar de dichas mil, morando con Jesús, ¡Mi Dios, mi Salvador, mi eterno Rey!"}]},{"s":"Coros especiales","n":"166","t":"Y si vivimos","p":"208","c":"","l":[{"t":"v","n":"1","x":"Y si vivimos, para El vivimos, y si morimos, para El morimos, sea que vivamos o que muramos, somos del Señor, somos del Señor. ñor. Letra y música: Desconocido, Arm. Edgar Pineda Fierro"}]},{"s":"Coros especiales","n":"167","t":"Ya no hay tristeza","p":"208","c":"","l":[{"t":"v","n":"1","x":"Ya no hay tristeza en mundo para mí, ni del pecado soy esclavo como ayer; Si mi Jesús murió, su sangre derramó, a qué negarlo; yo soy suyo y mio es él. Letra y Música: Desconocido, Arm. Isaac García Contreras."}]},{"s":"Coros especiales","n":"168","t":"Ya salvo soy, ya salvo soy","p":"209","c":"","l":[{"t":"v","n":"1","x":"Hay un precio - - so manantial, de sangre de Jesús, que purifica a todo aquel que se sumerge en él. sangre de Cristo mi Señor; Por la sangre de Cristo mi Señor Por la Sangre de Cristo mi Señor, La sangre de Jesús Letra y Música: Sra. Jno. T. Benson."},{"t":"v","n":"2","x":"El malhechor se convirtió, pendiente de una cruz; él vio la fuente y se lavó, creyendo en Jesús."},{"t":"v","n":"3","x":"Y yo también mi pobre ser, allí logré lavar; la gloria de su gran poder, me goso en ensalzar."},{"t":"v","n":"4","x":"¡Eterna fuente carmesi! ¡raudal de puro amor! se lavará por siempre en ti, el pueblo del Señor."},{"t":"c","x":"Sí, salvo soy, sí, salvo soy, sí, salvo soy, sí, salvo soy. Por la"}]},{"s":"Coros especiales","n":"169","t":"Ya salvo soy, ya salvo soy","p":"210","c":"","l":[{"t":"v","n":"1","x":"Ya salvo soy, ya salvo soy, ¡Aleluya! y salvo soy; Mis culpas y pecados Por Cristo son borrados, ¡Aleluya! ya salvo soy."}]},{"s":"Coros especiales","n":"170","t":"Yo amo a Cristo, él es mi amigo","p":"210","c":"","l":[{"t":"v","n":"1","x":"Yo amo a Cristo, El es mi Amigo, Me ha salvado, me ha sanado; Poder me ha dado, Pues me ha llenado Del Santo Espíritu, fiel Consolador."}]},{"s":"Coros especiales","n":"170b","t":"Yo encontré en la Biblia sagrada","p":"210","c":"","l":[{"t":"v","n":"1","x":"Yo encontré en la Biblia sagrada una luz, sí, una luz. luz. Y esa luz es mi Jesús, el dueño de mi corazón. Letra y Música: Guadalupe Velasco"}]},{"s":"Coros especiales","n":"171","t":"Yo me alegré con los que me decian","p":"211","c":"","l":[{"t":"v","n":"1","x":"Yo me alegre con los que me decian, a la casa de Jehová iremos. remos, yo iré yo iré a la casa de Jehová yo iré, Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro"}]},{"s":"Coros especiales","n":"172","t":"Yo me deleito en el amor del Salvador","p":"211","c":"","l":[{"t":"v","n":"1","x":"Yo me deleito en el amor del Salvador Que me salvó del pecado y del error, Es por eso que sediento de su amor Yo me consagro a Él de todo corazón; Cristo bendito, has de mi alma un altar Para adorarte con devoción Para beber del agua de la vida, Y así saciar siempre mi corazón Letra y Música: Desconocido"}]},{"s":"Coros especiales","n":"173","t":"Yo quiero más y más de Cristo","p":"212","c":"","l":[{"t":"v","n":"1","x":"Yo quiero más y más de Cristo, yo quiero más de su poder, yo quiero más de tu presencia, yo quiero más y más de él Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro."}]},{"s":"Coros especiales","n":"174","t":"Yo quiero ser, Señor amante","p":"212","c":"","l":[{"t":"v","n":"1","x":"Yoquiero ser, Señor amante, como el barro enmanos del alfarero, toma mi vida y hazla de nuevo, yo quiero ser yo quiero ser, un vaso nuevo. Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro"}]},{"s":"Coros especiales","n":"175","t":"Yo quiero servirle","p":"212–213","c":"","l":[{"t":"v","n":"1","x":"Yo quiero servirle desde hoy, yo quiero servirle des de hoy; para recibir las bendiciones del Señor, necesito servirle desde hoy. Y el Señor Jesús con su poder nos sostendrá, y nos librará de todo mal en su bondad. Letra y Música: Desconocido, Arm. Isaac García Contreras."}]},{"s":"Coros especiales","n":"176","t":"Yo siento como que la gloria bajó","p":"213","c":"","l":[{"t":"v","n":"1","x":"Yo siento como que la gloria bajó, bajó del cielo bajó a quí; y a mí me da poder, y a mí me da poder, y a mí me da poder para poder vencer. Va bajando ya, va bajando ya, va bajando la gloria de Jehová; si la iglesia orando está, el Señor va a contestar, va bajando la gloria de Jehová. Letra y Música: Desconocido"}]},{"s":"Coros especiales","n":"177","t":"Yo tengo gozo en mi alma","p":"214","c":"","l":[{"t":"v","n":"1","x":"Yo tengo gozo en mi alma, gozo en mi alma, gozo en mi alma y en mi ser, son como ríos de agua viva, ríos de agua viva, ríos de agua viva en mi ser. Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro"}]},{"s":"Coros especiales","n":"178","t":"Yo soy testigo del poder de Dios","p":"214","c":"","l":[{"t":"v","n":"1","x":"Yo soy testigo del poder de Dios, muchos milagros él ha hecho en mí, pues era ciego y ahora veo la luz, la luz gloriosa la cual es Jesús. Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro"}]},{"s":"Coros especiales","n":"179","t":"Yo tengo gran gozo en mi corazón","p":"214–215","c":"","l":[{"t":"v","n":"1","x":"Yo tengo gran gozo en mi corazón, yo tengo gran gozo en mi corazón; Sí, Cristo me salvó, de gozo me llenó, yo tengo gran gozo en mi corazón. Ya mi copa reboza de gozo; ya mi copa reboza de gozo, ¡Oh! qué facil es orar, obedecer y confiar. Sí, mi copa reboza de gozo. Letra y Música: Desconocido"}]},{"s":"Coros especiales","n":"180","t":"Yo vivo Señor porque tú vives","p":"215–222","c":"","l":[{"t":"v","n":"1","x":"Yo vivo, Señor, por que tú vives; por que tú vives, Señor, es que yo vivo; tú me das gozo, me das consuelo, y en aflicciones Señor estás conmigo. Letra y Música: Adán Calderón, Francisco Javier Corona Vázquez."}]},{"s":"Himnario congregacional","n":"1","t":"A Cristo doy mi canto","p":"223–224","c":"Letra:    Tradicional; Música: Atribuido a Louis Bourgeois, en salterio de Ginebra, 1551; Letra:     Tradicional; Música: Jimmy Owens","l":[{"t":"v","n":"1","x":"A Cristo doy mi canto. Él salva el alma mía; Me libra del quebranto Y con amor me toria; Es nuestro anhelo santo Mirar, Jesús, tu gloria. Letra y Música: Philip Phillips A Dios el Padre Celestial, al Hijo nuestro Redentor y al Eternal Consolador, unidos todos alabad. Letra: Tradicional A Dios el Padre Celestial, al Hijo nuestro Redentor y al Eternal Consolador, unidos todos alabad. Letra: Tradicional"},{"t":"v","n":"2","x":"Jamás dolor ni agravios Enlutarán la mente, Si a Cristo nuestros labios Bendicen dulceCantad al trino y uno Dios, sus alabanzas entonad; su eterna gloria proclamad con gozo, gratitud y amor. Amén. Música: Atribuido a Louis Bourgeois, en salterio de Ginebra, 1551 Cantad al trino y uno Dios, sus alabanzas entonad; su eterna gloria proclamad con gozo, gratitud y amor. Música: Jimmy Owens"},{"t":"v","n":"3","x":"Tu nombre bendecido Alegra el alma mía; Tu nombre es en mi oído Dulcísima armo -"},{"t":"v","n":"4","x":"Viviendo he de ensalzarte, Y si abandono el suelo Veranme ir a adorarte Los ángeles del"},{"t":"c","x":"guía. mente. Ensalce nuestro canto Tu sacro santa Hiscielo."}]},{"s":"Himnario congregacional","n":"3","t":"A ti la gloria","p":"225","c":"Letra:    Edmon Budry, 1884.; Música: George F. Handel, de Judas Maccabaeus, Parte 3 No. 36, 1746.","l":[{"t":"v","n":"1","x":"A ti la gloria, ¡Oh, nuestro Señor! te alzaste pujante, lleno de poder, más que el sol radiante al amanecer. Letra: Edmon Budry, 1884."},{"t":"v","n":"2","x":"Gozo, alegría, reinen por doquier, ángeles cantando himnos al Señor, vanle aclamando como vencedor. Música: George F. Handel, de Judas Maccabaeus, Parte 3 No. 36, 1746."},{"t":"v","n":"3","x":"Libre de penas, nuestro Rey Jesús ¡Ha resucitado, ya no morirá! quien muera al pecado en Dios vivirá."},{"t":"c","x":"a ti la victoria, gran liberta dor. porque Cristo hoy día muestra su poder; rompe las cadenas de la esclavitud;"}]},{"s":"Himnario congregacional","n":"4","t":"Al Rey de los cielos, Jehová el glorioso","p":"226–227","c":"","l":[{"t":"v","n":"1","x":"Al Rey de los cielos Jehová el glorioso, Cantemos con gozo en santa comunión; Con gran reverencia a Él llegaremos, Su nombre enzalsemos de Letra y Música: Autor desconocido zón, Su sangre me lavó y aseguró mi salvación; vir. ¡Oh! gran dulce esperanza nos alienta para seguir La senda que el Maestro nos trazó con su ejemlo aquí; Allá en lontananza, al fin de la labor, Veremos la grandeza de nuestro Salvador."},{"t":"v","n":"2","x":"Con gran regocijo a Cristo alabemos, Al Hijo de Dios que nos dio la redención; Dejando su trono de gloria en los cielos Al mundo perdido brinvir, Su voluntad cumplir y para Él siempre vi"},{"t":"v","n":"3","x":"Al Santo Espíritu grata promesa, Daremos entrada en nuestro corazón; Sublime potencia, poder y grandeza, Al hombre levanta de"},{"t":"v","n":"4","x":"Al Trino Dios entonemos con gozo, Canciones de triunfo por su grande bondad; Por tus bendiciones recibe propicio mi humilde servicio, Di -"},{"t":"c","x":"todo corazón. dole salvación. Gozo y paz hay en mi coratriste condición. Es mi anhelo a mi Señor servina Trinidad."}]},{"s":"Himnario congregacional","n":"5","t":"Bendice, alma, a tu Creador","p":"228–233","c":"Música: Chas H. Gabriel; Letra:    Vicente Mendoza Polanco (1875-1955)","l":[{"t":"v","n":"1","x":"Bendice, alma a tu Creador Con férvida canción, Despierte y cante su loor Tu ardiente corazón. No olvides nunca su bondad Con negra in gratitud, Pues Él perdona tu maldad, Te salva y da salud. Letra: Vicente Mendoza Polanco (1875-1955) ¡Cantad, cantad al Rey de la Creación! ¡Vosotros, ángeles que Él creó Y hacéis su voluntad, Vosotras, obras que Él formó, Su nombre celebrad! Cantaremos alabanzas Al Eterno Creador, Por las bienaventuranzas Que nos brinda con amor; Levantemos nuestro canto, Cual perfume subirá Hasta el trono puro y santo Del bendito Jehová Letra y Música: Aquiles Mireles Perales, ICI ¡Salve, Señor increado! ¡Salve, Señor poderoso! Llévame a tu lado, Padre bondadoso. Sólo en Tí yo confío, Quiero seguirte fiel; Guíame, Dios mío Hasta el día final. Cantaremos alabanzas Al Eterno Creador; Por las bienaventuranzas Que nos brinda con amor; Levantemos nuestro canto, Cual perfume subirá, Hasta el trono puro y santo Del bendito Jehová. Letra y Música: Aquiles Mireles Perales, ICI. ¡Salve, Señor increado! ¡Salve, Señor Poderoso! Llévame a tu lado, Padre bondadoso, Sólo en Ti yo confio, quiero seguirte fiel; Guíame Dios mío Hasta el día final."},{"t":"v","n":"2","x":"De bien tu boca llena esté Y nueva juventud A tu alma siempre le dará, Calmando tu inquietud. En ira es lento para arder Mas pronto es en su amor; No quiere siempre contender, Ni dura su furor. Música: Chas H. Gabriel Elevemos nuestro canto De alabanza al Creador, Al gran Dios tres veces santo Alabemos con amor; Por su gracia inefable Le aLe adoramos con fervor, Por su amor inescrutable Bendecimos al Señor. Elevemos nuestro canto De alabanza al Creador, Al gran Dios tres veces santo Alabemos con amor; Por su gracia inefable Le adoramos con fervor; Por su amor inescrutable Bendecimos al Señor."},{"t":"v","n":"3","x":"Se acuerda que del polvo soy Formado en su poder, Que el hombre es flor tan sólo de hoy Que al sol va a perecer. Mas Él de siglo en siglo da Su amor sin limitar A todo aquel que listo está Sus leyes a guardar. Ensalzamos hoy tu nombre Por tu Dádiva, Señor, Para rescatar al hombre Diste al Hijo de tu Amor; Descendiendo a este mundo Nuestras culpas Él llevó, Pues que con amor profundo En la cruz por nos murió. Ensalzamos hoy tu nombre Por tu Dádiva, Señor; Para rescatar al hombre Diste al Hijo de tu amor; Descendiendo a este mundo Nuestras culpas Él llevó, Pues que con amor profundo En la cruz por nos murió."},{"t":"c","x":"¡Cantad, cantad dulcísima canción!"}]},{"s":"Himnario congregacional","n":"7","t":"Con cánticos, Señor","p":"234","c":"Letra:    Charles Wesley, 1746; trad. Merrel N. Hutchinson, 1877; Música: John Darwall","l":[{"t":"v","n":"1","x":"Con cánticos, Señor, Mi corazón y voz Te adoran con fervor ¡Oh! Trino, Santo Dios. te veré, Y galardón feliz tendré. Letra: Charles Wesley, 1746; trad. Merrel N. Hutchinson, 1877"},{"t":"v","n":"2","x":"Tu mano paternal Trazó mi senda aquí; Mis pasos cada cual, velados son por Tí. En tu mansión yo Música: John Darwall"},{"t":"v","n":"3","x":"Innumerables son Tus bienes, y sin par, Que por tu compasión Recibo sin cesar."},{"t":"v","n":"4","x":"Tú eres, ¡Oh Señor! Mi sumo, todo bien, Mil lenguas tu amor Cantando siempre estén."}]},{"s":"Himnario congregacional","n":"8","t":"Señor mi Dios","p":"235","c":"Letra:    Stuart K. Hine, 1948, basada en la poesía original de Carl Boberg, 1885, Trad. A.W. Hotton Rives; Música: Antigua melodía sueca, Arr. Stuart K. Hine, 1949","l":[{"t":"v","n":"1","x":"Señor mi Dios, al contemplar los cielos, el firmamento y las estrellas mil; al oír tu voz en los potentes zón entona la canción: ¡Cuán grande es Él! ¡Cuán grande es Él! Mi corazón entona la canción: ¡Cuán grande es Él! ¡Cuán grande es Él! Letra: Stuart K. Hine, 1948, basada en la poesía original de Carl Boberg, 1885, Trad. A.W. Hotton Rives"},{"t":"v","n":"2","x":"Al recorrer los montes y los valles y ver las bellas flores al pasar, al escuchar el canto de las Música: Antigua melodía sueca, Arr. Stuart K. Hine, 1949"},{"t":"v","n":"3","x":"Cuando recuerdo del amor divino que desde el cielo al Salvador envió, aquel Jesús que por salvarme"},{"t":"v","n":"4","x":"Cuando el Señor me llame a su presencia, al dulce hogar al cielo de esplendor, le adoraré cantando la gran -"},{"t":"c","x":"truenos y ver brillar el sol en su cenit. Mi coraaves y el murmurar del claro manantial. vino y en una cruz sufrió por mí y murió. deza de su poder y su infinito amor."}]},{"s":"Himnario congregacional","n":"9","t":"Dad al Padre toda gloria","p":"236","c":"Letra:    Tr. H. C. Ball, 1896; Música: Mrs. M.J. Harris","l":[{"t":"v","n":"1","x":"Dad al Padre toda gloria, Dad al Hijo todo ho nor, Y al Espíritu divino Alabanzas de loor. Adoradle, adoradle, Adorad al Salvador; (al Salvador; ) Tributadle toda gloria, Pueblo suyo por su grande amor. Letra: Tr. H. C. Ball, 1896"},{"t":"v","n":"2","x":"Adoradle, ¡Oh Iglesia! Por Jesús tu redentor Rescatada por su gracia, Libre por su grande amor. Yo te adoro, yo te adoro, Yo te adoro buen Jesús; (sí, buen Jesús; ) Yo te adoro reverente, ¡Oh, Cordero Santo de mi Dios! Música: Mrs. M.J. Harris"},{"t":"v","n":"3","x":"Entonadle un canto nuevo, Huestes libres del Señor; Tierra, cielos, mar y luna, Gloria den al Trino Dios."}]},{"s":"Himnario congregacional","n":"10
