z, con el poder de su amor nos guiara."},{"t":"v","n":"4","x":"Vivamos, si, en fraternidad, que Cristo pronto viene ya; Muy pronto se escuchará de la trompeta el sonar. Un grande gozo invadirá a los que con el se irán, Y mientras viene en gloria, ya buscamos siempre la fraternidad."},{"t":"c","x":"Adelante varones, en pos de Jesús, hasta alcanzar la gran virtud de ser llenos de su plenitud"}]},{"s":"Himnario congregacional","n":"333","t":"Fraternidad de Varones Felipe Sánchez Muñiz","p":"634–635","c":"Letra y Música: Noé Hernández Serrano, ICIAR, Arr. Isaí Torres Rivero","l":[{"t":"v","n":"1","x":"Esta fraternidad unida testifica de las bondades que nos da Cristo Jesús, en el cal vario dio su sangre y su vida para salvar y reno varal pecador, en Jesucristo el Caudillo de los siglos hemos hallado paz, amor, liberación, mar che mos prestos com par tiendo el mensa je que en Jesucristo sólo está la sal va ción."},{"t":"v","n":"2","x":"Nuestra familia cada día llevaremos en muy ferviente y perenne oración, con nuestros hijos y esposa estaremos en las moradas de la celestial mansión, promesas fieles hay para los vencedores que nunca cejan y fluctúan en la fe, sobre el pecado y la carne victoriosos al enemigo tú pondrás bajo tu pie."},{"t":"c","x":"Más precioso que el oro, oro de Ofir haces al varón que se acerca a ti, con gratitud y humildad trabajaremos dispuestos al servicio de nuestro Señor, triunfando siempre y venciendo viviremos dando la honra y gloria al Creador."}],"w":1},{"s":"Himnario congregacional","n":"334","t":"Fraternidad de Varones \"Guillermo Félix Cortés Ortíz\"","p":"636","c":"Est. 1 y 2; Est. 3; Letra y Música: Moisés Hernández Cruz","l":[{"t":"v","n":"1","x":"Al Dios y Padre Celestial nos hacercamos hoy, postrados para dar loor con nuestra adoración. Cantamos hoy con gran fervor a Nuestro Salvador, pues en su amor y su perdón nos dio la salvación."},{"t":"v","n":"2","x":"Varones esforzados, ser un testimonio fiel, de su poder y así vencer al enemigo cruel. Y si al pelear herido soy en esta lucha cruel, como soldado siempre fiel la lucha ganaré."},{"t":"v","n":"3","x":"Que con amor yo pueda hablar que sólo en Ti hay perdón Al pobre y triste pecador que vive en su dolor. Pues soy testigo del amor que de la cruz manó, la redención a mi llegó por gracia, buen Jesús."},{"t":"c","x":"Mi vida hoy la traigo ante tus pies para que tu la llenes de poder, Con Cristo a Tamaulipas ganaré, pues trabajar por Cristo es mi deber.\nLas buenas nuevas hoy anunciaré, Con gozo la semilla sembraré, Y aunque me cueste lágrimas lo sé, que un día a Jesucristo yo veré."}],"w":1},{"s":"Himnario congregacional","n":"335","t":"A trabajar ¡Oh! cristianos","p":"637","c":"Letra y Música: Francisco Sánchez Muñiz, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"A trabajar, ¡Oh cristianos! a combatir con fervor. Todos unidos estemos para luchar con valor como fieles gladiadores de Cristo nuestro Señor. vamos doquier, pregonando su divino amor."},{"t":"v","n":"2","x":"Siempre vayamos luchando, luchando contra Satán; en Jesucristo confiando, pues es nuestro capitán. él dará hermosa victoria a su redimida grey. Dad alabanzas y glorias a Jesús el Rey."},{"t":"v","n":"3","x":"Mas cuando oigamos gozosos la clarinada final, y Jesucristo triunfante, venga en gloria eternal; arrebatando en las nubes a toda su iglesia fiel; todo será paz y gozo por la eternidad."},{"t":"c","x":"Somos gladiadores, gladiadores de Cristo Jesús, que ahora pedimos la victoria para el Salvador. Siempre lucharemos por el quenos amó y nos redimió, hasta que lleguemos a su regia y excelsa mansión."}]},{"s":"Himnario congregacional","n":"336","t":"Himno de la familia pastoral","p":"638","c":"Letra: Ángel Ibarra Galindo, 2001.; Música: Variación del himno \"Soberano Señor de los Mundos\", Félix Gómez.; Himno oficial de la Iglesia Nacional Presbiteriana de México.","l":[{"t":"v","n":"1","x":"Somos siervos que Dios ha llamado, a este mundo para predicar; cuidaremos el bello legado, nuestro hermoso hogar pastoral."},{"t":"v","n":"2","x":"La armadura de Dios vestiremos para firmes poder resistir, apagando los dardos de fuego y las obras de mal destruir."},{"t":"v","n":"3","x":"Oraremos en todo momento por la iglesia de nuestro Salvador, esperando con gozo el momento la venida de nuestro Señor."},{"t":"c","x":"La familia cristiana unida la armadura de Dios vestirá, reflejando la imagen de Cristo, viviremos en integridad."}]},{"s":"Himnario congregacional","n":"337","t":"La juventud unificada","p":"639","c":"Letra y Música: Francisco Sánchez Muñiz, ICIAR.","l":[{"t":"v","n":"1","x":"La juventud unificada en torno del Señor Jesús, con su poder santificada iluminada por su luz; marcha con fuerza poderosa luchando en contra de Satán marcha de triunfo victoriosa con Cristo nuestro capitán."},{"t":"v","n":"2","x":"¡Oh juventud de Jesucristo! como Josué y como Caleb, marcha con fuego nunca visto ven hoy el sol a detener. Llenos del fuego sacrosanto el fuego de pentecostés llenos del Espíritu Santo muchas victorias obtendréis."},{"t":"v","n":"3","x":"¡Oh juventud de Jesucristo! como Josué y como Caleb, llevaron fruto nunca visto de donde fluye leche y miel. \"Estad en mí y yo en vosotros, porque sin mí nada haréis nos dice el Señor y Cristo \"y mucho fruto llevaréis\""},{"t":"c","x":"\"Josué y Caleb\" es la alianza Juvenil que está hoy de pie para dar batallas mil; \"Josué y Caleb\" con valor llenos de fe va luchando contra el mal con fuego celestial."}],"w":1},{"s":"Himnario congregacional","n":"338","t":"Juventud esforzada del Pacífico","p":"640–641","c":"Letra y Música: David González Navarro, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"En mi patria se oye la voz, del evangelio del Divino amor, que ha llamado sólo a valientes decididos a luchar. En el pacífico ha mostrado nuestro Padre Celestial, que en Cristo todo lo podemos en la batalla contra el mal."},{"t":"v","n":"2","x":"Sembremos hay que apresurar porque Cristo ala puerta está, no desmayes, sigue adelante nuestra patria a conquistar, levantemos tremol ante el amor y la santidad; la corona lista nos espera a Cristo hay que proclamar."},{"t":"v","n":"3","x":"En espíritu de fe y vigor, con tu fuerza marchamos Señor, en tu brazo sólo hemos confiado, tu nos has de sostener. Reforzamos la trinchera bendita de la oración, blandiendo en alto nuestra espada que es la palabra de Dios."},{"t":"c","x":"Esfuerzo es nuestro lema, no hay tiempo de dormitar, hablemos con nuestras vidas, hablemos con la verdad. Viva o muera yo soy de Cristo, ¡Aleluya he de triunfar!"}]},{"s":"Himnario congregacional","n":"339","t":"Lidia de Tiatira","p":"641–642","c":"Letra y Música: Santiago Lozada Rodríguez, Arr. Emmanuel H. Cruz Gutiérrez","l":[{"t":"v","n":"1","x":"Es la Van guardia fe me nil que mar cha fiel al la do del Señor, lle van do paz y sal va ción para las al mas per di das en el mal. Tes ti fi can do sin cesar del gran poder de mi Jesús que con su sangre nos compró en el ma de ro de la cruz."},{"t":"v","n":"2","x":"Hoy te in vi tamos pe ca dor, ¡Ven a las plan tas de Cristo mi Señor, entré ga le tuco razón y al can za rás de Cristo su perdón. No te de ten gas en venir pues Él te llama con a mor rin de tu vi da ante su altar y ob tendrás la sal va ción."},{"t":"v","n":"3","x":"Ya Cristo viene otra vez, para juzgar a es te mundo pe ca dor, y la Van guardia lis ta va para a nun ciar las gran de zas de su a mor. Lucha va lien te sin cesar si guien do fiel a tu Señor y un ga lar dón feliz tendrás allá en el reino ce les tial."},{"t":"c","x":"Lucha con valor, con fe paz y a mor; san ti dad y luz en el ser vicio del Señor."}],"w":1},{"s":"Himnario congregacional","n":"340","t":"Los mensajeros del Dios alto","p":"642–643","c":"Letra y Música: Benjamín Peña, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"Los mensajeros del Dios alto hoy se consagran, y con gran gozo vienen aquí, para gozarse juntamente con los santos y darle gracias al Dios de amor, por sus bondades recibidas a raudales. A eso venimos, a darle loor; nos permitiste Cristo bendito, dar el mensaje de Salvación."},{"t":"v","n":"2","x":"Con el mensaje que me has dado iré con gozo, puerta por puerta, mi buen Señor, ya por collados, ya por montes o por valles, Cual sembrador, iré a sembrar, esa simiente tan preciosa y tan celeste que tú me diste mi buen Jesús, para sembrarla en los corazones de aquellos que viven sin Dios."},{"t":"v","n":"3","x":"Toda mi vida prestamente te la entrego, para servirte mi Salvador, para anunciarles a los hombres el sendero, el gran camino de redención; para decirles solamente que tú salvas y tú perdonas al pecador; para anunciarles, Jesús bendito, que solamente tú eres amor."},{"t":"v","n":"4","x":"Hoy con gran gozo y en tu nombre echo las redes, que ya muy listas las tengo yo, para lanzarlas en el mundo prestamente, sacando peces para el Señor; y que haya gozo en el reino de los cielos y refrigerio lleve al Señor. Dame tu gracia, dame potencia y pecadores te traigo yo."},{"t":"c","x":"Embajadores del gran Rey, embajadores de Jesús, los que gozosos publicáis el evangelio de salud. Los que decís al pecador, que gran salud hay en la cruz; embajadores, embajadores de Jesús."}]},{"s":"Himnario congregacional","n":"341","t":"Somos los pescadores","p":"644","c":"Letra y Música: Julio Nuñez, Arm. Isaac García Contreras","l":[{"t":"v","x":"Somos los pescadores, es Jesús el capitán; arrancamos pecadores de las garras de Satán. Vamos pronto, compañeros, nuestras redes a lanzar; y con esfuerzo ligero, almas vamos a salvar. Las campanas en el cielo con gozo replicarán. Y aunque rujan los infiernos, las almas se salvarán. La victoria es segura y un galardón tendrás; y la corona de la vida en nuestras sienes brillará. Sí, brillará."}]},{"s":"Himnario congregacional","n":"342","t":"Luminares en el mundo","p":"645","c":"Letra: Angel Alberto Ibarra Galindo y Cesar Marín; Música: Angel Alberto Ibarra Galindo, ICIAR. Arr. Isaí Torres Rivero","l":[{"t":"v","n":"1","x":"La misión de nuestra alianza en la tierra es para compartir el mensaje de esperanza a los hombres que viven sin Dios."},{"t":"v","n":"2","x":"Como luminares vamos alumbrando a cada corazón, Debes cambiar tus caminos y también tu forma de actuar, con el Espíritu Santo alcanzaremos a toda nación. para que vean con tus hechos que en el mundo se puede brillar."},{"t":"v","n":"3","x":"Seamos irreprensibles y sencillos hijos del Señor, para alumbrar en el mundo anunciando de su Salvación."},{"t":"c","x":"Un luminar debes ser para que todos vean que en Jesús hay amor y que todos conozcan que la razón de vivir en Jesús"}],"w":1},{"s":"Himnario congregacional","n":"343","t":"¡Oh, juventud! que en Cristo estás","p":"646","c":"Himno de la alianza \"Mensajeros del Gran Rey\", Presbiterio Puebla y Tlaxcala; Letra y Música: Margarito Rodríguez, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"¡Oh, juventud! que en Cristo estás, sigue a Jesús con más valor; trae tu cruz en pos de él, él es tu guía siempre fiel. Todo tu ser entrega a él y gozarás su dulce amor; ríndete a él de corazón y te dará su bendición."},{"t":"v","n":"2","x":"Es tu misión la salvación de todo hombre pecador; lleva el mensa je de tu Señor que le brinda hoy su perdón. Y si en tu mi sión hay aflicción, él te dará consolación y te dará su gran poder, para vencer hoy a Satán."},{"t":"v","n":"3","x":"¡Oh, juventud! que en Cristo estás, sigue adelante con tu fe; Cristo Jesús lleva su paz, para calmar la tempestad. Si eres fiel, él te dará una corona más allá, en la mansión de eterna paz, donde con gozo llegarás."}]},{"s":"Himnario congregacional","n":"344","t":"Navegantes de fe y valor","p":"647","c":"Letra: Desconocido; Música: Alejandro Riquelme, Arr. Emmanuel H. Cruz Gutiérrez.","l":[{"t":"v","n":"1","x":"Es hora de partir, mar adentro, en el mar de la vida; Solo no podre ir mar adentro, mi vida peligra. Negras ondas de ansiedad, a mi barca podrán azotar, Mas Jesús me quiere guiar, y yo no quiero hacerlo esperar."},{"t":"v","n":"2","x":"Con Jesús enfrentaré la tormenta que trate de hundirme; Con fuerza me asiré de la mano del Cristo invencible Con mi Dios cruzaré arrecifes, ondas y torrentes, Hasta que con firme pie, entre al puerto de gloria esplendente."},{"t":"c","x":"Quiero sentir tu amor y volver a nacer. Quiero decirte \"Ven, mi barca es tuya\". Es tan inmenso el mar, pero contigo voy. No temo navegar si estas mi Dios."}],"w":1},{"s":"Himnario congregacional","n":"345","t":"Nuevo amanecer","p":"648–649","c":"Letra y Música: Noé Hernández Serrano, ICIAR, Arr. Isaí Torres Rivero","l":[{"t":"v","n":"1","x":"Por tu gracia nos llamaste y sos tienes, de las naciones nos has puesto por luz Trabajamos con denuedo pues ya"},{"t":"v","n":"2","x":"En mi patria amanecerá Jehová y toda ella verá su gran gloria, Milagros y sanidades siempre ha"},{"t":"v","n":"3","x":"En tu nombre lanzaremos la traina, muchas almas llevaremos a tu mies, y confiando en tu Palabra fiel di"},{"t":"c","x":"vienes proclamando que el que salva es Jesús. Oscuridad y tinieblas cubren la tierra más está alianza de intermedios brega, pregonando que hay un nuevo amanecer, porque México para Cristo debe de ser. México para Cristo, México para Cristo, México para Cristo debe de ser.\nbrá sólo en Cristo gozaremos de victoria. Oscuridad y tinieblas cubren la tierra más está alianza de intermedios brega, pregonando que hay un nuevo amanecer, porque México para Cristo debe de ser. México para Cristo, México para Cristo, México para Cristo debe de ser.\nvina segaremos diariamente en tu mies. Oscuridad y tinieblas cubren la tierra más está alianza de intermedios brega, pregonando que hay un nuevo amanecer, porque México para Cristo debe de ser. México para Cristo, México para Cristo, México para Cristo debe de ser."}],"w":1},{"s":"Himnario congregacional","n":"346","t":"¡Oh, Señor! a ti nos allegamos","p":"650–651","c":"Letra y Música: Aquiles Mireles Perales, ICI.","l":[{"t":"v","n":"1","x":"¡Oh, Señor! a ti nos allegamos lleno el corazón de gratitud, por tu gran amor hoy nos gozamos, por tus bienes en gran multitud; grande gozo nuestro ser inunda, lo sentimos todos por igual; tu misericordia nos circunda, bendecímoste ¡oh, Padre celestial!"},{"t":"v","n":"2","x":"Nuestras vidas hoy a ti traemos para que las uses hoy, Señor, y así las horas que tenemos te las dedicamos con amor; Salvador, acepta nuestras manos como instrumentos de tu amor, con nuestros pies, permite que corramos a servirte siempre, siempre con fervor."},{"t":"c","x":"Toma, Señor, hoy nuestro ser, lo consagramos solamente a tu loor; llénalo más de tu poder para llevar consuelo al pecador; oye, Señor, la petición de la Vanguardia Feme(o bien: (del remanente que hay a) nil, para anunciar la salvación con bendiciones mil y mil. (o bien: quí,))"}],"w":1},{"s":"Himnario congregacional","n":"347","t":"Paladines del Señor Jesucristo","p":"652–653","c":"Letra y Música: Rubén González Alvarado, ICIAR. Trans. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Paladines del Señor Jesucristo. Defensores de la fe, nuestro lema ha de ser, pelearé batallas contra el mal la victoria nos dará, son sus promesas si somos fieles siempre nos sostendrá."},{"t":"v","n":"2","x":"Paladines del Señor Jesucristo. tar del pe ca do y el error, a nun ciar de Cristo al pe ca dor nues pre di ca de a mor, con paso firme va es ta a lian za Cristo es el ca pi tán."},{"t":"v","n":"3","x":"Nues patria con quis"},{"t":"c","x":"Aleluya, Aleluya, alabad a nuestro Dios, Aleluya, Aleluya que su Hijo nos salvó, Aleluya, Aleluya que su Espíritu nos dio, ¡Joven alza tu voz a Cristo proclamad! mad! el Gran Rey vendrá, Él no tardará, si hasta la muerte fiel yo soy una corona me dará, me dará Aleluya, Aleluya, alabad a nuestro Dios, Aleluya, Aleluya que su Hijo nos salvó, Aleluya, Aleluya que su Espíritu nos dio, ¡joven alza tu voz a Cristo proclamad!"}],"w":1},{"s":"Himnario congregacional","n":"348","t":"Seguidoras de Jesús","p":"654","c":"Letra y Música: Catalina Muñoz, ICIAR, Isaí Torres Rivero","l":[{"t":"v","n":"1","x":"Adelante marcharemos con firmeza y con valor, para derrotar las fuerzas enemigas del Señor. Las mujeres de la costa del Estado de Veracruz sembraremos en los campos, con la ayuda del Señor."},{"t":"v","n":"2","x":"Man tenemos siempre alegres, aunque haya oscuridad; no cedas ni tengas miedo, Nuestro Dios nos sostendrá. Permanezcamos unidas con la espada del amor; y veremos resultados para gloria del Señor."},{"t":"v","n":"3","x":"Adelante, oh, vanguardias conducidas por Jesús; ganaremos a las almas con la historia de la cruz. Y cuando todo termine, nos veremos con Jesús. ¡Adelante, adelante Estado de Veracruz!"},{"t":"c","x":"Avancemos, pues, hermanas, no temamos a Satán. La victoria ganaremos Jesucristo nos guiará."}]},{"s":"Himnario congregacional","n":"349","t":"Juventud chiapaneca","p":"655","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Juventud chiapaneca hoy cantamos, este canto sublime de amor, a Jesús nuestras voces alzamos, sólo a él damos honra y loor. Porque ya nos limpió del pecado y nos dio libertad, vida y luz, con su sangre que allá en el calvario derramó con dolor en la cruz."},{"t":"v","n":"2","x":"Por Chiapas gozosos iremos predicando de Cristo el perdón, la victoria por él obtendremos, poderoso y fuerte es nuestro Dios; venid luego a la dura pelea, proclamad por doquier libertad; libertad, libertad para siempre, Jesucristo a mi Chiapas dará."},{"t":"c","x":"! Gloria! ¡gloria! resuene doquiera, ¡Gloria al Príncipe Eterno de paz! es la voz de las huestes guerreras que seguimos en pos de Jesús."}]},{"s":"Himnario congregacional","n":"350","t":"Seraías","p":"656","c":"Letra y Música: Elías González González, Misael González González, Norma Morales Juárez; Arreglo: Elías González González","l":[{"t":"c","x":"1. La alianza de intermedios Seraías Une su mano a Dios G E A D A D G G C D /C dado de Dios, lucharemos por este mundo pecador y venceremos llenos del Espíritu de Dios\nSon un ejemplo de amor, para sentir su presencia Dentro de su corazón dado de Dios, lucharemos por este mundo pecador y venceremos llenos del Espíritu de Dios\nal compartir la misión; en fe, espiritu y pureza, guiados por su salvador. Seraías soldado de Dios, lucharemos por este mundo pecador y venceremos llenos del Espíritu de Dios\neste mensaje de amor; no tardes en anunciarles el gran amor del Señor. (o bien: por fe veremos a Cristo, y nos dará un galardón) dado de Dios, lucharemos por este mundo pecador y venceremos llenos del Espíritu de Dios"}],"w":1},{"s":"Himnario congregacional","n":"351","t":"Servidores del Eterno","p":"657","c":"Letra y Música: Desconocido, Arr. Emmanuel H. Cruz Gutiérrez","l":[{"t":"v","n":"1","x":"Señor, toma mi vida nueva Antes de que la espera desgaste años en mi. Estoy dispuesto a lo que quieras, No importa lo que sea, tu llamame a servir."},{"t":"v","n":"2","x":"Te doy mi corazón sincero Para gritar sin miedo Lo grande que es tu amor. Señor tengo alma misionera, Conduceme a la tierra Que tenga sed de ti"},{"t":"v","n":"3","x":"Y así en mar cha iré cantando, Por pueblos predicando Tu grandeza, Señor. Tendré mis manos sin cansancio, Tu historia entre mis labios, Tu fuerza en la oración."},{"t":"c","x":"Llevame donde los hombres Necesiten tus palabras, Necesiten mas deseos de vivir; Donde faltela esperanza Donde todo sea triste; Simplemente por no saber de Ti. toy dispuesto a lo que quieras, No importa lo que sea, tu llamame a servir."}],"w":1},{"s":"Himnario congregacional","n":"352","t":"Somos más que vencedoras","p":"658","c":"Letra y Música: David Casas Estudillo, ICIAR, Arr. Isaí Torres Rivero","l":[{"t":"v","n":"1","x":"Somos más que vencedoras en el nombre de Jesús, somos"},{"t":"v","n":"2","x":"pra"},{"t":"v","n":"3","x":"Por la sangre de mi Cristo comda yo fui, por e"},{"t":"v","n":"4","x":"Cuan do estuve de caída mi Jesús me levantó, hoy yo"},{"t":"v","n":"5","x":"Cristo es única esperanza para la humanidad, Él es"},{"t":"c","x":"fieles servidoras de Cristo que murió en la cruz. Se gui remos alaban do al Divino Salvador, aún en luchas y aflicciones nuestro Dios es vencedor.\nso ahora predico \"Cristo vive y reina en. mi\". Se gui remos alaban do al Divino Salvador, aún en luchas y aflicciones nuestro Dios es vencedor.\nvivo agradecida de su amor que en mi mostró. Se gui remos alaban do al Divino Salvador, aún en luchas y aflicciones nuestro Dios es vencedor.\ndigno de alabanza por su amor y fiel bondad. Se gui remos alaban do al Divino Salvador, aún en luchas y aflicciones nuestro Dios es vencedor."}],"w":1},{"s":"Himnario congregacional","n":"352b","t":"La edad de oro","p":"659","c":"Letra y Música: Isaí Torres Rivero, 2003","l":[{"t":"v","n":"1","x":"Cristianos somos y con Cristo en nuestro corazón con mucho gozo solo queremos llegar a él."},{"t":"v","n":"2","x":"Muy bien sabemos que la vejez con nuestro Salvador es muy hermosa maravillosa viviendo con él."},{"t":"v","n":"3","x":"Tal vez cansados, tal vez enfermos, pero el Salvador, nos fortalece y nos sana con su poder."},{"t":"c","x":"La edad de oro camino en santidad viviendo mis días sólo para Dios la edad de Oro camino en santidad viviendo mis días sólo para Dios Dios."}],"w":1},{"s":"Himnario congregacional","n":"353","t":"Ya las vanguardias de Jesús se encuentran listas","p":"660–661","c":"Letra y Música: Esperanza Salinas, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"Ya las vanguardias de Jesús se encuentran listas, nos tomamos de la mano del Señor, y con él iremos a la conquista rescatando las almas del dolor, porque para mi el vivir es Jesucristo y el morir es ganancia bien lo sé; si vivimos, para el Señor vivimos; si morimos, para él somos también."},{"t":"v","n":"2","x":"Las vanguardias de Jesús pasan revista de las huestes que se aprestan a luchar y no temen jamás al enemigo pues con Cristo al frente triunfarán. Las vanguardias de Jesús están alerta anuncian do el evangelio de poder, investidos de potencia de lo alto ya se lanzan a luchar y a vencer."},{"t":"v","n":"3","x":"Las vanguardias de Jesús cantan victoria, pues de triunfo en triunfo siempre van escuchando al Maestro que nos dice: Adelante, adelante y triunfarás. La venida de Jesús está muy cerca, no durmamos que a la puerta Cristo está; las vanguardias con gozo los esperamos, que en las nubes por su iglesia viene ya."},{"t":"c","x":"Vanguardias de Jesús es tiempo de luchar, la espada de la fe en vuestras manos empuñad. Vanguardias de Jesús, la trompeta suena ya. Vanguardias a luchar, con gozo pregonad las nuevas de Jesús el Rey."}]},{"s":"Himnario congregacional","n":"354","t":"La juventud se acerca a tus pies","p":"662–663","c":"Letra y Música: Leonardo Flores, ICIAR","l":[{"t":"v","n":"1","x":"La juventud se acerca a tus pies mi Salvador, pidiendo de tu ayuda y tu sublime amor; seremos victoriosos si a nuestro lado va, el brazo poderoso de nuestro Rey Jehová."},{"t":"v","n":"2","x":"La vida espiritual de muchos jóvenes que ayer llevaron muy en alto el Santo nombre de Jesús, nos sirve cual antorcha para seguir con fervor las grandes enseñanzas de Cristo allá en la cruz."},{"t":"v","n":"3","x":"Ejemplos los tenemos de gran fidelidad, de jóvenes que leales sirvieron al Señor, pues él lo recogió estando en plena actividad, y con fe y heroísmo lucharon con valor."},{"t":"v","n":"4","x":"¡Oh, jóvenes hermanos la hora suena ya! Jesús nos llama a todos a toque de reunión. Levantad la bandera en nombre del Señor; con los brazos abiertos nos espera el Salvador."},{"t":"c","x":"Vidas llenas de Cristo se necesitan para triunfar contra el mal, vidas que siempre listas sepan oír la voz de Cristo el capitán; vidas que estén bien dispuestas a darlo todo por la causa del Señor, ¡Jóvenes! mirad el abismo donde muchos esperan oír de tus labios que Dios es amor."}]}];
const SC={"Himnario infantil":"HI","Coros especiales":"HE","Himnario congregacional":"HC"};
const N=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
D.forEach((h,i)=>{h.i=i;h.k=N(h.t+' '+h.l.map(x=>x.x).join(' '))});
const secs=[...new Set(D.map(h=>h.s))];const fs=document.getElementById('fs');
secs.forEach(s=>fs.add(new Option(s,s)));const m=document.getElementById('m'),q=document.getElementById('q');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function item(h){return `<div class="it" onclick="show(${h.i})"><span class="num">${h.n}</span><span><span class="tag">${SC[h.s]||''}</span>${esc(h.t)}</span></div>`}
function home(){q.value='';location.hash='';m.innerHTML='<h2>Secciones</h2>'+secs.map(s=>{const a=D.filter(h=>h.s==s);return `<div class="sec" onclick="sec('${s}')">${s} (${SC[s]})<small>Nº ${a[0].n} – ${a[a.length-1].n} · ${a.length} himnos</small></div>`}).join('')+'<h2>Índice alfabético</h2>'+[...D].sort((a,b)=>a.t.localeCompare(b.t,'es')).map(item).join('')}
function sec(s){fs.value=s;m.innerHTML=`<h2>${s}</h2>`+D.filter(h=>h.s==s).map(item).join('');scrollTo(0,0)}
function search(){const v=N(q.value.trim()),f=fs.value;if(!v){f?sec(f):home();return}
let r=D.filter(h=>!f||h.s==f);
if(/^\d+[a-z\-]*$/.test(v))r=r.filter(h=>N(h.n).replace('-','').startsWith(v.replace('-','')));
else{const w=v.split(/\s+/);r=r.filter(h=>w.every(x=>h.k.includes(x)))}
m.innerHTML=`<p class="sn">${r.length} resultado(s)</p>`+r.slice(0,400).map(item).join('')}
function jump(){const v=N(document.getElementById('jn').value.trim());const f=fs.value;
const h=D.find(h=>(!f||h.s==f)&&N(h.n)==v)||D.find(h=>N(h.n)==v);if(h)show(h.i);else alert('No encontrado')}
function show(i){const h=D[i];location.hash=i;const w=N(q.value.trim()).split(/\s+/).filter(x=>x.length>2&&!/^\d/.test(x));
const hl=t=>{let s=esc(t);return s};
m.innerHTML=`<p class="sn">${h.s} · Página ${h.p}</p><h2>${h.n}. ${esc(h.t)}</h2>`+h.l.map(x=>x.t=='c'?`<div class="c"><b>Coro:</b> ${hl(x.x)}</div>`:`<div class="v">${x.n?`<b>${x.n}.</b> `:''}${hl(x.x)}</div>`).join('')+(h.c?`<p class="cr">${esc(h.c)}</p>`:'')+(h.w?`<p class="cr">⚠ Letra aún no revisada a mano contra la partitura; puede contener errores.</p>`:'')+
`<div class="nav"><button ${i?'':'disabled'} onclick="show(${i-1})">◀ Anterior</button><button onclick="history.length>1?search():home()">Lista</button><button ${i<D.length-1?'':'disabled'} onclick="show(${i+1})">Siguiente ▶</button></div>`;scrollTo(0,0)}
const hs=parseInt(location.hash.slice(1));isNaN(hs)?home():show(hs);
</script></body></html>
