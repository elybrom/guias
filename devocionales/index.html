"Que hace rico al sabio", "Que hace sabio al sencillo", "Que reemplaza a los jueces", "Que calla los hechos vergonzosos de Israel"], "a": 1, "exp": "RVR1960. Jueces muestra lo que ocurre cuando cada uno sigue su criterio; el Salmo 19, por qué se necesita esa Palabra fiel. «Sencillo» no es, necesariamente, falta de estudios."}]}, {"n": 20, "title": "Guerra civil con Benjamín", "teaser": "Israel se reúne en Mizpa, Benjamín no entrega a los culpables, y una guerra entre hermanos casi borra una tribu.", "aviso": "Este capítulo continúa el relato de Jueces 19 y describe una guerra devastadora. Lo leemos con sobriedad, distinguiendo lo que el narrador cuenta de lo que Dios aprueba o no en cada gesto del pueblo.", "contexto": "La convocatoria que salió con las doce partes reúne a la congregación «como un solo hombre», desde Dan hasta Beerseba, y Galaad, delante de Jehová en Mizpa (20:1). Mizpa de Benjamín es un lugar de asamblea; no hay que confundirla automáticamente con la Mizpa de Galaad del relato de Jefté. El arca del pacto está, en esos días, en Bet-el (la «casa de Dios»), y Finees hijo de Eleazar, hijo de Aarón, ministra delante de ella (20:26-28). Ese dato —un nieto de Aarón en funciones— sugiere, para muchos lectores, que este episodio se sitúa temprano en el período de los jueces, aunque el libro lo haya colocado al final por su tema. Es una observación de lectura, no una fecha exacta que el texto nos dé.", "resumen": "El levita narra lo ocurrido (20:4-7). Conviene comparar su versión con el capítulo 19: se presenta como víctima y no menciona que él mismo sacó a la concubina. Israel pide a Benjamín que entregue a los hombres perversos de Gabaa; Benjamín no quiere escuchar y reúne un ejército, incluidos setecientos zurdos de elite. Israel consulta a Jehová: ¿quién subirá primero? La respuesta: Judá (eco de 1:1-2). El primer día caen veintidós mil de Israel; el segundo, dieciocho mil. Benjamín vence dos veces. Entonces todo el pueblo sube a Bet-el, llora, ayuna hasta la noche, ofrece holocaustos y ofrendas de paz, y vuelve a preguntar, ahora con el arca y con Finees. Jehová dice: «Subid, porque mañana yo os los entregaré» (20:28). Al tercer día, con una emboscada, Gabaa es tomada y arde. Caen unos veinticinco mil benjamitas; seiscientos huyen a la peña de Rimón y se quedan cuatro meses. Israel vuelve sobre las ciudades de Benjamín y las hiere con dureza (20:48).", "versiculos": [{"ref": "Jueces 20:26-28", "texto": "Entonces subieron todos los hijos de Israel, y todo el pueblo, y vinieron a la casa de Dios; y lloraron, y se sentaron allí en presencia de Jehová, y ayunaron aquel día hasta la noche; y ofrecieron holocaustos y ofrendas de paz delante de Jehová. Y los hijos de Israel preguntaron a Jehová (pues el arca del pacto de Dios estaba allí en aquellos días, y Finees hijo de Eleazar, hijo de Aarón, ministraba delante de ella en aquellos días), y dijeron: ¿Volveremos aún a salir contra los hijos de Benjamín nuestros hermanos, para pelear, o desistiremos? Y Jehová dijo: Subid, porque mañana yo os los entregaré."}], "dificiles": "Israel tiene razón en su indignación moral, pero el libro entero ha mostrado que no es un pueblo inocente: acaba de narrar idolatría en Dan y el culto de Micaía. Consultan a Dios desde el primer día, y aun así son derrotados dos veces. El texto no explica con un versículo el «porqué» de esas derrotas; una interpretación prudente —no un dogma— es que ellos también necesitaban llorar, ayunar y reconocer que Benjamín era «nuestro hermano» (la fórmula aparece en la tercera consulta, 20:23 y 20:28), no solo un enemigo a aplastar. Jehová, al fin, entrega a Benjamín: el narrador lo dice. Eso no convierte el versículo 48, de una devastación casi total, en una escena para celebrar. El cap. 21 mostrará el duelo y las soluciones torcidas que siguen. Sobre el discurso del levita: leer 19 y 20 juntos es un ejercicio de observación: lo que se omite también habla. Los setecientos zurdos (20:16) recuerdan a Aod, el benjamita zurdo del cap. 3: una elite de la misma tribu, ahora contra sus hermanos.", "conexiones": "Jueces 1:1-2 (Judá sube primero, otra vez); Jueces 19 (los hechos y el relato del levita); Josué 22 y Jueces 12 (conflictos entre tribus, con desenlaces distintos); 1 Samuel 7 y 10 (Mizpa, más adelante, como lugar de asamblea); Oseas 10:9. El casi exterminio de Benjamín hará aún más notable, en libros posteriores, que de esa tribu salga el primer rey, Saúl, de Gabaa (1 Samuel 9–11): una conexión canónica para el lector de toda la Escritura, no un dato que Jueces 20 mencione.", "observacion": "Hay consultas a Jehová, derrotas, llanto, ayuno, sacrificios, una tercera palabra de Dios, una emboscada, un remanente de seiscientos. El narrador cuenta cifras altas de muertos en ambos lados. Benjamín prefiere la guerra a entregar a los culpables de Gabaa. Israel prefiere, al final, una campaña que deja la tribu al borde de desaparecer.", "interpretacion": "Una causa justa puede pelearse de un modo que el cap. 21 revelará como trágico. Dios no está mudo: habla, y al tercer día entrega. El pueblo, sin embargo, sigue siendo el pueblo de «cada uno hacía lo que bien le parecía»: su unidad contra Benjamín no equivale aún a la sabiduría del Salmo 19. El silencio de dos derrotas los lleva a Bet-el de otra manera: no solo a preguntar, sino a llorar y ayunar.", "doctrina": "Dios es juez también en las guerras internas de su pueblo. Consultarlo importa; consultarlo con un corazón quebrantado, aún más. La solidaridad tribal que protege a los culpables (Benjamín) es una forma de complicidad. La justicia que casi aniquila a una tribu entera deja una herida que el siguiente capítulo no sabrá curar bien. La Palabra, otra vez, describe y nos obliga a pensar; no nos pide aplaudir cada espada.", "aplicacion": "Indignarse ante el mal es necesario; sentirse el bando puro, después de un libro entero de apostasía, es peligroso. Antes de «salir a pelear» en una iglesia, en una familia o en un ministerio, pregunta, llora y ayuna, y llama al otro «hermano» de verdad. No cubras al culpable por ser de tu tribu. Y no cuentes una historia, como el levita, donde tu parte fea ha sido recortada.", "preguntas": ["¿Qué diferencias observas entre lo que ocurrió en el capítulo 19 y lo que el levita cuenta en el 20?", "¿Qué cambia, en la tercera consulta, respecto de las dos primeras?", "¿Qué nos dice la presencia de Finees y del arca, y qué no nos deja datar con exactitud?", "¿Cómo se puede buscar justicia sin repetir una guerra que deja a una tribu con seiscientos hombres?"], "oracion": "Señor, tú hablas, y tú entregas cuando es tiempo. Enséñanos a consultar te con corazón humilde, a no proteger el mal por lealtad de clan, y a no olvidar que el otro es nuestro hermano. Que tu Palabra fiel, no nuestro furor, nos haga sabios. En el nombre de Jesús, amén.", "quiz": [{"q": "Cuando Israel consulta quién subirá primero contra Benjamín, Jehová responde:", "opts": ["Efraín", "Judá", "Leví", "Dan"], "a": 1, "exp": "20:18, eco de Jueces 1:1-2: otra vez Judá."}, {"q": "¿Cuántas veces es derrotado Israel antes de que Jehová diga «mañana yo os los entregaré»?", "opts": ["Ninguna: ganan de inmediato", "Dos veces, con gran pérdida; al tercer día, tras llanto y ayuno, viene esa palabra", "Siete días, como Jericó", "Una sola vez"], "a": 1, "exp": "20:21-28. Las dos derrotas y el ayuno en Bet-el son parte central del relato."}, {"q": "¿Quién ministraba delante del arca, según 20:28?", "opts": ["Samuel", "Finees hijo de Eleazar, hijo de Aarón", "Elí", "Jonatán hijo de Gersón"], "a": 1, "exp": "El dato sitúa el episodio, para muchos lectores, temprano en el período; el libro, temáticamente, lo coloca al final."}, {"q": "¿Cuántos benjamitas huyen a la peña de Rimón?", "opts": ["Cuarenta y dos mil", "Seiscientos", "Setecientos zurdos solamente", "Doce mil"], "a": 1, "exp": "20:47: seiscientos hombres. El cap. 21 partirá de ese remanente."}]}, {"n": 21, "title": "Esposas para Benjamín, y el verso que lo explica todo", "teaser": "Un juramento temerario, dos «soluciones» peores, y la frase final: cada uno hacía lo que bien le parecía.", "aviso": "El desenlace incluye más violencia y el rapto de jóvenes en Silo. El narrador no lo celebra. Lo leemos como el cierre de una degradación, a la luz de Jueces 21:25 y del Salmo 19.", "contexto": "Israel había jurado en Mizpa: ninguno dará su hija a Benjamín por mujer (21:1). Tras la matanza, el pueblo se sienta en Bet-el, delante de Dios, y llora: «¿Por qué, oh Jehová Dios de Israel, ha sucedido esto en Israel, que falte hoy de Israel una tribu?» (21:3). Están ante las consecuencias de su juramento y de su espada. Silo, donde está la casa de Dios y donde hay una fiesta anual, será el escenario de la segunda «solución». El libro se cierra con la clave que ya habíamos oído en 17:6, 18:1 y 19:1.", "resumen": "El pueblo ofrece sacrificios y pregunta cómo conservar una heredad para los que escaparon. Como habían jurado no darles hijas, buscan quién no subió a Mizpa: Jabes de Galaad no vino. Envían doce mil hombres, hieren a Jabes, y reservan cuatrocientas doncellas, que traen al campamento en Silo. Aún faltan mujeres para los seiscientos (doscientos quedan sin mujer). Entonces idean un recurso: en la fiesta anual de Jehová en Silo, las hijas salen a danzar; los de Benjamín emboscan y cada uno arrebata mujer. A los padres y hermanos que reclamen, la asamblea les dirá que tengan misericordia: no fueron ellos quienes las «dieron», de modo que el juramento, en su letra, no se quebraría. Benjamín vuelve a su heredad, reedifica y habita. El libro termina: «En estos días no había rey en Israel; cada uno hacía lo que bien le parecía» (21:25).", "versiculos": [{"ref": "Jueces 21:25", "texto": "En estos días no había rey en Israel; cada uno hacía lo que bien le parecía."}, {"ref": "Salmos 19:7-8", "texto": "La ley de Jehová es perfecta, que convierte el alma;\nEl testimonio de Jehová es fiel, que hace sabio al sencillo.\nLos mandamientos de Jehová son rectos, que alegran el corazón;\nEl precepto de Jehová es puro, que alumbra los ojos."}], "dificiles": "Las dos «soluciones» —la matanza de Jabes de Galaad y el rapto de las que danzaban en Silo— son moralmente graves. El texto no las alaba ni las presenta como idea de Jehová. Son el ingenio de un pueblo que intenta reparar un juramento temerario con más violencia y con un resquicio legal («no se las dimos; las tomaron»). Esa casuística no es un modelo de ética; es parte de la denuncia. El llanto de 21:2-3 es real: hay dolor por la tribu que falta. El dolor, sin la sabiduría de la Palabra, no basta para engendrar un buen remedio. El estribillo final no es un simple dato político: es la tesis del epílogo y, en buena medida, del libro. Observación: el narrador señala la ausencia de rey. Interpretación canónica, que hay que etiquetar como tal: muchos lectores cristianos ven aquí una preparación para el rey conforme al corazón de Dios (la línea de David, que el libro de Rut, «en los días que gobernaban los jueces», comenzará a iluminar) y, en última instancia, para Cristo, el Rey justo. Eso es lectura del conjunto de la Escritura, no una frase que Jueces 21 escriba con ese nombre.", "conexiones": "Jueces 17:6; 18:1; 19:1; 21:25 (el estribillo). Jueces 11 (otro voto que ata y duele). Números 30 y Eclesiastés 5 (el peso de los votos). Rut 1:1 («en los días que gobernaban los jueces»): el libro siguiente, en el canon, abre una historia de lealtad, providencia y linaje, en el mismo período, con un contraste que el lector atento puede percibir. 1 Samuel 8–16 (el pueblo pedirá un rey; Dios dará, primero, un rey de Benjamín, de Gabaa, y luego a David). Salmo 19:7-11: la Palabra que convierte, hace sabio, alegra, alumbra y advierte. Esta es la conexión pastoral que da sentido a haber leído, sin maquillaje, Jueces 19–21: la Biblia no disimula la maldad humana; por eso su testimonio es fiel, y por eso el sencillo —tenga o no muchos estudios— necesita esa Palabra, no su propio criterio.", "observacion": "Hay un juramento, un llanto, un censo de ausentes, una matanza «remedial», un rapto en una fiesta de Jehová, un argumento legal, un retorno a la heredad, y una frase final. Nadie en el capítulo es presentado como el sabio de la historia. El narrador cierra el libro, no con un «y vivieron en paz», sino con el diagnóstico.", "interpretacion": "Cuando cada uno hace lo que bien le parece, incluso la religión (un juramento, una fiesta de Jehová, una asamblea «delante de Dios») puede servir a planes torcidos. Jueces no termina con un héroe, sino con una necesidad: una autoridad distinta de nuestro parecer. El Salmo 19 nombra esa autoridad: la ley, el testimonio, los mandamientos, el precepto, el temor y los juicios de Jehová. Jueces es lo que ocurre cuando eso falta; el Salmo, por qué no puede faltar.", "doctrina": "La Escritura es verdadera al relatar el pecado de su propio pueblo. Dios no queda atado a los juramentos necios ni a las trampas legales con que se pretende cumplirlos. El gobierno de Dios —y, en el arco de la Biblia, el Rey que Él da— es la respuesta a la anarquía moral, no un adorno institucional. Distinción: observar que «no había rey» no es todavía toda la doctrina del reino; interpretar ese vacío a la luz de David y de Cristo es legítimo si se declara como interpretación canónica. Aplicar esto a la iglesia no es tomar la espada, sino someternos a la Palabra fiel que hace sabio al sencillo.", "aplicacion": "Cuidado con los votos hechos en caliente y con los atajos para «cumplirlos» sin arrepentirnos de verdad. Cuidado con usar una fiesta santa, un ministerio o un argumento fino para conseguir lo que ya nos juramos no hacer de otra manera. Y hay una aplicación gozosa: no estamos abandonados a nuestro parecer. Tienes, como Eli, la Palabra que convierte el alma, alegra el corazón y alumbra los ojos. Léela entera, también los capítulos difíciles, y deja que te haga sabia. El libro de Jueces, cerrado este versículo, pide una continuación: no solo un rey, sino un pueblo que escuche.", "preguntas": ["¿Qué problema crea el juramento de Mizpa, y cómo intentan resolverlo? ¿Lo resuelven de veras?", "¿Por qué 21:25 es una conclusión, y no solo una repetición?", "¿Cómo se relacionan Jueces 19–21 y Salmo 19:7-11, sin forzar ninguno de los dos textos?", "Después de leer Jueces entero, ¿qué significa para ti no hacer «lo que bien te parece», sino lo que dice el testimonio fiel de Jehová?"], "oracion": "Jehová, en estos días no queremos ser un pueblo que hace lo que bien le parece. Tu ley es perfecta, que convierte el alma; tu testimonio es fiel, que hace sabio al sencillo. Hemos visto, en este libro, hasta dónde llegamos sin ti. Perdona nuestros juramentos temerarios y nuestros atajos. Danos un corazón que se someta a tu Palabra, y a tu Rey. En el nombre de Jesús, amén.", "quiz": [{"q": "¿Qué habían jurado en Mizpa respecto de Benjamín?", "opts": ["Que le darían el trono", "Que ninguno daría su hija a Benjamín por mujer", "Que reconstruirían Gabaa", "Que irían a Jabes a pedir ayuda"], "a": 1, "exp": "21:1, 21:7, 21:18. Ese juramento, más la matanza, crea el dilema del capítulo."}, {"q": "¿Cuáles son las dos «soluciones» que idean para dar mujeres a los seiscientos?", "opts": ["Comprarlas en Sidón y en Moab", "Herir a Jabes de Galaad y reservar doncellas, y luego arrebatar a las que danzaban en la fiesta de Silo", "Pedirlas a Judá y a Efraín", "Anular el juramento en Silo con un sacrificio"], "a": 1, "exp": "21:8-23. El narrador no presenta esos recursos como idea de Jehová ni como modelo."}, {"q": "El versículo final del libro (21:25) afirma que…", "opts": ["Israel por fin tuvo paz permanente", "En estos días no había rey en Israel; cada uno hacía lo que bien le parecía", "Finees fue coronado", "Benjamín fue borrado para siempre"], "a": 1, "exp": "RVR1960, idéntico en sustancia a 17:6. Es la clave del epílogo y el cierre del libro."}, {"q": "La conexión pastoral con Salmo 19:7 enseña, en sustancia, que…", "opts": ["Jueces contradice a los Salmos", "Jueces muestra lo que ocurre cuando cada uno sigue su criterio, y el Salmo 19, por qué se necesita una Palabra fiel que haga sabio al sencillo", "Solo los académicos pueden entender Jueces 19–21", "El levita es el «sencillo» del salmo"], "a": 1, "exp": "Esa es la conexión: no forzada, sino de contraste. La Biblia no disimula la maldad; su testimonio es fiel, y el sencillo —tenga o no muchos estudios— necesita esa Palabra."}]}]
</script>

(function () {

  function addDays(iso, n) {
    var p = iso.split("-").map(Number);
    var dt = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));

  function dayDiff(a, b) {
    var pa = a.split("-").map(Number), pb = b.split("-").map(Number);
    var da = Date.UTC(pa[0], pa[1] - 1, pa[2]);
    var db = Date.UTC(pb[0], pb[1] - 1, pb[2]);

    };

      if (typeof d.prefPresent !== "boolean") d.prefPresent = false;

  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var OT = [["Génesis",50],["Éxodo",40],["Levítico",27],["Números",36],["Deuteronomio",34],["Josué",24],["Jueces",21],["Rut",4],["1 Samuel",31],["2 Samuel",24],["1 Reyes",22],["2 Reyes",25],["1 Crónicas",29],["2 Crónicas",36],["Esdras",10],["Nehemías",13],["Ester",10],["Job",42],["Salmos",150],["Proverbios",31],["Eclesiastés",12],["Cantares",8],["Isaías",66],["Jeremías",52],["Lamentaciones",5],["Ezequiel",48],["Daniel",12],["Oseas",14],["Joel",3],["Amós",9],["Abdías",1],["Jonás",4],["Miqueas",7],["Nahúm",3],["Habacuc",3],["Sofonías",3],["Hageo",2],["Zacarías",14],["Malaquías",4]];
  var NT = [["Mateo",28],["Marcos",16],["Lucas",24],["Juan",21],["Hechos",28],["Romanos",16],["1 Corintios",16],["2 Corintios",13],["Gálatas",6],["Efesios",6],["Filipenses",4],["Colosenses",4],["1 Tesalonicenses",5],["2 Tesalonicenses",3],["1 Timoteo",6],["2 Timoteo",4],["Tito",3],["Filemón",1],["Hebreos",13],["Santiago",5],["1 Pedro",5],["2 Pedro",3],["1 Juan",5],["2 Juan",1],["3 Juan",1],["Judas",1],["Apocalipsis",22]];
  var GROUPS = [
    { name: "Prólogo militar", ch: [1] },
    { name: "Prólogo teológico", ch: [2] },
    { name: "Los primeros libertadores", ch: [3] },

  ];
  var INTRO = {
    titulo: "Jueces",
    sub: "Cuando cada uno hacía lo que bien le parecía",
    autor: "El libro no nombra a su autor. La tradición judía (Talmud, Baba Batra 14b) lo atribuye al profeta Samuel. Lo que sí se puede observar en el texto es que se escribió cuando ya había monarquía en Israel: el narrador explica, una y otra vez, «en estos días no había rey en Israel». Eso es una observación del propio libro, no una especulación.",
    fecha: "Los acontecimientos se sitúan después de la muerte de Josué y antes del establecimiento de la monarquía. Las fechas absolutas (siglos XIV–XI a.C., según la cronología que se adopte) varían entre los estudiosos; el libro mismo no da un año de calendario. Al sumar de forma estrictamente consecutiva los años de opresión y de reposo que el relato menciona, el total es largo; muchos lectores consideran que algunos jueces pudieron ser contemporáneos en distintas regiones. El texto no resuelve esa cuestión: la dejamos como cautela de lectura, no como hecho demostrado.",
    periodo: "El período de los jueces: Israel ya está asentado en Canaán, aún no hay rey, y el santuario de la época aparece asociado a Silo (Jueces 18:31). Rut 1:1 sitúa también su historia «en los días que gobernaban los jueces».",
    tema: "El narrador formula el ciclo en Jueces 2:11-19: Israel hace lo malo y sirve a otros dioses; Jehová los entrega a enemigos; ellos claman; Él, movido a misericordia, levanta un juez y está con él; al morir el juez, el pueblo se corrompe más que sus padres. El epílogo (17–21) añade el estribillo: «En estos días no había rey en Israel; cada uno hacía lo que bien le parecía» (17:6; 21:25, RVR1960). El libro describe, no aprueba, la degradación. En contrapeso, el Salmo 19:7 declara: «El testimonio de Jehová es fiel, que hace sabio al sencillo».",
    estructura: "Doble prólogo: militar (1:1–2:5) y teológico (2:6–3:6). Ciclos de los jueces (3:7–16:31). Doble epílogo: caos religioso (17–18) y caos moral y social (19–21). Se suele contar a doce jueces: Otoniel, Aod, Samgar, Débora, Gedeón, Tola, Jair, Jefté, Ibzán, Elón, Abdón y Sansón. Abimelec, hijo de Gedeón, se alza como rey usurpador; el texto no lo presenta con la fórmula «Jehová levantó un libertador».",
    como: "Lee primero el capítulo entero en la Reina-Valera 1960 (el enlace va a Bible Gateway). Luego trabaja las tarjetas en este orden: contexto, resumen, versículos, pasajes difíciles, conexiones, y recién entonces observación, interpretación, doctrina y aplicación. No mezcles esos niveles. Las preguntas y la oración cierran el tiempo. El cuestionario es para repasar, no para competir."

  var TIMELINE = [

  var DAILIES = [];

  function entryForToday() {
    var t = todayMX();
    if (!DAILIES.length) return { entry: null, isToday: false, missing: true };
    var exact = null, past = [];
    DAILIES.forEach(function (d) { if (d.date === t) exact = d; if (d.date <= t) past.push(d); });
    if (exact) return { entry: exact, isToday: true, missing: false };
    past.sort(function (a, b) { return b.date.localeCompare(a.date); });
    if (past.length) return { entry: past[0], isToday: false, missing: true };
    var all = DAILIES.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    return { entry: all[0] || null, isToday: !!(all[0] && all[0].date === t), missing: true };
  }
  function bumpStreak() {
    var t = todayMX();
    if (S.streak.lastDate === t) return;
    if (S.streak.lastDate && S.streak.lastDate === addDays(t, -1)) S.streak.count = (S.streak.count || 0) + 1;
    else S.streak.count = 1;
    S.streak.lastDate = t;
  }

    save();
    justMarked = true;
  }

      { t: "Liberación", d: "Él levanta un juez", a: 126 },
      { t: "Reposo", d: "La tierra descansa… y el ciclo vuelve", a: 198 }
    ];
    var cx = 160, cy = 160, r = 108;
    var svg = '<svg class="cycle" viewBox="0 0 320 320" role="img" aria-label="Ciclo de Jueces: lo malo, opresión, clamor, liberación, reposo">';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r - 28) + '" fill="none" stroke="rgba(92,58,33,.12)" stroke-width="2"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="36" fill="#5C3A21"/><text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" fill="#F8E6A0" font-family="Fraunces,serif" font-size="11" font-weight="700">Jueces</text>';
    svg += '<text x="' + cx + '" y="' + (cy + 12) + '" text-anchor="middle" fill="#F8E6A0" font-family="Outfit,sans-serif" font-size="7" letter-spacing="1">2:11-19</text>';
    labels.forEach(function (L, i) {
      var rad = (L.a) * Math.PI / 180;
      var x = cx + r * Math.cos(rad), y = cy + r * Math.sin(rad);
      var delay = (i * 0.22);
      var colors = ["#C45C80", "#8B5E3C", "#5B9EBE", "#7A8B5C", "#E8C547"];
      svg += '<g class="node" style="animation-delay:' + delay + 's">';
      svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="28" fill="' + colors[i] + '" stroke="#fff" stroke-width="3"/>';
      svg += '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="middle" fill="#2A1A10" font-family="Outfit,sans-serif" font-size="8" font-weight="700">' + L.t + "</text>";
      svg += "</g>";
    });
    svg += "</svg>";
    svg += '<p class="info-note" style="color:var(--cafe2)">El narrador formula este ciclo en Jueces 2:11-19. No es un esquema impuesto desde fuera: está en el texto. El reposo no es el final; a menudo el pueblo vuelve a hacer lo malo.</p>';
    return '<div class="cycle-wrap" data-info="cycle">' + svg + "</div>";
  }

  function numbersHTML(skin) {
    var dark = skin === "dark";
    var cls = dark ? "nums-big" : "num-row";
    var item = dark
      ? function (n, label) { return '<div class="nb"><b data-count="' + n + '">0</b><span>' + label + "</span></div>"; }
      : function (n, label) { return '<div class="num-card"><b data-count="' + n + '">0</b><span>' + label + "</span></div>"; };
    var html = '<div class="' + cls + '" data-info="nums">';
    html += item(21, "capítulos");
    html += item(12, "jueces");
    html += item(1, "estribillo");
    html += "</div>";
    html += '<p class="' + (dark ? "info-note" : "muted") + '">Doce jueces nombrados en el relato (Otoniel, Aod, Samgar, Débora, Gedeón, Tola, Jair, Jefté, Ibzán, Elón, Abdón, Sansón). <b>Abimelec no es un juez levantado por Jehová</b>. El estribillo: «En estos días no había rey en Israel; cada uno hacía lo que bien le parecía» (17:6; 21:25, RVR1960). Los años del libro no se suman en línea recta: hay superposiciones posibles y el narrador no entrega una cronología absoluta.</p>';
    return html;
  }

  function tribesFor(n) {
    var h = {
      1: ["juda"], 3: ["benjamin", "ruben"], 4: ["neftali", "zabulon"], 5: ["neftali", "zabulon", "isacar"],
      6: ["manases", "efrain"], 7: ["manases"], 8: ["efrain", "manases"], 9: ["manases", "efrain"],
      10: ["gad", "manases-e"], 11: ["gad", "manases-e", "galaad"], 12: ["efrain", "gad"],
      13: ["dan"], 14: ["dan"], 15: ["dan"], 16: ["dan"],
      18: ["dan", "neftali"], 19: ["benjamin", "juda"], 20: ["benjamin"], 21: ["benjamin", "gad", "galaad"]
    };
    return h[Number(n)] || [];
  }

  function infoKind(n) {
    n = Number(n);
    if (n === 7) return "trescientos";
    if (n === 1 || n === 2) return "ciclo+nums";
    if (n >= 19) return "tribes";
    if (n === 18) return "tribes";
    if (n === 4 || n === 5) return "tribes";
    return "ciclo";
  }

  function infoHTML(kind, n, skin) {
    n = Number(n);
    if (kind === "trescientos") {
      return '<div data-info="nums" class="' + (skin === "dark" ? "nums-big" : "num-row") + '" style="justify-content:center">' +
        '<div class="' + (skin === "dark" ? "nb" : "num-card") + '" style="min-width:160px"><b data-count="300">0</b><span>hombres, no 32 000</span></div></div>' +
        '<p class="' + (skin === "dark" ? "info-note" : "muted") + '">Jueces 7:2, 7 — Jehová reduce el ejército para que Israel no diga: «Mi mano me ha salvado». El número es del texto; la lección es teológica, no militar.</p>';
    }
    if (kind === "tribes") return tribesSVG(tribesFor(n));
    if (kind === "ciclo+nums") return numbersHTML(skin) + cycleSVG();
    return cycleSVG();
  }

  function dailyAsChap(e) {
    if (!e) return null;
    var vers = [];
    if (e.versiculo_clave) {
      var v = e.versiculo_clave;
      vers.push({ ref: v.referencia || v.ref, texto: v.texto, version: v.version || "RVR1960" });
    }
    return {
      n: (chsOf(e)[0] || 0),
      title: e.title,
      teaser: "",
      contexto: e.contexto_historico,
      resumen: e.resumen,
      versiculos: vers,
      dificiles: e.pasajes_dificiles,
      conexiones: e.conexiones,
      observacion: e.observacion,
      interpretacion: e.interpretacion,
      doctrina: e.doctrina,
      aplicacion: e.aplicacion,
      preguntas: e.preguntas || [],
      oracion: e.oracion,
      aviso: e.aviso || "",
      book: e.book,
      date: e.date,
      bible_gateway: e.bible_gateway
    };
  }

  function contentSections(d, opts) {
    opts = opts || {};
    var html = "";
    if (d.aviso) html += '<div class="aviso reveal"><b>Aviso pastoral</b>' + esc(d.aviso) + "</div>";
    html += '<section class="torn reveal" style="transform:rotate(-0.4deg)"><span class="paperclip"></span><div class="kicker">Contexto histórico</div><h3>El escenario</h3>' + para(d.contexto) + "</section>";
    html += '<section class="torn reveal" style="transform:rotate(0.5deg);background:linear-gradient(180deg,#fff,var(--celeste)) var(--img)"><div class="kicker">Resumen</div><h3>Qué relata el texto</h3>' + para(d.resumen) + "</section>";
    if (d.versiculos && d.versiculos.length) {
      d.versiculos.forEach(function (v) { html += verseHTML(v, opts.where); });
    }
    html += '<div class="reveal" style="margin:16px 0">' + infoHTML(infoKind(d.n || opts.n || 2), d.n || opts.n || 2, "light") + "</div>";
    html += '<section class="unveil torn reveal" data-unveil><div class="kicker">Pasajes difíciles</div><h3>Precisiones</h3>' + para(d.dificiles) +
      '<div class="veil" data-act="unveil"><span>Toca el sello para revelar<br><i style="font-style:normal;font-family:var(--fd);font-size:.85rem;letter-spacing:.1em">QUÉ DICE · QUÉ NO DICE</i></span></div></section>';
    html += '<section class="torn reveal"><div class="kicker">Conexiones</div><h3>Hilos de la Escritura</h3>' + connectionsHTML(d.conexiones) + "</section>";
    html += '<section class="torn reveal" style="background:linear-gradient(180deg,#fff,var(--lima))"><div class="kicker">Observación</div><h3>Lo que el texto dice</h3>' + para(d.observacion) + "</section>";

      '<div class="flip-inner"><div class="flip-front"><div class="kicker">Doctrina</div><h3>Lo que creemos</h3>' + para(d.doctrina) +
      '<p class="hint">Toca para ver la aplicación →</p></div>' +

      html += '<div class="section-h"><h3>Sigue en el libro</h3></div>';

    html += "</div>";
    return html;
  }

    function monthCal(year, month) {
      var first = new Date(year, month - 1, 1);
      var startWd = first.getDay();
      var days = new Date(year, month, 0).getDate();
      var h = '<div class="cal"><div class="cal-head"><b style="text-transform:capitalize;font-family:var(--fd)">' + names[month] + " " + year + "</b></div>";

  function renderBuscar(q) {
    var html = topbar({ back: "#/hoy", title: "Buscar" });
    html += '<div class="pad fade"><div class="search-box"><input id="q" type="search" placeholder="Un versículo, un lugar, un nombre…" value="' + esc(q || "") + '" autocomplete="off"></div>';
    var ql = (q || "").toLowerCase().trim();
    if (ql.length < 2) {
      html += '<p class="muted">Escribe al menos dos letras. Se busca en Jueces y en los devocionales publicados.</p></div>';
      return html;
    }
    function hit(field) { return (field || "").toLowerCase().indexOf(ql) !== -1; }
    function snip(field) {
      var s = field || "";
      var i = s.toLowerCase().indexOf(ql);
      if (i < 0) return esc(s.slice(0, 140));
      var a = Math.max(0, i - 50), b = Math.min(s.length, i + q.length + 70);
      var mid = s.slice(a, b);
      var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      return (a > 0 ? "…" : "") + esc(mid).replace(re, "<mark>$1</mark>") + (b < s.length ? "…" : "");
    }
    var hits = [];
    JUECES.forEach(function (c) {
      var blob = [c.title, c.teaser, c.contexto, c.resumen, c.dificiles, c.conexiones, c.observacion, c.interpretacion, c.doctrina, c.aplicacion, c.oracion];
      if (c.versiculos) c.versiculos.forEach(function (v) { blob.push(v.ref, v.texto); });
      if (blob.some(hit)) hits.push({ href: "#/libro/jueces/c/" + c.n, t: "Jueces " + c.n + " · " + c.title, s: snip(blob.filter(hit)[0] || c.teaser) });
    });
    DAILIES.forEach(function (d) {
      var blob = [d.title, d.contexto_historico, d.resumen, d.pasajes_dificiles, d.conexiones, d.observacion, d.interpretacion, d.doctrina, d.aplicacion, d.oracion];
      if (d.versiculo_clave) blob.push(d.versiculo_clave.referencia, d.versiculo_clave.texto);
      if (blob.some(hit)) hits.push({ href: "#/archivo/" + d.date, t: d.date + " · " + d.title, s: snip(blob.filter(hit)[0] || d.title) });

  function renderDeck(slides, opts) {
    opts = opts || {};
    deckState.slides = slides;
    deckState.i = 0;
    deckState.back = opts.back || "#/hoy";
    deckState.key = opts.key || "";
    var html = '<div class="deck" id="deck" role="region" aria-label="Modo presentación, desliza para avanzar">';
    html += '<div class="story-bars" aria-hidden="true">';
    slides.forEach(function (_, i) { html += "<i class='" + (i === 0 ? "cur" : "") + "'><em></em></i>"; });
    html += "</div>";
    html += '<button type="button" class="deck-close" data-act="present-close" aria-label="Cerrar presentación">×</button>';
    html += '<button type="button" class="deck-prev" data-act="present-prev" aria-label="Anterior">‹</button>';
    html += '<button type="button" class="deck-next" data-act="present-next" aria-label="Siguiente">›</button>';
    html += '<div class="slides">' + slides.map(renderSlide).join("") + "</div>";
    html += '<div class="dots">';
    slides.forEach(function (_, i) { html += "<b class='" + (i === 0 ? "on" : "") + "' data-act='present-goto' data-i='" + i + "'></b>"; });
    html += "</div>";
    html += '<div class="deck-hint" id="deck-hint">Desliza, o toca los lados · ' + slides.length + " tarjetas</div>";
    html += "</div>";
    return html;
  }

  function updateDeckChrome() {
    var i = deckState.i, n = deckState.slides.length;
    $$("#deck .story-bars i").forEach(function (el, idx) {
      el.className = idx < i ? "done" : (idx === i ? "cur" : "");
    });
    $$("#deck .dots b").forEach(function (el, idx) { el.className = idx === i ? "on" : ""; });
  }

  function showSlide(i, dir) {
    var slides = $$("#deck .slide");
    if (!slides.length) return;
    if (i < 0) i = 0;
    if (i >= slides.length) i = slides.length - 1;
    if (i === deckState.i && slides[i].classList.contains("on")) return;
    var cur = deckState.i;
    slides.forEach(function (s) { s.classList.remove("on", "exit-l", "exit-r"); });
    if (dir === "next" && slides[cur]) slides[cur].classList.add("exit-l");
    if (dir === "prev" && slides[cur]) slides[cur].classList.add("exit-r");
    deckState.i = i;
    slides[i].classList.add("on");
    /* restart word animation */
    var hs = slides[i].querySelectorAll("h1, h2");
    hs.forEach(function (el) {
      var spans = el.querySelectorAll(".w");
      spans.forEach(function (sp) {
        sp.style.animation = "none";
        void sp.offsetWidth;
        sp.style.animation = "";
      });
    });
    updateDeckChrome();
    runInfoAnims(slides[i]);
    var hint = $("#deck-hint");
    if (hint) hint.style.display = i === 0 ? "block" : "none";
  }
  function deckNext() { if (deckState.i < deckState.slides.length - 1) showSlide(deckState.i + 1, "next"); }
  function deckPrev() { if (deckState.i > 0) showSlide(deckState.i - 1, "prev"); }
  function closePresent() { location.hash = deckState.back || "#/hoy"; }

  var deckBound = false;
  function bindDeckOnce() {
    if (deckBound) return;
    deckBound = true;
    var startX = 0, startY = 0, tracking = false;
    document.addEventListener("pointerdown", function (e) {
      var deck = $("#deck");
      if (!deck) return;
      if (e.target.closest("button,a,textarea,input,.paper-card,.lead.scroll")) return;
      startX = e.clientX; startY = e.clientY; tracking = true;
    });
    document.addEventListener("pointerup", function (e) {
      if (!tracking) return;
      tracking = false;
      if (!$("#deck")) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) deckNext(); else deckPrev();
        return;
      }
      /* tap zones, ignore if on chrome */
      if (e.target.closest("button,a,.dots,.story-bars")) return;
      var w = window.innerWidth;
      if (e.clientX < w * 0.22) deckPrev();
      else if (e.clientX > w * 0.78) deckNext();
    });
    document.addEventListener("keydown", function (e) {
      if (!$("#deck")) return;
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); deckNext(); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); deckPrev(); }
      else if (e.key === "Escape") closePresent();
    });
  }

  function runInfoAnims(root) {
    if (!root) return;
    var nums = root.querySelectorAll("[data-count]");
    nums.forEach(function (el) {
      var to = Number(el.getAttribute("data-count"));
      if (reduceMotion() || !window.gsap) { el.textContent = to; return; }
      var obj = { n: 0 };
      window.gsap.to(obj, {
        n: to, duration: 1.15, ease: "power2.out",
        onUpdate: function () { el.textContent = Math.round(obj.n); }
      });
    });
  }

  function confettiBurst() {
    var layer = document.createElement("div");
    layer.id = "confetti";
    var colors = ["#E8A0BF", "#A8D4E6", "#F8E6A0", "#C4A882", "#C45C80", "#7A8B5C", "#fff"];
    for (var i = 0; i < 32; i++) {
      var el = document.createElement("i");
      el.style.left = Math.random() * 100 + "%";
      el.style.background = colors[i % colors.length];
      el.style.animationDelay = Math.random() * 0.45 + "s";
      el.style.animationDuration = 1.6 + Math.random() * 1.3 + "s";
      el.style.width = 8 + Math.random() * 10 + "px";
      el.style.height = 10 + Math.random() * 12 + "px";
      layer.appendChild(el);
    }
    document.body.appendChild(layer);
    setTimeout(function () { if (layer.parentNode) layer.remove(); }, 2800);
  }

  /* stickers */
  function pageKey() {
    return (location.hash || "#/hoy").replace(/^#/, "") || "/hoy";
  }
  function renderStickers() {
    var layer = $("#sticker-layer");
    if (!layer) return;
    var list = S.stickers[pageKey()] || [];
    layer.innerHTML = list.map(function (s) {
      return '<div class="sticker" data-sid="' + esc(s.id) + '" style="left:' + s.x + "px;top:" + s.y + "px;transform:rotate(" + (s.r || 0) + 'deg)">' +
        (STICKERS[s.kind] || "") + "</div>";
    }).join("");
    if (window.Draggable && !reduceMotion()) {
      window.Draggable.create("#sticker-layer .sticker", {
        bounds: "#app",
        onDragEnd: function () {
          var id = this.target.getAttribute("data-sid");
          var list = S.stickers[pageKey()] || [];
          list.forEach(function (s) {
            if (s.id === id) {
              var r = this.target.getBoundingClientRect();
              var a = $("#app").getBoundingClientRect();
              s.x = r.left - a.left;
              s.y = r.top - a.top;
            }
          }.bind(this));
          save();
        }
      });
    } else {
      /* simple pointer drag fallback */
      $$("#sticker-layer .sticker").forEach(function (el) {
        var sx, sy, ox, oy, moving = false;
        el.addEventListener("pointerdown", function (e) {
          moving = true; el.setPointerCapture(e.pointerId);
          var r = el.getBoundingClientRect();
          sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
        });
        el.addEventListener("pointermove", function (e) {
          if (!moving) return;
          var app = $("#app").getBoundingClientRect();
          el.style.left = (ox + (e.clientX - sx) - app.left) + "px";
          el.style.top = (oy + (e.clientY - sy) - app.top) + "px";
        });
        el.addEventListener("pointerup", function () {
          moving = false;
          var id = el.getAttribute("data-sid");
          var list = S.stickers[pageKey()] || [];
          var app = $("#app").getBoundingClientRect();
          var r = el.getBoundingClientRect();
          list.forEach(function (s) { if (s.id === id) { s.x = r.left - app.left; s.y = r.top - app.top; } });
          save();
        });
      });
    }
  }
  function addSticker(kind) {
    var k = pageKey();
    if (!S.stickers[k]) S.stickers[k] = [];
    S.stickers[k].push({
      id: "s" + Date.now() + Math.floor(Math.random() * 99),
      kind: kind,
      x: 40 + Math.random() * 180,
      y: 120 + Math.random() * 220,
      r: Math.round(-18 + Math.random() * 36)
    });
    save();
    renderStickers();
  }

  var gsapCtx = null;
  function afterRender(isPresent) {
    if (gsapCtx && gsapCtx.revert) { try { gsapCtx.revert(); } catch (e) {} gsapCtx = null; }
    document.body.classList.toggle("presenting", !!isPresent);
    updateNav();
    if (justMarked) {
      confettiBurst();
      justMarked = false;
    }
    /* progress bars */
    $$(".bar > i").forEach(function (el) {
      var w = el.style.width;
      el.style.width = "0";
      requestAnimationFrame(function () { requestAnimationFrame(function () { el.style.width = w; }); });
    });
    runInfoAnims(document);
    if (!isPresent) {
      /* sticker layer */
      if (!$("#sticker-layer")) {
        var sl = document.createElement("div");
        sl.id = "sticker-layer";
        sl.className = "sticker-layer";
        sl.setAttribute("aria-hidden", "true");
        $("#app").appendChild(sl);
      }
      renderStickers();
    }
    if (isPresent) {
      bindDeckOnce();
      var first = $("#deck .slide.on");
      if (first) runInfoAnims(first);
    }
    if (window.gsap && !reduceMotion() && !isPresent) {
      if (window.ScrollTrigger) window.gsap.registerPlugin(window.ScrollTrigger);
      gsapCtx = window.gsap.context(function () {
        window.gsap.utils.toArray(".reveal").forEach(function (el, i) {
          window.gsap.from(el, {
            opacity: 0, y: 28, rotation: i % 2 ? 1.2 : -1.2, duration: 0.7, ease: "power3.out",
            immediateRender: false,
            scrollTrigger: { trigger: el, start: "top 94%", once: true, toggleActions: "play none none none" }
          });
        });
        window.gsap.utils.toArray(".hero-col .pola, .hoy-card .pola").forEach(function (el, i) {
          window.gsap.from(el, { y: 20, opacity: 0, duration: 0.8, delay: 0.1 * i, ease: "power3.out" });
        });
      }, "#app");
    }
    /* notes autosave */
    $$("textarea[data-note]").forEach(function (ta) {
      ta.addEventListener("input", function () {
        var id = ta.getAttribute("data-note");
        S.notes[id] = ta.value;
        save();
        var s = $('[data-saved="' + id + '"]');
        if (s) { s.textContent = "Guardado"; setTimeout(function () { if (s) s.textContent = ""; }, 1200); }
      });
    });
    var qi = $("#q");
    if (qi) {
      qi.focus();
      var pos = qi.value.length;
      try { qi.setSelectionRange(pos, pos); } catch (e) {}
    }
  }

  var libTab = "at";
  var searchQ = "";
  var quizAns = {};
  var searchTimer = null;

  function applyQuiz(n, qi, oi) {
    var c = cap(n);
    if (!c || !c.quiz[qi]) return;
    var q = c.quiz[qi];
    var block = $('[data-q="' + qi + '"]');
    if (!block) return;
    $$(".opt", block).forEach(function (b) { b.disabled = true; });
    var correct = (typeof q.a === "number") ? q.a : q.ok;
    var btns = $$(".opt", block);
    btns.forEach(function (b, idx) {
      if (idx === correct) b.classList.add("ok");
      if (idx === oi && oi !== correct) b.classList.add("bad");
    });
    var exp = $('[data-exp="' + qi + '"]', block);
    if (exp) exp.classList.add("show");
    if (!quizAns[n]) quizAns[n] = {};
    quizAns[n][qi] = oi;
    var keys = Object.keys(quizAns[n]);
    if (keys.length === c.quiz.length) {
      var ok = 0;
      keys.forEach(function (k) { if (c.quiz[Number(k)].a === quizAns[n][k] || c.quiz[Number(k)].ok === quizAns[n][k]) ok++; });
      var sc = $("#quiz-score");
      if (sc) sc.innerHTML = "<p style='margin-top:12px'><b>" + ok + " de " + c.quiz.length + "</b> bien. " +
        (ok === c.quiz.length ? "Excelente: volviste al texto." : "Vuelve al capítulo y a la RVR1960; el quiz es un repaso, no un examen de instituto.") + "</p>";
      S.quiz["jueces-" + n] = { score: ok, total: c.quiz.length, answers: quizAns[n] };
      save();
    }
  }
  function restoreQuiz(n) {
    var c = cap(n);
    var saved = S.quiz["jueces-" + n];
    if (!saved || !c) return;
    var answers = saved.answers || {};
    Object.keys(answers).forEach(function (k) { applyQuiz(n, Number(k), answers[k]); });
  }

  function path() {
    var h = (location.hash || "#/hoy").replace(/^#/, "");
    if (!h.startsWith("/")) h = "/" + h;
    return h;
  }

  function updateNav() {
    var p = path();
    $$("#bnav a").forEach(function (a) {
      var r = a.getAttribute("data-r");
      var on = false;
      if (r === "hoy" && (p === "/hoy" || p.indexOf("/hoy") === 0 || p.indexOf("/archivo") === 0)) on = true;
      if (r === "biblia" && (p.indexOf("/biblio") === 0 || p.indexOf("/libro") === 0)) on = true;
      if (r === "plan" && p.indexOf("/plan") === 0) on = true;
      if (r === "explorar" && (p.indexOf("/explorar") === 0 || p.indexOf("/linea") === 0 || p.indexOf("/mapa") === 0 || p.indexOf("/creditos") === 0)) on = true;
      if (r === "cuaderno" && (p.indexOf("/diario") === 0 || p.indexOf("/favoritos") === 0)) on = true;
      if (r === "explorar" && p.indexOf("/buscar") === 0) on = true;
      a.classList.toggle("on", on);
    });
  }

  function render() {
    var p = path();
    var html = "", isPresent = false, m;
    if (p === "/hoy" || p === "/" || p === "") html = renderHoy();
    else if (p === "/hoy/completo") html = renderHoyCompleto();
    else if (p === "/hoy/presentacion") {
      var info = entryForToday();
      if (info.entry) {
        var d = dailyAsChap(info.entry);
        var nxt = (d.n && d.n < 21) ? "#/libro/jueces/c/" + (d.n + 1) + (S.prefPresent ? "/presentacion" : "") : "#/libro/jueces";
        html = renderDeck(slidesFrom(d, {
          kicker: info.entry.book + " " + chsOf(info.entry).join(", "),
          photo: photoName(d.n || 1),
          markDaily: info.entry.date,
          quiz: slugBook(info.entry.book) === "jueces" ? d.n : null,
          next: nxt,
          back: "#/hoy"
        }), { back: "#/hoy", key: "hoy" });
        isPresent = true;
      } else html = renderHoy();
    } else if (p === "/archivo") html = renderArchivo();
    else if ((m = p.match(/^\/archivo\/(\d{4}-\d{2}-\d{2})\/presentacion$/))) {
      var e = null;
      DAILIES.forEach(function (d) { if (d.date === m[1]) e = d; });
      if (e) {
        var d2 = dailyAsChap(e);
        html = renderDeck(slidesFrom(d2, {
          kicker: e.book + " " + chsOf(e).join(", "), photo: photoName(d2.n || 1),
          markDaily: e.date, back: "#/archivo/" + e.date
        }), { back: "#/archivo/" + e.date });
        isPresent = true;
      } else html = renderArchivo(m[1]);
    } else if ((m = p.match(/^\/archivo\/(\d{4}-\d{2}-\d{2})$/))) html = renderArchivo(m[1]);
    else if (p === "/biblioteca") html = renderBiblioteca();
    else if (p === "/libro/jueces") html = renderLibro();
    else if (p === "/libro/jueces/intro") html = renderIntro();
    else if ((m = p.match(/^\/libro\/jueces\/c\/(\d+)\/presentacion$/))) {
      var n = Number(m[1]);
      var c = cap(n);
      if (c) {
        var nextH = n < 21 ? "#/libro/jueces/c/" + (n + 1) + "/presentacion" : "#/libro/jueces";
        html = renderDeck(slidesFrom(c, {
          kicker: "Jueces " + n, photo: photoName(n),
          markCh: n, quiz: (c.quiz ? n : null), next: nextH, back: "#/libro/jueces/c/" + n,
          infoTitle: n === 7 ? "Trescientos" : (n >= 19 || n === 18 || n === 4 || n === 5 ? "Las tribus en este relato" : "El ciclo de Jueces")
        }), { back: "#/libro/jueces/c/" + n });
        isPresent = true;
      } else html = renderCap(n);
    } else if ((m = p.match(/^\/libro\/jueces\/c\/(\d+)\/quiz$/))) { html = renderQuiz(m[1]); }
    else if ((m = p.match(/^\/libro\/jueces\/c\/(\d+)$/))) html = renderCap(m[1]);
    else if (p === "/plan") html = renderPlan();
    else if (p === "/linea") html = renderLinea();
    else if (p === "/mapa") html = renderMapa();
    else if (p === "/diario") html = renderDiario();
    else if (p === "/favoritos") html = renderFavoritos();
    else if (p === "/buscar") html = renderBuscar(searchQ);
    else if (p === "/explorar") html = renderExplorar();
    else if (p === "/creditos") html = renderCreditos();
    else html = renderHoy();

    $("#app").innerHTML = html;
    afterRender(isPresent);
    pageTurnClass = "";
    if (isPresent && window.__keepDeckI != null) {
      var ki = window.__keepDeckI; window.__keepDeckI = null;
      if (ki > 0) showSlide(ki);
    }
    if ((m = p.match(/c\/(\d+)\/quiz/))) restoreQuiz(Number(m[1]));
  }

  function onClick(e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "mark-daily") {
      var eDate = t.getAttribute("data-date");
      var entry = null;
      DAILIES.forEach(function (d) { if (d.date === eDate) entry = d; });
      if (!entry) entry = entryForToday().entry;
      if ($("#deck")) window.__keepDeckI = deckState.i;
      markDailyRead(entry);
      render();
    } else if (act === "mark-ch") {
      if ($("#deck")) window.__keepDeckI = deckState.i;
      markChapterRead("jueces", t.getAttribute("data-n"));
      render();
    } else if (act === "fav") {
      toggleFav(t.getAttribute("data-ref"), t.getAttribute("data-tx"), t.getAttribute("data-where"));
      render();
    } else if (act === "copy") {
      var tx = "«" + t.getAttribute("data-tx") + "» — " + t.getAttribute("data-ref") + ", RVR1960";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(tx).then(function () {
          t.textContent = "Copiado";
          setTimeout(function () { t.textContent = "Copiar"; }, 1200);
        }, function () {});
      }
    } else if (act === "quiz") {
      applyQuiz(Number(t.getAttribute("data-n")), Number(t.getAttribute("data-qi")), Number(t.getAttribute("data-oi")));
    } else if (act === "tab-at") { libTab = "at"; render(); }
    else if (act === "tab-nt") { libTab = "nt"; render(); }
    else if (act === "pin") { selectedPin = t.getAttribute("data-id"); render(); }
    else if (act === "pin-search") { selectedPin = t.getAttribute("data-id"); }
    else if (act === "welcome-ok") {
      S.welcomed = true; save();
      var w = $("#welcome");
      if (w) w.remove();
    } else if (act === "unveil") {
      var box = t.closest(".unveil");
      if (box) box.classList.add("open");
    } else if (act === "flip") {
      t.classList.toggle("on");
    } else if (act === "present-next") { e.preventDefault(); deckNext(); }
    else if (act === "present-prev") { e.preventDefault(); deckPrev(); }
    else if (act === "present-close") { e.preventDefault(); closePresent(); }
    else if (act === "present-goto") { showSlide(Number(t.getAttribute("data-i"))); }
    else if (act === "pref-present") { S.prefPresent = !S.prefPresent; save(); render(); }
    else if (act === "tray") {
      var tray = $("#tray");
      if (tray) tray.classList.toggle("open");
    } else if (act === "add-sticker") {
      addSticker(t.getAttribute("data-st"));
    }
  }

  function welcomeHTML() {
    if (S.welcomed) return "";
    return '<div id="welcome"><div class="sheet">' +
      '<div class="washi" style="transform:rotate(-2deg);margin:-8px -8px 10px"></div>' +
      '<p class="kicker" style="margin-top:10px">Para Eli</p>' +
      "<h2>Leer libros enteros, con contexto.</h2>" +
      "<p>Un devocional cada día, empezando por Jueces. Cada capítulo trae contexto, resumen, versículos en RVR1960, precisiones (qué dice y qué no), conexiones, doctrina distinta de la aplicación, preguntas, oración y un repaso. El progreso y tu cuaderno se quedan en este teléfono.</p>" +
      "<p>Ábrelo como un <b>collage</b> o en <b>modo presentación</b>: una historia de tarjetas de pantalla completa, para deslizar. La Biblia, aquí, <b>describe</b> y no siempre <b>aprueba</b>. El testimonio de Jehová es fiel, y hace sabio al sencillo.</p>" +
      '<div class="actions"><button class="btn btn-pri" type="button" data-act="welcome-ok">Empezar el de hoy</button></div>' +
      "</div></div>";
  }

  function boot() {
    var tray = document.getElementById("tray");
    if (tray && !tray.childNodes.length) {
      tray.innerHTML = Object.keys(STICKERS).map(stickerBtn).join("");
    }
    document.body.addEventListener("click", onClick);
    window.addEventListener("hashchange", function (ev) {
      var oldH = ev.oldURL ? ev.oldURL.split("#")[1] || "" : "";
      var newH = location.hash.replace(/^#/, "");
      var om = oldH.match(/c\/(\d+)/), nm = newH.match(/c\/(\d+)/);
      pageTurnClass = "";
      if (om && nm) {
        pageTurnClass = Number(nm[1]) >= Number(om[1]) ? " turn-fwd" : " turn-back";
      }
      render();
      window.scrollTo(0, 0);
    });
    /* live search */
    document.body.addEventListener("input", function (e) {
      if (e.target && e.target.id === "q") {
        searchQ = e.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          var html = renderBuscar(searchQ);
          $("#app").innerHTML = html;
          afterRender(false);
        }, 160);
      }
    });
    if (!location.hash) location.hash = "#/hoy";
    render();
    if (!S.welcomed) document.body.insertAdjacentHTML("beforeend", welcomeHTML());
    fetch("diarios.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        DAILIES = Array.isArray(data) ? data : [];
        dailiesReady = true;
        render();
      })
      .catch(function () {
        dailiesReady = true;
        render();
      });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
