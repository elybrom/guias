<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía de Locución · 100 Años de Gratitud</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#d8b25a;--g2:#f3d98c;--bg:#0b0506;--bd:#3a0d14;--a:#5fa8ff;--e:#ff7aa8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#5a1420 0,#24070c 40%,var(--bg) 75%) fixed;color:#f4e9d8;font-family:Inter,sans-serif;padding-bottom:90px}
header{text-align:center;padding:26px 16px 8px;position:relative}
.dome{width:180px;filter:drop-shadow(0 0 18px #d8b25a88);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 30px #f3d98caa)}}
h1{font-family:Cinzel;color:var(--g2);font-size:26px;margin:6px 0 2px;letter-spacing:2px}
.sub{font-family:'Cormorant Garamond';font-style:italic;color:#e8cf9a;font-size:17px}
.meta{font-size:12px;opacity:.7;margin-top:4px}
.bar{position:sticky;top:0;z-index:5;background:#0b0506e6;backdrop-filter:blur(8px);padding:10px;display:flex;gap:6px;justify-content:center;border-bottom:1px solid #d8b25a33}
.bar button{border:1px solid var(--g);background:transparent;color:var(--g2);border-radius:20px;padding:7px 12px;font:600 13px Inter}
.bar button.on{background:var(--g);color:#1a0508}
.prog{height:3px;background:#d8b25a22}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2));width:0;transition:.4s}
main{max-width:620px;margin:auto;padding:14px}
.card{border:1px solid #d8b25a44;background:linear-gradient(160deg,#2a0a10cc,#120607cc);border-radius:16px;margin:12px 0;box-shadow:0 0 24px #d8b25a14;overflow:hidden;transition:.3s}
.card.done{opacity:.45}
.hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.t{font-family:Cinzel;color:var(--g);font-size:13px;min-width:48px}
.n{flex:1;font-weight:600;font-size:15px}
.chips span{font-size:10px;padding:2px 7px;border-radius:10px;margin-left:3px}
.ca{background:#5fa8ff33;color:var(--a)}.ce{background:#ff7aa833;color:var(--e)}
.chk{width:22px;height:22px;accent-color:var(--g)}
.bd{max-height:0;overflow:hidden;transition:max-height .4s}
.card.open .bd{max-height:900px}
.ln{margin:0 14px 12px;padding:10px 12px;border-left:3px solid;border-radius:8px;background:#ffffff08;font-family:'Cormorant Garamond';font-size:19px;line-height:1.35}
.ln b{display:block;font:600 11px Inter;letter-spacing:1px;margin-bottom:3px}
.A{border-color:var(--a)}.A b{color:var(--a)}.E{border-color:var(--e)}.E b{color:var(--e)}.B{border-color:var(--g)}.B b{color:var(--g)}
.note{margin:0 14px 12px;font-size:12px;opacity:.65;font-style:italic}
body.fA .E,body.fE .A{display:none}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#3a0d14,#000);z-index:10;display:none;flex-direction:column;padding:24px;text-align:center}
#stage.on{display:flex}
#sTime{font-family:Cinzel;color:var(--g)}#sWho{font:700 15px Inter;letter-spacing:2px;margin-top:20px}
#sTxt{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond';font-size:31px;line-height:1.3}
.sb{display:flex;gap:10px}.sb button{flex:1;padding:16px;border-radius:14px;border:1px solid var(--g);background:#d8b25a22;color:var(--g2);font:600 16px Inter}
.fab{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--g),var(--g2));color:#1a0508;border:0;border-radius:30px;padding:14px 26px;font:700 15px Inter;box-shadow:0 0 30px #d8b25a88;z-index:6}
footer{text-align:center;font-family:Cinzel;color:var(--g);padding:20px;font-size:13px}
</style></head><body>
<header>
<svg class="dome" viewBox="0 0 200 120"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f3d98c"/><stop offset="1" stop-color="#8a6420"/></linearGradient></defs>
<path d="M20 110 Q100 -20 180 110Z" fill="none" stroke="url(#g)" stroke-width="3"/>
<g stroke="url(#g)" stroke-width="1.5" fill="none"><path d="M100 18V110M60 40Q80 75 70 110M140 40Q120 75 130 110M40 70Q60 90 45 110M160 70Q140 90 155 110"/><path d="M38 80Q100 50 162 80" /></g>
<circle cx="100" cy="14" r="5" fill="#f3d98c"/><text x="100" y="100" text-anchor="middle" font-size="22">🎙️</text></svg>
<h1>100 AÑOS DE GRATITUD</h1>
<div class="sub">Guía de locución · Concierto del Centenario</div>
<div class="meta">Teatro de la Ciudad Esperanza Iris · Vie 27 nov 2026<br>Presbiterio Sur Oriente del Valle de México</div>
</header>
<div class="bar"><button data-f="" class="on">Ambos</button><button data-f="E">💗 Eli</button><button data-f="A">💙 Aarón</button><button id="rst">↺</button></div>
<div class="prog"><i id="pg"></i></div>
<main id="m"></main>
<footer>✦ A Dios sea toda la gloria ✦</footer>
<button class="fab" id="go">▶ Modo escenario</button>
<div id="stage"><div id="sTime"></div><div id="sWho"></div><div id="sTxt"></div><div class="sb"><button id="pv">◀</button><button id="nx">Siguiente ▶</button><button id="cl">✕</button></div></div>
<script>
const D=[
["16:20","1ª llamada",[["E","Bienvenidos al Teatro Esperanza Iris. En unos momentos comienza «100 Años de Gratitud». Ocupen sus lugares, por favor."]]],
["16:25","2ª llamada",[["A","Segunda llamada. Gracias por acompañarnos en esta noche de música, fe y gratitud. Celulares en silencio, por favor."]]],
["16:30","3ª llamada",[["E","Tercera llamada, tercera llamada. Vamos a recordar juntos la fidelidad de Dios."],["A","Atención al escenario. ¡Bienvenidos al Concierto del Centenario!"]]],
["16:35","Cortinilla + Renuevo Band",[],"Video con voz del Hno. Gersain y preludio 16:40–17:00. Fuera de escena, sin hablar."],
["17:00","Bienvenida y oración",[["E","Que la paz de Dios sea con todos. ¡Bienvenidos a «100 Años de Gratitud»!"],["A","En nombre del Presbiterio Sur Oriente, es un privilegio recibirles. Cien años nos invitan a recordar al Dios que sostiene su obra."],["E","Salmo 100:5: «Porque Jehová es bueno; para siempre es su misericordia, y su verdad por todas las generaciones»."],["A","Que esto sea más que un concierto: un acto de adoración. Unámonos en oración."],["E","🙏 Señor, gracias por cien años de fidelidad. Que cada nota sea para tu gloria. En el nombre de Jesucristo. Amén."]],"Máx. 5 minutos en total."],
["17:05","Coro Metropolitano",[["E","La música ha sido siempre nuestra forma de proclamar la fe."],["A","Recibamos con un cálido aplauso… ¡al Coro Metropolitano! 👏"]]],
["17:20","Cápsula 1 · Centenario de las Iglesias",[["A","Cien años también es hacer memoria y agradecer a quienes nos antecedieron."],["E","Miremos la pantalla: nuestra primera cápsula. 🎬"]]],
["17:25","Orquesta Aquiles Mireles",[["A","Los instrumentos también pueden ponerse al servicio de Dios."],["E","Con un gran aplauso… ¡la Orquesta Aquiles Mireles! 🎻"]]],
["17:40","Cápsula 2 · Sur Oriente + saludo",[["E","Reconozcamos el servicio y la comunión de nuestras iglesias."],["A","Conozcamos su historia en el video del Presbiterio Sur Oriente. 🎬"],["B","Saludo protocolario: [nombres pendientes de Protocolo]"]],"Saludo solo si el tiempo lo permite."],
["17:45","Institutos de Música · IMMAMP",[["A","El IMMAMP lleva más de 40 años formando ministros de música, en más de 18 planteles."],["E","Bajo la dirección de los hermanos Víctor González Corona y Samuel Antonio Martínez Rincón… ¡recibámoslos! 🎶"]]],
["18:00","Cápsula 3 · Actividad juvenil",[["E","Las nuevas generaciones también escriben esta historia."],["A","Veamos lo que nuestros jóvenes han vivido. 🔥"]],"Testimonio de la Hna. Berenice Hernández solo si se confirma."],
["18:15","Comisión General de Música",[["A","Ahora, voces y corazones unidos en alabanza."],["E","Recibamos a la Comisión General de Música. 👏"]]],
["18:30","Predicación",[["E","Es momento de escuchar la Palabra de Dios."],["A","Con nosotros, [predicador por confirmar]. Recibámosle con respeto."]]],
["18:50","Orquesta Presbiterial Sur Oriente",[["A","Para coronar esta noche, una gran celebración musical."],["E","¡La Orquesta Presbiterial Sur Oriente! 🎺"]],"18:50–19:20"],
["19:20","Cierre",[["E","Gracias por celebrar con nosotros cien años de fidelidad."],["A","Que sigamos sirviendo al Señor por todas las generaciones."],["B","¡A Dios sea toda la gloria! ✨"]]]
];
const W={A:"AARÓN MORA",E:"ELI NOGUERON",B:"AMBOS"};
const done=JSON.parse(localStorage.lcDone||"{}");let F="";
function draw(){m.innerHTML=D.map((b,i)=>{const s=new Set(b[2].map(l=>l[0]));return`<div class="card ${done[i]?'done':''}" id="c${i}"><div class="hd" onclick="tg(${i})"><span class="t">${b[0]}</span><span class="n">${b[1]}<span class="chips">${s.has('A')||s.has('B')?'<span class=ca>Aarón</span>':''}${s.has('E')||s.has('B')?'<span class=ce>Eli</span>':''}</span></span><input type=checkbox class=chk ${done[i]?'checked':''} onclick="event.stopPropagation();ck(${i},this.checked)"></div><div class="bd">${b[2].map(l=>`<div class="ln ${l[0]}"><b>${W[l[0]]}</b>${l[1]}</div>`).join('')}${b[3]?`<div class=note>🎬 ${b[3]}</div>`:''}</div></div>`}).join('');pr()}
function tg(i){document.getElementById('c'+i).classList.toggle('open')}
function ck(i,v){done[i]=v;localStorage.lcDone=JSON.stringify(done);document.getElementById('c'+i).classList.toggle('done',v);pr()}
function pr(){pg.style.width=Object.values(done).filter(Boolean).length/D.length*100+'%'}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{F=b.dataset.f;document.body.className=F?'f'+F:'';document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x==b))});
rst.onclick=()=>{if(confirm('¿Reiniciar marcas?')){localStorage.lcDone='{}';location.reload()}};
let S=[],k=0;
function steps(){S=[];D.forEach((b,i)=>{if(!b[2].length)S.push([b,{0:'B',1:'🎬 '+b[3]},i]);b[2].forEach(l=>{if(!F||l[0]==F||l[0]=='B')S.push([b,l,i])})})}
function show(){const[b,l]=S[k];sTime.textContent=b[0]+' · '+b[1];sWho.textContent=W[l[0]];sWho.style.color=l[0]=='A'?'var(--a)':l[0]=='E'?'var(--e)':'var(--g)';sTxt.textContent=l[1]}
go.onclick=()=>{steps();k=0;stage.classList.add('on');show()};
nx.onclick=()=>{if(k<S.length-1){if(S[k+1][2]!=S[k][2])ck(S[k][2],true);k++;show()}else{ck(S[k][2],true);stage.classList.remove('on');draw()}};
pv.onclick=()=>{if(k>0){k--;show()}};cl.onclick=()=>{stage.classList.remove('on');draw()};
draw();
</script></body></html>
