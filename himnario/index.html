<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Himnario</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--sage:#8a9a7b;--sage-d:#5e6b52;--cream:#f6f2ea;--sand:#e9e1d3;--clay:#c4a484;--ink:#3b3a36}
*{box-sizing:border-box}body{margin:0;font:300 18px/1.7 Poppins,"Helvetica Neue",Arial,sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--sage);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px rgba(60,60,50,.12)}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;letter-spacing:.02em}
h1{margin:0 0 10px;font-size:2em;cursor:pointer;line-height:1}h2{color:var(--sage-d);font-size:2em;margin:26px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;max-width:820px}input,select,button{font:400 16px Poppins,Arial,sans-serif;padding:11px 14px;border-radius:999px;border:1px solid var(--sand);background:#fff;color:var(--ink)}
#q{flex:1;min-width:180px}#jn{width:80px}button{background:var(--ink);color:#fff;border:0;text-transform:uppercase;letter-spacing:.12em;font-size:13px;cursor:pointer;padding:11px 20px}
button:hover{background:var(--sage-d)}button:disabled{opacity:.35}
main{max-width:820px;margin:auto;padding:14px 16px 40px}
.sec{background:#fff;border-radius:18px;padding:20px 22px;margin:12px 0;cursor:pointer;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5em;border:1px solid var(--sand);transition:.2s}
.sec:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(94,107,82,.15)}.sec small{font:300 .55em Poppins,sans-serif;color:var(--sage-d);display:block;letter-spacing:.05em}
.it{display:flex;gap:12px;align-items:center;padding:13px 10px;border-bottom:1px solid var(--sand);cursor:pointer}.it:hover{background:#fff}
.num{min-width:60px;font:600 1.25em "Cormorant Garamond",serif;color:var(--sage-d)}.tag{font-size:.65em;background:var(--sand);border-radius:999px;padding:2px 9px;margin-right:6px;letter-spacing:.08em;font-weight:500}
.sn{font-size:.8em;color:var(--sage-d);text-transform:uppercase;letter-spacing:.14em}
.v{white-space:pre-line;margin:16px 0;font-size:1.05em}.v b{color:var(--clay);font-family:"Cormorant Garamond",serif;font-size:1.3em}
.c{white-space:pre-line;margin:18px 0;padding:16px 20px;background:var(--sand);border-radius:16px;font-style:italic}.c b{font-style:normal;color:var(--sage-d)}
.nav{display:flex;gap:8px;margin:26px 0}.nav button{flex:1}.cr{font-size:.8em;color:#7a786f}
</style>
</head><body>
<header><h1 onclick="home()">📖 Himnario</h1><div class="row"><input id="q" placeholder="Buscar número, título o letra…" oninput="search()" type="search">
<select id="fs" onchange="search()"><option value="">Todas</option></select><input id="jn" placeholder="Nº" inputmode="numeric" onkeydown="if(event.key=='Enter')jump()"><button onclick="jump()">Ir</button></div></header>
<main id="m"></main>
<script>
const D=[{"s":"Himnario infantil","n":"1","t":"A Dios debí el nacer","p":"15","c":"","l":[{"t":"v","n":"1","x":"A Dios que es bueno debí el nacer, él me dio padres para mi bien; me da alimento, templa mi sed, Buenos seamos que Dios nos ve."},{"t":"v","n":"2","x":"Dios hizo el cielo con su poder, hizo la tierra y el mar también; los astros todos brillan por él, Buenos seamos que Dios nos ve."},{"t":"v","n":"3","x":"Si el desvalido pide merced, si al triste aflige suerte muy cruel, ese que llora tu hermano es, Buenos seamos que Dios nos ve."},{"t":"v","n":"4","x":"No al malo envidies, aunque tal vez impune ostente gloria y poder, que allá en los cielos vive otro juez, Buenos seamos que Dios nos ve."}]},{"s":"Himnario infantil","n":"2","t":"Abre mis ojos","p":"15","c":"Letra y Música: Vicen.te Mendoza, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Charles H. Scott, Tr. S. D. Athans","l":[{"t":"v","n":"1","x":"Abre mis ojos para ver tu verdadero parecer; muestra a mi alma tu verdad que habrá de darme libertad. En el silencio espero en ti, tu voluntad yo acataré, abre mis ojos para ver, Divino Dios."},{"t":"v","n":"2","x":"Abre mi oído para oír, tu voz viniendome a decir palabras de consolación que traigan paz al corazón. En el silencio espero en ti, tu voluntad yo acataré, abre mi oído para oír, Divino Dios."},{"t":"v","n":"3","x":"Abre mi boca y hablaré, al mundo la verdad diré; abre mi altivo corazón y anunciaré tu salvación. En el silencio espero en ti, tu voluntad yo acataré, abre mi altivo corazón, Divino Dios."}]},{"s":"Himnario infantil","n":"3","t":"Yo ando con mi Rey","p":"16","c":"","l":[{"t":"v","x":"¡Aleluya! yo ando con mi Rey, yo ando con mi Rey, yo ando con mi Rey. ¡Aleluya! yo ando con mi Rey, cada día yo ando con mi Rey. Los del mundo no me quieren porque ando con mi Rey, yo ando con mi Rey, yo ando con mi Rey, los del mundo no me quieren porque ando con mi Rey, cada día yo ando con mi Rey."}]},{"s":"Himnario infantil","n":"4","t":"Allá en el Monte Horeb","p":"16–17","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Allá en el monte Horeb, la zarza ardía, allá en el monte Horeb, la zarza ardía; Moisés quería saber por qué la zarza ardía, y no se consumía, quería saber; y oyó una voz del cielo que le decía, y oyó una voz del cielo que le decía: Quita, quita, quita las sandalias de tus pies porque el lugar que pisas santo es. Quita, quita, quita las sandalias de tus pies porque el lugar que pisas santo es."}]},{"s":"Himnario infantil","n":"5","t":"Ama Cristo a niños","p":"17","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Ama Cristo a niños como yo, yo, yo. Ama Cristo a niños como yo, yo, yo. Niños como yo, en brazos tomó. Ama Cristo a niños como yo, yo, yo."},{"t":"v","n":"2","x":"Ama Cristo a niños como tú, tú, tú. Ama Cristo a niños como tú, tú, tú. Niños como tú, en brazos tomó. Ama Cristo a niños como tú y yo."}]},{"s":"Himnario infantil","n":"6","t":"Amigo tengo que me ama","p":"18","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Amigo tengo que me ama, me ama, me ama; amigo tengo que me ama, su nombre es Jesús. me ama domingo, lunes también, martes y miércoles donde esté, jueves y viernes y sábado también, ¡Aleluya! al nombre de mi Salvador."}]},{"s":"Himnario infantil","n":"7","t":"Aunque me llamen un Aleluya","p":"18–19","c":"","l":[{"t":"v","n":"1","x":"Aunque me llamen un aleluya, aunque me llamen un aleluya, aunque me llamen un aleluya, no vuelvo atrás, no, no, no vuelvo atrás, no vuelvo atrás, no, no, no vuelvo atrás."},{"t":"v","n":"2","x":"Hoy dejo al mundo y sigo a Cristo, hoy dejo al mundo y sigo a Cristo, hoy dejo al mundo y sigo a Cristo, no vuelvo atrás, no, no, no vuelvo atrás, no vuelvo atrás, no, no, no vuelvo atrás."}]},{"s":"Himnario infantil","n":"8","t":"Aunque pequeño soy","p":"19","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez; Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro","l":[{"t":"v","x":"Aunque pequeño soy, y no muy grande soy, y lo que tengo yo, a ti yo te lo doy. Te amaré con el corazón, te amaré con el corazón, te amaré con el corazón; aunque pequeño soy, te seguiré con fidelidad, te seguiré con fidelidad, te seguiré con fidelidad, aunque pequeño soy."}]},{"s":"Himnario infantil","n":"9","t":"Aunque soy pequeñuelo","p":"20","c":"","l":[{"t":"v","n":"1","x":"Aunque soy pequeñuelo, me mira el Santo Dios; él oye desde el cielo mi humilde y tierna voz."},{"t":"v","n":"2","x":"Me ve de su alto Asiento, mi nombre sabe, sí, y cuánto pienso y siento conoce desde allí."},{"t":"v","n":"3","x":"Él mira a cada instante lo que hago bien y mal, pues todo está delante de su ojo paternal."}]},{"s":"Himnario infantil","n":"10","t":"Avecita gentil","p":"20–21","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Avecita que gentil cantas sin cesar, interpreta por favor este cantar."},{"t":"v","n":"2","x":"Canta hermosa, blanca flor, gala del pensil, tus hojitas al cimbrar ¿qué quieres decir?"},{"t":"v","n":"3","x":"Lucerito matinal de turquesa azul, que le dices al brillar ¿a quién ve tu luz?"},{"t":"v","n":"4","x":"Esta célica verdad se oye por doquier, y la brisa en el zarzal cantaba también."},{"t":"c","x":"Niño escucha esta verdad y en tu corazón haz un eco resonar: \"Dios es amor\"."}]},{"s":"Himnario infantil","n":"11","t":"Brille la luna","p":"21","c":"Letra y Música: E. Euresti, Arm. Francisco Javier Corona Vázquez.; Letra: R. Havergal/Severa; Música: I. H. Meredith, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Brille la luna o el fúlgido sol, Dios a los niños los ve sin cesar, él se complace en constante velar sin fatigarse por siempre jamás."},{"t":"v","n":"2","x":"Y de la densa tiniebla a través ve de sus hijos tranquilo el dormir, es el amante y benigno pastor que a sus ovejas conduce al redil."},{"t":"v","n":"3","x":"Si es amoroso contigo el día de hoy, él es el mismo por la eternidad, y te guiará su inefable poder a las delicias del célico hogar."},{"t":"c","x":"Cuida de mí, cuida de mí, bajo su amparo me siento feliz."}]},{"s":"Himnario infantil","n":"12","t":"Caritas Risueñas","p":"22","c":"","l":[{"t":"v","x":"Caritas risueñas, miradas de niños, almitas pequeñas, traemos a Cristo. Nuestras son risas mejores, nuestros jueguitos de niños, nuestras risas, nuestras flores, son para el Rey, son para el Rey."}]},{"s":"Himnario infantil","n":"13","t":"Cristo ama a los niñitos","p":"22","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez; Letra y Música: George F. Root, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Cristo ama a los niñitos de este mundo en derredor; al latino y al sajón, al de China y de Japón, todos ellos son preciosos al Señor."},{"t":"v","n":"2","x":"Cristo ama a los niñitos de este mundo en derredor; no le importa su color a Jesús el Salvador, todos ellos son preciosos al Señor."}]},{"s":"Himnario infantil","n":"14","t":"Cristo Bendito","p":"23","c":"Letra y Música: Desconocido, Fransico Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Cristo bendito yo pobre niño, por tu cariño me allego a ti; para rogarte humilde mente tengas clemente piedad de mí."},{"t":"v","n":"2","x":"Quiero a tus plantas con alegría sentarme un día donde tú estás. ¡Oh! Cristo mío quiero buscarte, anhelo amarte cada vez más."}]},{"s":"Himnario infantil","n":"15","t":"Cristo el Rey de gloria","p":"23","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Cristo el Rey de gloria tanto me amó, que dejó su trono y en una cruz murió. Él ahí su sangre en rescate dio, Jesucristo el Rey de gloria vino y me salvó."}]},{"s":"Himnario infantil","n":"16","t":"Cristo está en mi corazón","p":"24","c":"","l":[{"t":"v","x":"Cristo está en mi corazón, Cristo está en mi corazón. Quedito llamó y la puerta le abrí. Cristo está en mi corazón."}]},{"s":"Himnario infantil","n":"17","t":"Cristo me ama","p":"24","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra: Ana B. Warner; Música: William B. Bradbury, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Cristo me ama bien lo sé, pues la biblia dice así, desde el cielo él me vé y me dice: \"Ven a mí\"."},{"t":"v","n":"2","x":"Cristo me ama bien lo sé, su palabra dice así, que los niños son de aquel, quien es nuestro amigo fiel."},{"t":"v","n":"3","x":"Cristo me ama pues murió y la gloria me abrió, mis pecados borrará, reconozco su bondad."},{"t":"v","n":"4","x":"Cristo me ama, es verdad, a mi lado siempre está, viene pronto ya por mí, y con él siempre he de estar."},{"t":"c","x":"Cristo me ama, Cristo me ama, Cristo me ama, la biblia dice así."}]},{"s":"Himnario infantil","n":"18","t":"Cristo rompe las cadenas","p":"25","c":"","l":[{"t":"v","x":"Cristo rompe las cadenas, Cristo rompe las cadenas, Cristo rompe las cadenas, Cristo da seguridad. ¿Cómo es posible que yo viva sin Jesús? si el fundamento de mi vida eres Tú, Tú me libraste del infierno y de la muerte, ¡Cómo es posible que yo viva sin Jesús?"}]},{"s":"Himnario infantil","n":"19","t":"Cual lirio ha de ser","p":"25","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrillo","l":[{"t":"v","x":"Cual lirio ha de ser mi corazoncito Cual fresco rocío como un pajarito Tan blanco tan puro gozoso así Alabando a Dios por su amor para mí."}]},{"s":"Himnario infantil","n":"20","t":"Cuando leo en la Biblia","p":"26","c":"Letra: Jemima T. Luke, Trad. Sebastián Cruellas; Música: Melodía tradicional griega, arr. W. B. Bradbury, 1859, y C. W. Douglas, 1918","l":[{"t":"v","n":"1","x":"Cuando leo en la Biblia cómo llama Jesús y bendice a los niños con amor, Yo también quisiera estar y con ellos descansar en los brazos del tierno Salvador."},{"t":"v","n":"2","x":"Ver quisiera sus manos sobre mí reposar, cariñosos abrazos de Él sentir; Sus miradas disfrutar, las palabras escuchar: \"A los niños dejad a mí venir\"."},{"t":"v","n":"3","x":"Más aún a su estrado en oración puedo ir, y también de su amor participar; Pues si aquí buscarle sé, Le veré y le escucharé en el reino que Él fue a preparar."},{"t":"v","n":"4","x":"Todos los redimidos y salvados or Él, al Cordero celebran, inmortal; Cantan voces mil y mil en el coro infantil, pues es de ellos el reino celestial."},{"t":"v","n":"5","x":"Muchos hay que no saben, de esa bella mansión, y no quieren a Cristo recibir; Les quisiera yo mostrar que para ellos hay lugar en el cielo, do los convida ir."},{"t":"v","n":"6","x":"Yo ansío aquel tiempo, venturoso, sin fin, El más grande, el más lúcido, el mejor; Cuando de cualquier nación, Niños mil sin distinción a los brazos acudan al Señor."}],"w":1},{"s":"Himnario infantil","n":"21","t":"Cuando me acerco a Jesús","p":"27","c":"","l":[{"t":"v","x":"Cuandome acerco a Jesús soy feliz, yo quiero seguir sus caminos de amor, pues él murió en la cruz para salvarme a mí. Yo soy feliz, pues él me amó, su vida dio para mi redención. Yo soy feliz, pues me salvó y en una cruz su sangre derramó."}]},{"s":"Himnario infantil","n":"22","t":"De pie vamos ya a cantar","p":"27","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Jhoan G. Nagell, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"De pie vamos ya a cantar, sentados la clase escuchar, el rostro inclinado, los brazos cruzados, así adorando al Señor."}]},{"s":"Himnario infantil","n":"23","t":"Del trono santo","p":"28","c":"Letra: A. H. Sheperd","l":[{"t":"v","n":"1","x":"Del trono Santo en derredor, niñitos mil están, que rescatados del Señor las gracias allí dan."},{"t":"v","n":"2","x":"Mas ¿cómo al mundo superior, aquel celeste hogar, en donde todo es paz y amor, pudieron ya llegar?"},{"t":"v","n":"3","x":"Porque el Señor su sangre dio en precio de expiación, con ella los purífico, por grande compasión."},{"t":"v","n":"4","x":"Buscaron ellos a Jesús, su nombre amado aquí, y ahora ya en plena luz su rostro ven ahí."},{"t":"v","n":"5","x":"Ropaje blanco de esplendor, reviste cada cual, están ahí con el Señor en gozo eternal."},{"t":"c","x":"Y cantan ¡Gloria! ¡Gloria! ¡Aleluya al Santo Dios!"}],"w":1},{"s":"Himnario infantil","n":"24","t":"Dios donde quiera está","p":"28–29","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras; Música: H. E. Mathews, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Dios donde quiera está, Dios donde quiera está, Dios donde quiera está Aleluya a Jehová. Lo buscas en el cielo, lo buscas en la mar, lo buscas en los montes y allí lo encontrarás. rás."}],"w":1},{"s":"Himnario infantil","n":"25","t":"Dios es amor","p":"29","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Dios es amor, Dios es amor, la Biblia lo dice. Dios es amor, Dios es amor, Pablo lo repite. Dios es amor, Dios es amor, Juan también lo dice, en su capítulo cuatro, versículo ocho, primera de Juan, Amén."}]},{"s":"Himnario infantil","n":"26","t":"Dios Padre","p":"30","c":"","l":[{"t":"v","x":"Dios Padre es mi Padre, su hijo es mi Cristo, es mío, es mío su Espíritu también; yo tengo una patria muy linda allá en los cielos, donde cantan los santos y a Dios dicen amén. Cuán glorioso en comunión los santos, alabando al trino y Santo Dios, él nos colma de infinitas bondades pues él es nuestro todo, es nuestro sumo bién."}],"w":1},{"s":"Himnario infantil","n":"27","t":"Dos manecitas","p":"30–31","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Dos manecitas doy a Cristo, dos rojos labios suyos son, y dos oídos que le escuchan, para alabarle tengo voz."},{"t":"v","n":"2","x":"Dos piecesitos que le siguen hasta los cielos donde está, con mis ojitos leo la biblia que habla del Padre Celestial."},{"t":"c","x":"De la vida y del albor te buscamos, ¡oh Señor!, De la vida y del albor tuyo soy Señor."}]},{"s":"Himnario infantil","n":"28","t":"El canto de Jocabed","p":"31","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras; Letra y Música: M. Coote Brown, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Duerme entre juncos, ¡oh, niño!, bajo la bóveda azul, mueven propicias, propicias tu cuna ondas que dora la luz."},{"t":"v","n":"2","x":"Dios desde el cielo te mira, mi corazón quieto está, pues que las ondas, las ondas tranquilas van la ribera a besar."},{"t":"v","n":"3","x":"Miriam de voces me llama, ¡vuelve a mi seno mi bien! Dios ha escuchado, escuchado mis ruegos, su grande amor cantaré."},{"t":"c","x":"Olas hermosas su sueño arrullad, ángeles puros su rostro velad."}]},{"s":"Himnario infantil","n":"29","t":"El niño Samuel","p":"32–33","c":"Letra y Música: N. Cejudo, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Duerme junto al templo un tierno niño, que es ofrenda grata de piedad; niño que su madre ha consagrado al servicio de Jehová. Mística la lampara está ardiendo, quieta está la noche en derredor, óyese de pronto acento extraño, misteriosa y suave voz."},{"t":"v","n":"2","x":"Dios había escogido al niño puro, para que pudiera gobernar con toda justicia y todo acierto, aquel pueblo de Jehová. Hoy de nuevo llama el Padre amante, demos pues oído a su voz, diga todo niño: \"Señor habla, que escuchandote yo estoy."},{"t":"c","x":"¡Oh Samuel! ¡Oh Samuel! así dijo al niño fiel, éste va hacia Elí y le dice \"Heme aquí\". \"Fue el Señor\" dijo Elí, si llamarte vuelve y dí: \"Habla presto Señor, que escuchando te yo estoy\"."}]},{"s":"Himnario infantil","n":"30","t":"El amor de Dios es maravilloso","p":"33","c":"Letra y música: Desconocido Arm. Edgar Pineda Fierro","l":[{"t":"v","x":"El amor de Dios es maravilloso, el amor de Dios es maravi lloso, el amor de Dios es maravi lloso, grande es el amor de Dios. Tan alto que no puedo estar arriba de el, tan hondo que no puedo estar abajo de el, tan hondo que no puedo estar afuera de el, grande es el amor de Dios."}],"w":1},{"s":"Himnario infantil","n":"31","t":"El es mi Rey","p":"34","c":"","l":[{"t":"v","x":"El es mi Rey por lo tanto yo le amo, él es mi Rey no hay otro como él, cada día alabanzas yo le canto. ¡Aleluya! él es mi Rey."}]},{"s":"Himnario infantil","n":"32","t":"El hombre sabio","p":"34–35","c":"Letra y Música: desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"El hombre sabio casa construyó y sobre roca él la edificó, el hombre sabio casa construyó y tormenta le cayo. Llovió a torrentes y se inundó, llovió a torrentes y se inundó, llovió a torrentes y se inundó y la casa permaneció."},{"t":"v","n":"2","x":"El hombre necio casa construyó y sobre arena él la edificó, el hombre necio casa construyo y tormenta le cayó. Llovió a torrentes y se inundó, llovió a torrentes y se inundó, llovió a torrentes y se inundó y la casa se cayó."},{"t":"v","n":"3","x":"Tu casa en Cristo puedes cimentar, tu casa en Cristo puedes cimentar, tu casa en Cristo puedes cimentar para nunca fracasar. El Dios del cielo te bendecirá tus oraciones él escuchará, si pruebas vienen a tu lado está porque Cristo la roca es."}]},{"s":"Himnario infantil","n":"33","t":"Esta lucecita","p":"35","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Esta lucecita yo la haré brillar, esta lucecita yo la haré brillar, esta lucecita yo la haré brillar, brillará, brillará, brillará."},{"t":"v","n":"2","x":"Cuando esté en el templo yo la haré brillar, cuando esté en la escuela yo la haré brillar, cuando esté en la casa yo la haré brillar, brillará, brillará, brillará."}]},{"s":"Himnario infantil","n":"34","t":"Hondo es como el mar","p":"35","c":"Letra y Música: Desconocido, Tr. G. P. Simonds, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Deconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Hondo es como el mar, alto cual cielo azul, cual océano en la inmensidad es el amor de Dios por ti, por mí, Sí."}]},{"s":"Himnario infantil","n":"35","t":"Jesús de los cielos","p":"36","c":"","l":[{"t":"v","n":"1","x":"Jesús Rey de los cielos al mundo bajó en busca de joyas que amante compró."},{"t":"v","n":"2","x":"Angustias y muerte y horrible aflicción costaron la joyas que amante compró."},{"t":"v","n":"3","x":"Los niños y niñas que van al Señor, son todas las joyas que amante compró."},{"t":"v","n":"4","x":"Venid pues alegres al buen Redentor, él quiere las joyas que amante compró."},{"t":"c","x":"Los niños salvados serán como el sol, Brillando en la gloria del Rey Salvador."}]},{"s":"Himnario infantil","n":"36","t":"La belleza de Cristo","p":"36","c":"Letra y Música: George F. Root, Tr. Juan Bautista Cabrera Ivars, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"La belleza de Cristo que mora en mí, su blancura y pureza yo quiero, sí, ¡Oh, Divino Jesús! ven y llena mi ser y que puedan de mí tu belleza ver."}]},{"s":"Himnario infantil","n":"37","t":"La Biblia es cual martillo","p":"37","c":"","l":[{"t":"v","n":"1","x":"La Biblia es cual martillo que parte la roca en dos; Es lámpara que alumbra como faro la tempestad. Espada de dos filos, espejo la Biblia es; Bendito libro de mi Dios Tú eres para mí."},{"t":"v","n":"2","x":"Semilla es que germina cuando entra en el corazón; Cual carne y leche hará crecer a todo el que la lee. El agua que nos limpia y nos da la seguridad Que Cristo es nuestro Salvador, La Biblia es para mí."}]},{"s":"Himnario infantil","n":"38","t":"La canción de la lluvia","p":"37","c":"Letra y Música: W. B. Mackie, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Bardwell N., Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Tin, tin, tin, oye bien, es la canción de la lluvia; tin, tin, tin, oye bien, gracias a Dios por la lluvia. ¿Quién hizo el arco iris? ni tú, ni yo, pues ¿quién? ¿Quién hizo el arco iris? fue Dios el sumo bien."}],"w":1},{"s":"Himnario infantil","n":"39","t":"Estoy contento aquí en la tierra","p":"38","c":"","l":[{"t":"v","n":"1","x":"Estoy contento aquí en la tierra con una casita de poco valor, pero en el cielo do los ángeles cantan, mansión de gloria yo voy a tener."},{"t":"v","n":"2","x":"Aquí tentado, muchas veces probado, pero no estoy sólo, a mi lado está Dios; soy peregrino sin hogar permanente, pero allá tengo mansión eternal."},{"t":"v","n":"3","x":"Aquí estoy pobre, pero no estoy triste, yo voy buscando la bella ciudad; allá yo tengo un arpa de oro y una corona que es eternal."},{"t":"c","x":"Mansión yo tengo allá En el cielo, en donde al oro abunda en raudal, un día muy pronto estaré con mi Cristo andando en calles de fino cristal."}]},{"s":"Himnario infantil","n":"40","t":"La gloria de Dios","p":"38–39","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"No te he dicho que si creyeres verás la gloria de Dios. No te he dicho que si creyeres verás la gloria de Dios. Verás la gloria de Dios, verás la gloria de Dios. No te he dicho que si creyeres verás la gloria de Dios."}]},{"s":"Himnario infantil","n":"41","t":"La pequeña labor","p":"39","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vazquez; Letra: A. D. de Rodríguez; Música: E. C. H. de Naylor, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"La pequeña labor que Dios quiera yo haré; trabajando se sirve al Señor y mi humilde trabajo él lo ve. Cada día contento, contento estaré, y lo que Dios quiera gustoso lo haré."},{"t":"v","n":"2","x":"Si mamita me llama, pronto acudiré; porque ella me ama le oñor y mi humilde trabajo él lo ve. Cada día contento, contento estaré, y bedeceré, cada día contento, con"},{"t":"c","x":"tento estaré, y lo que Dios quiera gustoso lo haré."}],"w":1},{"s":"Himnario infantil","n":"42","t":"Los niños de siete años","p":"40","c":"","l":[{"t":"v","x":"Los niños de siete años, de cinco y tres también entrar al cielo pueden, Jesús la puerta es. Creyendo siempre en Cristo de todo corazón, reciben de él la vida la paz y el perdón."}]},{"s":"Himnario infantil","n":"43","t":"Los niños son de Cristo","p":"40–41","c":"Letra y Música: G. J. Webb, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Los niños son de Cristo, él es su Salvador, son joyas muy preciosas compradas con su amor."},{"t":"v","n":"2","x":"Los niños son tesoros, pues que del cielo son, luz refulgente esparcen, en horas de aflicción."},{"t":"v","n":"3","x":"Los niños son estrellas de grata claridad, quiere Jesús que anuncien al mundo su verdad."},{"t":"v","n":"4","x":"Los niños son de Cristo, por ellos él vendrá, y con él para siempre dichosos vivirán."},{"t":"c","x":"Joyas, joyas, joyas, joyas del Salvador, están en esta tierra cuan dulce y santo amor."}],"w":1},{"s":"Himnario infantil","n":"44","t":"Los niños son de Cristo","p":"41","c":"Letra y Música: J. S. Fearis, Tr. H. C. Ball; Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Los niños son de Cristo nos dice el Señor, que en su palabra santa nos da su dirección. Que siempre estemos prestos para glorificar, tu nombre a cada paso por la eternidad. Señor te pedimos nos des más de tu amor, nos hagas niños fieles, nos des tu dirección,"}]},{"s":"Himnario infantil","n":"45","t":"Los que cantan","p":"42","c":"","l":[{"t":"v","x":"Los que cantan, cantan gloria al Cordero de la cruz. Los que cantancuentanla historia, la historia que habla de Cristo Jesús. Los que cantan sienten el gozo, el gozo del alma que les da Jesús."}],"w":1},{"s":"Himnario infantil","n":"46","t":"Maravilla","p":"42","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras.; Letra y Música: H. H. Lemmel, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Maravilla es saber que Cristo fue un niñito como yo, que una vida pura y santa aquí a este mundo él mostró."},{"t":"v","n":"2","x":"Me sorprende más saber que Cristo en los cielos hoy está, preparando para mí un lugar do con él me llevará."},{"t":"c","x":"Cuán admirable es mi Cristo, como él yo quiero ser, que su belleza los otros en mí la puedan ver.\n´ Cristo, como él yo quiero ser, que su belleza los otros en mí la puedan ver."}],"w":1},{"s":"Himnario infantil","n":"47","t":"Me gusta cantar","p":"43","c":"","l":[{"t":"v","x":"Me gusta cantar, me gusta cantar, me gusta cantarle a Cristo, me gusta cantar. Canto al rayar el día, canto en la noche azul, cada día siempre igual, a cantar, cantar."}]},{"s":"Himnario infantil","n":"48","t":"Mi barco es pequeño","p":"43","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Mi barco es pequeño, inmenso es el mar, Jesús es mi buen capitán. Él guía mi barco y todo va bién, hasta el país celestial."}],"w":1},{"s":"Himnario infantil","n":"49","t":"Mira cual amor","p":"44","c":"","l":[{"t":"v","x":"Mira cuál amor nos ha dado el Padre que seamos hechos los hijos de Dios. Por eso el mundo ya no nos conoce porque a él tampoco no le conoció."}]},{"s":"Himnario infantil","n":"50","t":"Necesitamos más de la oración","p":"44","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Desconocido, Arm. Isaac García Contreras.","l":[{"t":"v","x":"Necesitamos más de la oración, de la oración, de la oración; no es el hermano, ni la hermana, ni el pastor, sino yo que necesito la oración, sino yo que necesito la oración."}]},{"s":"Himnario infantil","n":"51","t":"Oh que gozo en el cielo","p":"45","c":"","l":[{"t":"v","n":"1","x":"Oh que gozo en el cielo los niños tendrán, Sí, los niños que aman a Jesús, arpas y coronas de oro tendrán y vestidos blanqueados de luz."},{"t":"v","n":"2","x":"En las calles de oro allí andarán, del maná celestial comerán, noche y muerte no habrá más allá, siempre Cristo les alumbrará."}]},{"s":"Himnario infantil","n":"52","t":"Oh, sí, yo soy feliz","p":"45","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"¡Oh, sí, soy feliz, feliz! ¡Oh, sí, soy feliz, feliz! Cristome amó y su gozo me dio, ¡Oh, sí, soy feliz!"}],"w":1},{"s":"Himnario infantil","n":"53","t":"Pajarito Canta tú","p":"45","c":"Letra y Música: M. E. Sullivan, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Desconocido, Arm. Isaac García Contreras.","l":[{"t":"v","x":"Pajarito canta tú, canta tú, canta tú. Pajarito canta tú, cantale al Señor. Cantale a las flores que hay en el jardín, cantale a los niños que aman a Jesús."}]},{"s":"Himnario infantil","n":"54","t":"Por mi niñez venturosa","p":"46","c":"Letra: Kate L. Brown","l":[{"t":"v","n":"1","x":"Por mi niñez venturosa te rindo gracias buen Dios, y te quiero y te bendigo por haber creado el sol, la lluvia que nos refresca, la fuente el ave y la flor."},{"t":"v","n":"2","x":"Gracias te doy por mis padres y también gracias te doy por la estrella de la tarde de tan vivo resplandor, como los ojos de un ángel de tu celestial mansión."},{"t":"v","n":"3","x":"Gracias te doy por los seres que están a mi derredor, por la escuela, por los libros en que aprendo la lección; y te doy gracias por todo lo que ama mi corazón."}]},{"s":"Himnario infantil","n":"55","t":"Qué gozo tengo","p":"46–47","c":"Música: Dueño Colón, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"¡Qué gozo tengo! ¡qué gozo tengo! ¡qué gozo tengo! por que Jesús, ha perdonado ya mis pecados, los ha borrado con su poder. Hay unas campanas en mi ser, ¡suenan tan alegres con poder!, repiten un canto que yo ya soy salvo, salvo por su gracia y su poder."}]},{"s":"Himnario infantil","n":"56","t":"Quiere Jesús que yo brille","p":"47","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra: Ernesto Barocio; Música: Edwin O Excell","l":[{"t":"v","n":"1","x":"Quiere Jesús que yo brille cual rayo de alba luz, en medio de las tinieblas reflejaré a Jesús."},{"t":"v","n":"2","x":"Quiere Jesús que yo muestre a todos mi bondad, para que el mundo contemple mi gran felicidad."},{"t":"v","n":"3","x":"A mi Jesús yo le pido me libre del pecar, y al reflejar sus bondades así podré brillar."},{"t":"v","n":"4","x":"Yo brillaré en las tinieblas cual rayo de alba luz, como brilló aquí en el mundo mi Salvador Jesús."},{"t":"c","x":"Que brille, que brille, quiere Jesús que yo brille; y siempre, do quiera, yo brillaré por Jesús."}],"w":1},{"s":"Himnario infantil","n":"57","t":"Si a Jesús acudes","p":"48","c":"","l":[{"t":"v","x":"Si a Jesús acudes todo bien está, si a Jesús acudes todo bien lo hará; tus pruebas trae a él, él es tu amigo fiel, si a Jesús acudes todo bien lo hará."}]},{"s":"Himnario infantil","n":"58","t":"Sí, la biblia es","p":"48","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras.; Letra y Música: M . T. Mc Pherson, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Sí, la biblia es libro de verdad, es el Don de Dios, siempre la verdad. ¡Oh, Sí! la biblia es la verdad, ¡Oh, Sí!, la biblia es la verdad, Palabra es de Dios y es verdad."}]},{"s":"Himnario infantil","n":"59","t":"Si perseverares hasta el fin","p":"49","c":"","l":[{"t":"v","x":"Si perseverares hasta el fin, una corona heredarás, y cuando suene el clarín con los fieles redimidos irás, Cristo ha dicho que ha ido ha preparar una morada para mí. Oh hermano yo no me quiero quedar, porque aquí mucho se va a sufrir. Oh hermano yo no me quiero quedar porque aquí mucho se va a sufrir."}]},{"s":"Himnario infantil","n":"60","t":"Soldado soy de Jesús","p":"49","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrillo","l":[{"t":"v","x":"Aunque no marche en la infantería, caballería, artillería Aunque en avión no valla volando pero soldado soy. Soldado soy de Jesús Soldado soy de Jesús"}]},{"s":"Himnario infantil","n":"61","t":"Somos peregrinos","p":"50","c":"","l":[{"t":"v","n":"1","x":"Somos peregrinos, vamos a Jesús, nuestra hermosa enseña es la de la cruz, vamos hacia el cielo, Dios su luz nos da, y él en sus mansiones nos espera ya."},{"t":"v","n":"2","x":"Dios amante cuida al que débil es, cuida no resbalen sus pequeños pies, vamos por el mundo con seguridad, siempre asegurados de su fiel bondad."},{"t":"v","n":"3","x":"Fuerza recibimos sólo del Señor, nada nos inspira ya ningún temor, fieles seguiremos su bendita voz, hasta que nos lleve hacia su mansión."},{"t":"c","x":"Somos peregrinos: marchad, vamos a la gloria: marchad, somos muy pequeños mas nos ama él, y en nuestro camino él nos guarda fiel."}]},{"s":"Himnario infantil","n":"62","t":"Soy feliz","p":"50–51","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Soy feliz y te diré por qué: sé que Jesucristo me salvó. De su gracia siempre cantaré. sé que Jesucristo me salvó. Triste y angustiada mi alma se sintió, mas Jesús quitó la carga y paz me dio. Canto alegre y es por que yo sé, que mis culpas Cristo las quitó."}]},{"s":"Himnario infantil","n":"63","t":"Soy feliz","p":"51","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Soy feliz y muy contento estoy porque Cristo el Rey de gloria aquí bajó, paz me dio en el corazón y me trajo salvación. Soy feliz y muy contento estoy."}]},{"s":"Himnario infantil","n":"64","t":"Tan alto como una montaña","p":"51","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Tan alto como una montaña fueron todos mis pecados, Jesús los borró, él me perdonó, por siempre con él viviré, ¡Amén! Escrito está me coronará, por siempre con él viviré, ¡Amén!"}]},{"s":"Himnario infantil","n":"65","t":"Tengo paz y perdón","p":"52","c":"","l":[{"t":"v","x":"Tengo paz y perdón desde que hallé a mi Salvador amante, lo pasado se fue ¿cómo, a dónde? No sé, ¡Aleluya! Tengo paz y perdón, gozo sin igual, el diablo ha huido y estoy convertido, tengo alegría, gozo, paz, perdón."}]},{"s":"Himnario infantil","n":"66","t":"Tengo un hogar en la gloria","p":"52","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Desconocido, Arm. Daniel Cruz Fuentes","l":[{"t":"v","x":"Tengo un hogar de gloria mas allá del azul. Tengo un hogar de gloria mas allá del azul Tengo un hogar de gloria mas allá del azul más allá del cielo azul Nunca olvides al Señor Nunca olvides al Señor Nunca olvides al Señor, al Señor del cielo azul"}]},{"s":"Himnario infantil","n":"67","t":"Todas mis culpas se fueron rodando","p":"53","c":"","l":[{"t":"v","n":"1","x":"Todas mis culpas se fueron rodando se fueron rodando se fueron rodando Todas mis culpas se fueron rodando allá en la cruz por mí."},{"t":"v","n":"2","x":"Paz como un río que llena mi ser que llena mi ser que llena mi ser Paz como un río que llena mi ser allá en la cruz por mí"}],"w":1},{"s":"Himnario infantil","n":"68","t":"Tres veces oraba Daniel en el día","p":"53","c":"Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrillo; Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrrillo","l":[{"t":"v","x":"Tres veces oraba Daniel en el día tres veces oraba el profeta Elías Daniel en el pozo un angel veía el profeta oraba y la lluvia caía. Dos estarán moliendo en un molino dos estarán durmiendo muy tranquilos uno se irá y el otro quedará debes estar listo porque el vendrá"}]},{"s":"Himnario infantil","n":"69","t":"Tu santa palabra Señor","p":"54","c":"","l":[{"t":"v","x":"Tu Santa Palabra Señor en mi corazón guardaré. para no pecar, para no pecar, para no pecar contra ti."}]},{"s":"Himnario infantil","n":"70","t":"Toda la semana","p":"54–55","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vazquez","l":[{"t":"v","x":"Toda la semana, los siete días todos, el Salvador me guarda en su amor; ya perdonado soy, a su morada voy, por siempre viviré con mi Señor. Me guarda del pecado, me libra de Satán, me libra de tristeza y todo mal, y toda la semana estoy día con día con gozo alabando al Salvador. Domingo tengo gozo, lunes continuará, el martes tengo paz que nadie quitará, el miércoles y jueves ca Gloria, gloria, gloria! ¡Oh, mino con Jesús, el viernes gozo su bondad y el sábado su luz. ¡Oh, gloria a Jesús, ¡Oh, aleluya ya soy salvo por muerte de cruz."}],"w":1},{"s":"Himnario infantil","n":"71","t":"Todos deben conocer","p":"55","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras; Letra y Música: Harry Dixon, Tr. G.P. Simmonds, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Todos deben conocer, todos deben conocer, todos deben conocer quién es Jesús. Es el lirio de los valles, es la rosa de Sarón, es la estrella matutina; todos deben conocer."},{"t":"v","n":"2","x":"Todos deben de saber, todos deben de saber, todos deben de saber qué hizo Jesús. Es amigo de los niños y los quiere proteger, él murió para salvarlos, todos deben de saber."}]},{"s":"Himnario infantil","n":"72","t":"Un cuervo aleteó","p":"56","c":"Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrillo","l":[{"t":"v","x":"Un cuervo alete aleteo aleteo llegando al arroyo bajo y lle baba pan y llevaba carne por que Dios se lo mando Y una viejecita juntaba su leñita cuando Elías por ahí pasó le hizo pan con aceite y harina que nunca se le a cabo"}]},{"s":"Himnario infantil","n":"73","t":"Ved la iglesia","p":"56–57","c":"Letra: C. E. Ballesteros; Música: William S. Pitts","l":[{"t":"v","n":"1","x":"Ved la iglesia que ufana levanta, al Señor su glorioso pendón, es la iglesia do todo creyente alza a Dios su ferviente oración."},{"t":"v","n":"2","x":"Todo allí en armonioso concierto, rinde culto supremo al Creador; ¿por qué tú que su gracia recibes, no le adoras, viviendo en su amor."},{"t":"v","n":"3","x":"Si es que alientas en tu alma el deseo de encontrar el alivio al dolor, lleva tu alma ante el trono de gracia, y a la iglesia de Cristo el Señor."},{"t":"c","x":"Oh, ven, ven, ven, ven, ven a la iglesia conmigo, oh, ven a adorad al Señor; no hay sitio más dulce en la tierra, que la casa del Padre de amor."}]},{"s":"Himnario infantil","n":"74","t":"Yo amo a mi Señor","p":"58","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Yo amo a mi Señor, mi Señor, mi Señor. Yo amo a mi Señor, ¡Sí! ¡Sí! ¡Sí!"},{"t":"v","n":"2","x":"Su vida dio por mí, dio por mí, dio por mí. Su vida dio por mí, ¡Sí! ¡Sí! ¡Sí!"},{"t":"v","n":"3","x":"Él me ama yo lo sé, yo lo sé, yo lo sé. Él me ama yo lo sé, ¡Sí! ¡Sí! ¡Sí!"},{"t":"v","n":"4","x":"Yo quiero a marte más mi Jesús, mi Señor. Yo quiero amarte más, ¡Sí! ¡Sí! ¡Sí!"}]},{"s":"Himnario infantil","n":"75","t":"Yo ascenderé","p":"58","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Yo ascenderé, yo ascenderé, yo ascenderé en la primer resurrección. Del norte vendrán, también vendrán del sur, del este y oeste se levantarán. Todos nos iremos, al cielo llegaremos, a morar allá con el Señor Jesús."}]},{"s":"Himnario infantil","n":"76","t":"Yo estoy contento","p":"59","c":"","l":[{"t":"v","n":"1","x":"Yo estoy contento, sí, siempre estoy contento, sí, desde que conozco al Señor, estoy contento, sí."},{"t":"v","n":"2","x":"Y por él yo salvo soy, y por él yo salvo soy, por la sangre de mi redentor, yo sé que salvo soy."},{"t":"v","n":"3","x":"A la gloria celestial, a la gloria celestial, pronto él me llevará con él, en gloria celestial."}]},{"s":"Himnario infantil","n":"77","t":"Yo pequé pero Dios me ama","p":"59","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra y Música: Desconocido, Arm. Francisco Daniel Sixtos Carrillo","l":[{"t":"v","x":"Yo pequé pero Dios me ama y Cristo murió por mí, yo le recibo y ya soy su hijo y es un plan para mí. Es un plan para mí, es un plan para mí, yo le recibo y ya soy su hijo y es un plan para mí"}]},{"s":"Himnario infantil","n":"78","t":"Yo soy de Cristo","p":"60","c":"","l":[{"t":"v","n":"1","x":"Yo soy de Cristo, el es mi vida por que en mi alma sembró una preciosa semilla que es la palabra de Dios."},{"t":"v","n":"2","x":"De esa semilla nació una planta con lluvias pentecostés; con sus ra í ces de fuego y su hojitas de fe."}]},{"s":"Himnario infantil","n":"79","t":"Yo tengo un amigo que me ama","p":"60","c":"Letra y Música: Desconocido, Arm. Daniel Cruz Flores; Letra Y Música: desconocida, Arm. Francisco Sixtos Carrillo","l":[{"t":"v","x":"Yo tengo un amigo que me ama, me ama, me ama Yo tengo un amigo que me ama su nombre es Jesùs. Que me ama que me ama que me ama si con tierno a Amor. Que me ama que me ama, Su nombre es Jesús."}],"w":1},{"s":"Himnario infantil","n":"80","t":"Yo tengo un tesoro","p":"61","c":"","l":[{"t":"v","x":"Yo tengo un tesoro precioso, por gracia de Dios me fue dado, compañeros seremos mi biblia y yo."}]},{"s":"Himnario infantil","n":"81","t":"Yo tengo una corona","p":"61","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.; Letra y Música: esconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Yo tengo una corona allá en el cielo que Cristo ha preparado para mí, y oí una voz del cielo que decía: \"hijo mío no te tardes en venir\"; no pudo resistir mi corazón y a la voz de Cristo me humillé; y me dijo levantate hijo mío que tus culpas con mi sangre yo lavé."}]},{"s":"Himnario infantil","n":"82","t":"Yo vivo contento","p":"62","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"Yo vivo contento, con Cristo en mi vida; toda la paz y alegría, la da Jesús, la da Jesús. El anhelar de mi vida, que te conozcan Jesús; pues tú cambias te mi vida, con ese amor que tienes tú, que tienes tú, mi Salvador, con ese amor que tienes tú."},{"t":"v","n":"2","x":"Yo vivo contento, con Cristo en mi vida; toda la paz y alegría, la da Jesús, la da Jesús. El anhelar de mi vida, al suplicarte Señor, que santifiques mi vida, con ese amor que tienes tú, que tienes tú, mi Salvador, con ese amor que tienes tú."}]},{"s":"Himnario infantil","n":"83","t":"Zaqueo era un chaparrito así","p":"63","c":"","l":[{"t":"v","x":"Zaqueo era un chaparrito así que vivió en Jericó Y al pasar Jesús por ahí se subió a un Sicomoro El Salvador lo vio ahí y le dijo así: Zaqueo bajate de ahí porque a tu casa voy a ir porque a tu casa voy a ir"}]},{"s":"Himnario infantil","n":"84","t":"Aleluya, aleluya","p":"63","c":"Letra y Música: Manuel Bonilla, Arm. Francisco Daniel Sixtos Carrillo; Letra y Música: Desconocido, Arm. Isaac García Contreras","l":[{"t":"v","x":"¡Aleluya, aleluya que acaba de nacer, el Rey de los cielos, el Cristo redentor. Cantemos aleluya en esta navidad."}]},{"s":"Himnario infantil","n":"85","t":"La bienvenida dad","p":"64","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"La bienvenida dad al día de Navidad, del año más feliz es sin dudar. El gozo y el placer se dejan luego ver, en todos los presentes al cantar."},{"t":"v","n":"2","x":"Ya vino el Salvador, de Dios el Don de amor, enviado como prueba de bondad. Un ángel lo anunció y el coro repitió al hombre paz y buena voluntad."},{"t":"c","x":"Nuevos himnos con afán cantad, de Belén al niño celebrad, Su cabeza coronad pues es el verdadero Rey."}]},{"s":"Himnario infantil","n":"86","t":"La noticia sin igual","p":"65","c":"Letra y Música: Villancico tradicional francés","l":[{"t":"v","n":"1","x":"La noticia sin igual el ángel la dio, A los fieles pastores del campo en Belén; Y aunque el frío invernal en la noche cundió, Las ovejas estaban cuidadas muy bien."},{"t":"v","n":"2","x":"Y una estrella todos vieron arriba brillar, Que viajaba hacia el Oeste del vasto confín; Y a la tierra alumbró con su luz estelar, Día y noche continuos en regio festín."},{"t":"v","n":"3","x":"Y los magos por fe siempre en pos de esa luz, Caminaron de lejos en busca de un Rey; Y al llegar hasta Belén donde es taba Jesús, Le adoraron con gozo cual su santa grey."},{"t":"v","n":"4","x":"Adoremos a Jesús en unión y amor, Por los muchos favores que él siempre nos da; De la tierra y el mar y del cielo es Creador, Por su sangre nuestra alma salvada está."},{"t":"c","x":"Noel, Noel, Noel, Noel Hoy ha nacido el Rey de Israel."}],"w":1},{"s":"Himnario infantil","n":"87","t":"Bendita noche buena","p":"66","c":"Letra y Música: Autor desconocido, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Bendita noche buena, del Padre rico don. Mayor que tú es Cristo, Eterna salvación. Por nuestra dicha vino, por darnos dirección, trazando el camino directo hasta Sión."},{"t":"v","n":"2","x":"Bendita noche buena, del Príncipe de paz. Amor nos muestra Cristo, que nunca cesará. Calienta, noche buena, mi tibio corazón, ofrenda le daremos y nuestra adoración."},{"t":"c","x":"Cantad la hermosa historia de Cristo nacido en Belén. El es Rey y Señor de la gloria, nos dejó la grata Navidad."}],"w":1},{"s":"Himnario infantil","n":"88","t":"Campanas por doquier","p":"67","c":"Letra y Música: Tradicional, Arr. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Campanas por doquier, resuenen sin cesar, proclamen con amor ¡Que hoy es Navidad! Los niños con canción la grata nueva dan de ese día de amor y buena voluntad. ¡Navidad! ¡Navidad! ¡Hoy es Navidad! es un día de alegría y felicidad, ¡Navidad! ¡Navidad! ¡Hoy es Navidad! es un día de alegría y felicidad."},{"t":"v","n":"2","x":"El día celebrar, el día tan feliz, su júbilo sin par podamos compartir. Y compartiendo así con otros cada cual, será el día más feliz y el gozo aumentará. Alegraos y gozaos que Jesús nació, gozaos Alegraos y gozaos que Jesús nació, gozaos"}]},{"s":"Himnario infantil","n":"89","t":"Campanitas","p":"68","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras.","l":[{"t":"v","x":"Din, dan, din, dan, cada muchachito es una campanita de cristal que suena sin cesar, que suena sin cesar. Din, dan, din, dan, anunciando a todos que hoy es navidad. Viene navidad con dicha y gozo para ti y para mí, todos muy contentos debemos cantar así ¡Sí! ¡Sí!"}]},{"s":"Himnario infantil","n":"90","t":"Escucha mi niña, te voy a contar","p":"69","c":"Letra y Música: Ira D. Sankey, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Escucha, mi niña te voy a contar del niño más lindo que hubiera jamás quisiera en tu almita su historia grabar, la historia que el tiempo hace amar más y más."},{"t":"v","n":"2","x":"La madre un encanto y el niño un primor, la cuna un pesebre, la casa un mesón; ¿mantillas? ¿quién tuvo indumenta peor, que aquel niño envuelto en un pobre girón."},{"t":"v","n":"3","x":"Tú tienes hijito un esplendido hogar, amigos, juguetes, vestidos calor, muchísimas cosas que te hacen gozar; mas eso aquel niño no vio en su redor."},{"t":"v","n":"4","x":"Y aquel pequeñito que pobre nació, ¿no sabes quien era el mismísimo Dios que desde su trono a este mundo bajó, por ver si pudiéramos de Él ir en pos."},{"t":"v","n":"5","x":"Te he dicho en esencia la historia sin par del niño que honra la fiel cristiandad, aprendela hijita y aprende a estimar al niño sublime de la Navidad."}]},{"s":"Himnario infantil","n":"91","t":"Hermosas velitas","p":"70","c":"","l":[{"t":"v","n":"1","x":"Hermosas velitas En la oscuridad Hablande la estrella De la Navidad."},{"t":"v","n":"2","x":"En silencio brillan Brillan sin cesar Y en su luz de Cristo nos vienen a hablar."},{"t":"v","n":"3","x":"Son muy pequeñitas Dan muy poca luz Mas la buena nueva nos dan de Jesús."},{"t":"v","n":"4","x":"Este mundo oscuro Cristo alumbrará Y a los hombres todos Él los salvará."},{"t":"c","x":"Ved vuestras velitas Ved que alumbran bien Hablan de la estrella Que brillo en Belén."}],"w":1},{"s":"Himnario infantil","n":"92","t":"Hoy alegres las campanas","p":"70–71","c":"Letra: Desconcido; Letra y Música: Vicente Mendoza","l":[{"t":"v","n":"1","x":"Hoy alegres las campanas por doquier se oyen resonar, Jubilosas y ufanas anunciando que es la Navidad, Es un día de alabanza, día de amistad y amor. Día de placer precioso, día de alabanza y canción."},{"t":"v","n":"2","x":"Oh, sonad, sonad campanas, anunciad el día sin igual Y con voz sonora y clara difundid la nueva celestial, Proclamad con alegría Cristo ha nacido en un por tal: \"Gloria a Dios en las alturas y a los hombres buena voluntad\"."}]},{"s":"Himnario infantil","n":"93","t":"Hoy es la grata navidad","p":"71","c":"Música: Melodía tradicional Galesa, Arr. Isaac García Contreras; Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro","l":[{"t":"v","n":"1","x":"Hoy es la grata Navidad el día de felicidad, de amistad y amor, de amistad y amor. De nuestros corazones alcemos mil canciones, con jubilosas voces y tierna devoción."},{"t":"v","n":"2","x":"Con regocijo en cada hogar los niños cantan sin cesar hoy es la Navidad, hoy es la Navidad. Es día de alborozo de canto melodioso de rica paz y gozo de santa devoción."}]},{"s":"Himnario infantil","n":"94","t":"Navidad, ¡Que felicidad!","p":"72","c":"Letra: Desconocido; Música: Tradicional Inglés, Arr. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Navidad ¡Que felicidad! Es un día de alegría y de dulce melodía, hoy es Navidad, ¡Que felicidad!"},{"t":"v","n":"2","x":"Navidad ¡Que felicidad! Es un día aún más grato cuando a otros alegramos, hoy es Navidad, ¡Que felicidad!"}]},{"s":"Himnario infantil","n":"95","t":"Campanas de Navidad","p":"72","c":"Letra y Música: Autor desconocido, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"¿Porqué de las campanas hoy se oyen resonar? anuncian con su dulce voz que hoy es Navidad que hoy es Navidad"},{"t":"v","n":"2","x":"¿Porqué alegres cantan hoy los niños por doquier es esta su feliz canción Jesús nació en Belén, Jesús nació en Belén"},{"t":"v","n":"3","x":"¿Que le daremos a Jesús en su cumpleaños hoy? nuestra obediencia y gratitud, son dones de su amor, son dones de su amor"}]},{"s":"Himnario infantil","n":"96","t":"¿Por qué hay gozo y felicidad?","p":"73","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras.","l":[{"t":"v","x":"¿Por qué hay en navidad gozo y felicidad? Hombres de la antigüedad vieron una claridad, astro hermoso señaló y al pesebre los llevó. Encontraron un bebé, cuya cuna el heno fue. Su mamá feliz cantó: Cristo el Santo ya nació. Por lo tanto en navidad, gozo hay y felicidad, gozo hay y felicidad."}]},{"s":"Himnario infantil","n":"97","t":"¡Qué bonita Navidad!","p":"74","c":"Letra: Desconocido, Trad. A. Espinoza; Música: W. A. Post, Arr. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"¡Qué bonita Navidad! todo el mundo alegre esta con sencillo corazón, hoy entona su canción. Al niñito de Belén, a Jesús que es nuestro bién le venimos a cantar hoy en esta Navidad."},{"t":"v","n":"2","x":"Niños vamos a cantar, esta noche no hay pesar, ni tristeza ni dolor, todo es gozo paz y amor. a los pies del buen Jesús, hallaremos dulce luz, ángeles anuncian ya, que Jesús nacido ha."}],"w":1},{"s":"Himnario infantil","n":"98","t":"Qué contento y feliz","p":"74–75","c":"Letra y Música: Autor desconocido, Arr. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Qué contento y feliz hoy se siente el corazón, que ha naD G Coro C"},{"t":"v","n":"2","x":"De Isaí vástago es El que ofrece el perdón, y Su cido Jesús Príncipe de amor"},{"t":"v","n":"3","x":"Almas puras venid a los pies del Salvador, sois de gracia dará con su bendición, ¡Aleluya! sin cesar dé con rosa un botón que abre con la luz."},{"t":"c","x":"júbilo Israel que el Señor vino ya, nuestro hermoso Rey."}],"w":1},{"s":"Himnario infantil","n":"99","t":"Qué día tan feliz","p":"75","c":"Letra y Música: Desconocido, Arr. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Qué día tan feliz Navidad, de alegrías mil Navidad, día de amistad y de amor, de gozo lleno el corazón, de gozo lleno el corazón"},{"t":"v","n":"2","x":"De las campanas hoy Navidad, se oye el dulce son Navidad, la grata nueva dan que en Belén nació Jesús el niño Rey, nació Jesús el niño Rey"},{"t":"v","n":"3","x":"Cantan en cada hogar Navidad, los niños al gozar Navidad, el día celebrar reina el placer, la buena voluntad doquier, la buena voluntad doquier."}]},{"s":"Himnario infantil","n":"100","t":"Suenen hoy las campanas","p":"76","c":"","l":[{"t":"v","n":"1","x":"Suenen hoy las campanas dulces de Navidad diciendo al mundo ufanas de Dios la gran bondad."},{"t":"v","n":"2","x":"Digan el gran mensaje que absorto el hombre oyó, por su terreno viaje \"Cristo en Belén nació\"."},{"t":"v","n":"3","x":"Digan con alborozo la gran nueva de amor, que el niño prodigioso es nuestro Salvador."},{"t":"c","x":"Tan, tan, resuenen las campanas, tan, tan cual cándidas hermanas, tan, tan, diciendo al mundo ufanas que en Belén Jesús nació."}]},{"s":"Himnario infantil","n":"101","t":"Un hermoso pequeñuelo","p":"76–77","c":"Letra y Música: E. Velasco, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Un hermoso pequeñuelo acaba de nacer tan bello es que arrobados los ángeles lo ven."},{"t":"v","n":"2","x":"Cantos celestiales oyen, pastores de Belén ángeles son que celebran la Navidad del Rey."},{"t":"v","n":"3","x":"Magos del oriente vienen sus dones a ofrecer oro incienso y mirra ponen, humildes a sus pies."},{"t":"v","n":"4","x":"No tengo oro ni riquezas que darle al Niño Rey Solo un corazón de niño que lo ama y cree en Él."},{"t":"c","x":"¡Hosanna! ¡Hosanna! Cristo nació en Belén ¡Hosanna! ¡Hosanna! el prometido Emanuel."}]},{"s":"Himnario infantil","n":"102","t":"Venid, pastorcillos","p":"77","c":"Letra y Música: E. O. Excell, Arm. Francisco Javier Corona Vázquez; Letra: Francisco Martínez de la Rosa; Música: Carl Müller","l":[{"t":"v","n":"1","x":"Venid, pastorcillos, venid a adorar Al Rey de los cielos que nacido udame, para andar en tus caminos de amor. en tu amor ¿qué puede faltar? Si eres tú mi Dios, dame más y más. Si tú estás en mí ¿qué me importa sufrir? Acaríciame, acaríciame, que contigo no me importa morir."}],"w":1},{"s":"Coros especiales","n":"3","t":"Al estar aquí","p":"88–89","c":"Letra y Música: Marcos Witt. ©1989 CanZion Producciones, Adm. por CanZion Editora; Arm. Edgar Obed Pineda Fierro.","l":[{"t":"v","x":"Al estar en la presencia de tu divinidad y al contemplar la hermosura de tu santidad, mi espíritu se alegra en tu majestad, te adoro a ti, te adoro a ti, cuando veo la grandeza de tu dulce amor y compruebo la pureza de tu corazón, mi espíritu se alegra en tu majestad, te adoro a ti, te adoro a ti, y al estar aquí, delante de ti te adoraré, postrado ante ti mi corazón te adora oh Dios y siempre quiero estar para adorar y contemplar tu santidad, te adoro a ti Señor, te adoro a ti."}]},{"s":"Coros especiales","n":"4","t":"Alabad a Jehová","p":"90","c":"Letra y Música: Desconocido, Arr. Felipe Blycker J.","l":[{"t":"v","x":"Alabad, a Jehová, naciones todas pueblos todos alabadle; porque ha engrandecido sobre nosotros su misericordia, y la verdad de Jehová es para siempre aleluya amén, y la verdad de Jehová es para siempre aleluya amén."}]},{"s":"Coros especiales","n":"5","t":"Alabad a nuestro Dios en su santuario","p":"90–91","c":"Letra y Música: Osdy Soriano, México 1976, Arr. Obed Valencia","l":[{"t":"v","n":"1","x":"Alabad a nuestro Dios en su santuario, en la hermosura de su cielo, por sus proezas alabadle a él. tad Alabadle con el alegre pandero, con el candor de la"},{"t":"v","n":"2","x":"Alabadle por la grandeza de su nombre, con el sonido de bocina, salterio y arpa a la vez can Alabadle con cuerdas flautas y címbalos, de júbilo reso"},{"t":"c","x":"danza, cantad con gozo al Señor nantes, en su lenguaje todo lo que respira alabe a Jehová. va. Amén"}],"w":1},{"s":"Coros especiales","n":"6","t":"Alegres pajarillos","p":"92","c":"","l":[{"t":"v","n":"1","x":"Alegres pajarillos que se despiertan en la alborada, vengan contentos aquí a cantar, que ya la luz de oriente viene anunciando otro nuevo día, día venturoso lleno de felicidad."},{"t":"v","n":"2","x":"Que vivas muchos años, todos alegres y muy contentos, te lo deseamos de corazón; que el Padre amante y bueno, Dios de los cielos telo conceda, y haga efectiva nuestra felicitación."}],"w":1},{"s":"Coros especiales","n":"7","t":"Algo sucedió el día que me rendí a él","p":"92–93","c":"Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro; Letra y Música: Desconocido, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Algo sucedió el día en que me rendí a Él, algo cambió en mi ser. Con su amor me enseñó a amar a los demás y ahoquiero serle siempre fiel."},{"t":"v","n":"2","x":"Ahora vivo solamente para mi Jesús, y para servir a los demás Quitó la venda de mis ojos y veo luz y siempre mi amigo el será."},{"t":"c","x":"Me cambió, me cambió, me cambió, me cambió, alegría, gozo y paz hay en mi ser; Sí, en mi ser; me cambió y puede hacer lo mismo para ti."}],"w":1},{"s":"Coros especiales","n":"8","t":"Allá en el cielo, allá en el cielo","p":"93","c":"Letra y Música: Desconocido","l":[{"t":"v","x":"Allá en el cielo, allá en el cielo, allá en el cielo no habrá más llanto, ni más tristeza, ni más dolor; Y cuando estemos los redimidos allá en el cielo alabaremos al Señor."}]},{"s":"Coros especiales","n":"9","t":"Amarte sólo a ti","p":"94","c":"","l":[{"t":"v","n":"1","x":"Amarte sólo a Ti, Señor, amarte sólo a ti, Señor; Amarte sólo a Ti, Señor, y no mirar atrás. Seguir tu caminar, Señor; Seguir sin desmayar, Señor; Postrado ante tu altar, Señor, y no mirar atrás."},{"t":"v","n":"2","x":"Amarte sólo a Ti, Señor, siempre llevar tu cruz, Señor; Amarte sólo a Ti, Señor, y hacer tu voluntad. Al pobre defender, Señor; Al débil proteger, Señor; Tu reino proclamar, Señor, y no mirar atrás."}],"w":1},{"s":"Coros especiales","n":"10","t":"Amigo soy de Dios","p":"94","c":"Letra y Música: Desconocido; Letra y Música: Desconocido","l":[{"t":"v","x":"Amigo soy de Dios, por la preciosa sangre de Jesús, Con ella me salvó Y mis pecados todos perdonó. Amigo soy de Dios, Vivo dichoso porque veo su faz; Amístate hoy con Dios Y para siempre dulce paz tendrás."}]},{"s":"Coros especiales","n":"11","t":"Ando con Cristo","p":"95","c":"Letra y Música: Roberto C. Savage. Arr. Isaac García Contreras","l":[{"t":"v","x":"Ando con Cristo en sombras y en luz estoy con mi Jesús. Ando con Cristo él es mi amigo mejor. rió por mí, yo nunca retrocederé. ré. No, No, No yo nunca retrocederé. ré."}],"w":1},{"s":"Coros especiales","n":"12","t":"Aquí en esta casa","p":"95","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Aquí en esta casa conocí a Jesús, Él me dio la vida, él me dio la luz. Por él vivo y creo y a la gloria voy, gloria a mi Cristo, por su redención."}]},{"s":"Coros especiales","n":"13","t":"Aquí estoy","p":"96","c":"Letra y Música: Jesús García, Arm. Edgar Obed Pineda Fierro.","l":[{"t":"v","x":"Aquí estoy te ofrezco todo lo que soy, E A E F c aquí estoy un sacrificio quiero ser, toma mi ser mi vida te entrego a Ti. Porque Tú eres mi Dios eres digno de adoración, una ofrenda de amor seré para Ti. Por que para Ti."}],"w":1},{"s":"Coros especiales","n":"14","t":"Aún tiene poder la sangre que él derramó","p":"97","c":"Letra y Música: Desconocido","l":[{"t":"v","x":"Aún tiene poder la sangre que Él derramó por ti por mí; desde el Getsemaní Donde Él oró y al Gólgota ascendió Y mis culpas allí lavó. Pon aceite en mi luz, aceite en mi luz ¡Oh! Padre celestial Guárdame en la lid luchando por Jesús Hasta el día final"}]},{"s":"Coros especiales","n":"15","t":"Aviva nuestros días","p":"98","c":"Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro","l":[{"t":"v","x":"Aviva nuestros días como al principio, concédenos volvamos al primer amor. Que las almas se salven y enfermos sanen y el fuego de tu Espíritu desciend ","x":"Brillando y luchando por Cristo el Señor, velando y orando, soldados sin temor; siempre andando y hablando con nuestro Salvador, viviendo siempre por Cristo el Rey."}]},{"s":"Coros especiales","n":"22","t":"Cada día con Cristo","p":"102–103","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras","l":[{"t":"v","x":"Cada día con Cristo me llena de perfecta paz, cada día con Cristo le amo más y más. Él me salva y guarda y se que pronto volverá. Y vivir con Cristo más dulce cada día será. rá."}],"w":1},{"s":"Coros especiales","n":"23","t":"Cantad Victoria","p":"103","c":"Letra y Música: Wendell P. Loveless","l":[{"t":"v","x":"Cantad \"victoria\" La palabra del vencedor, Cantad \"victoria\" venceremos por fe y a mor; Si vienen pruebas y a afán, Miremos al Capitán quien es el Salvador Y en victoria nos guiará"}]},{"s":"Coros especiales","n":"24","t":"Clama a Mí","p":"104","c":"","l":[{"t":"v","n":"1","x":"\"Clama a mí y te responderé, clama a mí y te enseñaré cosas grandes que no sabes, \"dice nuestro Dios\""},{"t":"v","n":"2","x":"Pues oremos sin dudar jamás, y tendremos bendición y paz, ganaremos la victoria ¡Gloria a Dios!"}],"w":1},{"s":"Coros especiales","n":"25","t":"Con Cristo en mi alma","p":"104","c":"Letra y Música: Merril Dunlop; Letra y Música: Desconocido, Arr. y Tr. Roberto C. Savage","l":[{"t":"v","x":"Con Cristo en mi alma todo marcha feliz, marcha feliz, marcha feliz. Con Cristo en mi alma todo marcha feliz, jamás me dejará. No te dé temor, no te dé temor. Con"}]},{"s":"Coros especiales","n":"26","t":"Con fe marchemos","p":"105","c":"Letra y Música: R. J. Oliver, Trad. Roberto C. Savage","l":[{"t":"v","x":"Con fe marchemos, ¡Adelante sin temor cristanos! Cristo el capitán nos va guiando; siempre él nos da la orden ¡Adelante! A la batalla no temamos nada de Satán. ¡Oh, compañeros! vamos adelante con afán."}]},{"s":"Coros especiales","n":"27","t":"Con mis labios y mi vida","p":"106","c":"","l":[{"t":"v","x":"Con mis labios y mi vida te alabo, llí logré lavar; la gloria de su gran poder, me goso en ensalzar."},{"t":"v","n":"4","x":"¡Eterna fuente carmesí! ¡raudal de puro amor! se lavará por siempre en ti, el pueblo del Señor."},{"t":"c","x":"Sí, salvo soy, sí, salvo soy, sí, salvo soy, sí, salvo soy. Por la sangre de Cristo mi Señor; Por la sangre de Cristo mi Señor Por la Sangre de Cristo mi Señor, La sangre de Jesús"}],"w":1},{"s":"Coros especiales","n":"169","t":"Ya salvo soy, ya salvo soy","p":"210","c":"","l":[{"t":"v","x":"Ya salvo soy, ya salvo soy, ¡Aleluya! y salvo soy; Mis culpas y pecados Por Cristo son borrados, ¡Aleluya! ya salvo soy."}]},{"s":"Coros especiales","n":"170","t":"Yo amo a Cristo, él es mi amigo","p":"210","c":"Letra y Música: Desconocido","l":[{"t":"v","x":"Yo amo a Cristo, El es mi Amigo, Me ha salvado, me ha sanado; Poder me ha dado, Pues me ha llenado Del Santo Espíritu, fiel Consolador."}]},{"s":"Coros especiales","n":"170b","t":"Yo encontré en la Biblia sagrada","p":"210","c":"Letra y Música: Desconocido; Letra y Música: Guadalupe Velasco","l":[{"t":"v","x":"Yo encontré en la Biblia sagrada una luz, sí, una luz. luz. Y esa luz es mi Jesús, el dueño de mi corazón."}]},{"s":"Coros especiales","n":"171","t":"Yo me alegré con los que me decian","p":"211","c":"","l":[{"t":"v","x":"Yo me alegre con los que me decían, a la casa de Jehová iremos. remos, yo iré yo iré a la casa de Jehová yo iré,"}]},{"s":"Coros especiales","n":"172","t":"Yo me deleito en el amor del Salvador","p":"211","c":"Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro; Letra y Música: Desconocido","l":[{"t":"v","x":"Yo me deleito en el amor del Salvador Que me salvó del pecado y del error, Es por eso que sediento de su amor Yo me consagro a Él de todo corazón; Cristo bendito, has de mi alma un altar Para adorarte con devoción Para beber del agua de la vida, Y así saciar siempre mi corazón"}]},{"s":"Coros especiales","n":"173","t":"Yo quiero más y más de Cristo","p":"212","c":"","l":[{"t":"v","x":"Yo quiero más y más de Cristo, yo quiero más de su poder, yo quiero más de tu presencia, yo quiero más y más de él"}]},{"s":"Coros especiales","n":"174","t":"Yo quiero ser, Señor amante","p":"212","c":"Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro.","l":[{"t":"v","x":"Yo quiero ser, Señor amante, como el barro en manos del alfarero, toma mi vida y hazla de nuevo, yo quiero ser yo quiero ser, un vaso nuevo."}]},{"s":"Coros especiales","n":"175","t":"Yo quiero servirle","p":"212–213","c":"Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro","l":[{"t":"v","x":"Yo quiero servirle desde hoy, yo quiero servirle des de hoy; para recibir las bendiciones del Señor, necesito servirle desde hoy. Y el Señor Jesús con su poder nos sostendrá, y nos librará de todo mal en su bondad."}]},{"s":"Coros especiales","n":"176","t":"Yo siento como que la gloria bajó","p":"213","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras.; Letra y Música: Desconocido","l":[{"t":"v","x":"Yo siento como que la gloria bajó, bajó del cielo bajó aquí; y a mí me da poder, y a mí me da poder, y a mí me da poder para poder vencer. Va bajando ya, va bajando ya, va bajando la gloria de Jehová; si la iglesia orando está, el Señor va a contestar, va bajando la gloria de Jehová."}]},{"s":"Coros especiales","n":"177","t":"Yo tengo gozo en mi alma","p":"214","c":"","l":[{"t":"v","x":"Yo tengo gozo en mi alma, gozo en mi alma, gozo en mi alma y en mi ser, son como ríos de agua viva, ríos de agua viva, ríos de agua viva en mi ser."}]},{"s":"Coros especiales","n":"178","t":"Yo soy testigo del poder de Dios","p":"214","c":"Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro; Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro","l":[{"t":"v","x":"Yo soy testigo del poder de Dios, muchos milagros él ha hecho en mí, pues era ciego y ahora veo la luz, la luz gloriosa la cual es Jesús."}]},{"s":"Coros especiales","n":"179","t":"Yo tengo gran gozo en mi corazón","p":"214–215","c":"Letra y Música: Desconocido","l":[{"t":"v","x":"Yo tengo gran gozo en mi corazón, yo tengo gran gozo en mi corazón; Sí, Cristo me salvó, de gozo me llenó, yo tengo gran gozo en mi corazón. Ya mi copa reboza de gozo; ya mi copa reboza de gozo, ¡Oh! qué fácil es orar, obedecer y confiar. Sí, mi copa reboza de gozo."}]},{"s":"Coros especiales","n":"180","t":"Yo vivo Señor porque tú vives","p":"215","c":"Letra y Música: Adán Calderón, Francisco Javier Corona Vázquez.","l":[{"t":"v","x":"Yo vivo, Señor, por que tú vives; por que tú vives, Señor, es que yo vivo; tú me das gozo, me das consuelo, y en aflicciones Señor estás conmigo."}]},{"s":"Himnario congregacional","n":"1","t":"A Cristo doy mi canto","p":"223","c":"Letra y Música: Philip Phillips","l":[{"t":"v","n":"1","x":"A Cristo doy mi canto. Él salva el alma mía; Me libra del quebranto Y con amor me guía."},{"t":"v","n":"2","x":"Jamás dolor ni agravios Enlutarán la mente, Si a Cristo nuestros labios Bendicen dulcemente."},{"t":"v","n":"3","x":"Tu nombre bendecido Alegra el alma mía; Tu nombre es en mi oído Dulcísima armonía."},{"t":"v","n":"4","x":"Viviendo he de ensalzarte, Y si abandono el suelo Veranme ir a adorarte Los ángeles del cielo."},{"t":"c","x":"Ensalce nuestro canto Tu sacro santa Historia; Es nuestro anhelo santo Mirar, Jesús, tu gloria."}]},{"s":"Himnario congregacional","n":"2","t":"A Dios el Padre Celestial","p":"224–224","c":"Letra: Tradicional | (2-2) Música: Atribuido a Louis Bourgeois, en salterio de Ginebra, 1551; Letra: Tradicional; Música: Jimmy Owens (variantes: 2-1, 2-2)","l":[{"t":"v","n":"1","x":"A Dios el Padre Celestial, al Hijo nuestro Redentor y al Eternal Consolador, unidos todos alabad."},{"t":"v","n":"2","x":"Cantad al trino y uno Dios, sus alabanzas entonad; su eterna gloria proclamad con gozo, gratitud y amor. Amén."}]},{"s":"Himnario congregacional","n":"3","t":"A ti la gloria","p":"225","c":"Letra: Edmon Budry, 1884.; Música: George F. Handel, de Judas Maccabaeus, Parte 3 No. 36, 1746.","l":[{"t":"v","n":"1","x":"A ti la gloria, ¡Oh, nuestro Señor! a ti la victoria, gran libertador. te alzaste pujante, lleno de poder, más que el sol radiante al amanecer."},{"t":"v","n":"2","x":"Gozo, alegría, reinen por doquier, porque Cristo hoy día muestra su poder; ángeles cantando himnos al Señor, vanle aclamando como vencedor."},{"t":"v","n":"3","x":"Libre de penas, nuestro Rey Jesús rompe las cadenas de la esclavitud; ¡Ha resucitado, ya no morirá! quien muera al pecado en Dios vivirá."},{"t":"v","n":"4","x":"A ti la gloria, ¡Oh, nuestro Señor, a ti la victoria, gran libertador."}],"w":1},{"s":"Himnario congregacional","n":"4","t":"Al Rey de los cielos, Jehová el glorioso","p":"226–227","c":"Letra y Música: Autor desconocido","l":[{"t":"v","n":"1","x":"Al Rey de los cielos Jehová el glorioso, Cantemos con gozo en santa comunión; Con gran reverencia a Él llegaremos, Su nombre ensalcemos de todo corazón."},{"t":"v","n":"2","x":"Con gran regocijo a Cristo alabemos, Al Hijo de Dios que nos dio la redención; Dejando su trono de gloria en los cielos Al mundo perdido brindole salvación."},{"t":"v","n":"3","x":"Al Santo Espíritu grata promesa, Daremos entrada en nuestro corazón; Sublime potencia, poder y grandeza, Al hombre levanta de triste condición."},{"t":"v","n":"4","x":"Al Trino Dios entonemos con gozo, Canciones de triunfo por su grande bondad; Por tus bendiciones recibe propicio mi humilde servicio, Divina Trinidad."},{"t":"c","x":"Gozo y paz hay en mi corazón, Su sangre me lavó y aseguró mi salvación; vir. ¡Oh! gran dulce esperanza nos alienta para seguir La senda que el Maestro nos trazó con su ejemplo aquí; Allá en lontananza, al fin de la labor, Veremos la grandeza de nuestro Salvador.\nEs mi anhelo a mi Señor servir, Su voluntad cumplir y para Él siempre vi gran dulce esperanza nos alienta para seguir La senda que el Maestro nos trazó con su ejemplo aquí; Allá en lontananza, al fin de la labor, Veremos la grandeza de nuestro Salvador."}],"w":1},{"s":"Himnario congregacional","n":"5","t":"Bendice, alma, a tu Creador","p":"228–229","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: Chas H. Gabriel","l":[{"t":"v","n":"1","x":"Bendice, alma a tu Creador Con férvida canción, Despierte y cante su loor Tu ardiente corazón. No olvides nunca su bondad Con negra in gratitud, Pues"},{"t":"v","n":"2","x":"De bien tu boca llena esté Y nueva juventud A tu alma siempre le dará, Calmando tu inquietud. En ira es lento para arder Mas pronto es en su amor; No"},{"t":"v","n":"3","x":"Se acuerda que del polvo soy Formado en su poder, Que el hombre es flor tan sólo de hoy Que al sol va a perecer. Mas Él de siglo en siglo da Su amor sin limitar A"},{"t":"c","x":"Él perdona tu maldad, Te salva y da salud. ¡Cantad, cantad dulcísima canción! ¡Cantad, cantad al Rey de la Creación! ¡Vosotros, ángeles que Él creó Y hacéis su voluntad, Vosotras, obras que Él formó, Su nombre celebrad!\nquiere siempre contender, Ni dura su furor. ¡Cantad, cantad dulcísima canción! ¡Cantad, cantad al Rey de la Creación! ¡Vosotros, ángeles que Él creó Y hacéis su voluntad, Vosotras, obras que Él formó, Su nombre celebrad!\ntodo aquel que listo está Sus leyes a guardar. ¡Cantad, cantad dulcísima canción! ¡Cantad, cantad al Rey de la Creación! ¡Vosotros, ángeles que Él creó Y hacéis su voluntad, Vosotras, obras que Él formó, Su nombre celebrad!"}],"w":1},{"s":"Himnario congregacional","n":"6","t":"Cantaremos alabanzas","p":"230–233","c":"Letra y Música: Aquiles Mireles Perales, ICI | (6-2) Letra y Música: Aquiles Mireles Perales, ICI. (variantes: 6-1, 6-2)","l":[{"t":"v","n":"1","x":"Cantaremos alabanzas Al Eterno Creador, Por las bienaventuranzas Que nos brinda con amor; Levantemos nuestro canto, Cual perfume subirá Hasta el trono puro y santo Del bendito Jehová"},{"t":"v","n":"2","x":"Elevemos nuestro canto De alabanza al Creador, Al gran Dios tres veces santo Alabemos con amor; Por su gracia inefable Le a Le adoramos con fervor, Por su amor inescrutable Bendecimos al Señor."},{"t":"v","n":"3","x":"Ensalzamos hoy tu nombre Por tu Dádiva, Señor, Para rescatar al hombre Diste al Hijo de tu Amor; Descendiendo a este mundo Nuestras culpas Él llevó, Pues que con amor profundo En la cruz por nos murió."},{"t":"c","x":"¡Salve, Señor increado! ¡Salve, Señor poderoso! Llévame a tu lado, Padre bondadoso. Sólo en Ti yo confío, Quiero seguirte fiel; Guíame, Dios mío Hasta el día final."}],"w":1},{"s":"Himnario congregacional","n":"7","t":"Con cánticos, Señor","p":"234","c":"Letra: Charles Wesley, 1746; trad. Merrel N. Hutchinson, 1877; Música: John Darwall","l":[{"t":"v","n":"1","x":"Con cánticos, Señor, Mi corazón y voz Te adoran con fervor ¡Oh! Trino, Santo Dios."},{"t":"v","n":"2","x":"Tu mano paternal Trazó mi senda aquí; Mis pasos cada cual, velados son por Ti. En tu mansión yo"},{"t":"v","n":"3","x":"Innumerables son Tus bienes, y sin par, Que por tu compasión Recibo sin cesar."},{"t":"v","n":"4","x":"Tú eres, ¡Oh Señor! Mi sumo, todo bien, Mil lenguas tu amor Cantando siempre estén."},{"t":"c","x":"te veré, Y galardón feliz tendré."}],"w":1},{"s":"Himnario congregacional","n":"8","t":"Señor mi Dios","p":"235","c":"Letra: Stuart K. Hine, 1948, basada en la poesía original de Carl Boberg, 1885, Trad. A.W. Hotton Rives; Música: Antigua melodía sueca, Arr. Stuart K. Hine, 1949","l":[{"t":"v","n":"1","x":"Señor mi Dios, al contemplar los cielos, el firmamento y las estrellas mil; al oír tu voz en los potentes truenos y ver brillar el sol en su cenit."},{"t":"v","n":"2","x":"Al recorrer los montes y los valles y ver las bellas flores al pasar, al escuchar el canto de las aves y el murmurar del claro manantial."},{"t":"v","n":"3","x":"Cuando recuerdo del amor divino que desde el cielo al Salvador envió, aquel Jesús que por salvarme vino y en una cruz sufrió por mí y murió."},{"t":"v","n":"4","x":"Cuando el Señor me llame a su presencia, al dulce hogar al cielo de esplendor, le adoraré cantando la grandeza de su poder y su infinito amor."},{"t":"c","x":"Mi corazón entona la canción: ¡Cuán grande es Él! ¡Cuán grande es Él! Mi corazón entona la canción: ¡Cuán grande es Él! ¡Cuán grande es Él!"}]},{"s":"Himnario congregacional","n":"9","t":"Dad al Padre toda gloria","p":"236","c":"Letra: Tr. H. C. Ball, 1896; Música: Mrs. M.J. Harris","l":[{"t":"v","n":"1","x":"Dad al Padre toda gloria, Dad al Hijo todo honor, Y al Espíritu divino Alabanzas de loor. Adoradle, adoradle, Adorad al Salvador; (al Salvador; ) Tributadle toda gloria, Pueblo suyo por su grande amor."},{"t":"v","n":"2","x":"Adoradle, ¡Oh Iglesia! Por Jesús tu redentor Rescatada por su gracia, Libre por su grande amor. Yo te adoro, yo te adoro, Yo te adoro buen Jesús; (sí, buen Jesús; ) Yo te adoro reverente, ¡Oh, Cordero Santo de mi Dios!"},{"t":"v","n":"3","x":"Entonadle un canto nuevo, Huestes libres del Señor; Tierra, cielos, mar y luna, Gloria den al Trino Dios."}],"w":1},{"s":"Himnario congregacional","n":"10","t":"¡Gloria a ti, Jesús Divino!","p":"237","c":"Letra: En estrella de Belén; Música: William Steffe, Melodía americana, Battle Hymn","l":[{"t":"v","n":"1","x":"¡Gloria a ti, Jesús Divino! ¡Gloria a ti por tus bondades!"},{"t":"v","n":"2","x":"Tú me amaste con ternura Y por mí en la cruz moriste;"},{"t":"v","n":"3","x":"Tengo fe sólo en tu muerte, Pues con ella me salvaste;"},{"t":"v","n":"4","x":"Te veremos en el cielo, A vivir contigo iremos;"},{"t":"c","x":"Gloria eterna a tus piedades! ¡Querido Salvador! ¡Gloria, gloria, aleluya! ¡Gloria, gloria, aleluya! ¡Gloria, gloria, aleluya! ¡A nuestro Salvador!\nCon ternura me quisiste, ¡Querido Salvador! ¡Gloria, gloria, aleluya! ¡Gloria, gloria, aleluya! ¡Gloria, gloria, aleluya! ¡A nuestro Salvador!\nVida eterna me compraste, ¡Querido Salvador! ¡Gloria, gloria, aleluya! ¡Gloria, gloria, aleluya! ¡Gloria, gloria, aleluya! ¡A nuestro Salvador!\nTu presencia gozaremos, ¡Querido Salvador! ¡Gloria, gloria, aleluya! ¡Gloria, gloria, aleluya! ¡Gloria, gloria, aleluya! ¡A nuestro Salvador!"}],"w":1},{"s":"Himnario congregacional","n":"10b","t":"Es el Dios de los ejércitos","p":"238","c":"Letra: Julia Ward Howe, Tr. Roberto C. Savage; Música: Melodía americana s. XIX","l":[{"t":"v","n":"1","x":"Es el Dios de los ejercitos en quien yo confiaré, y con címbalos de gozo al Señor ensalzaré; él despide los relámpagos, mas nunca temeré, él es mi protector."},{"t":"v","n":"2","x":"Con ejército no gana sus victorias el Señor, ni con fuerza lucha en contra de Satán, el tentador; la potencia del Espíritu, ha dicho el Dios de amor, es la que vencerá."},{"t":"v","n":"3","x":"En Belén de Judea el Señor Jesús nació, y después de treinta años en la cruenta cruz murió; pero vive para siempre, pues la tumba él venció; su nombre alabaré."},{"t":"v","n":"4","x":"El Señor de los señores ya muy pronto volverá, y a su pueblo con gran gozo a las nubes llevará; y por siempre moraremos todos en la eternidad con nuestro Salvador."},{"t":"c","x":"¡Gloria, gloria, aleluya! ¡Gloria, gloria, aleluya! ¡Gloria, gloria, aleluya! a nuestro Salvador."}],"w":1},{"s":"Himnario congregacional","n":"10c","t":"Los cielos cuentan la gloria del Padre","p":"239","c":"Letra: Tr. Eduardo Balderas; Música: Ludwig van Beethoven","l":[{"t":"v","n":"1","x":"Los cielos cuentan la gloria del Padre, la obra de sus manos son. loor los ecos del mar le cantan, repitan todos la canción. Los astros del cielo tiene contados, los límites del mar fijó; al sol y la luna dióles morada, al Rey de reyes adorad, al Rey de reyes adorad."},{"t":"v","n":"2","x":"Su giro tiene Dios entre los cielos, sus obras nunca tienen fin; y ¿quién podrá de él esconderse, si para él no hay confín? La ley del gran Jehová es perfecta, el alma hace regresar; su testimonio quedó en los cielos, adoren todos sin cesar, adoren todos sin cesar."}],"w":1},{"s":"Himnario congregacional","n":"11","t":"¡Hosanna! ¡Hosanna! ¡Hosanna!","p":"240","c":"Letra: Desconocido; Música: William B. Bradbury","l":[{"t":"v","x":"¡Hosanna! ¡hosanna! ¡
