170","t":"Somos soldados y vamos a la lucha","p":"441","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Somos soldados y vamos a la lucha con valor, porque llevamos por Jefe a Jesús el Salvador. No nos arreda el combate, pelearemos con vigor; un galardón nos espera en la obra del Señor."},{"t":"v","n":"2","x":"Si tú te sientes cansado, ven, acude al Redentor; aliviará él tu Cristo murió en el calvario, por nosotros en la cruz, y nos lavó con su carga, te dará nuevo vigor, para luchar en las huestes redimidas por su asangre, para darnos nueva luz, somos limpios de pecado por la gracia de su amor. ¡Oh, pecador, no vaciles, sé soldado del Señor! mor, él nos libró de las garras del terrible tentador."},{"t":"v","n":"3","x":"Vamos felices cantando \"Aleluyas\" al Señor; a grande voz anunciamos las promesas de su amor, pues grandes cosas ha hecho con el pobre pecador. Bendito seas por siempre ¡Oh, divino Salvador!"},{"t":"c","x":"Escucha el llamamiento del Redentor; abre tu corazón, te llama con amor; lavará tus maldades, vil pecador; ven, acude gozoso, al bendito Señor.\nCon gozo lucharemos contra el mal, Cristo está con nosotros y nos ayudará, seguiremos haciendo su voluntad; la victoria, por siempre, Jesús nos dará."}],"w":1},{"s":"Himnario congregacional","n":"171","t":"Soy soldado de Cristo","p":"442–443","c":"Letra: Henry Cleofas Ball; Música: Mrs. Charles Hammond Morris (Lelia Naylor Morris, 1862–1929)","l":[{"t":"v","n":"1","x":"Soy soldado de Cristo, de Cristo el Salvador, Pelearé yo por él la batalla de la fe; Con mis ojos así puestos en mi Capitán Pelearé yo en contra de Satán."},{"t":"v","n":"2","x":"La Palabra de Dios es la espada de la fe Que me ayuda a pelear por Jesús el Salvador; Lucharé, triunfaré; con las huestes del Señor, Me verás hoy pelear en la batalla."},{"t":"v","n":"3","x":"¿No quisieras venir tú también en pos de él Y pelear hoy por él la batalla de la fe? Si eres fiel al Señor la corona te dará Y con él gozarás felicidad."},{"t":"v","n":"4","x":"Pronto, yo bien lo sé, la batalla cesará, Y con Cristo así reinaremos más allá; ¡Oh, qué dicha indecible será con él vivir Donde no hay más tristeza que sufrir!"},{"t":"c","x":"Oíd la voz de Cristo que nos llama: \"A la batalla, a la batalla\", Oíd la voz de Cristo que nos dice: ¿Quiénes van hoy a pelear?\" Yo soy soldado de Jesu(o bien: Aleluya) cristo Y por fe la lucha venceré, ¡Oh sí! Yo soy soldado de Jesucristo, Y victoria y triunfo obtendré."}],"w":1},{"s":"Himnario congregacional","n":"172","t":"Surjan regias vanguardias","p":"444–445","c":"Letra y Música: Manuel V. Flores","l":[{"t":"v","n":"1","x":"Surjan regias vanguardias En pie, Juveniles huestes, Id en pos del Maestro, El Rey, Capitán y Dios. Es tiempo de partir vanguardias de Jesús, La patria ansiosa busca un Salvador y Dios."},{"t":"v","n":"2","x":"Surjan regias vanguardias En pie, juveniles huestes, Id al mundo irredento, Del Hijo de Dios hablad. La aguda adversidad Indómitos venced, Y un cántico de triunfo se oiga resonar."},{"t":"v","n":"3","x":"Surjan regias vanguardias De las redimidas huestes Anunciando de gracia Las nuevas de salvación; Digamos con afán Que Cristo nos salvó, Que al pecador contrito quiere redimir."},{"t":"c","x":"Siembra el mensaje del Redentor, Cumple la ordenanza de tu Rey, No retrocedas en tu labor, A la juventud perdida ve; Háblales de Jesús, Salud de su dolor, Y rinde eterna gloria al Salvador."}]},{"s":"Himnario congregacional","n":"173","t":"Trabajemos misioneros","p":"446","c":"Letra: Pedro Ontiveros, ICI.; Música: Navor Zepeda, ICI.; Himno: \"Cuerpo Nacional de Misioneros\"","l":[{"t":"v","n":"1","x":"Trabajemos misioneros, de este mundo en derredor, Rescatemos a los hombres de las redes del opresor, Conducidlos a la"},{"t":"v","n":"2","x":"Trabajemos misioneros en las huestes de Jesús, Anunciemos que en Cristo hay amor, hay bondad y paz, Traslademos a los"},{"t":"v","n":"3","x":"Si eres salvo se testigo y hoy ven a trabajar, Habla presto y no calles el amor del Salvador, Jesucristo hoy te"},{"t":"c","x":"fuente de salud y bendición, Solo Cristo salva y redime al pobre pecador. ñor les quiere dar, sólo en Jesús el alma hallará salvación y vida eternal.\nhombres de tinieblas a la luz, Que el tiempo ya de la siega se acerca más y más. Muchas almas hay, que quisieran disfrutar, Gracia sin igual que el Señor les quiere dar, sólo en Jesús el alma hallará salvación y vida eternal.\nllama a los campos de la mies, Ven hermano, ven que tú puedes las almas rescatar. ñor les quiere dar, sólo en Jesús el alma hallará salvación y vida eternal."}],"w":1},{"s":"Himnario congregacional","n":"174","t":"Venimos cantando alabanzas","p":"447","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Venimos cantando alabanzas, trayendo mensaje de amor; mensaje que sale del alma, porque Cristo ya mora en mi ser. Veser."},{"t":"v","n":"2","x":"Iremos cantando y llorando, sembrando simiente de amor; mas luego vendremos gozosos, trayendo gavillas de amor. Imor."},{"t":"c","x":"Es amor, es amor, lo que Cristo vino a traer, para ti, para mí, lo que Cristo vino atraer. Es aer."}],"w":1},{"s":"Himnario congregacional","n":"175","t":"Voy feliz al dulce hogar","p":"448","c":"Letra: Henry Cleofas Ball; Música: R. H. Cornelius","l":[{"t":"v","n":"1","x":"Voy feliz al dulce hogar, por fe en Jesús, mientras lucho por traer almas a la luz; dardos encendidos mil, vienen contra mí, mas yo sé, por la fe, venceré aquí."},{"t":"v","n":"2","x":"En las olas del turbión, Cristo guardará mi barquilla, y guiará hasta el puerto allá. Yo tranquilo puedo estar, mi piloto es él; es mi Rey, tengo fe, sé que él es fiel."},{"t":"v","n":"3","x":"En servir al Salvador, por los valles voy, donde muchas sombras hay más seguro estoy. Muchos triunfos obtendré, nunca faltará mi Jesús, es la luz, él me sostendrá."},{"t":"c","x":"¡Oh! sí, quiero verle, ver al Salvador; quiero ver su rostro lleno de amor. En aquel gran día, yo he de cantar: Ya pasó todo afán, todo mi pesar."}]},{"s":"Himnario congregacional","n":"176","t":"Ya las huestes se aprestan","p":"449","c":"Letra y Música: H. R. Palmer.","l":[{"t":"v","n":"1","x":"Ya las huestes se aprestan para la batalla, es Jesús el capitán que a todos nos guiará; y con él a la cabeza no hay que vacilar, de seguro al triunfo nos llevará."},{"t":"v","n":"2","x":"Las legiones de Jesús de triunfo en triunfo avanzan ¿no las vez con qué valor combaten contra el mal? ¿puedes tú quedar dormido o indiferente cuando otros luchan sin descansar?"},{"t":"v","n":"3","x":"Date prisa, no vaciles, él te solicita, si amas a Jesús también a otros amarás; y si andan en las sendas de la iniquidad, a los pies de Cristo los llevarás."},{"t":"v","n":"4","x":"Es la mies muy grande y los obreros son muy pocos; desde hoy mi Salvador hallarme él podrá; trabajando en su mies en busca de las almas, y con su poder él me sostendrá."},{"t":"c","x":"Yo quiero estar con Cristo, en lo rudo de la lid, yo quiero siempre listo, valiente combatir; hasta que en gloria pueda verle, mi carrera al terminar, y vida eterna con él gozar."}]},{"s":"Himnario congregacional","n":"177","t":"Ya sea en el valle do el peligro esté","p":"450–451","c":"Letra: H. C. Ball; Música: C. Austin Miles","l":[{"t":"v","n":"1","x":"Ya sea en el valle do el peligro es té O que en la luz gloriosa de paz habite yo, A mi Jesús diré, \"Tu voluntad haré\" Si Cristo me guía doquiera yo iré."},{"t":"v","n":"2","x":"Si al desierto quiere Jesús que vaya yo, Llevando buenas nuevas de santa salvación, Si allí en dura lid, mi campo señaló, A Cristo yo sigo, sin más dilación."},{"t":"v","n":"3","x":"Aunque mi parte sea mi dura cruz llevar, Diré a mis hermanos también su gran poder; Contento quedaré, mi luz haré brillar, Testigo de Cristo doquiera seré."},{"t":"v","n":"4","x":"La voluntad de Cristo yo quiero obedecer, Pues en la Santa Biblia encuentro mi saber, Y con su gran poder, al mundo venceré, Si él va conmigo, doquiera yo iré."},{"t":"c","x":"Si Cristo conmigo va, yo iré Yo no temeré, con gozo iré, conmigo va; Es grato servir a Jesús, llevar la cruz; Si Cristo conmigo va, Yo iré."}]},{"s":"Himnario congregacional","n":"178","t":"Yo quiero trabajar por el Señor","p":"452","c":"Letra: Pedro Grado; Música: Isaiah Baltzell","l":[{"t":"v","n":"1","x":"Yo quiero trabajar por el Señor, Confiando en su palabra y en su a"},{"t":"v","n":"2","x":"Yo quiero cada día trabajar, Y esclavos del pecado liber"},{"t":"v","n":"3","x":"Yo quiero ser obrero de valor, Confiando en el poder del Salva"},{"t":"c","x":"mor, Quiero yo cantar y orar Y ocupado siempre estar, en la Obra del Señor. Trabajar y orar En la Obra, en la Obrad el Señor, Sí, mi anhelo es orar y ocupado siempre estar en la Obra del Señor.\ntar; Conducirlos a Jesús, Nuestro guía nuestra luz, en la Trabajar y orar, Trabajar y orar del Señor\ndor; El que quiera trabajar, Hallará también lugar, en la"}],"w":1},{"s":"Himnario congregacional","n":"179","t":"Yo quisiera hablarte del amor de Cristo","p":"453","c":"Letra y Música: Charles Frederick Weigle (1871-1966), Tr. S. D. Athans","l":[{"t":"v","n":"1","x":"Yo quisiera hablarte del amor de Cristo, pues en él hallé un amigo fuerte y fiel, por su gracia transformó mi vida entera, lo que en esta vida soy lo debo a él."},{"t":"v","n":"2","x":"Mi alma estaba llena de ayes y tristezas, llena estaba de miserias y dolor; con ternura Cristo me tendió la mano, y me guió por el sendero del amor."},{"t":"v","n":"3","x":"Cada día viene a darme nuevo aliento, a mi corazón infunde dulce paz; no comprenderé por qué vino a salvarme, hasta que en el cielo pueda ver su faz."},{"t":"c","x":"Nadie pudo amarme como Cristo, es incomparable su amistad; sólo el pudo redimirme del pecado, por su amor y su bondad."}]},{"s":"Himnario congregacional","n":"180","t":"Yo soy soldado de Jesús","p":"454","c":"Letra y arreglo: Henry Cleofas Ball; Música: Inglés","l":[{"t":"v","n":"1","x":"Yo soy soldado de Jesús Salvado por su amor;"},{"t":"v","n":"2","x":"No temeré llevar su cruz, Sufriendo con valor. Lucharon otros por la fe Y yo luchar podré,"},{"t":"v","n":"3","x":"Por mi Señor yo pelearé Confiando en su poder. Es menester que sea fiel, Que nunca vueva atrás;"},{"t":"v","n":"4","x":"Que siga siempre en pos de él, Y me guiará en paz."},{"t":"c","x":"Después de la batalla nos coronará, Dios nos coronará; Dios nos coronará; Después de la batalla nos coronará En aquella Santa Sión Más allá más allá en aquella san ta Sión. DesMás allá Más allá (o bien: pues de la batalla nos coronará En aquella Santa Sión)"}],"w":1},{"s":"Himnario congregacional","n":"181","t":"Yo tengo una esperanza","p":"455","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Yo tengo una esperanza muy grande y muy firme: que allá en las mansiones nos hemos de ver; por eso, confiado en su amor sagrado, como fiel soldado, yo voy a luchar."},{"t":"v","n":"2","x":"Pero si algún día se llegara mi cita, que Dios me solicita, yo tengo que ir; por eso, confiado en mi Jesucristo, como fiel soldado, yo voy a luchar."},{"t":"v","n":"3","x":"Cuando yo me vaya de esta triste vida, con gozo profundo, les voy a dejar un grato recuerdo de mis aflicciones, que allá en las mansiones, nos hemos de ver."},{"t":"c","x":"Cristo bendito del cielo, es el que me ha de ayudar para llegar a la gloria, donde yo quiero morar. Yo soy embajador de Cristo el Salvador, me voy a preparar a predicar su amor; el día ya se acerca, señales ya se ven, que Cristo está a la puerta diciendo: ven y ven."}]},{"s":"Himnario congregacional","n":"181b","t":"Todo este mundo es confusión","p":"456–457","c":"Letra y Música: Pablo Garrido, 1990, ICIAR, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Todo este mundo es confusión, todo está lleno de maldad; en todo hay falta de amor, en todo falta la amistad. Un mundo con problemas no vivirá, y tú conoces a Jesús, y este reto es del Señor para ti: cambia este mundo con su amor."},{"t":"v","n":"2","x":"Duro este gran trabajo es, mas un apoyo tengo en mí Él, que conmigo estará, me apoyará fiel hasta el fin. Problemas si me seguirán yo lo sé, pero mi vida está en Él; y perseguido yo quizás estaré mas desde hoy me ayudará. Oye, vive y habla ahora"},{"t":"v","n":"3","x":"Deja tu orgullo hoy aquí, oye la voz del Dios de amor, te hace un llamado a cambiar, a ser cristiano de verdad. Un mundo con problemas no vivirá, y tú conoces a Jesús, y este reto es del Señor para ti: cambia este mundo para Él."},{"t":"c","x":"el evangelio de la paz, ven, lucha y cambia el mundo con el amor que da Jesús."}],"w":1},{"s":"Himnario congregacional","n":"182","t":"Cerca de ti, Señor","p":"458","c":"Letra: Sarah F. Adams, Trad. Thomas M. Westrup; Música: Lowel Mason","l":[{"t":"v","n":"1","x":"Cerca de Ti Señor, quiero morar, Tu grande y tierno amor quiero gozar."},{"t":"v","n":"2","x":"Pasos inciertos doy, el sol se va; Mas si contigo estoy no temo ya."},{"t":"v","n":"3","x":"Día feliz veré creyendo en Ti, En que yo habitaré, cerca de Ti."},{"t":"c","x":"Llena mi pobre ser, limpia mi corazón. Hazme tu rostro ver En comunión\nHimnos de gratitud ferviente cantaré, Y fiel a Ti, Jesús Siempre seré\nMi voz alabará, tu dulce nombre allí, Y mi alma gozará, Cerca de Ti."}],"w":1},{"s":"Himnario congregacional","n":"183","t":"Cerca de ti yo voy Señor","p":"459","c":"Letra y Música: Francisco SánchezMuñiz, ICI, 1945","l":[{"t":"v","n":"1","x":"Cerca de ti yo voy, Señor cerca de ti no hay temor; contigo voy, contigo estoy, mi ser te entrego a ti Señor."},{"t":"v","n":"2","x":"No temeré la tempestad, que a mi alma quiera perturbar; conmigo vas, conmigo estás tú solo das paz, seguridad."},{"t":"v","n":"3","x":"Cerca de ti anhelo estar y de tu mano caminar; hasta llegar, mi buen Jesús a aquella hermosa cuidad de Luz."},{"t":"c","x":"Tu eres mi amparo, mi fortaleza, mi pronto auxilio en la aflicción; castillo fuerte, mi roca eterna, mi escondedero fiel, Señor"}]},{"s":"Himnario congregacional","n":"184","t":"Cerca, más cerca, ¡Oh! Dios de ti","p":"460","c":"Letra: Vicente Mendoza Polanco (1875–1955); Música: Mrs. Charles Hammond Morris (Lelia Naylor Morris, 1862–1929)","l":[{"t":"v","n":"1","x":"Cerca, más cerca, ¡Oh! Dios, de ti Cerca yo quiero mi vida llevar; Cerca, más cerca, ¡Oh! Dios, de ti Cerca a tu gracia que puede salvar, Cerca a tu gracia que puede salvar."},{"t":"v","n":"2","x":"Cerca, más cerca, cual pobre soy, Nada, Señor, yo te puedo ofrecer; Sólo mi ser, contrito te doy, Pueda contigo la paz obtener, Pueda contigo la paz obtener."},{"t":"v","n":"3","x":"Cerca, más cerca, Señor de ti, Quiero ser tuyo dejando el pecar; Goces y pompas vanas aquí, Todo Señor pronto quiero dejar, Todo, Señor, pronto quiero dejar."},{"t":"v","n":"4","x":"Cerca, más cerca, mientras el ser, Aliente vida y busque tu paz; Y cuando al cielo pueda ascender, Ya para siempre contigo estaré, Ya para siempre contigo estaré."}]},{"s":"Himnario congregacional","n":"185","t":"Da lo mejor al Maestro","p":"461","c":"Letra: Howard B. Grose, Tr. Speros D. Athans; Música: Charlotte A. Barnard","l":[{"t":"c","x":"1. Da lo mejor al Maestro: ¡tu fuerza, tu juventud! Todo el fervor de tu alma, tu exuberante salud. Dueño sea él de tu vida, sírvele con fe y amor. Todo a su gracia lo de debes, ¡Dale a Jesús lo mejor!\n2. Da lo mejor al Maestro: entrégale el corazón. Nadie como él te ha amado; digno es de tu devoción. Rico y feliz quiere hacerte; es gran tesoro su amor. Deja que llene tu alma, ¡Dale a Jesús lo mejor!\n3. Da lo mejor al Maestro: haz por amor suyo el bien. Para servirnos él vino; Sirve tú a otros también Di a los perdidos que él salva, que él cura todo dolor. Que ama, consuela y ayuda, ¡Dale a Jesús lo mejor!\nDa lo mejor al Maestro: a combatir por él ven, sé paladín decidido, de la verdad y del bien."}],"w":1},{"s":"Himnario congregacional","n":"186","t":"Fui bautizado como manda el Salvador","p":"462","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Fui bautizado como manda el Salvador, qué grande"},{"t":"v","n":"2","x":"Adiós mundo que hasta ayer estuve en ti, donde el pe"},{"t":"v","n":"3","x":"No miro más que el camino de la fe donde muy"},{"t":"v","n":"4","x":"El refugio de Jesús es mi sostén, nunca po"},{"t":"c","x":"gozo siento yo en mi corazón; ya mis pecados los borró mi Salvador; quiero llegar puro y limpio a su mansión. ré a mi Jesús, ya para mi lo de este mundo se acabó; quedo ayudado de su cruz y proseguir en sus caminos quiero yo.\ncado alimentaba mi vivir; yo siento gozo desde que me bauticé, y de volver a pecar mejor morir. Seguiré a mi Jesús, ya para mi lo de este mundo se acabó; quedo ayudado de su cruz y proseguir en sus caminos quiero yo.\npocos han podido caminar; pero hoy recibo la corona de la fe, y a su patria muy feliz quiero llegar. ré a mi Jesús, ya para mi lo de este mundo se acabó; quedo ayudado de su cruz y proseguir en sus caminos quiero yo.\ndré desfallecer en mi deber; alabanzas con gran gozo cantaré y a mi Señor con gran gozo serviré. ré a mi Jesús, ya para mi lo de este mundo se acabó; quedo ayudado de su cruz y proseguir en sus caminos quiero yo."}],"w":1},{"s":"Himnario congregacional","n":"187","t":"Jesús yo he prometido","p":"463","c":"Letra: John Ernest Bode (1816-1874), Tr. Juan Bautista Cabrera Ivars; Música: Arthur Henry Mann (1850-1929)","l":[{"t":"v","n":"1","x":"Jesús yo he prometido servirte con amor, concédeme tu gracia, mi amigo y Salvador. No temeré la lucha si tú a mi lado estás, ni perderé el camino si tú guiando vas."},{"t":"v","n":"2","x":"El mundo está muy cerca y abunda tentación; sutil es el engaño y necia la pasión. Ven tú, Jesús, más cerca, mostrando tu piedad, y escuda al alma mía de toda iniquidad."},{"t":"v","n":"3","x":"Cuando mi mente vague, ya incierta, ya veloz, concédeme que escuche, Jesús, tu clara voz. Anímame si paro, inspírame también, repréndeme si temo en todo hacer el bien."},{"t":"v","n":"4","x":"Jesús, tú has prometido a todo aquel que va siguiendo tus pisadas, que al cielo llegará, sostenme en el camino, y al fin con dulce amor trasládame ha tu gloria, mi amigo y Salvador."}]},{"s":"Himnario congregacional","n":"188","t":"Mientras caminamos hacia el cielo azul","p":"464","c":"La sombra de la cruz; Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Mientras caminamos hacia el cielo azul, sufriremos pruebas, Sí, esas pruebas vienen siendo bendición a la sombra de la cruz."},{"t":"v","n":"2","x":"Cristo allí tomó la carga sobre sí, él llevó nuestro dolor. Por la cruz él nos guiará a la mansión, le veremos faz a faz."},{"t":"c","x":"¿Vives tú bajo la sombra de la cruz, do el Señor murió por ti? Por la cruz él nos guiará a la mansión, le veremos faz a faz."}]},{"s":"Himnario congregacional","n":"189","t":"Aquí me tienes ante tus plantas","p":"465","c":"Loor a ti; Letra y Música: José Nuñez, ICIAR, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Aquí me tienes ante tus plantas porque en ti encuentra gozo mi ser;"},{"t":"v","n":"2","x":"Yo no soy digno de tu amor santo, mas por tu sangre lavado fui,"},{"t":"v","n":"3","x":"A ti te entrego toda mi vida, a ti te entrego todo mi ser;"},{"t":"v","n":"4","x":"Sé que con nada podré pagarte el sacrificio hecho por mí,"},{"t":"c","x":"sé que contigo nada me falta, sé que en el cielo tu gloria he de ver. Cristo mi Redentor, Cristo mi Salvador, siempre a tu nombre santo mis labios darán loor.\ntu vida diste por mis pecados, gracias te doy mi Jesús gracias mil. Cristo mi Redentor, Cristo mi Salvador, siempre a tu nombre santo mis labios darán loor.\nnunca te apartes, nunca me dejes, porque contigo siempre he de vencer. Cristo mi Redentor, Cristo mi Salvador, siempre a tu nombre santo mis labios darán loor.\nsólo te pido seguirte amando toda mi vida hasta llegar a ti. Cristo mi Redentor, Cristo mi Salvador, siempre a tu nombre santo mis labios darán loor."}],"w":1},{"s":"Himnario congregacional","n":"190","t":"Marchemos presurosos por la senda","p":"466–467","c":"","l":[{"t":"v","n":"1","x":"Marchemos presurosos por la senda Que el Divino Salvador nos enseñó, Oigamos su Palabra pura y bella Que en su santo Evangelio nos dejó; Guardemos sus mandatos con firmeza Desechando el egoísmo y el error, zón."},{"t":"v","n":"2","x":"Oremos sin cesar de noche y día, Alabemos al sublime Salvador, Rogándole que sea nuestro guía, Que nos guarde en su divino amor; Pidámosle la fuerza suficiente Para poder resistir la tentación; Cantémosle canciones diferentes, Agradecidos de todo cora"},{"t":"v","n":"3","x":"Cantemos con alegres corazones Al Señor que de su gracia nos llenó, Cantemos por doquier las bendiciones Que su mano divina derramó: Cantemos con amor al Dios Eterno Porque nos da de su bondad y su perdón;"},{"t":"c","x":"¡Sólo en Ti hay paz, oh Redentor! En Ti hay piedad y salvación; En Ti hay consuelo, En Ti hay amor, En Ti hay bondad, En Ti hay perdón."}],"w":1},{"s":"Himnario congregacional","n":"190b","t":"Mi espíritu, alma y cuerpo","p":"467","c":"Letra y Música: Pedro Osorno, ICIAR.; Letra: H. C. E.; Música: Ira D. Sankey","l":[{"t":"v","n":"1","x":"Mi espíritu, alma y cuerpo, Mi ser, mi vida entera, Cual viva, santa ofrenda, Entrego a Ti, mi Dios."},{"t":"v","n":"2","x":"Soy tuyo, Jesucristo, Comprado con tu sangre; Contigo haz que ande En plena comunión."},{"t":"v","n":"3","x":"Espíritu Divino, Del Padre la promesa Sedienta, mi alma anhela De Ti la santa unción."},{"t":"c","x":"Mi todo a Dios consagro En Cristo, el vivo altar; Descienda el fuego santo, Su sello celestial."}]},{"s":"Himnario congregacional","n":"191","t":"Más santidad dame","p":"468","c":"Letra: My Prayer; Música: Philip Paul Bliss (1838-1876)","l":[{"t":"v","n":"1","x":"Más santidad dame, Más odio al mal, Más calma en las penas, Más alto ideal; Más fe en mi maestro, Más consagración, Más celo en servirle, Más grata oración."},{"t":"v","n":"2","x":"Más prudente hazme, Más sabio en él, Más firme en su causa, Más fuerte y más fiel; Más recto en la vida, Más triste al pecar, Más humilde hijo, Más pronto en amar."},{"t":"v","n":"3","x":"Más pureza dame, Más fuerza en Jesús, Más de su dominio, Más paz en la cruz; Más rica esperanza, Más obras aquí, Más ansia del cielo, Más gozo allí."}],"w":1},{"s":"Himnario congregacional","n":"192","t":"Mi Buen Jesús, mi Salvador","p":"469","c":"Letra y Música: Francisco Sánchez Muñiz, ICI","l":[{"t":"v","n":"1","x":"Mi buen Jesús, mi salvador, Rendido estoy aquí a tus pies, ¡Oh! mi Señor; tu inmenso a mor me conquistó; Mi adoración de corazón te ofrezco hoy."},{"t":"v","n":"2","x":"Nunca pensé, mi buen Señor, Que mi vida llena de mal y perdición Cambiaras Tú, con tanto amor, Que por dolor me dieras gozo y salvación."},{"t":"v","n":"3","x":"Anhelo amarte más y más, Señor Jesús, con infinita devoción; Servirte fiel, de corazón, En humildad y en espíritu y verdad."},{"t":"c","x":"Divino amor Que Dios mostró de tal manera Que a su Hijo dio Con infinita compasión Para morir en cruenta cruz Por nuestras culpas, Y así alcanzar La más perfecta redención."}]},{"s":"Himnario congregacional","n":"193","t":"Mi deleite es andar con el Señor","p":"470–471","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"Mi deleite es andar con el Señor que me salvó con preciosa sangre carmesí; de las dudas y oscuridad mi alma libertó ¡Gloria a Dios! es mi deleite aquí."},{"t":"v","n":"2","x":"Mi deleite es saber que el Señor conmigo está en la sombra y en el cruel dolor, en las luchas, en las pruebas, él jamás me faltará, ¡Gloria a Dios! él es mi Salvador."},{"t":"v","n":"3","x":"Mi deleite eterno ha de ser morar con él allá do jamás lo dejaré de ver; ¡Oh, qué gloria a de ser! cuando mi lengua cantará. Con Jesús voy a permanecer."},{"t":"c","x":"Mi deleite es andar con él, mi deleite es andar con él; él mis pasos guiará, él mi vida velará; mi deleite es andar con él."}]},{"s":"Himnario congregacional","n":"194","t":"Muchos que viven en tu derredor","p":"471","c":"Letra: J. F. Swanson; Música: George Stark Schuler (1882–1973)","l":[{"t":"v","n":"1","x":"Muchos que viven en tu derredor Tristes, hambrientos están; Tú por tu vida, les puedes llevar Gozo, luz y bendición."},{"t":"v","n":"2","x":"Di a los tristes que Dios es amor, El quiere dar su perdón A los que vienen a Cristo Jesús Buscando paz, salvación."},{"t":"v","n":"3","x":"Toda tu vida hoy rinde al Señor, Cada momento se fiel, Otros que vean en ti su amor, Pronto se rindan a Él."},{"t":"v","n":"4","x":"Quiero servir desde hoy a Jesús Con todo mi corazón Quiero vivir desde hoy en su luz y ser así bendición."},{"t":"c","x":"Usa mi vida Usa mi vida Para tu gloria, ¡Oh! Jesús; Todos los días y hoy quiero ser Testigo tuyo, Señor, por doquier."}]},{"s":"Himnario congregacional","n":"195","t":"¡Oh! cuán grande es mi anhelo","p":"472","c":"Letra y Música: Santiago Lozada Rodríguez, ICIAR.","l":[{"t":"v","n":"1","x":"¡Oh! cuán grande es mi anhelo de servirte, mi Señor, Porque tú eres mi consuelo y comprendes mi dolor;"},{"t":"v","n":"2","x":"Vengo a ti Jesús querido entonando mi canción, Porque tú me has redimido, me has brindado salvación;"},{"t":"v","n":"3","x":"Sólo en ti vivo confiado, ¡Oh! Jesús, mi Salvador, Porque tú me has rescatado, me has llamado con amor;"},{"t":"c","x":"Quiero yo serte cumplido y adorarte, mi Jesús, Porque Tú me has bendecido y me has dado plenitud."}]},{"s":"Himnario congregacional","n":"196","t":"¡Oh! yo quiero andar con Cristo","p":"473","c":"Letra: H. C. Ball; Música: C. F. Weigele","l":[{"t":"v","n":"1","x":"¡Oh! yo quiero andar con Cristo, quiero oír su tierna voz, meditar en su palabra, Siempre andar de él en pos. Consagrar a él mi vida y cumplir su voluntad Y algún día con mi Cristo Gozaré la claridad."},{"t":"v","n":"2","x":"¡Oh! yo quiero andar con Cristo, él vivió en santidad, en la biblia yo lo leo Y yo se que es la verdad. Cristo era santo en todo el Cordero de la cruz Y yo anhelo ser cristiano, Seguidor de mi Jesús"},{"t":"v","n":"3","x":"¡Oh! yo quiero andar con Cristo de mi senda él es la luz, dejaré el perverso mundo, cargaré aquí mi cruz. Este mundo nada ofrece, Cristo ofrece salvación, Y es mi dulce esperanza Gozar vida eterna en Sión."},{"t":"c","x":"¡Oh, sí, yo quiero andar con Cristo! ¡Oh, sí, yo quiero vivir con Cristo! ¡Oh, sí, yo quiero morir por Cristo! Quiero serle un testigo fiel."}]},{"s":"Himnario congregacional","n":"197","t":"Para andar con Jesús","p":"474","c":"Letra: Vicente Mendoza; Música: D. B. Towner","l":[{"t":"v","n":"1","x":"Para andar con Jesús no hay sendero mejor Que guardar sus mandatos de amor; Obedientes a Él siempre habremos de ser Y tendremos de Cristo el poder."},{"t":"v","n":"2","x":"Cuando vamos así ¡cómo brilla la luz En la senda al andar con Jesús! Su promesa de estar con los suyos es fiel Si obedecen y esperan en él."},{"t":"v","n":"3","x":"Quien siguiere a Jesús ni una sombra verá Si confiado su vida le da; Ni temores, ni afán, ni ansiedad, ni dolor, Pues lo cuida su amante Señor."},{"t":"v","n":"4","x":"Mas sus dones de amor nunca habréis de alcanzar Si rendido no váis a su altar; Pues su paz y su amor sólo son para aquel Que a sus leyes divinas es fiel."},{"t":"c","x":"Obedecer y confiar en Jesús, Es la regla marcada para andar en la luz."}]},{"s":"Himnario congregacional","n":"198","t":"Prometí, Cristo mío aceptarte","p":"475","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Prometí, Cristo mío, aceptarte Como dueño de mi corazón; Para siempre servirte y amarte Porque sólo Tú das salvación."},{"t":"v","n":"2","x":"Oh, yo fui pecador, lo comprendo, Pero un día alguien dijo ante mí, Que hasta el crimen más negro y horrendo Tú perdonas, si acuden a ti."},{"t":"v","n":"3","x":"A tus plantas, contrito, humillado, Vine yo a demandar compasión; Hoy, mis culpas tu sangre ha borrado, Por amor tú me has dado el perdón."},{"t":"v","n":"4","x":"Me propongo ser un fiel soldado En tu causa Divina, Señor; Haz que siempre camine a tu lado, No permitas que caiga en error."},{"t":"c","x":"Padre mío que estás en el cielo, En la tierra, y en todo lugar, Ven a darme el deseado consuelo, Y en mi pecho contrito a reinar."}]},{"s":"Himnario congregacional","n":"199","t":"Puedo oír la voz de Cristo","p":"476","c":"Letra: Sra. F. F. D.","l":[{"t":"v","n":"1","x":"Puedo oír la voz de Cristo, tiernamente está llamando, puedo oír el llamamiento: \"Trae tu cruz y ven en pos de Mí\"."},{"t":"v","n":"2","x":"Yo te seguiré en el huerto, por la vía dolorosa, y con mi alma tan gozosa sufriré contigo, mi Señor."},{"t":"v","n":"3","x":"Sufriré por ti Maestro, no me faltará tu mano, y si tú estás conmigo moriré contigo, mi Jesús."},{"t":"v","n":"4","x":"Me darás tu plena gracia, yo veré tu eterna gloria; contaré la antigua historia, y por siempre tú me guiarás."},{"t":"c","x":"Seguiré do tú me guíes, Seguiré do tú me guíes; Salvador, seguirte quiero, donde quiera fiel te seguiré."}]},{"s":"Himnario congregacional","n":"200","t":"¿Qué haría Jesús en mi lugar?","p":"476–477","c":"Música: John S. Norris (1844-1907); Letra y Música: Francisco Sánchez Muñiz, ICI","l":[{"t":"v","n":"1","x":"¿Qué haría Jesús en mi lugar? Alma mía pregúntate tú, Cuando dardos de fuego contra ti Lance raudos el fiero Tentador; Del desierto recuerda aquella lid Do triunfante salió mi Jesús; Fía en él tú también podrás salir Vencedor por su gracia y amor."},{"t":"v","n":"2","x":"¿Que haría Jesús en mi lugar? Con presteza pregúntate tú, Si oropeles del mundo con su luz Tan falaz te quisieran deslumbrar; En contrita humildad reverencial Cual Jesús enseñó, ora a Dios: \"Padre nuestro que en los cielos estás, Libra, sí, mi alma de todo mal\"."},{"t":"c","x":"En tus pasos de amor tan sacrosantos, Caminando feliz en pos de ti Mi Jesús, siempre fiel quiero seguirte Mientras viva debajo del sol."}]},{"s":"Himnario congregacional","n":"201","t":"Que mi vida entera esté","p":"478","c":"Letra: Frances Q. Havergal, Tr. Vicente Mendoza; Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"Que mi vida entera esté, Consagrada a ti, Señor; Que a misma nos pueda guiar, El impulso de tu amor. ¡Lávame en tu sangre Salvador,"},{"t":"v","n":"2","x":"Que mis pies tan sólo en pos, De lo santo puedan ir. Y que a ti Señor mi voz, Se complazca en bendecir. traigo a ti mi vida"},{"t":"v","n":"3","x":"Que mi tiempo todo esté, Consagrado a tu loor; Que mis labios al hablar, Hablen sólo de tu amor. ¡Límpiame de toda mi maldad,"},{"t":"v","n":"4","x":"4Toma ¡Oh! Dios mi voluntad, Y hazla tuya, nada más; Toma, sí, mi corazón, Por tu trono lo tendrás."},{"t":"c","x":"para ser, Señor, tuya por la eternidad."}],"w":1},{"s":"Himnario congregacional","n":"202","t":"¿Quién a Cristo quiere, de hoy en más seguir?","p":"479","c":"Letra: Eliza E. Hewitt, Tr. J. S. Paz; Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"¿Quién a Cristo quiere de hoy en más seguir su pendón alzando, pronto a combatir? ¿Quién le quiere humilde siempre aquí servir, siempre obedecerle, darle su existir?"},{"t":"v","n":"2","x":"¿Quién seguile quiere con profundo amor, dandole la gloria, dandole el loor? ¿De su noble causa siendo defensor, y en su santa obra fiel trabajador."},{"t":"v","n":"3","x":"¿Quién seguirle quiere sin vacilación, a su seno huyendo de la tentación? ¿Sin dudar confiando en su protección, y gozar por siempre de su bendición?"},{"t":"c","x":"¿Quién seguirle quiere? ¿Quién responderá al buen Redentor, \"Heme aquí, Señor\"? ¿Quién doquier que fuere tras su huella irá? ¿Quién dirá al Señor: \"Yo te seguiré\"?"}]},{"s":"Himnario congregacional","n":"203","t":"Quiero andar mi Señor","p":"480","c":"Letra: Vessie D. Hargrave; Música: George Washington Sebren (1882-1940)","l":[{"t":"v","n":"1","x":"Quiero andar mi Señor, por tu senda de amor elevandome más y más; por doquiera impartiendo alegría y solaz, pero lleno de tu bondad."},{"t":"v","n":"2","x":"Tenme cerca de ti, oh mi buen Salvador; no permitas jamás, jamás, que yo vague sin luz, sin destino y sin paz; mi sendero de amor llena hoy."},{"t":"v","n":"3","x":"La jornada fugaz pronto terminará y no habrá mas sufrir allá, permitidme cantar al augusto Señor, mi sendero de amor llena hoy."},{"t":"c","x":"Mi sendero de amor llena hoy, que tu Espíritu guíe mis pies; Y que Siempre al andar, lleno esté de tu amor el camino por donde voy."}]},{"s":"Himnario congregacional","n":"204","t":"Sigamos la huellas de Cristo Jesús","p":"481","c":"Himno de la convención de 1936; Letra y Música: Lino Morales, ICI.","l":[{"t":"c","x":"Sigamos las huellas de Cristo Jesús, él es nuestro amparo, él guía y da luz. Pensemos que Cristo es el Amigo fiel, con gozo cantemos loores a"},{"t":"v","n":"1","x":"Ya voy caminando para aquel hogar que Cristo el maestro me fue a preparar; amante me dice: \"No te tardes más, llegando a mis brazos la gloria verás\"."},{"t":"v","n":"2","x":"Doy gloria a tu nombre, divino Señor, que Él. siendo un indigno y vil pecador, tú me recibiste con todo tu amor, y ahora con gozo yo te doy loor."},{"t":"v","n":"3","x":"Si aliento te falta y no puedes llegar, acógete a Cristo, te hará descansar; hay gozo en los cielos por un pecador que acude a los brazos del buen Salvador."},{"t":"v","n":"4","x":"Alabo tu nombre, mi amado Señor, diré a los hombres que tú eres amor; que por nuestras culpas moriste en la cruz, que todos debemos seguirte, Jesús."}],"w":1},{"s":"Himnario congregacional","n":"205","t":"Tenme brillando, Señor","p":"482","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Tenme brillando, Señor, tenme brillando por ti; puro y limpio seré si tú brillas en mí. Será mi vida, Señor, cual un lucero, por ti, hasta que vengas con tu gran poder."},{"t":"v","n":"2","x":"Dame tu ayuda, Señor, para que brille por ti; yo andaré en tu amor si tú brillas en mí. Se me propicio, Señor, quiero alumbrar en redor hasta que vengas con tu gran poder."},{"t":"v","n":"3","x":"Quiero ser tuyo, Señor, siempre brillando por ti; pelearé con valor si tú brillas en mí. En ti confío, Señor, para luchar con vigor hasta que vengas con tu gran poder."},{"t":"c","x":"¡Oh! llévame a la roca más alta que yo, llévame, Señor, yo te seguiré; ¡Oh! llevame a la roca más alta que yo, sólo allí refugio tendré."}]},{"s":"Himnario congregacional","n":"206","t":"Tentado no cedas, ceder es pecar","p":"483","c":"Letra y Música: Horatio Richmond Palmer (1834-1907), Tr. Thomas Martin Westrup","l":[{"t":"v","n":"1","x":"Tentado no cedas, ceder es pecar; mejor y más noble es luchar y triunfar; valor pues cristiano, domina tu mal, Dios puede librarte, de asalto mortal."},{"t":"v","n":"2","x":"Evita el pecado, procura agradar, a Dios, a quien debes, por siempre ensalzar; No manche tus labios impúdica voz, preserva tu vida, de ofensas a Dios."},{"t":"v","n":"3","x":"Amante benigno, y enérgico sé; en Cristo tu Amigo, pon toda tu fe; veraz sea tu dicho, de Dios es tu ser; corona te espera, y vas a vencer."},{"t":"c","x":"En Jesús, pues, confía: en sus brazos tu alma, hallarás dulce calma, él te hará vencedor."}]},{"s":"Himnario congregacional","n":"207","t":"Todo a Cristo yo me rindo","p":"484","c":"Letra: Judson Wheeler Van de Venter (1855-1939); Música: Winfield Scott Weeden (1847-1908)","l":[{"t":"v","n":"1","x":"Todo a Cristo yo me rindo, Con el fin de serle fiel;"},{"t":"v","n":"2","x":"Todo a Cristo yo me rindo, A sus pies postrado estoy;"},{"t":"v","n":"3","x":"Todo a Cristo yo me rindo, Sí, de todo corazón;"},{"t":"v","n":"4","x":"Todo a Cristo yo me rindo, Siento el fuego de su amor;"},{"t":"c","x":"Para siempre quiero amarle, Y agradarle sólo a Él. Yo me rindo a Él; Yo me rindo a Él; Todo a Cristo yo me entrego, Quiero serle fiel.\nLos placeres he dejado Y le sigo desde hoy. Yo me rindo a Él Yo me rindo a Él Todo a Cristo yo me entrego, Quiero serle fiel.\nYo le entrego alma y cuerpo, Busco hoy su santa unción. Todo a Cristo yo me entrego, Quiero serle fiel.\n¡Oh, qué gozo hay en mi alma! ¡Gloria, gloria a mi Señor! Todo a Cristo yo me entrego, Quiero serle fiel."}],"w":1},{"s":"Himnario congregacional","n":"208","t":"Tu corazón pide el Dios de bondad","p":"485","c":"Letra: Vicente Mendoza Polanco (1875–1955); Música: Annie F. Boume (Pseudónimo de William James Kirkpatrick, 1838–1921)","l":[{"t":"v","n":"1","x":"Tu corazón pide el Dios de bondad. Quiere llenarlo de paz y de amor; ponlo a sus plantas con fe y humildad \"Toma, Señor\", dile, \"mi corazón\"."},{"t":"v","n":"2","x":"Tu corazón busca el buen Salvador, Don más precioso no quiere tener; Paso tras paso te sigue su amor, \"Dame\", diciéndote, \"tu corazón\"."},{"t":"v","n":"3","x":"Tu corazón busca el consolador, Quiere llenarlo de gracia y poder; Él es del Padre el enviado de amor, Rinde al Espíritu el corazón."},{"t":"c","x":"\"Tu corazón, tu corazón\", Oye la voz que te sigue doquier; Libre del mundo te quiere tener, \"Dame\", Te dice hoy, \"tu corazón\"."}]},{"s":"Himnario congregacional","n":"209","t":"Tuyo soy Jesús, ya escuché la voz","p":"486","c":"","l":[{"t":"v","n":"1","x":"Tuyo soy, Jesús ya escuché la voz De tu amor habládome aquí; Mas anhelo en alas de fe subir y más cerca estar de Ti."},{"t":"v","n":"2","x":"A seguirte a ti me consagro hoy Constreñido por tu amor, Y mi espíritu, alma y cuerpo doy Por servirte, mi Señor."},{"t":"v","n":"3","x":"¡Oh, cuán pura y santa delicia es De tu comunión gozar, Y contigo hablar y tu dulce voz Cada día escuchar!"},{"t":"v","n":"4","x":"De tu grande amor no comprenderé, Cuál es la profundidad; Hasta que contigo, Jesús, este En gloriosa eternidad."},{"t":"c","x":"Aún más cerca, cerca de tu cruz, Llévame ¡Oh, Salvador! Aún más cerca, cerca de tu cruz, Llévame, ¡Oh, buen Pastor!\ncerca cerca cerca cerca"}],"w":1},{"s":"Himnario congregacional","n":"210","t":"Vencedor","p":"486–487","c":"Letra: Fanny J. Crosby (Frances Jane Crosby, 1832-1915); Letra y Música: Andraé Crouch, 1971, trad, Frank Gonzales, alt.; Música: William Howard Doane (1832-1915)","l":[{"t":"v","n":"1","x":"Mu chas veces he pensado, de problemas tan cargado me pregunto ¿por qué hay tanta prueba y dolor? pero en cada circunstancia Dios me da más de su gracia y me muestra que soy más que vencedor."},{"t":"v","n":"2","x":"En el mundo agitado, de la multitud rodeado, nadie ve mi soledad y llanto Señor; mas en cada hora oscura, tu Espíritu asegura que contigo yo soy más que vencedor."},{"t":"v","n":"3","x":"Gracias doy por las victorias, gracias doy por las derrotas; a Dios gracias por el duelo abrumador. A través de los problemas veo sus misericordias, y en todo yo soy más que vencedor."},{"t":"c","x":"¡Vencedor! (Yo soy) ¡vencedor! yo en Cristo he confiado, mi fe está en Dios; ¡Vencedor! (Yo soy) ¡vencedor! Sí, ahora yo soy más que vencedor (vencedor)"}]},{"s":"Himnario congregacional","n":"211","t":"Yo consagro a ti mi vida","p":"488","c":"Letra: Isabel P. Balderas; Música: James Henry Fillmore (1849–1936)","l":[{"t":"v","n":"1","x":"Yo consagro a ti mi vida, ¡Oh querido y buen Jesús! y tu mano bendecida llevarame en clara luz. baré por mi Señor, buenas nuevas anunciando al perdido pecador."},{"t":"v","n":"2","x":"Mil temores y mil dudas por doquier me asediarán; pero tú, Jesús, me ayudas y arredrarme no podrán. Trabajando, trabajando viviré, sí, viviré por mi Señor, por mi Señor, buenas nuevas anunciando, buenas nuevas anunciando"},{"t":"v","n":"3","x":"Con placer y amor me alisto En las huestes de la fe; fortaleza me da Cristo y sin duda venceré. Trabajando, trabajando, trabajando, trabajando, vivi"},{"t":"v","n":"4","x":"Obtendrán feliz victoria los soldados del Señor; se verán llenos de gloria de este mundo en derredor."}],"w":1},{"s":"Himnario congregacional","n":"212","t":"Yo quiero ser cual mi Jesús","p":"489","c":"Letra: Vicente Mendoza Polanco (1875–1955); Música: Jairus Maxson Stillman (1834-1917)","l":[{"t":"v","n":"1","x":"Yo quiero ser cual mi Jesús, sirviendole con lealtad; sin"},{"t":"v","n":"2","x":"Humilde quiero siempre ser cual fuera mi Salvador, no"},{"t":"v","n":"3","x":"En todo quiero yo seguir las huellas de mi Señor, y"},{"t":"c","x":"cero y fiel yo quiero ser, cumpliendo su voluntad. Más y más cual mi Jesús en mi vida quiero ser; Más y más cual mi Señor seré por su gran poder.\nquiero glorias ni poder indignos de mi Señor. Más y más cual mi Jesús en mi vida quiero ser; Más y más cual mi Señor seré por su gran poder.\npor doquier hacer sentir lo que hizo en mí su amor. Más y más cual mi Jesús en mi vida quiero ser; Más y más cual mi Señor seré por su gran poder."}],"w":1},{"s":"Himnario congregacional","n":"213","t":"¿Con qué pagaremos?","p":"490","c":"","l":[{"t":"v","n":"1","x":"¿Con qué pagaremos el inmenso amor, que diste a tu hijo por mí pecador? Señor Jesucristo, conforta mi alma para que yo pueda servirte en mi vida, servirte Señor."},{"t":"v","n":"2","x":"Y cuando la noche extienda su manto, mis ojos con llanto en ti fijaré; Alzando mis ojos, veré las estrellas, yo sé que tras ellas, cual Padre a moroso, tu velas por mí."},{"t":"v","n":"3","x":"No tengo qué darte, ni oro ni plata, por el sacrificio que hiciste por mí; En cambio recibe la ofrenda humillada, la o fren da humillada, Señor Jesucristo, de mi corazón."},{"t":"c","x":"No tengo qué darte por amarme tanto; recibe este canto mezclado con llanto de mi corazón."}],"w":1},{"s":"Himnario congregacional","n":"214","t":"Mas él herido fue por nuestras culpas","p":"490–491","c":"Letra y Música: Autor desconocido, Melodía latinoamericana, Arm. Francisco Javier Corona Vázquez; Letra y Música: Francisco Sánchez Muñíz Nota del autor:; Portales Septiembre 10 de 1955.; En una velada de oración con el grupo de intermedios en el momento de una; grande bendición y después de haberse leído este pasaje Bíblico.","l":[{"t":"v","n":"1","x":"Mas él herido fue por nuestras culpas, molido por causa de mi pecar, El peso tan terrible de mis males Lo puso sobre sí mi Salvador; Como cordero fue al matadero, En grande aflicción, enmudeció, Su sangre derramó para limpiarme Y por su llaga tan bendita me salvó."},{"t":"v","n":"2","x":"Entre los hombres fuiste despreciado Y desechado de su comunión, Varón experimentado en quebranto, Menospreciado, sin estimación; Todos nos descarriamos como ovejas, Cada cual por su senda se apartó; Mas Dios cargó en él nuestros pecados Y por su llaga tan bendita nos salvó."},{"t":"c","x":"Señor Jesús, mi Salvador, mi Dios bendito, Eres imagen del invisible Dios El Primogénito Eres tú de las criaturas, En ti tenemos por tu sangre redención."}]},{"s":"Himnario congregacional","n":"215","t":"¡Piedad, Oh Santo Dios piedad!","p":"492","c":"Letra: Isaac Watts ( 1674-1748), Tr. Merrel N. Hutchinson; Música: Daniel Read (1757-1836), Wihdham.","l":[{"t":"v","n":"1","x":"¡Piedad, oh Santo Dios, piedad! Piedad te implora el corazón; ¡Oh! lávame de mi maldad y dame gozo paz perdón."},{"t":"v","n":"2","x":"Mis rebeliones graves son, son todas sólo contra ti; mas crea un nuevo corazón y un nuevo espíritu en mí."},{"t":"v","n":"3","x":"No quieres sacrificio más que el humillado corazón; mi ofrenda no despreciarás, pues eres todo compasión."},{"t":"v","n":"4","x":"Sálvame oh, Dios, con tu poder; que mi esperanza es sólo en ti; humilde aguardo tu querer; sé compasivo hacia mí."}]},{"s":"Himnario congregacional","n":"216","t":"Sálvame, ¡Oh, Dios! de toda tentación","p":"493","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Sálvame, oh Dios, de toda tentación, Porque en la muerte no te alabaré; Pronto mis días se acaban Y al polvo tornaré."},{"t":"v","n":"2","x":"Ciertamente el bien y la bondad Me seguirán los días que more aquí; Confortarás mi alma Y yo te alabaré."},{"t":"v","n":"3","x":"Tú eres fiel, inmenso en amor, Perdonarás del hombre la maldad; Anhelas verlo salvo; Cuán grande es tu bondad."},{"t":"v","n":"4","x":"Te alabaré por siempre, mi Jesús, Porque tu gracia ya me perdonó, Y con tu sacrificio Me has dado salvación."},{"t":"c","x":"Soy arcilla, soy lodo en tus manos, Miserable de mí sin tu amor; No se acorte tu mano, Cristo, Cristo mi Salvador."}]},{"s":"Himnario congregacional","n":"217","t":"Ten piedad de mí, cariñoso Salvador","p":"494–495","c":"Letra y Música: Francisco Sánchez Muñiz","l":[{"t":"v","n":"1","x":"Ten piedad de mí, cariñoso Salvador, ven ten compasión de mi pobre corazón; ten piedad de mí por tu conmiseración, ven, Señor Jesús, de mi ser siempre sé la luz."},{"t":"v","n":"2","x":"Sólo polvo soy y miseria ante ti, Un gusano vil y cuitado pecador; ven, ten compasión por tu infinito amor, Bendito Señor, mi Jesús, ten piedad de mí."},{"t":"v","n":"3","x":"Mil gracias te doy, cariñoso Salvador; tu presencia Real siento ya en mi corazón. Ahora soy feliz con tan grande bendición; Bendito Señor, mi ser ya saturó tu amor."},{"t":"c","x":"Como aquellos caminantes de Emaús imploramos humillados, buen Jesús: \"Quédate, Señor bendito, con nosotros, es tarde ya y declinó el día, Señor\"."}]},{"s":"Himnario congregacional","n":"218","t":"Yo escucho, buen Jesús","p":"495","c":"Letra y Música: Lewis Hartsough (1828-1919), Tr. Juan Bautista Cabrera Ivars (1837-1916)","l":[{"t":"v","n":"1","x":"Yo escucho, buen Jesús, Tu dulce voz de amor, Que desde el árbol de la cruz Invita al Pecador. Yo soy pecador, Nada hay bueno en mí; Ser objeto de tu amor Deseo y vengo a Ti."},{"t":"v","n":"2","x":"Tú ofreces el perdón De toda iniquidad, Si el llanto inunda el corazón Que acude a tu piedad. Yo soy pecador, Ten de mí piedad; Dame llanto de dolor Y borra mi maldad."},{"t":"v","n":"3","x":"Tú ofreces aumentar la fe del que creyó, Y gracia sobre gracia dar A quien en Ti esperó. Creo en Ti, Señor, Sólo espero en Ti; Dame tu infinito amor, Pues basta para mí."}]},{"s":"Himnario congregacional","n":"219","t":"Alguna vez ya no estaré","p":"496","c":"Letra: Fanny Jane Crosby (Frances Jane Crosby, 1832-1915), Trad. Tomás García; Música: George Coles Stebbins (1846–1945)","l":[{"t":"v","n":"1","x":"Alguna vez ya no estaré en mi lugar en esta grey, mas ¡cuán feliz despertaré en el palacio de mi Rey!"},{"t":"v","n":"2","x":"Alguna vez la muerte atroz vendrá, mas ¿cuándo? no lo sé; pero esto sé: con mi buen Dios un sitio yo feliz tendré."},{"t":"v","n":"3","x":"Alguna vez yo como el sol mi ocaso y fin tendré también; mas me dirá mi buen Señor: \"mi siervo fiel, conmigo ven\"."},{"t":"v","n":"4","x":"En día feliz que espero yo con mi candil ardiendo ya, las puertas me abrirá el Señor, y mi alma a él con gozo irá."},{"t":"c","x":"Yo le veré, y en dulce amor iré a vivir con él allí, y le diré: \"mi buen Señor, por gracia yo salvado fui\"."}]},{"s":"Himnario congregacional","n":"220","t":"Al trono excelso do en inmensa gloria","p":"497–498","c":"Letra: Juan Bautista Cabrera Ivars (1837-1916); Música: Iste Confessor, 1746 | (220-2) Letra: Juan Bautista Cabrera Ivars (1837-1916); Música: George Mursell Garret (1834-1897) (variantes: 220-1, 220-2)","l":[{"t":"v","n":"1","x":"Al trono excelso do en inmensa gloria, Supremo Dios, tu majestad reside, suban las voces puras del ferviente pueblo que pide."},{"t":"v","n":"2","x":"Sobre la tierra que por patria amada te plugo darnos, libertades brillen; y no consientas que se forjen nunca yugos que humillen."},{"t":"v","n":"3","x":"Pío derrama la esplendente lumbre de tu evangelio que ilumine al mundo; de tu evangelio, manantial de bienes siempre fecundo."},{"t":"v","n":"4","x":"Tu reino sea nuestra amada patria, tu voluntad la ley que veneremos, y tu palabra la gloriosa enseña que tremolemos."},{"t":"v","n":"5","x":"Danos tu gracia y bendición constantes mientras tengamos por mansión el suelo, hasta el momento en que nos des la nueva Patria en el cielo."}]},{"s":"Himnario congregacional","n":"221","t":"Anhelo a las regias mansiones llegar","p":"499","c":"Letra y Música: Thomas Ball Barratt (1862-1940), Tr. Speros Demetrios Athans (1883-1969)","l":[{"t":"v","n":"1","x":"Anhelo a las regias mansiones llegar, do reina mi Salvador, ya escucho los ecos del dulce cantar de triunfo, de gran loor."},{"t":"v","n":"2","x":"Feliz experiencia, inefable, de paz, yo siento en mi corazón; dulzura, placer, comunión y solaz con Dios en la oración."},{"t":"v","n":"3","x":"Por sendas gloriosas de paz y de amor, con gozo transito ya, y espero que pronto mi Rey y Señor consigo me llevará."},{"t":"v","n":"4","x":"Anhelo mi vida poder elevar, ser fiel a mi Redentor, y así a las regias mansiones llegar, do reina mi Salvador."},{"t":"c","x":"A mi supremo Rey alegre cantaré, mis ojos han de ver la playa celestial, feliz y salvo soy, ya pronto llegaré con gozo al celeste hogar."}]},{"s":"Himnario congregacional","n":"222","t":"Aunque en esta vida no tengo riquezas","p":"500","c":"Letra y Música: Emiliano Ponce, 1940.","l":[{"t":"v","n":"1","x":"Aunque en esta vida no tengo riquezas, sé que allá en la gloria tengo mi mansión; cual alma perdida entre las po"},{"t":"v","n":"2","x":"Así por el mundo yo voy caminando de pruebas rodeado, y de tentación; pero Jesucristo que me va gui"},{"t":"v","n":"3","x":"A todos los hombres de linaje humano Cristo quiere darles plena salvación; una bella casa no hecha de"},{"t":"c","x":"brezas, de mí, Jesucristo, tuvo compasión. Más allá del sol, más allá del sol, yo tengo un hogar, hogar bello hogar, más allá del sol.\nando, salvo llevarame hasta su mansión. Más allá del sol, más allá del sol, yo tengo un hogar, hogar bello hogar, más allá del sol.\nmanos fue a prepararnos en la santa Sión. Más allá del sol, más allá del sol, yo tengo un hogar, hogar bello hogar, más allá del sol."}],"w":1},{"s":"Himnario congregacional","n":"223","t":"Cuando cesen los conflictos de la vida terrenal","p":"501","c":"Letra y Música: Charles Brenton Widmeyer (1884-1974), Tr. Speros Demetrius Athans (1883-1969)","l":[{"t":"v","n":"1","x":"Cuando cesen los conflictos de la vida terrenal, y dejemos este mundo de aflicción, entraremos por las puertas de la patria celestial en la nueva Jerusalén."},{"t":"v","n":"2","x":"Aunque el mar embravecido y las olas del turbión, siempre agiten nuestra pobre embarcación, fiando en Cristo llegaremos a la playa celestial de la nueva Jerusalén."},{"t":"v","n":"3","x":"Consagremos nuestras vidas al servicio del Señor, siempre hablemos de su grande salvación, si en su obra trabajamos nos espera galardón, en la nueva Jerusalén."},{"t":"v","n":"4","x":"En aquel país hermoso do jamás se dice: \"adios\", gozaremos el descanso sin afán, cara a cara allá veremos a Jesús, quien nos salvó, en la nueva Jerusalén."},{"t":"c","x":"Cantaremos con los santos la canción de redención, en Jerusalén, en Jerusalén; con acentos de alegría alabando al Salvador en la gran (En la gran) Jerusalén. (Jerusalén)"}],"w":1},{"s":"Himnario congregacional","n":"224","t":"Cuando la trompeta suene en aquel día final","p":"502","c":"Letra: J. J. Mercado; Música: James Milton Black (1856-1938)","l":[{"t":"v","n":"1","x":"Cuando la trompeta suene en aquel día final, y que el alba eterna rompa en claridad; cuando las naciones salvas a su patria lleguen ya, y que sea pasada lista, allí he de estar."},{"t":"v","n":"2","x":"En aquel día sin nieblas en que muerte ya no habrá, y su glori el Salvador impartirá; cuando los llamados entren a su celestial hogar, y que sea pasada lista, allí he de estar."},{"t":"v","n":"3","x":"Trabajad por el maestro desde el alba al vislumbrar; siempre hablemos de su amor y fiel bondad, cuando todo aquí fenezca y nuestra obra cese ya, y que sea pasada lista, allí he de estar."},{"t":"c","x":"Cuando allá se pase lista, cuando allá se pase lista, cuando a(o bien: Cuando allá se pase lista, gloria a Dios. Cuando allá se pase lista, gloria a Dios.) llá se pase lista, a mi nombre yo feliz responderé. (o bien: Cuando allá se pase lista,)"}],"w":1},{"s":"Himnario congregacional","n":"225","t":"Cuando mis luchas terminen aquí","p":"503","c":"Letra y Música: Edwin Othello Excell (1851-1921), Tr. Vicente Mendoza Polanco (1875-1955)","l":[{"t":"v","n":"1","x":"Cuando mis luchas terminen aquí y ya seguro en los cielos esté, Cuando al Señor mire cerca de mí ¡Por las edades mi gloria será! ¡Esa será gloria sin fin, gloria sin fin, gloria sin fin; Cuando por gracia su faz pueda ver, Esa mi gloria sin fin ha de ser!"},{"t":"v","n":"2","x":"Cuando por gracia yo pueda tener en sus mansiones morada de paz, y que allí siempre su faz pueda ver, ¡Por las edades mi gloria será! ¡Esa será gloria sin fin, gloria sin fin, gloria sin fin,"},{"t":"v","n":"3","x":"Gozo infinito será contemplar todos los seres que yo tanto amé, mas la presencia de Cristo gozar, ¡Por las edades mi gloria será!"}],"w":1},{"s":"Himnario congregacional","n":"226","t":"De celeste país he leído","p":"504–505","c":"Letra y Música: C. F. Presbrey","l":[{"t":"v","n":"1","x":"De celeste país he leído, Do se encuentra una hermosa ciudad cuyas calles benditas son de oro y de jaspe su muro eternal. A través de sus calles deslumbra de sus aguas de vida el cristal; y aunque se habla de tanta excelencia no se ha dicho aún la mitad."},{"t":"v","n":"2","x":"He leído de aquellas mansiones que el Maestro nos fue a preparar, y los santos que aquí han sido fieles allá irán para siempre a gozar; donde muerte, dolor ni pecado ya no pueden hacer ningún mal; y aunque hablamos de tanta belleza no se ha dicho aún la mitad."},{"t":"v","n":"3","x":"He leído de níveos vestidos y coronas que habrán de os tentar, los que han sido llamados del Padre a gozar de su gloria eternal; de los justos, por siempre benditos que en sus calles de oro andarán; de esta historia gloriosa y sublime no se ha dicho aún la mitad."},{"t":"c","x":"No se ha dicho aún la mitad, no se ha dicho aún la mitad, de aquella ciudad tan gloriosa no se ha dicho aún la mitad."}]},{"s":"Himnario congregacional","n":"227","t":"En presencia estar de Cristo","p":"505","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: Grant Colfax Tullar (1869–1950)","l":[{"t":"v","n":"1","x":"En presencia estar de Cristo, ver su rostro ¿qué será? cuando al fin en pleno gozo mi alma le contemplará?"},{"t":"v","n":"2","x":"Sólo tras oscuro velo hoy lo puedo aquí mirar; más ya pronto viene el día que su gloria ha de mostrar."},{"t":"v","n":"3","x":"¡Cuánto gozo habrá con Cristo cuando no haya más dolor, cuando cesen los peligros y ya estemos en su amor!"},{"t":"v","n":"4","x":"Cara a cara, ¡cuán glorioso! Ha de ser así vivir; ver el rostro de quien quiso nuestras almas redimir."},{"t":"c","x":"Cara a cara espero verle más allá del cielo Azul; Cara a cara en plena gloria he de ver a mi Jesús."}]},{"s":"Himnario congregacional","n":"228","t":"Es el tren de la vida","p":"506","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Es el tren de la vida que va para Sión sin comprar boleto, pues en él yo voy, el viaje es gratuito y contento estoy, porque Cristo es el conductor."},{"t":"v","n":"2","x":"Si en la estación tú parado estás hasle la señal pronto parará, el viaje es gratuito y no hay que pagar, porque ya pagado está."},{"t":"v","n":"3","x":"Los que van viajando gozosos están, sólo van pensando en la gran ciudad, las calles son de oro y el mar de cristal, do por siempre morarán."},{"t":"v","n":"4","x":"Cánticos celestes se oyen resonar, porque jubiloso este viaje es; esperando ansiosos la estación final, del palacio celestial."},{"t":"c","x":"Si en el tren de la vida deseas tú viajar, date prisa amigo hasle la señal. Todavía a es tiempo porque asientos hay, sólo espera tu llamar."}],"w":1},{"s":"Himnario congregacional","n":"229","t":"Gozándome yo voy hacia el dulce hogar","p":"507","c":"Letra y Música: Hamp Sewell","l":[{"t":"v","n":"1","x":"Gozándome yo voy hacia el dulce hogar, caminando, caminando; mi deseo más ferviente es continuar caminando para aquel hogar."},{"t":"v","n":"2","x":"Dejando este mundo y todo mal, caminando, caminando; mi Jesús ha prometido conmigo estar, caminando para aquel hogar. Caminando, caminando para aquel hogar donde es"},{"t":"v","n":"3","x":"Yo quiero pecadores a él traer, caminando, caminando; el Señor los tomará con su gran poder, caminando para aquel hogar."},{"t":"v","n":"4","x":"Al fin de la jornada yo le veré en el cielo, en la luz; con gozo inefable yo cantaré: ¡Aleluya al Señor Jesús!"},{"t":"c","x":"tá la luz, caminando, caminando de la mano del Señor Jesús."}],"w":1},{"s":"Himnario congregacional","n":"230","t":"Hay un sueño inefable","p":"508","c":"Letra: Vicente Mendoza y Polanco (1875-1955); Música: Charles Hutchinson Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Hay un sueño inefable de Cristo el Señor, Que ha de ser a su fin realidad; Cada instante contemplo esa dulce visión Que es promesa de eterna verdad."},{"t":"v","n":"2","x":"Bien compensa por toda ansiedad y dolor La esperanza que afirma mi fe, Pues al ver a mi Rey en su real esplendor Ni aun la sombra de pruebas tendré. Este sueño inefable secreto es de paz Que yo"},{"t":"v","n":"3","x":"Cuando ya todo anuncie que el fin cerca está, No agitarme podrá la ansiedad; Un suspiro no más, y la vida se irá, Mas mi sueño será realiCoro dad."},{"t":"c","x":"quiero impartirte en verdad, (en verdad,) Porque sueño mirar en la gloria su faz, Y yo sé que será realidad."}],"w":1},{"s":"Himnario congregacional","n":"231","t":"Hoy te alabamos, Dios de bondad","p":"509","c":"Letra: Isabel P. Balderas; Música: Domenico Gaetano Maria Donizetti (1797-1848)","l":[{"t":"v","n":"1","x":"Hoy te alabamos Dios de bondad, con regocijo santo, pues entonamos con libertad del patriotismo el canto. Por tu mandato, nuestra nación"},{"t":"v","n":"2","x":"Del fiel cristiano no lema será: ¡México para Cristo! el buen Jesús ayuda dará, el triunfo será visto. Ven juventud, hoy, llena de ardor"},{"t":"v","n":"3","x":"A nuestra patria da libertad, a este jirón de suelo, guárdalo libre de iniquidad es nuestro santo anhelo. El evangelio, la salvación,"},{"t":"c","x":"será librada de la maldad, bajo la sombra de su pendón no habrá cadenas ni llanto. pues entonamos con libertad la canción del cristiano feliz.\ny a tus embates Satán caerá; lucha inspirada por tu Señor, el galardón está listo. Hoy te alabamos Dios de bondad, con regocijo santo, pues entonamos con libertad la canción del cristiano feliz.\ncon entusiasmo, id, publicad; hasta implantar de Cristo el pendón en derredor de este suelo. pues entonamos con libertad la canción del cristiano feliz."}],"w":1},{"s":"Himnario congregacional","n":"232","t":"La juventud se unifica","p":"510","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"La juventud se unifica en el amor del Salvador, y así unidos siempre a conquistar y con tesón luchar en contra de Satán. Esparciremos la doctrina que regenera y que da paz y mantendremos encendida y esplendente la verdad."},{"t":"v","n":"2","x":"Enarbolando la bandera, marchemos todos sin temor, a combatir al enemigo cruel, para poder vencer las huestes de Satán. Alcanzaremos la victoria, unidos siempre por la fe, porque llevamos como jefe a Jesucristo nuestro Rey."},{"t":"v","n":"3","x":"Oh juventudes mexicanas la senda fieles proseguid, y por doquier las nuevas anunciad al pobre pecador, que atado siempre está. Con el poder del evangelio, al enemigo vencerás, y en el gran día de la victoria, una corona ceñirás."}]},{"s":"Himnario congregacional","n":"233","t":"Llegaremos al hogar","p":"511","c":"Letra y Música: William Howard Doane (1832-1915), Tr. Vicente Mendoza Polanco (1875–1955)","l":[{"t":"v","n":"1","x":"Llega remos al hogar Que Jesús preparó, Donde irán a descansar Los que aquí redimió. Llamaremos sin te"},{"t":"v","n":"2","x":"Vuestro hogar aquí no está, Cuanto veis en redor, A la nada volverá A la voz del Señor. Este mundo de mal"},{"t":"v","n":"3","x":"No lloréis por el que fue con Jesús a vivir; Esperad teniendo fe, Pronto a él vais a ir. Junto al trono de Je"},{"t":"c","x":"mor, Y a la puerta él estará; Con ternura y con amor, Bienvenida dará. ¡Un hogar Dios nos da, Y en su seno el alma fiel sin temor vivirá.\ndad Con su fausto y su placer, Con su orgullo y vanidad, Lo veréis perecer. da, Y en su seno el alma fiel sin temor vivirá.\nsús A los vuestros hallaréis, Y viviendo en gracia y luz, Nunca \"a¡Un hogar, sí, Dios nos da, (o bien: diós\" les diréis.) da, Y en su seno el alma fiel sin temor vivirá."}],"w":1},{"s":"Himnario congregacional","n":"234","t":"Meditad en que hay un hogar","p":"512","c":"Letra y Música: Tullius Clinton O'Kane (1830–1912), Tr. Pedro Castro Iriarte (1840–1887)","l":[{"t":"v","n":"1","x":"Meditad en que hay un hogar en la margen del río de luz, donde van para siempre a gozar los creyentes en Cristo Jesús."},{"t":"v","n":"2","x":"Meditad en que amados tenéis de los cuales marchamos en pos, y pensad en que al fin los veréis, en el alto palacio de Dios."},{"t":"v","n":"3","x":"En que mora Jesús meditad, donde seres que amamos están, y a la patria bendita volad sin angustias, temores ni afán."},{"t":"v","n":"4","x":"Reunido a los míos seré, mi carrera a su fin llega ya, y en mi hogar celestial entraré, do mi alma reposo tendrá."},{"t":"c","x":"Más allá, más allá, meditad en que hay un hogar, más allá, más allá, más allá, en la margen del río de luz.\nMás allá, más allá, más allá, más allá,"}],"w":1},{"s":"Himnario congregacional","n":"235","t":"Mi Padre es un Rey","p":"513","c":"Letra: Hattie E. Buell (1834-1910), Tr. David E. Finstrom; Música: Desconocido","l":[{"t":"v","n":"1","x":"Mi Padre es un Rey muy rico, sin par, él tiene caudales inmensos doquier; su oro y diamantes no puedo contar, tesoros que nadie podrá contener."},{"t":"v","n":"2","x":"El hijo de Dios, mi buen Salvador, al mundo viniendo, muy pobre vivió; hoy reina en la gloria cubierto de honor, y hogar en los cielos con él me ofreció."},{"t":"v","n":"3","x":"Errante viví, sin patria ni hogar, un vil extranjero sin Dios y sin fe; más Cristo bendito me quiso adoptar, corona y mansión en los cielos tendré."},{"t":"v","n":"4","x":"Qué importa que yo no tenga ni hogar, si tengo un palacio del sol más allá, y mientras que llego, yo puedo cantar: \"soy el hijo de un Rey, ¡Aleluya a Jehová!"},{"t":"c","x":"Soy el hijo de un Rey, el hijo de un Rey, por Cristo bendito soy el hijo de un Rey, soy el hijo de un Rey, el hijo de un Rey, por Cristo bendito soy el hijo de un Rey."}]},{"s":"Himnario congregacional","n":"236","t":"Mil veces con el Maestro","p":"514","c":"Letra: Lechuga y Vicente Mendoza Polanco (1875–1955); Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"Mil veces con el Maestro, En santa comunión, escucho los acentos, de hermosa agrupación."},{"t":"v","n":"2","x":"De aquellos que sufrieron sed, hambre y dolor, mas hoy glori ficados están con el Señor."},{"t":"v","n":"3","x":"Escucho los acentos del canto sin igual, y al punto yo me uno, al coro celestial."},{"t":"v","n":"4","x":"Unido estoy con ellos ahora por la fe, mas pronto frente al trono con ellos cantaré."},{"t":"c","x":"¡Aleluya, Amén! ¡Aleluya, Amén! ¡Aleluya, Amén! ¡Amén! ¡Amén!"}],"w":1},{"s":"Himnario congregacional","n":"237","t":"Níveas ropas sin igual","p":"514–515","c":"Letra: Pedro Grado (1862-1923); Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"Níveas ropas sin igual, en la patria celestial, nos dará Jehová, nuestro Señor; donde luz de sol no habrá. Pues sublime brillará la sonriente faz del Salvador."},{"t":"v","n":"2","x":"Níveas ropas sin igual, de los santos noble ideal, llevaremos ante nuestro Rey, en completa comunión cantaremos la canción de la redimida y santa grey."},{"t":"v","n":"3","x":"Níveas ropas sin igual, del Cordero Celestial, la redenta grey ostentará; pues la sangre de Jesús derramada en la cruz nuestras manchas todas lavará."},{"t":"c","x":"Nívea será, nívea será la vestidura celestial. Traje de luz, nos da Jesús, níveo vestido de luz, sublime don celestial.\nNívea será, nívea será, nívea será nívea será, la vestidura celestial, la vestidura celestial, traje de luz, traje de luz nos da Jesús, nos da Jesús,"}],"w":1},{"s":"Himnario congregacional","n":"238","t":"No hay tristeza en el cielo","p":"516–517","c":"Letra y Música: Frederick Martin Lehman (1868-1953), Tr. Speros Demetrios Athans (1883-1969); Arm. Claudia Faustina Lehman Mays (1892–1973)","l":[{"t":"v","n":"1","x":"No hay tristeza en el cielo, ni llanto, ni amargo dolor. no hay corazón angustiado do reina el Dios de amor; las nubes de nuestro horizonte jamás aparecen a"},{"t":"v","n":"2","x":"No hay aflicción en el cielo, ni pruebas existen allá; el alma que en Cristo reposa segura en su seno estará; no hay tentación en el cielo ni sombras de muerte a"},{"t":"v","n":"3","x":"¡Cuán dulce será en el cielo, pasadas las penas aquí, volvernos a ver reunidos con nuestros amados allí; por todos los siglos eternos! ¡que dicha inefable ha de"},{"t":"c","x":"llá, el Sol esplendente que es Cristo derrama su luz celestial. Yo voy a la patria del alma, do Cristo prepara mi hogar, do todos los santificados irán para siempre a morar; el día feliz ya se acerca, en que el sol para mí se pondrá: ¡Oh! qué gozo será cuando mire al Señor en aquella hermosa ciudad.\ntroz, el árbol de vida florece do fluye el río de Dios. Yo voy a la patria del alma, do Cristo prepara mi hogar, do todos los santificados irán para siempre a morar; el día feliz ya se acerca, en que el sol para mí se pondrá: ¡Oh! qué gozo será cuando mire al Señor en aquella hermosa ciudad.\nser estar en presencia de Cristo, gozando de eterno placer. Yo voy a la patria del alma, do Cristo prepara mi hogar, do todos los santificados irán para siempre a morar; el día feliz ya se acerca, en que el sol para mí se pondrá: ¡Oh! qué gozo será cuando mire al Señor en aquella hermosa ciudad."}],"w":1},{"s":"Himnario congregacional","n":"239","t":"Quisiera decirte, Señor lo que siento","p":"518","c":"Letra y Música: Guadalupe Velasco, ICIAR","l":[{"t":"v","n":"1","x":"Quisiera decirte Señor lo que siento, la tristeza tan honda de mi corazón; quisiera estar cerca, decirte al oído, decirte que te amo, bendito Señor."},{"t":"v","n":"2","x":"Tu gracia divina, Señor poderoso, llenar puede de paz y de gozo mi ser, quitando mi pena, Señor bondadoso, llenando mi pecho de santo poder."},{"t":"v","n":"3","x":"Ahora Señor que me encuentro a tu lado, terminó la tristeza de mi corazón; tu amor satisface, tu amor me ha llenado, por eso te amo, bendito Señor."},{"t":"c","x":"Llévame, ¡Oh, Cristo! sí, llévame, llévame Señor junto a Ti; llévame, sí, llévame, que nadie en el mundo me aparte de Ti."}]},{"s":"Himnario congregacional","n":"240","t":"Sin cesar yo medito en la tierra mejor","p":"519","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: John Robson Sweney (1837-1899)","l":[{"t":"v","n":"1","x":"Sin cesar yo medito en la tierra mejor do al ponerse mi sol llegaré, y al hallarme en los cielos con Cristo el Señor, ¿mi corona de estrellas tendré?"},{"t":"v","n":"2","x":"De la fuerza de Dios esperando el poder, trabajar quiero siempre y salvar a las almas, y al fin, cual estrellas saber que en mis sienes irán a brillar."},{"t":"v","n":"3","x":"¡Oh! qué gozo en los cielos será para mí vivas gemas poner a sus pies, y tener en mi frente corona que allí ¡ornen joyas de tal brillantez!"},{"t":"c","x":"¿Mi corona tendrá sus estrellas allí, en las almas que yo prediqué? cuando el sol ya decline y me encuentre yo en ti, ¿mi corona de estrellas tendré?\nPrediqué? la tendré?"}],"w":1},{"s":"Himnario congregacional","n":"241","t":"Soy peregrino aquí","p":"520","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: Flora Hamilton Cassel (1852-1911)","l":[{"t":"v","n":"1","x":"Soy peregrino aquí, mi hogar lejano está en la mansión de luz, eterna paz y amor; embajador yo soy del reino celestial en los negocios de mi Rey."},{"t":"v","n":"2","x":"Que del pecado vil arrepentidos ya, han de reinar con él los que obedientes son, es el mensaje fiel que debo proclamar, en los negocios de mi Rey."},{"t":"v","n":"3","x":"Mi hogar más bello es que el valle de Sarón, eterno gozo y paz reinan por siempre en él, y allí Jesús dará eterna habitación, es el mensaje de mi Rey."},{"t":"c","x":"Este mensaje fiel oíd, que dijo la celeste voz: ¡Reconciliaos ya!, dice el Señor y Rey, ¡Reconciliaos hoy con Dios.!"}]},{"s":"Himnario congregacional","n":"242","t":"Yo me siento hoy gozoso porque Cristo me salvó","p":"521","c":"Letra: Enrique Sánchez; Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"Yo me siento hoy gozoso porque Cristo me salvó, su Palabra me hace ver que es la verdad, pero quiero conocerle y escuchar su tierna voz, ¡Oh! yo quiero ver a Cristo más allá."},{"t":"v","n":"2","x":"¡Oh! yo sé que él me guía y no me deja caer mientras haga su bendita voluntad; y me dice que no tema porque él conmigo está, ¡Oh! yo quiero ver a Cristo más allá."},{"t":"v","n":"3","x":"Contaré la grande historia de su amor yo hablaré, les diré que él nos vino a salvar; él murió en el madero y pagado todo está, ¡Oh! yo quiero ver a Cristo más allá."},{"t":"v","n":"4","x":"Cuando ande en las calles de la gran Jerusalén do las calles son de oro yo lo sé; cuando cante con los santos la canción de redención ¡Oh! qué gozo a mi Cristo allí veré."},{"t":"c","x":"¡Oh! yo quiero ver a Cristo más allá en aquella hermosísima ciudad, en su trono allá en la gloria donde siempre cantaré: ¡Oh! yo quiero ver a Cristo más allá."}]},{"s":"Himnario congregacional","n":"242b","t":"Dale fe y esperanza a mi país","p":"522","c":"Letra y Música: Ricardo Ceratto, Arr. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Dale fe y esperanza a mi país, ilumina, Señor a México; no permitas que esté lejos de ti, de tu amor necesita México. México."},{"t":"v","n":"2","x":"Hazle ver que el camino eres tú, guarda en tu corazón a México; en el nombre precioso de Jesús, te pedimos Señor por México. México."},{"t":"c","x":"Bendice su suelo, su sol y sus mares, sus pequeños pueblos, sus grandes ciudades. y a sus gobernantes.\nBendice su gente a cada instante, a su presidente sus grandes ciudades. y a sus gobernantes."}],"w":1},{"s":"Himnario congregacional","n":"242c","t":"El cielo es el trono de mi Dios","p":"523","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras","l":[{"t":"v","x":"El cielo es el trono de mi Dios, la tierra el estrado de sus pies, y siendo tan sublime mi Señor, mi pequeño corazón le entrego hoy. ¡Oh, qué gran gozo! ¡qué maravilla! por eso yo no quiero más pecar, yo quiero ser su santo templo donde su Espíritu venga a morar."}]},{"s":"Himnario congregacional","n":"242d","t":"Un cielo tiende sobre ti","p":"524","c":"Letra: Gonzalo Báez Camargo; Música: Samuel A. Ward","l":[{"t":"v","n":"1","x":"Un cielo tiendo sobre ti su manto azul turquí; dos mares cantan tu loor, oh patria de mi amor. Mi México, mi México, bendígate el Señor, su gracia de hasta rebosar del uno al otro mar."},{"t":"v","n":"2","x":"Oh patria llena de dolor, la negra esclavitud del fanatismo y el error opacan tu virtud. Mi México, mi México, bendígate el Señor, verás tu noche terminar y el nuevo día brillar."},{"t":"v","n":"3","x":"Como la nube que alumbró al pueblo de Israel, la Santa Biblia que te dio te guíe siempre a él. Mi México, mi México, que Dios contigo esté, y la palabra de verdad te dé la libertad."},{"t":"v","n":"4","x":"Enciende un vivo resplandor tu cielo azul turquí, verás la gloria del Señor naciendo sobre ti. Mi México, mi México, por fin brilla tu luz, y tus tristezas cesarán si buscas a Jesús."}]},{"s":"Himnario congregacional","n":"243","t":"Cuán glorioso es el cambio operado en mi ser","p":"525","c":"Letra: Rufus Henry McDaniel (1850-1940), Tr. Vicente Mendoza Polanco (1875-1955); Música: Charles Hutchinson Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Cuán glorioso es el cambio operado en mi ser viniendo a mi vida el Señor; hay en mi alma una paz que yo ansiaba tener, la paz que me trajo su amor."},{"t":"v","n":"2","x":"Ya no voy por la senda que el mal me trazó, do sólo encontré confusión; mis errores pasados Jesús los borró cuando él vino a mi corazón."},{"t":"v","n":"3","x":"Ni una sombra de duda oscurece su amor, amor que me trajo el perdón; la esperanza que aliento la debo al Señor, cuando él vino a mi corazón."},{"t":"c","x":"¡Él vino a mi corazón! ¡Él vino a mi corazón! soy feliz en la vida que Cristo me dio, cuando él vino a mi corazón."}]},{"s":"Himnario congregacional","n":"244","t":"Cuando vine a tus plantas, Señor","p":"526–527","c":"Letra y Música: Leonardo Flores Esparza, ICIAR","l":[{"t":"v","n":"1","x":"Cuan do vine a tus plantas, Señor, sólo había en mi alma pesar; pero ahora que ya vivo en Ti, dulce paz he podido encontrar; cuando triste en pecado me vi sin consuelo para mi dolor, fue tu mano bendita, Señor, la que me salvó y me dio redención."},{"t":"v","n":"2","x":"Por el mundo vagaba sin luz, sin ninguna esperanza, sin fe, cuando alguien me habló de Jesús, y su amor y su paz encontré; desde entonces mi vida cambió, todo en mí sólo fue bendición porque Cristo su mano tendió y me levantó y me dio salvación."},{"t":"c","x":"Mi buen Jesús, aquí me tienes a tus pies dándote gracias por lo que has hecho por mí, me diste dulce paz, consuelo en mi aflicción; sólo te pido que me ayudes a vivir constante mente en pureza y santidad, yo sólo sé que de tu mano mi Señor, podré llegar a la morada celestial."}]},{"s":"Himnario congregacional","n":"245","t":"Si la luz del sol se oculta","p":"528","c":"Letra y Música: Emily Devine Wilson (Mrs. J. G. Wilson, 1865-1942), Tr. Speros Demetrios Athans (1883-1969)","l":[{"t":"v","n":"1","x":"Si la luz del sol se oculta y vacila en mi la fe,"},{"t":"v","n":"2","x":"Siempre que mi barca boga en el tempestuoso mar;"},{"t":"v","n":"3","x":"Por la ruta que ha marcado mi piloto me guiará;"},{"t":"v","n":"4","x":"Cuando llegue a la ribera de la patria celestial,"},{"t":"c","x":"mi plegaria elevo y clamo: ¡Cristo mi piloto sé! Mi piloto irá conmigo, y de nada temeré; no me espanta el mar furioso, sólo en él yo confiaré.\npuedo fiar en mi piloto, y en su seno reposar. Mi piloto irá conmigo, y de nada temeré; no me espanta el mar furioso, sólo en él yo confiaré.\nen mis luchas y conflictos, gracia y triunfo me dará. Mi piloto irá conmigo, y de nada temeré; no me espanta el mar furioso, sólo en él yo confiaré.\nme dará la bienvenida mi piloto sin igual. Mi piloto irá conmigo, y de nada temeré; no me espanta el mar furioso, sólo en él yo confiaré."}],"w":1},{"s":"Himnario congregacional","n":"246","t":"En el seno de mi alma una dulce quietud","p":"529","c":"Letra: Warren Donald Cornell (1858-1930?), Tr. Vicente Mendoza Polanco (1875-1955); Música: Rev. William Gustin Cooper (1861-1938)","l":[{"t":"v","n":"1","x":"En el seno de mi alma una dulce quietud se difunde embargando mi ser; una calma infinita que sólo podrán los amados de Dios comprender."},{"t":"v","n":"2","x":"¡Qué tesoro yo tengo en la paz que me dio! y en el fondo de mi alma ha de estar, tan segura, que nadie quitarla podrá mientras miro los años pasar."},{"t":"v","n":"3","x":"Esta paz inefable consuelo me da descansando tan sólo en Jesús; y ningunos peligros mi vida tendrá; si me siento inundado en su luz."},{"t":"v","n":"4","x":"Alma triste que en rudo conflicto te ves, sola y débil tu senda al seguir; haz de Cristo el amigo, que fiel siempre es, ¡y su paz tú podrás recibir!"},{"t":"c","x":"¡Paz! ¡paz! cuán dulce paz, es aquella que el Padre me da; yo le ruego que inunde por siempre mi ser, en sus ondas de amor celestial."}]},{"s":"Himnario congregacional","n":"247","t":"En Jesús mi Señor encontré dulce paz","p":"530","c":"Letra y Música: Vicente Mendoza Polanco (1875-1955)","l":[{"t":"v","n":"1","x":"En Jesús mi Señor encontré dulce paz, en Jesús quien por mí se entregó; si acudieres a él este don obtendrás, a ninguno jamás rechazó."},{"t":"v","n":"2","x":"En Jesús encontré inefable perdón, cuando a él suplicante acudí; en amor encendió mi falaz corazón, y por él nueva fe recibí."},{"t":"v","n":"3","x":"En Jesús nueva vida tendrás, pecador, sin tardanza dirígete a él; en tu pecho pondrá nueva fe, nuevo amor, y después siempre sírvele fiel."},{"t":"c","x":"Sublime don, ¡don sin igual! solamente él podrá conceder; es un rayo de luz, de su luz celestial, que en nosotros él quiere encender.\nSublime don, ¡don sin igual! der; es un rayo de luz, de su luz celestial, que en nosotros él quiere encender."}],"w":1},{"s":"Himnario congregacional","n":"248","t":"Ha pasado la tormenta","p":"531","c":"Letra: Rafael M. Apango; Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Bamboleando por las olas, navegando más y más, entre densos nubarrones, vaga un barco sin compas."},{"t":"v","n":"2","x":"Ya perdida la esperanza con temor y ansiedad ya se mira en lontananza luz del faro celestial."},{"t":"v","n":"3","x":"Ya hallé piloto y faro que me guían a Cannán, mi Jesús me ha salvado, es mi grande capitán."},{"t":"v","n":"4","x":"Viento en popa caminando a la playa celestial do fervientes voces cantan ¡Gloria a nuestro capitán."},{"t":"c","x":"Ha pasado la tormenta y es Jesús el capitán, ha pasado la tormenta y es Jesús el capitán."}],"w":1},{"s":"Himnario congregacional","n":"249","t":"Hay un lugar do quiero estar","p":"532","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: James Milton Black (1856-1938)","l":[{"t":"v","n":"1","x":"Hay un lugar do quiero estar muy cerca de mi Redentor, allí podré yo descansar al fiel amparo de su amor."},{"t":"v","n":"2","x":"Quitarme el mundo no podrá la paz que halló mi corazón; Jesús amante me dará la más segura protección."},{"t":"v","n":"3","x":"Ni duda ni temor tendré estando cerca de Jesús; rodeado siempre me veré con los fulgores de su luz."},{"t":"c","x":"Muy cerca de mi Redentor seguro asilo encontraré; me guardará del tentador y ya de nada temeré."}]},{"s":"Himnario congregacional","n":"250","t":"Jesucristo nos alumbra","p":"533","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Jesucristo nos alumbra donde hay amor; él disipa las tinieblas donde hay amor. El amor nos hace orar, el amor nos da placer; las tinieblas se hacen luz don de hay amor."},{"t":"v","n":"2","x":"Todo el mundo vive alegre donde hay amor, todo corazón se eleva donde hay amor, toda angustia pasará, de la paz se gozará, y tranquilidad habrá donde hay amor."},{"t":"c","x":"Donde hay amor, donde hay amor, todo el mundo va cantando donde hay amor, donde hay amor, donde hay amor, gozo y paz abundan siempre donde hay amor."}]},{"s":"Himnario congregacional","n":"251","t":"Señor, Señor Jesús, ayúdame a vencer","p":"534","c":"La Tempestad; Letra y Música: Guadalupe Velasco, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"Señor, Señor, Jesús, ayúdame a vencer, la grande tempestad mi vida quiere ahogar. La enfurecida mar se vuelve en huracán; ¡Ayúdame, Jesús, pues quiero a ti llegar!"},{"t":"v","n":"2","x":"Mil gracias yo te doy pasó la tempestad, y mi barquilla así tu ruta seguirá. Tu faro celestial, Señor, me alumbrará; ¡Ayúdame, Jesús, pues quiero a ti llegar!"},{"t":"c","x":"Sólo tu amor podrá calmar Señor la tempestad, los vientos y la mar, tu voz escucharán. tad, callar, callar, llegó la paz."}],"w":1},{"s":"Himnario congregacional","n":"252","t":"Oh, Dios Eterno","p":"535","c":"Letra: Thomas Obadiah Chisholm(1866-1960), 1923, Tr. Honorato T. Reza (1912-2000); Música: William Marion Runyan (1870-1957), 1923","l":[{"t":"v","n":"1","x":"Oh Dios eterno, tu misericordia Ni una sombra de duda tendrá; Tu compasión y bondad nunca fallan Y por los siglos el mismo serás."},{"t":"v","n":"2","x":"La noche oscura, el sol y la luna, Las estaciones del año también, Unen su canto, cual fieles criaturas, Porque eres bueno, por siempre eres fiel."},{"t":"v","n":"3","x":"Tú me perdonas, me impartes el gozo, tierno me guías por sendas de paz; Eres mi fuerza, mi fe, mi reposo, Y por los siglos mi Padre serás."},{"t":"c","x":"¡Oh, tu fi
