viene En el nombre del Señor."},{"t":"v","n":"2","x":"El Señor entró triunfante a la gran Jerusalem, Hoy rendimos homenaje al sublime y santo Rey; Ya las gentes se preguntan; ¿A quién rinden tanto honor? A Jesús que hoy ha venido en el nombre del Se -"},{"t":"v","n":"3","x":"El Señor entró triunfante a la gran Jerusalem, Hoy rendimos homenaje al sublime y santo Rey; Quiera Dios que en este día haga su entrada triunfal A todos los corazones, por toda la eterni -"},{"t":"c","x":"ñor. Grandes voces de júbilo se escuchan Procla -"}]},{"s":"Himnario congregacional","n":"85","t":"Jesús es mi Rey soberano","p":"340","c":"","l":[{"t":"v","n":"1","x":"Jesús es mi Rey soberano, mi gozo es cantar su loor, es Rey y me ve cual hermano, es Rey y me imparte su amor, dejando su trono de gloria me vino a sa car de la escoria, y yo soy feliz, y yo soy feliz por Él. Letra y Música: Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Jesús es mi amigo anhelado, y en sombras y en luz siempre va, paciente y humilde a mi lado, su ayuda y consuelo me da, por eso constante los sigo porque Él es mi Rey y mi amigo, y yo soy feliz, y yo soy feliz por Él."},{"t":"v","n":"3","x":"¿Señor qué pudiera yo darte, por tanta bondad para mí? ¿Me basta servirte y amarte, es todo en tregarme yo a Ti? entonces acepta mi vida que a Ti solo queda rendida, pues yo soy feliz, pues yo soy feliz por Ti."}]},{"s":"Himnario congregacional","n":"86","t":"Loores dad a Cristo el Rey","p":"341","c":"Letra:    Edward Perronet, Trad. Thomas M. Westrup; Música: Oliver Holden","l":[{"t":"v","n":"1","x":"F C F C F C d F C Loores dad a Cristo el Rey suprema potestad, de su divino amor la ley postrados acep - - - tad, de su divino amor la ley postrados a - - - ceptad. Letra: Edward Perronet, Trad. Thomas M. Westrup"},{"t":"v","n":"2","x":"Vosotros hijos de Israel residuo de la grey, loores dad a Emanuel y proclamadle Rey, loores dad a Emanuel y proclamad - - - le Rey. Música: Oliver Holden"},{"t":"v","n":"3","x":"Naciones todas escuchad y obedeced su ley, de gracia y de santidad y proclamadle Rey, de gracia y de santidad y proclamad - - - le Rey."},{"t":"v","n":"4","x":"Dios quiera que con los que están del trono en derredor, cantemos por la eternidad a Cristo el Salva - - - dor, cantemos por la eternidad a Cristo el Sal - - - vador."}]},{"s":"Himnario congregacional","n":"87","t":"Por mil arpas y mil voces","p":"342","c":"Letra:    Thomas Kelley; Música: Lowell Mason","l":[{"t":"v","n":"1","x":"Por mil arpas y mil voces se alcen notas de loor, Cristo reina el cielo goza Cristo reyna el Dios de amor, ved su trono ocupa ya, solo el mundo regirá. ¡Aleluya, aleluya, aleluya! ¡Amén! Letra: Thomas Kelley"},{"t":"v","n":"2","x":"Rey de gloria reina siempre reina con tu potestad, nadie de tu mano arranque los que son tu propiedad, dicha tiene el escogido, que contemplará su faz. Música: Lowell Mason"},{"t":"v","n":"3","x":"Apresura tu venida en las nubes ¡oh Señor! nuevos cielos nueva vida danos Cristo por tu amor, arpas de oro de tu grey, gloria entonarán ¡oh Rey!"}]},{"s":"Himnario congregacional","n":"88","t":"Ved al Cristo, Rey de gloria","p":"343","c":"Letra:    Thomas Kelley; Música: George C. Stebbins","l":[{"t":"v","n":"1","x":"Ved al Cristo, Rey de gloria, Es del mundo el vencedor; Es de Cristo la victoria. Todos démosle loor. Coronadle, santos todos; Coronad al Salvador. Letra: Thomas Kelley"},{"t":"v","n":"2","x":"Exaltadlo, exaltadlo, Ricos triunfos trae Jesús; Entronadle allá en los cielos; En la refulgente luz. Música: George C. Stebbins"},{"t":"v","n":"3","x":"Si los malos se burlaron, Coronando al Salvador; Hoy los ángeles y santos lo proclaman su Señor."},{"t":"v","n":"4","x":"Escuchad las alabanzas, Que se elevan hacia Él. Victorioso reina el Cristo. ¡Adorad a Emmanuel!"},{"t":"c","x":"Coronadle, santos todos; Coronad al Rey de reyes,"}]},{"s":"Himnario congregacional","n":"89","t":"Yo tengo un Rey","p":"344","c":"","l":[{"t":"v","n":"1","x":"Yo tengo unRey, mi Salvador, y por él yo tengo vida, Es promesa fiel. Yo tengo un der jamás a mi Rey. Y espero no ofender, no, no. Y espero no ofender, no, no Y esperono ofender jamás a mi Rey. Letra y Música: Autor desconocido, Melodía Puertorriqueña, Arr. Isaac García Contreras"},{"t":"v","n":"2","x":"Oh mira el sol al decaer, nunca esperes te sorprenda, sin el bien hacer. Oh mira el"},{"t":"v","n":"3","x":"Si enfermo estoy, a él yo voy, pues mi Rey es compasivo, y mitiga midolor Si enfermo es -"},{"t":"v","n":"4","x":"Cuando él se fue, nos prometió investirnos de poder y poten cia ce lestial Cuando él se"},{"t":"v","n":"5","x":"Si tú quieres ver a Jesús mi Rey sólo entregate en sus brazos Él te quie re so correr Si tú quieres"},{"t":"v","n":"6","x":"Él volverá, escrito está con los ángeles de gloria nos llevará. Él vove -"},{"t":"c","x":"Rey, mi Salvador, y por él yo tengo vida, Es promesa fiel. sol al decaer, nunca esperes te sorprenda, sin el bien hacer toy, a él yo voy, pues mi Rey es compasivo y mi ti gami dolor Y espero no ofenfue, nos prometió investirnos de poder y poten cia ce lestial ver a Jesús mi Rey sólo entregate en sus brazos Él te quie re so correr rá, escrito está con los ángeles de gloria nos llevará"}]},{"s":"Himnario congregacional","n":"90","t":"A solas al huerto yo voy","p":"345","c":"Letra:   C. Austin Miles, Trad. Vicente Mendoza Polanco (1875-1955); Música: C. Austin Miles","l":[{"t":"v","n":"1","x":"A solas al huerto yo voy cuando duerme aún la floresta, y en quietud y paz con Jesús estoy, oyendo absorto allí su voz. canto que hallo con Él allí con nadie tener podré. Letra: C. Austin Miles, Trad. Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Tan dulce es la voz del Señor que las aves guardan silencio, y tan sólo se oye esa voz de amor, que inmensa paz al alma dá. Música: C. Austin Miles"},{"t":"v","n":"3","x":"Con Él encantado yo estoy aunque en torno lleguen las sombras, mas me ordena ir a escuchar yo voy, su voy doquier la angustia esté."},{"t":"c","x":"Él conmigo está, puedo oir su voz y que suyo dice seré; y el en -"}]},{"s":"Himnario congregacional","n":"91","t":"Al cansado peregrino","p":"346","c":"Letra:    Nathaniel Niles; Música: Philip P. Bliss","l":[{"t":"v","n":"1","x":"Al cansado peregrino Que en el pecho siente fe, El señor ha prometido: ré\". \"Con mi brazo, con mi brazo, Con mi brazo te guiaEl Señor ha prometido: \"Con mi brazo te guiaré\". Letra: Nathaniel Niles"},{"t":"v","n":"2","x":"Si has perdido la esperanza Como la sombra de lo que fue, Oye atento su promesa: \"Con mi brazo te guiaré\"; Oye atento su promesa: \"Con mi brazo te guiaré\". Música: Philip P. Bliss"},{"t":"v","n":"3","x":"Cuando la muerte a tu estancia Con afán golpeando esté, Ten consuelo en las palabras: Ten consuelo en las palabras: \"Con mi brazo te guiaré\"."}]},{"s":"Himnario congregacional","n":"91b","t":"Es todo para mí","p":"347","c":"","l":[{"t":"v","n":"1","x":"En el firmamento veo a Dios, En el viento él habla en majestad, Aunque reina sobre tierra y mar, ¿Que es eso para mí? ¿Que es eso para mí Hasta que por fe le conocí, Y su gran poder en mí sentí No sabía que era un Dios de amor que vino desde allá para salvarme a mí Yo ahora pertenezco a él, El me ayuda con su gran poder, Me conduce siempre a la verdad, Es todo para mí. Letra y Música: Ralph Carmichael, 1964, Tr. Daniela. Velázquez"},{"t":"v","n":"2","x":"Yo creeré en su natividad Que en la historia es una realidad Aunque él vino para liberar,"}]},{"s":"Himnario congregacional","n":"92","t":"¿Cómo podré estar triste?","p":"348–349","c":"Letra:    Cirilla D. Martin, Trad. Vicente Mendoza Polanco (1875-1955); Música: Charles H. Gabriel","l":[{"t":"v","n":"1","x":"¿Cómo podré estar triste? ¿Cómo entre sombras ir? ¿Cómo sentirme solo Y en el dolor vivir? Si Cristo es mi consuelo, Mi amigo siempre fiel, Si aún las aves tienen Seguro asilo en Él, Si aLetra: Cirilla D. Martin, Trad. Vicente Mendoza Polanco (1875-1955) ún las aves tienen Seguro asilo en Él. vivo siempre aquí; Si Él cuida de las aves, Cuidará también de mí!"},{"t":"v","n":"2","x":"\"Nunca te desalientes\", Oigo al Señor decir, Y en su palabra fiado Hago al dolor huir, A Cristo paso a paso Yo sigo sin cesar, Y todas sus bondades Me da sin limitar, Y Música: Charles H. Gabriel todas sus bondades Me da sin limitar. Aquí;"},{"t":"v","n":"3","x":"Siempre que soy tentado O que en la sombra estoy, Más cerca de Él camino Y protegido voy; Si en mí la fe desmaya, Y caigo en la ansiedad, ¡Tan sólo Él me levanta, Me da seguridad! ¡Tan sólo Él me levanta, Me da seguridad!."},{"t":"c","x":"Feliz cantando alegre, Yo Alegre,"}]},{"s":"Himnario congregacional","n":"93","t":"Con gratitud vengo hacia Ti","p":"350","c":"Letra:     Gamaliel Soriano, Pastor en Acapulco; Música:  Francisco Sánchez Muñíz, ICIAR; Música: Francisco Sánchez Muñiz Letra: Gamaliel Soriano.","l":[{"t":"v","n":"1","x":"Con gratitud vengo hacia Ti, a darte gracias ¡Oh Señor! Pues tus promesas fieles son, para salvar al peca dor. tar, para seguirte siempre fiel, como la chispaque encendió, la zarza humeante ante Moises, asi arde siempre an te tus pies el corazón que salvo es. Letra: Gamaliel Soriano, Pastor en Acapulco"},{"t":"v","n":"2","x":"Tu has dicho siempre buen Jesús: \"Ven hoy a Mi y descansarás\" perdido y triste como es tás, perdón y gracia obtendrás. Música: Francisco Sánchez Muñíz, ICIAR"},{"t":"v","n":"3","x":"Jamás podré yo olvidar, la conmoción del corazón, de tanto hombre pecador, que tú salvaste con amor."},{"t":"v","n":"4","x":"Enfermos vimos levantar, a los perdidos confesar, que tu poder oh buen Jesús, puede dar vida y plena luz."},{"t":"c","x":"Gozo sin fin hay en aquel, que tu palabra al escuchar, rinde su vida an te tu al"}]},{"s":"Himnario congregacional","n":"94","t":"Cristo el Señor es para mí","p":"351","c":"","l":[{"t":"v","n":"1","x":"Cristo el Señor es para mí, consuelo dicha y paz; en Él tan sólo encuentro yo, descanso, a mor, solaz. Si en mis tristezas voy a Él, hallo un amigo siempre fiel, hallo un amigo siempre fiel en Jesús. Letra y Música: Will L. Thompson, Trad. Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"En mis conflictos con el mal, no hay otro cual Jesús; que pueda darme protección, sostén, poder y luz. Yendo conmigo el Salvador, ya nada puede el tentador, ya nada puede el tentador contramí."},{"t":"v","n":"3","x":"Vida de paz, de gozo y luz, encuentro en mi Señor; herencia eterna que me dá, su incomparable amor. Nada en el mundo igualará, a lo que en Cristo en contrará, a lo que en Cristo en contrará el mortal."},{"t":"v","n":"4","x":"Gloria sin fin tributaré, gozoso a mi Jesús; quien vida tal me aseguró, muriendo en cruenta cruz. Y por los siglos mi canción, ensalzará su salvación, ensalzará su salvación sin igual."}]},{"s":"Himnario congregacional","n":"95","t":"Cual mirra fragante que exhala su olor","p":"352","c":"","l":[{"t":"v","n":"1","x":"Cual mirra fragante que exhala su olor, y ricos perfumes esparce en redor, tu nombre oh Amado a mi corazón, lo llena de gozo, transpórtalo a Sión. luya al Amado al ben dito Jesús! Letra y Música: Edward L. White"},{"t":"v","n":"2","x":"Cual voz amigable que al triste viador,* en bosque perdido le inspira valor, tu nombre me anima me hace saber, que ofreces piadoso, rescate a mi ser."},{"t":"v","n":"3","x":"Cual luz que brillando del alto fanal, al nauta en la noche señala el canal, tu nombre esparciendo benéfica luz, al cielo me lleva, bendito Jesús."},{"t":"v","n":"4","x":"Cual roca muy firme que adentro del mar, al náufrago brinda su seguridad, tu nombre oh Amado excelsa bondad, ofrece refugio, a la humanidad."},{"t":"c","x":"¡Aleluya, aleluya al Cordero de Dios! ¡Ale-"}]},{"s":"Himnario congregacional","n":"96","t":"Del santo amor de Cristo","p":"353","c":"","l":[{"t":"v","n":"1","x":"Del santo amor de Cristo que no tendrá su igual, de su divina gracia sublime y eternal, de su misericordia inmensa como el mar, y cual los cielos alta, con gozo he de cantar. rico e inefable, nada es comparable, al amor de mi Jesús. Letra y Música: Lelia N. Morris, Trad. Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Cuando Él vivió en el mundo la gente le siguió, y todas sus angustias en Él depositó, entonces bondadoso su amor brotó en raudal, incontenible, inmenso sanandotodo mal."},{"t":"v","n":"3","x":"Él puso en las pupilas del ciego nueva luz, la eterna luz de vida que centellea en la cruz, y dió a las almas todas la gloria de su ser, al impartir su gracia su Espíritu y poder."},{"t":"v","n":"4","x":"Su amor por las edades del mundo es el fanal, que marca esplendoroso la senda del ideal, y el paso de los años lo hará más dulce y más, precioso al dar al alma su incomparable paz."},{"t":"c","x":"El amor de mi Señor, grande y dulce es más y más,"}]},{"s":"Himnario congregacional","n":"97","t":"El mundo perdido en pecado se vió","p":"354","c":"","l":[{"t":"v","n":"1","x":"El mundo perdido en pecado se vió, Jesús es la luz del mundo; Mas en las tinieblas la gloria brilló, Jesús es la luz del mundo. Yo ciego fui, mas ya puedo ver, ¡Jesús es la luz del mundo!. Letra y Música: Philip P. Bliss, Trad. Henry C. Thomson"},{"t":"v","n":"2","x":"Vivir en Él vuelve la noche en día, Jesús es la luz del mundo; Andemos en luz y sigamos al Guía, Jesús es la luz del mundo."},{"t":"v","n":"3","x":"¡Oh ciegos y presos de lóbrego error! Jesús es la luz del mundo; El manda lavaros y ver su fulgor, Jesús es la luz del mundo."},{"t":"v","n":"4","x":"Ni soles ni lunas el cielo tendrá, Jesús es la luz del mundo; La luz de su rostro lo iluminará, Jesús es la luz del mundo."},{"t":"c","x":"¡Vén a la luz! no quieras perder Gozo perfecto al amanecer"}]},{"s":"Himnario congregacional","n":"98","t":"En Cristo feliz es mi alma","p":"355","c":"","l":[{"t":"v","n":"1","x":"En Cristo feliz es mi alma, Precioso es su celeste don; Su voz me devuelve la calma. Su faz me anticipa el perdón. Yo Yo soy feliz, Yo Yo soy feliz gozo y la paz inundan mi ser, Pues yo soy feliz en Él. Letra y Música: Edwin O Excell. Trad. Epigmenio Velasco"},{"t":"v","n":"2","x":"Mucho antes que yo, él buscóme, Me atrajo a su amado redil; De amor en sus brazos llevóme Do hay dicha y encantos a mil"},{"t":"v","n":"3","x":"Su amor paternal me circunda, Su gracia conforta mi ser; Su Espíritu Santo me inunda De un noble y excelso poder."},{"t":"v","n":"4","x":"A Él seré un día semejante Dejando este cuerpo mortal; Y mientras, discípulo amante Ser quiero hasta el día final."},{"t":"c","x":"Yo soy feliz en Él; Yo soy feliz en Él; Él"}]},{"s":"Himnario congregacional","n":"99","t":"En Jesucristo, mártir de paz","p":"356","c":"Letra:    Fanny J. Crosby, Trad. E.A. Monfort Díaz; Música: Phoebe P. Knapp","l":[{"t":"v","n":"1","x":"En Jesucristo, mártir de paz, En horas negras de tempestad Hallan las almas dulce solaz, Grato consuelo, felicidad. rir; La santa gracia del Salvador, dirija siempre nuestro vivir. Letra: Fanny J. Crosby, Trad. E.A. Monfort Díaz"},{"t":"v","n":"2","x":"En los peligros, en el dolor, A cada paso su protección Calma le infunde, santo vigor, Nuevos alientos al corazón. Música: Phoebe P. Knapp"},{"t":"v","n":"3","x":"Cuando en la lucha falta la fe, Y el alma siente desfallecer, Cristo nos dice: \"¡Yo os colmaré De rica gracia, santo poder!\""},{"t":"c","x":"Gloria cantemos al Redentor, Que por nosotros quiso mo -"}]},{"s":"Himnario congregacional","n":"99b","t":"Te vengo a decir","p":"357","c":"","l":[{"t":"v","n":"1","x":"Te vengo a decir, te vengo a decir, oh mi Salvador que yo te amo a ti, que yo te amo ti con el corazón. Te vengo a decir, te vengo a decir to da la verdad, que te amo Señor, te adoro Señor con el corazón. Yo quiero cantar, yo quiero cantar de gozo y de paz. Yo quiero llorar, yo quiero llorar de felicidad. Letra y Música: Juan Isais, Arr. Bill Fasig"}]},{"s":"Himnario congregacional","n":"100","t":"Es Jesucristo mi todo","p":"358–359","c":"Letra:    S. D. Athans; Música: George Bennard","l":[{"t":"v","n":"1","x":"Es Jesucristo mi todo, grato es cantar su loor, ¡Oh cuán sublime infinito es su divino amor! Cuando me vio errabundo, cual hijo pródigo, Me levantó bondadoso, a su redil me llevó. Letra: S. D. Athans Cristo, Cristo, tuyo seré, Señor; Te seguiré donde quiera, si tú guiando vas, Y al terminar mi carrera, en gloria veré tu faz."},{"t":"v","n":"2","x":"Cristo es el lirio del valle, la rosa es de sarón, Cristo es el astro esplendente la roca de salvación; Él es la fuente de vida, y gozo eternal, Él satisface mi alma con el maná celestial. Música: George Bennard Tuyo seré tan sólo Señor, Tuyo seré"},{"t":"v","n":"3","x":"Cristo nació en un pesebre, la amarga copa bebió, Cual inocente cordero en el calvario murió; Resucitó de la tumba y al cielo ascendió, Mas pronto viene en gloria, esta promesa nos dió."},{"t":"c","x":"Cristo, Cristo, tu eres mi salvador, Cristo tú eres mi Salvador, sí mi Salvador"}]},{"s":"Himnario congregacional","n":"101","t":"Fuente de la vida eterna","p":"360","c":"Letra:    Robert Robinson, 1758; Tr. Thomas Martin Westrup; Música: Melodía americana, publ. por John Wyeth, 1813","l":[{"t":"v","n":"1","x":"Fuente de la vida eterna Y de toda bendición, Ensalzar tu gracia tierna Debe todo corazón; Tu piedad inagotable Abundante en perdonar, único ser adorable, Gloria a Ti debemos dar. Letra: Robert Robinson, 1758; Tr. Thomas Martin Westrup"},{"t":"v","n":"2","x":"De los cánticos celestes Te quisiéramos cantar Entonados por las huestes Que lograste rescatar; Almas son que redimiste Porque les tuviste amor, De ellas te compadeciste Con tiernísimo favor. Música: Melodía americana, publ. por John Wyeth, 1813"},{"t":"v","n":"3","x":"Toma nuestros corazones, Llénalos de tu verdad, De tu Espíritu los dones Y de toda santidad; Guíanos en la obediencia, Humildad, amor y fe; Nos ampare tu clemencia, Salvador, propicio sé."}]},{"s":"Himnario congregacional","n":"102","t":"Fuente de maravilloso amor","p":"360–361","c":"","l":[{"t":"v","n":"1","x":"Fuente de maravilloso a mor Para el alma eres mi Jesús, Porque si endo aún tan pecador Por mi moriste en cruentacruz; Me llenaste de tu plenitud Con tu presencia celestial, Cuan maravilloso manantial De santo amor eres, Señor Jesús. ¡Oh! que gloria siento en mi, Alegria celestial, Gloria sin fin, maravillosa, De gozo y paz eternal; Hermosura sin igual Hay en tí Señor, Rico y limpio manantial Es tu divino amor. Letra y Música: Francisco Sánchez Muñiz, 20/05/1955, Arm. Isaac García Contreras"},{"t":"v","n":"2","x":"¡Oh! maravilloso mi Jesús, Que los cielos más sublime es Al llenar de refulgente luz Mi corazón, todo mi ser; A tu nombre gloria, Oh Señor, De eternidad a eternidad; Desde donde sale el sol hasta Donde se pone, Tú eres Dios, mi Dios."}]},{"s":"Himnario congregacional","n":"103","t":"¿Has oído la historia de Cristo?","p":"362","c":"Letra:    Vicente Mendoza; Música: Fred H. Byshe","l":[{"t":"v","n":"1","x":"¿Has oído la historia de Cris - - to, Dulce historia de gracia y de amor? Cuando débil y pobre y caído, Redimido me vi del dolor?. A su fulgor en la vida voy, Y el cielo así en mi alma va. Letra: Vicente Mendoza"},{"t":"v","n":"2","x":"¿Has oído que dijo a las gen - - tes: \"Los cansados venid hasta Mí\"? Vine a él y sentí que al instante De su amor el objeto yo fui. Música: Fred H. Byshe"},{"t":"v","n":"3","x":"¿Has oído de aquellos que cie - - gos, A sus ojos El dió les la luz? Yo también cuando estaba en las sombras, A la luz me llevó mi Jesús."},{"t":"v","n":"4","x":"¿Has oído del mar tempestuo - - - so Que el Señor con su voz aquietó? Tú sabrás que las rudas tormentas De mi vida, el Señor ya calmó."},{"t":"c","x":"Su inmenso amor, yo cierto estoy, Jamás su igual tener podrá;"}]},{"s":"Himnario congregacional","n":"104","t":"¿Has tratado de llevar tu carga?","p":"363","c":"Letra:    Vicente Mendoza; Música: C. Austin Miles","l":[{"t":"v","n":"1","x":"¿Has tratado de llevar tu carga Solo tú, solo Solo tú, tú; No sabiendo que tendrás ayuda Si acudieres al Señor Jesolo tú, cudo a mi Señor; yuda siempre mi Señor me presta con amor. Letra: Vicente Mendoza"},{"t":"v","n":"2","x":"Nunca olvides que al calvario solo Fue Jesús, fue Jesús; Para darte salvación y vida, Cuando solo sucum bió en la Música: C. Austin Miles"},{"t":"v","n":"3","x":"Sólo en Cristo protección y ayuda Hallarás, hallarás; Lleva siempre a Él tus cargas todas, Que a ninguno rechazó ja -"},{"t":"c","x":"sús?. Si tengo cargas que solo debo llevar; Paciente las alzo y acruz. Si tengo cruces que nadie puede cargar. Su a - - - -"}]},{"s":"Himnario congregacional","n":"105","t":"Jesús es precioso, mi buen Salvador","p":"364–365","c":"Letra:   H. C. Ball; Música: Charles H. Gabriel","l":[{"t":"v","n":"1","x":"Je - - - sús es precioso mi buen Salvador, Por siempre le alabo por su gran poder; Si débil me encuentro su fuerza me da, Él Letra: H. C. Ball es mi precioso Jesús. Precioso es Jesús, mi Jesús; Mi gloria será su rostro al mirar, El es mi precioso Jesús."},{"t":"v","n":"2","x":"Y cuando en pecado muy triste me vi, Llamando a las puertas de mi corazón Me dijo: \"Tu alma yo quiero salvar\"; Él Música: Charles H. Gabriel es mi precioso Jesús."},{"t":"v","n":"3","x":"Mas ya por su gracia la luz puedo ver; Quitó mi tristeza, mi llanto enjugó; Por fe yo contemplo mi Eterno hogar, Él es mi precioso Jesús."},{"t":"v","n":"4","x":"Je - - - sús es precioso mi buen Redentor, Me gozo en su luz que en mi senda brilló; Yo sé que glorioso por mí viene aquí, Él es mi precioso Jesús."},{"t":"c","x":"Precioso es Jesús, mi Jesús;"}]},{"s":"Himnario congregacional","n":"106","t":"Maestro, se encrespan las aguas","p":"366–367","c":"Letra:    Mary A. Baker, 1874, Trad. Vicente Mendoza; Música: Horatio R. Palmer, 1874","l":[{"t":"v","n":"1","x":"Maestro, se encrespan las aguas Y ruge la tempestad, Los grandes abismos del cielo, Se cubren de oscuridad. ¿No ves que aquí perecemos? ¿Puedes dormir así, Cuando el mar agitado nos abre Profundo sepulcro aquí? Los Letra: Mary A. Baker, 1874, Trad. Vicente Mendoza vientos, las ondas oirán tu voz, \"¡Sea la paz!\" \"¡Sea la paz, sea la paz!\" Calmas las iras del negro mar, Las luchas del alma las haces cesar, Y así la barquilla do va el Señor Hundirse no puede en el mar traidor; Doquier se cumple tu voluntad, ¡Sea la paz! ¡Sea la paz! Tu voz resuene en la inmensidad ¡Sea la paz!"},{"t":"v","n":"2","x":"Maestro, mi ser angustiado Te busca con ansiedad; De mi alma en lo más escondido Se libra cruel tempestad, Pasa el pecado a torrentes Sobre mi frágil ser, Y perezco, perezco ¡Maestro! ¡Oh, quiéreme socorrer! Música: Horatio R. Palmer, 1874"},{"t":"v","n":"3","x":"Maestro, pasó la tormenta, Los vientos no rugen ya, Y sobre el cristal de las aguas El sol resplandecerá, Maestro prolonga esta calma, No me abandones más; Cruzaré los abismos contigo Gozando bendita paz."}]},{"s":"Himnario congregacional","n":"107","t":"Me guía Él, con cuánto amor","p":"368","c":"Letra:    Joseph Henry Gilmore, Trad. Epigmenio Velasco; Música: William B. Bradbury","l":[{"t":"v","n":"1","x":"Me guía Él, con cuánto amor Me guía siempre mi Señor, Al ver mi esfuerzo en serle fiel, Con cuánto amor me guía Él; No abrigo dudas ni temor, Pues me conduce el Buen Pastor. Letra: Joseph Henry Gilmore, Trad. Epigmenio Velasco"},{"t":"v","n":"2","x":"En el abismo del dolor, O donde brille el sol mejor, En dulce paz o en lucha cruel, Con gran bondad me Música: William B. Bradbury"},{"t":"v","n":"3","x":"Tu mano quiero yo tomar Jesús, y nunca vacilar, Pues sólo a quien te sigue fiel Se oyó decir: me"},{"t":"v","n":"4","x":"Y mi carrera al terminar Y así mi triunfo al realizar, No habrá ni dudas ni temor, Pues me guiará mi"},{"t":"c","x":"guía Él. guía Él. Me guía Él, me guía´ Él, Con cuánto amor me guía Él. buen Pastor."}]},{"s":"Himnario congregacional","n":"108","t":"¡Oh cuán dulce es fiar en Cristo!","p":"369","c":"","l":[{"t":"v","n":"1","x":"¡Oh cuán dulce es fiar en Cristo, y entregarse solo a Él; esperar en sus promesas, y en sus sendas serle fiel. Jesucristo, Jesucristo, siempre quiero fiar en Tí. Letra y Música: Louisa M. Stead, 1882, Trad. Vicente Mendoza"},{"t":"v","n":"2","x":"Es muy dulce fiar en Cristo, y cumplir su voluntad; no dudando su palabra, que es la luz y la verdad."},{"t":"v","n":"3","x":"Siempre es grato fiar en Cristo, cuando busca el corazón, los tesoros celes tiales, de la paz y del perdón."},{"t":"v","n":"4","x":"Siempre en Tí confiar yo quiero, mi precioso Salvador, en la vida y en la muerte, protección me dé tu amor."},{"t":"c","x":"Jesucristo, Jesucristo, ya tu amor probaste en mí;"}]},{"s":"Himnario congregacional","n":"109","t":"Que bello es estar en los brazos de Jesús","p":"370","c":"","l":[{"t":"v","n":"1","x":"Que bello es estar en los brazos de Jesús, que hermoso pasar de tinieblas a la luz, y amar siempre amar al que nos dió la vida y salud, y el corazón rebosar de inmensagratitud. Llena Jesús mi corazón, llénalo más y más Señor, ya que me diste tu perdón, llénalo de tu santo amor. Letra y Música: Pedro Osorno, Himno de la convención de 1943, ICIAR, Arr. Edgar Obed Pineda Fierro"},{"t":"v","n":"2","x":"Hundido en el mal mucho tiempo yo viví, tu amor sin igual me sacó del fango vil, y al recordar que lo debo todo a Tí, me dan ganas de llorar de gratitud sin"},{"t":"v","n":"3","x":"Que bello es andar en las sendas de Jesús, que hermoso es seguir los caminos del Señor, mi anhelo mejor es andar por siempre en su luz, hacien do su voluntad con gozo y a -"}]},{"s":"Himnario congregacional","n":"110","t":"¡Qué feliz es la vida a los pies de Jesús!","p":"371","c":"","l":[{"t":"v","n":"1","x":"¡Qué feliz es la vida a los pies de Jesús! do encontramos la dicha y solaz, hoy mi vida entera quiero consagrar, a servir a Jesús nada más. ha prometido llevarnos con Él, Solo resta seguir sus caminos de paz, y guardar hasta el fin nuestra fe. Letra y Música: Leonardo Flores, ICIAR, Arm. Edgar Obed Pineda Fierro"},{"t":"v","n":"2","x":"Si en tu vida el pecado heridas dejó, que jamás has podido curar, hoy es tiempo oportuno en que mi Salvador, de tus penas te hará descansar. Las promesas de Cristo jamás faltarán, y nos"},{"t":"v","n":"3","x":"¡Qué precioso es oir esa voz de Jesús! que nos habla aquí al corazón, y sentir su presencia sublime de paz, que nos llama a su dulce mansión."}]},{"s":"Himnario congregacional","n":"111","t":"Quiero que habléis de aquel grande amor","p":"372","c":"","l":[{"t":"v","n":"1","x":"Quiero que habléis de aquel grande amor Que en el calvario Dios nos mostró; Quiero que habléis del buen Salvador; Habladme más de Cristo. Quiero escuchar la historia fiel De mi Jesús mi Salvador; Quiero vivir tan sólo por Él, Habladme más de Cristo. Letra y Música: J. M. Black, Trad. Vicente Mendoza"},{"t":"v","n":"2","x":"Cuando me asalte la tentación Y que sus redes tienda en mi pie, Quiero tener en Él protección; Habladme más de Cristo."},{"t":"v","n":"3","x":"Cuando en las luchas falte la fe Y el alma sienta desfallecer, Quiero saber que ayuda tendré Habladme más de Cristo."},{"t":"v","n":"4","x":"Y cuando tenga yo que partir Para encontrar a mi Salvador, Con Él gozoso iré a vivir, Habladme más de Cristo."}]},{"s":"Himnario congregacional","n":"112","t":"Salvador, mi bien eterno","p":"373","c":"","l":[{"t":"v","n":"1","x":"Salvador mi bien eterno, más que vida para mí, en mi fatigosa senda, cerca siempre te halle a Tí. Junto a Tí, junto a Tí, junto a Tí, junto a Tí, en mi fatigosa senda, cerca siempre te halle a Tí. Letra y Música: S. J. Vail"},{"t":"v","n":"2","x":"No los bienes no placeres, ni renombre busco aquí, en las pruebas y en desdenes, cerca siempre te halle a Tí. Junto a Tí, junto a Tí, junto a Tí, junto a Tí, en las pruebas y en desdenes, cerca siempre te halle a Tí."},{"t":"v","n":"3","x":"Yendo por sombrio valle, o en rigiente mar hostil, después y antes de la prueba, cerca siempre te halle a Tí. Junto a Tí, junto a Tí, junto a Tí junto a Tí, después y antes de la prueba, cerca siempre te halle a Tí."}]},{"s":"Himnario congregacional","n":"113","t":"Salvo en los tiernos brazos","p":"374","c":"Letra:    Fanny J. Crosby, Trad. Juan B. Cabrera; Música: William H. Doane","l":[{"t":"v","n":"1","x":"Salvo en los tiernos brazos de mi Jesús seré, y en su amoroso pecho siempre reposaré, este es sin duda el eco de celestial canción, que de inefafle gozo llena mi coray en su amoroso pecho siempre reposaré. Letra: Fanny J. Crosby, Trad. Juan B. Cabrera"},{"t":"v","n":"2","x":"De sus amantes brazos la gran solicitud, me libra de tristeza me libra de inquietud; y si tal vez hay pruebas fáciles pasarán, lágrimas si vertiere, pronto se enjugaMúsica: William H. Doane"},{"t":"v","n":"3","x":"Y cruzaré la noche lóbrega sin temor, hasta que venga el día de perennal fulgor. cuán placentero entonces con Él será morar, y en la mansión de gloria siempre con Él rei -"},{"t":"c","x":"rán. Salvo en los tiernos brazos de mi Jesús seré,"}]},{"s":"Himnario congregacional","n":"114","t":"Si en tu vida las nubes agolparse ves","p":"375","c":"Letra:    Lezzie De Armond, Trad. Vicente Mendoza Polanco (1875-1955); Música: Bentley DeForest Ackley (1872-1958)","l":[{"t":"v","n":"1","x":"Si en tu sen da las nubes agolparse ves, no vaciles por ello ni flaqueen tus pies, cadanube que venga no podrá traer más que pruebas que pasan si hay valor y fe. lor y fe! ¡si hay valor y fe! gozo y paz traerá la lucha, si hay valor y fe. Letra: Lezzie De Armond, Trad. Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Si es tu vida una carga de cuidados mil, olvidado de todo te podrás sentir, si tu ayuda acudieres a llevar doquier, esto endulza la vida si hay valor y fe. Música: Bentley DeForest Ackley (1872-1958)"},{"t":"v","n":"3","x":"Pon en alto los ojos sin dudar jamás, que en las lides del mundo vencedor saldrás, que si hay flores y encantos tras invierno cruel trae encantos la vida si hay valor y fe."},{"t":"c","x":"¡Si hay valor y fe! ¡si hay valor y fe! en la más oscura noche siempre hay luz ¡si hay va-"}]},{"s":"Himnario congregacional","n":"115","t":"Si estoy desalentado con penas y temor","p":"376–377","c":"","l":[{"t":"v","n":"1","x":"Si estoy desalentado, Con penas y temor, Con cuitas oprimido, En pruebas y en dolor, Entonces Cristo dice, Mis pruebas al mirar, Letra y Música: J. Bruce Evans Que su sostén y ayuda, Jamás me faltaB Coro B sostendrá, Y nunca me faltará; Si en sombras yo voy, o triste estoy, Su gracia me sostendrá."},{"t":"v","n":"2","x":"Cuando en la dura prueba, Conmigo el mundo es cruel, Cuando en la ruda lucha, No hallo un amigo fiel, Entonces llega a mi alma, Un eco celestial, Es el Señor que dice, Que ayuda, me da -"},{"t":"v","n":"3","x":"Cuando en mis aflicciones, No puedo resistir, Cuando en las tentaciones, Voy casi a sucumbir, Entonces su socorro El Salvador me da, Y El ha prometido Conmigo siempre es -"},{"t":"c","x":"rá. Por gracia Jesús me"}]},{"s":"Himnario congregacional","n":"116","t":"Si olvidado en la vida y a solas estoy","p":"378","c":"","l":[{"t":"v","n":"1","x":"Si olvidado en la vida y a sólas estoy, Si con alma abatida y en sombras yo voy, Si me falta valor y me vence el dolor, Hay ñor, Su amparo jamás faltará; él conoce mi mal y mi grande inquietud, Y ayuda hay en Él sin igual. Letra y Música: P. P. Lowry, Trad. Vicente Mendoza"},{"t":"v","n":"2","x":"Si la fuente del gozo se agota en mi ser, Si de mi alma la gloria la miro caer, Si abrumado yo voy, Si en conflictos estoy, Hay"},{"t":"v","n":"3","x":"Si confuso y cansado no puedo en contrar Los alientos que vengan la fuerza a prestar, En mi senda yo iré sostenido por fe, Hay"},{"t":"c","x":"quién podrá cuidar de mi. De mi cuidará Jesús mi Sequién podrá cuidar de mi. quién cuide siempre de mi."}]},{"s":"Himnario congregacional","n":"117","t":"Sigo a Cristo, Él es mi camino","p":"379","c":"","l":[{"t":"v","n":"1","x":"Sigo a Cristo, Él es mi camino, Lo sigo por tierra, por valles y mar; El me promete nunca dejarme, Promesa diluz, Luz que inunda todo mi sér; ¡Aleluya! me regocijo Cantando glorias a mi Jesús Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Sombras que vienen o nubes que van Nunca mi guía podrán encubrir; Es la luz pura sin sombra alguna, Siempre a su"},{"t":"v","n":"3","x":"Siempre en la luz yo me regocijo, Sigo adelante, voy a mi hogar; Voy caminando, con gozo cantando, Ando en la"},{"t":"c","x":"vina que no ha de faltar. lado yo he de seguir. Cristo es la luz, Cristo es la luz que siempre he de amar."}]},{"s":"Himnario congregacional","n":"118","t":"Tal como el ciervo brama","p":"380","c":"","l":[{"t":"v","n":"1","x":"Tal como el ciervo brama por límpida corriente, Mi corazón ardiente por tí suspira, oh Dios. la bondad divina mi alma tiene sed; Essed. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Mi pan de día y de noche son lágrimas candentes, Diciendome las gentes; \"¿En dónde está tu Dios?\"."},{"t":"v","n":"3","x":"Se abate mucho mi alma, te busca con vehemencia, ¡Oh Dios de mi clemencia, escucha mi oración!"},{"t":"v","n":"4","x":"La voz de los abismos pregona tu grandeza, ¡Oh Dios, mi Fortaleza; en tí yo confiaré."},{"t":"c","x":"Está sedienta mi alma del agua cristalina, De"}]},{"s":"Himnario congregacional","n":"119","t":"Tan dulce el nombre de Jesús","p":"381","c":"Letra:    A. Mejía; Música: E.S. Lorenz","l":[{"t":"v","n":"1","x":"¡Tan dulce el nombre de Jesús! Sus bellas notas al cantar, Mi alma llena al proclamar, El nombre de Jesús. Cristo yo te aclamaré, Por siempre, ¡oh, mi Cristo!. Letra: A. Mejía"},{"t":"v","n":"2","x":"Adoro el nombre de Jesús, Jamás me faltará su amor; Y pone aparte mi dolor El nombre de Jesús. Por siempre, ¡oh, Música: E.S. Lorenz"},{"t":"v","n":"3","x":"Tan puro el nombre de Jesús, Que mi pesar pudo quitar, Y grata paz a mi alma dar, El nombre de Jesús."},{"t":"v","n":"4","x":"El dulce nombre de Jesús, Por siempre quiero alabar; Y todos deben exaltar, El nombre de Jesús."},{"t":"c","x":"¡Cristo dulce nombre es! Dulce para siempre es;"}]},{"s":"Himnario congregacional","n":"120","t":"Todas las promesas del Señor Jesús","p":"382","c":"","l":[{"t":"v","n":"1","x":"Todas las promesas del Señor Jesús, Son apoyo poderoso de mi fe; Mientras luche aquí buscando yo su luz, fie - - - les, Las promesas que el Señor Jesús ha dado, Grandes, fieles, En ellas para siempre confiaré. Letra y Música: R. Kelso Carter, 1886, Trad. Vicente Mendoza"},{"t":"v","n":"2","x":"Todas sus promesas para el hombre fiel, El Señor en sus bondades, cumplirá; Y confiado, sé que para siempre en él, Grandes, grandes, fieles son, Grandes, grandes, fieles son, Grandes, grandes,fieles son,"},{"t":"v","n":"3","x":"Todas las promesas del Señor, serán Gozo y fuerza en nuestra vida terrenal; Ellas en la dura lid nos sostendrán,"},{"t":"c","x":"Siempre en sus promesas confiaré. Gran - - - des, Paz eterna mi alma gozará. Grandes, grandes, fieles son, Y triunfar podremos sobre el mal."}]},{"s":"Himnario congregacional","n":"121","t":"Dios Nos Ha Dado Promesa","p":"383","c":"Letra:    Daniel Whitlle, 1883, trad W. S. Scott; Música: James McGranahan, 1883, alt.","l":[{"t":"v","n":"1","x":"Dios nos ha dado promesa; \"Lluvias de gracia enviaré, Dones que os den fortaleza, Gran bendición os daré\". Mándanos lluvias copiosas, Lluvias del consolador. Letra: Daniel Whitlle, 1883, trad W. S. Scott"},{"t":"v","n":"2","x":"Cristo nos dió la promesa; Del santo consolador, Dándonos paz y pu reza, Para su glo ria y honor. Música: James McGranahan, 1883, alt."},{"t":"v","n":"3","x":"¡Oh Dios, a todo creyente Muestra tu amor y poder! Tú eres de gracia la fuente, Llena de paz nuestro ser."},{"t":"v","n":"4","x":"Pon en tus siervos piadosos, Celo, virtud y valor, Dándonos dones preciosos, Dones del Consolador."},{"t":"c","x":"Llu - - - vias de gracia, Lluvias pedimos Señor; Lluvias, lluvias."}]},{"s":"Himnario congregacional","n":"122","t":"En un aposento alto","p":"384","c":"","l":[{"t":"v","n":"1","x":"En un aposento alto, Con unánime fervor, Ciento veinte esperaban La promesa del Señor. Dios, manda tu gran poder, A cada corazón. Letra y Música: Charlie D. Tillman, 1985, Trad. H. W. Cragin."},{"t":"v","n":"2","x":"Con estruendo de los cielos Descendió la gran virtud; Todos fueron bautizados Con el Santo Espíritu."},{"t":"v","n":"3","x":"Este gran poder antiguo Es el fiel, celeste don, Prometido a los creyentes De humilde corazón."},{"t":"v","n":"4","x":"Dios está restituyendo Este gran pentecostes, Y el Espíritu sus dones Nos reparte otra vez."},{"t":"c","x":"F B F B F c F Dios, manda tu gran poder; Dios, manda tu gran poder;"}]},{"s":"Himnario congregacional","n":"123","t":"Excelso Don Consolador","p":"385","c":"Letra:    Alberto G. Martínez, ICI.; Música: J. Lincoln Hall","l":[{"t":"v","n":"1","x":"Excelso Don Consolador, domina ya en mi corazón; enciendeme con santo ardor con tu divina bendición. hoy mi corazón, enciéndeme con fuego de pentecostés. Letra: Alberto G. Martínez, ICI."},{"t":"v","n":"2","x":"Mi ser puedes tú renovar, y en lenguas te bendeciré; con gran fervor podré hablar, y por doquier te anunciaré. invade hoy mi corazón, Música: J. Lincoln Hall"},{"t":"v","n":"3","x":"Hoy te pedimos, ¡Oh Señor! que llenes todo corazón; y los tesoros de tu amor gocemos por tu santa unción."},{"t":"v","n":"4","x":"Toda miseria él cambió en gran fervor y santo amor; cuando con fuego nos envió el gran y fiel Consolador."},{"t":"c","x":"Excelso Don de miSeñor, promesa de su granpoder; invade ExcelsoDon de mi Señor, promesa de su gran poder;"}]},{"s":"Himnario congregacional","n":"124","t":"Manda, ¡Oh Dios!, una ola de tu gran poder","p":"386","c":"","l":[{"t":"v","n":"1","x":"Manda,¡Oh Dios! una ola de tu gran poder, purifica a tu pueblo aquí; danos grande poder, llena hoy nuestro ser, esperando estamos en der; el poder que al débil la fuerza le da; manda,¡Oh Dios! el glorioso poder. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Danos más de la vida de Cristo el Señor, anhelamos su senda seguir; danos mucho poder para actuar con amor y tu santa palabra cum-"},{"t":"v","n":"3","x":"¡Oh! despierta a los que dormidos están y se dejan del mundo vencer, manda lluvias de gracia y se salvarán; con poder llena hoy nuestro"},{"t":"c","x":"plir. Manda,¡Oh Dios! el glorioso poder; manda,¡Oh Dios! el glorioso po -"}]},{"s":"Himnario congregacional","n":"125","t":"Santo Espíritu, desciende","p":"387","c":"Letra:    Vicente Mendoza; Música: John R. Sweney","l":[{"t":"v","n":"1","x":"Santo Espíritu desciende A mi pobre corazón, Llenalo de tu presencia, Y haz en él tu habitación. Santo Espíritu desciende Y haz en mi tu habitación. Letra: Vicente Mendoza"},{"t":"v","n":"2","x":"De tu gracia puedes darme Inundando el corazón, Ven, que mucho necesito, Dame hoy tu bendición. Música: John R. Sweney"},{"t":"v","n":"3","x":"Dame paz, consuelo y gozo, Cúbreme hoy con tu perdón; Tú confortas y redimes, Tú das grande salvación."},{"t":"v","n":"4","x":"Ven, bautizame ahora, Obediente espero aquí; Ven a ser mi eterno guia, Haz tu voluntad en mi."},{"t":"c","x":"¡Llena hoy! ¡Lena hoy! ¡Llena hoy mi corazón!"}]},{"s":"Himnario congregacional","n":"126","t":"Santo Espíritu, dirige","p":"388","c":"Letra:    Vicente Mendoza; Música: Victor H. Benke","l":[{"t":"v","n":"1","x":"Santo Espíritu, dirige Tú mis pasos al Señor, Y haz que humilde guarde siempre Los mandatos de su amor. ¡Dime, dime cómo hacer su voluntad. Letra: Vicente Mendoza"},{"t":"v","n":"2","x":"Dime cómo ser sumiso Y entregar mi entero ser; Goces y tesoros vanos, Todo siempre aborrecer. su voluntad. Música: Victor H. Benke"},{"t":"v","n":"3","x":"Dime cómo al ser probado Debo, siempre en Él confiar; Y aunque sufra en agonía Nunca de Él desesperar."},{"t":"v","n":"4","x":"Dime cómo obedecerle, Aunque a veces mi razón No comprenda sus designios Ni halle pronta explicación."},{"t":"v","n":"5","x":"Dime cómo he de seguirle Nunca fiando en mi saber, Entregado a su servicio Y confiado en su poder."},{"t":"c","x":"¡Dime, dime cómo consagrar todo al Padre de bondad!"}]},{"s":"Himnario congregacional","n":"127","t":"Señor, con todos quede","p":"389","c":"","l":[{"t":"v","n":"1","x":"Señor con todos quede tu fiel consolador, y en cada pecho encienda un nuevo y santo ardor; confirma tu promesa, de gozo y de poder, y muestrese gloriosa tu vida en nuestro ser. Letra y Música: Vicente Mendoza"},{"t":"v","n":"2","x":"Espíritu de gracia, de paz y de perdón; mantén el sacro fuego de fiel consagración; queremos ser sumisos y hacer tu voluntad, tus santas ordenanzas cumpliendo con lealtad."},{"t":"v","n":"3","x":"Que siempre tu potencia la sienta nuestro ser, teniendo la experiencia gloriosa de poder; queremos tu palabra poder interpretar, Espíritu divino, tú venla a revelar."},{"t":"v","n":"4","x":"Señor bendito seas, bendita tu bondad, pues siempre tú respondes del hombre a su ansiedad; inúndenos tu gloria, consúmanos tu amor, y quede con tus hijos tu Espíritu Señor."}]},{"s":"Himnario congregacional","n":"128","t":"¿De pesar estás rodeado?","p":"390","c":"Letra:    Juan N. de los Santos; Música: William James Kirkpatrick","l":[{"t":"v","n":"1","x":"¿De pesar estás rodeado? ¿tienes pruebas en verdad? ¿De sufrir estás cansado? ¿ves que viene tempestad? el Señor está velando, te dará tranquilidad. Letra: Juan N. de los Santos"},{"t":"v","n":"2","x":"En las penas, en el duelo, que tu alma sufrirá, En Jesús tendrás consuelo, el tus penas calmará. Música: William James Kirkpatrick"},{"t":"v","n":"3","x":"Al Señor tu voz eleva, ve a Dios con gran fervor; Él de penas te releva y mitiga tu dolor."},{"t":"v","n":"4","x":"¿Tarda Dios en contestarte? sigue orando sin cesar; Pronta ayuda puede darte, tu oración al contestar."},{"t":"c","x":"Sigue orando, sigue orando, aunque ruja la tempestad,"}]},{"s":"Himnario congregacional","n":"129","t":"Dulce oración","p":"391","c":"Letra:    William W. Walford; Música: William Batchelder Bradbury","l":[{"t":"v","n":"1","x":"Dulce oración, dulce oración, de toda influencia mundanal, elevas tú mi corazón al tierno Padre celes tial. ¡Oh!, cuantas veces tuve en ti auxilio en ruda tentación, y cuántos bienes recibí, mediante ti, dulce oración. Letra: William W. Walford"},{"t":"v","n":"2","x":"Dulce oración, dulce oración, al trono excelso de bondad, tú llevarás mi petición a Dios que escucha con piedad. Por fe espero recibir la gran divina bendición, y siempre a mi Señor servir por tu virtud, dulce oración. Música: William Batchelder Bradbury"},{"t":"v","n":"3","x":"Dulce oración, dulce oración, que aliento y gozo al alma das, en esta tierra de aflicción consuelo siempre me serás. Hasta el momento en que veré las puertas francas de Sión; entonces me despediré feliz, de ti, dulce oración."}]},{"s":"Himnario congregacional","n":"130","t":"Es la oración un medio que el Señor","p":"392","c":"","l":[{"t":"v","n":"1","x":"Es la oración un medio que el Señor le dejó a su grey que anda con temor; viendo su palabra, en ella encontrarás ¡Qué felicidad! y contarle todo con suma verdad; exponiendole tu necesidad, él te escuchará desde su trono celestial. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Si estás tú triste, ponte en oración, a tu buen Señor derrama el corazón; es un privilegio que en su amor nos dio,"},{"t":"v","n":"3","x":"Si no ves respuesta, ora más y más, no te desanimes, Cristo no es falaz; siempre a sus promesas fiel responderá;"},{"t":"v","n":"4","x":"Si estas esperando al fiel Consolador deberás buscarlo con fe y valor; el Señor mirando tu necesidad"},{"t":"c","x":"que la oración te acerca a Cristo más y más. él te escuchará por que así lo prometió. ¡Oh! hablar con Cristo lo que necesites, el Señor te lo dará. de su Santo Espíritu en ti derramará."}]},{"s":"Himnario congregacional","n":"131","t":"Padre nuestro que moras en todo lugar","p":"393","c":"","l":[{"t":"v","n":"1","x":"Padre nuestro que moras en todo lugar, nuestras voces alzamos a ti, no dudamos que hoy tú nos vas a escuchar y estael cristiano anteti llegará, llegará; hasta el trono de gracia se transportará en tus alas, preciosa oración. (oración) Letra y Música: Desconocido."},{"t":"v","n":"2","x":"¡Oh, cuán dulces momentos de grata oración cuando hablamos al Rey y Señor! nuestro pecho reboza de gran bendición, el lo"},{"t":"v","n":"3","x":"Cuánta paz y dulzura nos da la oración, pues nos lleva con Cristo a gozar; estaremos por siempre en la meditación de la"},{"t":"v","n":"4","x":"Al Señor hablaremos en nuestra oración, pediremos su gracia y poder, venceremos así toda cruel tentación, llega-"},{"t":"c","x":"rás con nosotros aquí. llena de paz y de amor. ¡Oh! precioso jardín de oración, de oración, vida futura sin par. remos su gloria a ver."}]},{"s":"Himnario congregacional","n":"131b","t":"Las primicias del día","p":"394–395","c":"","l":[{"t":"v","n":"1","x":"Me despierto con ganas de verlo; Las primicias del día le doy. Comenzar con el Rey me anima Letra y Música: Brus del Monte Confesarle \"Señor, tuyo soy\". Yo te doy esta vida Señor. De tu mano yo quiero seguir, Controlado por Ti al vivir."},{"t":"v","n":"2","x":"Un momento contigo es oro; Conversar con el Rey es mi honor. Me impartes tu sabiduría; Me inspira tu carta de amor."},{"t":"c","x":"Yo te doy este día Señor,"}]},{"s":"Himnario congregacional","n":"132","t":"Que bello es estar en el jardín de la oración","p":"396","c":"","l":[{"t":"v","n":"1","x":"Qué bello es estar en el jardín de la oración, siempre meditar en santa y dulce comunión; Al cielo llegar do el Señor Jesús está, para recibir la más preciosa bendición. nión y santidad; paso a paso ir con mi Señor hasta el final, y siempre morar allá en el reino celestial. Letra y Música: Francisco Sánchez Muñiz"},{"t":"v","n":"2","x":"La más bella flor en el jardín santo de Dios, de agradable olor, de suavidad, de aceptación, de gracia sin par y de belleza celestial, es la humildad, dulce virtud del corazón."},{"t":"c","x":"Yo quiero vivir en oración y humildad, quiero yo seguir en comu-"}]},{"s":"Himnario congregacional","n":"133","t":"Aquí está mi Jesús","p":"397","c":"","l":[{"t":"v","n":"1","x":"Aquí está mi Jesús, dale tu corazón, que lo llene de su gracia, y le dé su bendición. píritu Santo bendición hoy te dará. Letra y Música: Guadalupe Velasco, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Si vienes triste y cansado dale tu carga al Señor no temas sigue adelante él es tu ayudador."},{"t":"v","n":"3","x":"Aquí muy dentro de mi alma yo siento una bendición, yo siento que está conmigo el gran Consolador."},{"t":"v","n":"4","x":"Ya tengo nuevos alientos para seguir con valor; de tu gracia me ha llenado tu Espíritu Señor."},{"t":"c","x":"Alzad vuestras manos y bendecid a Jehová, su Es-"}]},{"s":"Himnario congregacional","n":"134","t":"La Peña de Horeb","p":"398","c":"","l":[{"t":"v","n":"1","x":"Cristo es la peña de Horeb que está brotando; agua de vida saludable para ti, Cristo es la peña de Horeb que está broberla, es más dulce que la miel, refresca el alma y apaga toda sed. Cristo es la peña de Horeb que está brotando, agua de vida saludable para ti. Letra y Música: Melodía Puertoriqueña, s.XX, Arr. Isaac García Contreras"},{"t":"v","n":"2","x":"Oh, pecador que vas por el desierto, por las candentes arenas del pecar; oye la voz que dice ven y"},{"t":"v","n":"3","x":"Contemplo a Cristo, por mí crucificado en el calvario, es rico manantial, Cristo es la peña de Horeb, que está bro -"},{"t":"c","x":"tando; agua de vida saludable para ti. bebe, es Jesucristo, que te quiere perdonar. Ven a betando, agua de vida saludable para ti."}]},{"s":"Himnario congregacional","n":"135","t":"Dime la antigua historia","p":"399","c":"Letra:    Katherine Hankey, Tr. Juan B. Cabrera; Música: William H. Doane","l":[{"t":"v","n":"1","x":"Dime la antigua historia del celestial favor, de Cristo y de su gloria, de Cristo y de su amor. Dímela con llaneza propia de la niñez, por que es mi mente corta y anhela senciháblame de la gloria, de Cristo y de su amor. Letra: Katherine Hankey, Tr. Juan B. Cabrera"},{"t":"v","n":"2","x":"Dime tan dulce historia con tono claro y fiel: \"murió Jesús, y salvo tú pue des ser por él. Dime esta historia siempre si en tiempode aflicción deseas a mi alma traer consolaMúsica: William H. Doane"},{"t":"v","n":"3","x":"Dime la antigua historia cuando creas tal vez que del mundo me ciega la falsa brillantez. Y cuando ya vislumbre de la gloria la luz, repíteme la historia: \"Quien te salva es Je-"},{"t":"c","x":"llez. ción. Dime la antigua historia, cuéntame la victoria,"}]},{"s":"Himnario congregacional","n":"136","t":"Grato es decir la historia","p":"400","c":"Letra:    Katherine Hankey, Tr. Juan B. Cabrera; Música: William G. Fischer","l":[{"t":"v","n":"1","x":"Grato es decir la historia del celestial favor, de Cristo y de su gloria, de Cristo y de su amor; me agrada referirla, pues sé que es la verdad, y nada satisface cual ella mi ansierá la antigua historia de Cristo y de su amor. Letra: Katherine Hankey, Tr. Juan B. Cabrera"},{"t":"v","n":"2","x":"Grato es decir la historia que brilla cual fanal, y en glorias y portentos no reconoce igual; me agrada referirla, pues me hace mucho bien; por eso ati deseo decírtela tamMúsica: William G. Fischer"},{"t":"v","n":"3","x":"Grato es decir la historia que antigua, sin vejez, parece al repetir la más dulce cada vez; me agrada referirla, pues hay quien nunca oyó que para hacerle salvo el buen Jesús mu -"},{"t":"c","x":"bién. ¡Cuán bella es essa historia! mi tema allá en la gloria se -"}]},{"s":"Himnario congregacional","n":"137","t":"Hermosas la huellas del predicador","p":"401","c":"","l":[{"t":"v","n":"1","x":"Hermosas las huellas del predicador que anuncia las nuevas de celeste amor, y va por doquiera derramando luz, la luz esplenhuellasdel predicador que pasa su vida sirviendo, sirviendo al Señor, y las buenas nuevas sin cesar anuncia; hermosoy eterno por cierto, galardón tendrá."},{"t":"v","n":"2","x":"Verdades sublimes, para el hombre son un gozo perfecto, grande bendición; celes te reposo de gracia y solaz, un don ine"},{"t":"v","n":"3","x":"Irá él andando, y quizá llorando, llevando do quiera simiente de amor; mas con regocijo voverá trayendo preciosas ga -"},{"t":"v","n":"4","x":"No hay en la tierra vocación mejor que aquella que ofrece vida al pecador mediante la gracia, de Dios el amor; hermosas las"},{"t":"c","x":"dete que sólo es Jesús. fable de perenne paz. Hermosas, hermosas, hermosas las villas para su Señor. huellas del predicador."}]},{"s":"Himnario congregacional","n":"138","t":"¡Oh! Cantádmelas otra vez","p":"402","c":"","l":[{"t":"v","n":"1","x":"¡Oh! cantádmelas otra vez, bellas palabras de vida, hallo en ellas mi gozo y luz, bellas palabras de vida; Sí, de luz y vida, son sostén y guía; ¡Qué bellas son, qué bellas son! bellas palabras de vida. Letra y Música: Philip P. Bliss, Tr. Julia Butler"},{"t":"v","n":"2","x":"Jesucristo a todos da bellas palabras de vida, hoy escúchalas pecador, bellas palabras de vida; bondadoso te salva, y al cielo te llama;"},{"t":"v","n":"3","x":"Grato el cántico sonará, bellas palabras de vida, tus pecados perdonará, bellas palabras de vida; Sí, de luz y vida, son sostén y guía;"},{"t":"c","x":"¡Qué bellas son, qué bellas son! bellas palabras de vida;"}]},{"s":"Himnario congregacional","n":"139","t":"Si en la fe yo desmayare","p":"403","c":"Letra:    Vicente Mendoza; Música: Robert Harkness, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Si en la fe yo desmayare él me sostendrá; y si el mal me amenazare él me sostendrá. mi Jesús que tanto me ama, él me sostendrá. Letra: Vicente Mendoza"},{"t":"v","n":"2","x":"Nunca yo podré ser firme con tan débil fe; mas el puede dirigirme, y él me sostendrá. Música: Robert Harkness, Arm. Isaac García Contreras"},{"t":"v","n":"3","x":"Son su gozo y complacencia cuantos él salvó, y al salvarme en su clemencia, él me sostendrá."},{"t":"v","n":"4","x":"Él no quiso ver perdida mi alma en la maldad; dio su sangre por mi vida, y él me sostendrá."},{"t":"c","x":"Él me sostendrá, él me sostendrá;"}]},{"s":"Himnario congregacional","n":"140","t":"Lámpara a mis pies es tu Palabra","p":"404","c":"","l":[{"t":"v","n":"1","x":"Lámpara a mis pies es tu Palabra Que alumbra, Señor, mi corazón. Lámpara a mis pies es tu Palabra Que me guiará a la Patria Celestial. brera que en mi camino va, que me conduce a la Patria celes tial. Letra y Música: Francisco Sánchez Muñíz, ICIAR, Arm. Isaac García Contreras"},{"t":"v","n":"2","x":"\"Escudriñar su Palabra Santa\" Nos mandó nuestro Señor Jesús; \"Testimonio da de mí\", Él dijo, \"Y encontraréis perfecta Vida Eternal\"."},{"t":"v","n":"3","x":"Cuando un día vine a Jesucristo Sólo había en mí oscuridad, Mas en su Palabra hallé, gloriosa, La luz refulgente que siempre me guiará."},{"t":"c","x":"Preciosa luz en mí brilló, Es la Palabra del Señor; es la lum -"}]},{"s":"Himnario congregacional","n":"141","t":"Padre, tu Palabra es","p":"405","c":"Letra:    Juan Bautista Cabrera; Música: J. T. Grape","l":[{"t":"v","n":"1","x":"Padre tu Palabra es Mi delicia y mi solaz; Guíe siempre a ti mis pies, Y a mi pecho traiga paz. Que en perenne resplandor Norte y guía da almortal. Letra: Juan Bautista Cabrera"},{"t":"v","n":"2","x":"Obediente oí tu voz, En tu gracia fuerza hallé, Y con firme pie veloz, Por tus sendas caminé. Música: J. T. Grape"},{"t":"v","n":"3","x":"Tu verdad es mi sostén, Contra duda y tentación, Y destila calma y bien Cuando asalta la aflicción."},{"t":"v","n":"4","x":"Son tus dichos para mí, Prendas fieles de salud; Dame pues, que te oiga a Ti, Con filial solicitud."},{"t":"c","x":"Es tu ley Señor, Faro celes tial,"}]},{"s":"Himnario congregacional","n":"142","t":"Santa Biblia, para mí","p":"406","c":"Letra:    John Burton, 1805, Trad. Pedro Castro; Música: Melodía española, Atrib. a Henry R. Bishop, Arr. Benjamin Carr, 1825","l":[{"t":"v","n":"1","x":"Santa Biblia, para mí eres un tesoro aquí; tú contienes con verdad la divina voluntad; tú me dices lo que soy, de quién vine y a quién voy. Letra: John Burton, 1805, Trad. Pedro Castro"},{"t":"v","n":"2","x":"Tú reprendes mi dudar y me exhortas sin cesar; Eres faro que a mi pie va guiando por la fe a las fuentes del amor del bendito Salvador. Música: Melodía española, Atrib. a Henry R. Bishop, Arr. Benjamin Carr, 1825"},{"t":"v","n":"3","x":"Eres infalible voz del Espíritu de Dios, que vigor al alma da cuando en aflicción está; tú me enseñas a triunfar de la muerte y del pecar."},{"t":"v","n":"4","x":"Por tu santa letra sé que con Cristo reinaré; yo, que tan indigno soy, por tu luz al cielo voy; ¡Santa Biblia, para mí eres un tesoro aquí!."}]},{"s":"Himnario congregacional","n":"143","t":"Tu Palabra Santa llama","p":"407","c":"","l":[{"t":"v","n":"1","x":"Tu Palabra Santa llama a todo hombre pecador Para darle siempre calma y llenarlo de tu amor; Si la acepta con el alma sentirá su corazón Que de veras Tú le amas, ¡Oh, Divino Salvador! rá; sólo tu Palabra eterna por los siglos durará. Letra y Música: Alberto G. Martínez, ICIAR"},{"t":"v","n":"2","x":"Tu Palabra salvadora es verdad, es vida y luz Que ilumina a toda hora hasta donde te hallas Tú; Haz que tenga yo la honra de llevar siempre tu cruz, Y alcanzar así la gloria donde moras, mi Jesús. Cielo estrellas, mar y tierra, todo, todo pasa -"},{"t":"v","n":"3","x":"Tu Palabra es pan de vida; es sustento espíritual; Cuando llega al alma herida le da alivio, le da paz; Todo aquel que la recibe, nunca, nunca morirá, Porque Tú quieres que viva por toda la eternidad."}]},{"s":"Himnario congregacional","n":"144","t":"Acuérdate de tu creador","p":"408","c":"","l":[{"t":"v","n":"1","x":"Acuérdate de tu Creador En los días de tu juventud, Antes que vengan días y años de dolor Y no halles contentamiento; Antes que se oscurezca el sol Y tu vida llegue a su fin, Acuérdate de tu Creador En los días fe; Te llenará de vida plena con fuego de Pentecostés. Letra y Música: Francisco Sánchez Muñíz"},{"t":"v","n":"2","x":"Espíritu Santo de Dios, A esta Cristiana Juventud Ven a llenar con ese fuego ce lestial Que da poder, da convicción; Haz que en su alma, cual altar, Arda constante, oh Señor, El fuego purificador De tu po -"},{"t":"v","n":"3","x":"En todo tiempo sean blancas Tus vestiduras, Juventud, En tu cabeza no falte ungüento jamás Para vivir en santidad; Con el Cordero Celestial Albo vestido encontrarás, En el Espíritu de Dios unción fra -"},{"t":"c","x":"de tu juventud. tencia celestial. ¡Oh! Juventud,de Jesús ven a sus pies! En obediencia,pureza y gante obtendrás."}]},{"s":"Himnario congregacional","n":"145","t":"¡Adelante! huestes fieles del Señor","p":"409","c":"","l":[{"t":"v","n":"1","x":"¡Adelante! huestes fieles del Señor, ¡Adelante! ¡Adelante! No temáis, luchemos todos con valor, él nos ayudará. - Jesucristo es nuestro Jefe, Y siempre a nuestro lado va; Adelante, pues, su gracia nos dará, ¡Jamás nos dejará! sús el Salvador! Adelante, pues, su gracia nos dará, ¡Jamás nos dejará! Letra y Música: Aquiles Mireles Perales"},{"t":"v","n":"2","x":"Lucharemos siempre por el Salvador, ¡Adelante! ¡Adelante! Buscaremos almas para el Señor, él nos ayudará Anunciemos su grandeza Y su incomparable amor; Adelante, pues su gracia nos dará, ¡Jamás nos dejará!"},{"t":"v","n":"3","x":"Luchadores fieles del Señor Jesús, ¡Adelante! ¡Adelante! Por doquier contad la historia de la cruz, él nos ayudará. Muchos hombres nada saben Del buen Señor que allí murió; Adelante, pues, su gracia nos dará ¡Jamás nos dejará!"},{"t":"c","x":"¡Adelante combatientes! ¡Adelante sin temor! ¡Seremos los valientes De Je-"}]},{"s":"Himnario congregacional","n":"146","t":"¡Adelante! seguidores de Jesús","p":"410–411","c":"","l":[{"t":"v","n":"1","x":"témonos con gozo, trabajemos con afán; Levantémonos, hermanos, a buscar al pecadorNuestro Jefe nos alienta, venceremos a Satán. Letra y Música: Aquiles Mireles Perales Con regocijo en el alma nos congregamos aquí Unidos todos con lazos de un verdadero amor; ¡Oh! cuán hermoso es siempre morando junto a Ti Sintien do tusbendi ciones, queridoSalvador."},{"t":"v","n":"2","x":"A ti, Señor, acudimos, tu bendición imploramos, Hemos venido, Padre, a disfrutar tu amor; Reunidos en tu nombre estamos. ¡Oh Señor! Danos tu gracia divina, sólo en Ti confiamos."},{"t":"v","n":"3","x":"Mira tus hijos amados con grande gozo en el alma, Todos buscando tu rostro en santa comunión; Calma las tempestades, derrama bendición, Después de tanta tormenta danos Tú la calma."},{"t":"c","x":"Adelante, seguidores de Jesús el Salvador, Alis -"}]},{"s":"Himnario congregacional","n":"147","t":"Un llamado llega ya","p":"412","c":"","l":[{"t":"v","n":"1","x":"Un llamado llega ya, la batalla va a empezar, oye al Capitán llamar: ¡A luchar, a luchar! Al compas del tambor grita ya ¡yo voy, yo voy! ¡A luchar, a luchar, a luchar! al feróz Satán; ¡A luchar, a luchar, a luchar! Letra y Música: Desconocido, Arm. Isaac García Contreras."},{"t":"v","n":"2","x":"Las falanges de Satán, derrotadas huyen ya, se acerca el final, ¡A luchar, a luchar! la victoria nuestra es, ¡Adelante a vencer! ¡A luchar, a luchar, a luchar!"},{"t":"c","x":"Cristo al frente siempre va, es el Capitán, con él hemos de vencer"}]},{"s":"Himnario congregacional","n":"148","t":"Anhelo dar de gracia","p":"413","c":"","l":[{"t":"v","n":"1","x":"Himno del Instituto Teológico \"San Pablo\" Anhelo dar de gracia, lo que de gracia dio, el Cristo victorioso, que mi alma transformó, no puedo detenerme, mi vida debo campos blancos están!, la mies es mucha y obreros faltan ya; llenad ya de Cristo, al mundo sin desmayar sembremos la semilla para eternidad. Letra y Música: Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Mas hoy con diligencia me debo presentar, con Cristo mi Maestro; ¡Quisiérame aprobar! la Obra de los siglos, demanda sin tar -"},{"t":"v","n":"3","x":"La Biblia es el mensaje que debo bien de usar, para que la Doctrina, defienda sin cesar; llevando la Palabra, yo debo persis -"},{"t":"v","n":"4","x":"Contento en aquel día, mi Salvador dirá: Ven siervo fiel y bueno, mi Padre te amará, tus penas han pasado, corona ceñi -"},{"t":"c","x":"dar, las almas ya se pierden y hay que predicar. dar, de íntegros obreros, libres de pecar. ¡Alzad vuestros ojos, los tir, para que por su gracia, salve al que ha de oír. rás; victoria has obtenido, en gloria vivirás."}]},{"s":"Himnario congregacional","n":"149","t":"A trabajar, a trabajar","p":"414","c":"","l":[{"t":"v","n":"1","x":"A trabajar, a trabajar; no te quedes sin publicar; háblales de Jesús, porque su sangre nos dio en la cruz. der. Vives tú para él, vivo yo para él, y su sangre de amor también tiene poder. Letra y Música: Enrique de la Rosa Piedras, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Hasta la muerte él llegó y su vida por ti la dio, y su sangre derramó y tus pecados él perdonó."},{"t":"v","n":"3","x":"Si por el mundo triste vas ningún consuelo pudiste hallar, ven a la fuente que es Jesús, y en su sangre salvo serás."},{"t":"v","n":"4","x":"La credencial que llevo yo, es la de Cristo mi Salvador; y en su nombre hablaré el evangelio de su poder."},{"t":"c","x":"Vives tú para él, vivo yo para él, y su sangre de amor también tiene po -"}]},{"s":"Himnario congregacional","n":"150","t":"Brilla en el sitio donde estés","p":"415","c":"Letra:    Ina Duley Ogdon, 1913 (1872-1964), Tr. Vicente Mendoza; Música: Charles H. Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Nunca esperes el momento de una grande acción, ni que pueda lejos ir tu luz; de la vida a los pequeños actos da atención; brilla en el sitio puedes con tu luz algún perdido rescatar; brilla en el sitio donde estés. Letra: Ina Duley Ogdon, 1913 (1872-1964), Tr. Vicente Mendoza"},{"t":"v","n":"2","x":"Puedes en tu cielo algunas nubes disipar, haz a un lado tu egoismo cruel; aunque sólo un corazón pudieras consolar brilla en el sitio Música: Charles H. Gabriel (1856-1932)"},{"t":"v","n":"3","x":"Puede tu talento alguna cosa descubrir, do tu luz podrá resplandecer de tu mano el pan de vida puede aquí venir; brilla en el sitio"},{"t":"c","x":"donde estés. donde estés. Brilla en el sitio don de estés; Brilla en el sitio donde estés; donde estés."}]},{"s":"Himnario congregacional","n":"151","t":"Brille o no el sol","p":"416","c":"","l":[{"t":"v","n":"1","x":"Brille o no el sol, verano o invierno sea recorre la montaña el soto el llano, cual Cristo la palabra en Galilea, sembrar es tu misión si eres cristiano. Letra y Música: W. F. Valderrama"},{"t":"v","n":"2","x":"Siembra do quiera la verdad divina, siémbrala con afanes, con dolores, que al soplo del Espíritu germina planta que al cielo da frutos y flores."},{"t":"v","n":"3","x":"Quizá alguna vez tu planta herida sientas por las espinas del sendero, ¿no ves con ellas de Jesús ceñida la frente augusta del fatal madero."},{"t":"v","n":"4","x":"Siembra, no temas en la peña dura, deja en la roca estéril caer el grano Que suele hallar la gracia una endidura En el granito del orgullo humano"}]},{"s":"Himnario congregacional","n":"152","t":"Cristo es nuestro jefe","p":"417","c":"","l":[{"t":"v","n":"1","x":"Cris to es nuestro Jefe, por él debemos luchar, luchar con denuedo hasta el triunfo al canzar; Cristo es nuestro guía, sólo a él debemos seguir, pues Cristo ha prometido estar con su pueblo hasta el fin. luz; si en peligro te ves, no debes desmayar porque a tu ladoCristo está. Letra y Música: Desconocido, Arm. Isaac García Contreras."},{"t":"v","n":"2","x":"Luchemos unidos y así podremos triunfar, levan tando muy alto, el pendón celestial, Dios es con nosotros ¿quién contra nosotros será? hoy el Señor nos invita por su causa bendita a luchar."},{"t":"v","n":"3","x":"Juventud cristiana nunca debes desmayar Cristo va contigo, en él tú debes confiar, Dios dice: no temas que yo contigo seré; pues a luchar sin temores, cumplir con este santo deber."},{"t":"c","x":"Voy a luchar por miJesús. llevando el evangelio de paz y"}]},{"s":"Himnario congregacional","n":"153","t":"Cristo está buscando obreros hoy","p":"418","c":"Letra:    Vicente Mendoza Polanco (1875-1955); Música:James Bowman Overton Clemm(1855-1927)","l":[{"t":"v","n":"1","x":"Cristo estábuscando obreros hoy Que quieran ir con Él; ¿Quién dirá: \"Señor contigo voy, Yo quiero serte fiel\"? Danos luz, ardiente fe y valor, Y obreros siempre habrá. Letra: Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Cristo quiere mensajeros hoy, Que anuncien su verdad; ¿Quien dirá: \"Señor yo listo estoy, Harétu voluntad\"? Música:James Bowman Overton Clemm(1855-1927)"},{"t":"v","n":"3","x":"Hay lugar si quieres trabajar, De Cristo en la labor; Puedes de Su gloria al mundo hablar, De su bondad y amor."},{"t":"v","n":"4","x":"¿Vives ya salvado por Jesús? ¿Su amor conoces ya? ¡Habla, pues, anuncia que en la luz De Cristo vives ya!"},{"t":"c","x":"¡Oh Señor, es mucha la labor, Y obreros faltan ya;"}]},{"s":"Himnario congregacional","n":"154","t":"Columna de fuerte sostén","p":"419","c":"","l":[{"t":"v","n":"1","x":"Columna de fuerte sostén es el \"cristiano amén\" que sirve con disposición, con todo su corazón; incienso da en cada \"Amén\" cual deliciosa oblación la vida de todo aquel que sirve cer, servir en todo con alegría; \"Cristiano amén\" quiero ser. Letra y Música: Francisco Sánchez Muñíz, ICIAR"},{"t":"v","n":"2","x":"El corazón de todo aquel que has perdonado, Señor, agradecido, con amor, con humildad, siendofiel, te sirvesiempre con fervor, alegre de corazón en toda obra con tesón, siendo \"cris-"},{"t":"v","n":"3","x":"En humildad, con gran fervor, el alma llena de amor, con sencillez de corazón, reverencial devoción; en santo amor y todo bien, ardiente todo mi ser, quiero, Señor, servirte fiel, siendo \"cris-"},{"t":"c","x":"dócil y fiel. tiano amén\" \"Cristiano amén\" yo quiero ser, colaborar y obedetiano amén\""}]},{"s":"Himnario congregacional","n":"155","t":"Cual pendón glorioso","p":"420","c":"Letra:   Daniel W. Whitle, 1887, Tr. Enrique Turrall; Música: James McGranahan, 1887","l":[{"t":"v","n":"1","x":"Cual pendón glorioso despleguemos hoy La bandera de la cruz, La verdad del Evange lio, el blasón Del sollante, En pos de nuestro Salvador Con plena fe en el Rey!Adelante con valor! Letra: Daniel W. Whitle, 1887, Tr. Enrique Turrall"},{"t":"v","n":"2","x":"Prediquemos siempre la hermosa virtud De la sangre de Jesús; Como limpia de pecado al mortal, Y le Música: James McGranahan, 1887"},{"t":"v","n":"3","x":"En el mundo proclamemos con fervor La historia de la cruz; Bendigamos sin cesar al Redentor, Que nos"},{"t":"v","n":"4","x":"En el cielo nuestro cántico será, ¡Aleluya a Jesús! Nuestro corazón allí rebosará De a -"},{"t":"c","x":"dado de Jesús. compra la salud. ¡Adelan - - - te adedio su paz y luz. mor y gratitud"}]},{"s":"Himnario congregacional","n":"155b","t":"En la montaña podrá no ser","p":"421","c":"","l":[{"t":"v","n":"1","x":"En la montaña podrá no ser, ni sobre rugiente mar; podrá no ser en la dura lid, do Cristo nos quiere emplear. Mas si él me ordenare seguír aquí, senderos que yo ignoré; confiando en él lediré: Señor do tú mar, decir lo que quieras Señor podré, lo que quieras que sea seré. Letra y Música: Desconocido, Arm. Isaac García Contreras"},{"t":"v","n":"2","x":"Quizá hay palabras del Santo amor que Cristo me ordena hablar, y en los caminos do reina el mal algún pecador salvar. Señor siquisieras mi guía ser, mi oscura senda andaré; tu fiel mensaje podré a nunciar y a -"},{"t":"v","n":"3","x":"El vasto mundo lugar tendrá do pueda con noble ardor usar la vida que Dios me da por Cristo mi Salvador. Y siempre confiando en su gran bondad tus dones todos tendré, y alegre haciendo tu voluntad lo que"},{"t":"c","x":"quieras que vaya, iré. sí lo que quieras diré. Do tú necesites que vaya iré a los valles, montes o el quieras que sea seré."}]},{"s":"Himnario congregacional","n":"156","t":"Es ya tiempo de segar y tu sin meditar","p":"422–423","c":"","l":[{"t":"v","n":"1","x":"Es ya tiempo de segar, y tú sin meditar, Declarando con holgura: \"No hay que trabajar\"; Mientras tanto que el Maestro te vuelve a llamar, Ven y ve los blancos, cómo están Aguardando manos que los segarán. campos blancos ¿Quien? ¡oh! ¿quién los segará? ¡Oh Letra y Música: Charles Hutchinson Gabriel (1856-1932) Joven, ¡despierta! hazlo pronto y alerta, Sé el primero en decirle \"heme ajoven! \"heme aquí Señor\" Por doquier se inclina la madura mies quí, sí, heme aquí ¡responde! Por doquier se inclina la maQue las auras mueven, y ¡que bella es! Joven, ¡depierta! hazlo dura mies, ¡oh, qué bella es! pronto y alerta, Pocos días hay que restan para el segador."},{"t":"v","n":"2","x":"Las gavillas que recojas, joyas de esplendor, brillarán en la corona que dará el Señor; Busca pronto eternas joyas, Dios te premiará, blancos ya están los campos Aguardando manos que los segarán ¡Oh, joven Por doquier se inclina la madura mies,ved la mies Que las auras mueven, y ¡que bellas es! ¡Oh joven"},{"t":"v","n":"3","x":"Va pasando la mañana, y nunca volverá, Pronto el tiempo de la siega ya terminará; Te hallarás al fin vacío ante tu Creador,"},{"t":"c","x":"Joven, Joven, Ven a trabajar. Ven y ve los campos Joven, joven, Ven, trabaja ya. Ven y ve los campos, Joven, joven, Vén, trabaja ya."}]},{"s":"Himnario congregacional","n":"157","t":"Firmes y adelante, huestes de la fe","p":"424","c":"Letra:   Sabine Baring-Gould, 1864, Tr. J. B. Cabrera; Música: Arthur Seymour Sullivan, 1891","l":[{"t":"v","n":"1","x":"Firmes y adelate, huestes de la fe, sin temor alguno, que Jesús nos ve; Jefe soberano, Cristo al frente va, y la regia enseña, tremolando está. sin temor alguno, que Jesús nos ve. Letra: Sabine BaringGould, 1864, Tr. J. B. Cabrera"},{"t":"v","n":"2","x":"Al sagrado nombre de nuestro adalid, tiembla el enemigo y huye de la lid, nuestra es la victoria, dad a Dios loor; y óigalo el averno lleno de pavor. Música: Arthur Seymour Sullivan, 1891"},{"t":"v","n":"3","x":"Muévese potente la iglesia de Dios de los ya gloriosos marchamos en pos; somos solo un cuerpo, y uno es el Señor; una la esperanza, y uno nuestro amor."},{"t":"v","n":"4","x":"Tronos y coronas pueden perecer, De Jesús la iglesia fiel habrá de ser; nada en contra suya prevalecerá porque la promesa nunca faltará."},{"t":"c","x":"Firmes y adelate, huestes de la fe,"}]},{"s":"Himnario congregacional","n":"158","t":"Iglesia de Cristo, reanima tu amor","p":"425","c":"Letra:    Charles Wesley, Tr. Mateo Cosido; Música: Atrib. a Michael Haydn en Sacres Melodias de William Gardinier, 1815","l":[{"t":"v","n":"1","x":"Iglesia de Cristo, reanima tu amor, Y EsCoro.I glesia de Cristo, reanima tu amor, Y Espera velando a tutu Redentor. sús el Esposo, cubierto de honor, Viniendo se anuncia con fuerte clamor. Letra: Charles Wesley, Tr. Mateo Cosido"},{"t":"v","n":"2","x":"Si falta en algunos el santo fervor, La lad compañeros, velad sin temor, Que está con nosotros el Consolador. Música: Atrib. a Michael Haydn en Sacres Melodias de William Gardinier, 1815"},{"t":"v","n":"3","x":"Quien sigue la senda del vil pecador, Se enpara los siervos del Buen Salvador, Orar y velar es su anhelo mejor."},{"t":"c","x":"pera velando a tu Redentor, Jefe sea de todos el despertador; Vetrega en los brazos de un sueño traidor; Mas"}]},{"s":"Himnario congregacional","n":"159","t":"Jesús está buscando voluntarios hoy","p":"426","c":"Letra:    Vicente Mendoza; Música: Chales H. Gabriel","l":[{"t":"v","n":"1","x":"Jesús está buscando voluntarios hoy, Que a la ruda lucha luego quieran ir ¿Quién está disD.S. Cristo es nuestro puesto a escuchar su voz Siendo voluntario listo a jefe no hay por qué temer, ¿Quieres ser un voluntario de Jesús? ser, Otros ya se alistan hazlo tú; Letra: Vicente Mendoza"},{"t":"v","n":"2","x":"Nos cercan las tinieblas densas del error, Vamos sobre abismos hondos de maldad, Y para destruirlas llama el Salvador Muchos voluntarios que amen Música: Chales H. Gabriel"},{"t":"v","n":"3","x":"La lucha es contra el vicio, la pereza, el mal, Contra la ignorancia de la ley de Dios; Es una campaña que no tiene i gual ¿Quieres ir a ella de Je -"},{"t":"v","n":"4","x":"El triunfo significa que domine el bien, Que los hombres se amen, y que la verdad Reine en las conciencias, siendo su sos tén, Y ha de ser, si ayudas una"},{"t":"c","x":"com ba tir? la verdad. De Cristo voluntario Tú puedes sús en pos? realidad."}]},{"s":"Himnario congregacional","n":"160","t":"Jesús te necesita, cristiana juventud","p":"427","c":"","l":[{"t":"v","n":"1","x":"Jesús te necesita, Cristiana juventud, Tu fuerza solicita, tu celo y tu virtud; La frente, pues, levanta, y empuña con valor La enseña sacrosanta de más; Si a Él hoy todo ofreces, Con Cristo reinarás. Letra y Música: Vicente Mendoza Polanco"},{"t":"v","n":"2","x":"Es tiempo de que enciendas en fuego celestial Tu pecho, y luego emprendas la lucha sin igual Que libra a los humanos del vicio y la maldad Quitando de sus manos los"},{"t":"v","n":"3","x":"Quebranta las cadenas del mundo pecador, Redímelo de penas llevándolo al Señor; Anúnciale que Cristo letrajo libertad, Que todo fue provisto por"},{"t":"v","n":"4","x":"A noble lucha llama Jesús tu Salvador, Levántate y proclama los dones de su amor; Si siembra desalientos el malo con su voz No expreses tus lamentos, Que"},{"t":"c","x":"Cristo tu Señor. grillos de impiedad. A Cristo perteneces, Al mal no sirvas Dios en su bondad. va contigo Dios."}]},{"s":"Himnario congregacional","n":"161","t":"Se ha llegado el momento","p":"428–429","c":"","l":[{"t":"v","n":"1","x":"La hora decisiva Se ha llegado el momento, la hora es decisiva de hablar abiertamente de nuestro Salvador; no importa la amenaza de nuestros enemigos si Dios nos ha provisto de fuerza y de valor; inspiración divina son mártires que fieles ofrendaron sus vidas sin dar un paso aLetra y Música: Leonardo Flores Esparza, Arm. Francisco Javier Corona Vázquez. trás; nosotros con gran gozo envueltos en su sangre, llevaremos al sús, no temamos pues él es nuestra luz. Y si alguno en la lucha nos tocara quedar, otro con gran potencia tomará nuestro lugar."},{"t":"v","n":"2","x":"Esta es nuestra hora de fe y de esperanza, hablemosle al Cordero en ferviente oración, para que su potencia santa nos ilumine y nuestra amada patria sea libre de dolor, la hora ha sonado en nuestro movimiento, vayamos a la lucha sin dudas, sin temor. Pues Dios ha prometido entregar en nuestras manos a nuestra amada"},{"t":"v","n":"3","x":"La hora es decisiva, no puede detenerse la marcha poderosa del pueblo del Señor que lleva cual antorcha encendida en sus almas el Espíritu Santo que Dios depositó. No estorbes el camino, regresate al rebaño y así unidos todos habrá gozo sin par, al estrechar la mano del que nos ha comprado a gran precio de"},{"t":"c","x":"mundo consuelo dicha y paz. patria para su redención. Adelante soldados de Jesangre, Jesús nuestro Señor."}]},{"s":"Himnario congregacional","n":"162","t":"La senda ancha dejaré","p":"430","c":"","l":[{"t":"v","n":"1","x":"La senda ancha dejaré; yo quiero por la angosta andar; y muchos no sabrán por qué, mas voy a mi celeste hogar. gar; en gloria tengo mi mansión; no puede el mundo ser mi hogar. Letra y Música: H. C. Ball, Arr. J. N. Benson"},{"t":"v","n":"2","x":"Algunos quieren verme ir por el sendero de maldad; oír no puedo su llamar, pues voy a mi celeste hogar."},{"t":"v","n":"3","x":"Oh, ven conmigo pecador y sigue en pos del Salvador, ¿porqué no quieres tú buscar, la hermosa tierra más allá?"},{"t":"c","x":"No puede el mundo ser mi hogar, no puede el mundo ser mi ho -"}]},{"s":"Himnario congregacional","n":"163","t":"Levantate Cristiano","p":"431","c":"","l":[{"t":"v","n":"1","x":"Levántate cristiano, levántate y trabaja, no dejes que tu vida se pase en la inacción; el que en el ocio vive al Hacedor ultraja; no llena sus deberes ni cumple su misión. Letra y Música: H. Kingsbury"},{"t":"v","n":"2","x":"Si quieres que la vida te ofrezca mil en can tos, si quieres que la dicha te inspire paz y amor, trabaja tú por Cristo sin miedos ni quebrantos, y un cielo de venturas verás en tu rededor."},{"t":"v","n":"3","x":"Trabaja para el mundo, trabaja para el cielo, sembrando buenas obras, sembrando en profución. Virtud es el trabajo, alivio y fiel consuelo, y siempre en él se encuentra de Dios la bendición."},{"t":"v","n":"4","x":"Anuncia el evangelio glorioso, que es potencia, que al alma de consuelo, y paz, y santo amor. Que tus acciones hablen más alto que tu dicho, y así los hombres hallen de Dios la salvación."}]},{"s":"Himnario congregacional","n":"164","t":"¡Oh! Jóvenes, venid.","p":"432","c":"Letra:    Oporto M.P.; Música: Desconocido","l":[{"t":"v","n":"1","x":"¡Oh! jóvenes, venid, su brillante pabellón Cristo ha desplegado ante la nación, A todos en sus filas os quiere recibir, Y con él a la pelea os hará salir. Jóvenes, luchemos todos contra el mal; En Jesús llevamos nuestro General. Letra: Oporto M.P."},{"t":"v","n":"2","x":"¡Oh! jóvenes, venid, el Caudillo Salvador Quiere recibiros en su derredor; Con él a la batalla salid sin vacilar, Vamos pronto, compañeros, vamos a luchar. Música: Desconocido"},{"t":"v","n":"3","x":"Las armas invencibles del Jefe Guiador Son el Evangelio y su gran amor; Con ellas revestidos yllenos de poder, Compañeros, acudamos, vamos a vencer."},{"t":"v","n":"4","x":"Los fieros enemigos, engendros de Satán, Se hallan sostenidos por su capitán; ¡Oh! jóvenes, vosotros poneos sin temor A la diestra del Caudillo, nuestro Salvador."},{"t":"v","n":"5","x":"Quien venga a la pelea su voz escuchará; Cristo la victoria le concederá; Salgamos, compañeros, luchemos bien por él, Con Jesús conquistaremos inmortal laurel."},{"t":"c","x":"Vamos a Jesús, alistados sin temor, Vamos a la lid inflamados de valor,"}]},{"s":"Himnario congregacional","n":"165","t":"¡Oh, juventud cristiana ve adelante!","p":"433","c":"","l":[{"t":"v","n":"1","x":"¡Oh, juventud cristiana, ve adelante! luchando por salvar los pecadores, que un galardón eterno has de ganarte tome la corona que Cristo ha preparado para ti, que será para todos en la gloria, cuando la trompeta suene para ti. Letra y Música: Desconocido, Arm. Isaac García Contreras."},{"t":"v","n":"2","x":"Si la tribulación suele cansarte, si el enemigo cruel tus pasos vela, da una mirada al cielo y al instante"},{"t":"v","n":"3","x":"Unidos vamos todos al combate, guardados por la sangre de Jesús, que él fue desde el huerto hasta el cavario,"},{"t":"c","x":"y morar con el Señor de los señores. el Señor de los señores te consuela. No dejes que otro para lavar nuestros pecados en la cruz."}]},{"s":"Himnario congregacional","n":"166","t":"Placer verdadero es servir al Señor","p":"434–435","c":"","l":[{"t":"v","n":"1","x":"Placer verdadero es servir al Señor; no hay obra más noble, ni pa - - ga mejor. Servirle yo quiero, con fe y con amor; servir - - - le prometo desde hoy. Letra y Música: Frank C. Huston vir - - - le con fe! ¡Que pa - - - ga tan rica tendré! No importa que sufra, sufrió el por mí. Sirviendo a Jesús, soy feliz."},{"t":"v","n":"2","x":"Diré la verdad; le seré siempre fiel; no importa que todo lo pierda por él. Riquezas eternas en Cristo tendré. Desde hoy sólo a él serviré."},{"t":"v","n":"3","x":"El odio del mundo por él sufriré; pesada la carga sin du - - da será. Mas sé que su gracia no me ha de faltar. ¡A Cris - - - to hasta el fin serviré!"},{"t":"c","x":"¡Servir a Jesús! ¡Ser -"}]},{"s":"Himnario congregacional","n":"167","t":"Salid valientes batallones de Israel","p":"436–437","c":"","l":[{"t":"v","n":"1","x":"Salid valientes batallones de Israel cantad el triunfo y la victoria por la fe, Oh, juventud que tu simien te es tá en Jesús, eterna roca de los siglos firme es; a grandes voces pregonemos con fervor, el evangelio de justicia y santo amor, este mensaje por el mun do has de llevar; las almas gimen por el yugo de SaLetra y Música: Desconocido, Arm. Javier Corona Vázquez. char contra Satán, y valientes se apresuran los soldados sus espadas a empuñar. Y aunque sangre de los mártires nos cueste, derramada quedará. En los campos o trincheras, ya sellado, siempre el evangelio
