ión nos dará. Y si en medio de la lucha algu na de nosotras pudiera morir, la corona de vida en los cie los nuestro Dios con gozo nos dará."},{"t":"v","n":"2","x":"La vanguardia ejército de Cristo, marcha firme, llena de poder. Y su Es píritu Santo nos guía a pelear la batalla de la fe. Y obtendremos la victoria contra el mundo lleno de pecado y de maldad, con la fe puesta en nuestro Señor la victoria segura será."},{"t":"v","n":"3","x":"El ejércitovictorioso lucha siempre al lado de su Rey. Pues oimos la voz que llama a valientes a alegrarnos con la gloria del Señor. Y se escucha el estruendo en los montes, co mo de mucho pueblo a combatir, pues Jesús pasa revista a su ejército para ir a la balla a luchar."},{"t":"c","x":"No tememos seguir a Cristo Él su gran bendición nos dará. Lucha-"}]},{"s":"Himnario congregacional","n":"326","t":"Fraternidad de Varones Emanuel","p":"624–625","c":"","l":[{"t":"v","n":"1","x":"Fraternidad de varones, Unidos en CristoJesús, dispues - - - tos a luchar, Porque Cristo al frente va. Arrancando siempre almas De las garras de Satán; TriunLetra y Música: Desconocido, Arr. Emmanuel H. Cruz Gutiérrez far siempre es el lema Por que Cristo es el capitán. reste siempre saldrá Anun cian - - - do a to do hombre Que Cristo vino a salvar."},{"t":"v","n":"2","x":"Los varones del sureste dimos a Jesús. Para poder llevar Nuestra vida en santidad. Nuestro a nhelo es ser llenos Del Espíritú de Dios, Triunfar siempre podre tro re fugio es El Dios de Jacob."},{"t":"c","x":"Fra ternidad de \"Emanuel\", Que del su -"}]},{"s":"Himnario congregacional","n":"327","t":"Embajadores del gran Rey","p":"626–627","c":"","l":[{"t":"v","n":"1","x":"De la sangre de Cristo ha nacido una alianza llena de poder; esta alianza va siempre adelante llevando el mensaje del Rey, siempre del Rey. Esta alianza no teme al enemigo pues Jesús con ellos va; el nombre que lleva esta alianza: \"EmbajaLetra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez. Cristo por capitán; adelante, siempre adelante; en Cristo hay poder, siempre anunciando el evangelio de paz y salvación; ¡Oh! jóvenes, adelante, \"Embajadores del gran Rey\"."},{"t":"v","n":"2","x":"Oh, joven que en el mundo vives perdido sin Dios y sin fe, escucha su voz amorosa ven a él descansarás, descansarás. Él dio su sangre por salvarte allí en dura cruz; sigamos siempre sus pisadas \"Embaja -"},{"t":"v","n":"3","x":"Si Dios siempre es con nosotros contra nosotros ¿quién puede ser? revestidos de su potencia para a Satanás vencer, ¡lo venceré!. Confiando siempre en su promesa no lo dejaré; si siempre le seguimos fieles, una co -"},{"t":"c","x":"dores del gran Rey\". dores del gran Rey\". Adelante va esta alianza con rona nos dará."}]},{"s":"Himnario congregacional","n":"328","t":"En el fango y el error","p":"628–629","c":"Letra:    Francisco Sanchéz Muñiz/Pedro Ontiveros; Música: Francisco Sanchéz Muñiz/Navor. Zepeda, ICI","l":[{"t":"v","n":"1","x":"En el fango y el error, En la densa obscuridad, Una viva luz bri - - - lló, Luz potente, celestial; Las tinieblas disipó, Negro fango extinguió, Y pujante \"Nueva Raza\" Sin igual sur Letra: Francisco Sanchéz Muñiz/Pedro Ontiveros nal de Varones\" Humillados a tus pies; Queremos servirte En es píritu y verdad, Llenos nuestros corazones De Potencia Celestial."},{"t":"v","n":"2","x":"Por el rico manantial De la sangre de Jesús, Derramó como rau - - - dal Desde el ábol de la cruz, Con potencia ya nació Célica Fraternidad De varones \"Nueva Raza\" Que el Señor forMúsica: Francisco Sanchéz Muñiz/Navor. Zepeda, ICI"},{"t":"v","n":"3","x":"Al llenarnos ¡Oh Señor! De tu Santo Espíritu, Tu nos diste pleni - - - tud Y poder y gran virtud; Es por eso, mi Jesús, Que esta gran Fraternidad De varones hoy trabaja Diligente y"},{"t":"c","x":"mó. Señor Jesucristo He aquí la \"Fraternidad Naciofiel"}]},{"s":"Himnario congregacional","n":"329","t":"Es la vanguardia femenil de misiones","p":"630","c":"","l":[{"t":"v","n":"1","x":"Es la vanguardia femenil de la iglesia del Señor, que fue comprada con su amor, precio de sangre carmesí. Su redentor, Cristo Jesús, le dio un nuevo corazón, puso en su ser nueva canción y por tinieblas le dio luz. gamos a nuestro adalid; porque he aquí, el va delante de nosotras ya, adelante con valor. Letra y Música: Francisco Sánchez Muñiz. ICIAR"},{"t":"v","n":"2","x":"Para el Señor, bello pensil, es la vanguardia femenil, que hoy trabaja con fervor unida por un santo amor. \"En un Señor, en una fe, un sacramento bautismal, una esperanza sin igual, un Dios y Padre celestial."},{"t":"c","x":"Hermanas venid, con fervor marchemos, con gozo si -"}]},{"s":"Himnario congregacional","n":"330","t":"Es la Vanguardia Femenil que marcha","p":"631","c":"","l":[{"t":"v","n":"1","x":"Es la Vanguardia Femenil que marcha con paso firme inflamada de valor. Que sin cesar llena de fe trabaja en tu siasta en la obra del Señor ¡Quiero servirte mi Señor bendito, servirte con todo mi amor! ¡\"Porque a pesar de todo, te amo con toda el alma mi Señor\"! sar de todo, te amo; con toda el alma mi Señor\"! Letra y Música: Francisco Sánchez Muñíz"},{"t":"v","n":"2","x":"Aquí me tienes en tu altar postrada con reverencia a tus plantas mi Señor. Para buscar tu rostro humillada y la gloria inefable de tu amor. ¡Señor Jesús de corazón te ofrezco mi adoración, mi fe, mi amor! ¡\"Porque a pesar de todo, te amo con toda el alma mi Señor\"!"},{"t":"c","x":"Como dijo el apostol San Pedro, hoy exclamo con tierno fervor: ¡\"Que a pe -"}]},{"s":"Himnario congregacional","n":"331","t":"Buscad a nuestro Dios","p":"632","c":"","l":[{"t":"v","n":"1","x":"Buscad a nuestro Dios en espíritu y verdad; en toda integridad su palabra anunciad. Es lema santo y fiel de nuestra alianza juvenil, servir a nuestro Dios en espíritu y verdad. migo desde el principio al fin. Por eso con valor anunciamos su verdad. Letra y Música: Francisco Sánchez Muñiz, ICIAR."},{"t":"v","n":"2","x":"Soldados de Jesús es ya tiempo de luchar, y llenos de su luz, las tinieblas disipar. Marchemos juventud en pos de nuestro capitán; con Cristo y su virtud venceremos a Satán."},{"t":"v","n":"3","x":"Si lucho con valor en espíritu y verdad, sembrando con amor, con gozo y fidelidad, con Cristo reinaré allá en la patria celestial, con Cristo viviré por toda la eternidad."},{"t":"c","x":"Escuchad la vozde Cristo: \"testimonio habéis de dar, porque estáis siempre con-"}]},{"s":"Himnario congregacional","n":"332","t":"Fraternidad, fraternidad","p":"633","c":"","l":[{"t":"v","n":"1","x":"Fraternidad, Fraternidad es la orden que Cristo da, Fraternidad, Fraternidad es la oración, en humildad. En el amor que mi Jesús en el Calvario nos mostró; Y convivir en santipos de Jesus, hasta alcanzar la gran virtud de ser llenos de su plenitud Letra y Música: Julio Nuñez, ICIAR,"},{"t":"v","n":"2","x":"Fraternidad con el Señor para vivir en comunión, La humanidad podra mirar que en realidad El nos salvó. Viviendo así en fraternidad, las almas le aceptarán; Y llegaremos al fiArr. Emmanuel H. Cruz Gutiérrez."},{"t":"v","n":"3","x":"Fraternidad al predicar el evangelio del amor, Cual Pablo y Silas anunciar la gran promesa del Senor, Que si tu crees en Jesus, tu hogar tambien salvo sera; Y andando en sombras o en"},{"t":"v","n":"4","x":"Vivamos, si, en fraternidad, que Cristo pronto viene ya; Muy pronto se escuchará de la trompeta el sonar. Un grande gozo invadirá a los que con el se iran, Y mientras viene en gloria,"},{"t":"c","x":"dad, siempre buscando la fraternidad. Adelante varones, en nal, nuestra meta en el cielo será. luz, con el poder de su amor nos guiara. ya buscamos siempre la fraternidad."}]},{"s":"Himnario congregacional","n":"333","t":"Fraternidad de Varones Felipe Sánchez Muñiz","p":"634–635","c":"","l":[{"t":"v","n":"1","x":"Esta fraternidad unida testifica de las bondades que nos da Cristo Jesús, en el cal vario dió su sangre y su vida para salvar y reno varal pecador, en Jesucristo el Caudillo de los siglos hemos hallado paz, amor, liberación, mar che mos pres tos com par tien do el men sa je que en Jesucristo só lo es tá la sal va ción. Letra y Música: Noé Hernández Serrano, ICIAR, Arr. Isaí Torres Rivero haces al va rón que se acerca a ti, con gratitud y humildad trabajaremos dispuestos al servicio de nuestro Señor, triufando siempre y venciendo viviremos dando la honra y gloria al Creador."},{"t":"v","n":"2","x":"Nuestra familia cada día llevaremos en muy ferviente y perenne oración, con nues tros hijos y esposa estaremos en las moradas de la celestial mansión, promesas fieles hay para los vencedores que nunca cejan y fluctuan en la fe, sobre el pecado y la carne victoriosos al enemigo tú pondrás bajo tu pie."},{"t":"c","x":"Más precioso que el oro, oro de Ofir"}]},{"s":"Himnario congregacional","n":"334","t":"Fraternidad de Varones \"Guillermo Félix Cortés Ortíz\"","p":"636","c":"","l":[{"t":"v","n":"1","x":"Al Dios y Padre Celes tial nos hacercamos hoy, postrados para dar loor con nuestra adoración. Cantamos hoy con gran fervor a Nuestro Salvador, pues en su amor y su perdón nos dio la salvación. Cristo a Tamaulipas ganaré, pues trabajar por Cristo es mi deber. Letra y Música: Moisés Hernández Cruz"},{"t":"v","n":"2","x":"Varones esforzados, ser un testimonio fiel, de su poder y así vencer al enemigo cruel. Y si al pelear herido soy en esta lucha cruel, como soldado siempre fiel la lucha ganaré. que me cueste lágrimas lo sé, que un día a Jesucristo yo veré."},{"t":"v","n":"3","x":"Que con amor yo pueda hablar que sólo en Ti hay perdón Al pobre y triste pecador que vive en su dolor. Pues soy testigo del amor que de la cruz manó, la redención a mi llegó por gracia, buen Jesús."},{"t":"c","x":"Est. 1 y 2 Mi vida hoy la traigo ante tus pies para que tu la llenes de poder, Con Est. 3 Las buenas nuevas hoy anunciaré, Con gozo la semilla sembraré, Y aun-"}]},{"s":"Himnario congregacional","n":"335","t":"A trabajar ¡Oh! cristianos","p":"637","c":"","l":[{"t":"v","n":"1","x":"A trabajar, ¡Oh c function search(){const v=N(q.value.trim()),f=fs.value;if(!v){f?sec(f):home();return}
let r=D.filter(h=>!f||h.s==f);

else{const w=v.split(/\s+/);r=r.filter(h=>w.every(x=>h.k.includes(x)))}
m.innerHTML=`<p class="sn">${r.length} resultado(s)</p>`+r.slice(0,400).map(item).join('')}
