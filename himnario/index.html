Coronadle, santos todos; Coronad al Rey de reyes, Coronadle, santos todos; Coronad al Salvador.\nEntronadle allá en los cielos; En la refulgente luz. Coronadle, santos todos; Coronad al Rey de reyes, Coronadle, santos todos; Coronad al Salvador.\nHoy los ángeles y santos lo proclaman su Señor. Coronadle, santos todos; Coronad al Rey de reyes, Coronadle, santos todos; Coronad al Salvador.\nVictorioso reina el Cristo. ¡Adorad a Emmanuel! Coronadle, santos todos; Coronad al Rey de reyes, Coronadle, santos todos; Coronad al Salvador."}],"w":1},{"s":"Himnario congregacional","n":"89","t":"Yo tengo un Rey","p":"344","c":"Letra y Música: Autor desconocido, Melodía Puertorriqueña, Arr. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Yo tengo un Rey, mi Salvador, y por él yo tengo vida, Es promesa fiel. Yo tengo un Rey, mi Salvador, y por él yo tengo vida, Es promesa fiel."},{"t":"v","n":"2","x":"Oh mira el sol al decaer, nunca esperes te sorprenda, sin el bien hacer. Oh mira el sol al decaer, nunca esperes te sorprenda, sin el bien hacer"},{"t":"v","n":"3","x":"Si enfermo estoy, a él yo voy, pues mi Rey es compasivo, y mitiga mi dolor Si enfermo estoy, a él yo voy, pues mi Rey es compasivo y mi ti gami dolor"},{"t":"v","n":"4","x":"Cuando él se fue, nos prometió investirnos de poder y potencia celestial Cuando él se fue, nos prometió investirnos de poder y potencia celestial"},{"t":"v","n":"5","x":"Si tú quieres ver a Jesús mi Rey sólo entregate en sus brazos Él te quiere so correr Si tú quieres ver a Jesús mi Rey sólo entregate en sus brazos Él te quiere so correr"},{"t":"v","n":"6","x":"Él volverá, escrito está con los ángeles de gloria nos llevará. Él volverá, escrito está con los ángeles de gloria nos llevará"},{"t":"c","x":"Y espero no ofender jamás a mi Rey. Y espero no ofender, no, no. Y espero no ofender, no, no Y esperono ofender jamás a mi Rey."}],"w":1},{"s":"Himnario congregacional","n":"90","t":"A solas al huerto yo voy","p":"345","c":"Letra: C. Austin Miles, Trad. Vicente Mendoza Polanco (1875-1955); Música: C. Austin Miles","l":[{"t":"v","n":"1","x":"A solas al huerto yo voy cuando duerme aún la floresta, y en quie"},{"t":"v","n":"2","x":"Tan dulce es la voz del Señor que las aves guardan silencio, y tan"},{"t":"v","n":"3","x":"Con Él encantado yo estoy aunque en torno lleguen las sombras, mas me or"},{"t":"c","x":"tud y paz con Jesús estoy, oyendo absorto allí su voz. Él conmigo está, puedo oír su voz y que suyo dice seré; y el encanto que hallo con Él allí con nadie tener podré.\nsólo se oye esa voz de amor, que inmensa paz al alma da. Él conmigo está, puedo oír su voz y que suyo dice seré; y el encanto que hallo con Él allí con nadie tener podré.\ndena ir a escuchar yo voy, su voy doquier la angustia esté. Él conmigo está, puedo oír su voz y que suyo dice seré; y el encanto que hallo con Él allí con nadie tener podré."}],"w":1},{"s":"Himnario congregacional","n":"91","t":"Al cansado peregrino","p":"346","c":"Letra: Nathaniel Niles; Música: Philip P. Bliss","l":[{"t":"v","n":"1","x":"Al cansado peregrino Que en el pecho siente fe, El señor ha prometido: ré\". \"Con mi brazo, con mi brazo, Con mi brazo te guía El Señor ha prometido: \"Con mi brazo te guiaré\"."},{"t":"v","n":"2","x":"Si has perdido la esperanza Como la sombra de lo que fue, Oye atento su promesa: \"Con mi brazo te guiaré\". \"Con mi brazo, con mi brazo, Con mi brazo te guiaré\"; Oye atento su promesa: \"Con mi brazo te guiaré\"."},{"t":"v","n":"3","x":"Cuando la muerte a tu estancia Con afán golpeando esté, Ten consuelo en las palabras: ré\". \"Con mi brazo, con mi brazo, Con mi brazo te guía Ten consuelo en las palabras: \"Con mi brazo te guiaré\"."}],"w":1},{"s":"Himnario congregacional","n":"91b","t":"Es todo para mí","p":"347","c":"Letra y Música: Ralph Carmichael, 1964, Tr. Daniela. Velázquez","l":[{"t":"v","n":"1","x":"En el firmamento veo a Dios, En el viento él habla en majestad, Aunque reina sobre tierra y mar, ¿Que es eso para mí?"},{"t":"v","n":"2","x":"Yo creeré en su natividad Que en la historia es una realidad Aunque él vino para liberar,"},{"t":"c","x":"¿Que es eso para mí Hasta que por fe le conocí, Y su gran poder en mí sentí No sabía que era un Dios de amor que vino desde allá para salvarme a mí Yo ahora pertenezco a él, El me ayuda con su gran poder, Me conduce siempre a la verdad, Es todo para mí."}],"w":1},{"s":"Himnario congregacional","n":"92","t":"¿Cómo podré estar triste?","p":"348–349","c":"Letra: Cirilla D. Martin, Trad. Vicente Mendoza Polanco (1875-1955); Música: Charles H. Gabriel","l":[{"t":"v","n":"1","x":"¿Cómo podré estar triste? ¿Cómo entre sombras ir? ¿Cómo sentirme solo Y en el dolor vivir? Si Cristo es mi consuelo, Mi amigo siempre fiel, Si aún las aves tienen Seguro asilo en Él, Si a"},{"t":"v","n":"2","x":"\"Nunca te desalientes\", Oigo al Señor decir, Y en su palabra fiado Hago al dolor huir, A Cristo paso a paso Yo sigo sin cesar, Y todas sus bondades Me da sin limitar, Y"},{"t":"v","n":"3","x":"Siempre que soy tentado O que en la sombra estoy, Más cerca de Él camino Y protegido voy; Si en mí la fe desmaya, Y caigo en la ansiedad, ¡Tan sólo Él me levanta, Me da seguridad! ¡Tan"},{"t":"c","x":"ún las aves tienen Seguro asilo en Él. Feliz cantando alegre, Yo vivo siempre aquí; Si Él cuida de las aves, Cuidará también de mí!\ntodas sus bondades Me da sin limitar. Alegre, Aquí; aves, Cuidará también de mí!\nsólo Él me levanta, Me da seguridad! aves, Cuidará también de mí!"}],"w":1},{"s":"Himnario congregacional","n":"93","t":"Con gratitud vengo hacia Ti","p":"350","c":"Letra: Gamaliel Soriano, Pastor en Acapulco; Música: Francisco Sánchez Muñíz, ICIAR","l":[{"t":"v","n":"1","x":"Con gratitud vengo hacia Ti, a darte gracias ¡Oh Señor! Pues tus promesas fieles son, para salvar al pecador."},{"t":"v","n":"2","x":"Tu has dicho siempre buen Jesús: \"Ven hoy a Mi y descansarás\" perdido y triste como estás, perdón y gracia obtendrás."},{"t":"v","n":"3","x":"Jamás podré yo olvidar, la conmoción del corazón, de tanto hombre pecador, que tú salvaste con amor."},{"t":"v","n":"4","x":"Enfermos vimos levantar, a los perdidos confesar, que tu poder oh buen Jesús, puede dar vida y plena luz."},{"t":"c","x":"Gozo sin fin hay en aquel, que tu palabra al escuchar, rinde su vida ante tu altar, para seguirte siempre fiel, como la chispa que encendió, la zarza humeante ante Moisés, así arde siempre ante tus pies el corazón que salvo es."}]},{"s":"Himnario congregacional","n":"94","t":"Cristo el Señor es para mí","p":"351","c":"Letra y Música: Will L. Thompson, Trad. Vicente Mendoza Polanco (1875-1955)","l":[{"t":"v","n":"1","x":"Cristo el Señor es para mí, consuelo dicha y paz; en Él tan sólo encuentro yo, descanso, a mor, solaz. Si en mis tristezas voy a Él, hallo un amigo siempre fiel, hallo un amigo siempre fiel en Jesús."},{"t":"v","n":"2","x":"En mis conflictos con el mal, no hay otro cual Jesús; que pueda darme protección, sostén, poder y luz. Yendo conmigo el Salvador, ya nada puede el tentador, ya nada puede el tentador contra mí."},{"t":"v","n":"3","x":"Vida de paz, de gozo y luz, encuentro en mi Señor; herencia eterna que me da, su incomparable amor. Nada en el mundo igualará, a lo que en Cristo encontrará, a lo que en Cristo encontrará el mortal."},{"t":"v","n":"4","x":"Gloria sin fin tributaré, gozoso a mi Jesús; quien vida tal me aseguró, muriendo en cruenta cruz. Y por los siglos mi canción, ensalzará su salvación, ensalzará su salvación sin igual."}]},{"s":"Himnario congregacional","n":"95","t":"Cual mirra fragante que exhala su olor","p":"352","c":"Letra y Música: Edward L. White","l":[{"t":"v","n":"1","x":"Cual mirra fragante que exhala su olor, y ricos perfumes esparce en redor, tu nombre oh Amado a mi corazón, lo llena de gozo, transpórtalo a Sión."},{"t":"v","n":"2","x":"Cual voz amigable que al triste viador,* en bosque perdido le inspira valor, tu nombre me anima me hace saber, que ofreces piadoso, rescate a mi ser."},{"t":"v","n":"3","x":"Cual luz que brillando del alto fanal, al nauta en la noche señala el canal, tu nombre esparciendo benéfica luz, al cielo me lleva, bendito Jesús."},{"t":"v","n":"4","x":"Cual roca muy firme que adentro del mar, al náufrago brinda su seguridad, tu nombre oh Amado excelsa bondad, ofrece refugio, a la humanidad."},{"t":"c","x":"¡Aleluya, aleluya al Cordero de Dios! ¡Aleluya al Amado al bendito Jesús!"}],"w":1},{"s":"Himnario congregacional","n":"96","t":"Del santo amor de Cristo","p":"353","c":"Letra y Música: Lelia N. Morris, Trad. Vicente Mendoza Polanco (1875-1955)","l":[{"t":"v","n":"1","x":"Del santo amor de Cristo que no tendrá gual, de su divina gracia sublime y eternal, de su misericordia inmensa como el mar, y cual los cielos alta, con gozo he de cantar."},{"t":"v","n":"2","x":"Del santo amor de Cristo que no tendrá su i Cuando Él vivió en el mundo la gente le siguió, y todas sus angustias en Él depositó, entonces bondadoso su a vida que centellea en la cruz, y dio a las almas todas la mor brotó en raudal, incontenible, inmenso sanando todo mal. gloria de su ser, al impartir su gracia su Espíritu y poder."},{"t":"v","n":"3","x":"Él puso en las pupilas del ciego nueva luz, la eterna luz de roso la senda del ideal, y el paso de los años lo hará más dulce y más, precioso al dar al alma su incomparable paz."},{"t":"v","n":"4","x":"Su amor por las edades del mundo es el fanal, que marca esplendo"},{"t":"c","x":"El amor de mi Señor, grande y dulce es más y más, rico e inefable, nada es comparable, al amor de mi Jesús."}],"w":1},{"s":"Himnario congregacional","n":"97","t":"El mundo perdido en pecado se vió","p":"354","c":"Letra y Música: Philip P. Bliss, Trad. Henry C. Thomson","l":[{"t":"v","n":"1","x":"El mundo perdido en pecado se vio, Jesús es la luz del mundo; Mas"},{"t":"v","n":"2","x":"Vivir en Él vuelve la noche en día, Jesús es la luz del mundo; An"},{"t":"v","n":"3","x":"¡Oh ciegos y presos de lóbrego error! Jesús es la luz del mundo; El"},{"t":"v","n":"4","x":"Ni soles ni lunas el cielo tendrá, Jesús es la luz del mundo; La"},{"t":"c","x":"en las tinieblas la gloria brilló, Jesús es la luz del mundo. ¡Ven a la luz! no quieras perder Gozo perfecto al amanecer Yo ciego fui, mas ya puedo ver, ¡Jesús es la luz del mundo!\ndemos en luz y sigamos al Guía, Jesús es la luz del mundo. ¡Ven a la luz! no quieras perder Gozo perfecto al amanecer Yo ciego fui, mas ya puedo ver, ¡Jesús es la luz del mundo!\nmanda lavaros y ver su fulgor, Jesús es la luz del mundo. ¡Ven a la luz! no quieras perder Gozo perfecto al amanecer Yo ciego fui, mas ya puedo ver, ¡Jesús es la luz del mundo!\nluz de su rostro lo iluminará, Jesús es la luz del mundo. ¡Ven a la luz! no quieras perder Gozo perfecto al amanecer Yo ciego fui, mas ya puedo ver, ¡Jesús es la luz del mundo!"}],"w":1},{"s":"Himnario congregacional","n":"98","t":"En Cristo feliz es mi alma","p":"355","c":"Letra y Música: Edwin O Excell. Trad. Epigmenio Velasco","l":[{"t":"v","n":"1","x":"En Cristo feliz es mi alma, Precioso es su celeste don; Su voz me devuelve la calma. Su faz me anticipa el perdón."},{"t":"v","n":"2","x":"Mucho antes que yo, él buscóme, Me atrajo a su amado redil; De amor en sus brazos llevóme Do hay dicha y encantos a mil"},{"t":"v","n":"3","x":"Su amor paternal me circunda, Su gracia conforta mi ser; Su Espíritu Santo me inunda De un noble y excelso poder."},{"t":"v","n":"4","x":"A Él seré un día semejante Dejando este cuerpo mortal; Y mientras, discípulo amante Ser quiero hasta el día final."},{"t":"c","x":"Yo soy feliz en Él; Yo soy feliz en Él; Él gozo y la paz inundan mi ser, Pues yo soy feliz en Él.\nYo Yo soy feliz, Yo Yo soy feliz gozo y la paz inundan mi ser, Pues yo soy feliz en Él."}],"w":1},{"s":"Himnario congregacional","n":"99","t":"En Jesucristo, mártir de paz","p":"356","c":"Letra: Fanny J. Crosby, Trad. E.A. Monfort Díaz; Música: Phoebe P. Knapp","l":[{"t":"v","n":"1","x":"En Jesucristo, mártir de paz, En horas negras de tempes"},{"t":"v","n":"2","x":"En los peligros, en el dolor, A cada paso su protec"},{"t":"v","n":"3","x":"Cuando en la lucha falta la fe, Y el alma siente desfalle"},{"t":"c","x":"tad Hallan las almas dulce solaz, Grato consuelo, felicidad. Gloria cantemos al Redentor, Que por nosotros quiso morir; La santa gracia del Salvador, dirija siempre nuestro vivir.\nción Calma le infunde, santo vigor, Nuevos alientos al corazón. Gloria cantemos al Redentor, Que por nosotros quiso morir; La santa gracia del Salvador, dirija siempre nuestro vivir.\ncer, Cristo nos dice: \"¡Yo os colmaré De rica gracia, santo poder!\" Gloria cantemos al Redentor, Que por nosotros quiso morir; La santa gracia del Salvador, dirija siempre nuestro vivir."}],"w":1},{"s":"Himnario congregacional","n":"99b","t":"Te vengo a decir","p":"357","c":"Letra y Música: Juan Isais, Arr. Bill Fasig","l":[{"t":"v","x":"Te vengo a decir, te vengo a decir, oh mi Salvador que yo te amo a ti, que yo te amo ti con el corazón. Te vengo a decir, te vengo a decir to da la verdad, que te amo Señor, te adoro Señor con el corazón. Yo quiero cantar, yo quiero cantar de gozo y de paz. Yo quiero llorar, yo quiero llorar de felicidad."}]},{"s":"Himnario congregacional","n":"100","t":"Es Jesucristo mi todo","p":"358–359","c":"Letra: S. D. Athans; Música: George Bennard","l":[{"t":"v","n":"1","x":"Es Jesucristo mi todo, grato es cantar su loor, ¡Oh cuán sublime infinito es su divino amor! Cuando me vio errabundo, cual hijo pródigo, Me levantó bondadoso, a su redil me llevó."},{"t":"v","n":"2","x":"Cristo es el lirio del valle, la rosa es de sarón, Cristo es el astro esplendente la roca de salvación; Él es la fuente de vida, y gozo eternal, Él satisface mi alma con el maná celestial."},{"t":"v","n":"3","x":"Cristo nació en un pesebre, la amarga copa bebió, Cual inocente cordero en el calvario murió; Resucitó de la tumba y al cielo ascendió, Mas pronto viene en gloria, esta promesa nos dio."},{"t":"c","x":"Cristo, Cristo, tu eres mi salvador, Cristo, Cristo, tuyo seré, Señor; Te seguiré donde quiera, si tú guiando vas, Y al terminar mi carrera, en gloria veré tu faz.\nCristo tú eres mi Salvador, sí mi Salvador Tuyo seré tan sólo Señor, Tuyo seré Te seguiré donde quiera, si tú guiando vas, Y al terminar mi carrera, en gloria veré tu faz."}],"w":1},{"s":"Himnario congregacional","n":"101","t":"Fuente de la vida eterna","p":"360","c":"Letra: Robert Robinson, 1758; Tr. Thomas Martin Westrup","l":[{"t":"v","n":"1","x":"Fuente de la vida eterna Y de toda bendición, Ensalzar tu gracia tierna Debe todo corazón; Tu piedad inagotable Abundante en perdonar, único ser adorable, Gloria a Ti debemos dar."},{"t":"v","n":"2","x":"De los cánticos celestes Te quisiéramos cantar Entonados por las huestes Que lograste rescatar; Almas son que redimiste Porque les tuviste amor, De ellas te compadeciste Con tiernísimo favor."},{"t":"v","n":"3","x":"Toma nuestros corazones, Llénalos de tu verdad, De tu Espíritu los dones Y de toda santidad; Guíanos en la obediencia, Humildad, amor y fe; Nos ampare tu clemencia, Salvador, propicio sé."}]},{"s":"Himnario congregacional","n":"102","t":"Fuente de maravilloso amor","p":"360–361","c":"Música: Melodía americana, publ. por John Wyeth, 1813; Letra y Música: Francisco Sánchez Muñiz, 20/05/1955, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Fuente de maravilloso a mor Para el alma eres mi Jesús, Porque siendo aún tan pecador Por mi moriste en cruenta cruz; Me llenaste de tu plenitud Con tu presencia celestial, Cuan maravilloso manantial De santo amor eres, Señor Jesús."},{"t":"v","n":"2","x":"¡Oh! maravilloso mi Jesús, Que los cielos más sublime es Al llenar de refulgente luz Mi corazón, todo mi ser; A tu nombre gloria, Oh Señor, De eternidad a eternidad; Desde donde sale el sol hasta Donde se pone, Tú eres Dios, mi Dios."},{"t":"c","x":"¡Oh! que gloria siento en mi, Alegría celestial, Gloria sin fin, maravillosa, De gozo y paz eternal; Hermosura sin igual Hay en ti Señor, Rico y limpio manantial Es tu divino amor."}],"w":1},{"s":"Himnario congregacional","n":"103","t":"¿Has oído la historia de Cristo?","p":"362","c":"Letra: Vicente Mendoza; Música: Fred H. Byshe","l":[{"t":"v","n":"1","x":"¿Has oído la historia de Cristo, Dulce historia de gracia y de amor? Cuando débil y pobre y caído, Redimido me vi del dolor?"},{"t":"v","n":"2","x":"¿Has oído que dijo a las gentes: \"Los cansados venid hasta Mí\"? Vine a él y sentí que al instante De su amor el objeto yo fui."},{"t":"v","n":"3","x":"¿Has oído de aquellos que ciegos, A sus ojos El dio les la luz? Yo también cuando estaba en las sombras, A la luz me llevó mi Jesús."},{"t":"v","n":"4","x":"¿Has oído del mar tempestuoso Que el Señor con su voz aquietó? Tú sabrás que las rudas tormentas De mi vida, el Señor ya calmó."},{"t":"c","x":"Su inmenso amor, yo cierto estoy, Jamás su igual tener podrá; A su fulgor en la vida voy, Y el cielo así en mi alma va."}]},{"s":"Himnario congregacional","n":"104","t":"¿Has tratado de llevar tu carga?","p":"363","c":"Letra: Vicente Mendoza; Música: C. Austin Miles","l":[{"t":"v","n":"1","x":"¿Has tratado de llevar tu carga Solo tú, solo solo tú,"},{"t":"v","n":"2","x":"Nunca olvides que al calvario solo Fue Jesús, fue Je"},{"t":"v","n":"3","x":"Sólo en Cristo protección y ayuda Hallarás, halla"},{"t":"v","n":"4","x":"¿Has tratado de llevar tu carga Solo tú, Solo tú,"},{"t":"c","x":"tú; No sabiendo que tendrás ayuda Si acudieres al Señor Jesús? Si tengo cargas que solo debo llevar; Paciente las alzo y acudo a mi Señor; yuda siempre mi Señor me presta con amor.\nsús; Para darte salvación y vida, Cuando solo sucumbió en la cruz. Si tengo cruces que nadie puede cargar. Su acudo a mi Señor; yuda siempre mi Señor me presta con amor.\nrás; Lleva siempre a Él tus cargas todas, Que a ninguno rechazó jamás. cudo a mi Señor; yuda siempre mi Señor me presta con amor."}],"w":1},{"s":"Himnario congregacional","n":"105","t":"Jesús es precioso, mi buen Salvador","p":"364–365","c":"Letra: H. C. Ball; Música: Charles H. Gabriel","l":[{"t":"v","n":"1","x":"Jesús es precioso mi buen Salvador, Por siempre le alabo por su gran poder; Si débil me encuentro su fuerza me da, Él"},{"t":"v","n":"2","x":"Y cuando en pecado muy triste me vi, Llamando a las puertas de mi corazón Me dijo: \"Tu alma yo quiero salvar\"; Él"},{"t":"v","n":"3","x":"Mas ya por su gracia la luz puedo ver; Quitó mi tristeza, mi llanto enjugó; Por fe yo contemplo mi Eterno hogar, Él"},{"t":"v","n":"4","x":"Jesús es precioso mi buen Redentor, Me gozo en su luz que en mi senda brilló; Yo sé que glorioso por mí viene aquí, Él"},{"t":"c","x":"es mi precioso Jesús. Precioso es Jesús, mi Jesús; Precioso es Jesús, mi Jesús; Mi gloria será su rostro al mirar, El es mi precioso Jesús."}],"w":1},{"s":"Himnario congregacional","n":"106","t":"Maestro, se encrespan las aguas","p":"366–367","c":"Letra: Mary A. Baker, 1874, Trad. Vicente Mendoza; Música: Horatio R. Palmer, 1874","l":[{"t":"v","n":"1","x":"Maestro, se encrespan las aguas Y ruge la tempestad, Los grandes abismos del cielo, Se cubren de oscuridad. ¿No ves que aquí perecemos? ¿Puedes dormir así, Cuando el mar agitado nos abre Profundo sepulcro aquí? Los vientos, las ondas oirán tu voz, \"¡Sea la paz!\""},{"t":"v","n":"2","x":"Maestro, mi ser angustiado Te busca con ansiedad; De mi alma en lo más escondido Se libra cruel tempestad, Pasa el pecado a torrentes Sobre mi frágil ser, Y perezco, perezco ¡Maestro! ¡Oh, quiéreme socorrer! \"¡Sea la paz, sea la paz!\""},{"t":"v","n":"3","x":"Maestro, pasó la tormenta, Los vientos no rugen ya, Y sobre el cristal de las aguas El sol resplandecerá, Maestro prolonga esta calma, No me abandones más; Cruzaré los abismos contigo Gozando bendita paz."},{"t":"c","x":"Calmas las iras del negro mar, Las luchas del alma las haces cesar, Y así la barquilla do va el Señor Hundirse no puede en el mar traidor; Doquier se cumple tu voluntad, ¡Sea la paz! ¡Sea la paz! Tu voz resuene en la inmensidad ¡Sea la paz!"}],"w":1},{"s":"Himnario congregacional","n":"107","t":"Me guía Él, con cuánto amor","p":"368","c":"Letra: Joseph Henry Gilmore, Trad. Epigmenio Velasco; Música: William B. Bradbury","l":[{"t":"v","n":"1","x":"Me guía Él, con cuánto amor Me guía siempre mi Señor, Al ver mi esfuerzo en serle fiel, Con cuánto amor me guía Él."},{"t":"v","n":"2","x":"En el abismo del dolor, O donde brille el sol mejor, En dulce paz o en lucha cruel, Con gran bondad me guía Él."},{"t":"v","n":"3","x":"Tu mano quiero yo tomar Jesús, y nunca vacilar, Pues sólo a quien te sigue fiel Se oyó decir: me guía Él."},{"t":"v","n":"4","x":"Y mi carrera al terminar Y así mi triunfo al realizar, No habrá ni dudas ni temor, Pues me guiará mi buen Pastor."},{"t":"c","x":"Me guía Él, me guía´ Él, Con cuánto amor me guía Él; No abrigo dudas ni temor, Pues me conduce el Buen Pastor."}]},{"s":"Himnario congregacional","n":"108","t":"¡Oh cuán dulce es fiar en Cristo!","p":"369","c":"Letra y Música: Louisa M. Stead, 1882, Trad. Vicente Mendoza","l":[{"t":"v","n":"1","x":"¡Oh cuán dulce es fiar en Cristo, y entregarse solo a Él; esperar en sus promesas, y en sus sendas serle fiel."},{"t":"v","n":"2","x":"Es muy dulce fiar en Cristo, y cumplir su voluntad; no dudando su palabra, que es la luz y la verdad."},{"t":"v","n":"3","x":"Siempre es grato fiar en Cristo, cuando busca el corazón, los tesoros celes tiales, de la paz y del perdón."},{"t":"v","n":"4","x":"Siempre en Ti confiar yo quiero, mi precioso Salvador, en la vida y en la muerte, protección me dé tu amor."},{"t":"c","x":"Jesucristo, Jesucristo, ya tu amor probaste en mí; Jesucristo, Jesucristo, siempre quiero fiar en Ti."}],"w":1},{"s":"Himnario congregacional","n":"109","t":"Que bello es estar en los brazos de Jesús","p":"370","c":"Letra y Música: Pedro Osorno, Himno de la convención de 1943, ICIAR, Arr. Edgar Obed Pineda Fierro","l":[{"t":"v","n":"1","x":"Que bello es estar en los brazos de Jesús, que hermoso pasar de tinieblas a la luz, y amar siempre amar al que nos dio la vida y salud, y el corazón rebosar de inmensa gratitud. Llena Jesús mi corazón, llénalo más y más Señor, ya que me"},{"t":"v","n":"2","x":"Hundido en el mal mucho tiempo yo viví, tu amor sin igual me sacó del fango vil, y al recordar que lo debo todo a Ti, me dan ganas de llorar de gratitud sin fin."},{"t":"v","n":"3","x":"Que bello es andar en las sendas de Jesús, que hermoso es seguir los caminos del Señor, mi anhelo mejor es andar por siempre en su luz, haciendo su voluntad con gozo y amor."},{"t":"c","x":"diste tu perdón, llénalo de tu santo amor."}],"w":1},{"s":"Himnario congregacional","n":"110","t":"¡Qué feliz es la vida a los pies de Jesús!","p":"371","c":"Letra y Música: Leonardo Flores, ICIAR, Arm. Edgar Obed Pineda Fierro","l":[{"t":"v","n":"1","x":"¡Qué feliz es la vida a los pies de Jesús! do encontramos la dicha y solaz, hoy mi vida entera quiero consagrar, a servir a Jesús nada más."},{"t":"v","n":"2","x":"Si en tu vida el pecado heridas dejó, que jamás has podido curar, hoy es tiempo oportuno en que mi Salvador, de tus penas te hará descansar. Las promesas de Cristo jamás faltarán, y nos"},{"t":"v","n":"3","x":"¡Qué precioso es oír esa voz de Jesús! que nos habla aquí al corazón, y sentir su presencia sublime de paz, que nos llama a su dulce mansión."},{"t":"c","x":"ha prometido llevarnos con Él, Solo resta seguir sus caminos de paz, y guardar hasta el fin nuestra fe."}],"w":1},{"s":"Himnario congregacional","n":"111","t":"Quiero que habléis de aquel grande amor","p":"372","c":"Letra y Música: J. M. Black, Trad. Vicente Mendoza","l":[{"t":"v","n":"1","x":"Quiero que habléis de aquel grande amor Que en el calvario Dios nos mostró; Quiero que habléis del buen Salvador; Habladme más de Cristo."},{"t":"v","n":"2","x":"Cuando me asalte la tentación Y que sus redes tienda en mi pie, Quiero tener en Él protección; Habladme más de Cristo."},{"t":"v","n":"3","x":"Cuando en las luchas falte la fe Y el alma sienta desfallecer, Quiero saber que ayuda tendré Habladme más de Cristo."},{"t":"v","n":"4","x":"Y cuando tenga yo que partir Para encontrar a mi Salvador, Con Él gozoso iré a vivir, Habladme más de Cristo."},{"t":"c","x":"Quiero escuchar la historia fiel De mi Jesús mi Salvador; Quiero vivir tan sólo por Él, Habladme más de Cristo."}],"w":1},{"s":"Himnario congregacional","n":"112","t":"Salvador, mi bien eterno","p":"373","c":"Letra y Música: S. J. Vail","l":[{"t":"v","n":"1","x":"Salvador mi bien eterno, más que vida para mí, en mi fatigosa senda, cerca siempre te halle a Ti. Junto a Ti, junto a Ti, junto a Ti, junto a Ti, en mi fatigosa senda, cerca siempre te halle a Ti."},{"t":"v","n":"2","x":"No los bienes no placeres, ni renombre busco aquí, en las pruebas y en desdenes, cerca siempre te halle a Ti. Junto a Ti, junto a Ti, junto a Ti, junto a Ti, en las pruebas y en desdenes, cerca siempre te halle a Ti."},{"t":"v","n":"3","x":"Yendo por sombrío valle, o en rigiente mar hostil, después y antes de la prueba, cerca siempre te halle a Ti. Junto a Ti, junto a Ti, junto a Ti junto a Ti, después y antes de la prueba, cerca siempre te halle a Ti."}],"w":1},{"s":"Himnario congregacional","n":"113","t":"Salvo en los tiernos brazos","p":"374","c":"Letra: Fanny J. Crosby, Trad. Juan B. Cabrera; Música: William H. Doane","l":[{"t":"v","n":"1","x":"Salvo en los tiernos brazos de mi Jesús seré, y en su amoroso pecho siempre reposaré, este es sin duda el eco de celestial canción, que de inefable gozo llena mi corazón."},{"t":"v","n":"2","x":"De sus amantes brazos la gran solicitud, me libra de tristeza me libra de inquietud; y si tal vez hay pruebas fáciles pasarán, lágrimas si vertiere, pronto se enjugarán."},{"t":"v","n":"3","x":"Y cruzaré la noche lóbrega sin temor, hasta que venga el día de perennal fulgor. cuán placentero entonces con Él será morar, y en la mansión de gloria siempre con Él reinar."},{"t":"c","x":"Salvo en los tiernos brazos de mi Jesús seré, y en su amoroso pecho siempre reposaré."}]},{"s":"Himnario congregacional","n":"114","t":"Si en tu vida las nubes agolparse ves","p":"375","c":"Letra: Lezzie De Armond, Trad. Vicente Mendoza Polanco (1875-1955); Música: Bentley DeForest Ackley (1872-1958)","l":[{"t":"v","n":"1","x":"Si en tu sen da las nubes agolparse ves, no vaciles por ello ni flaqueen tus pies, cada nube que venga no podrá traer más que pruebas que pasan si hay valor y fe."},{"t":"v","n":"2","x":"Si es tu vida una carga de cuidados mil, olvidado de todo te podrás sentir, si tu ayuda acudieres a llevar doquier, esto endulza la vida si hay valor y fe."},{"t":"v","n":"3","x":"Pon en alto los ojos sin dudar jamás, que en las lides del mundo vencedor saldrás, que si hay flores y encantos tras invierno cruel trae encantos la vida si hay valor y fe."},{"t":"c","x":"¡Si hay valor y fe! ¡si hay valor y fe! en la más oscura noche siempre hay luz ¡si hay valor y fe! ¡si hay valor y fe! gozo y paz traerá la lucha, si hay valor y fe."}]},{"s":"Himnario congregacional","n":"115","t":"Si estoy desalentado con penas y temor","p":"376–377","c":"Letra y Música: J. Bruce Evans","l":[{"t":"v","n":"1","x":"Si estoy desalentado, Con penas y temor, Con cuitas oprimido, En pruebas y en dolor, Entonces Cristo dice, Mis pruebas al mirar, Que su sostén y ayuda, Jamás me faltaB Coro B"},{"t":"v","n":"2","x":"Cuando en la dura prueba, Conmigo el mundo es cruel, Cuando en la ruda lucha, No hallo un amigo fiel, Entonces llega a mi alma, Un eco celestial, Es el Señor que dice, Que ayuda, me darán."},{"t":"v","n":"3","x":"Cuando en mis aflicciones, No puedo resistir, Cuando en las tentaciones, Voy casi a sucumbir, Entonces su socorro El Salvador me da, Y El ha prometido Conmigo siempre esrá. Por gracia Jesús me tar."},{"t":"c","x":"sostendrá, Y nunca me faltará; Si en sombras yo voy, o triste estoy, Su gracia me sostendrá."}],"w":1},{"s":"Himnario congregacional","n":"116","t":"Si olvidado en la vida y a solas estoy","p":"378","c":"Letra y Música: P. P. Lowry, Trad. Vicente Mendoza","l":[{"t":"v","n":"1","x":"Si olvidado en la vida y a sólas estoy, Si con alma abatida y en sombras yo voy, Si me falta valor y me vence el dolor, Hay quién podrá cuidar de mi."},{"t":"v","n":"2","x":"Si la fuente del gozo se agota en mi ser, Si de mi alma la gloria la miro caer, Si abrumado yo voy, Si en conflictos estoy, Hay quién podrá cuidar de mi."},{"t":"v","n":"3","x":"Si confuso y cansado no puedo encontrar Los alientos que vengan la fuerza a prestar, En mi senda yo iré sostenido por fe, Hay quién cuide siempre de mi."},{"t":"c","x":"De mi cuidará Jesús mi Señor, Su amparo jamás faltará; él conoce mi mal y mi grande inquietud, Y ayuda hay en Él sin igual."}],"w":1},{"s":"Himnario congregacional","n":"117","t":"Sigo a Cristo, Él es mi camino","p":"379","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Sigo a Cristo, Él es mi camino, Lo sigo por tierra, por valles y mar; El me promete nunca dejarme, Promesa divina que no ha de faltar."},{"t":"v","n":"2","x":"Sombras que vienen o nubes que van Nunca mi guía podrán encubrir; Es la luz pura sin sombra alguna, Siempre a su lado yo he de seguir."},{"t":"v","n":"3","x":"Siempre en la luz yo me regocijo, Sigo adelante, voy a mi hogar; Voy caminando, con gozo cantando, Ando en la luz que siempre he de amar."},{"t":"c","x":"Cristo es la luz, Cristo es la luz, Luz que inunda todo mi ser; ¡Aleluya! me regocijo Cantando glorias a mi Jesús"}]},{"s":"Himnario congregacional","n":"118","t":"Tal como el ciervo brama","p":"380","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Tal como el ciervo brama por límpida corriente, Mi"},{"t":"v","n":"2","x":"Mi pan de día y de noche son lágrimas candentes, Di"},{"t":"v","n":"3","x":"Se abate mucho mi alma, te busca con vehemencia, ¡Oh"},{"t":"v","n":"4","x":"La voz de los abismos pregona tu grandeza, ¡Oh"},{"t":"c","x":"corazón ardiente por ti suspira, oh Dios. Está sedienta mi alma del agua cristalina, De la bondad divina mi alma tiene sed; Essed.\nciendome las gentes; \"¿En dónde está tu Dios?\". Está sedienta mi alma del agua cristalina, De la bondad divina mi alma tiene sed; Essed.\nDios de mi clemencia, escucha mi oración! Está sedienta mi alma del agua cristalina, De la bondad divina mi alma tiene sed; Essed.\nDios, mi Fortaleza; en ti yo confiaré. Está sedienta mi alma del agua cristalina, De la bondad divina mi alma tiene sed; Essed."}],"w":1},{"s":"Himnario congregacional","n":"119","t":"Tan dulce el nombre de Jesús","p":"381","c":"Letra: A. Mejía; Música: E.S. Lorenz","l":[{"t":"v","n":"1","x":"¡Tan dulce el nombre de Jesús! Sus bellas notas al cantar, Mi alma llena al proclamar, El nombre de Jesús."},{"t":"v","n":"2","x":"Adoro el nombre de Jesús, Jamás me faltará su amor; Y pone aparte mi dolor El nombre de Jesús."},{"t":"v","n":"3","x":"Tan puro el nombre de Jesús, Que mi pesar pudo quitar, Y grata paz a mi alma dar, El nombre de Jesús."},{"t":"v","n":"4","x":"El dulce nombre de Jesús, Por siempre quiero alabar; Y todos deben exaltar, El nombre de Jesús."},{"t":"c","x":"¡Cristo dulce nombre es! Dulce para siempre es; Cristo yo te aclamaré, Por siempre, ¡oh, mi Cristo! (o bien: Por siempre, ¡oh,)"}],"w":1},{"s":"Himnario congregacional","n":"120","t":"Todas las promesas del Señor Jesús","p":"382","c":"Letra y Música: R. Kelso Carter, 1886, Trad. Vicente Mendoza","l":[{"t":"v","n":"1","x":"Todas las promesas del Señor Jesús, Son apoyo poderoso de mi fe; Mientras luche aquí buscando yo su luz, Siempre en sus promesas confiaré."},{"t":"v","n":"2","x":"Todas sus promesas para el hombre fiel, El Señor en sus bondades, cumplirá; Y confiado, sé que para siempre en él, Paz eterna mi alma gozará."},{"t":"v","n":"3","x":"Todas las promesas del Señor, serán Gozo y fuerza en nuestra vida terrenal; Ellas en la dura lid nos sostendrán, Y triunfar podremos sobre el mal."},{"t":"c","x":"Grandes, fieles, Las promesas que el Señor Jesús ha dado, Grandes, fieles, En ellas para siempre confiaré.\nGrandes, grandes, fieles son, Grandes, grandes, fieles son, Grandes, grandes, fieles son, Grandes, grandes, fieles son,"}],"w":1},{"s":"Himnario congregacional","n":"121","t":"Dios Nos Ha Dado Promesa","p":"383","c":"Letra: Daniel Whitlle, 1883, trad W. S. Scott; Música: James McGranahan, 1883, alt.","l":[{"t":"v","n":"1","x":"Dios nos ha dado promesa; \"Lluvias de gracia enviaré,"},{"t":"v","n":"2","x":"Cristo nos dio la promesa; Del santo consolador,"},{"t":"v","n":"3","x":"¡Oh Dios, a todo creyente Muestra tu amor y poder!"},{"t":"v","n":"4","x":"Pon en tus siervos piadosos, Celo, virtud y valor,"},{"t":"c","x":"Dones que os den fortaleza, Gran bendición os daré\". Lluvias de gracia, Lluvias pedimos Señor; Mándanos lluvias copiosas, Lluvias del consolador.\nDándonos paz y pu reza, Para su gloria y honor. Lluvias, lluvias. Mándanos lluvias copiosas, Lluvias del consolador.\nTú eres de gracia la fuente, Llena de paz nuestro ser. Mándanos lluvias copiosas, Lluvias del consolador.\nDándonos dones preciosos, Dones del Consolador. Mándanos lluvias copiosas, Lluvias del consolador."}],"w":1},{"s":"Himnario congregacional","n":"122","t":"En un aposento alto","p":"384","c":"Letra y Música: Charlie D. Tillman, 1985, Trad. H. W. Cragin.","l":[{"t":"v","n":"1","x":"En un aposento alto, Con unánime fervor, Ciento veinte esperaban La promesa del Señor. F B F B F c F"},{"t":"v","n":"2","x":"Con estruendo de los cielos Descendió la gran virtud; Todos fueron bautizados Con el Santo Espíritu. Dios, manda tu gran poder; Dios, manda tu gran poder;"},{"t":"v","n":"3","x":"Este gran poder antiguo Es el fiel, celeste don, Prometido a los creyentes De humilde corazón."},{"t":"v","n":"4","x":"Dios está restituyendo Este gran pentecostes, Y el Espíritu sus dones Nos reparte otra vez. Coro"},{"t":"c","x":"Dios, manda tu gran poder, A cada corazón."}],"w":1},{"s":"Himnario congregacional","n":"123","t":"Excelso Don Consolador","p":"385","c":"Letra: Alberto G. Martínez, ICI.; Música: J. Lincoln Hall","l":[{"t":"v","n":"1","x":"Excelso Don Consolador, domina ya en mi corazón; enciendeme con santo ardor con tu divina bendición."},{"t":"v","n":"2","x":"Mi ser puedes tú renovar, y en lenguas te bendeciré; con gran fervor podré hablar, y por doquier te anunciaré."},{"t":"v","n":"3","x":"Hoy te pedimos, ¡Oh Señor! que llenes todo corazón; y los tesoros de tu amor gocemos por tu santa unción."},{"t":"v","n":"4","x":"Toda miseria él cambió en gran fervor y santo amor; cuando con fuego nos envió el gran y fiel Consolador."},{"t":"c","x":"Excelso Don de mi Señor, promesa de su gran poder; invade hoy mi corazón, enciéndeme con fuego de pentecostés.\nExcelso Don de mi Señor, promesa de su gran poder; invade hoy mi corazón,"}],"w":1},{"s":"Himnario congregacional","n":"124","t":"Manda, ¡Oh Dios!, una ola de tu gran poder","p":"386","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Manda, ¡Oh Dios! una ola de tu gran poder, purifica a tu pueblo aquí; danos grande poder, llena hoy nuestro ser, esperando estamos en ti."},{"t":"v","n":"2","x":"Danos más de la vida de Cristo el Señor, anhelamos su senda seguir; danos mucho poder para actuar con amor y tu santa palabra cumplir."},{"t":"v","n":"3","x":"¡Oh! despierta a los que dormidos están y se dejan del mundo vencer, manda lluvias de gracia y se salvarán; con poder llena hoy nuestro ser."},{"t":"c","x":"Manda, ¡Oh Dios! el glorioso poder; manda, ¡Oh Dios! el glorioso poder; el poder que al débil la fuerza le da; manda, ¡Oh Dios! el glorioso poder."}]},{"s":"Himnario congregacional","n":"125","t":"Santo Espíritu, desciende","p":"387","c":"Letra: Vicente Mendoza; Música: John R. Sweney","l":[{"t":"v","n":"1","x":"Santo Espíritu desciende A mi pobre corazón, Llenalo de tu presencia, Y haz en él tu habitación. Coro"},{"t":"v","n":"2","x":"De tu gracia puedes darme Inundando el corazón, Ven, que mucho necesito, Dame hoy tu bendición. ¡Llena hoy! ¡Lena hoy! ¡Llena hoy mi corazón!"},{"t":"v","n":"3","x":"Dame paz, consuelo y gozo, Cúbreme hoy con tu perdón; Tú confortas y redimes, Tú das grande salvación."},{"t":"v","n":"4","x":"Ven, bautizame ahora, Obediente espero aquí; Ven a ser mi eterno guía, Haz tu voluntad en mi."},{"t":"c","x":"Santo Espíritu desciende Y haz en mi tu habitación."}],"w":1},{"s":"Himnario congregacional","n":"126","t":"Santo Espíritu, dirige","p":"388","c":"Letra: Vicente Mendoza; Música: Victor H. Benke","l":[{"t":"v","n":"1","x":"Santo Espíritu, dirige Tú mis pasos al Señor, Y haz que humilde guarde siempre Los mandatos de su amor."},{"t":"v","n":"2","x":"Dime cómo ser sumiso Y entregar mi entero ser; Goces y tesoros vanos, Todo siempre aborrecer."},{"t":"v","n":"3","x":"Dime cómo al ser probado Debo, siempre en Él confiar; Y aunque sufra en agonía Nunca de Él desesperar."},{"t":"v","n":"4","x":"Dime cómo obedecerle, Aunque a veces mi razón No comprenda sus designios Ni halle pronta explicación."},{"t":"v","n":"5","x":"Dime cómo he de seguirle Nunca fiando en mi saber, Entregado a su servicio Y confiado en su poder."},{"t":"c","x":"¡Dime, dime cómo consagrar todo al Padre de bondad! ¡Dime, dime cómo hacer su voluntad. (o bien: su voluntad.)"}],"w":1},{"s":"Himnario congregacional","n":"127","t":"Señor, con todos quede","p":"389","c":"Letra y Música: Vicente Mendoza","l":[{"t":"v","n":"1","x":"Señor con todos quede tu fiel consolador, y en cada pecho encienda un nuevo y santo ardor; confirma tu promesa, de gozo y de poder, y muestrese gloriosa tu vida en nuestro ser."},{"t":"v","n":"2","x":"Espíritu de gracia, de paz y de perdón; mantén el sacro fuego de fiel consagración; queremos ser sumisos y hacer tu voluntad, tus santas ordenanzas cumpliendo con lealtad."},{"t":"v","n":"3","x":"Que siempre tu potencia la sienta nuestro ser, teniendo la experiencia gloriosa de poder; queremos tu palabra poder interpretar, Espíritu divino, tú venla a revelar."},{"t":"v","n":"4","x":"Señor bendito seas, bendita tu bondad, pues siempre tú respondes del hombre a su ansiedad; inúndenos tu gloria, consúmanos tu amor, y quede con tus hijos tu Espíritu Señor."}],"w":1},{"s":"Himnario congregacional","n":"128","t":"¿De pesar estás rodeado?","p":"390","c":"Letra: Juan N. de los Santos; Música: William James Kirkpatrick","l":[{"t":"v","n":"1","x":"¿De pesar estás rodeado? ¿tienes pruebas en verdad? ¿De sufrir estás cansado? ¿ves que viene tempestad?"},{"t":"v","n":"2","x":"En las penas, en el duelo, que tu alma sufrirá, En Jesús tendrás consuelo, el tus penas calmará."},{"t":"v","n":"3","x":"Al Señor tu voz eleva, ve a Dios con gran fervor; Él de penas te releva y mitiga tu dolor."},{"t":"v","n":"4","x":"¿Tarda Dios en contestarte? sigue orando sin cesar; Pronta ayuda puede darte, tu oración al contestar."},{"t":"c","x":"Sigue orando, sigue orando, aunque ruja la tempestad, el Señor está velando, te dará tranquilidad."}]},{"s":"Himnario congregacional","n":"129","t":"Dulce oración","p":"391","c":"Letra: William W. Walford; Música: William Batchelder Bradbury","l":[{"t":"v","n":"1","x":"Dulce oración, dulce oración, de toda influencia mundanal, elevas tú mi corazón al tierno Padre celestial. ¡Oh!, cuantas veces tuve en ti auxilio en ruda tentación, y cuántos bienes recibí, mediante ti, dulce oración."},{"t":"v","n":"2","x":"Dulce oración, dulce oración, al trono excelso de bondad, tú llevarás mi petición a Dios que escucha con piedad. Por fe espero recibir la gran divina bendición, y siempre a mi Señor servir por tu virtud, dulce oración."},{"t":"v","n":"3","x":"Dulce oración, dulce oración, que aliento y gozo al alma das, en esta tierra de aflicción consuelo siempre me serás. Hasta el momento en que veré las puertas francas de Sión; entonces me despediré feliz, de ti, dulce oración."}]},{"s":"Himnario congregacional","n":"130","t":"Es la oración un medio que el Señor","p":"392","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Es la oración un medio que el Señor le dejó a su grey que anda con temor; viendo su palabra, en ella encontrarás que la oración te acerca a Cristo más y más."},{"t":"v","n":"2","x":"Si estás tú triste, ponte en oración, a tu buen Señor derrama el corazón; es un privilegio que en su amor nos dio, él te escuchará por que así lo prometió."},{"t":"v","n":"3","x":"Si no ves respuesta, ora más y más, no te desanimes, Cristo no es falaz; siempre a sus promesas fiel responderá; lo que necesites, el Señor te lo dará."},{"t":"v","n":"4","x":"Si estas esperando al fiel Consolador deberás buscarlo con fe y valor; el Señor mirando tu necesidad de su Santo Espíritu en ti derramará."},{"t":"c","x":"¡Oh! hablar con Cristo ¡Qué felicidad! y contarle todo con suma verdad; exponiendole tu necesidad, él te escuchará desde su trono celestial."}]},{"s":"Himnario congregacional","n":"131","t":"Padre nuestro que moras en todo lugar","p":"393","c":"Letra y Música: Desconocido.","l":[{"t":"v","n":"1","x":"Padre nuestro que moras en todo lugar, nuestras voces alzamos a ti, no dudamos que hoy tú nos vas a escuchar y estarás con nosotros aquí."},{"t":"v","n":"2","x":"¡Oh, cuán dulces momentos de grata oración cuando hablamos al Rey y Señor! nuestro pecho reboza de gran bendición, el lo llena de paz y de amor."},{"t":"v","n":"3","x":"Cuánta paz y dulzura nos da la oración, pues nos lleva con Cristo a gozar; estaremos por siempre en la meditación de la vida futura sin par."},{"t":"v","n":"4","x":"Al Señor hablaremos en nuestra oración, pediremos su gracia y poder, venceremos así toda cruel tentación, llegaremos su gloria a ver."},{"t":"c","x":"¡Oh! precioso jardín de oración, de oración, el cristiano ante ti llegará, llegará; hasta el trono de gracia se transportará en tus alas, preciosa oración. (oración)"}]},{"s":"Himnario congregacional","n":"131b","t":"Las primicias del día","p":"394–395","c":"Letra y Música: Brus del Monte","l":[{"t":"v","n":"1","x":"Me despierto con ganas de verlo; Las primicias del día le doy. Comenzar con el Rey me anima Confesarle \"Señor, tuyo soy\"."},{"t":"v","n":"2","x":"Un momento contigo es oro; Conversar con el Rey es mi honor. Me impartes tu sabiduría; Me inspira tu carta de amor."},{"t":"c","x":"Yo te doy este día Señor, Yo te doy esta vida Señor. De tu mano yo quiero seguir, Controlado por Ti al vivir."}]},{"s":"Himnario congregacional","n":"132","t":"Que bello es estar en el jardín de la oración","p":"396","c":"Letra y Música: Francisco Sánchez Muñiz","l":[{"t":"v","n":"1","x":"Qué bello es estar en el jardín de la oración, siempre meditar en santa y dulce comunión; Al cielo llegar do el Señor Jesús está, para recibir la más preciosa bendición."},{"t":"v","n":"2","x":"La más bella flor en el jardín santo de Dios, de agradable olor, de suavidad, de aceptación, de gracia sin par y de belleza celestial, es la humildad, dulce virtud del corazón."},{"t":"c","x":"Yo quiero vivir en oración y humildad, quiero yo seguir en comunión y santidad; paso a paso ir con mi Señor hasta el final, y siempre morar allá en el reino celestial."}]},{"s":"Himnario congregacional","n":"133","t":"Aquí está mi Jesús","p":"397","c":"Letra y Música: Guadalupe Velasco, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Aquí está mi Jesús, dale tu corazón, que lo llene de su gracia, y le dé su bendición."},{"t":"v","n":"2","x":"Si vienes triste y cansado dale tu carga al Señor no temas sigue adelante él es tu ayudador."},{"t":"v","n":"3","x":"Aquí muy dentro de mi alma yo siento una bendición, yo siento que está conmigo el gran Consolador."},{"t":"v","n":"4","x":"Ya tengo nuevos alientos para seguir con valor; de tu gracia me ha llenado tu Espíritu Señor."},{"t":"c","x":"Alzad vuestras manos y bendecid a Jehová, su Espíritu Santo bendición hoy te dará."}]},{"s":"Himnario congregacional","n":"134","t":"La Peña de Horeb","p":"398","c":"Letra y Música: Melodía Puertoriqueña, s.XX, Arr. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Cristo es la peña de Horeb que está brotando; agua de vida saludable para ti, Cristo es la peña de Horeb que está brotando; agua de vida saludable para ti."},{"t":"v","n":"2","x":"Oh, pecador que vas por el desierto, por las candentes arenas del pecar; oye la voz que dice ven y bebe, es Jesucristo, que te quiere perdonar."},{"t":"v","n":"3","x":"Contemplo a Cristo, por mí crucificado en el calvario, es rico manantial, Cristo es la peña de Horeb, que está brotando, agua de vida saludable para ti."},{"t":"c","x":"Ven a beberla, es más dulce que la miel, refresca el alma y apaga toda sed. Cristo es la peña de Horeb que está brotando, agua de vida saludable para ti."}]},{"s":"Himnario congregacional","n":"135","t":"Dime la antigua historia","p":"399","c":"Letra: Katherine Hankey, Tr. Juan B. Cabrera; Música: William H. Doane","l":[{"t":"v","n":"1","x":"Dime la antigua historia del celestial favor, de Cristo y de su gloria, de Cristo y de su amor. Dímela con llaneza propia de la niñez, por que es mi mente corta y anhela sencillez."},{"t":"v","n":"2","x":"Dime tan dulce historia con tono claro y fiel: \"murió Jesús, y salvo tú puedes ser por él. Dime esta historia siempre si en tiempo de aflicción deseas a mi alma traer consolación."},{"t":"v","n":"3","x":"Dime la antigua historia cuando creas tal vez que del mundo me ciega la falsa brillantez. Y cuando ya vislumbre de la gloria la luz, repíteme la historia: \"Quien te salva es Jesús\""},{"t":"c","x":"Dime la antigua historia, cuéntame la victoria, háblame de la gloria, de Cristo y de su amor."}]},{"s":"Himnario congregacional","n":"136","t":"Grato es decir la historia","p":"400","c":"Letra: Katherine Hankey, Tr. Juan B. Cabrera; Música: William G. Fischer","l":[{"t":"v","n":"1","x":"Grato es decir la historia del celestial favor, de Cristo y de su gloria, de Cristo y de su amor; me agrada referirla, pues sé que es la verdad, y nada satisface cual ella mi ansiedad."},{"t":"v","n":"2","x":"Grato es decir la historia que brilla cual fanal, y en glorias y portentos no reconoce igual; me agrada referirla, pues me hace mucho bien; por eso a ti deseo decírtela también."},{"t":"v","n":"3","x":"Grato es decir la historia que antigua, sin vejez, parece al repetir la más dulce cada vez; me agrada referirla, pues hay quien nunca oyó que para hacerle salvo el buen Jesús murió."},{"t":"c","x":"¡Cuán bella es esa historia! mi tema allá en la gloria será la antigua historia de Cristo y de su amor."}]},{"s":"Himnario congregacional","n":"137","t":"Hermosas la huellas del predicador","p":"401","c":"","l":[{"t":"v","n":"1","x":"Hermosas las huellas del predicador que anuncia las nuevas de celeste amor, y va por doquiera derramando luz, la luz esplendete que sólo es Jesús."},{"t":"v","n":"2","x":"Verdades sublimes, para el hombre son un gozo perfecto, grande bendición; celes te reposo de gracia y solaz, un don inefable de perenne paz."},{"t":"v","n":"3","x":"Irá él andando, y quizá llorando, llevando do quiera simiente de amor; mas con regocijo volverá trayendo preciosas gavillas para su Señor."},{"t":"v","n":"4","x":"No hay en la tierra vocación mejor que aquella que ofrece vida al pecador mediante la gracia, de Dios el amor; hermosas las huellas del predicador."},{"t":"c","x":"Hermosas, hermosas, hermosas las huellas del predicador que pasa su vida sirviendo, sirviendo al Señor, y las buenas nuevas sin cesar anuncia; hermoso y eterno por cierto, galardón tendrá."}]},{"s":"Himnario congregacional","n":"138","t":"¡Oh! Cantádmelas otra vez","p":"402","c":"Letra y Música: Philip P. Bliss, Tr. Julia Butler","l":[{"t":"v","n":"1","x":"¡Oh! cantádmelas otra vez, bellas palabras de vida, hallo en ellas mi gozo y luz, bellas palabras de vida; Sí, de luz y vida, son sostén y guía;"},{"t":"v","n":"2","x":"Jesucristo a todos da bellas palabras de vida, hoy escúchalas pecador, bellas palabras de vida; bondadoso te salva, y al cielo te llama;"},{"t":"v","n":"3","x":"Grato el cántico sonará, bellas palabras de vida, tus pecados perdonará, bellas palabras de vida; Sí, de luz y vida, son sostén y guía;"},{"t":"c","x":"¡Qué bellas son, qué bellas son! bellas palabras de vida; ¡Qué bellas son, qué bellas son! bellas palabras de vida."}]},{"s":"Himnario congregacional","n":"139","t":"Si en la fe yo desmayare","p":"403","c":"Letra: Vicente Mendoza; Música: Robert Harkness, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Si en la fe yo desmayare él me sostendrá; y si el mal me amenazare él me sostendrá."},{"t":"v","n":"2","x":"Nunca yo podré ser firme con tan débil fe; mas el puede dirigirme, y él me sostendrá."},{"t":"v","n":"3","x":"Son su gozo y complacencia cuantos él salvó, y al salvarme en su clemencia, él me sostendrá."},{"t":"v","n":"4","x":"Él no quiso ver perdida mi alma en la maldad; dio su sangre por mi vida, y él me sostendrá."},{"t":"c","x":"Él me sostendrá, él me sostendrá; mi Jesús que tanto me ama, él me sostendrá."}]},{"s":"Himnario congregacional","n":"140","t":"Lámpara a mis pies es tu Palabra","p":"404","c":"Letra y Música: Francisco Sánchez Muñíz, ICIAR, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Lámpara a mis pies es tu Palabra Que alumbra, Señor, mi corazón. Lámpara a mis pies es tu Palabra Que me guiará a la Patria Celestial."},{"t":"v","n":"2","x":"\"Escudriñar su Palabra Santa\" Nos mandó nuestro Señor Jesús; \"Testimonio da de mí\", Él dijo, \"Y encontraréis perfecta Vida Eternal\"."},{"t":"v","n":"3","x":"Cuando un día vine a Jesucristo Sólo había en mí oscuridad, Mas en su Palabra hallé, gloriosa, La luz refulgente que siempre me guiará."},{"t":"c","x":"Preciosa luz en mí brilló, Es la Palabra del Señor; es la lumbrera que en mi camino va, que me conduce a la Patria celestial."}]},{"s":"Himnario congregacional","n":"141","t":"Padre, tu Palabra es","p":"405","c":"Letra: Juan Bautista Cabrera; Música: J. T. Grape","l":[{"t":"v","n":"1","x":"Padre tu Palabra es Mi delicia y mi solaz; Guíe siempre a ti mis pies, Y a mi pecho traiga paz. E Coro B"},{"t":"v","n":"2","x":"Obediente oí tu voz, En tu gracia fuerza hallé, Y con firme pie veloz, Por tus sendas caminé. Es tu ley Señor, Faro celestial,"},{"t":"v","n":"3","x":"Tu verdad es mi sostén, Contra duda y tentación, Y destila calma y bien Cuando asalta la aflicción."},{"t":"v","n":"4","x":"Son tus dichos para mí, Prendas fieles de salud; Dame pues, que te oiga a Ti, Con filial solicitud."},{"t":"c","x":"Que en perenne resplandor Norte y guía da al mortal."}],"w":1},{"s":"Himnario congregacional","n":"142","t":"Santa Biblia, para mí","p":"406","c":"Letra: John Burton, 1805, Trad. Pedro Castro; Música: Melodía española, Atrib. a Henry R. Bishop, Arr. Benjamin Carr, 1825","l":[{"t":"v","n":"1","x":"Santa Biblia, para mí eres un tesoro aquí; tú contienes con verdad la divina voluntad; tú me dices lo que soy, de quién vine y a quién voy."},{"t":"v","n":"2","x":"Tú reprendes mi dudar y me exhortas sin cesar; Eres faro que a mi pie va guiando por la fe a las fuentes del amor del bendito Salvador."},{"t":"v","n":"3","x":"Eres infalible voz del Espíritu de Dios, que vigor al alma da cuando en aflicción está; tú me enseñas a triunfar de la muerte y del pecar."},{"t":"v","n":"4","x":"Por tu santa letra sé que con Cristo reinaré; yo, que tan indigno soy, por tu luz al cielo voy; ¡Santa Biblia, para mí eres un tesoro aquí!"}]},{"s":"Himnario congregacional","n":"143","t":"Tu Palabra Santa llama","p":"407","c":"Letra y Música: Alberto G. Martínez, ICIAR","l":[{"t":"v","n":"1","x":"Tu Palabra Santa llama a todo hombre pecador Para darle siempre calma y llenarlo de tu amor; Si la acepta con el alma sentirá su corazón Que de veras Tú le amas, ¡Oh, Divino Salvador!"},{"t":"v","n":"2","x":"Tu Palabra salvadora es verdad, es vida y luz Que ilumina a toda hora hasta donde te hallas Tú; Haz que tenga yo la honra de llevar siempre tu cruz, Y alcanzar así la gloria donde moras, mi Jesús. Cielo estrellas, mar y tierra, todo, todo pasa"},{"t":"v","n":"3","x":"Tu Palabra es pan de vida; es sustento espiritual; Cuando llega al alma herida le da alivio, le da paz; Todo aquel que la recibe, nunca, nunca morirá, Porque Tú quieres que viva por toda la eternidad."},{"t":"c","x":"rá; sólo tu Palabra eterna por los siglos durará."}],"w":1},{"s":"Himnario congregacional","n":"144","t":"Acuérdate de tu creador","p":"408","c":"Letra y Música: Francisco Sánchez Muñíz","l":[{"t":"v","n":"1","x":"Acuérdate de tu Creador En los días de tu juventud, Antes que vengan días y años de dolor Y no halles contentamiento; Antes que se oscurezca el sol Y tu vida llegue a su fin, Acuérdate de tu Creador En los días de tu juventud."},{"t":"v","n":"2","x":"Espíritu Santo de Dios, A esta Cristiana Juventud Ven a llenar con ese fuego celestial Que da poder, da convicción; Haz que en su alma, cual altar, Arda constante, oh Señor, El fuego purificador De tu potencia celestial."},{"t":"v","n":"3","x":"En todo tiempo sean blancas Tus vestiduras, Juventud, En tu cabeza no falte ungüento jamás Para vivir en santidad; Con el Cordero Celestial Albo vestido encontrarás, En el Espíritu de Dios unción fragante obtendrás."},{"t":"c","x":"¡Oh! Juventud, de Jesús ven a sus pies! En obediencia, pureza y fe; Te llenará de vida plena con fuego de Pentecostés."}]},{"s":"Himnario congregacional","n":"145","t":"¡Adelante! huestes fieles del Señor","p":"409","c":"Letra y Música: Aquiles Mireles Perales","l":[{"t":"v","n":"1","x":"¡Adelante! huestes fieles del Señor, ¡Adelante! ¡Adelante! No temáis, luchemos todos con valor, él nos ayudará. Jesucristo es nuestro Jefe, Y siempre a nuestro lado va; Adelante, pues, su gracia nos dará, ¡Jamás nos dejará!"},{"t":"v","n":"2","x":"Lucharemos siempre por el Salvador, ¡Adelante! ¡Adelante! Buscaremos almas para el Señor, él nos ayudará Anunciemos su grandeza Y su incomparable amor; Adelante, pues su gracia nos dará, ¡Jamás nos dejará!"},{"t":"v","n":"3","x":"Luchadores fieles del Señor Jesús, ¡Adelante! ¡Adelante! Por doquier contad la historia de la cruz, él nos ayudará. Muchos hombres nada saben Del buen Señor que allí murió; Adelante, pues, su gracia nos dará ¡Jamás nos dejará!"},{"t":"c","x":"¡Adelante combatientes! ¡Adelante sin temor! ¡Seremos los valientes De Jesús el Salvador! Adelante, pues, su gracia nos dará, ¡Jamás nos dejará!"}]},{"s":"Himnario congregacional","n":"146","t":"¡Adelante! seguidores de Jesús","p":"410–411","c":"Letra y Música: Aquiles Mireles Perales","l":[{"t":"c","x":"Adelante, seguidores de Jesús el Salvador, Alistémonos con gozo, trabajemos con afán; Levantémonos, hermanos, a buscar al pecador Nuestro Jefe nos alienta, venceremos a Satán."},{"t":"v","n":"1","x":"Con regocijo en el alma nos congregamos aquí Unidos todos con lazos de un verdadero amor; ¡Oh! cuán hermoso es siempre morando junto a Ti Sintiendo tusbendi ciones, querido Salvador."},{"t":"v","n":"2","x":"A ti, Señor, acudimos, tu bendición imploramos, Hemos venido, Padre, a disfrutar tu amor; Reunidos en tu nombre estamos. ¡Oh Señor! Danos tu gracia divina, sólo en Ti confiamos."},{"t":"v","n":"3","x":"Mira tus hijos amados con grande gozo en el alma, Todos buscando tu rostro en santa comunión; Calma las tempestades, derrama bendición, Después de tanta tormenta danos Tú la calma."}],"w":1},{"s":"Himnario congregacional","n":"147","t":"Un llamado llega ya","p":"412","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"Un llamado llega ya, la batalla va a empezar, oye al Capitán llamar: ¡A luchar, a luchar! Al compas del tambor"},{"t":"v","n":"2","x":"Las falanges de Satán, derrotadas huyen ya, se acerca el final, ¡A luchar, a luchar! la victoria nuestra es,"},{"t":"c","x":"grita ya ¡yo voy, yo voy! ¡A luchar, a luchar, a luchar! Cristo al frente siempre va, es el Capitán, con él hemos de vencer al feroz Satán; ¡A luchar, a luchar, a luchar!\n¡Adelante a vencer! ¡A luchar, a luchar, a luchar! Cristo al frente siempre va, es el Capitán, con él hemos de vencer al feroz Satán; ¡A luchar, a luchar, a luchar!"}],"w":1},{"s":"Himnario congregacional","n":"148","t":"Anhelo dar de gracia","p":"413","c":"Himno del Instituto Teológico \"San Pablo\"; Letra y Música: Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Anhelo dar de gracia, lo que de gracia dio, el Cristo victorioso, que mi alma transformó, no puedo detenerme, mi vida debo dar, las almas ya se pierden y hay que predicar."},{"t":"v","n":"2","x":"Mas hoy con diligencia me debo presentar, con Cristo mi Maestro; ¡Quisiérame aprobar! la Obra de los siglos, demanda sin tardar, de íntegros obreros, libres de pecar."},{"t":"v","n":"3","x":"La Biblia es el mensaje que debo bien de usar, para que la Doctrina, defienda sin cesar; llevando la Palabra, yo debo persistir, para que por su gracia, salve al que ha de oír."},{"t":"v","n":"4","x":"Contento en aquel día, mi Salvador dirá: Ven siervo fiel y bueno, mi Padre te amará, tus penas han pasado, corona ceñirás; victoria has obtenido, en gloria vivirás."},{"t":"c","x":"¡Alzad vuestros ojos, los campos blancos están!, la mies es mucha y obreros faltan ya; llenad ya de Cristo, al mundo sin desmayar sembremos la semilla para eternidad."}]},{"s":"Himnario congregacional","n":"149","t":"A trabajar, a trabajar","p":"414","c":"Letra y Música: Enrique de la Rosa Piedras, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"A trabajar, a trabajar; no te quedes sin publi"},{"t":"v","n":"2","x":"Hasta la muerte él llegó y su vida por ti la"},{"t":"v","n":"3","x":"Si por el mundo triste vas ningún consuelo pudiste ha"},{"t":"v","n":"4","x":"La credencial que llevo yo, es la de Cristo mi Salva"},{"t":"c","x":"car; háblales de Jesús, porque su sangre nos dio en la cruz. Vives tú para él, vivo yo para él, y su sangre de amor también tiene poder. Vives tú para él, vivo yo para él, y su sangre de amor también tiene poder.\ndio, y su sangre derramó y tus pecados él perdonó. Vives tú para él, vivo yo para él, y su sangre de amor también tiene poder. Vives tú para él, vivo yo para él, y su sangre de amor también tiene poder.\nllar, ven a la fuente que es Jesús, y en su sangre salvo serás. Vives tú para él, vivo yo para él, y su sangre de amor también tiene poder. Vives tú para él, vivo yo para él, y su sangre de amor también tiene poder.\ndor; y en su nombre hablaré el evangelio de su poder. Vives tú para él, vivo yo para él, y su sangre de amor también tiene poder. Vives tú para él, vivo yo para él, y su sangre de amor también tiene poder."}],"w":1},{"s":"Himnario congregacional","n":"150","t":"Brilla en el sitio donde estés","p":"415","c":"Letra: Ina Duley Ogdon, 1913 (1872-1964), Tr. Vicente Mendoza; Música: Charles H. Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Nunca esperes el momento de una grande acción, ni que pueda lejos ir tu"},{"t":"v","n":"2","x":"Puedes en tu cielo algunas nubes disipar, haz a un lado tu egoísmo"},{"t":"v","n":"3","x":"Puede tu talento alguna cosa descubrir, do tu luz podrá resplande"},{"t":"c","x":"luz; de la vida a los pequeños actos da atención; brilla en el sitio donde estés. puedes con tu luz algún perdido rescatar; brilla en el sitio donde estés.\ncruel; aunque sólo un corazón pudieras consolar brilla en el sitio donde estés. Brilla en el sitio don de estés; Brilla en el sitio donde estés; puedes con tu luz algún perdido rescatar; brilla en el sitio donde estés.\ncer de tu mano el pan de vida puede aquí venir; brilla en el sitio donde estés. puedes con tu luz algún perdido rescatar; brilla en el sitio donde estés."}],"w":1},{"s":"Himnario congregacional","n":"151","t":"Brille o no el sol","p":"416","c":"Letra y Música: W. F. Valderrama","l":[{"t":"v","n":"1","x":"Brille o no el sol, verano o invierno sea recorre la montaña el soto el llano, cual Cristo la palabra en Galilea, sembrar es tu misión si eres cristiano."},{"t":"v","n":"2","x":"Siembra do quiera la verdad divina, siémbrala con afanes, con dolores, que al soplo del Espíritu germina planta que al cielo da frutos y flores."},{"t":"v","n":"3","x":"Quizá alguna vez tu planta herida sientas por las espinas del sendero, ¿no ves con ellas de Jesús ceñida la frente augusta del fatal madero."},{"t":"v","n":"4","x":"Siembra, no temas en la peña dura, deja en la roca estéril caer el grano Que suele hallar la gracia una endidura En el granito del orgullo humano"}],"w":1},{"s":"Himnario congregacional","n":"152","t":"Cristo es nuestro jefe","p":"417","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"Cristo es nuestro Jefe, por él debemos luchar, luchar con denuedo hasta el triunfo alcanzar; Cristo es nuestro guía, sólo a él debemos seguir, pues Cristo ha prometido estar con su pueblo hasta el fin."},{"t":"v","n":"2","x":"Luchemos unidos y así podremos triunfar, levan tando muy alto, el pendón celestial, Dios es con nosotros ¿quién contra nosotros será? hoy el Señor nos invita por su causa bendita a luchar."},{"t":"v","n":"3","x":"Juventud cristiana nunca debes desmayar Cristo va contigo, en él tú debes confiar, Dios dice: no temas que yo contigo seré; pues a luchar sin temores, cumplir con este santo deber."},{"t":"c","x":"Voy a luchar por mi Jesús. llevando el evangelio de paz y luz; si en peligro te ves, no debes desmayar porque a tu lado Cristo está."}],"w":1},{"s":"Himnario congregacional","n":"153","t":"Cristo está buscando obreros hoy","p":"418","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música:James Bowman Overton Clemm(1855-1927)","l":[{"t":"v","n":"1","x":"Cristo está buscando obreros hoy Que quieran ir con Él; ¿Quién dirá: \"Señor contigo voy, Yo quiero serte fiel\"?"},{"t":"v","n":"2","x":"Cristo quiere mensajeros hoy, Que anuncien su verdad; ¿Quien dirá: \"Señor yo listo estoy, Haré tu voluntad\"?"},{"t":"v","n":"3","x":"Hay lugar si quieres trabajar, De Cristo en la labor; Puedes de Su gloria al mundo hablar, De su bondad y amor."},{"t":"v","n":"4","x":"¿Vives ya salvado por Jesús? ¿Su amor conoces ya? ¡Habla, pues, anuncia que en la luz De Cristo vives ya!"},{"t":"c","x":"¡Oh Señor, es mucha la labor, Y obreros faltan ya; Danos luz, ardiente fe y valor, Y obreros siempre habrá."}]},{"s":"Himnario congregacional","n":"154","t":"Columna de fuerte sostén","p":"419","c":"Letra y Música: Francisco Sánchez Muñíz, ICIAR","l":[{"t":"v","n":"1","x":"Columna de fuerte sostén es el \"cristiano amén\" que sirve con disposición, con todo su corazón; incienso da en cada \"Amén\" cual deliciosa oblación la vida de todo aquel que sirve dócil y fiel."},{"t":"v","n":"2","x":"El corazón de todo aquel que has perdonado, Señor, agradecido, con amor, con humildad, siendo fiel, te sirve siempre con fervor, alegre de corazón en toda obra con tesón, siendo \"cristiano amén\""},{"t":"v","n":"3","x":"En humildad, con gran fervor, el alma llena de amor, con sencillez de corazón, reverencial devoción; en santo amor y todo bien, ardiente todo mi ser, quiero, Señor, servirte fiel, siendo \"cristiano amén\""},{"t":"c","x":"\"Cristiano amén\" yo quiero ser, colaborar y obedecer, servir en todo con alegría; \"Cristiano amén\" quiero ser."}]},{"s":"Himnario congregacional","n":"155","t":"Cual pendón glorioso","p":"420","c":"Letra: Daniel W. Whitle, 1887, Tr. Enrique Turrall; Música: James McGranahan, 1887","l":[{"t":"v","n":"1","x":"Cual pendón glorioso despleguemos hoy La bandera de la cruz, La verdad del Evangelio, el blasón Del solE /B B E"},{"t":"v","n":"2","x":"Prediquemos siempre la hermosa virtud De la sangre de Jesús; Como limpia de pecado al mortal, Y le dado de Jesús."},{"t":"v","n":"3","x":"En el mundo proclamemos con fervor La historia de la cruz; Bendigamos sin cesar al Redentor, Que nos compra la salud."},{"t":"v","n":"4","x":"En el cielo nuestro cántico será, ¡Aleluya a Jesús! Nuestro corazón allí rebosará De adio su paz y luz."},{"t":"c","x":"E lante, En pos de nuestro Salvador Con plena fe en el Rey! Adelante con valor!\n¡Adelante adelante, En pos de nuestro Salvador Con plena fe en el Rey! Adelante con valor!"}],"w":1},{"s":"Himnario congregacional","n":"155b","t":"En la montaña podrá no ser","p":"421","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"En la montaña podrá no ser, ni sobre rugiente mar; podrá no ser en la dura lid, do Cristo nos quiere emplear. Mas si él me ordenare seguir aquí, senderos que yo ignoré; confiando en él lediré: Señor do tú quieras que vaya, iré."},{"t":"v","n":"2","x":"Quizá hay palabras del Santo amor que Cristo me ordena hablar, y en los caminos do reina el mal algún pecador salvar. Señor si quisieras mi guía ser, mi oscura senda andaré; tu fiel mensaje podré anunciar y así lo que quieras diré."},{"t":"v","n":"3","x":"El vasto mundo lugar tendrá do pueda con noble ardor usar la vida que Dios me da por Cristo mi Salvador. Y siempre confiando en su gran bondad tus dones todos tendré, y alegre haciendo tu voluntad lo que quieras que sea seré."},{"t":"c","x":"Do tú necesites que vaya iré a los valles, montes o el mar, decir lo que quieras Señor podré, lo que quieras que sea seré."}],"w":1},{"s":"Himnario congregacional","n":"156","t":"Es ya tiempo de segar y tu sin meditar","p":"422–423","c":"Letra y Música: Charles Hutchinson Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Es ya tiempo de segar, y tú sin meditar, Declarando con holgura: \"No hay que trabajar\"; Mientras tanto que el Maestro te vuelve a llamar, Joven, Joven, Ven a trabajar."},{"t":"v","n":"2","x":"Las gavillas que recojas, joyas de esplendor, brillarán en la corona que dará el Señor; Busca pronto eternas joyas, Dios te premiará, Joven, joven, Ven, trabaja ya."},{"t":"v","n":"3","x":"Va pasando la mañana, y nunca volverá, Pronto el tiempo de la siega ya terminará; Te hallarás al fin vacío ante tu Creador, Joven, joven, Ven, trabaja ya."},{"t":"c","x":"Ven y ve los campos blancos, cómo están Aguardando manos que los segarán. Joven, ¡despierta! hazlo pronto y alerta, Sé el primero en decirle \"heme aquí Señor\" Por doquier se inclina la madura mies Que las auras mueven, y ¡que bella es! Joven, ¡despierta! hazlo pronto y alerta, Pocos días hay que restan para el segador.\nVen y ve los campos, blancos ya están los campos Aguardando manos que los segarán ¡Oh, joven joven! \"heme a Por doquier se inclina la madura mies, ved la mies Que las auras mueven, y ¡que bellas es! ¡Oh joven pronto y alerta, Pocos días hay que restan para el segador.\nVen y ve los campos blancos ¿Quien? ¡oh! ¿quién los segará? ¡Oh quí, sí, heme aquí ¡responde! Por doquier se inclina la madura mies, ¡oh, qué bella es! pronto y alerta, Pocos días hay que restan para el segador."}],"w":1},{"s":"Himnario congregacional","n":"157","t":"Firmes y adelante, huestes de la fe","p":"424","c":"Letra: Sabine Baring-Gould, 1864, Tr. J. B. Cabrera; Música: Arthur Seymour Sullivan, 1891","l":[{"t":"v","n":"1","x":"Firmes y adelante, huestes de la fe, sin temor alguno, que Jesús nos ve; Jefe soberano, Cristo al frente va, y la regia enseña, tremolando está."},{"t":"v","n":"2","x":"Al sagrado nombre de nuestro adalid, tiembla el enemigo y huye de la lid, nuestra es la victoria, dad a Dios loor; y óigalo el averno lleno de pavor."},{"t":"v","n":"3","x":"Muévese potente la iglesia de Dios de los ya gloriosos marchamos en pos; somos solo un cuerpo, y uno es el Señor; una la esperanza, y uno nuestro amor."},{"t":"v","n":"4","x":"Tronos y coronas pueden perecer, De Jesús la iglesia fiel habrá de ser; nada en contra suya prevalecerá porque la promesa nunca faltará."},{"t":"c","x":"Firmes y adelante, huestes de la fe, sin temor alguno, que Jesús nos ve."}]},{"s":"Himnario congregacional","n":"158","t":"Iglesia de Cristo, reanima tu amor","p":"425","c":"Letra: Charles Wesley, Tr. Mateo Cosido; Música: Atrib. a Michael Haydn en Sacres Melodias de William Gardinier, 1815","l":[{"t":"v","n":"1","x":"Iglesia de Cristo, reanima tu amor, Y Espera velando a tu Redentor, Jesús el Esposo, cubierto de honor, Viniendo se anuncia con fuerte clamor."},{"t":"v","n":"2","x":"Si falta en algunos el santo fervor, La fe sea de todos el despertador; Velad compañeros, velad sin temor, Que está con nosotros el Consolador."},{"t":"v","n":"3","x":"Quien sigue la senda del vil pecador, Se entrega en los brazos de un sueño traidor; Mas para los siervos del Buen Salvador, Orar y velar es su anhelo mejor."},{"t":"v","n":"4","x":"Coro. I glesia de Cristo, reanima tu amor, Y Espera velando a tutu Redentor."}],"w":1},{"s":"Himnario congregacional","n":"159","t":"Jesús está buscando voluntarios hoy","p":"426","c":"Letra: Vicente Mendoza; Música: Chales H. Gabriel","l":[{"t":"v","n":"1","x":"Jesús está buscando voluntarios hoy, Que a la ruda lucha luego quieran ir ¿Quién está disD. S. Cristo es nuestro combatir?"},{"t":"v","n":"2","x":"Nos cercan las tinieblas densas del error, Vamos sobre abismos hondos de maldad, Y para despuesto a escuchar su voz Siendo voluntario listo a la verdad."},{"t":"v","n":"3","x":"La lucha es contra el vicio, la pereza, el mal, Contra la ignorancia de la ley de Dios; Es una camtruirlas llama el Salvador Muchos voluntarios que amen sús en pos?"},{"t":"v","n":"4","x":"El triunfo significa que domine el bien, Que los hombres se amen, y que la verdad Reine en las conpaña que no tiene igual ¿Quieres ir a ella de Jeciencias, siendo su sostén, Y ha de ser, si ayudas una jefe no hay por qué temer, ¿Quieres ser un voluntario realidad."},{"t":"c","x":"De Cristo voluntario Tú puedes de Jesús? (o bien: ser, Otros ya se alistan hazlo tú;)"}],"w":1},{"s":"Himnario congregacional","n":"160","t":"Jesús te necesita, cristiana juventud","p":"427","c":"Letra y Música: Vicente Mendoza Polanco","l":[{"t":"v","n":"1","x":"Jesús te necesita, Cristiana juventud, Tu fuerza solicita, tu celo y tu virtud; La frente, pues, levanta, y empuña con valor La enseña sacrosanta de Cristo tu Señor."},{"t":"v","n":"2","x":"Es tiempo de que enciendas en fuego celestial Tu pecho, y luego emprendas la lucha sin igual Que libra a los humanos del vicio y la maldad Quitando de sus manos los grillos de impiedad."},{"t":"v","n":"3","x":"Quebranta las cadenas del mundo pecador, Redímelo de penas llevándolo al Señor; Anúnciale que Cristo letrajo libertad, Que todo fue provisto por Dios en su bondad."},{"t":"v","n":"4","x":"A noble lucha llama Jesús tu Salvador, Levántate y proclama los dones de su amor; Si siembra desalientos el malo con su voz No expreses tus lamentos, Que va contigo Dios."},{"t":"c","x":"A Cristo perteneces, Al mal no sirvas más; Si a Él hoy todo ofreces, Con Cristo reinarás."}],"w":1},{"s":"Himnario congregacional","n":"161","t":"Se ha llegado el momento","p":"428–429","c":"La hora decisiva; Letra y Música: Leonardo Flores Esparza, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Se ha llegado el momento, la hora es decisiva de hablar abiertamente de nuestro Salvador; no importa la amenaza de nuestros enemigos si Dios nos ha provisto de fuerza y de valor; inspiración divina son mártires que fieles ofrendaron sus vidas sin dar un paso atrás; nosotros con gran gozo envueltos en su sangre, llevaremos al mundo consuelo dicha y paz."},{"t":"v","n":"2","x":"Esta es nuestra hora de fe y de esperanza, hablémosle al Cordero en ferviente oración, para que su potencia santa nos ilumine y nuestra amada patria sea libre de dolor, la hora ha sonado en nuestro movimiento, vayamos a la lucha sin dudas, sin temor. Pues Dios ha prometido entregar en nuestras manos a nuestra amada patria para su redención."},{"t":"v","n":"3","x":"La hora es decisiva, no puede detenerse la marcha poderosa del pueblo del Señor que lleva cual antorcha encendida en sus almas el Espíritu Santo que Dios depositó. No estorbes el camino, regresate al rebaño y así unidos todos habrá gozo sin par, al estrechar la mano del que nos ha comprado a gran precio de sangre, Jesús nuestro Señor."},{"t":"c","x":"Adelante soldados de Jesús, no temamos pues él es nuestra luz. Y si alguno en la lucha nos tocara quedar, otro con gran potencia tomará nuestro lugar."}]},{"s":"Himnario congregacional","n":"162","t":"La senda ancha dejaré","p":"430","c":"Letra y Música: H. C. Ball, Arr. J. N. Benson","l":[{"t":"v","n":"1","x":"La senda ancha dejaré; yo quiero por la angosta andar; y muchos no sabrán por qué, mas voy a mi celeste hogar."},{"t":"v","n":"2","x":"Algunos quieren verme ir por el sendero de maldad; oír no puedo su llamar, pues voy a mi celeste hogar."},{"t":"v","n":"3","x":"Oh, ven conmigo pecador y sigue en pos del Salvador, ¿porqué no quieres tú buscar, la hermosa tierra más allá?"},{"t":"c","x":"No puede el mundo ser mi hogar, no puede el mundo ser mi hogar; en gloria tengo mi mansión; no puede el mundo ser mi hogar."}],"w":1},{"s":"Himnario congregacional","n":"163","t":"Levantate Cristiano","p":"431","c":"Letra y Música: H. Kingsbury","l":[{"t":"v","n":"1","x":"Levántate cristiano, levántate y trabaja, no dejes que tu vida se pase en la inacción; el que en el ocio vive al Hacedor ultraja; no llena sus deberes ni cumple su misión."},{"t":"v","n":"2","x":"Si quieres que la vida te ofrezca mil en can tos, si quieres que la dicha te inspire paz y amor, trabaja tú por Cristo sin miedos ni quebrantos, y un cielo de venturas verás en tu rededor."},{"t":"v","n":"3","x":"Trabaja para el mundo, trabaja para el cielo, sembrando buenas obras, sembrando en profusión. Virtud es el trabajo, alivio y fiel consuelo, y siempre en él se encuentra de Dios la bendición."},{"t":"v","n":"4","x":"Anuncia el evangelio glorioso, que es potencia, que al alma de consuelo, y paz, y santo amor. Que tus acciones hablen más alto que tu dicho, y así los hombres hallen de Dios la salvación."}]},{"s":"Himnario congregacional","n":"164","t":"¡Oh! Jóvenes, venid.","p":"432","c":"Letra: Oporto M.P.; Música: Desconocido","l":[{"t":"v","n":"1","x":"¡Oh! jóvenes, venid, su brillante pabellón Cristo ha desplegado ante la nación, A todos en sus filas os quiere recibir, Y con él a la pelea os hará salir."},{"t":"v","n":"2","x":"¡Oh! jóvenes, venid, el Caudillo Salvador Quiere recibiros en su derredor; Con él a la batalla salid sin vacilar, Vamos pronto, compañeros, vamos a luchar."},{"t":"v","n":"3","x":"Las armas invencibles del Jefe Guiador Son el Evangelio y su gran amor; Con ellas revestidos y llenos de poder, Compañeros, acudamos, vamos a vencer."},{"t":"v","n":"4","x":"Los fieros enemigos, engendros de Satán, Se hallan sostenidos por su capitán; ¡Oh! jóvenes, vosotros poneos sin temor A la diestra del Caudillo, nuestro Salvador."},{"t":"v","n":"5","x":"Quien venga a la pelea su voz escuchará; Cristo la victoria le concederá; Salgamos, compañeros, luchemos bien por él, Con Jesús conquistaremos inmortal laurel."},{"t":"c","x":"Vamos a Jesús, alistados sin temor, Vamos a la lid inflamados de valor, Jóvenes, luchemos todos contra el mal; En Jesús llevamos nuestro General."}]},{"s":"Himnario congregacional","n":"165","t":"¡Oh, juventud cristiana ve adelante!","p":"433","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"¡Oh, juventud cristiana, ve adelante! luchando por salvar los pecadores, que un galardón eterno has de ganarte y morar con el Señor de los señores."},{"t":"v","n":"2","x":"Si la tribulación suele cansarte, si el enemigo cruel tus pasos vela, da una mirada al cielo y al instante el Señor de los señores te consuela."},{"t":"v","n":"3","x":"Unidos vamos todos al combate, guardados por la sangre de Jesús, que él fue desde el huerto hasta el calvario, para lavar nuestros pecados en la cruz."},{"t":"c","x":"No dejes que otro tome la corona que Cristo ha preparado para ti, que será para todos en la gloria, cuando la trompeta suene para ti."}]},{"s":"Himnario congregacional","n":"166","t":"Placer verdadero es servir al Señor","p":"434–435","c":"Letra y Música: Frank C. Huston","l":[{"t":"v","n":"1","x":"Placer verdadero es servir al Señor; no hay obra más noble, ni paga mejor. Servirle yo quiero, con fe y con amor; servirle prometo desde hoy."},{"t":"v","n":"2","x":"Diré la verdad; le seré siempre fiel; no importa que todo lo pierda por él. Riquezas eternas en Cristo tendré. Desde hoy sólo a él serviré."},{"t":"v","n":"3","x":"El odio del mundo por él sufriré; pesada la carga sin duda será. Mas sé que su gracia no me ha de faltar. ¡A Cristo hasta el fin serviré!"},{"t":"c","x":"¡Servir a Jesús! ¡Servirle con fe! ¡Que paga tan rica tendré! No importa que sufra, sufrió el por mí. Sirviendo a Jesús, soy feliz."}]},{"s":"Himnario congregacional","n":"167","t":"Salid valientes batallones de Israel","p":"436–437","c":"Letra y Música: Desconocido, Arm. Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Salid valientes batallones de Israel cantad el triunfo y la victoria por la fe, Oh, juventud que tu simiente está en Jesús, eterna roca de los siglos firme es; a grandes voces pregonemos con fervor, el evangelio de justicia y santo amor, este mensaje por el mundo has de llevar; las almas gimen por el yugo de Satán."},{"t":"v","n":"2","x":"Legión celeste de los ángeles de luz serán ayuda a los soldados de Jesús, en fiera lucha, magna gloria de Jehová, irá hasta el frente resguardando sin cesar, y manifiesta luz del alba se verá; de retaguardia irá la gloria de Jehová; cuando invocares a Jesús, presto será; a socorrerte mi Jesús siempre irá."},{"t":"v","n":"3","x":"Marchad valientes a pelear contra Satán, ¡Oh! juventud, sin vacilar avanza ya; la voz guerrera que resuena por doquier, que luches siempre por Jesús es tu deber; mantén la fe, si presto estás para triunfar y el enemigo humillado quedará; como Josué, por la gracia y por la fe, a su mandato el sol se pudo detener."},{"t":"c","x":"Ya las huestes de Jehová ya se preparan a luchar contra Satán, y valientes se apresuran los soldados sus espadas a empuñar. Y aunque sangre de los mártires nos cueste, derraF G G /B B B C (o bien: mada quedará. En los campos o trincheras, ya sellado,) siempre el evangelio quedará."}],"w":1},{"s":"Himnario congregacional","n":"168","t":"Siempre venciendo, siempre triunfando","p":"438–439","c":"Letra: Vicente Mendoza y Polanco (1875–1955); Música: John Robson Sweney (1837–1899)","l":[{"t":"v","n":"1","x":"Siempre venciendo, siempre triunfando, Al frente vemos al Rey, En la batalla ruda guiando A los que son de su grey; Ved cual avanzan valientes Siempre cubiertos de honor Mientras entonan sonrientes Himnos de gloria al Señor."},{"t":"v","n":"2","x":"Siempre venciendo, siempre triunfando, ¿Quién este Rey puede ser?, ¿Quiénes las huestes que va guiando con infinito poder? Él es Señor de lo creado, El Redentor Celestial; Ellos, los que ha rescatado De los poderes del mal."},{"t":"v","n":"3","x":"Siempre venciendo, siempre triunfando, Oh Salvador inmortal, Que a tu paso vas derrumbando Todos los tronos del mal; Haz que las huestes que hoy guías Siéndote fieles aquí, Hallen al fin de sus días Toda la paz que hay en Ti."},{"t":"c","x":"No han de triunfar siempre los fuertes, Ni es del atleta el ganar; Sólo es del fiel y sincero Siempre por gracia triunfar."}]},{"s":"Himnario congregacional","n":"169","t":"Somos obreros del Señor","p":"440","c":"Letra: Minnie U. Pure; Música: Charles Hutchinson Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Somos obreros del Señor, La mies segamos con amor, Las nuevas damos de la salvación de Cristo al pecador; Hoy trabajamos por amor a Cristo, nuestro Salvador, Que por nosotros vida dio en el calvario do murió."},{"t":"v","n":"2","x":"El evangelio predicad, A todo el mundo sin cesar, Y sin temor y con lealtad hoy su bandera levantad; En nuestras manos él confió, esta gran comisión de amor, Las nuevas dad y no tardéis que la victoria obtendréis."},{"t":"v","n":"3","x":"Horas y días pasarán, El tiempo nunca volverá, Si no predicas a Jesús muchos jamás verán la luz; Hoy es el día de salvación, el mundo pereciendo está, Oh! no desprecies el honor que Jesucristo hoy te da."},{"t":"c","x":"A la siega acudid, El maestro os llama, Todos de ben trabajar, tarde y mañana; Corre el tiempo y jamás, nunca hermanos volverá; ¡Ven, obrero! ¡ven a trabajar!"}]},{"s":"Himnario congregacional","n":"
