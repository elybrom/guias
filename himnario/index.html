 quedará."},{"t":"v","n":"2","x":"Legión celeste de los ángeles de luz serán ayuda a los soldados de Jesús, en fiera lucha, magna gloria de Jehová, irá hasta el frente resguardando sin cesar, y manifiesta luz del alba se verá; de retaguardia irá la gloria de Jehová; cuando invocares a Jesús, presto será; a socorrerte mi Jesús siempre i-"},{"t":"v","n":"3","x":"Marchad valientes a pelear contra Satán, ¡Oh! juventud, sin vacilar avanza ya; la voz guerrera que resuena por doquier, que luches siempre por Jesús es tu deber; mantén la fe, si pres to estás para triunfar y el enemigo humillado quedará; como Josué, por la gracia y por la fe, a su mandato el sol se pudo dete -"},{"t":"c","x":"rá. Ya las huestes de Jehová ya se preparan a lu -"}]},{"s":"Himnario congregacional","n":"168","t":"Siempre venciendo, siempre triunfando","p":"438–439","c":"Letra:    Vicente Mendoza y Polanco (1875–1955); Música: John Robson Sweney (1837–1899)","l":[{"t":"v","n":"1","x":"Siempre venciendo, siempre triunfando, Al frente vemos al Rey, En la batalla ruda guiando A los que son de su grey; Ved cual avanzan valientes Siempre cubiertos de hoLetra: Vicente Mendoza y Polanco (1875–1955) nor Mientras entonan sonrientes Himnos de fuertes, Ni es del atleta el ganar; Sólo es del fiel y sincero Siempre por gracia triunfar."},{"t":"v","n":"2","x":"Siempre venciendo, siempre triunfando, ¿Quién este Rey puede ser?, ¿Quiénes las huestes que va guiando con infinito poder?. Él es Señor de lo creado, El Redentor CelesMúsica: John Robson Sweney (1837–1899) tial; Ellos, los que ha rescatado De los po -"},{"t":"v","n":"3","x":"Siempre venciendo, siempre triunfando, Oh Salvador inmortal, Que a tu paso vas derrumbando Todos los tronos del mal; Haz que las huestes que hoy guías Siéndote fieles aquí, Hallen al fin de sus días Toda la"},{"t":"c","x":"gloria al Señor. deres del mal. No han de triunfar siempre los paz que hay en Ti."}]},{"s":"Himnario congregacional","n":"169","t":"Somos obreros del Señor","p":"440","c":"Letra:    Minnie U. Pure; Música: Charles Hutchinson Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Somos obreros del Señor, La mies segamos con amor, Las nuevas damos de la salvación de Cris to al pecador; Hoy trabajamos por amor a Cristo, nuestro Salvador, Que por nosotros vida dio en el calvario do murió. tarde y mañana; Corre eltiempo y jamás, nunca hermanos volverá; ¡Ven, obrero! ¡ven a trabajar! Letra: Minnie U. Pure"},{"t":"v","n":"2","x":"El evangelio predicad, Atodo el mundo sin cesar, Y sin temor y con lealtad hoy su bandera levantad; En nues tras manos él confió, esta gran comisión de amor, Las nuevas dad y no tardéis que la victoria obtendréis. Música: Charles Hutchinson Gabriel (1856-1932)"},{"t":"v","n":"3","x":"Horas y días pasarán, El tiempo nunca volverá, Si no predicas a Jesús muchos jamás verán la luz; Hoy es el día de salvación, el mundo perecien do está, Oh! no desprecies el honor que Jesucristo hoy te da."},{"t":"c","x":"A la siega acudid, El maestro os llama, Todos de ben trabajar,"}]},{"s":"Himnario congregacional","n":"170","t":"Somos soldados y vamos a la lucha","p":"441","c":"","l":[{"t":"v","n":"1","x":"Somos soldados y vamos a la lucha con valor, porque llevamos por Jefe a Jesús el Salvador. No nos arreda el combate, pelearemos con vigor; un galardón nos espera en la obra del Señor. mor; lavará tus maldades, vil pecador; ven, acude gozoso, al bendito Señor. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Si tú te sientes cansado, ven, acude al Redentor; aliviará él tu carga, te dará nuevo vigor, para luchar en las huestes redimidas por su amor. ¡Oh, pecador, no vaciles, sé soldado del Señor! rá, seguiremos haciendo su voluntad; la victoria, por siempre, Jesús nos dará."},{"t":"v","n":"3","x":"Cristo murió en el calvario, por nosotros en la cruz, y nos lavó con su sangre, para darnos nueva luz, somos limpios de pecado por la gracia de su amor, él nos libró de las garras del terrible tentador."},{"t":"v","n":"4","x":"Vamos felices cantando \"Aleluyas\" al Señor; a grande voz anunciamos las promesas de su amor, pues grandes cosas ha hecho con el pobre pecador. Bendito seas por siempre ¡Oh, divino Salvador!"},{"t":"c","x":"Escucha el llamamiento del Redentor; abre tu corazón, te llama con aCon gozo lucharemos contra el mal, Cristo está con nosotros y nos ayuda-"}]},{"s":"Himnario congregacional","n":"171","t":"Soy soldado de Cristo","p":"442–443","c":"Letra:    Henry Cleofas Ball; Música: Mrs. Charles Hammond Morris (Lelia Naylor Morris, 1862–1929)","l":[{"t":"v","n":"1","x":"Soy soldado de Cristo, de Cristo el Salvador, Pelearé yo por él la batalla de la fe; Con mis ojos así puestos voz de Cristo que nos llama: \"A la batalla, a la baLetra: Henry Cleofas Ball talla\", Oíd la voz de Cristo que nos dice: ¿Quiénes van hoy a pelear?\" Yo soy soldado de JesuAleluya cristo Y por fe la lucha venceré, ¡Oh sí! Yo soy soldado de Jesucristo, Y victoria y triunfo obtendré."},{"t":"v","n":"2","x":"La Palabra de Dios es la espada de la fe Que me ayuda a pelear por Jesús el Salvador; Lucharé, triunfaré; con las Música: Mrs. Charles Hammond Morris (Lelia Naylor Morris, 1862–1929)"},{"t":"v","n":"3","x":"¿No quisieras venir tú también en pos de él Y pelear hoy por él la batalla de la fe? Si eres fiel al Señor la co -"},{"t":"v","n":"4","x":"Pronto, yo bien lo sé, la batalla cesará, Y con Cristo así reinaremos más allá; ¡Oh, qué dicha indecible se -"},{"t":"c","x":"en mi Capitán Pelearé yo en contra de Satán. huestes del Señor, Me verás hoy pelear en la batalla. Oíd la rona te dará Y con él gozarás felicidad. rá con él vivir Donde no hay más tristeza que sufrir!."}]},{"s":"Himnario congregacional","n":"172","t":"Surjan regias vanguardias","p":"444–445","c":"","l":[{"t":"v","n":"1","x":"Surjan regias vanguardias En pie, Juveniles huestes, Id en pos del Maestro, El Rey, Capitán y Dios. Es tiempo de partir vanguardias de Jesús, La patria ansiosa busca un Salvador y Dios. Letra y Música: Manuel V. Flores No retrocedas en tu labor, A la juventud perdida ve; Háblales de Jesús, Salud de su dolor, Y rinde eterna gloria al Salvador."},{"t":"v","n":"2","x":"Surjan regias vanguardias En pie, juveniles huestes, Id al mundo irredento, Del Hijo de Dios hablad. La aguda adversidad Indómitos venced, Y un cántico de triunfo se oiga resonar."},{"t":"v","n":"3","x":"Surjan regias vanguardias De las redimidas huestes Anunciando de gracia Las nuevas de salvación; Digamos con afán Que Cristo nos salvó, Que al pecador contrito quiere redimir."},{"t":"c","x":"Siembra el mensaje del Redentor, Cumple la ordenanza de tu Rey,"}]},{"s":"Himnario congregacional","n":"173","t":"Trabajemos misioneros","p":"446","c":"Letra:    Pedro Ontiveros, ICI.; Música: Navor Zepeda, ICI.","l":[{"t":"v","n":"1","x":"Trabajemos misioneros, de este mundo en derredor, Rescatemos a los hombres de las redes del opresor, Conducidlos a la fuente de salud y bendición, Solo Cristo salva y redime al ñor les quiere dar, sólo en Jesús el alma hallará salvación y vida eternal. Letra: Pedro Ontiveros, ICI."},{"t":"v","n":"2","x":"Trabajemos misioneros en las huestes de Jesús, Anunciemos que en Cristo hay amor, hay bondad y paz, Traslademos a los hombres de tiniebas a la luz, Que el tiempo ya de la siega se aMúsica: Navor Zepeda, ICI."},{"t":"v","n":"3","x":"Si eres salvo se testigo y hoy ven a trabajar, Habla presto y no calles el amor del Salvador, Jesucristo hoy te llama a los campos de la mies, Ven hermano, ven que tú puedes las Himno: \"Cuerpo Nacional de Misioneros\""},{"t":"c","x":"pobre pecador. cerca más y más. Muchas almas hay,que quisieran disfrutar, Gracia sin igualque elSealmas rescatar."}]},{"s":"Himnario congregacional","n":"174","t":"Venimos cantando alabanzas","p":"447","c":"","l":[{"t":"v","n":"1","x":"Venimos cantando alabanzas, trayendo mensaje de amor; mensaje que sale del alma, porque Cristo ya mora en mi ser. Veser. mí, lo que Cristo vino atraer. Es aer. Letra y Música: Desconocido, Arm. Isaac García Contreras"},{"t":"v","n":"2","x":"Iremos cantando y llorando, sembrando simiente de amor; mas luego vendremos gozosos, trayendo gavillas de amor. Imor."},{"t":"c","x":"Es amor, es amor, lo que Cristo vino a traer, para ti, para"}]},{"s":"Himnario congregacional","n":"175","t":"Voy feliz al dulce hogar","p":"448","c":"Letra:   Henry Cleofas Ball; Música: R. H. Cornelius","l":[{"t":"v","n":"1","x":"Voy feliz al dulce hogar, por fe en Jesús, mientras lucho por traer almas a la luz; dardos encendidos mil, vienen contra mí, ver al Salvador; quiero ver su rostro lleno de amor. En aquel gran día, yo he de cantar: Ya pasó todo afán, todo mi pesar. Letra: Henry Cleofas Ball"},{"t":"v","n":"2","x":"En las olas del turbión, Cristo guardará mi barquilla, y guiará hasta el puerto allá. Yo tranquilo puedo estar, mi piloto es él; Música: R. H. Cornelius"},{"t":"v","n":"3","x":"En servir al Salvador, por los valles voy, donde muchas sombras hay más seguro estoy. Muchos triunfos obtendré, nunca faltará"},{"t":"c","x":"mas yo sé, por la fe, venceré aquí. es mi Rey, tengo fe, sé que él es fiel. ¡Oh! sí, quiero verle, mi Jesús, es la luz, él me sostendrá."}]},{"s":"Himnario congregacional","n":"176","t":"Ya las huestes se aprestan","p":"449","c":"","l":[{"t":"v","n":"1","x":"Ya las huestes se aprestan para la batalla, es Jesús el capitán que a todos nos guiará; y con él a la cabeza no hay que vacilar, rudo de la lid, yo quiero siempre listo, valiente combatir; hasta que en gloria pueda verle, mi carrera al terminar, y vida eterna con él gozar. Letra y Música: H. R. Palmer."},{"t":"v","n":"2","x":"Las legiones de Jesús de triun fo en triunfo avanzan ¿no las vez con qué valor combaten contra el mal? ¿puedes tú quedar dormido o indiferente"},{"t":"v","n":"3","x":"Date prisa, no vaciles, él te solicita, si amas a Jesús también a otros amarás; y si andan en las sendas de la iniquidad,"},{"t":"v","n":"4","x":"Es la mies muy grande y los obreros son muy pocos; desde hoy mi Salvador hallarme él podrá; trabajando en su mies en busca de las almas,"},{"t":"c","x":"de seguro al triunfo nos llevará. cuando otros luchan sin descansar? Yo quiero estar con Cristo, en lo a los pies de Cristo los llevarás. y con su poder él me sostendrá."}]},{"s":"Himnario congregacional","n":"177","t":"Ya sea en el valle do el peligro esté","p":"450–451","c":"Letra:    H. C. Ball; Música: C. Austin Miles","l":[{"t":"v","n":"1","x":"Ya sea en el valle do el peligro es té O que en la luz gloriosa de paz habite yo, A mi Jesús diré, \"Tu voluntad haré\" Si Cristo me guía doquiera yo iré. Letra: H. C. Ball no temeré, con gozo iré, conmigo va; Es grato servir a Jesús, llevar la cruz; Si Cristo conmigo va, Yo iré."},{"t":"v","n":"2","x":"Si al desierto quiere Jesús que vaya yo, Llevando buenas nuevas de santa salvación, Si allí en dura lid, mi campo señaló, A Cristo yo sigo, sin más dilación. Música: C. Austin Miles"},{"t":"v","n":"3","x":"Aunque mi parte sea mi dura cruz llevar, Diré a mis hermanos también su gran poder; Contento quedaré, mi luz haré brillar, Testigo de Cristo doquiera seré."},{"t":"v","n":"4","x":"La voluntad de Cristo yo quiero obedecer, Pues en la Santa Biblia encuentro mi saber, Y con su gran poder, al mundo venceré, Si él va conmigo, doquiera yo iré."},{"t":"c","x":"Si Cristo conmigo va, yo iré Yo"}]},{"s":"Himnario congregacional","n":"178","t":"Yo quiero trabajar por el Señor","p":"452","c":"Letra:    Pedro Grado; Música: Isaiah Baltzell","l":[{"t":"v","n":"1","x":"Yo quiero trabajar por el Señor, Confiando en su palabra y en su a mor, Quiero yo cantar y orar Y ocupado siempre estar, en la ñor, Sí, mi anhelo es orar y ocupado siempre estar enla Obra del Señor. Letra: Pedro Grado"},{"t":"v","n":"2","x":"Yo quiero cada día trabajar, Y esclavos del pecado libertar; Conducirlos a Jesús, Nuestro guía nuestra luz, en la del Señor Música: Isaiah Baltzell"},{"t":"v","n":"3","x":"Yo quiero ser obrero de valor, Confiando en el poder del Salvador; El que quiera trabajar, Hallará tam bién lugar, en la"},{"t":"c","x":"Obra del Señor. Trabajar y orar En la Obra,en la Obradel SeTrabajary o rar, Trabajar y orar"}]},{"s":"Himnario congregacional","n":"179","t":"Yo quisiera hablarte del amor de Cristo","p":"453","c":"","l":[{"t":"v","n":"1","x":"Yo quisiera hablarte del amor de Cristo, pues en él hallé un amigo fuerte y fiel, por su gracia transformó mi vida enpudo amarme como Cristo, es incomparable su amistad; sólo el pudo redimirme del pecado, por su amor y su bondad. Letra y Música: Charles Frederick Weigle (1871-1966), Tr. S. D. Athans"},{"t":"v","n":"2","x":"Mi alma estaba llena de ayes y tristezas, llena estaba de miserias y dolor; con ternura Cristo me tendió la"},{"t":"v","n":"3","x":"Cada día viene a darme nuevo aliento, a mi corazón infunde dulce paz; no comprenderé por qué vino a sal -"},{"t":"c","x":"tera, lo que en esta vida soy lo debo a él. mano, y me guió por el sendero del amor. Nadie varme, hasta que en el cielo pueda ver su faz."}]},{"s":"Himnario congregacional","n":"180","t":"Yo soy soldado de Jesús","p":"454","c":"Música: Inglés","l":[{"t":"v","n":"1","x":"Yo soy soldado de Jesús Salvado por su amor; nos coronará; Después de la batalla nos coronará En aquella Santa Sión Más allá más allá en aquella san ta Sión. DesMás allá Más allá pués de la batalla nos coronará En aquella Santa Sión Letra y arreglo: Henry Cleofas Ball"},{"t":"v","n":"2","x":"No temeré llevar su cruz, Sufriendo con valor. Música: Inglés"},{"t":"v","n":"3","x":"Lucharon otros por la fe Y yo luchar podré,"},{"t":"v","n":"4","x":"Por mi Señor yo pelearé Confiando en su poder."},{"t":"v","n":"5","x":"Es menester que sea fiel, Que nunca vueva atrás;"},{"t":"v","n":"6","x":"Que siga siempre en pos de él, Y me guiará en paz."},{"t":"c","x":"Después de la batalla nos coronará, Dios nos coronará; Dios"}]},{"s":"Himnario congregacional","n":"181","t":"Yo tengo una esperanza","p":"455","c":"","l":[{"t":"v","n":"1","x":"Yo tengo una esperanza muy grande y muy firme: que allá en las mansiones nos hemos de ver; por eso, confiado en su amor sagrado, como fiel soldado, dar para llegar a la gloria, donde yo quiero morar. Yo soy embajador de Cristo el Salvador, me voy a preparar a predicar su amor; el día ya se acerca, señales ya se ven, que Cristo está a la puerta diciendo: ven y ven. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Pero si algún día se lle gara mi cita, que Dios me solicita, yo tengo que ir; por eso, confiado en mi Jesucristo, como fiel soldado,"},{"t":"v","n":"3","x":"Cuando yo me vaya de esta triste vida, con gozo profundo, les voy a dejar un grato recuerdo de mis aflicciones, que allá en las mansiones,"},{"t":"c","x":"yo voy a luchar. yo voy a luchar. Cristo bendito del cielo, es el que me ha de ayunos hemos de ver."}]},{"s":"Himnario congregacional","n":"181b","t":"Todo este mundo es confusión","p":"456–457","c":"","l":[{"t":"v","n":"1","x":"Todo este mundo es confusión, todo está lleno de maldad; en todo hay falta de amor, en todo falta la amistad. Un mundo con problemas no vivirá, y tú conoces a Jesús, Letra y Música: Pablo Garrido, 1990, ICIAR, Arm. Isaac García Contreras y este reto es del Señor para ti: cambia este mundo con su ará. Oye, vive y habla ahora el evangelio de la paz, ven, lucha y cambia el mundo con el amor que da Jesús."},{"t":"v","n":"2","x":"Duro este gran trabajo es, mas un apoyo tengo en mí Él, que conmigo estará, me apoyará fiel hasta el fin. Problemas si me seguirán yo lo sé, pero mi vida está en Él; y perseguido yo quizás estaré mas desde hoy me a - - - yuda -"},{"t":"v","n":"3","x":"Deja tu orgullo hoy aquí, oye la voz del Dios de amor, te hace un llamado a cambiar, a ser cristiano de verdad. Un mundo con problemas no vivirá, y tú conoces a Jesús, y este reto es del Señor para ti: cambia este mundo para"}]},{"s":"Himnario congregacional","n":"182","t":"Cerca de ti, Señor","p":"458","c":"Letra:    Sarah F. Adams, Trad. Thomas M. Westrup; Música: Lowel Mason","l":[{"t":"v","n":"1","x":"Cerca de Ti Señor, quiero morar, Tu grande y tierno amor quiero gozar. Hazme tu rostro ver En comunión Letra: Sarah F. Adams, Trad. Thomas M. Westrup"},{"t":"v","n":"2","x":"Pasos inciertos doy, el sol se va; Mas si contigo estoy no temo ya. Y fiel a Ti, Jesús Siempre seré Música: Lowel Mason"},{"t":"v","n":"3","x":"Día feliz veré creyendo en Ti, En que yo habitaré, cerca de Ti. Y mi alma gozará, Cerca de Ti."},{"t":"c","x":"Llena mi pobre ser, limpia mi corazón. Himnos de gratitud ferviente cantaré, Mi voz alabará, tu dulce nombre allí,"}]},{"s":"Himnario congregacional","n":"183","t":"Cerca de ti yo voy Señor","p":"459","c":"","l":[{"t":"v","n":"1","x":"Cerca de ti yo voy, Señor cerca de ti no hay temor; contigo voy, contigo estoy, mi ser te entrego a ti Señor. fuerte, mi roca eterna, mi es condedero fiel, Señor Letra y Música: Francisco SánchezMuñiz, ICI, 1945"},{"t":"v","n":"2","x":"No temeré la tempestad, que a mi alma quiera perturbar; conmigo vas, conmigo estás tú solo das paz, seguridad."},{"t":"v","n":"3","x":"Cerca de ti anhelo estar y de tu mano caminar; hasta llegar, mi buen Jesús a aque lla hermosa cuidad de Luz."},{"t":"c","x":"Tu eres mi amparo, mi fortaleza, mi pronto auxilio en la aflicción; castillo"}]},{"s":"Himnario congregacional","n":"184","t":"Cerca, más cerca, ¡Oh! Dios de ti","p":"460","c":"Letra:    Vicente Mendoza Polanco (1875–1955); Música: Mrs. Charles Hammond Morris (Lelia Naylor Morris, 1862–1929)","l":[{"t":"v","n":"1","x":"Cerca, más cerca, ¡Oh! Dios, de ti Cerca yo quiero mi vida llevar; Cerca, más cerca, ¡Oh! Dios, de ti Cerca a tu gracia que puede salvar, Cerca a tu gracia que puede salvar. Letra: Vicente Mendoza Polanco (1875–1955)"},{"t":"v","n":"2","x":"Cerca, más cerca, cual pobre soy, Nada, Señor, yo te puedo ofrecer; Sólo mi ser, contrito te doy, Pueda contigo la paz obtener, Pueda contigo la paz obtener. Música: Mrs. Charles Hammond Morris (Lelia Naylor Morris, 1862–1929)"},{"t":"v","n":"3","x":"Cerca, más cerca, Señor de ti, Quiero ser tuyo dejando el pecar; Goces y pompas vanas aquí, Todo Señor pronto quiero dejar, Todo, Señor, pronto quiero dejar."},{"t":"v","n":"4","x":"Cerca, más cerca, mientras el ser, Aliente vida y busque tu paz; Y cuando al cielo pueda ascender, Ya para siempre contigo estaré, Ya para siempre contigo estaré."}]},{"s":"Himnario congregacional","n":"185","t":"Da lo mejor al Maestro","p":"461","c":"Letra:    Howard B. Grose, Tr. Speros D. Athans; Música: Charlotte A. Barnard","l":[{"t":"v","n":"1","x":"Da lo mejor al Maestro: ¡tu fuerza, tu juventud! sé pala dín decidido, de la verdad y del bien. Dueño sea él de tu vida, sírvele con fe y amor. Todo a su gracia lo de debes, ¡Dale a Jesús lo mejor! Letra: Howard B. Grose, Tr. Speros D. Athans"},{"t":"v","n":"2","x":"Da lo mejor al Maestro: entrégale el corazón. Rico y feliz quiere hacerte; es gran tesoro su amor. Deja que llene tu alma, ¡Dale a Jesús lo mejor! Música: Charlotte A. Barnard"},{"t":"v","n":"3","x":"Da lo mejor al Maestro: haz por amor suyo el bien. Di a los perdidos que él salva, que él cura todo dolor. Que ama, consuela y ayuda, ¡Dale a Jesús lo mejor!"},{"t":"c","x":"Da lo mejor al Maestro: a combatir por él ven, Todo elfervor de tu alma, tu exuberante sa lud. Nadie como él te ha amado; digno es de tu devoción. Para servirnos él vino; Sirve tú a otros también"}]},{"s":"Himnario congregacional","n":"186","t":"Fui bautizado como manda el Salvador","p":"462","c":"","l":[{"t":"v","n":"1","x":"Fui bautizado como manda el Salvador, qué grande gozo siento yo en mi corazón; ya mis pecados los borró mi Salvaré a mi Jesús, ya para mi lo de este mundo se acabó; quedo ayudado de su cruz y proseguir en sus caminos quiero yo. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Adiós mundo que hasta ayer estuve en ti, donde el pecado alimentaba mi vivir; yo siento gozo desde que me bauti -"},{"t":"v","n":"3","x":"No miro más que el camino de la fe donde muy pocos han podido caminar; pero hoy recibo la corona de la"},{"t":"v","n":"4","x":"El refugio de Jesús es mi sostén, nunca podré desfallecer en mi deber; alabanzas con gran gozo canta -"},{"t":"c","x":"dor; quiero llegar puro y limpio a su mansión. cé, y de volver a pecar mejor morir. Seguife, y a su patria muy feliz quiero llegar. ré y a mi Señor con gran gozo serviré."}]},{"s":"Himnario congregacional","n":"187","t":"Jesús yo he prometido","p":"463","c":"Letra:    John Ernest Bode (1816-1874), Tr. Juan Bautista Cabrera Ivars; Música: Arthur Henry Mann (1850-1929)","l":[{"t":"v","n":"1","x":"Jesús yo he prometido servirte con amor, concédeme tu gracia, mi amigo y Salvador. No temeré la lucha si tú a mi lado estás, ni perderé el camino si tú guiando vas. Letra: John Ernest Bode (1816-1874), Tr. Juan Bautista Cabrera Ivars"},{"t":"v","n":"2","x":"El mundo está muy cerca y abunda tentación; sutil es el engaño y necia la pasión. Ven tú, Jesús, más cerca, mostrando tu piedad, y escuda al alma mía de toda iniquidad. Música: Arthur Henry Mann (1850-1929)"},{"t":"v","n":"3","x":"Cuando mi mente vague, ya incierta, ya veloz, concédeme que escuche, Jesús, tu clara voz. Anímame si paro, inspírame también, repréndeme si temo en todo hacer el bien."},{"t":"v","n":"4","x":"Jesús, tú has prometido a todo aquel que va siguiendo tus pisadas, que al cielo llegará, sostenme en el camino, y al fin con dulce amor trasládame ha tu gloria, mi amigo y Salvador."}]},{"s":"Himnario congregacional","n":"188","t":"Mientras caminamos hacia el cielo azul","p":"464","c":"","l":[{"t":"v","n":"1","x":"La sombra de la cruz Mientras caminamos hacia el cielo azul, sufriremos pruebas, Sí, essas pruebas vienen siendo bendición a la sombra de la cruz. Por la cruz él nos guiará a la mansión, le veremos faz a faz. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Cristo allí tomó la carga sobre sí, él llevó nuestro dolor. Por la cruz él nos guiará a la mansión, le veremos faz a faz."},{"t":"c","x":"¿Vives tú bajo la sombra de la cruz, do el Señor murió por ti?"}]},{"s":"Himnario congregacional","n":"189","t":"Aquí me tienes ante tus plantas","p":"465","c":"","l":[{"t":"v","n":"1","x":"Loor a ti Aquí me tienes ante tus plantas porque en ti encuentra gozo mi ser; sé que contigo nada me falta, sé que en el cielo tu gloria he de ver. siempre a tu nombre santo mis labios darán loor. Letra y Música: José Nuñez, ICIAR, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Yo no soy digno de tu amor santo, mas por tu sangre lavado fui, tu vida diste por mis pecados, gracias te doy mi Jesús gracias mil."},{"t":"v","n":"3","x":"A ti te entrego toda mi vida, a ti te entrego todo mi ser; nunca te apartes, nunca me dejes, porque contigo siempre he de vencer."},{"t":"v","n":"4","x":"Sé que con nada podré pagarte el sacrificio hecho por mí, sólo te pido seguirte amando toda mivida hasta llegar a ti."},{"t":"c","x":"Cristo mi Redentor, Cristo mi Salvador,"}]},{"s":"Himnario congregacional","n":"190","t":"Marchemos presurosos por la senda","p":"466–467","c":"","l":[{"t":"v","n":"1","x":"Marchemos presurosos por la senda Que el Divino Salvador nos enseñó, Oigamos su Palabra pura y bella Que en su santo Evangelio nos dejó; Guardemos sus mandatos con firmeza Desechando el egoísmo y el error, ción; EnTi hayconsuelo, En Ti hay amor, En Ti hay bondad,En Ti hay perdón. Letra y Música: Pedro Osorno, ICIAR."},{"t":"v","n":"2","x":"Oremos sin cesar de noche y día, Alabemos al sublime Salvador, Rogándole que sea nuestro guía, Que nos guarde en su divino amor; Pidámosle la fuerza suficiente Para poder resistir la tentación; Cantémosle canciones diferentes, Agradecidos de todo cora -"},{"t":"v","n":"3","x":"Cantemos con alegres corazones Al Señor que de su gracia nos llenó, Cantemos por doquier las bendiciones Que su mano divina derramó: Cantemos con amor al Dios Eterno Porque nos da de su bondad y su per-"},{"t":"c","x":"zón. ¡Sólo en Ti hay paz, oh Redentor! En Ti hay piedad y salva -"}]},{"s":"Himnario congregacional","n":"190b","t":"Mi espíritu, alma y cuerpo","p":"467","c":"Letra:    H. C. E.; Música: Ira D. Sankey","l":[{"t":"v","n":"1","x":"Mi espíritu, alma y cuerpo, Mi ser, mi vida entera, Cual viva, santa ofrenda, Entrego a Ti, mi Dios. cienda el fuego santo, Su sello celestial. Letra: H. C. E."},{"t":"v","n":"2","x":"Soy tuyo, Jesucristo, Comprado con tu sangre; Contigo haz que ande En plena comunión. Música: Ira D. Sankey"},{"t":"v","n":"3","x":"Espíritu Divino, Del Padre la promesa Sedienta, mi alma anhela De Ti la santa unción."},{"t":"c","x":"Mi todo a Dios consagro En Cristo, el vivo altar; Des -"}]},{"s":"Himnario congregacional","n":"191","t":"Más santidad dame","p":"468","c":"Letra:   My Prayer; Música: Philip Paul Bliss (1838-1876)","l":[{"t":"v","n":"1","x":"Más santidad dame, Más odio al mal, Más calma en las penas, Más alto ideal; Más fe en mi maestro, Más consagración, Más celo en servirle, Más grata oración. Letra: My Prayer"},{"t":"v","n":"2","x":"Más prudente hazme, Más sabio en él, Más firme en su causa, Más fuerte y más fiel; Más recto en la vida, Más triste al pecar, Más humilde hijo, Más pronto en amar. Música: Philip Paul Bliss (1838-1876)"},{"t":"v","n":"3","x":"Más pureza dame, Más fuerza en Jesús, Más de su dominio, Más paz en la cruz; Más rica esperanza, Más obras aquí, Más ansia del cielo, Más gozo allí."}]},{"s":"Himnario congregacional","n":"192","t":"Mi Buen Jesús, mi Salvador","p":"469","c":"","l":[{"t":"v","n":"1","x":"Mi buen Jesús, mi salvador, Rendido estoy a quí a tus pies, ¡Oh! mi Señor; tu inmenso a mor me conquistó; Mi adoración de corazón te ofrezco hoy. nita compasión Para morir en cruenta cruz Por nuestras culpas, Y así alcanzar La más perfecta redención. Letra y Música: Francisco Sánchez Muñiz, ICI"},{"t":"v","n":"2","x":"Nunca pensé, mi buenSeñor, Que mi vida llena de mal y perdición Cambiaras Tú, con tanto amor, Que por dolor me dieras gozo y salvación."},{"t":"v","n":"3","x":"Anhelo amarte más y más, Señor Jesús, con infinita devoción; Servirte fiel, de corazón, En humildad y en espíritu yverdad."},{"t":"c","x":"Divino amor Que Dios mostró de tal manera Que a su Hijo dio Con infi -"}]},{"s":"Himnario congregacional","n":"193","t":"Mi deleite es andar con el Señor","p":"470","c":"","l":[{"t":"v","n":"1","x":"Mi deleite es andar con el Señor que me salvó con preciosa sangre carmesí; de las dudas y oscuridad mi alma libertó ¡Gloria a Dios! es mi deleite aél; él mis pasos guiará, él mi vida velará; mi deleite es andar con él. Letra y Música: Desconocido, Arm. Isaac García Contreras."},{"t":"v","n":"2","x":"Mi deleite es saber que el Señor conmigo está en la sombra y en el cruel dolor, en las luchas, en las pruebas, él jamás me faltará, ¡Gloria a Dios! él es mi Salva -"},{"t":"v","n":"3","x":"Mi deleite eterno ha de ser morar con él allá do jamás lo dejaré de ver; ¡Oh, qué gloria a de ser! cuando mi lengua cantará. Con Jesús voy a permane -"},{"t":"c","x":"dor. Mi deleite es andar con él, mi deleite es andar con"}]},{"s":"Himnario congregacional","n":"194","t":"Muchos que viven en tu derredor","p":"471","c":"Letra:    J. F. Swanson; Música: George Stark Schuler (1882–1973)","l":[{"t":"v","n":"1","x":"Muchos que viven en tu derredor Tristes, hambrientos están; Tú por tu vida, les puedes llevar Gozo, luz y bendición. gloria, ¡Oh! Jesús; Todos los días y hoy quiero ser Testigo tuyo, Señor, por doquier. Letra: J. F. Swanson"},{"t":"v","n":"2","x":"Di a los tristes que Dios es amor, El quiere dar su perdón A los que vienen a Cristo Jesús Buscando paz, salvación. Música: George Stark Schuler (1882–1973)"},{"t":"v","n":"3","x":"Toda tu vida hoy rinde al Señor, Cada momento se fiel, Otros que vean en ti su amor, Pronto se rindan a Él."},{"t":"v","n":"4","x":"Quiero servir desde hoy a Jesús Con todo mi corazón Quiero vivir desde hoy en su luz y ser así bendición."},{"t":"c","x":"Usa mi vida Usa mi vida Para tu"}]},{"s":"Himnario congregacional","n":"195","t":"¡Oh! cuán grande es mi anhelo","p":"472","c":"","l":[{"t":"v","n":"1","x":"¡Oh! cuán grande es mi anhelo de servirte, mi Señor, Porque yo serte cumplido y adorarte, mi Jesús, Porque Tú me has bendecido y me has dado plenitud. Letra y Música: Santiago Lozada Rodríguez, ICIAR."},{"t":"v","n":"2","x":"Vengo a ti Jesús querido entonando mi canción, Porque"},{"t":"v","n":"3","x":"Sólo en ti vivo confiado, ¡Oh! Jesús, mi Salvador, Porque"},{"t":"c","x":"tú eres mi consuelo y comprendes mi dolor; tú me has redimido, me has brindado salvación; Quiero tú me has rescatado, me has llamado con amor;"}]},{"s":"Himnario congregacional","n":"196","t":"¡Oh! yo quiero andar con Cristo","p":"473","c":"Letra:    H. C. Ball; Música: C. F. Weigele","l":[{"t":"v","n":"1","x":"¡Oh! yo quiero andar con Cristo, quiero oír su tierna voz, meditar en su palabra, Siempre andar de él en pos. Consagrar a él mi vida y cumplir su voluntad Y algún día con mi Cristo Gozaré la claridad. Cristo! ¡Oh, sí, yo quiero morir por Cristo! Quiero serle un testigo fiel. Letra: H. C. Ball"},{"t":"v","n":"2","x":"¡Oh! yo quiero andar con Cristo, él vivió en santidad, en la biblia yo lo leo Y yo se que es la verdad. Cristo era santo en todo el Cordero de la cruz Y yo anhelo ser cristiano, Seguidor de mi Jesús Música: C. F. Weigele"},{"t":"v","n":"3","x":"¡Oh! yo quiero andar con Cristo de mi senda él es la luz, dejaré el perverso mundo, cargaré aquí mi cruz. Este mundo nada ofrece, Cristo ofrece salvación, Y es mi dulce esperanza Gozar vida eterna en Sión."},{"t":"c","x":"¡Oh, sí, yo quiero andar con Cristo! ¡Oh, sí, yo quiero vivir con"}]},{"s":"Himnario congregacional","n":"197","t":"Para andar con Jesús","p":"474","c":"Letra:    Vicente Mendoza; Música: D. B. Towner","l":[{"t":"v","n":"1","x":"Para andar con Jesús no hay sendero mejor Que guardar sus mandatos de amor; Obedientes a Él siempre habremos de ser Y tendremos de Cristo el poder. regla marcada para andar en la luz. Letra: Vicente Mendoza"},{"t":"v","n":"2","x":"Cuando vamos así ¡cómo brilla la luz En la senda al andar con Jesús! Su promesa de estar con los suyos es fiel Si obedecen y esperan en él. Música: D. B. Towner"},{"t":"v","n":"3","x":"Quien siguiere a Jesús ni una sombra verá Si confiado su vida le da; Ni temores, ni afán, ni ansiedad, ni dolor, Pues lo cuida su amante Señor."},{"t":"v","n":"4","x":"Mas sus dones de amor nunca habréis de alcanzar Si rendido no váis a su altar; Pues su paz y su amor sólo son para aquel Que a sus leyes divinas es fiel."},{"t":"c","x":"Obedecer y confiar en Jesús, Es la"}]},{"s":"Himnario congregacional","n":"198","t":"Prometí, Cristo mío aceptarte","p":"475","c":"","l":[{"t":"v","n":"1","x":"Prometí, Cristo mío, aceptarte Como dueño de mi corazón; Para siempre servirte y amarte Porque sólo Tú das salvagar, Ven a darme el deseado consuelo, Y en mi pecho contrito a reinar. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Oh, yo fui pecador, lo comprendo, Pero un día alguien dijo ante mí, Que hasta el crimen más negro y horrendo Tú perdonas, si acuden a"},{"t":"v","n":"3","x":"A tus plantas, contrito, humillado, Vine yo a demandar compasión; Hoy, mis culpas tu sangre ha borrado, Por amor tú me has dado el per-"},{"t":"v","n":"4","x":"Me propongo ser un fiel soldado En tu causa Divina, Señor; Haz que siempre camine a tu lado, No permitas que caiga en e -"},{"t":"c","x":"ción. ti. Padre mío que estás en el cielo, En la tierra, y en todo lurror."}]},{"s":"Himnario congregacional","n":"199","t":"Puedo oír la voz de Cristo","p":"476","c":"Letra:    Sra. F. F. D.; Música: John S. Norris (1844-1907)","l":[{"t":"v","n":"1","x":"Puedo oír la voz de Cristo, tiernamente está llamando, puedo oír el llamamiento: \"Trae tu cruz y ven en pos de Mí\". dor, seguirte quiero, donde quiera fiel te seguiré. Letra: Sra. F. F. D."},{"t":"v","n":"2","x":"Yo te seguiré en el huerto, por la vía dolorosa, y con mi alma tan gozosa sufriré contigo, mi Señor. Música: John S. Norris (1844-1907)"},{"t":"v","n":"3","x":"Sufriré por ti Maestro, no me faltará tu mano, y si tú estás conmigo moriré contigo, mi Jesús."},{"t":"v","n":"4","x":"Me darás tu plena gracia, yo veré tu eterna gloria; contaré la antigua historia, y por siempre tú me guiarás."},{"t":"c","x":"Seguiré do tú me guíes, Seguiré do tú me guíes; Salva -"}]},{"s":"Himnario congregacional","n":"200","t":"¿Qué haría Jesús en mi lugar?","p":"476–477","c":"","l":[{"t":"v","n":"1","x":"¿Qué haría Jesús en mi lugar? Alma mía pregúntate tú, Cuando dardos de fuego contra ti Lance raudos el fiero Tentador; Del desierto recuerda aquella lid Do triunfante salió mi Jesús; Fía en él tú también podrás salir mor tan sacrosantos, Caminando feliz en pos de ti Mi Jesús, siempre fielquiero seguirte Mientras viva debajo del sol. Letra y Música: Francisco Sánchez Muñiz, ICI"},{"t":"v","n":"2","x":"¿Que haría Jesús en mi lugar? Con presteza pregúntate tú, Si oropeles del mundo con su luz Tan falaz te quisieran deslumbrar; En contrita humildad reverencial Cual Jesús enseñó, ora a Dios: \"Padre nuestro que en los cielos estás,"},{"t":"c","x":"Vencedor por su gracia y amor. En tus pasos de aLibra, sí, mi alma de todo mal\"."}]},{"s":"Himnario congregacional","n":"201","t":"Que mi vida entera esté","p":"478","c":"Letra:    Frances Q. Havergal, Tr. Vicente Mendoza; Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"Que mi vida entera esté, Consagrada ati, Señor; Que a mis ma nos pueda guiar, El impulso de tu amor. para ser, Señor, tuya por la eternidad. Letra: Frances Q. Havergal, Tr. Vicente Mendoza"},{"t":"v","n":"2","x":"Que mis pies tan sólo en pos, De lo santo puedan ir. Y que a ti Señor mi voz, Se complazca en bendecir. Música: William James Kirkpatrick (1838-1921)"},{"t":"v","n":"3","x":"Que mi tiempo todo esté, Consagrado a tu loor; Que mis labios al hablar, Hablen sólo de tu amor."},{"t":"v","n":"4","x":"4Toma ¡Oh! Dios mi voluntad, Y hazla tuya, nada más; Toma, sí, mi corazón, Por tu trono lo tendrás."},{"t":"c","x":"¡Lávame en tu sangre Salvador, traigo a ti mi vida ¡Límpiame de toda mi maldad,"}]},{"s":"Himnario congregacional","n":"202","t":"¿Quién a Cristo quiere, de hoy en más seguir?","p":"479","c":"Letra:    Eliza E. Hewitt, Tr. J. S. Paz; Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"¿Quién a Cristo quiere de hoy en más seguir su pendón alzando, pronto a combatir? ¿Quién le quiere humilde siempre aquí servir, siempre obedecerle, darle su existir? ¿Quién doquier que fuere tras su huella irá? ¿Quién dirá al Señor: \"Yo te seguiré\"? Letra: Eliza E. Hewitt, Tr. J. S. Paz"},{"t":"v","n":"2","x":"¿Quién seguile quiere con profundo amor, dandole la gloria, dandole el loor? ¿De su noble causa siendo defensor, y en su santa obra fiel trabajador. Música: William James Kirkpatrick (1838-1921)"},{"t":"v","n":"3","x":"¿Quién seguirle quiere sin vacilación, a su seno huyendo de la tentación? ¿Sin dudar confiando en su protección, y gozar por siempre de su bendición?"},{"t":"c","x":"¿Quién seguirle quiere? ¿Quién responderá al buen Redentor, \"Heme aquí, Señor\"?"}]},{"s":"Himnario congregacional","n":"203","t":"Quiero andar mi Señor","p":"480","c":"Letra:    Vessie D. Hargrave; Música: George Washington Sebren (1882-1940)","l":[{"t":"v","n":"1","x":"Quiero andar mi Señor, por tu senda de amor elevandome más y más; por doquiera impartiendo alegría y solaz, pero lleno de tu bonpies; Y que Siempre al andar, lleno esté de tu amor el camino por donde voy. Letra: Vessie D. Hargrave"},{"t":"v","n":"2","x":"Tenme cerca de ti, oh mi buen Salvador; no permitas jamás, jamás, que yo vague sin luz, sin destino y sin paz; mi sendero de amor llena Música: George Washington Sebren (1882-1940)"},{"t":"v","n":"3","x":"La jornada fugaz pronto terminará y no habrá mas sufrir allá, permitidme cantar al augusto Señor, mi sendero de amor llena"},{"t":"c","x":"hoy. Mi sendero de amor llena hoy, que tu Espíritu guíe mis"}]},{"s":"Himnario congregacional","n":"204","t":"Sigamos la huellas de Cristo Jesús","p":"481","c":"","l":[{"t":"v","n":"1","x":"Himno de la convención de 1936 luz. Pensemos que Cristo es el Amigo fiel, con gozo cantemos loores a Ya voy caminando para aquel hogar que Cristo el maestro me fue a preparar; amante me dice: \"No te tardes más, llegando a mis brazos la gloria verás\". Letra y Música: Lino Morales, ICI."},{"t":"v","n":"2","x":"Él. 2.Doy gloria a tu nombre, divino Señor, que siendo un indigno y vil pecador, tú me recibiste con todo tu amor, y ahora con gozo yo te doy loor."},{"t":"v","n":"3","x":"Si aliento te falta y no puedes llegar, acógete a Cristo, te hará descansar; hay gozo en los cielos por un pecador que acude a los brazos del buen Salvador."},{"t":"v","n":"4","x":"Alabo tu nombre, mi amado Señor, diré a los hombres que tú eres amor; que por nuestras culpas moriste en la cruz, que todos debemos seguirte, Jesús."},{"t":"c","x":"Sigamos las huellas de Cristo Jesús, él es nuestro amparo, él guía y da"}]},{"s":"Himnario congregacional","n":"205","t":"Tenme brillando, Señor","p":"482","c":"","l":[{"t":"v","n":"1","x":"Tenme brillando, Señor, tenme brillando por ti; puro y limpio seré si tú brillas en mí. Será mi vida, Señor, cual un lucero, por ti, hasta que vengas con tu gran poder. llevame a la roca más alta que yo, sólo allí refugio tendré. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Dame tu ayuda, Señor, para que brille por ti; yo andaré en tu amor si tú brillas en mí. Seme propicio, Señor, quiero alumbrar en redor hasta que vengas con tu gran poder."},{"t":"v","n":"3","x":"Quiero ser tuyo, Señor, siempre brillando por ti; pelearé con valor si tú brillas en mí. En ti confío, Señor, para luchar con vigor hasta que vengas con tu gran poder."},{"t":"c","x":"¡Oh! llévame a la roca más alta que yo, llévame, Señor, yo te seguiré; ¡Oh!"}]},{"s":"Himnario congregacional","n":"206","t":"Tentado no cedas, ceder es pecar","p":"483","c":"","l":[{"t":"v","n":"1","x":"Tentado no cedas, ceder es pecar; mejor y más noble es luchar y triunfar; valor pues cristiano, domina tu mal, Dios puede librarte, de asalto mortal. hallarás dulce calma, él te hará vencedor. Letra y Música: Horatio Richmond Palmer (1834-1907), Tr. Thomas Martin Westrup"},{"t":"v","n":"2","x":"Evita el pecado, procura agradar, a Dios, a quien debes, por siempre ensalzar; No manche tus labios impúdica voz, preserva tu vida, de ofensas a Dios."},{"t":"v","n":"3","x":"Amante benigno, y enérgico sé; en Cristo tu Amigo, pon toda tu fe; veraz sea tu dicho, de Dios es tu ser; corona te espera, y vas a vencer."},{"t":"c","x":"En Jesús, pues, confía: en sus brazos tu alma,"}]},{"s":"Himnario congregacional","n":"207","t":"Todo a Cristo yo me rindo","p":"484","c":"Letra:    Judson Wheeler Van de Venter (1855-1939); Música: Winfield Scott Weeden (1847-1908)","l":[{"t":"v","n":"1","x":"Todo a Cristo yo me rindo, Con el fin de serle fiel; Para siempre quiero amarle, Y agradarle sólo a Él. Todo a Cristo yo me entrego, Quiero serle fiel. Letra: Judson Wheeler Van de Venter (1855-1939)"},{"t":"v","n":"2","x":"Todo a Cristo yo me rindo, A sus pies postrado estoy; Los placeres he dejado Y le sigo desde hoy. Música: Winfield Scott Weeden (1847-1908)"},{"t":"v","n":"3","x":"Todo a Cristo yo me rindo, Sí, de todo corazón; Yo le entrego alma y cuerpo, Busco hoy su santa unción."},{"t":"v","n":"4","x":"Todo a Cristo yo me rindo, Siento el fuego de su amor; ¡Oh, qué gozo hay en mi alma! ¡Gloria, gloria a mi Señor!"},{"t":"c","x":"Yo me rindo a Él; Yo me rindo a Él; Yo me rindo a Él Yo me rindo a Él"}]},{"s":"Himnario congregacional","n":"208","t":"Tu corazón pide el Dios de bondad","p":"485","c":"Letra:    Vicente Mendoza Polanco (1875–1955); Música: Annie F. Boume (Pseudónimo de William James Kirkpatrick, 1838–1921)","l":[{"t":"v","n":"1","x":"Tu corazón pide el Dios de bondad. Quiere llenarlo de paz y de amor; ponlo a sus plantas con fe y humildad tu corazón\", Oye la voz que te sigue doquier; Libre del mundo te quiere tener, \"Dame\", Te dice hoy, \"tu corazón\". Letra: Vicente Mendoza Polanco (1875–1955)"},{"t":"v","n":"2","x":"Tu corazón busca el buen Salvador, Don más precioso no quiere tener; Paso tras paso te sigue su amor, Música: Annie F. Boume (Pseudónimo de William James Kirkpatrick, 1838–1921)"},{"t":"v","n":"3","x":"Tu corazón busca el consolador, Quiere llenarlo de gracia y poder; Él es del Padre el enviado de amor,"},{"t":"c","x":"\"Toma, Señor\", dile, \"mi corazón\". \"Dame\", diciéndote, \"tu corazón\". \"Tu corazón, Rinde al Espíritu el corazón."}]},{"s":"Himnario congregacional","n":"209","t":"Tuyo soy Jesús, ya escuché la voz","p":"486","c":"Letra:    Fanny J. Crosby (Frances Jane Crosby, 1832-1915)","l":[{"t":"v","n":"1","x":"Tuyo soy, Jesús ya escuché la voz De tu amor habládome a quí; Mas anhelo en alas de fe subir y más cerca estar de Ti. cerca, cerca de tu cruz, Llévame, ¡Oh, buen Pastor! Letra: Fanny J. Crosby (Frances Jane Crosby, 1832-1915)"},{"t":"v","n":"2","x":"A seguirte a ti me consagro hoy Constreñido por tu amor, Y mi espíritu, alma y cuerpo doy Por servirte, mi Señor. cerca cerca"},{"t":"v","n":"3","x":"¡Oh, cuán pura y santa delicia es De tu comunión gozar, Y contigo hablar y tu dulce voz Cada día escuchar!"},{"t":"v","n":"4","x":"De tu grande amor no comprenderé, Cuál es la profundidad; Hasta que contigo, Jesús, este En gloriosa eternidad."},{"t":"c","x":"Aún más cerca, cerca de tu cruz, Llévame ¡Oh, Salvador! Aún más cerca cerca"}]},{"s":"Himnario congregacional","n":"210","t":"Vencedor","p":"486–487","c":"","l":[{"t":"v","n":"1","x":"Mu chas veces he pensado, de problemas tan cargado me pregunto ¿por qué hay tanta prueba y dolor? pero en cada circustancia Dios me da más de su gracia y me muestra que soy más que vencedor. fe está en Dios; ¡Vencedor! (Yo soy) ¡vencedor! Sí, ahora yo soy más que vencedor (vencedor) Letra y Música: Andraé Crouch, 1971, trad, Frank Gonzales, alt."},{"t":"v","n":"2","x":"En el mundo agitado, de la multitud rodeado, nadie ve mi soledad y llanto Señor; mas en cada hora oscura, tu Espíritu asegura que contigo yo soy más que vencedor."},{"t":"v","n":"3","x":"Gracias doy por las victorias, gracias doy por las derrotas; a Dios gracias por el duelo abrumador. A través de los problemas veo sus misericordias, y en todo yo soy más que vencedor."},{"t":"c","x":"¡Vencedor! (Yo soy) ¡vencedor! yo en Cristo he confiado, mi"}]},{"s":"Himnario congregacional","n":"211","t":"Yo consagro a ti mi vida","p":"488","c":"Letra:    Isabel P. Balderas; Música: James Henry Fillmore (1849–1936)","l":[{"t":"v","n":"1","x":"Yo consagro a ti mi vida, ¡Oh querido y buen Jesús! y tu mano bendecida llevarame en clara luz. Trabajan - - - - do, trabajando viviré por mi Señor, buenas nue - - - vas anunciando al perdidopecador. Letra: Isabel P. Balderas"},{"t":"v","n":"2","x":"Mil temores y mil dudas por doquier me asediarán; pero tú, Jesús, me ayudas y arredrarme no podrán. Trabajando, trabajando, trabajando, trabajando, viviré, sí, viviré por mi Señor, por mi Señor, buenas nuevas anunciando, buenas nuevas anunciando Música: James Henry Fillmore (1849–1936)"},{"t":"v","n":"3","x":"Con placer y amor me alisto En las huestes de la fe; fortaleza me da Cristo y sin duda venceré."},{"t":"v","n":"4","x":"Obtendrán feliz victoria los soldados del Señor; se verán llenos de gloria de este mundo en derredor."}]},{"s":"Himnario congregacional","n":"212","t":"Yo quiero ser cual mi Jesús","p":"489","c":"Letra:    Vicente Mendoza Polanco (1875–1955); Música: Jairus Maxson Stillman (1834-1917)","l":[{"t":"v","n":"1","x":"Yo quiero ser cual mi Jesús, sirviendole con lealtad; sincero y fiel yo quiero ser, cumpliendo su voluntad. Más y más cual mi Señor seré por su gran poder. Letra: Vicente Mendoza Polanco (1875–1955)"},{"t":"v","n":"2","x":"Humilde quiero siempre ser cual fuera mi Salvador, no quiero glorias nipoder indignos de mi Señor. Música: Jairus Maxson Stillman (1834-1917)"},{"t":"v","n":"3","x":"En todo quiero yo seguir las huellas de mi Señor, y por doquier hacer sentir lo que hizo en mí su amor."},{"t":"c","x":"Más y más cual mi Jesús en mi vida quiero ser;"}]},{"s":"Himnario congregacional","n":"213","t":"¿Con qué pagaremos?","p":"490","c":"","l":[{"t":"v","n":"1","x":"¿Con qué pagaremos el inmenso amor, que diste a tu hijo por mí pecador? Señor Jesucristo, conforta mi alma por amarme tanto; recibe este cantomezcladocon llanto de mi corazón. Letra y Música: Autor desconocido, Melodía latinoamericana, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Y cuando la noche extienda su manto, mis ojos con llanto en ti fijaré; Alzando mis ojos, veré las estrellas,"},{"t":"v","n":"3","x":"No tengo qué darte, ni oro ni plata, por el sacrificio que hiciste por mí; En cambio recibe la ofrenda humillada,"},{"t":"c","x":"para que yo pueda servirte en mi vida, servirte Señor. yo sé que tras ellas, cual Padre a moroso, tu velas por mí. No tengo qué darte la o fren da humillada, Señor Jesucristo, de mi corazón."}]},{"s":"Himnario congregacional","n":"214","t":"Mas él herido fue por nuestras culpas","p":"490–491","c":"","l":[{"t":"v","n":"1","x":"Mas él herido fue por nuestras culpas, molido por causa de mi pecar, El peso tan terrible de mis males Lo puso sobre sí mi Salvador; Como cordero fue al matadero, En grande aflicción, enmudeció, Su sangre derramó para limpiarme Y por su llaga tan bendita me salvó. magen del invisible Dios El Primogenito Eres tú de las criaturas, En ti tenemos por tu sangre redención. Letra y Música: Francisco Sánchez Muñíz Nota del autor:"},{"t":"v","n":"2","x":"Entre los hombres fuiste despreciado Y desechado de su comunión, Varón experimentado en quebranto, Menospreciado, sin estimación; Todos nos descarriamos como ovejas, Cada cual por su senda se apartó; Mas Dios cargó en él nuestros pecados Y por su llaga tan bendita nos salvó. Portales Septiembre 10 de 1955."},{"t":"v","n":"3","x":"En una velada de oración con el grupo de intermedios en el momento de una"},{"t":"v","n":"4","x":"grande bendición y después de haberse leído este pasaje Bíblico."},{"t":"c","x":"Señor Jesús, mi Salvador, mi Dios bendito, Eres i-"}]},{"s":"Himnario congregacional","n":"215","t":"¡Piedad, Oh Santo Dios piedad!","p":"492","c":"Letra:    Isaac Watts ( 1674-1748), Tr. Merrel N. Hutchinson; Música: Daniel Read (1757-1836), Wihdham.","l":[{"t":"v","n":"1","x":"¡Piedad, oh Santo Dios, piedad! Piedad te implora el corazón; ¡Oh! lávame de mi maldad y dame gozo paz perdón. Letra: Isaac Watts ( 1674-1748), Tr. Merrel N. Hutchinson"},{"t":"v","n":"2","x":"Mis rebeliones graves son, son todas sólo contra ti; mas crea un nuevo corazón y un nuevo espíritu en mí. Música: Daniel Read (1757-1836), Wihdham."},{"t":"v","n":"3","x":"No quieres sacrificio más que el humillado corazón; mi ofrenda no des - - preciarás, pues eres todo compasión."},{"t":"v","n":"4","x":"Sálvame oh, Dios, con tu poder; que mi esperanza es sólo en ti; humilde aguardo tu querer; sé compasivo hacia mí."}]},{"s":"Himnario congregacional","n":"216","t":"Sálvame, ¡Oh, Dios! de toda tentación","p":"493","c":"","l":[{"t":"v","n":"1","x":"Sálvame, oh Dios, de toda tentación, Porque en la muerte no te alabaré; Pronto mis días se acaban Y al polvo tornaré. mor; No se acorte tu mano, Cristo, Cristo mi Salvador. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Ciertamen te el bien y la bondad Me seguirán los días que more aquí; Confortarás mi alma Y yo te alabaré."},{"t":"v","n":"3","x":"Tú eres fiel, inmenso en amor, Perdonarás del hombre la maldad; Anhelas verlo salvo; Cuán grande es tu bondad."},{"t":"v","n":"4","x":"Te alabaré por siempre, mi Jesús, Porque tu gracia ya me perdonó, Y con tu sacrificio Me has dado salvación."},{"t":"c","x":"Soy arcilla, soy lodo en tus manos, Miserable de mí sin tu a-"}]},{"s":"Himnario congregacional","n":"217","t":"Ten piedad de mí, cariñoso Salvador","p":"494–495","c":"","l":[{"t":"v","n":"1","x":"Ten piedad de mí, cariñoso Salvador, ven ten compasión de mi pobre corazón; ten piedad de mí por tu conmiseración, ven, Señor Jesús, de mi ser siempre sé la luz. llados, buen Jesús: \"Quédate, Señor bendito, con nosotros, Letra y Música: Francisco Sánchez Muñiz es tarde ya y declinó el día, Señor\"."},{"t":"v","n":"2","x":"Sólo polvo soy y miseria ante ti, Un gusano vil y cuitado pecador; ven, ten compasión por tu infinito amor, Bendito Señor, mi Jesús, ten piedad de mí."},{"t":"v","n":"3","x":"Mil gracias te doy, cariñoso Salvador; tu presencia Real siento ya en mi corazón. Ahora soy feliz con tan grande bendición; Bendito Señor, mi ser ya saturó tu amor."},{"t":"c","x":"Como aquellos caminantes de Emaús imploramos humi-"}]},{"s":"Himnario congregacional","n":"218","t":"Yo escucho, buen Jesús","p":"495","c":"","l":[{"t":"v","n":"1","x":"Yo escucho, buen Jesús, Tu dulce voz de amor, Que desde el árbol de la cruz Invita al Pecador. Yo soy pecador, Nada hay bueno en mí; Ser objeto de tu amor Deseo y vengo a Ti. Letra y Música: Lewis Hartsough (1828-1919), Tr. Juan Bautista Cabrera Ivars (1837-1916)"},{"t":"v","n":"2","x":"Tú ofreces el perdón De toda iniquidad, Si el llanto inunda el corazón Que acude a tu piedad. Yo soy pecador, Ten de mí piedad; Dame llanto de dolor Y borra mi maldad."},{"t":"v","n":"3","x":"Tú ofreces aumentar la fe del que creyó, Y gracia sobre gracia dar A quien en Ti esperó. Creo en Ti, Señor, Sólo espero en Ti; Dame tu infinito amor, Pues basta para mí."}]},{"s":"Himnario congregacional","n":"219","t":"Alguna vez ya no estaré","p":"496–498","c":"Letra:    Fanny Jane Crosby (Frances Jane Crosby, 1832-1915), Trad. Tomás García; Música: George Coles Stebbins (1846–1945); Letra:    Juan Bautista Cabrera Ivars (1837-1916); Música: Iste Confessor, 1746; Música: George Mursell Garret (1834-1897)","l":[{"t":"v","n":"1","x":"Alguna vez ya no estaré en mi lugar en esta grey, mas ¡cuán feliz despertaré en el palacio de mi llí, y le diré: \"mi buen Señor, por gracia yo salvado fui\". Letra: Fanny Jane Crosby (Frances Jane Crosby, 1832-1915), Trad. Tomás García Al trono excelso do en inmensa gloria, Supremo Dios, tu majestad reside, suban las voces puras del ferviente pueblo que pi - - - de. Letra: Juan Bautista Cabrera Ivars (1837-1916) Al trono excelso do en inmensa gloria, Supremo Dios, tu majestad reside, suban las voces puras del ferviente pueblo que pide. Letra: Juan Bautista Cabrera Ivars (1837-1916)"},{"t":"v","n":"2","x":"Alguna vez la muerte atroz vendrá, mas ¿cuándo? no lo sé; pero esto sé: con mi buen Dios un sitio yo feliz tenMúsica: George Coles Stebbins (1846–1945) Sobre la tierra que por patria amada te plugo darnos, libertades brillen; y no consientas que se forjen nunca yugos que humi - - - llen. Música: Iste Confessor, 1746 Sobre la tierra que por patria amada te plugo darnos, libertades brillen; y no consientas que se forjen nunca yugos que humillen. Música: George Mursell Garret (1834-1897)"},{"t":"v","n":"3","x":"Alguna vez yo como el sol mi ocaso y fin tendré también; mas me dirá mi buen Señor: \"mi siervo fiel, conmigo Pío derrama la esplendente lumbre de tu evangelio que ilumine al mundo; de tu evangelio, manantial de bienes siempre fecun - - - do. Pío derrama la esplendente lumbre de tu evangelio que ilumine al mundo; de tu evangelio, manantial de bienes siempre fecundo."},{"t":"v","n":"4","x":"En día feliz que espero yo con mi candil ardiendo ya, las puertas me abrirá el Señor, y mi alma a él con gozo iTu reino sea nuestra amada patria, tu voluntad la ley que veneremos, y tu palabra la gloriosa enseña que tremole - - - mos. Tu reino sea nuestra amada patria, tu voluntad la ley que veneremos, y tu palabra la gloriosa enseña que tremolemos."},{"t":"v","n":"5","x":"Danos tu gracia y bendición constantes mientras tengamos por mansión el suelo, hasta el momento en que nos des la nueva Patria en el cie - - - lo. Danos tu gracia y bendición constantes mientras tengamos por mansión el suelo, hasta el momento en que nos des la nueva Patria en el cielo."},{"t":"c","x":"dré. Yo le veré, y en dulce amor iré a vivir con él a -"}]},{"s":"Himnario congregacional","n":"221","t":"Anhelo a las regias mansiones llegar","p":"499","c":"","l":[{"t":"v","n":"1","x":"Anhelo a las regias mansiones llegar, do reina mi Salvador, ya escucho los ecos del dulce cantar de ré, mis ojos han de ver la playa celestial, feliz y salvo soy, ya pronto llegaré con gozo al celeste hogar. Letra y Música: Thomas Ball Barratt (1862-1940), Tr. Speros Demetrios Athans (1883-1969)"},{"t":"v","n":"2","x":"Feliz experiencia, inefable, de paz, yo siento en mi corazón; dulzura, placer, comunión y solaz con"},{"t":"v","n":"3","x":"Por sendas gloriosas de paz y de amor, con gozo transito ya, y espero que pronto mi Rey y Señor con -"},{"t":"v","n":"4","x":"Anhelo mivida poder elevar, ser fiel a mi Redentor, y así a las regias mansiones llegar, do"},{"t":"c","x":"triunfo, de gran loor. Dios en la oración. A mi supremo Rey alegre cantasigo me llevará. reina mi Salvador."}]},{"s":"Himnario congregacional","n":"222","t":"Aunque en esta vida no tengo riquezas","p":"500","c":"","l":[{"t":"v","n":"1","x":"Aunque en esta vida no tengo riquezas, sé que allá en la gloria tengo mi mansión; cual alma perdida entre las pobrezas, de mí, Jesucristo, tuvo compasión. tengo unhogar, hogar bello hogar, más allá del sol. Letra y Música: Emiliano Ponce, 1940."},{"t":"v","n":"2","x":"Así por el mundo yo voy caminando de pruebas rodeado, y de tentación; pero Jesucristo que me va guiando, salvo llevarame hasta su mansión."},{"t":"v","n":"3","x":"A todos los hombres de linaje humano Cristo quiere darles plena salvación; una bella casa no hecha de manos fue a prepararnos en la santa Sión."},{"t":"c","x":"Más allá del sol, más allá del sol, yo"}]},{"s":"Himnario congregacional","n":"223","t":"Cuando cesen los conflictos de la vida terrenal","p":"501","c":"","l":[{"t":"v","n":"1","x":"Cuando cesen los conflictos de la vida terrenal, y dejemos este mundo de aflicción, entraremos por las puertas de la ción de redención, en Jerusalém, en Jerusalém; con acentos de alegría alabando alSalvador en la gran (En la gran) Jerusalém. (Jerusalém) Letra y Música: Charles Brenton Widmeyer (1884-1974), Tr. Speros Demetrius Athans (1883-1969)"},{"t":"v","n":"2","x":"Aunque el mar embravecido y las olas del turbión, siempre agiten nuestra pobre embarcación, fiando en Cristo llegaremos a la"},{"t":"v","n":"3","x":"Consagremos nuestras vidas al servicio del Señor, siempre hablemos de su grande salvación, si en su obra trabajamos nos es-"},{"t":"v","n":"4","x":"En aquel país hermoso do jamás se dice: \"adios\", gozaremos el descanso sin afán, cara a cara allá veremos a Je-"},{"t":"c","x":"patria celestial en la nueva Jerusalém. playa celestial de la nueva Jerusalém. Cantaremos con los santos la canpera galardón, en la nueva Jerusalém. sús, quien nos salvó, en la nuevaJerusalém."}]},{"s":"Himnario congregacional","n":"224","t":"Cuando la trompeta suene en aquel día final","p":"502","c":"Letra:    J. J. Mercado; Música: James Milton Black (1856-1938)","l":[{"t":"v","n":"1","x":"Cuando la trompeta suene en aquel día final, y que el alba eterna rompa en claridad; cuando las naciones salvas a su llá se pase lista,cuando allá se pase lista,cuando allá se pase lista, a mi nombre yo feliz responderé. Letra: J. J. Mercado"},{"t":"v","n":"2","x":"En aquel día sin nieblas en que muerte ya no habrá, y su glori el Salvador impartirá; cuando los llamados entren a su Cuando allá se pase lista, gloria aDios. Cuando allá se pase lista,gloria aDios. Cuando allá se pase lista, Música: James Milton Black (1856-1938)"},{"t":"v","n":"3","x":"Trabajad por el maestro desde el alba al vislumbrar; siempre hablemos de su amor y fiel bondad, cuando todo aquí fenezca y nuestra"},{"t":"c","x":"patria lleguen ya, y que sea pasada lista, allí he de estar. celestial hogar, y que sea pasada lista, allí he de estar. Cuando aobra cese ya, y que sea pasada lista, allí he de estar."}]},{"s":"Himnario congregacional","n":"225","t":"Cuando mis luchas terminen aquí","p":"503","c":"","l":[{"t":"v","n":"1","x":"Cuando mis luchas terminen aquí y ya seguro en los cielos esté, Cuando al Señor mire cerca de mí ¡Por las edades mi gloria será! ¡Esa será gloria sin fin, gloria sin fin, gloria sin fin; Cuando por gracia su faz pueda ver, Esa mi gloria sin fin ha de ser! Letra y Música: Edwin Othello Excell (1851-1921), Tr. Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Cuando por gracia yo pueda tener en sus mansiones morada de paz, y que allí siempre su faz pueda ver, ¡Por las edades mi gloria será! ¡Esa será gloria sin fin, gloria sin fin, gloria sin"},{"t":"v","n":"3","x":"Gozo infinito será contemplar todos los seres que yo tanto amé, mas la presencia de Cristo gozar, ¡Por las edades mi gloria será!"}]},{"s":"Himnario congregacional","n":"226","t":"De celeste país he leído","p":"504–505","c":"","l":[{"t":"v","n":"1","x":"De celeste país he leído, Do se encuentra u na hermosa ciudad cuyas calles benditas son de oro y de jaspe su muro eternal. A través de sus calles deslumbra de sus aguas de vida el cristal; y aunque se habla de tanta excelencia no Letra y Música: C. F. Presbrey tad, de aquella ciudad tan gloriosa no se ha dicho aún la mitad."},{"t":"v","n":"2","x":"He leído de aquellas mansiones que el Maestro nos fue a preparar, y los santos que a quí han sido fieles allá irán para siempre a gozar; donde muerte, dolor ni pecado ya no pueden hacer ningún mal; y aunque hablamos de tanta belleza no"},{"t":"v","n":"3","x":"He leído de níveos vestidos y coronas que habrán de os tentar, los que han sido llamados del Padre a gozar de su gloria eternal; de los justos, por siem pre benditos que en sus calles de oro andarán; de esta historia gloriosa y sublime no"},{"t":"c","x":"se ha dicho aún la mitad. se ha dicho aún la mitad. No se ha dichoaún la mitad, no se ha dicho aún la mise ha dicho aún la mitad."}]},{"s":"Himnario congregacional","n":"227","t":"En presencia estar de Cristo","p":"505","c":"Letra:    Vicente Mendoza Polanco (1875-1955); Música: Grant Colfax Tullar (1869–1950)","l":[{"t":"v","n":"1","x":"En presencia estar de Cristo, ver su rostro ¿qué será? cuando al fin en pleno gozo mi alma le contemplará? Cara a cara en plena gloria he de ver a mi Jesús. Letra: Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Sólo tras oscuro velo hoy lo puedo aquí mirar; más ya pronto viene el día que su gloria ha de mostrar. Música: Grant Colfax Tullar (1869–1950)"},{"t":"v","n":"3","x":"¡Cuánto gozo habrá con Cristo cuando no haya más dolor, cuando cesen los peligros y ya estemos en su amor!"},{"t":"v","n":"4","x":"Cara a cara, ¡cuán glorioso! Ha de ser así vivir; ver el rostro de quien quiso nuestras almas redimir."},{"t":"c","x":"Cara a cara espero verle más allá del cielo Azul;"}]},{"s":"Himnario congregacional","n":"228","t":"Es el tren de la vida","p":"506","c":"","l":[{"t":"v","n":"1","x":"Es el tren de la vida que va para Sión sin comprar boleto, pues en él yo voy, el viaje es gratuito y contento estoy, porque Cristo es el conducla señal. Todavíaa es tiempo porque asientos hay, sólo espera tu llamar. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Si en la estación tú parado estás hasle la señal pronto parará, el viaje es gratuito y no hay que pagar, porque ya pagado es-"},{"t":"v","n":"3","x":"Los que van viajando gozosos están, sólo van pensando en la gran ciudad, las calles son de oro y el mar de cristal, do por siempre mora -"},{"t":"v","n":"4","x":"Cánticos celestes se oyen resonar, porque jubiloso este viaje es; esperando ansiosos la estación final, del palacio celes -"},{"t":"c","x":"tá. Si en el tren de la vida deseas tú viajar, date prisa amigo hasle tial."}]},{"s":"Himnario congregacional","n":"229","t":"Gozándome yo voy hacia el dulce hogar","p":"507","c":"","l":[{"t":"v","n":"1","x":"Gozándome yo voy hacia el dulce hogar, caminando, caminando; mi deseo más ferviente es continuar caminando para aquel hogar. Caminando, caminando para aquel hogar donde está la luz, caminando, caminando de la mano del Señor Jesús. Letra y Música: Hamp Sewell"},{"t":"v","n":"2","x":"Dejando estemundo y todo mal, caminando, caminando; mi Jesús ha prometido conmigo estar, caminando para aquel ho -"},{"t":"v","n":"3","x":"Yo quiero pecadores a él traer, caminando, caminando; el Señor los tomará con su gran poder, caminando para aquel ho -"},{"t":"v","n":"4","x":"Al fin de la jornada yo le veré en el cielo, en la luz; con gozo inefable yo cantaré: ¡Aleluya al Señor Je -"}]},{"s":"Himnario congregacional","n":"230","t":"Hay un sueño inefable","p":"508","c":"Letra:    Vicente Mendoza y Polanco (1875-1955); Música: Charles Hutchinson Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Hay un sueño inefable de Cristo el Señor, Que ha de ser a su fin realidad; Cada instante contemplo esa dulce visión Que es promesa de eterna verCoro quiero impartirte en verdad, (en verdad,) Porque sueño mirar en la gloria su faz, Y yo sé que será realidad. Letra: Vicente Mendoza y Polanco (1875-1955)"},{"t":"v","n":"2","x":"Bien compensa por toda ansiedad y dolor La esperanza que afirma mi fe, Pues al ver a mi Rey en su real esplendor Ni aun la sombra de pruebas tenMúsica: Charles Hutchinson Gabriel (1856-1932)"},{"t":"v","n":"3","x":"Cuando ya todo anuncie que el fin cerca está, No agitarme podrá la ansiedad; Un suspiro no más, y la vida se irá, Mas mi sueño será reali -"},{"t":"c","x":"dré. Este sueño inefable secreto es de paz Que yo"}]},{"s":"Himnario congregacional","n":"231","t":"Hoy te alabamos, Dios de bondad","p":"509","c":"Letra:    Isabel P. Balderas; Música: Domenico Gaetano Maria Donizetti (1797-1848)","l":[{"t":"v","n":"1","x":"Hoy te alabamos Dios de bondad, con regocijo santo, pues entonamos con libertad del patriotismo el canto. Por tu mandato, nuestra nación será librada de la maldad, bajo la sombra de su pendón no habrá cadenas ni pues entonamos con libertad la canción del cristiano feliz. Letra: Isabel P. Balderas"},{"t":"v","n":"2","x":"Del fiel cristiano no lema será: ¡México para Cristo! el buen Jesús ayuda dará, el tiunfo será visto. Ven juventud, hoy, llena de ardor y a tus embates Satán caerá; lucha inspirada por tu Señor, el galardón está Música: Domenico Gaetano Maria Donizetti (1797-1848)"},{"t":"v","n":"3","x":"A nuestra patria da libertad, a este jirón de suelo, guárdalo libre de iniquidad es nuestro santo anhelo. El evangelio, la salvación, con entusiasmo, id, publicad; hasta implantar de Cristo el pendón en derredor de este"},{"t":"c","x":"llanto. listo. Hoy te alabamos Dios de bondad, con regocijo santo, suelo."}]},{"s":"Himnario congregacional","n":"232","t":"La juventud se unifica","p":"510","c":"","l":[{"t":"v","n":"1","x":"La juventud se unifi ca en el amor del Salvador, y así unidos siempre a conquistar y con tesón luchar en contra de Satán. Esparciremos la doctrina que regenera y que da paz y mantendremos encendida y esplendente la verdad. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Enarbolando la bandera, marchemos todos sin temor, a combatir al enemigo cruel, para poder vencer las huestes de Satán. Alcanzaremos la victoria, unidos siempre por la fe, porque llevamos como jefe a Jesucristo nuestro Rey."},{"t":"v","n":"3","x":"Oh juventudes mexicanas la senda fieles proseguid, y por doquier las nuevas anunciad al pobre pecador, que atado siempre está. Con el poder del evangelio, al enemigo vencerás, y en el gran día de la victoria, una corona ceñirás."}]},{"s":"Himnario congregacional","n":"233","t":"Llegaremos al hogar","p":"511","c":"","l":[{"t":"v","n":"1","x":"Llega remos al hogar Que Jesús preparó, Donde irán a descansar Los que aquí redimió. Llamaremos sin temor, Y a la puerta él estará; Con ternura y con amor, Bienveda, Y en su seno el alma fiel sin temor vivirá. Letra y Música: William Howard Doane (1832-1915), Tr. Vicente Mendoza Polanco (1875–1955)"},{"t":"v","n":"2","x":"Vuestro hogar aquí no está, Cuanto veis en redor, A la nada volverá A la voz del Señor. Este mundo de maldad Con su fausto y su placer, Con su orgullo y vanidad, Lo ve -"},{"t":"v","n":"3","x":"No lloréis por el que fue con Jesús a vivir; Esperad teniendo fe, Pronto a él vais a ir. Junto al trono de Jesús A los vuestros hallaréis, Y viviendo en gracia y luz, Nunca \"a-"},{"t":"c","x":"nida dará. ¡Un hogar Dios nos réis perecer. ¡Un hogar, sí, Dios nos da, diós\" les diréis."}]},{"s":"Himnario congregacional","n":"234","t":"Meditad en que hay un hogar","p":"512","c":"","l":[{"t":"v","n":"1","x":"Meditad en que hay un hogar en la margen del río de luz, donde van para siempre a gozar los creyentes en Cristo Jegar, más allá, más allá, más allá, en la margen del río de luz. Letra y Música: Tullius Clinton O'Kane (1830–1912), Tr. Pedro Castro Iriarte (1840–1887)"},{"t":"v","n":"2","x":"Meditad en que amados tenéis de los cuales marchamos en pos, y pensad en que al fin los veréis, en el alto palacio de más allá, más allá,"},{"t":"v","n":"3","x":"En que mora Jesús meditad, donde seres que amamos están, y a la patria bendita volad sin angustias, temores ni a-"},{"t":"v","n":"4","x":"Reunido a los míos seré, mi carrera a su fin llega ya, y en mi hogar celestial entraré, do mi alma reposo ten -"},{"t":"c","x":"Dios. Más allá, más allá, meditad en que hay un hoMás allá, más allá,"}]},{"s":"Himnario congregacional","n":"235","t":"Mi Padre es un Rey","p":"513","c":"Letra:    Hattie E. Buell (1834-1910), Tr. David E. Finstrom; Música: Desconocido","l":[{"t":"v","n":"1","x":"Mi Padre es un Rey muy rico, sin par, él tiene caudales inmensos doquier; su oro y diamantes no puedo contar, tesoros que nadie podrá conteRey, soy el hijo de un Rey, el hijo de un Rey, por Cristo bendito soy el hijo de un Rey. Letra: Hattie E. Buell (1834-1910), Tr. David E. Finstrom"},{"t":"v","n":"2","x":"El hijo de Dios, mi buen Salvador, al mundo viniendo, muy pobre vivió; hoy reina en la gloria cubierto de honor, y hogar en los cielos con él me ofreMúsica: Desconocido"},{"t":"v","n":"3","x":"Errante viví, sin patria ni hogar, un vil extranjero sin Dios y sin fe; más Cristo bendito mequiso adoptar, corona y mansión en los cielos ten -"},{"t":"v","n":"4","x":"Qué importa que yo no tenga ni hogar, si tengo un palacio del sol más allá, y mientras que llego, yo puedo cantar: \"soy el hijo de un Rey, ¡A leluya a Jeho-"},{"t":"c","x":"ció. Soy el hijo de un Rey, el hijo de un Rey, por Cristo bendito soy el hijo de un"}]},{"s":"Himnario congregacional","n":"236","t":"Mil veces con el Maestro","p":"514","c":"Letra:    Lechuga y Vicente Mendoza Polanco (1875–1955); Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"Mil veces con el Maestro, En santa comunión, escucho los acentos, de hermosa agrupación. Letra: Lechuga y Vicente Mendoza Polanco (1875–1955)"},{"t":"v","n":"2","x":"De aquellos que sufrieron sed, hambre y dolor, mas hoy glori ficados están con el Señor. Música: William James Kirkpatrick (1838-1921)"},{"t":"v","n":"3","x":"Escucho los acentos del canto sin igual, y al punto yo me uno, al coro celestial."},{"t":"v","n":"4","x":"Unido estoy con ellos ahora por la fe, mas pronto frente al trono con ellos cantaré."},{"t":"c","x":"¡Aleluya, Amén! ¡Aleluya, Amén! ¡Aleluya, Amén! ¡Amén! ¡Amén! -"}]},{"s":"Himnario congregacional","n":"237","t":"Níveas ropas sin igual","p":"514–515","c":"Letra:    Pedro Grado (1862-1923); Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"Níveas ropas sin igual, en la patria celestial, nos dará Jehová, nuestro Señor; donde luz de sol no habrá. Pues sublime brillará la sonriente faz del Salvador. dura celes tial. Tra - - - je de luz, nos da Jesús, níveo vestido de luz, sublime don celestial. Letra: Pedro Grado (1862-1923)"},{"t":"v","n":"2","x":"Níveas ropas sin igual, de los santos noble ideal, llevaremos ante nuestro Rey, en completa comunión cantaremos la canción de la redimida y santa grey. celes tial, la vestidura celestial, traje de luz, traje de luz nos da Jesús, nos da Jesús, Música: William James Kirkpatrick (1838-1921)"},{"t":"v","n":"3","x":"Níveas ropas sin igual, del Cordero Celestial, la redenta grey ostentará; pues la sangre de Jesús derramada en la cruz nuestras manchas todas lavará."},{"t":"c","x":"Nívea será, nívea será la vestiNívea será, nívea será, nívea será nívea será, la vestidura"}]},{"s":"Himnario congregacional","n":"238","t":"No hay tristeza en el cielo","p":"516–517","c":"","l":[{"t":"v","n":"1","x":"No hay tristeza en el cielo, ni llanto, ni amargo dolor. no hay corazón angustiado do reina el Dios de amor; las nubes de nuestro horizonte jamás aparecen allá, el Sol esplendente que es Cristo derrama su luz celes tial. Letra y Música: Frederick Martin Lehman (1868-1953), Tr. Speros Demetrios Athans (1883-1969) todos los santificados irán parasiempre a morar; el día feliz ya se acerca, en que el sol para mí se pondrá: ¡Oh! qué gozo será cuando mire al Señor en aquella hermosa ciudad."},{"t":"v","n":"2","x":"No hay aflicción en el cielo, ni pruebas existen allá; el alma que en Cristo reposa segura en su seno estará; no hay tentación en el cielo ni sombras de muerte atroz, el árbol de vida florece do fluye el río de Dios. Arm. Claudia Faustina Lehman Mays (1892–1973)"},{"t":"v","n":"3","x":"¡Cuán dulce será en el cielo, pasadas las penas aquí, volvernos a ver reunidos con nuestros amados allí; por todos los siglos eternos! ¡que dicha ineflable ha de ser estar en presecia de Cristo, gozando de eterno placer."},{"t":"c","x":"Yo voy a la patria del alma, do Cristo prepara mi hogar, do"}]},{"s":"Himnario congregacional","n":"239","t":"Quisiera decirte, Señor lo que siento","p":"518","c":"","l":[{"t":"v","n":"1","x":"Quisiera decirte Señor lo que siento, la tristeza tan honda de mi corazón; quisiera estar cerca, decirte al oído, decirte que llévame Señor junto a Ti; llévame, sí, llévame, que nadie en el mundo me aparte de Ti. Letra y Música: Guadalupe Velasco, ICIAR"},{"t":"v","n":"2","x":"Tu gracia divina, Señor poderoso, llenar puede de paz y de gozo mi ser, quitando mi pena, Señor bondadoso, llenando mi"},{"t":"v","n":"3","x":"Ahora Señor que me encuentro a tu lado, terminó la tristeza de mi corazón; tu amor satisface, tu amor me ha llenado, por eso te"},{"t":"c","x":"te amo, bendito Señor. pecho de santo poder. Llévame, ¡Oh, Cristo! sí, llévame, amo, bendito Señor."}]},{"s":"Himnario congregacional","n":"240","t":"Sin cesar yo medito en la tierra mejor","p":"519","c":"Letra:    Vicente Mendoza Polanco (1875-1955); Música: John Robson Sweney (1837-1899)","l":[{"t":"v","n":"1","x":"Sin cesar yo medito en la tierra mejor do al ponerse mi sol llegaré, y al hallarme en los cielos con Cristo el Señor, ¿mi corona de estrellas tensol ya decline y me encuentre yo en ti, ¿mi corona de estrellas tendré? Letra: Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"De la fuerza de Dios esperando el poder, trabajar quiero siempre y salvar a las almas, y al fin, cual estrellas saber que en mis sienes irán a brila tendré? Música: John Robson Sweney (1837-1899)"},{"t":"v","n":"3","x":"¡Oh! qué gozo en los cielos será para mí vivas gemas poner a sus pies, y tener en mi frente corona que allí ¡ornen joyas de tal brillan-"},{"t":"c","x":"llar. ¿Mi corona tendrá sus estrellas allí, en las almas que yo prediqué? cuando el tez! Prediqué?"}]},{"s":"Himnario congregacional","n":"241","t":"Soy peregrino aquí","p":"520","c":"Letra:    Vicente Mendoza Polanco (1875-1955); Música: Flora Hamilton Cassel (1852-1911)","l":[{"t":"v","n":"1","x":"Soy peregrino aquí, mi hogar lejano está en la mansión de luz, eterna paz y amor; embajador yo soy del reino celestial en los negocios de mi voz: ¡Reconciliaos ya!, dice el Señor y Rey, ¡Reconciliaos hoy con Dios.! Letra: Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Que del pecado vil arrepentidos ya, han de reinar con él los que obedientes son, es el mensaje fiel que debo proclamar, en los negocios de mi Música: Flora Hamilton Cassel (1852-1911)"},{"t":"v","n":"3","x":"Mi hogar más bello es que el valle de Sarón, eterno gozo y paz reinan por siempre en él, y allí Jesús dará eterna habitación, es el mensaje de mi"},{"t":"c","x":"Rey. Este mensaje fiel oíd, que dijo la celeste"}]},{"s":"Himnario congregacional","n":"242","t":"Yo me siento hoy gozoso porque Cristo me salvó","p":"521","c":"Letra:    Enrique Sánchez; Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"Yo me siento hoy gozoso porque Cristo me salvó, su Palabra me hace ver que es la verdad, pero quiero conocerle y escuchar su tierna voz, ¡Oh! yo quiero ver a Cristo más allá. trono allá en la gloria donde siempre cantaré: ¡Oh! yo quiero ver a Cristo más allá. Letra: Enrique Sánchez"},{"t":"v","n":"2","x":"¡Oh! yo sé que él me guía y no me deja caer mientras haga su bendita voluntad; y me dice que no tema porque él conmigo está, ¡Oh! yo quiero ver a Cristo más allá. Música: William James Kirkpatrick (1838-1921)"},{"t":"v","n":"3","x":"Contaré la grande historia de su amor yo hablaré, les diré que él nos vino a salvar; él murió en el madero y pagado todo está, ¡Oh! yo quiero ver a Cristo más allá."},{"t":"v","n":"4","x":"Cuando ande en las calles de la gran Jerusalém do las calles son de oro yo lo sé; cuando cante con los santos la canción de redención ¡Oh! qué gozo a mi Cristo allí veré."},{"t":"c","x":"¡Oh! yo quiero ver a Cristo más allá en aquella hermosísima ciudad, en su"}]},{"s":"Himnario congregacional","n":"242b","t":"Dale fe y esperanza a mi país","p":"522","c":"","l":[{"t":"v","n":"1","x":"Dale fe y esperanza a mi país, ilumina, Señor a México; no permitas que esté lejos de ti, de tu amor necesita su sol y sus mares, sus pequeños pueblos, sus grandes ciudades. y a sus gobernantes. Letra y Música: Ricardo Ceratto, Arr. Isaac García Contreras"},{"t":"v","n":"2","x":"Hazle ver que el camino eres tú, guarda en tu corazón a México; en el nombre precioso de Jesús, te pedimos Señor por a cada instante, a su presidente"},{"t":"c","x":"México. México. Bendice su suelo, México. México. Bendice su gente"}]},{"s":"Himnario congregacional","n":"242c","t":"El cielo es el trono de mi Dios","p":"523","c":"","l":[{"t":"v","n":"1","x":"El cielo es el trono de mi Dios, la tierra el estrado de sus pies, y siendo tan sublime mi Señor, mi pequeño corazón le entrego hoy. ¡Oh, qué gran gozo! ¡qué maravilla! por eso yo no quiero más pecar, yo quiero ser su santo templo donde su Espíritu venga a morar. Letra y Música: Desconocido, Arm. Isaac García Contreras"}]},{"s":"Himnario congregacional","n":"242d","t":"Un cielo tiende sobre ti","p":"524","c":"Letra:    Gonzalo Báez Camargo; Música: Samuel A. Ward","l":[{"t":"v","n":"1","x":"Un cielo tiendo sobre ti su manto azul turquí; dos mares cantan tu loor, oh patria de mi amor. Mi México, mi México, bendígate el Señor, su gracia de hasta rebosar del uno al otro mar. Letra: Gonzalo Báez Camargo"},{"t":"v","n":"2","x":"Oh patria llena de dolor, la negra esclavitud del fanatismo y el error opacan tu virtud. Mi México, mi México, bendígate el Señor, verás tu noche terminar y el nuevo día brillar. Música: Samuel A. Ward"},{"t":"v","n":"3","x":"Como la nube que alumbró al pueblo de Israel, la Santa Biblia que te dió te guíe siempre a él. Mi México, mi México, que Dios contigo esté, y la palabra de verdad te dé la libertad."},{"t":"v","n":"4","x":"Enciende un vivo resplandor tu cielo azul turquí, verás la gloria del Señor naciendo sobre ti. Mi México, mi México, por fin brilla tu luz, y tus tritezas cesarán si buscas a Jesús."}]},{"s":"Himnario congregacional","n":"243","t":"Cuán glorioso es el cambio operado en mi ser","p":"525","c":"Letra:    Rufus Henry McDaniel (1850-1940), Tr. Vicente Mendoza Polanco (1875-1955); Música: Charles Hutchinson Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Cuán glorioso es el cambio operado en mi ser viniendo a mi vida el Señor; hay en mi alma una paz que yo ansiaba tener, la paz que me trajo su azón! soy feliz en la vida que Cristo me dio, cuando él vino a mi corazón. Letra: Rufus Henry McDaniel (1850-1940), Tr. Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Ya no voy por la senda que el mal me trazó, do sólo en contré confusión; mis errores pasados Jesús los borró cuando él vino a mi coraMúsica: Charles Hutchinson Gabriel (1856-1932)"},{"t":"v","n":"3","x":"Ni una sombra de duda oscurece su amor, amor que me trajo el perdón; la esperanza que aliento la debo al Señor, cuando él vino a mi cora -"},{"t":"c","x":"zón. - ¡Él vino a mi corazón! ¡Él vino a mi cora -"}]},{"s":"Himnario congregacional","n":"244","t":"Cuando vine a tus plantas, Señor","p":"526–527","c":"","l":[{"t":"v","n":"1","x":"Cuan do vine a tus plantas, Señor, sólo había en mi alma pesar; pero ahora que ya vivo en Ti, dulce paz he podido en contrar; cuando triste en pecado me vi sin consuelo para mi dolor, fue tu mano bendita, Señor, la que me salLetra y Música: Leonardo Flores Esparza, ICIAR pies dándote gracias por lo que has hecho por mí, me diste dulce paz, consuelo en mi aflicción; sólo te pido que me ayudes a vivir constante mente en pureza y santidad, yo sólo sé que de tu mano mi Señor, podré llegar a la morada celestial."},{"t":"v","n":"2","x":"Por el mundo vagaba sin luz, sin ninguna esperanza, sin fe, cuando alguien me habló de Jesús, y su amor y su paz encontré; desde entonces mi vida cambió, todo en mí sólo fue bendición porque Cristo su mano tendió y me levan-"},{"t":"c","x":"vó y me dio redención. Mi buen Jesús, aquí me tienes a tus tó y me dio salvación."}]},{"s":"Himnario congregacional","n":"245","t":"Si la luz del sol se oculta","p":"528","c":"","l":[{"t":"v","n":"1","x":"Si la luz del sol se oculta y vacila en mi la fe, mi plegaria elevo y clamo: ¡Cristo mi piloto sé!. no me espanta el mar furioso, sólo en él yo confiaré. Letra y Música: Emily Devine Wilson (Mrs. J. G. Wilson, 1865-1942), Tr. Speros Demetrios Athans (1883-1969)"},{"t":"v","n":"2","x":"Siempre que mi barca boga en el tempestuoso mar; puedo fiar en mi piloto, y en su seno reposar."},{"t":"v","n":"3","x":"Por la ruta que ha marcado mi piloto me guiará; en mis luchas y conflictos, gracia y triunfo me dará."},{"t":"v","n":"4","x":"Cuando llegue a la ribera de la patria celestial, me dará la bienvenida mi piloto sin igual."},{"t":"c","x":"Mi piloto irá conmigo, y de nada temeré;"}]},{"s":"Himnario congregacional","n":"246","t":"En el seno de mi alma una dulce quietud","p":"529","c":"Letra:    Warren Donald Cornell  (1858-1930?), Tr. Vicente Mendoza Polanco (1875-1955); Música: Rev. William Gustin Cooper (1861-1938)","l":[{"t":"v","n":"1","x":"En el seno de mi alma una dulce quietud se difunde em bargando mi ser; una calma infinita que sólo podrán los amados de Dios comprender. ruego que inunde por siempre mi ser, en sus ondas de amor celestial. Letra: Warren Donald Cornell (1858-1930?), Tr. Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"¡Qué tesoro yo tengo en la paz que me dio! y en el fondo de mi alma ha de estar, tan segura, que nadie quitarla podrá mientras miro los años pasar. Música: Rev. William Gustin Cooper (1861-1938)"},{"t":"v","n":"3","x":"Esta paz inefable consuelo me da descansando tan sólo en Jesús; y ningunos peligros mi vida tendrá; si me siento inundado en su luz."},{"t":"v","n":"4","x":"Alma triste que en rudo conflicto te ves, sola y débil tu senda al seguir; haz de Cristo el amigo, que fiel siempre es, ¡y su paz tú podrás recibir!"},{"t":"c","x":"¡Paz! ¡paz! cuán dulce paz, es aquella que el Padre me da; yo le"}]},{"s":"Himnario congregacional","n":"247","t":"En Jesús mi Señor encontré dulce paz","p":"530","c":"","l":[{"t":"v","n":"1","x":"En Jesús mi Señor encontré dulce paz, en Jesús quien por mí se entregó; si acudieres a él este don obtendrás, a ninguno jamás rechader; es un ra
