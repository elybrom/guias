<style>
/* Devocionales v2 — collage Pinterest + modo presentación */
:root{
  --ink:#2A1A10;--cafe:#5C3A21;--cafe2:#8B5E3C;--cafe3:#C4A882;
  --crema:#F6EFE3;--crema2:#EFE4D0;--papel:#FBF6EE;--nieve:#FFFCF6;
  --rosa:#E8A0BF;--rosa2:#C45C80;--rosita:#F7D5E3;
  --azul:#A8D4E6;--azul2:#5B9EBE;--celeste:#D6EEF6;
  --ama:#F8E6A0;--ama2:#E8C547;--lima:#F3E7B8;
  --oliva:#7A8B5C;--oliva2:#C5D1A8;
  --sello:#8B2E3A;--aviso:#7A2E2E;
  --shadow:0 10px 28px rgba(42,24,16,.14),0 2px 6px rgba(42,24,16,.08);
  --shadow-soft:0 6px 16px rgba(42,24,16,.1);
  --navh:74px;
  --fd:"Fraunces",Palatino,Georgia,serif;
  --fb:"Cormorant Garamond",Palatino,Georgia,serif;
  --fh:Caveat,"Segoe Script",cursive;
  --fu:Outfit,system-ui,sans-serif;
  --img:url("img/papel.webp");
  --lino:url("img/lino.webp");
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--crema);color:var(--ink);
  font-family:var(--fb);font-size:19px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html{scroll-behavior:smooth}
body{
  background-color:var(--crema);
  background-image:var(--lino),radial-gradient(1200px 800px at 20% -10%,rgba(248,230,160,.35),transparent 50%),
    radial-gradient(900px 700px at 110% 10%,rgba(232,160,191,.22),transparent 45%);
  background-size:420px 630px,auto,auto;
  min-height:100dvh;
}
body.presenting{background:#1a120c;overflow:hidden}
img{max-width:100%;display:block}
button,a{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{text-decoration:none}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0 0 .4em}
p{margin:0 0 .7em}
em{font-style:italic}
#app{min-height:100dvh;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 12px);position:relative}
body.presenting #app{padding-bottom:0;min-height:100dvh;height:100dvh;overflow:hidden}
.pad{padding:16px 16px 8px}
.fade{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(-2deg)}}
@keyframes float3d{
  0%,100%{transform:perspective(500px) rotateX(12deg) rotateY(-14deg) translateY(0)}
  50%{transform:perspective(500px) rotateX(6deg) rotateY(12deg) translateY(-12px)}
}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes pulse-dot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}
@keyframes stamp-slam{0%{transform:scale(1.8) rotate(-18deg);opacity:0}70%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:1}}
@keyframes petal{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(280deg);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wordin{from{opacity:0;transform:translateY(18px) rotateX(50deg)}to{opacity:1;transform:none}}
@keyframes pagefwd{from{transform:translateX(30%) rotateY(-8deg);opacity:.3}to{transform:none;opacity:1}}
@keyframes pageback{from{transform:translateX(-30%) rotateY(8deg);opacity:.3}to{transform:none;opacity:1}}
@keyframes grain{0%{transform:translate(0)}100%{transform:translate(-2%,-1%)}}
.turn-fwd{animation:pagefwd .55s cubic-bezier(.2,.8,.2,1) both}
.turn-back{animation:pageback .55s cubic-bezier(.2,.8,.2,1) both}

/* ——— top bar ——— */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(246,239,227,.94),rgba(246,239,227,.78) 70%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.presenting .topbar{display:none}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--nieve);box-shadow:var(--shadow-soft);border:1px solid rgba(92,58,33,.1);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--cafe);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topbar .tt{flex:1;text-align:center;font-family:var(--fh);font-size:1.45rem;color:var(--cafe);line-height:1}
.topbar .tt small{display:block;font-family:var(--fu);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cafe2);font-weight:600}

/* ——— bottom nav ——— */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));
  padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:space-around;align-items:flex-start;
  background:var(--nieve) var(--img);background-size:auto,320px;
  box-shadow:0 -8px 24px rgba(42,24,16,.08);
  border-top:0}
.bnav::before{content:"";position:absolute;left:0;right:0;top:-10px;height:12px;
  background:var(--nieve);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 12' preserveAspectRatio='none'><path fill='black' d='M0 12 Q10 2 20 8 T40 6 T60 10 T80 5 T100 9 T120 4 T140 10 T160 6 T180 11 T200 5 T220 9 T240 4 T260 10 T280 6 T300 11 T320 5 T340 9 T360 4 T380 8 T400 6 V12Z'/></svg>") center/100% 100%;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 12' preserveAspectRatio='none'><path fill='black' d='M0 12 Q10 2 20 8 T40 6 T60 10 T80 5 T100 9 T120 4 T140 10 T160 6 T180 11 T200 5 T220 9 T240 4 T260 10 T280 6 T300 11 T320 5 T340 9 T360 4 T380 8 T400 6 V12Z'/></svg>") center/100% 100%}
body.presenting .bnav{display:none}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--cafe2);
  font-family:var(--fu);font-size:.62rem;font-weight:600;letter-spacing:.02em;padding:4px 0;text-decoration:none;
  -webkit-tap-highlight-color:transparent}
.bnav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav a.on{color:var(--cafe)}
.bnav a.on svg{fill:rgba(232,160,191,.35);stroke:var(--rosa2)}
.bnav a.on span{font-family:var(--fh);font-size:.95rem;font-weight:700}

/* ——— collage primitives ——— */
.pola{background:#fff;padding:9px 9px 32px;box-shadow:var(--shadow);position:relative;
  border:1px solid rgba(92,58,33,.08)}
.pola img,.pola .ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:#ddd;display:block}
.pola figcaption,.pola .cap{position:absolute;left:0;right:0;bottom:6px;text-align:center;
  font-family:var(--fh);font-size:1.15rem;color:var(--cafe);line-height:1}
.pola.sq img,.pola.sq .ph{aspect-ratio:1}
.pola.tall img,.pola.tall .ph{aspect-ratio:3/4}
.tilt-l{transform:rotate(-3.2deg)}
.tilt-r{transform:rotate(2.6deg)}
.tilt-ll{transform:rotate(-6deg)}
.tilt-rr{transform:rotate(5deg)}
.tape,.tape-h{position:absolute;z-index:2;height:22px;width:78px;
  background:linear-gradient(180deg,rgba(255,250,230,.55),rgba(248,230,160,.62));
  box-shadow:0 1px 2px rgba(42,24,16,.12);border:1px solid rgba(255,255,255,.5);
  mix-blend-mode:multiply}
.tape{top:-8px;left:50%;transform:translateX(-50%) rotate(-2deg)}
.tape.pink{background:linear-gradient(180deg,rgba(247,213,227,.65),rgba(232,160,191,.55))}
.tape.blue{background:linear-gradient(180deg,rgba(214,238,246,.7),rgba(168,212,230,.55))}
.tape-l{left:10px;top:-7px;transform:rotate(-18deg)}
.tape-r{right:10px;left:auto;top:-7px;transform:rotate(16deg)}
.washi{height:16px;border-radius:1px;
  background:repeating-linear-gradient(90deg,var(--rosa) 0 7px,var(--rosita) 7px 14px,var(--ama) 14px 18px,var(--celeste) 18px 24px);
  opacity:.85;box-shadow:0 1px 0 rgba(255,255,255,.5) inset;mix-blend-mode:multiply}
.washi.slim{height:10px}
.washi.gold{background:repeating-linear-gradient(90deg,var(--ama2) 0 6px,var(--ama) 6px 14px,#fff6 14px 16px)}
.washi.blue{background:repeating-linear-gradient(90deg,var(--azul) 0 8px,var(--celeste) 8px 16px)}
.torn{position:relative;background:var(--papel) var(--img);background-size:auto,280px;
  box-shadow:var(--shadow-soft);padding:18px 16px 22px;margin:14px 0}
.torn:before,.torn:after{content:"";position:absolute;left:0;right:0;height:14px;
  background:inherit;pointer-events:none;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 14' preserveAspectRatio='none'><path fill='black' d='M0 14 L0 6 Q8 0 16 7 T32 5 T48 8 T64 3 T80 9 T96 4 T112 8 T128 2 T144 9 T160 5 T176 10 T192 3 T208 8 T224 4 T240 9 T256 3 T272 8 T288 4 L300 7 V14Z'/></svg>") center/100% 100%;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 14' preserveAspectRatio='none'><path fill='black' d='M0 14 L0 6 Q8 0 16 7 T32 5 T48 8 T64 3 T80 9 T96 4 T112 8 T128 2 T144 9 T160 5 T176 10 T192 3 T208 8 T224 4 T240 9 T256 3 T272 8 T288 4 L300 7 V14Z'/></svg>") center/100% 100%}
.torn:before{top:-12px}
.torn:after{bottom:-12px;transform:scaleY(-1)}
.kicker{font-family:var(--fu);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--rosa2);margin:0 0 6px}
.hand{font-family:var(--fh);color:var(--cafe)}
.stain{position:absolute;pointer-events:none;opacity:.45;mix-blend-mode:multiply;z-index:0}
.paperclip{position:absolute;top:-14px;right:18px;width:18px;height:42px;border:3px solid #b8c0c8;border-bottom:0;border-radius:10px 10px 0 0;transform:rotate(8deg);z-index:3}
.paperclip:after{content:"";position:absolute;left:2px;top:8px;width:8px;height:28px;border:2.5px solid #b8c0c8;border-top:0;border-radius:0 0 6px 6px}
.badge-ch{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c45c6a,#8B2E3A 60%,#5a1520);
  color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:1.5rem;
  box-shadow:2px 4px 0 rgba(90,20,30,.25),inset 0 3px 6px rgba(255,255,255,.25),0 8px 16px rgba(42,24,16,.2);
  border:3px solid #f3d56b;transform:rotate(-8deg)}
.seal{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d46a6a,#8B2E3A 58%,#4a1218);
  color:#f8e6a0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--fd);box-shadow:0 6px 14px rgba(139,46,58,.35),inset 0 3px 6px rgba(255,255,255,.2);
  border:2px dashed rgba(248,230,160,.55);transform:rotate(-12deg);text-align:center;line-height:1}
.seal b{font-size:1.55rem}
.seal span{font-family:var(--fh);font-size:.85rem;color:#fff}
.seal.alive{animation:wiggle 3.4s ease-in-out infinite}
.stamp-leido{width:110px;height:110px;border-radius:50%;border:6px double #8B2E3A;color:#8B2E3A;
  display:grid;place-items:center;font-family:var(--fh);font-size:2rem;font-weight:700;
  transform:rotate(-14deg);background:rgba(255,250,240,.7);box-shadow:0 0 0 3px rgba(139,46,58,.15);
  animation:stamp-slam .55s cubic-bezier(.2,1.4,.3,1) both;pointer-events:none}

/* 3D floating icon */
.icon3d{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(145deg,#fff,#f0e4d0);
  box-shadow:-6px -6px 14px rgba(255,255,255,.8),8px 12px 22px rgba(60,36,21,.2),inset 0 2px 4px rgba(255,255,255,.85);
  transform:perspective(500px) rotateX(12deg) rotateY(-14deg);
  animation:float3d 5s ease-in-out infinite;font-size:2rem;line-height:1}
.icon3d.d2{animation-delay:-1.6s;width:56px;height:56px;border-radius:18px;font-size:1.6rem}
.icon3d.d3{animation-delay:-3s;width:48px;height:48px;font-size:1.35rem}

/* ——— buttons ——— */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--fu);font-size:.88rem;font-weight:600;text-decoration:none;
  padding:12px 18px;border-radius:999px;border:1.5px solid rgba(92,58,33,.15);
  background:var(--nieve);color:var(--cafe);box-shadow:var(--shadow-soft);
  transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-pri{background:linear-gradient(180deg,#6b4430,#5C3A21);color:#F8E6A0;border-color:transparent;
  box-shadow:0 8px 18px rgba(92,58,33,.28)}
.btn-rosa{background:linear-gradient(180deg,#f3c6d4,#e8a0bf);color:#5C3A21;border-color:transparent}
.btn-azul{background:linear-gradient(180deg,#d6eef6,#a8d4e6);color:#1e4660;border-color:transparent}
.btn-gold{background:linear-gradient(180deg,#fff0b0,#f3d56b);color:#5C3A21;border-color:transparent}
.btn-ghost{background:transparent;box-shadow:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  font-family:var(--fu);font-size:.75rem;font-weight:600;background:var(--celeste);color:#1e4660}

/* ——— home collage ——— */
.hero-col{position:relative;padding:8px 14px 10px;min-height:420px}
.hero-col .bg-polaroids{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hero-col .bg-polaroids .pola{position:absolute;width:42%;padding:6px 6px 24px}
.hero-col .bg-polaroids img{aspect-ratio:1}
.date-hand{font-family:var(--fh);font-size:1.55rem;color:var(--rosa2);margin:0;position:relative;z-index:2}
.hero-title{font-family:var(--fd);font-weight:800;font-size:clamp(2.15rem,9vw,3.4rem);line-height:1.02;
  letter-spacing:-.03em;margin:.1em 0 .25em;position:relative;z-index:2;color:var(--ink);
  perspective:600px}
.hero-title .w{display:inline-block;animation:wordin .6s cubic-bezier(.2,.7,.2,1) both}
.hero-title .w:nth-child(2){animation-delay:.07s}.hero-title .w:nth-child(3){animation-delay:.14s}
.hero-title .w:nth-child(4){animation-delay:.21s}.hero-title .w:nth-child(5){animation-delay:.28s}
.hero-title .w:nth-child(6){animation-delay:.35s}.hero-title .w:nth-child(7){animation-delay:.42s}
.hero-title .w:nth-child(8){animation-delay:.49s}.hero-title .w:nth-child(9){animation-delay:.56s}
.hero-sub{font-family:var(--fb);font-style:italic;font-size:1.2rem;color:var(--cafe);position:relative;z-index:2;max-width:22ch}
.hoy-card{position:relative;z-index:2;margin:18px 2px 8px}
.hoy-card .pola{padding:10px 10px 14px}
.hoy-card .pola img{aspect-ratio:16/11}
.hoy-meta{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 6px 0}
.hoy-meta h2{font-size:1.45rem;margin:0;flex:1}
.hoy-card .teaser{font-style:italic;color:var(--cafe);margin:6px 4px 10px;font-size:1.08rem}
.progress-row{display:flex;align-items:center;gap:12px;margin:8px 4px 16px;position:relative;z-index:2}
.bar{flex:1;height:12px;background:rgba(92,58,33,.1);border-radius:99px;overflow:hidden;border:1px solid rgba(92,58,33,.08)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--rosa),var(--ama),var(--azul));border-radius:99px;width:0;transition:width 1s ease}
.num-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 18px}
.num-card{background:var(--nieve);border-radius:18px;padding:14px 8px 12px;text-align:center;
  box-shadow:var(--shadow-soft);border:1px solid rgba(92,58,33,.07);position:relative;overflow:hidden}
.num-card b{display:block;font-family:var(--fd);font-size:2rem;font-weight:800;color:var(--cafe);line-height:1}
.num-card span{font-family:var(--fh);font-size:1.15rem;color:var(--cafe2)}
.num-card:nth-child(1){transform:rotate(-2deg);background:linear-gradient(180deg,#fff,var(--rosita))}
.num-card:nth-child(2){transform:rotate(1.5deg);background:linear-gradient(180deg,#fff,var(--celeste))}
.num-card:nth-child(3){transform:rotate(-1deg);background:linear-gradient(180deg,#fff,var(--ama))}
.archive-strip{display:flex;gap:12px;overflow-x:auto;padding:10px 4px 22px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.archive-strip .pola{min-width:148px;width:148px;scroll-snap-align:start;padding:7px 7px 28px;flex:none}
.archive-strip img{aspect-ratio:1;height:110px;object-fit:cover}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:8px 4px 4px}
.section-h h3{font-size:1.35rem;margin:0}
.section-h a{font-family:var(--fh);font-size:1.15rem;color:var(--rosa2)}

/* chapter journal */
.ch-head{position:relative;margin:4px 0 16px}
.ch-cover{position:relative}
.ch-cover .pola{margin:0 18px}
.ch-cover .badge-ch{position:absolute;left:6px;bottom:18px;z-index:3}
.ch-title{margin:16px 8px 6px;font-size:clamp(1.7rem,6.5vw,2.35rem)}
.ch-title .w{display:inline-block;animation:wordin .55s cubic-bezier(.2,.7,.2,1) both}
.ch-nav{display:flex;justify-content:space-between;align-items:center;margin:6px 4px 10px}
.ch-nav a{font-family:var(--fh);font-size:1.2rem;color:var(--cafe)}
.verse{background:var(--nieve);border:1px solid rgba(92,58,33,.08);padding:18px 16px 14px;margin:14px 0;
  position:relative;box-shadow:var(--shadow-soft)}
.verse blockquote{margin:0;font-family:var(--fb);font-style:italic;font-size:1.22rem;line-height:1.4;color:var(--ink)}
.verse figcaption{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  font-family:var(--fu);font-size:.75rem;color:var(--cafe2);font-weight:600}
.verse .fav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--rosita)}
.verse .fav.on{background:var(--rosa2);color:#fff}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ticket{background:var(--ama);padding:7px 12px;font-family:var(--fu);font-size:.78rem;font-weight:600;
  color:var(--cafe);position:relative;border-radius:2px;
  box-shadow:2px 3px 0 rgba(92,58,33,.08)}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:10px;height:10px;background:var(--crema);
  border-radius:50%;transform:translateY(-50%)}
.ticket:before{left:-5px}.ticket:after{right:-5px}
.aviso{background:linear-gradient(180deg,#fde8e4,#f8d2cc);border-left:5px solid var(--sello);
  padding:14px 14px 14px 16px;margin:12px 0;font-size:1.02rem;color:#4a1218;
  box-shadow:var(--shadow-soft)}
.aviso b{font-family:var(--fu);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px}
.unveil{position:relative}
.unveil .veil{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(246,239,227,.92) 0 12px,rgba(239,228,208,.92) 12px 24px);
  display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;
  font-family:var(--fh);font-size:1.4rem;color:var(--cafe);text-align:center;padding:16px;
  border:2px dashed var(--cafe3)}
.unveil.open .veil{display:none}
.flip{perspective:1000px;height:auto;min-height:180px;margin:12px 0;cursor:pointer}
.flip-inner{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);min-height:180px}
.flip.on .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{background:var(--nieve);padding:16px;box-shadow:var(--shadow-soft);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(92,58,33,.08);min-height:180px}
.flip-back{position:absolute;inset:0;transform:rotateY(180deg);background:linear-gradient(180deg,#fff,var(--rosita))}
.flip-front{background:linear-gradient(180deg,#fff,var(--lima))}
.flip .hint{font-family:var(--fh);font-size:1rem;color:var(--cafe2);margin-top:8px}
.preguntas{counter-reset:q}
.preguntas li{list-style:none;margin:0 0 10px;padding:12px 12px 12px 48px;background:var(--nieve);
  position:relative;box-shadow:var(--shadow-soft);border-radius:2px 14px 14px 2px}
.preguntas li:before{counter-increment:q;content:counter(q);position:absolute;left:8px;top:10px;
  width:28px;height:28px;border-radius:50%;background:var(--ama);display:grid;place-items:center;
  font-family:var(--fd);font-weight:800;font-size:.95rem;color:var(--cafe)}
.oracion{font-style:italic;font-size:1.15rem;line-height:1.5;
  background:repeating-linear-gradient(var(--papel),var(--papel) 31px,#e8d9c0 32px);
  padding:8px 14px 16px;box-shadow:var(--shadow-soft)}
.note-box textarea{width:100%;min-height:110px;border:0;background:repeating-linear-gradient(transparent,transparent 27px,#e8d9c0 28px) var(--papel);
  font-family:var(--fh);font-size:1.35rem;line-height:28px;padding:8px 12px;resize:vertical;color:var(--ink);border-radius:0}
.note-box .saved{font-family:var(--fu);font-size:.7rem;color:var(--oliva);min-height:1em}
.ext-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--fu);font-size:.8rem;font-weight:600;
  color:var(--azul2);border-bottom:1.5px dashed var(--azul)}

/* quiz */
.q-block{background:var(--nieve);padding:14px 14px 10px;margin:12px 0;box-shadow:var(--shadow-soft)}
.q-block h3{font-size:1.15rem}
.opt{display:block;width:100%;text-align:left;padding:11px 12px;margin:6px 0;border-radius:12px;
  border:1.5px solid rgba(92,58,33,.12);background:#fff;font-family:var(--fb);font-size:1.05rem;
  transition:background .15s}
.opt.ok{background:var(--oliva2);border-color:var(--oliva)}
.opt.bad{background:#f8d2cc;border-color:var(--sello)}
.exp{display:none;font-size:1rem;color:var(--cafe);padding:8px 4px 4px}
.exp.show{display:block}

/* biblioteca + plan */
.tabs{display:flex;gap:8px;margin:8px 0 14px}
.tabs button{font-family:var(--fu);font-size:.8rem;font-weight:600;padding:8px 14px;border-radius:999px;
  background:transparent;border:1.5px solid rgba(92,58,33,.15);color:var(--cafe)}
.tabs button.on{background:var(--cafe);color:var(--ama)}
.books{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.book{background:var(--nieve);padding:14px 12px;box-shadow:var(--shadow-soft);min-height:88px;
  border:1px solid rgba(92,58,33,.07);position:relative}
.book b{display:block;font-family:var(--fd);font-size:1.12rem}
.book span{font-family:var(--fu);font-size:.72rem;color:var(--cafe2)}
.book.lock{opacity:.55}
.book.lock:after{content:"Pronto";position:absolute;top:8px;right:8px;font-family:var(--fh);font-size:.95rem;color:var(--rosa2)}
.book.open{background:linear-gradient(160deg,#fff,var(--ama));transform:rotate(-1deg)}
.ch-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--nieve);
  box-shadow:var(--shadow-soft);margin:8px 0;text-decoration:none;color:inherit;border:1px solid rgba(92,58,33,.06)}
.ch-item .n{width:36px;height:36px;border-radius:50%;background:var(--ama);display:grid;place-items:center;
  font-family:var(--fd);font-weight:800;color:var(--cafe);flex:none}
.ch-item.read .n{background:var(--oliva2)}
.ch-item small{display:block;color:var(--cafe2);font-style:italic;font-size:.95rem}
.group-lab{font-family:var(--fh);font-size:1.25rem;color:var(--rosa2);margin:16px 4px 4px}
.cal{margin:10px 0 22px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .wd{font-family:var(--fu);font-size:.62rem;font-weight:600;letter-spacing:.06em;color:var(--cafe2);padding:4px 0}
.day{aspect-ratio:1;display:grid;place-items:center;font-family:var(--fu);font-size:.78rem;font-weight:600;
  background:rgba(255,255,255,.5);border-radius:10px;text-decoration:none;color:var(--ink);border:0}
.day.today{box-shadow:0 0 0 2px var(--rosa2);background:var(--rosita)}
.day.plan{background:var(--ama)}
.day.done{background:var(--oliva2)}
.day.empty{background:transparent}

/* timeline */
.tl{position:relative;padding:8px 8px 8px 28px}
.tl:before{content:"";position:absolute;left:17px;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--rosa),var(--ama),var(--azul),var(--oliva));border-radius:3px}
.tl-item{position:relative;margin:0 0 16px;padding:14px 14px 12px;background:var(--nieve);
  box-shadow:var(--shadow-soft);margin-left:10px}
.tl-item .dot{position:absolute;left:-28px;top:16px;width:18px;height:18px;border-radius:50%;
  background:var(--ama);border:3px solid var(--cafe);z-index:1}
.tl-item.bad .dot{background:var(--sello);border-color:#4a1218}
.tl-item.note .dot{background:var(--azul)}
.tl-item h3{font-size:1.15rem;margin:0 0 4px}
.tl-item .yrs{font-family:var(--fh);color:var(--rosa2);font-size:1.15rem}
.tl-item a{font-family:var(--fu);font-size:.75rem;font-weight:600;color:var(--azul2)}

/* map */
.map-wrap{background:linear-gradient(180deg,#e8f0d8,#d6e6c6);padding:8px;box-shadow:var(--shadow);margin:8px 0;
  position:relative}
.map-wrap svg{width:100%;height:auto;display:block}
.map-wrap .pin{cursor:pointer}
.map-card{background:var(--nieve);padding:14px 14px 12px;box-shadow:var(--shadow);margin:12px 8px;position:relative}
.map-legend{font-family:var(--fu);font-size:.72rem;color:var(--cafe2);padding:4px 8px}

/* search + diario */
.search-box{display:flex;gap:8px;margin:8px 0 14px}
.search-box input{flex:1;border:0;background:var(--nieve);padding:12px 14px;font-family:var(--fb);font-size:1.15rem;
  box-shadow:var(--shadow-soft);border-radius:2px}
.hit{display:block;padding:12px;background:var(--nieve);margin:8px 0;box-shadow:var(--shadow-soft);color:inherit}
.hit b{font-family:var(--fd)}
.hit mark{background:var(--ama);padding:0 2px}
.fav-item{background:var(--nieve);padding:14px;margin:10px 0;box-shadow:var(--shadow-soft)}
.fav-item blockquote{margin:0 0 6px;font-style:italic}

/* welcome */
#welcome{position:fixed;inset:0;background:rgba(42,24,16,.45);z-index:80;display:grid;place-items:end center;
  padding:16px;animation:fadein .35s both}
#welcome .sheet{background:var(--papel) var(--img);background-size:auto,300px;padding:22px 18px 28px;
  width:100%;max-width:440px;box-shadow:0 -12px 40px rgba(42,24,16,.25);position:relative;
  border-radius:8px 8px 0 0}
#welcome h2{font-size:1.85rem}

/* explorar grid */
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.ex-tile{background:var(--nieve);padding:16px 12px 14px;box-shadow:var(--shadow-soft);min-height:120px;position:relative;overflow:hidden}
.ex-tile h3{font-size:1.15rem;margin:8px 0 0}
.ex-tile p{font-size:.95rem;color:var(--cafe2);margin:4px 0 0}
.ex-tile .icon3d{width:48px;height:48px;font-size:1.4rem;margin-bottom:4px}

/* ——— PRESENTATION DECK ——— */
.deck{position:fixed;inset:0;z-index:50;background:#1a120c;color:#fbf6ee;display:flex;flex-direction:column;
  height:100dvh;width:100%;overflow:hidden;touch-action:pan-y}
.story-bars{display:flex;gap:4px;padding:10px 12px 0;position:absolute;top:0;left:0;right:0;z-index:6}
.story-bars i{flex:1;height:3px;background:rgba(255,255,255,.28);border-radius:3px;overflow:hidden}
.story-bars i em{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.story-bars i.done em{width:100%}
.story-bars i.cur em{width:100%;animation:pulse-dot 1.8s ease-in-out infinite}
.deck-close,.deck-prev,.deck-next{position:absolute;z-index:7;display:grid;place-items:center;
  background:rgba(255,252,246,.16);backdrop-filter:blur(6px);border-radius:50%;color:#fff;
  width:42px;height:42px;border:1px solid rgba(255,255,255,.2)}
.deck-close{top:22px;right:12px;font-size:1.4rem;font-family:var(--fu)}
.deck-prev,.deck-next{top:50%;transform:translateY(-50%);width:38px;height:58px;border-radius:14px;font-size:1.3rem;opacity:.55}
.deck-prev{left:4px}.deck-next{right:4px}
.deck-hint{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-family:var(--fh);
  font-size:1.35rem;color:rgba(255,255,255,.8);z-index:6;pointer-events:none;animation:fadein .6s .4s both}
.slides{flex:1;height:100%;position:relative}
.slide{position:absolute;inset:0;overflow:auto;padding:52px 22px 48px;
  display:flex;flex-direction:column;justify-content:center;
  background-size:cover;background-position:center;opacity:0;pointer-events:none;
  transform:translateX(40px) scale(.98);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.slide.on{opacity:1;pointer-events:auto;transform:none;z-index:2}
.slide.exit-l{opacity:0;transform:translateX(-50px) scale(.98)}
.slide.exit-r{opacity:0;transform:translateX(50px) scale(.98)}
.slide .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,18,12,.35) 0%,rgba(26,18,12,.55) 40%,rgba(26,18,12,.82) 100%);
  pointer-events:none;z-index:0}
.slide .s-body{position:relative;z-index:1}
.slide .sk{font-family:var(--fu);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;
  color:var(--ama);margin:0 0 10px}
.slide h1,.slide h2{font-family:var(--fd);font-weight:800;font-size:clamp(2rem,8.4vw,3.4rem);line-height:1.05;
  letter-spacing:-.03em;color:#fff;margin:0 0 14px;perspective:600px;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.slide h1 .w,.slide h2 .w{display:inline-block;animation:wordin .55s cubic-bezier(.2,.7,.2,1) both}
.slide .lead{font-family:var(--fb);font-size:clamp(1.15rem,4vw,1.4rem);line-height:1.4;color:#f3ead8;max-width:34ch}
.slide .lead.scroll{max-height:46vh;overflow:auto}
.slide .s-verse{font-family:var(--fb);font-style:italic;font-size:clamp(1.35rem,5vw,1.85rem);line-height:1.35;
  color:#fff;max-width:22em;text-shadow:0 4px 18px rgba(0,0,0,.4)}
.slide .s-ref{font-family:var(--fh);font-size:1.45rem;color:var(--ama);margin-top:12px}
.slide .floaters{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.slide .floaters .icon3d{position:absolute}
.dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:6;flex-wrap:wrap;padding:0 40px}
.dots b{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);display:block}
.dots b.on{background:#fff;width:16px;border-radius:4px}
.slide .paper-card{background:var(--papel);color:var(--ink);padding:18px 16px;box-shadow:var(--shadow);
  position:relative;max-height:58vh;overflow:auto}
.slide .paper-card h2{color:var(--ink);text-shadow:none;font-size:clamp(1.5rem,6vw,2.1rem)}
.slide.aviso-s .paper-card{background:#fde8e4;color:#4a1218}
.q-slide li{margin:0 0 10px;padding:10px 12px;background:rgba(255,252,246,.1);border-left:3px solid var(--ama);
  list-style:none;font-size:1.08rem;color:#f3ead8}

/* infographics */
.cycle{width:100%;max-width:360px;margin:0 auto;display:block}
.cycle .node{transform-box:fill-box;transform-origin:center}
.cycle .arc{fill:none;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1.4s ease forwards}
.nums-big{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:10px 0}
.nums-big .nb{text-align:center;min-width:96px;background:rgba(255,252,246,.1);padding:14px 10px;border-radius:16px;
  border:1px solid rgba(255,255,255,.12)}
.nums-big .nb b{display:block;font-family:var(--fd);font-size:clamp(2.4rem,10vw,3.6rem);font-weight:800;color:var(--ama);line-height:1}
.nums-big .nb span{font-family:var(--fh);font-size:1.2rem;color:#fff}
.tribes-svg{width:100%;max-width:340px;margin:0 auto;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3))}
.tribes-svg .t{fill:#c4a882;stroke:#2a1a10;stroke-width:1.2;transition:fill .4s}
.tribes-svg .t.on{fill:#e8a0bf;animation:pulse-dot 1.6s ease-in-out infinite}
.tribes-svg text{font-family:var(--fu);font-size:9px;fill:#2a1a10;font-weight:600;pointer-events:none}
.info-note{font-family:var(--fu);font-size:.72rem;color:rgba(255,255,255,.7);margin-top:10px;text-align:center}

/* stickers tray */
.sticker-tray{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));
  z-index:35;background:rgba(255,252,246,.94);backdrop-filter:blur(8px);
  padding:8px 10px 8px;display:flex;gap:8px;overflow-x:auto;box-shadow:0 -4px 16px rgba(42,24,16,.1);
  transform:translateY(110%);transition:transform .3s ease}
.sticker-tray.open{transform:none}
.sticker-tray button{flex:none;width:52px;height:52px;border-radius:14px;background:#fff;box-shadow:var(--shadow-soft);
  display:grid;place-items:center}
.sticker-tray svg,.sticker{width:40px;height:40px;display:block;overflow:visible}
.sticker-fab{position:fixed;right:14px;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));
  z-index:36;width:52px;height:52px;border-radius:50%;background:var(--ama);color:var(--cafe);
  box-shadow:var(--shadow);font-size:1.5rem;display:grid;place-items:center}
body.presenting .sticker-fab,body.presenting .sticker-tray{display:none}
.sticker-layer{position:absolute;inset:0;pointer-events:none;z-index:25}
.sticker-layer .sticker{position:absolute;pointer-events:auto;cursor:grab;width:64px;height:64px;touch-action:none}
.sticker-layer .sticker:active{cursor:grabbing}

/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
#confetti i{position:absolute;top:-8vh;width:12px;height:16px;border-radius:2px 10px 4px 10px;
  animation:petal 2.2s linear forwards;opacity:.95}

.credits{font-family:var(--fu);font-size:.75rem;color:var(--cafe2);line-height:1.45;padding:8px 4px 24px}
.credits a{color:var(--azul2)}
.muted{color:var(--cafe2);font-size:.95rem}
hr.washi-hr{border:0;height:12px;margin:18px 0;background:repeating-linear-gradient(90deg,var(--rosa) 0 8px,var(--ama) 8px 16px,var(--azul) 16px 24px);opacity:.7;transform:rotate(-1deg)}
.intro-hero{position:relative;margin:0 0 16px}
.intro-hero h2{font-size:clamp(1.8rem,7vw,2.6rem);margin:.2em 0}
.intro-block{margin:12px 0}
.intro-block h3{font-size:1.15rem;color:var(--cafe)}

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .hero-title .w,.slide h1 .w,.ch-title .w{opacity:1;transform:none}
  .icon3d{transform:none}
}
@media (min-width:720px){
  #app{max-width:480px;margin:0 auto;box-shadow:0 0 0 1px rgba(92,58,33,.06),0 20px 60px rgba(42,24,16,.12)}
  .bnav{max-width:480px;left:50%;transform:translateX(-50%)}
  .deck,.sticker-tray,.sticker-fab,#welcome,#confetti{max-width:480px;left:50%;right:auto;transform:translateX(-50%)}
  .sticker-tray{transform:translate(-50%,110%)}
  .sticker-tray.open{transform:translate(-50%,0)}
  body.presenting .deck{transform:translateX(-50%)}
}

body,#app{overflow-x:hidden}
.flip-front,.flip-back{overflow:auto}

code{font-family:Outfit,ui-monospace,monospace;font-size:.85em;background:var(--ama);padding:1px 5px;border-radius:4px}
#bnav{position:fixed}

/* home hero: text above collage, no overlap */

.hero-col .bg-polaroids .pola{position:absolute;width:92px;padding:5px 5px 20px;opacity:.92;z-index:0}

.hero-title{padding-right:86px;margin-top:2px}
.hero-col .kicker{margin-top:2px}
.collage-strip{position:relative;height:84px;margin:0 0 2px;z-index:1}
.hoy-card{margin-top:10px}
.hoy-card .pola img,.hoy-card .pola .ph{aspect-ratio:16/9;max-height:168px;object-fit:cover}
.btn{white-space:nowrap}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;flex:none}
.btn-pri svg polygon{fill:currentColor}
.actions .btn-pri{min-width:200px}
.slide{padding:56px 48px 80px}
.slide .scrim{background:linear-gradient(180deg,rgba(26,18,12,.42) 0%,rgba(26,18,12,.62) 38%,rgba(26,18,12,.92) 100%)}
.slide .paper-card{background:var(--papel);color:var(--ink);padding:18px 16px 16px;box-shadow:0 16px 40px rgba(0,0,0,.35);
  position:relative;max-height:62vh;overflow:auto;border-radius:2px}
.slide .paper-card h2{color:var(--ink);text-shadow:none;font-size:clamp(1.45rem,6vw,2rem);margin-bottom:8px}
.slide .paper-card p{font-family:var(--fb);font-size:1.12rem;line-height:1.45;color:var(--ink)}
.deck-prev,.deck-next{opacity:.4}
.deck-prev:active,.deck-next:active{opacity:1}
.aviso{position:relative;z-index:1}
.reveal{opacity:1;transform:none} /* never leave content invisible if GSAP fails */


.collage-strip{height:108px;margin:0 0 2px;position:relative;z-index:1}
.collage-strip .pola{padding:5px 5px 6px !important}
.collage-strip .pola img,.collage-strip .pola .ph{aspect-ratio:1 !important;width:100%;height:auto;object-fit:cover}
.collage-strip .cap{display:none}
.collage-strip .tape{height:14px;width:52px;top:-6px}

<script type="application/json" id="jueces-data">
[{"n": 1, "title": "Después de Josué: la conquista incompleta", "teaser": "Israel consulta a Jehová, Judá sube primero, y el mapa queda lleno de pueblos que no fueron expulsados.", "contexto": "El libro se abre después de la muerte de Josué, cuando Israel ya está en Canaán y todavía no hay monarquía. Las heredades estaban asignadas (libro de Josué), pero la ocupación quedó incompleta. Jueces 1 es el prólogo militar del libro (1:1–2:5): registra qué se hizo y, sobre todo, qué se dejó de hacer.", "resumen": "Los hijos de Israel consultan a Jehová: ¿quién subirá primero contra los cananeos? Jehová responde que Judá subirá, y que Él ha entregado la tierra en sus manos (1:1-2). Judá invita a Simeón. Vencen a Adoni-bezec, quien reconoce una correspondencia entre lo que él había hecho a setenta reyes y lo que ahora le sucede (1:5-7). Se mencionan combates en Jerusalén, Hebrón y Debir, y el episodio de Otoniel y Acsa (también en Josué 15:13-19). Luego el tono cambia: Benjamín, Manasés, Efraín, Zabulón, Aser, Neftalí y Dan no expulsan por completo a los moradores. Cuando Israel se siente fuerte, somete a tributo, pero no expulsa. El capítulo cierra con los amorreos, que empujan a Dan hacia el monte.", "versiculos": [{"ref": "Jueces 1:1-2", "texto": "Aconteció después de la muerte de Josué, que los hijos de Israel consultaron a Jehová, diciendo: ¿Quién de nosotros subirá primero a pelear contra los cananeos? Y Jehová respondió: Judá subirá; he aquí que yo he entregado la tierra en sus manos."}], "dificiles": "El relato de Adoni-bezec (1:5-7) describe la violencia de aquella guerra y registra la interpretación del propio rey vencido; no es una práctica que el texto nos invite a imitar. Sobre Jerusalén: 1:8 habla de que Judá la combatió, la tomó y la dejó en fuego; 1:21 dice que Benjamín no echó al jebuseo, y que este habitó con Benjamín en Jerusalén «hasta hoy». El libro mismo deja ver una toma que no se tradujo en ocupación permanente. Josué 15:63 dice algo semejante respecto de Judá. Conviene leer esos versículos juntos, sin forzar una armonización que el narrador no explica. En 1:19, Jehová está con Judá, que expulsa a los de las montañas, pero no puede expeler a los de los llanos, que tenían carros herrados. El sujeto de esa impotencia, en el flujo de la frase, es Judá, no Jehová. El capítulo 2 dará la clave: el problema de fondo es que el pueblo no atendió la voz de Dios (2:1-3).", "conexiones": "Josué 15:13-19 y 15:63; Josué 13:1-6; Éxodo 34:12-13 y Deuteronomio 7:1-5 (el ángel los citará en Jueces 2:2); Génesis 49:8-10 (liderazgo de Judá); Jueces 2 (interpretación teológica); Jueces 3:9-11 (Otoniel, primer libertador).", "observacion": "El narrador abre con consulta a Jehová y una promesa («yo he entregado la tierra»). Después cataloga, tribu por tribu, expulsiones incompletas. Se repite la idea: no los expulsaron. Cuando se sienten fuertes, imponen tributo. El capítulo no cierra con un himno, sino con pueblos que permanecen.", "interpretacion": "Jueces 1 prepara la tragedia del libro. La victoria parcial, unida a un arreglo pragmático (el tributo), deja en la tierra a pueblos cuyas prácticas serán trampa. El contraste entre la promesa de 1:2 y el «no lo expulsó» no acusa a Dios de fallo: anticipa lo que el capítulo 2 dirá con claridad.", "doctrina": "Dios es fiel al pacto: responde y está con Judá. El don no anula la responsabilidad de obedecer. Distinción: describir las guerras de la conquista no es un mandato vigente para que la iglesia tome territorio por la espada (cf. Juan 18:36). Lo permanente es la santidad de Dios, su fidelidad y el peligro de contemporizar con la idolatría.", "aplicacion": "¿En qué áreas consultamos al Señor al principio y luego nos detenemos a medio camino? El tributo puede parecer fuerza: «los tenemos controlados». A veces es desobediencia disfrazada de prudencia. El liderazgo —en el coro, en la orquesta, en el estudio— empieza por no dejar en pie, en la propia vida, altares que el Señor ya señaló.", "preguntas": ["¿Qué diferencia hay entre consultar a Jehová en 1:1-2 y someter a tributo en vez de expulsar?", "¿Dónde has «sentido fuerza» y negociado un arreglo, en vez de obedecer por completo?", "¿Cómo prepara este capítulo, según el mismo libro, lo que leeremos en Jueces 2?", "¿Qué te dice que Jehová esté con Judá (1:19) y que, aun así, la conquista quede incompleta?"], "oracion": "Señor Jehová, tú entregaste la tierra y fuiste fiel cuando tu pueblo te consultó. Yo también quiero preguntarte primero, y no solo al comienzo. Muéstrame dónde he dejado tributo en lugar de obediencia. No me dejes conformarme con una victoria a medias. Que tu Palabra me haga sabio. En el nombre de Jesús, amén.", "quiz": [{"q": "Según Jueces 1:2, ¿quién debía subir primero contra los cananeos?", "opts": ["Efraín", "Judá", "Benjamín", "Dan"], "a": 1, "exp": "Jehová respondió: «Judá subirá; he aquí que yo he entregado la tierra en sus manos» (1:2, RVR1960)."}, {"q": "Cuando algunas tribus se sintieron fuertes, ¿qué hicieron con los cananeos que quedaban?", "opts": ["Los expulsaron por completo", "Hicieron alianza matrimonial formal", "Los hicieron tributarios, pero no los expulsaron", "Pidieron un rey"], "a": 2, "exp": "El capítulo repite que, al sentirse fuertes, sometieron a tributo y no expulsaron. Esa es la conquista incompleta."}, {"q": "El episodio de Otoniel y Acsa en este capítulo también aparece en:", "opts": ["Éxodo 17", "Josué 15", "Rut 4", "1 Samuel 8"], "a": 1, "exp": "Jueces 1:11-15 retoma lo narrado en Josué 15:13-19. Otoniel volverá en el capítulo 3 como primer juez."}, {"q": "En Jueces 1:19, ¿quién no pudo expeler a los que tenían carros herrados?", "opts": ["Jehová, según el sujeto de la frase", "Judá, aunque Jehová estaba con él", "Simeón solamente", "El ángel de Jehová"], "a": 1, "exp": "El texto dice que Jehová estaba con Judá, y que Judá no pudo expeler a los de los llanos. El sujeto de esa impotencia es Judá. El cap. 2 da la clave teológica."}]}, {"n": 2, "title": "Boquim y el ciclo: una generación que no conocía a Jehová", "teaser": "El ángel confronta al pueblo en Boquim, muere la generación de Josué, y el narrador explica el ciclo del libro entero.", "contexto": "Tras el prólogo militar del capítulo 1 llega el prólogo teológico (2:6–3:6, con 2:1-5 como puente). El ángel de Jehová sube de Gilgal a Boquim. Gilgal había sido el primer campamento en la tierra (Josué 4–5), lugar de memorial y de circuncisión. Boquim significa «los que lloran»: el nombre nace de lo que ocurre en este capítulo. El marco sigue siendo el período de los jueces, entre la conquista y la monarquía.", "resumen": "El ángel de Jehová recuerda el éxodo y el pacto: Dios no invalidará su pacto, con tal de que ellos no hagan pacto con los moradores y derriben sus altares. «Mas vosotros no habéis atendido a mi voz» (2:2). Por tanto, esos pueblos no serán echados y sus dioses serán tropezadero (2:3). El pueblo alza su voz y llora; ofrecen sacrificios. El narrador evoca entonces la muerte de Josué y de su generación, y dice que se levantó otra «que no conocía a Jehová, ni la obra que él había hecho por Israel» (2:10). En 2:11-19 se formula el ciclo que estructurará el libro: Israel hace lo malo y sirve a los baales; Jehová se enciende en furor y los entrega a enemigos; Él levanta jueces y, movido a misericordia por sus gemidos, los libra mientras vive el juez; al morir el juez, vuelven atrás y se corrompen más que sus padres.", "versiculos": [{"ref": "Jueces 2:10", "texto": "Y toda aquella generación también fue reunida a sus padres. Y se levantó después de ellos otra generación que no conocía a Jehová, ni la obra que él había hecho por Israel."}, {"ref": "Jueces 2:16, 18-19", "texto": "Y Jehová levantó jueces que los librasen de mano de los que les despojaban… Y cuando Jehová les levantaba jueces, Jehová estaba con el juez, y los libraba de mano de los enemigos todo el tiempo de aquel juez; porque Jehová era movido a misericordia por sus gemidos a causa de los que los oprimían y afligían. Mas acontecía que al morir el juez, ellos volvían atrás, y se corrompían más que sus padres…"}], "dificiles": "«No conocía a Jehová» (2:10) no significa ignorancia teórica de que Dios existía; el contexto lo liga a no conocer «la obra que él había hecho por Israel»: es un desconocimiento práctico, una ruptura de memoria y de relación. El llanto de Boquim es real, y ofrecen sacrificios; el resto del libro mostrará si esa emoción se traduce en fidelidad duradera. El ciclo de 2:11-19 es la clave de lectura que el propio narrador nos da: no hay que imponerle al libro otra estructura que la que él mismo declara. Dios «era movido a misericordia por sus gemidos»: el texto atribuye la liberación a la compasión de Jehová, no al mérito del pueblo.", "conexiones": "Éxodo 34:12-13 y Deuteronomio 7:2-5 (citados en el sentido de 2:2); Josué 24 (la generación que sí conoció la obra de Dios y eligió servirle); Jueces 1 (los hechos que este capítulo interpreta); Salmo 78 y Deuteronomio 6:6-25 (el mandato de contar las obras de Dios a los hijos); el resto de Jueces, que ejemplifica este ciclo, cada vez con sombras más largas.", "observacion": "Hay dos movimientos: una confrontación divina en Boquim y un esquema teológico en 2:11-19. El narrador insiste en que Jehová está con el juez y que es movido a misericordia. También insiste en que, muerto el juez, la corrupción aumenta.", "interpretacion": "El libro no se explica solo por la falta de un rey humano (eso se subrayará en los capítulos 17–21). Aquí la raíz es relacional y espiritual: una generación que no conoce al Señor ni su obra, y que se va tras los dioses del entorno. La misericordia de Dios interrumpe el juicio, pero no anula el llamado a la fidelidad. El deterioro «más que sus padres» advierte que el ciclo no es neutro: tiende a agravarse.", "doctrina": "Dios es celoso de su pacto y a la vez misericordioso. Disciplina a su pueblo entregándolo a las consecuencias, y levanta libertadores por gracia. La fe no se hereda automáticamente: cada generación debe conocer al Señor y su obra. Esta es doctrina del propio texto, no un añadido posterior.", "aplicacion": "¿Qué obras de Dios se están dejando de contar en la casa, en el coro, en la iglesia? El entusiasmo de un llanto (Boquim) no sustituye una obediencia que dure más que el líder de turno. Si nuestra fidelidad depende de que «esté el juez», el capítulo ya nos dice lo que vendrá cuando falte.", "preguntas": ["Según 2:10, ¿qué era lo que la nueva generación no conocía, y por qué importa esa precisión?", "¿Cómo describe 2:18 el motivo por el cual Dios libraba al pueblo?", "¿En qué se diferencia un llanto como el de Boquim de una obediencia duradera?", "¿Qué obras del Señor necesitas recordar tú, o contar a otros, para que no se pierda la memoria?"], "oracion": "Jehová, no dejes que yo sea una generación que no te conoce ni conoce tu obra. Que tu misericordia, que se mueve por nuestros gemidos, no me vuelva complaciente, sino agradecido y fiel. Enséñame a contar tus obras y a obedecerte cuando el «juez» visible ya no esté. En el nombre de Jesús, amén.", "quiz": [{"q": "¿De dónde subió el ángel de Jehová hacia Boquim?", "opts": ["De Silo", "De Hebrón", "De Gilgal", "De Gabaa"], "a": 2, "exp": "Jueces 2:1: «El ángel de Jehová subió de Gilgal a Boquim»."}, {"q": "Según 2:10, la generación nueva no conocía a Jehová ni…", "opts": ["La ley de Moisés en su totalidad", "La obra que él había hecho por Israel", "El nombre de Josué", "El camino hacia Silo"], "a": 1, "exp": "El texto liga el «no conocer» a no conocer la obra de Jehová por Israel: es ruptura de memoria y de relación."}, {"q": "¿Qué hacía Jehová, según 2:18, cuando levantaba un juez?", "opts": ["Se apartaba hasta que el pueblo mereciera la ayuda", "Estaba con el juez y los libraba, movido a misericordia por sus gemidos", "Les daba un rey", "Les quitaba la tierra"], "a": 1, "exp": "Jehová estaba con el juez y los libraba; era movido a misericordia por sus gemidos."}, {"q": "Al morir el juez, según 2:19, el pueblo…", "opts": ["Permanecía fiel por una generación más", "Volvía atrás y se corrompía más que sus padres", "Pedía un rey de inmediato", "Escribía un memorial"], "a": 1, "exp": "«Ellos volvían atrás, y se corrompían más que sus padres» (2:19). El ciclo tiende a agravarse."}]}, {"n": 3, "title": "Otoniel, Aod y Samgar: los primeros libertadores", "teaser": "El ciclo se pone en marcha: el Espíritu sobre Otoniel, la mano zurda de Aod, y la aguijada de Samgar.", "contexto": "Tras explicar el ciclo, el narrador lo ilustra. Los enemigos vienen de distintos frentes: Cusan-risataim de Siria (Aram-naharaim, «Siria» en RVR1960), Eglón de Moab (al este del Jordán y del mar Muerto), y los filisteos (la costa suroeste). Los libertadores también son diversos: Otoniel, de la órbita de Judá y de la casa de Caleb; Aod, benjamita zurdo; Samgar, de quien se nos da muy poco, salvo su hazaña con una aguijada de bueyes. El «juez» (shofet) en este libro no es solo un magistrado: es un libertador que Jehová levanta.", "resumen": "Israel olvida a Jehová y sirve a los baales y a Asera. Jehová los vende a Cusan-risataim durante ocho años. Claman, y Jehová levanta a Otoniel hijo de Cenaz, hermano menor de Caleb. El Espíritu de Jehová viene sobre él; juzga a Israel, sale a batalla y prevalece. La tierra reposa cuarenta años, hasta que Otoniel muere (3:7-11). Otra vez hacen lo malo. Eglón, rey de Moab, se coaliga con amonitas y amalecitas, derrota a Israel y posee la ciudad de las Palmeras (Jericó) dieciocho años. Claman, y Jehová levanta a Aod hijo de Gera, benjamita zurdo. Lleva un presente a Eglón y una espada de dos filos atada al muslo derecho. Dice tener una palabra de Dios para el rey; lo hiere, huye, y luego convoca a Israel, que toma los vados del Jordán. La tierra reposa ochenta años (3:12-30). Después, Samgar hijo de Anat mata a seiscientos filisteos con una aguijada de bueyes, y también salva a Israel (3:31).", "versiculos": [{"ref": "Jueces 3:9-10", "texto": "Entonces clamaron los hijos de Israel a Jehová; y Jehová levantó un libertador a los hijos de Israel y los libró; esto es, a Otoniel hijo de Cenaz, hermano menor de Caleb. Y el Espíritu de Jehová vino sobre él, y juzgó a Israel, y salió a batalla, y Jehová entregó en su mano a Cusan-risataim rey de Siria, y prevaleció su mano contra Cusan-risataim."}, {"ref": "Jueces 3:15", "texto": "Y clamaron los hijos de Israel a Jehová; y Jehová les levantó un libertador, a Aod hijo de Gera, benjamita, el cual era zurdo. Y los hijos de Israel enviaron con él un presente a Eglón rey de Moab."}, {"ref": "Jueces 3:31", "texto": "Después de él fue Samgar hijo de Anat, el cual mató a seiscientos hombres de los filisteos con una aguijada de bueyes; y él también salvó a Israel."}], "dificiles": "La muerte de Eglón se relata con detalle (la sala de verano, la espada, el retraso de los siervos). El texto describe un acto de guerra y de liberación en aquel contexto; no es un modelo de venganza privada para el creyente de hoy. Aod dice: «Tengo palabra de Dios para ti» (sentido de 3:20): el narrador no se detiene a moralizar la estratagema; debemos distinguir lo que el relato cuenta de lo que nosotros convertiríamos en norma. De Samgar apenas se nos dice un versículo: no inventemos biografía, fechas ni linaje más allá de «hijo de Anat» y su hazaña. Los períodos de reposo (cuarenta y ochenta años) son los que el texto da; más adelante, al sumar todas las cifras del libro de forma estrictamente consecutiva, muchos lectores notan que los tiempos podrían solaparse en distintas regiones. Eso es una observación de lectura, no un dato que el propio capítulo resuelva.", "conexiones": "Jueces 1:13-15 (Otoniel ya había aparecido); Números 14 y Josué 14–15 (Caleb y su familia, un hilo de fidelidad en Judá); Deuteronomio 34 y Josué 6 (la «ciudad de las Palmeras», Jericó); 1 Crónicas 7:10 y 8 (zurdos en Benjamín, un rasgo que reaparece); Jueces 5:6 (Samgar es mencionado en el cántico de Débora, en un tiempo de caminos inseguros).", "observacion": "El ciclo de 2:11-19 se cumple casi punto por punto: mal, opresión con duración explícita, clamor, libertador levantado por Jehová, en el caso de Otoniel con el Espíritu, reposo, muerte del juez. Aod es zurdo; la espada va al muslo derecho, donde un guarda no esperaría el arma de un diestro. Samgar salva con una herramienta de campesino, no con arma de ejército.", "interpretacion": "Jehová es el verdadero protagonista: Él vende, Él levanta, Él entrega, Él está con el juez. Los instrumentos son imperfectos y muy distintos entre sí. La izquierda de Aod y la aguijada de Samgar subrayan que la liberación no depende del perfil «esperado». El reposo es real, pero, según el esquema del capítulo 2, frágil: dura «todo el tiempo de aquel juez».", "doctrina": "El Espíritu de Jehová capacita para una tarea de liberación (3:10). La salvación del pueblo es iniciativa de Dios ante el clamor, no un derecho ganado. Dios puede usar medios modestos. Esto no canoniza cada táctica de Aod como ética universal; canoniza la fidelidad de Dios a su pueblo oprimido.", "aplicacion": "No desprecies el instrumento pequeño (una aguijada, una mano que no es «la derecha») si el Señor es quien salva. Tampoco confíes en el reposo como si ya no hubiera que conocer a Jehová: el capítulo 2 ya advirtió lo que ocurre al morir el juez. El clamor sigue siendo el camino honesto cuando hay opresión que no podemos romper solos.", "preguntas": ["¿Qué hace el Espíritu de Jehová en la vida de Otoniel, según 3:10?", "¿Qué detalles del relato de Aod observa el narrador, y cuáles no explica?", "¿Qué te enseña Samgar acerca de los medios que Dios puede usar?", "¿Cómo cuidas el «reposo» para que no se convierta en olvido?"], "oracion": "Señor, tú levantas libertadores y das tu Espíritu. Enséñame a clamar a ti, no a confiar en mi mano derecha ni en las armas que yo elegiría. Gracias por el reposo cuando lo concedes; no dejes que ese descanso me lleve a olvidarte. Usa, si quieres, lo pequeño en mí. En el nombre de Jesús, amén.", "quiz": [{"q": "¿Sobre quién vino el Espíritu de Jehová en este capítulo, para juzgar a Israel y salir a batalla?", "opts": ["Aod", "Samgar", "Otoniel", "Eglón"], "a": 2, "exp": "Jueces 3:9-10: el Espíritu vino sobre Otoniel, y Jehová entregó a Cusan-risataim en su mano."}, {"q": "Aod era benjamita y…", "opts": ["Sacerdote en Silo", "Zurdo", "Rey de Moab", "Nazareo"], "a": 1, "exp": "3:15: «a Aod hijo de Gera, benjamita, el cual era zurdo»."}, {"q": "¿Cuánto reposó la tierra después de la liberación de Aod, según el texto?", "opts": ["Ocho años", "Dieciocho años", "Cuarenta años", "Ochenta años"], "a": 3, "exp": "Después de Aod, «la tierra reposó ochenta años» (3:30). Los ocho y los dieciocho son años de opresión, no de reposo."}, {"q": "¿Con qué salvó Samgar a Israel?", "opts": ["Una espada de dos filos", "Trescientos hombres", "Una aguijada de bueyes", "Un cántico"], "a": 2, "exp": "3:31: mató a seiscientos filisteos con una aguijada de bueyes, y también salvó a Israel."}]}, {"n": 4, "title": "Débora, Barac y Sísara: la gloria en mano de mujer", "teaser": "Una profetisa gobierna, un capitán pide que ella vaya, y Jael clava la estaca que cierra la batalla.", "contexto": "Tras la muerte de Aod, Israel vuelve a hacer lo malo. Jehová los vende a Jabín, rey de Canaán, que reinaba en Hazor, al norte, con Sísara como capitán, asentado en Haroset-goim. Durante veinte años oprime con novecientos carros herrados (4:1-3). Débora, profetisa, mujer de Lapidot, gobierna a Israel y se sienta bajo una palmera entre Ramá y Bet-el, en el monte de Efraín. Barac es de Cedes de Neftalí. Los ceneos, de la familia de Hobab, suegro de Moisés, están acampados cerca: un dato que prepara la aparición de Jael.", "resumen": "Israel clama. Débora llama a Barac y le transmite la orden de Jehová: juntar diez mil de Neftalí y Zabulón en el monte de Tabor; Dios atraerá a Sísara al arroyo de Cisón y lo entregará (4:6-7). Barac responde: si tú fueres conmigo, iré; si no, no iré. Débora acepta ir, pero anuncia que la gloria no será de Barac, porque Jehová venderá a Sísara en mano de mujer (4:8-9). En el combate, Jehová destrozó a Sísara y a todos sus carros (4:15). Sísara huye a pie a la tienda de Jael, mujer de Heber ceneo, que tenía paz con Jabín. Ella lo invita, lo cubre, le da leche, y mientras duerme le clava una estaca de la tienda en las sienes. Cuando llega Barac, Jael le muestra al capitán muerto. Dios humilla aquel día a Jabín, hasta que los hijos de Israel lo destruyen.", "versiculos": [{"ref": "Jueces 4:4-5", "texto": "Gobernaba en aquel tiempo a Israel una mujer, Débora, profetisa, mujer de Lapidot; y acostumbraba sentarse bajo la palmera de Débora, entre Ramá y Bet-el, en el monte de Efraín; y los hijos de Israel subían a ella a juicio."}, {"ref": "Jueces 4:9", "texto": "Ella dijo: Iré contigo; mas no será tuya la gloria de la jornada que emprendes, porque en mano de mujer venderá Jehová a Sísara. Y levantándose Débora, fue con Barac a Cedes."}], "dificiles": "La muerte de Sísara es violenta; el texto la relata como cumplimiento de la palabra de Débora, y el capítulo 5 alabará a Jael. Debemos leer lo que está escrito sin suavizarlo y sin convertirlo en espectáculo. El texto no presenta a Débora como una anomalía vergonzosa ni como un argumento abstracto sobre oficios: dice que era profetisa, que gobernaba y que Israel subía a ella a juicio. Barac no es ridiculizado como cobarde por un adjetivo del narrador; se registra su condición («si tú fueres conmigo») y la consecuencia que Débora anuncia. Heber tenía paz con Jabín (4:17): Jael actúa en tensión con esa alianza de su casa. El texto no desarrolla su fuero interno; no lo inventemos.", "conexiones": "Josué 11 (Jabín de Hazor ya había sido derrotado en tiempos de Josué; este Jabín puede ser un sucesor o una dinastía en la misma ciudad: el texto no explica la relación, solo nombra a Jabín rey de Canaán en Hazor). Éxodo 18 y Números 10:29-32 (los ceneos y Hobab, suegro de Moisés). Hebreos 11:32 menciona a Barac entre los que por fe conquistaron y se hicieron fuertes en batallas. El capítulo 5 es el cántico que interpreta esta victoria. El arroyo de Cisón y el monte Tabor sitúan la batalla en el valle de Jezreel, al norte.", "observacion": "Dios da la estrategia antes de la batalla. Débora habla como profetisa que transmite lo que Jehová ha mandado. El narrador atribuye el quebrantamiento de Sísara a Jehová (4:15). Una mujer —no Débora, sino Jael— completa lo anunciado en 4:9.", "interpretacion": "La gloria es de Jehová, que vende a Sísara «en mano de mujer». El relato desplaza el protagonismo militar habitual: una profetisa guía, un capitán necesita acompañamiento, y la estaca de una mujer en una tienda termina lo que los carros no pudieron sostener. Hebreos 11 recuerda la fe de Barac: su condición no anula que, al final, fue.", "doctrina": "Jehová es el Dios que gobierna la historia de su pueblo y puede levantar la voz profética donde Él quiere. La fe no es ausencia de temor, pero sí da un paso (Barac va). Dios cumple su palabra. La violencia de esta guerra de liberación se describe en su siglo; no se convierte, por eso, en norma ética universal de engaño doméstico.", "aplicacion": "¿Dónde te está llamando el Señor a ir, y estás poniendo condiciones? Las condiciones de Barac no impidieron la victoria, pero sí le costaron la gloria de la jornada. Escucha la Palabra con la seriedad con que Israel subía a Débora a juicio: no para tener una líder de moda, sino para obedecer lo que Dios dice.", "preguntas": ["¿Qué oficios y tareas atribuye el texto, de hecho, a Débora?", "¿Qué anuncia Débora cuando Barac pone su condición, y cómo se cumple?", "¿Qué papel juega Jehová en la batalla, según 4:15, frente al de los protagonistas humanos?", "¿Cómo lees la fe de Barac a la luz de Hebreos 11:32, sin negar lo que Jueces 4 registra?"], "oracion": "Señor, tú destrozaste los carros de Sísara y cumpliste la palabra que diste por Débora. Enséñame a escuchar tu voz y a ir cuando tú mandas, sin negociar la obediencia. Que la gloria de cualquier jornada sea tuya, no mía. En el nombre de Jesús, amén.", "quiz": [{"q": "¿Cómo presenta Jueces 4:4 a Débora?", "opts": ["Solo como esposa de Barac", "Como profetisa que gobernaba a Israel", "Como reina de Hazor", "Como sacerdotisa en Silo"], "a": 1, "exp": "«Gobernaba en aquel tiempo a Israel una mujer, Débora, profetisa, mujer de Lapidot» (4:4)."}, {"q": "¿Qué condición puso Barac para ir a la batalla?", "opts": ["Que le dieran los novecientos carros", "Que Débora fuera con él", "Que Israel nominara un rey", "Que Jael lo acompañara"], "a": 1, "exp": "4:8: «Si tú fueres conmigo, yo iré; pero si no fueres conmigo, no iré»."}, {"q": "¿En mano de quién dijo Débora que Jehová vendería a Sísara?", "opts": ["De Barac", "De Judá", "De mujer", "Del ángel de Jehová"], "a": 2, "exp": "4:9: «en mano de mujer venderá Jehová a Sísara». Se cumple en Jael, no en la propia Débora."}, {"q": "¿Dónde estaba asentado Sísara, y a qué arroyo sería atraído?", "opts": ["En Hazor y al Jordán", "En Haroset-goim y al arroyo de Cisón", "En Cedes y al arroyo de Besor", "En Ofra y a la fuente de Harod"], "a": 1, "exp": "Sísara estaba en Haroset-goim (4:2); Débora anuncia que Dios lo atraería al arroyo de Cisón (4:7)."}]}, {"n": 5, "title": "El cántico de Débora: como el sol cuando sale en su fuerza", "teaser": "Un poema de victoria alaba a los que se ofrecieron con voluntad, reprende a los que se quedaron, y bendice a Jael.", "contexto": "El capítulo 5 es un cántico de Débora y Barac, situado inmediatamente después de la victoria del capítulo 4. En la literatura bíblica, los cánticos de victoria (como Éxodo 15) interpretan los hechos y los ofrecen a Dios. El poema menciona pueblos, caminos inseguros en los días de Samgar y de Jael, y el escenario del Cisón. Muchos lectores han notado en este poema un estilo hebreo particularmente arcaico; esa es una observación frecuente de lectura, no un dato que el propio capítulo date con un año.", "resumen": "Débora y Barac cantan: alaban a Jehová, recuerdan el éxodo y el temblor de la tierra, y describen un tiempo en que las aldeas cesaron y los caminos estaban abandonados, hasta que Débora se levantó, «madre en Israel» (5:7). Se bendice a los príncipes y al pueblo que se ofrecieron con voluntad. Se nombra a las tribus que vinieron (Efraín, Benjamín, Maquir, Zabulón, Isacar, Neftalí) y se interroga o se critica a las que se quedaron: Rubén, entre grandes resoluciones y apriscos de ovejas; Galaad, al otro lado del Jordán; Dan, en sus naves; Aser, en la costa. Se maldice a Meroz por no venir en ayuda de Jehová. Se bendice a Jael entre las mujeres, y se relata de nuevo la muerte de Sísara, ahora en verso. El poema cierra con la madre de Sísara, que espera junto a la ventana y se consuela con una explicación cruel. El último voto: «Así perezcan todos tus enemigos, oh Jehová; mas los que te aman, sean como el sol cuando sale en su fuerza» (5:31). La tierra reposó cuarenta años.", "versiculos": [{"ref": "Jueces 5:31", "texto": "Así perezcan todos tus enemigos, oh Jehová;\nMas los que te aman, sean como el sol cuando sale en su fuerza.\nY la tierra reposó cuarenta años."}], "dificiles": "El retrato de la madre de Sísara (5:28-30) es duro: el poema deja que el lector oiga la expectativa de botín y de mujeres cautivas. No es una escena para deleitarse; es un espejo de la violencia de aquella guerra y una inversión poética de la espera. La maldición de Meroz (5:23) es «por cuanto no vinieron al socorro de Jehová»: el texto juzga la ausencia, aunque no nos da más historia de esa localidad. Las alusiones a las «estrellas» y al torrente de Cisón (5:20-21) son lenguaje poético de la batalla; el narrador del cap. 4 ya atribuyó la victoria a Jehová. No hace falta convertir esas imágenes en un tratado astronómico ni negarlas como mera decoración: son teología en verso.", "conexiones": "Éxodo 15 y Deuteronomio 32 (cánticos que interpretan la salvación); Jueces 3:31 y 5:6 (Samgar); Jueces 4 (los mismos hechos en prosa); Salmo 68 (imágenes de Dios que marcha desde Seir y el Sinaí, cercanas a 5:4-5); Hebreos 11:32 (Barac). El contraste entre las tribus que se ofrecen y las que se quedan prepara, a su modo, la fragmentación que el libro irá mostrando.", "observacion": "El cántico nombra, alaba, pregunta y maldice. Distingue a quienes se ofrecieron con voluntad y a quienes no vinieron. Llama a Débora «madre en Israel». Termina con una bendición sobre los que aman a Jehová y con un dato en prosa: cuarenta años de reposo.", "interpretacion": "Cantar es una forma de recordar quién ganó la batalla. La gloria no queda en Débora, Barac o Jael como héroes autónomos: «alaben a Jehová». Al mismo tiempo, las decisiones humanas importan: ir o quedarse en los apriscos no es indiferente. El versículo final contrapone dos destinos: los enemigos de Dios y «los que te aman».", "doctrina": "El pueblo de Dios responde a la salvación con alabanza. Amar a Jehová no es solo un afecto íntimo: en este cántico se asocia a ponerse de su parte en el día de la batalla. Dios es digno de un arte serio —poesía, música— que cuente su obra con verdad. El reposo es don suyo.", "aplicacion": "Hay una música que nace de lo que Dios ha hecho, no de nuestro protagonismo. Si sirves en un coro o una orquesta, este capítulo es un espejo: el arte puede recordar la obra de Dios, nombrar la fidelidad y no callar la cobardía. Pregúntate también en qué «apriscos de ovejas» te quedas cuando el Señor llama a ofrecerse con voluntad.", "preguntas": ["¿Qué contraste establece el cántico entre las tribus que fueron y las que se quedaron?", "¿Por qué se maldice a Meroz, según el propio poema?", "¿Cómo ilumina 5:31 («los que te aman, sean como el sol») el resto del libro de Jueces?", "¿Qué lugar tiene la alabanza, en tu vida, después de que Dios libra?"], "oracion": "Jehová, que los que te aman sean como el sol cuando sale en su fuerza. Quiero ofrecerme con voluntad, no quedarme entre resoluciones y apriscos. Enséñame a cantar tu victoria con verdad, y a darte la gloria. En el nombre de Jesús, amén.", "quiz": [{"q": "Según Jueces 5, ¿quiénes cantan este cántico?", "opts": ["Solo Jael", "Débora y Barac", "Los hijos de Jabín", "Samuel y Débora"], "a": 1, "exp": "5:1: «Aquel día cantó Débora con Barac hijo de Abinoam» (sentido del encabezado del cántico)."}, {"q": "¿Cómo llama el poema a Débora en 5:7?", "opts": ["Reina de Israel", "Madre en Israel", "Sacerdotisa de Bet-el", "Juez de Hazor"], "a": 1, "exp": "«Hasta que me levanté yo, Débora, me levanté como madre en Israel» (5:7)."}, {"q": "¿Por qué se maldice a Meroz?", "opts": ["Por adorar a Baal públicamente", "Por no venir en ayuda de Jehová", "Por aliarse con Moab", "Por robar el efod"], "a": 1, "exp": "5:23: no vinieron al socorro de Jehová, al socorro de Jehová con los valientes."}, {"q": "El cántico termina deseando que los que aman a Jehová sean…", "opts": ["Como la arena de la playa", "Como el sol cuando sale en su fuerza", "Como los carros de Sísara", "Como las estrellas de Abraham"], "a": 1, "exp": "Jueces 5:31, RVR1960: «Mas los que te aman, sean como el sol cuando sale en su fuerza»."}]}, {"n": 6, "title": "Gedeón llamado: «Jehová está contigo, varón esforzado»", "teaser": "Madián oprime siete años, un profeta confronta, y el ángel encuentra a Gedeón trillando trigo en el lagar.", "contexto": "Israel vuelve a hacer lo malo y Jehová lo entrega a Madián por siete años (6:1). Los madianitas, con amalecitas y «hijos del oriente», suben con sus ganados y tiendas como langostas, y destrozan la tierra. Israel se hace cuevas en los montes. Madián era un pueblo del este y del sur, emparentado en el Génesis con Abraham (Génesis 25:1-4); aquí aparece como invasor cíclico, especialmente en tiempo de cosecha, en el valle de Jezreel y sus alrededores. Antes de levantar al libertador, Jehová envía un profeta que recuerda el éxodo y la desobediencia (6:7-10).", "resumen": "El ángel de Jehová se sienta bajo un encino en Ofra, de Joás abiezerita, y se aparece a Gedeón, que está sacudiendo trigo en el lagar para esconderlo de Madián. Le dice: «Jehová está contigo, varón esforzado y valiente» (6:12). Gedeón objeta: si Jehová está con nosotros, ¿por qué nos ha sobrevenido esto, y dónde están sus maravillas? Jehová lo envía: «Ve con esta tu fuerza… ¿No te envío yo?» (6:14). Gedeón alega pobreza y ser el menor de su casa. Jehová promete estar con él. Hay una señal en la ofrenda consumida por fuego, un altar llamado Jehová-salom, y de noche Gedeón derriba el altar de Baal y la Asera de su padre. Lo llaman Jerobaal. El Espíritu de Jehová viene sobre él; toca el cuerno y reúne a Manasés, Aser, Zabulón y Neftalí. Pide entonces dos señales con un vellón: rocío solo en la lana, y rocío solo en la tierra. Dios concede ambas.", "versiculos": [{"ref": "Jueces 6:12, 14, 16", "texto": "Y el ángel de Jehová se le apareció, y le dijo: Jehová está contigo, varón esforzado y valiente. […] Y mirándole Jehová, le dijo: Ve con esta tu fuerza, y salvarás a Israel de la mano de los madianitas. ¿No te envío yo? […] Jehová le dijo: Ciertamente yo estaré contigo, y derrotarás a los madianitas como a un solo hombre."}], "dificiles": "El vellón (6:36-40) es una de las escenas más citadas y más malentendidas. Observación: Gedeón pide esas señales después de que Dios ya habló con claridad (6:14, 16) y después de una señal previa en la ofrenda (6:21). El texto muestra la condescendencia de Dios ante la duda; no instituye un método para «averiguar la voluntad de Dios» cuando Él ya ha hablado. Sobre «el ángel de Jehová» y «Jehová»: el relato usa ambas expresiones (6:12, 14, 16, 22-23). Gedeón teme haber visto al ángel de Jehová cara a cara, y Jehová le dice: «Paz a ti; no tengas temor, no morirás» (6:23). Conviene registrar lo que el texto dice, sin imponer un tratado entero de angelología. El derribo del altar de Baal ocurre de noche, por miedo a la casa paterna y a los hombres de la ciudad (6:27): el narrador no oculta el temor de Gedeón.", "conexiones": "Éxodo 3 (un llamado con objeciones, la promesa «yo estaré contigo», una señal); Deuteronomio 7 y Jueces 2 (no servir a los baales); Génesis 25:1-4 (Madián); Salmo 83:9-12 (Madián, Oreb y Zeeb, como memoria litúrgica posterior); Hebreos 11:32 (Gedeón). El nombre Jerobaal («Baal contienda contra él», 6:32) quedará ligado a su historia y a la de Abimelec.", "observacion": "Dios habla dos veces antes de la liberación: por un profeta (reprensión) y por el ángel (llamado). Gedeón hace preguntas duras y pide señales. El primer acto de obediencia no es aún la batalla, sino derribar el altar de casa.", "interpretacion": "«Varón esforzado y valiente» se dice de alguien que está escondiendo trigo. La valentía, en este relato, no es un temperamento previo: está ligada a la presencia y al envío de Jehová. El miedo es real; la obediencia, aun temblorosa, comienza en el patio de la idolatría familiar.", "doctrina": "La presencia de Dios («yo estaré contigo») es el fundamento de la misión, no la autoestima del llamado. Dios puede reprender y, a la vez, levantar un libertador. La idolatría debe ser confrontada primero en casa. Las señales no sustituyen la Palabra ya dada.", "aplicacion": "¿Estás esperando un vellón para obedecer lo que ya está claro? ¿Hay un altar en casa —un arreglo, una lealtad— que conviene derribar antes de «salvar a Israel»? Dios no niega tus preguntas; tampoco te deja atrapado en ellas. «¿No te envío yo?» es una pregunta que ordena el miedo.", "preguntas": ["¿Por qué envía Dios un profeta antes de enviar al ángel, según 6:7-10?", "¿Qué objeciones pone Gedeón, y qué le responde Jehová?", "¿Qué era el vellón en su contexto, y qué no lo convierte el texto?", "¿Cuál es el primer acto de obediencia de Gedeón, y por qué ocurre de noche?"], "oracion": "Jehová-salom, tú estás con nosotros aunque preguntemos «¿por qué nos ha sobrevenido esto?». Dame valor para derribar primero los altares de casa, y no uses las señales como excusa para retrasar lo que ya me has dicho. Quédate conmigo. En el nombre de Jesús, amén.", "quiz": [{"q": "Antes de llamar a Gedeón, ¿qué envió Jehová cuando Israel clamó?", "opts": ["Un rey", "Un profeta que recordó el éxodo y la desobediencia", "A Abimelec", "Un ejército de Efraín"], "a": 1, "exp": "6:7-10: Jehová envió un profeta con una palabra de reprensión antes del llamado de Gedeón."}, {"q": "¿Dónde estaba Gedeón cuando se le apareció el ángel de Jehová?", "opts": ["En el monte Tabor", "Sacudiendo trigo en el lagar para esconderlo de Madián", "En el templo de Silo", "En la corte de Jabín"], "a": 1, "exp": "6:11: trillaba o sacudía trigo en el lagar, por miedo a Madián."}, {"q": "¿Cuál es la promesa central de Jehová a Gedeón en 6:16?", "opts": ["Le daría mil hombres de Judá", "«Ciertamente yo estaré contigo»", "Le daría un vellón como ritual permanente", "Le prometió el trono de Israel"], "a": 1, "exp": "«Ciertamente yo estaré contigo, y derrotarás a los madianitas como a un solo hombre» (6:16)."}, {"q": "El vellón se pide cuando…", "opts": ["Dios aún no ha dicho nada", "Dios ya ha enviado a Gedeón y ha prometido estar con él", "Madián ya fue derrotado", "Débora se lo ordena"], "a": 1, "exp": "Las señales del vellón (6:36-40) llegan después de 6:14 y 6:16, y después de la señal de la ofrenda. No son el primer don de la voluntad de Dios."}]}, {"n": 7, "title": "Los trescientos: «no sea que se alabe Israel»", "teaser": "De decenas de miles a trescientos que lamieron el agua: la victoria será de Jehová, no de la mano de Israel.", "contexto": "Jerobaal (Gedeón) y todo el pueblo se levantan temprano junto a la fuente de Harod. El campamento de Madián está al norte, en el valle, junto al collado de More. El contraste geográfico es visible: un puñado frente a un valle cubierto de invasores, «como langostas» (7:12). El capítulo es la reducción del ejército y la batalla nocturna con trompetas, cántaros y teas.", "resumen": "Jehová dice que el pueblo es demasiado para que Él entregue a Madián, «no sea que se alabe Israel contra mí, diciendo: Mi mano me ha salvado» (7:2). Primero se van los temerosos: quedan diez mil (conforme al principio de Deuteronomio 20:8). Luego, junto al agua, un segundo filtro: trescientos que lamieron el agua. Con esos trescientos, dice Jehová, salvará (7:7). Dios envía a Gedeón de noche al campamento enemigo, si aún tiene miedo, para oír un sueño: un pan de cebada rueda contra el campamento de Madián y lo derriba. Su compañero interpreta: «Esto no es otra cosa que la espada de Gedeón… Dios ha entregado en sus manos a Madián» (7:14). Gedeón adora, divide a los trescientos en tres escuadrones, con trompeta, cántaro vacío y tea. En el cambio de guardia, rompen los cántaros, tocan y gritan: «Espada de Jehová y de Gedeón». Jehová vuelve la espada de cada uno contra su compañero. Madián huye. Se convoca a Neftalí, Aser, Manasés y Efraín; se toman los vados y se capturan a Oreb y a Zeeb.", "versiculos": [{"ref": "Jueces 7:2", "texto": "Y Jehová dijo a Gedeón: El pueblo que está contigo es mucho para que yo entregue a los madianitas en su mano, no sea que se alabe Israel contra mí, diciendo: Mi mano me ha salvado."}, {"ref": "Jueces 7:7", "texto": "Entonces Jehová dijo a Gedeón: Con estos trescientos hombres que lamieron el agua os salvaré, y entregaré a los madianitas en tus manos; y váyase toda la demás gente cada uno a su lugar."}], "dificiles": "¿Por qué el criterio de lamer el agua? El texto declara el propósito de Dios (que Israel no se alabe), pero no explica por qué quienes lamen son los elegidos y no quienes se arrodillan. Una explicación popular dice que los que lamieron eran más alertas, como guerreros; eso es especulación, no algo que el capítulo afirme. Conviene dejarlo en lo que está escrito. El grito «Espada de Jehová y de Gedeón» no iguala a Gedeón con Dios: el propio capítulo ha dejado claro quién salva. El miedo de Gedeón no se oculta: Dios se anticipa («si tienes miedo de atacar, baja al campamento», 7:10-11) y le da la señal del sueño.", "conexiones": "Deuteronomio 20:8 (el temeroso puede volver de las filas); 1 Samuel 14 y 17 (victorias donde el número no decide); 2 Crónicas 20; Salmo 44:3-8 («no se salvaron con su espada»); 1 Corintios 1:27-29 (Dios elige lo débil para que nadie se jacte; esta es una conexión teológica cristiana, no una cita que Jueces haga). Salmo 83:11 menciona a Oreb y Zeeb.", "observacion": "Dios reduce, no aumenta, el ejército. El propósito se enuncia en primera persona divina: que Israel no diga «mi mano me ha salvado». La batalla se gana cuando Jehová vuelve la espada del enemigo contra sí mismo. Gedeón adora antes de atacar, al oír el sueño.", "interpretacion": "Este capítulo es el reverso de Jueces 1, donde Israel se «sintió fuerte». Aquí la fuerza es un peligro espiritual: puede producir jactancia. La salvación de Madián queda, por diseño, fuera de toda estadística razonable, para que la alabanza no se desvíe.", "doctrina": "La gloria de la salvación pertenece a Dios. Él puede despojar a su pueblo de recursos precisamente para preservar esa verdad. El temor no descalifica automáticamente al siervo: Dios lo confronta y lo sostiene. La alabanza es el destino correcto de una victoria.", "aplicacion": "¿Dónde estás confiando en el número —ensayos, recursos, prestigio, cantidad de gente— como si la mano tuya salvara? El Señor no desprecia los medios; desprecia la jactancia. A veces reduce para que podamos adorar. El grito justo sigue siendo que la espada es, primero, de Jehová.", "preguntas": ["¿Cuál es, según 7:2, el motivo explícito de reducir el ejército?", "¿Qué dice el texto acerca del filtro del agua, y qué no dice?", "¿Cómo trata Dios el miedo de Gedeón en 7:9-15?", "¿En qué área de tu servicio estás cerca de decir «mi mano me ha salvado»?"], "oracion": "Señor, no dejes que me alabe contra ti diciendo que mi mano me ha salvado. Reduce, si hace falta, lo que me hincha, y enséñame a adorar antes de combatir. Que cualquier victoria en mi vida grite primero tu nombre. En el de Jesús, amén.", "quiz": [{"q": "¿Por qué dice Jehová que el pueblo de Gedeón es demasiado?", "opts": ["Porque no había comida", "Para que Israel no se alabe diciendo: «Mi mano me ha salvado»", "Porque Madián era pequeño", "Porque Débora lo prohibió"], "a": 1, "exp": "Jueces 7:2 declara ese motivo con toda claridad."}, {"q": "¿Con cuántos hombres dijo Jehová que salvaría a Israel en 7:7?", "opts": ["Diez mil", "Treinta y dos mil", "Trescientos", "Tres escuadrones de mil"], "a": 2, "exp": "«Con estos trescientos hombres que lamieron el agua os salvaré» (7:7)."}, {"q": "¿Qué soñó un hombre en el campamento de Madián?", "opts": ["Un león en un cadáver", "Un pan de cebada que derribaba la tienda", "Un vellón seco", "Un carro herrado que se hundía"], "a": 1, "exp": "7:13-14: un pan de cebada rueda contra el campamento; su compañero lo interpreta como la espada de Gedeón, porque Dios ha entregado a Madián."}, {"q": "El texto ¿explica por qué el lamer el agua era el criterio de selección?", "opts": ["Sí: eran los más alerta", "Sí: eran los más temerosos", "No: declara el propósito de Dios, no la razón técnica del gesto", "Sí: Gedeón lo explica en un discurso"], "a": 2, "exp": "Conviene no convertir una especulación («eran mejores soldados») en lo que el capítulo afirma. El propósito sí está escrito: que Israel no se jacte."}]}, {"n": 8, "title": "La victoria, el efod y la sombra de un rey", "teaser": "Gedeón rehúsa el señorío: «Jehová señoreará sobre vosotros». Luego hace un efod que se vuelve tropezadero.", "contexto": "La persecución de Madián continúa al este del Jordán, hacia Sucot, Peniel y Carkor. Aparece la tensión con Efraín, que ya se quejó de llegar tarde (tensión que reaparecerá, más sangrienta, con Jefté en el cap. 12). Gedeón es aún el libertador, pero el capítulo muestra el después de la batalla: la fatiga, la ven
