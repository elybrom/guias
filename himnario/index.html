yo de luz, de su luz celestial, que en nosotros él quiere encender. Letra y Música: Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"En Jesús encontré inefable perdón, cuando a él suplicante acudí; en amor encendió mi falaz corazón, y por él nueva fe reci -"},{"t":"v","n":"3","x":"En Jesús nueva vida tendrás, pecador, sin tardanza dirígete aél; en tu pecho pondrá nueva fe, nuevo amor, y después siempre sírvele"},{"t":"c","x":"bí. Sublime don, ¡don sin igual! solamente él podrá concefiel. Sublime don, ¡don sin igual!"}]},{"s":"Himnario congregacional","n":"248","t":"Ha pasado la tormenta","p":"531","c":"Letra:    Rafael M. Apango; Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Bamboleando por las olas, navegando más y más, entre densos nubarrones, vaga un barco sin compas. tán, ha pasado la tormenta y es Jesús el capitán. Letra: Rafael M. Apango"},{"t":"v","n":"2","x":"Ya perdida la esperanza con temor y ansiedad ya se mira en lontananza luz del faro celestial. Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"3","x":"Ya hallé piloto y faro que me guían a Cannán, mi Jesús me ha salvado, es mi grande capitán."},{"t":"v","n":"4","x":"Viento en popa caminando a la playa celestial do fervientes voces cantan ¡Gloria a nuestro capitán."},{"t":"c","x":"Ha pasado la tomenta y es Jesús el capi-"}]},{"s":"Himnario congregacional","n":"249","t":"Hay un lugar do quiero estar","p":"532","c":"Letra:    Vicente Mendoza Polanco (1875-1955); Música: James Milton Black (1856-1938)","l":[{"t":"v","n":"1","x":"Hay un lugar do quiero estar muy cerca de mi Redentor, allí podré yo descansar al fiel amparo de su aré; me guardará del tentador y ya de nada temeré. Letra: Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Quitarme el mundo no podrá la paz que halló mi corazón; Jesús amante me dará la más segura protecMúsica: James Milton Black (1856-1938)"},{"t":"v","n":"3","x":"Ni duda ni temor tendré estando cerca de Jesús; rodeado siempre me veré con los fulgores de su"},{"t":"c","x":"ción. Muy cerca de mi Redentor seguro asilo encontra -"}]},{"s":"Himnario congregacional","n":"250","t":"Jesucristo nos alumbra","p":"533","c":"","l":[{"t":"v","n":"1","x":"Jesucristo nos alumbra donde hay amor; él disipa las tinieblas donde hay amor. El amor nos hace orar, el amor nos da placer; de hay amor, todo el mundo va cantando donde hay amor, donde hay amor, donde hay amor, gozo y paz abundan siempre donde hay amor. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"Todo el mundo vive alegre donde hay amor, todo cora zón se eleva donde hay amor, toda angustia pasará, de la paz se gozará,"},{"t":"c","x":"las tinieblas se hacen luz don de hay amor. Donde hay amor, dony tranquilidad habrá donde hay amor."}]},{"s":"Himnario congregacional","n":"251","t":"Señor, Señor Jesús, ayúdame a vencer","p":"534","c":"","l":[{"t":"v","n":"1","x":"La Tempestad Señor, Señor, Jesús, ayúdame a vencer, la grande tempestad mi vida quiere ahogar. La enfurecida mar se vuelve en huracán; ¡Ayúdame, Jesús, pues quiero a ti llegar! voz escucharán. tad, callar, callar, llegó la paz. Letra y Música: Guadalupe Velasco, Arm. Isaac García Contreras."},{"t":"v","n":"2","x":"Mil gracias yo te doy pasó la tempestad, y mi barquilla así tu ruta seguirá. Tu faro celestial, Señor, me alumbrará; ¡Ayúdame, Jesús, pues quiero a ti llegar!"},{"t":"c","x":"Sólotu amor podrá calmar Señor la tempestad, los vientos y la mar, tu-"}]},{"s":"Himnario congregacional","n":"252","t":"Oh, Dios Eterno","p":"535","c":"Letra:    Thomas Obadiah Chisholm(1866-1960), 1923, Tr. Honorato T. Reza (1912-2000); Música: William Marion Runyan (1870-1957), 1923","l":[{"t":"v","n":"1","x":"Oh Dios eterno, tu misericordia Ni una sombra de duda tendrá; Tu compasión y bondad nunca fallan ¡Oh, tu fidelidad! Cada momento la veo en mí; nada me falta, pues todo provees. ¡Grande, Señor, es tu fidelidad! Letra: Thomas Obadiah Chisholm(1866-1960), 1923, Tr. Honorato T. Reza (1912-2000)"},{"t":"v","n":"2","x":"La noche oscura, el sol y la luna, Las estaciones del año también, Unen su canto, cual fieles criaturas, Música: William Marion Runyan (1870-1957), 1923"},{"t":"v","n":"3","x":"Tú me perdonas, me impartes el gozo, tierno me guías por sendas de paz; Eres mi fuerza, mi fe, mi reposo,"},{"t":"c","x":"Y por los siglos el mismo serás. Porque eres bueno, por siempre eres fiel. ¡Oh, tu fidelidad! Y por los siglos mi Padre serás."}]},{"s":"Himnario congregacional","n":"253","t":"Qué dulces promesas son","p":"536–537","c":"","l":[{"t":"v","n":"1","x":"Qué dulces promesas son las de mi Jesús mi buen Salvador, ellas me llenan de paz y me satisfacen el corazón. Todos debemos buscar más de su amor e inspiración, para que él nos pueda usar en está congregación. Letra y Música: Desconocido, Arm. Isaac García Contreras telo ofrecemos ahora con amor y gratitud. Tú nos diste salvación y escogiste para ti darnos una bendición para servirte mejor."},{"t":"v","n":"2","x":"Que dulces momentos son cuando te alabamos mi buen Jesús, pones tu paz en nosotros, gozo contento, vida y amor. Nos das tu Espíritu Santo y alegría en el corazón, cuando andábamos vagando diste anuestra alma salvación."},{"t":"v","n":"3","x":"Te pedimos Padre Santo que si hay aquí algún pecador, tráelo a los pies de Cristo para que él le de salvación; que hoy se arrepienta y te entregue su corazón deje sus iniquidades que le llevan a perdición."},{"t":"c","x":"Recibe Señor el canto de este grupo juvenil,"}]},{"s":"Himnario congregacional","n":"253b","t":"Señor Jesús, la luz del día se fue","p":"538","c":"","l":[{"t":"v","n":"1","x":"Señor Jesús, la luz del día se fue, la noche cierra ya, conmigo sé; sin otro amparo, Tú, por compasión, al desvalido da consolación. Letra y Música: William Henry Monk"},{"t":"v","n":"2","x":"Veloz el día nuestro huyendova, su gloria, sus ensueños pasan ya: mudanza y muerte miro en derredor, conmigo sé, bendito Salvador."},{"t":"v","n":"3","x":"Tu gracia en todo el día he menester. ¿quién otro al tentador podrá vencer? ¿cuál otro amante guía encontraré? en sombra o sol, Señor, conmigo sé."},{"t":"v","n":"4","x":"Vea yo al fin en mi postrer visión de luz la senda que me lleve a Sión, do alegre cantaré al triunfar la fe: \"Jesús conmigo en vida y muerte fue\"."}]},{"s":"Himnario congregacional","n":"254","t":"Tras la tormenta el arcoiris","p":"539","c":"","l":[{"t":"v","n":"1","x":"Tras la tormenta el arcoiris, y tras la oscuridad la luz; tras la amargura la alegría que a los creyentes da Jesús. gozo se renueva, pues he de ver su augusta faz. Letra y Música: Bentley De Forest Ackley (1872-1958), Tr. Ernesto Barocio (1876-1948)"},{"t":"v","n":"2","x":"Tras el invierno, primavera, tras el combate rudo, paz; tras triste valle, excelsa cumbre, tras cautiverio, libertad."},{"t":"v","n":"3","x":"Tras cuánto vemos, Dios el Padre, su amor que nunca faltará; tras este mundo el cielo a donde Jesús nos ha de trasladar."},{"t":"c","x":"Alegre canto el alma eleva al cielo donde Cristo está; así mi"}]},{"s":"Himnario congregacional","n":"255","t":"Vida feliz de incomparable paz","p":"540–541","c":"","l":[{"t":"v","n":"1","x":"Vida feliz de incomparable paz llena de amor, bendición, solaz, gozo y placer celestial, divinaluz, gloria eternal me da mi Jesús. Letra y Música: Francisco Sánchez Muñiz. singular su faz contemplar; su presencia da gozosin igual, su perfume sutil satura mi ser."},{"t":"v","n":"2","x":"Como a Naamán en las aguas del Jordán diste salud, perennal virtud, yo, mi Señor, por tu sangre salvo soy, y soy feliz, muy feliz, mi Dios."},{"t":"v","n":"3","x":"Cántemos, sí, al Señor nueva canción al celebrar su divino amor; Él nos dotó de un nuevo corazón, gloria sin fin demos al Señor."},{"t":"c","x":"Qué felicidad con Jesús morar, dicha"}]},{"s":"Himnario congregacional","n":"256","t":"¡Aleluya! que el Señor tiene grande salvalción","p":"542","c":"Letra:    L. Avella; Música: Barney Elliott Warren (1867-1951)","l":[{"t":"v","n":"1","x":"¡Aleluya!, que el Señor tiene grande salvación, libertad, libertad, nuestro Dios tiene poder para a ción, ¡Aleluya! Cristo ya, me amó y me salvó; ¡Gloria! ¡Gloria! ¡Aleluya! Él es to - - - do en todo es Él. Letra: L. Avella"},{"t":"v","n":"2","x":"Yo confio en Jesús, él me da la santidad, libertad, libertad, tengo paz y gozo ya desde y redención, Música: Barney Elliott Warren (1867-1951)"},{"t":"v","n":"3","x":"Hablaremos siempre aquí, ensalzando a nuestro Rey, liberlibertad, libertad,"},{"t":"v","n":"4","x":"Cantaremos siempre allí al dejar el mundo aquí, libertad, libertad, porque bondadoso y fiel, él nos"},{"t":"v","n":"5","x":"tad, libertad, alabando al Señor, canta -"},{"t":"c","x":"Satanás vencer; libertad, libertad. que él me salvó, libertad, libertad. Libertad y redenllama hijos de él, libertad, libertad, libertad. libertad, libertad, remos con fervor, libertad, libertad."}]},{"s":"Himnario congregacional","n":"257","t":"Cansado y triste vine al Salvador","p":"543","c":"","l":[{"t":"v","n":"1","x":"Cansado y triste vine al Salvador, mi culpa él llevó, mi culpa él llevó; mi eterna dicha hallé en su amor, mi culpa él lleré. Al Señor gozoso alabaré, porque él me salvó. Letra y Música: Mrs. Margaret Jenkins Harris (1865-1919), Tr. Henry Cleophas Ball (1896-1989)"},{"t":"v","n":"2","x":"Borrados todos mis pecados son, mi culpa él llevó, mi culpa él llevó; a él feliz elevo mi canción, mi culpa él llezón; y dirás feliz en tu canción: \"Mi culpa él llevó\"."},{"t":"v","n":"3","x":"Ya vivo libre de condenación, mi culpa él llevó, mi culpa él llevó; su dulce paz tengo en mi corazón, mi culpa él lle-"},{"t":"v","n":"4","x":"Si hoy a Cristo vienes pecador, tu culpa llevará, tu culpa llevará; perdón tendrás si acudes al Señor, tu culpa lleva-"},{"t":"c","x":"vó. Mi culpa él llevó, mi culpa él llevó, alegresiempre cantavó. Tu culpa llevará, tu culpa llevará, y limpiará tu cora -"}]},{"s":"Himnario congregacional","n":"258","t":"De mi tierno Salvador","p":"544","c":"","l":[{"t":"v","n":"1","x":"De mi tierno Salvador cantaré el inmenso amor, gloriareme en el favor de Jesús; de tinieblas me llamó, de cadenas me libró, de la muerte me salvó mi Jesús. sangre me limpió, de su gozo me llenó, de su vida me dotó, mi Jesús. Letra y Música: William James Kirkpatrick"},{"t":"v","n":"2","x":"¡Oh, qué triste condición del impío corazón! me salvó de perdición, mi Jesús; del pecado, el perdón; de la ruina salvación; por tristeza, bendición dio Jesús."},{"t":"v","n":"3","x":"En el mundo al vagar solitario y sin hogar, no sabía qué dulce paz da Jesús; mas las lágrimas de ayer han pasado, y qué placer ya comienzo a tener en Jesús."},{"t":"v","n":"4","x":"De lo falso a la verdad, de lo inmundo, a santidad, ya me trajo la bondad de Jesús; somos fuertes en virtud de su perennal salud; ¡himnos dad de gratitud a Jesús."},{"t":"c","x":"¡Mi Jesús! ¡Mi Jesús! ¡Cuán glorioso es el nombre de Jesús! con su"}]},{"s":"Himnario congregacional","n":"259","t":"Dulce comunión la que gozo ya","p":"545","c":"Letra:    Elisha Albright Hoffman (1839-1929), Pedro Grado (1862-1923); Música: Anthony Johnson Showalter (1858-1924)","l":[{"t":"v","n":"1","x":"Dulce comunión la que gozo ya en los brazos de mi Salvador; ¡qué gran bendición en su paz me da! ¡Oh! yo siento en mí su tierno amor. Libre, salvo, en los brazos de mi Salvador. Letra: Elisha Albright Hoffman (1839-1929), Pedro Grado (1862-1923)"},{"t":"v","n":"2","x":"¡Cuán dulce Es vivir, cuán dulces es gozar en los brazos de mi Salvador! allí quiero ir y con él morar, siendo objeto de su tierno amor. Libre de penas, salvo de dudas, Música: Anthony Johnson Showalter (1858-1924)"},{"t":"v","n":"3","x":"No hay que temer, ni que desconfiar en los brazos de mi Salvador; por su gran poder él me guardará de los lazos del engañador."},{"t":"c","x":"Libre, salvo, del pecado y del temor; Libre de penas, salvo de dudas,"}]},{"s":"Himnario congregacional","n":"260","t":"El sol brilló en su esplendor","p":"546","c":"","l":[{"t":"v","n":"1","x":"El sol brilló en su esplendor y las tinieblas disipó, mi pobre ser se iluminó de vivo y célico fulgor cuando escuchó mi corazón maravillosa y dulcevoz De mi Señor, mi buen Jesús: \"Borrados nó; su inmenso amor me dio la redención, también un nuevo corazón. Letra y Música: Francisco Sánchez Muñíz, Arm. Isaac García Contreras"},{"t":"v","n":"2","x":"La vida es de plenitud estando en Cristo mi Señor; Lleno de fe, de su virtud, de su poder y santo amor; la exclamación del corazón del hombre cual san Pablo es: \"Ahora ya no vivo yo, Más vive y"},{"t":"v","n":"3","x":"El sol brilló en su esplendor en el cenit del cielo azul el cielo de la comunión llenando a todo corazón de vida y luz, fuerza y vigor en un raudal de bendición De mi Señor, mi buen Jesús Sol de jus -"},{"t":"c","x":"tus pecados son\" reina Cristo en mí\" Cuán grande amor de mi Señor que me salvó, me perdoticia, paz y luz."}]},{"s":"Himnario congregacional","n":"261","t":"En las olas inmensas","p":"547","c":"","l":[{"t":"v","n":"1","x":"En las olas inmensas de enbravecido mar, que asaltan de mi alma la po bre embarcación, de rodillas a Cristo clamé y el huracán, deshecho fue al instante a la ayes de temor, terminan por siempre con mi supremo Rey; es Jesucristo mi refugio. Letra y Música: Lewis Edgar Jones (1865-1936), Tr. M. Lechuga"},{"t":"v","n":"2","x":"Me guarda de peligros, de pruebas, de dolor, él manda que los vientos no agiten tempestad; los mares se detienen, la ola reposó, y en Cristo fijo el ancla con-"},{"t":"v","n":"3","x":"Mi dulce Salvador, sí, mi hermoso amigo y Dios que libra de tristeza y aleja amarga hiel; por fe yo iré al cielo, mansión del ser de a mor, la fuente inagotable de"},{"t":"c","x":"voz de Dios. fiando más. Es Cristo la Roca, el ancla de mi fe, los males, lamentos y dicha y bien."}]},{"s":"Himnario congregacional","n":"262","t":"En negro fango yo estaba hundido","p":"548","c":"","l":[{"t":"v","n":"1","x":"En negro fango yo estaba hundido, allí perdido Jesús me halló, y con su brazo fuerte, extendido, de aquel peligro me rescapecho; si estoy caído él está presto a levantarme con su poder. Letra y Música: Alberto G. Martínez. ICI"},{"t":"v","n":"2","x":"Por eso mi alma agradecida aquí rendida le da loor, por esa llama que está encendida y que me infunde un santo ar-"},{"t":"v","n":"3","x":"Si estás caído como yo estaba y tu alma vaga lejos de Dios, Cristo es tu amigo, dale tu carga, que sólo él salva y da per -"},{"t":"v","n":"4","x":"Muy pronto unidos los escogidos allí estaremos con el Señor, de gracia llenos, siendo testigos que por los siglos es Dios de a -"},{"t":"c","x":"dor. Soy redimido esto es muy cierto, un Cristo vivo llevo en mi"}]},{"s":"Himnario congregacional","n":"263","t":"Grande gozo hay en mi alma hoy","p":"549","c":"Letra:    Eliza Edmunds Hewitt (1851-1920); Música: John Robson Sweney (1837-1899)","l":[{"t":"v","n":"1","x":"Grande gozo hay en mi alma hoy, pues Jesús conmigo está, y su paz que ya gozando estoy, por siempre duraliz, porque veo de Cristo la sonriente faz,¡Grande gozo siento en mí! Letra: Eliza Edmunds Hewitt (1851-1920)"},{"t":"v","n":"2","x":"Hay un canto en mi alma hoy, melodías a mi Rey; en su amor feliz y libre soy, y salvo por la tiempo bien feliz Música: John Robson Sweney (1837-1899)"},{"t":"v","n":"3","x":"Paz divina hay en mi alma hoy, porque Cristo me salvó; las cadenas rotas ya están, Jesús me liber -"},{"t":"v","n":"4","x":"Gratitud hay en mi alma hoy, y alabanzas a Jesús; por su gracia a la gloriavoy, gozándome en la"},{"t":"c","x":"fe. ¡Grande gozo, cuán hermoso! paso todo el tiempo muy fe -"}]},{"s":"Himnario congregacional","n":"264","t":"Grande gozo yo tengo hoy","p":"550","c":"","l":[{"t":"v","n":"1","x":"Grande gozo yo tengo hoy porque Cristo me redimió, las cadenas él ya rompió y mi alma salvó. él me dio refulgente luz en la cruz, do por mí murió. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Gratitud en mi alma hay, y con gozo yo cantaré alabanzas al Salvador; ¡Gloria yo le daré!"},{"t":"v","n":"3","x":"Él me guarda del tentador y me ayuda todo a vencer; él me imparte su protección con su grande poder."},{"t":"v","n":"4","x":"De su amor quiero predicar a los que por tinieblas van, quiero darles a comprender que él los quiere salvar."},{"t":"v","n":"5","x":"Cuando esté en la gloria yo, donde reina el amor de Dios, la corona él me dará; ¡Oh, qué felicidad!"},{"t":"c","x":"Gloria, gloria al Señor Jesús, de su gozo me concedió;"}]},{"s":"Himnario congregacional","n":"265","t":"Hay cosas que no comprenderé","p":"551","c":"","l":[{"t":"v","n":"1","x":"Hay cosas que no comprenderé, lugares hay do yo no sé, pero sí sé que salvo soy, Mi Dios es real porque lo siento en mi sí; su dulce amor es para mí, Mi Dios es real porque lo siento en mi ser. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"No podré olvidar como me sentí cuando Jesús me perdonó, pero sí sé que salvo soy, Mi Dios es real porque lo siento en mi"},{"t":"v","n":"3","x":"Soy muy feliz la senda al seguir, pues el Señor conmigo va; porque yo sé que salvo soy, Mi Dios es real porque lo siento en mi"},{"t":"v","n":"4","x":"Un día estaré en el cielo azul con mi Jesús, mi Salvador, porque yo sé que salvo soy, Mi Dios es real porque lo siento en mi"},{"t":"c","x":"ser. Mi Dios es real, real en mi ser, me ha lavado con su sangre carme -"}]},{"s":"Himnario congregacional","n":"266","t":"Hay un canto nuevo en mi ser","p":"552","c":"","l":[{"t":"v","n":"1","x":"Hay un canto nuevo en mi ser, es la voz de mi Jesús que me dice: \"ven a descansar\", tu paz conquisté en la cruz. llena siempre mi alma, de esa nota celestial. Letra y Música: Luther Burgess Bridgers (1884-1948), Tr. H. Cotto Reyes"},{"t":"v","n":"2","x":"Náufrago en pecado me encontré, sin paz en mi corazón, mas en Cristo mi Señor hallé dulce paz y protección."},{"t":"v","n":"3","x":"Tengo de su gracia celestial bajo sus alas de amor; riquezas que fluyen a raudal desde el trono del Señor."},{"t":"v","n":"4","x":"Por las aguas hondas me llevó, pruebas en mi senda hallé; por sendero áspero me guió, mas sus huellas seguiré."},{"t":"v","n":"5","x":"Cristo en las nubes volverá bajo el bello cielo azul; él entonces mi alma llevará; a vivir en gloria y luz."},{"t":"c","x":"Cristo, Cristo, Cristo, nombre sin igual;"}]},{"s":"Himnario congregacional","n":"267","t":"Lejos de mi Padre Dios","p":"553","c":"","l":[{"t":"v","n":"1","x":"Lejos de mi Padre Dios por Jesús fui hallado, por su gracia y por su amor sólo fui salvado. él me amó y me salvó en su gracia tierna. Letra y Música: William Howard Doane (1832-1915), Tr. Frances Jane Crosby (1832-1915)"},{"t":"v","n":"2","x":"En Jesús, mi Salvador pongo mi confiaza, toda mi necesidad suple en abundacia."},{"t":"v","n":"3","x":"Cerca de mi buen Pastor vivo cada día, toda gracia en mi Señor halla el alma mía."},{"t":"v","n":"4","x":"¡Guárdame, Señor Jesús, para que no caiga! como sarmiento en la vid, vida de ti traiga."},{"t":"c","x":"En Jesús, mi Señor, sea mi gloria eterna;"}]},{"s":"Himnario congregacional","n":"268","t":"Mi Salvador en su bondad","p":"554","c":"","l":[{"t":"v","n":"1","x":"Mi Salvador en su bondad al mundo malo descendió, de hondo abismo de maldad mi alma levanme tendió; estando en sombra, a plena luz, en su bondad me levantó. Letra y Música: Charles Hutchinson Gabriel (1856-1932), Tr. Vicente Mendoza Polanco (1875–1955)"},{"t":"v","n":"2","x":"Su voz constante resistí aunque él amante me llamó, mas su palabra recibí y fiel me levan -"},{"t":"v","n":"3","x":"Tortura cruel sufrió por mí cuando a la cruz él ascendió tan sólo así salvado fui yfiel me levan -"},{"t":"v","n":"4","x":"Que soy feliz yo bien lo sé con esta vida que él me dio, mas no comprendo aún por qué Jesús me levan -"},{"t":"c","x":"tó. Seguridad me dio Jesús, cuando su mano"}]},{"s":"Himnario congregacional","n":"269","t":"Mis culpas todas borró Jesús","p":"555","c":"","l":[{"t":"v","n":"1","x":"Mis culpas todas borró Jesús con infinito amor; cargó con ellas en cruenta cruz, en medio de morsu poder, a vida nueva Jesús me ha llamado; ¡Ya salvo soy!. Letra y Música: Jack P. Scholfield (1882-1972), Tr. Vicente Mendoza Polanco (1875–1955)"},{"t":"v","n":"2","x":"En densas sombras anduve yo cuando en maldad viví, y mi alma nunca la paz halló, ni gozo alguno"},{"t":"v","n":"3","x":"Gloriosa vida de libertad disfruto yo por él; ya no hay temores, no hay ansiedad, porque él me guarda"},{"t":"v","n":"4","x":"Eterno canto en mi corazón elevo al Redentor; negar no puedo su salvación, negar, no puedo,"},{"t":"c","x":"tal dolor. yo sentí. Salvo por él yo soy, salvo por siempre fiel. no, su amor."}]},{"s":"Himnario congregacional","n":"270","t":"¿No sabes tú, hermano, que Dios es todo amor?","p":"556","c":"","l":[{"t":"v","n":"1","x":"¿No sabes tú, hermano, que Dios es todo amor, que dio a su Hijo amado para tu salvación? dejó su trono y gloria el divino Señor, de cambiar tu ser, la prueba yo te doy, él me cambió a mí; ¿No ves que soy feliz? ¿No ves el cambio en mí? Nueva criatura soy, pues él me rescató. Letra y Música: Emilio Juárez Aranda, ICI, Himno de la convención de 1944."},{"t":"v","n":"2","x":"Tú pensarás: soy bueno, a nadie le hago mal; tú pensarás que vives una vida moral; pero si estás sin Cristo, esto te perderá;"},{"t":"v","n":"3","x":"El tiempo ya se acerca, Cristo viene otra vez, tus obras no te salvan, sólo el poder de Dios; deja la vana gloria, déjate de vagar,"},{"t":"c","x":"para ofrecerte vida, eterna salvación. no le desprecies nunca, te ofrece libertad. Sólo el poder de Dios pueacéptale ahora mismo, nunca te pesará."}]},{"s":"Himnario congregacional","n":"271","t":"¡Oh! mi corazón reboza ya de gozo","p":"557","c":"","l":[{"t":"v","n":"1","x":"¡Oh! mi corazón rebosa ya de gozo porque Dios me perdonó con gran amor; sirviendo a mi Jesús estoy dichoso, voy al cielo donde está mi Salvatial, Voy subiendo al cielo en áura escalera, voy subiendo do corona me espera; voy subiendo en clara luz voy subiendo con Jesús, alabanzas cantaré a Dios allá. Voy subiendo al celeste hogar, me voy con Cristo al celeste hogar. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Cada día quiero amarle más constante, quiero serle cadadía más leal, ayudado por su gracia, que abundante nos concede nuestro Padre celesción. (2a Vez) voy su"},{"t":"v","n":"3","x":"Hallo gran placer trayendo pecadores, pecadores de cualquiera condición, a Jesús que en cruenta cruz sufrió dolores para dar a todos plena salva-"}]},{"s":"Himnario congregacional","n":"272","t":"¿Quieres tú saber porqué vivo gozoso?","p":"558–559","c":"","l":[{"t":"v","n":"1","x":"¿Quieres tú saber porqué vivo gozoso? Es que Cristo mis pecados perdonó; ¿Quieres tú saber por qué hay gozo en mi alma? es que Cristo mi alma salvó, es que Cristo mi ala la fuente de agua viva que es Jesús; él convierte tu tristeza en grande gozo; y tus tinieblas se convertirán en luz. Letra y Música: Leonardo Flores Esparza, ICIAR"},{"t":"v","n":"2","x":"Deja ya de vagar por esos caminos que conducen a una eterna perdición, Cristo dice: \"Yo soy el mejor camino que conduce a la célica man sión, que conduce a la"},{"t":"v","n":"3","x":"Si este mundo donde sólo hay falsedades ha hecho a tu alma en el abismo sucumbir, Cristo allá en dura cruz pagó con sangre la mansión gloriosa donde hoy puedes ir, La mansión gloriosa"},{"t":"c","x":"D g D G ma salvó. célica mansión. Hoy te invito a la fuente inagotable, donde hoy puedes ir."}]},{"s":"Himnario congregacional","n":"273","t":"¿Saber quieres?","p":"559","c":"","l":[{"t":"v","n":"1","x":"¿Saber quieres por qué canto tan alegre, como el ave que bendice a su Creador, en el prado y en el bosque deliciosos? Porque Dios me perdonó con gran amor. rioso es Cristo, en el alma tengo el gozo de su amor. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez."},{"t":"v","n":"2","x":"¿Saber quieres por qué vivo tan confiado, aunque ruja en derredor la tempestad? el Señor Jesús está siempre a mi lado, su presencia me da paz, seguridad."},{"t":"v","n":"3","x":"¿Saber quieres por qué vivo apartado, de las fuentes de delicia mundanal? Jesucristo, por su muerte, me ha salvado y en él hallo paz, delicia celestial."},{"t":"c","x":"Aleluya, aleluya; toda culpaperdonó el Redentor. Cuán glo -"}]},{"s":"Himnario congregacional","n":"274","t":"Sin fe, sin esperanza, sin luz y sin calor","p":"560–561","c":"Letra:    Francisco Sánchez Muñiz/Raúl Morales Zamora, ICI; Música: Francisco Sánchez Muñiz, ICI","l":[{"t":"v","n":"1","x":"Sin fe, si esperanza, sin luz y sin calor, llevando sin descanso la carga del dolor; De penas doblegado, así vagaba noso cubrióme con su luz, radiante, esplendoroso, partiendo de una cruz; en ella estaba Cristo diLetra: Francisco Sánchez Muñiz/Raúl Morales Zamora, ICI ciendo en dulce voz: \"Tus culpas he pagado, perdón tienes de Dios\"."},{"t":"v","n":"2","x":"Lavado fui de culpas, mi carga él quitó, consuelo, paz y gozo puso en mi corazón; de alegría radiante, hoy sirvo a mi SeMúsica: Francisco Sánchez Muñiz, ICI"},{"t":"v","n":"3","x":"Si esclavo del pecado te encuentras con horror, contrito y humillado acércate al Señor, te salvará piadoso con infinito a-"},{"t":"c","x":"yo, errante en este mundo de afán y de Aflicción. ñor, y arde en mi constante el fuego de su amor. Un rayo lumimor, tedará paz y gozo, será tu protector."}]},{"s":"Himnario congregacional","n":"275","t":"Tengo mucho gozo en mi corazón","p":"561","c":"","l":[{"t":"v","n":"1","x":"Tengo mucho gozo en mi corazón, gloria a mi Cristo por su redención; Bendito sea por su grande amor pues él me libertó. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"He dejado al mundo con su falsedad por seguir a Cristo, pues es la verdad;"},{"t":"v","n":"3","x":"Crito en un momento mi cuerpo sanó, mis enfermedades todas él llevó;"},{"t":"v","n":"4","x":"Nada ofrece el mundo sino perdición, solamente en Cristo hay grande salvación;"},{"t":"v","n":"5","x":"Cristo en las nubes pronto volverá, y en mansión gloriosa mi alma vivirá;"}]},{"s":"Himnario congregacional","n":"276","t":"Toda mi vida en el pecado, ha terminado","p":"562–563","c":"","l":[{"t":"v","n":"1","x":"Toda mi vida en el pecado, ha terminado al encontrar a Jesús bendito crucificado, todas mis manchas él ha borrado, me dio vida eternal por su grande bondad para mí, tan pecaLetra y Música: Aquiles Mireles Perales y Abdiel Mayo, ICI dor. Por su gracia fui salvado, él sufrió por mí la cruz, mi pecado fue limpiado con la sangre de Jesús; vivo hoy agradecido, quiero seguir la senda que por mí trazó, decir a la humanidad que Cristo es mi Salvador, mi precioso Consolador."},{"t":"v","n":"2","x":"En el pecado mi triste vida se deslizaba, densas tinieblas, escura noche me circundaba, mas de repente luz refulgente en mi derredor brilló; era Cristo Jesús que mi vida transformó. ¡Oh qué cambio tan hermoso en mi senda yo sentí; hoy camino muy gozoso, gracia plena recibí; transformada fue mi vida, y nunca más, jamás al mundo volveré; a mi Señor serviré con todo mi corazón por su grande transformación."}]},{"s":"Himnario congregacional","n":"277","t":"Ya la noche con sus sombra se alejó","p":"564","c":"","l":[{"t":"v","n":"1","x":"Ya la noche con su sombra se alejó, la mañana vino ya; y viviendo en plena luz me encuentro yo, la mañana vino ya; tando alegre voy, porque con Jesús estoy; la mañana reina ya en mi corazón. Letra y Música: Alfred Henry Ackley (1887-1960), Tr. Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Hizo Cristo un mundo nuevo para mí, la mañana vino ya; y por él y en él la vida es grande aquí, la mañana vino ya;"},{"t":"v","n":"3","x":"Una vida esplendorosa viviré, la mañana vino ya; porque en Cristo mi Señor me apoyaré, la mañana vino ya;"},{"t":"c","x":"La mañana reinaya enmi corazón, toda mancha ha borrado mi Señor, ya cancorazón, mi buen Señor,"}]},{"s":"Himnario congregacional","n":"278","t":"Ya no es mi vida cual antes fue","p":"565","c":"Letra:    A. Mejia; Música: Thoro Harris (1874-1955)","l":[{"t":"v","n":"1","x":"Ya no es mi vida cual antes fue, borrado el pecado está; hoy canto feliz ¡Aleluya! y voy feliz al dulce hogar. senda es muy estrecha mas la sigo; yo la sigo por las huellas de Jesús. Letra: A. Mejia"},{"t":"v","n":"2","x":"Mi vida fue cruel desilusión, un amigo fiel no hallé, mas luz y muy grato consuelo, hallé en mi buen Salvador. la sigo, por las huellas de Jesús. Música: Thoro Harris (1874-1955)"},{"t":"v","n":"3","x":"Ya no más luto ni cruel pesar, cual nubes huyeron ya; al cielo yo miro gozoso, do hay gloria, gloria eternal."},{"t":"c","x":"La senda es muy estrecha mas la sigo, la sigo, la sigo, la la sigo, la sigo,"}]},{"s":"Himnario congregacional","n":"279","t":"Ya se oye silbar el tren","p":"566","c":"","l":[{"t":"v","n":"1","x":"Ya se oye silvar el tren, ya no tardará en llegar, es un tren muy especial al reinado celestial; donde viene mi Jesús, que nos viene a llevar. Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"2","x":"Este tren espiritual, es un tren muy especial, que viene llegando ya ¿no oyes que silvidos da? son los tiempos ya cumplidos en que Cristo volverá."},{"t":"v","n":"3","x":"Venid luego peregrinos, a la central estación; los ministros de mi Cristo se encuentran en procesión repartiendo los boletos a la gran ciudad de Sión."},{"t":"v","n":"4","x":"El boleto no te cuesta, más que dar tu corazón y servirle a Jesucristo el que obró en tu corazón, y el boleto está arreglado hasta la ciudad de Sión."},{"t":"v","n":"5","x":"Cuando ya el tren se acerca la campana sonará, el que no tenga boleto de seguro que no irá; a disfrutar con mi Cristo a la gran ciudad de Sión."},{"t":"v","n":"6","x":"La central de la estación, es la iglesia espiritual donde se encuentra gozosa toda esta embarcación, con el boleto en la mano para marchar hasta Sión."},{"t":"v","n":"7","x":"Este tren espiritual, es un tren muy especial, es Jesús el conductor, los boletos va a checar, la defensa de este tren esla guardia celestial."},{"t":"v","n":"8","x":"Este tren corre muy fuerte y a muy gran velocidad, las líneas están directas, no hay ninguna desviación; este es el tren directo, que va a la ciudad de Sión."}]},{"s":"Himnario congregacional","n":"280","t":"Yo tengo un himno de loor","p":"567","c":"Letra:    Vicente Mendoza Polanco (1875-1955); Música: Edwin Othello Excell (1851-1921)","l":[{"t":"v","n":"1","x":"Yo tengo un himno de loor desde que salvo estoy, para mi Rey, mi Salvador, desde que salvo estoy. Desde que salvo estoy, desde que salvo estoy sólo en él me gloriaré, desde quesalvo estoy, en mi Salvador me gloriaré. Letra: Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Yo tengo un Cristo, y mi ansiedad desde que salvo estoy, está en cumplir su voluntad desde que salvo estoy. Desdeque salvo estoy, desde quesalvo estoy, desdequesalvo estoy, desdequesalvo estoy, Música: Edwin Othello Excell (1851-1921)"},{"t":"v","n":"3","x":"Yo tengo un gozo que él me dio desde que salvo estoy, cuando en su sangre me lavó, desde que salvo es -"},{"t":"v","n":"4","x":"Con mi Señor yo viviré porque ya limpio estoy, y allí seguro estaré porque ya salvo"}]},{"s":"Himnario congregacional","n":"281","t":"El alfolí de Dios","p":"568–569","c":"","l":[{"t":"v","n":"1","x":"Las Sagradas Escrituras son el buen aventador las que guardan bien el trigo y el agua de salud. también la iglesia de Cristo es el alfolí de Dios, porque guarda bien el trigo y el agua de saLetra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez. luya! que el viento ya está soplando y el trigo se está apartando Vamos al alfolí de Dios, ¡cantemos aleluya! que ha preparado banquete para los que van entrando, soplaviento, sopla más, y el trigo se apartará; sopla viento, sopla más y la paja volará."},{"t":"v","n":"2","x":"Si alguno oyere del Padre, venga al alfolí de Dios, Cristo le da de comer como me está dando a mí. Si hambre tienes de justicia, oye palabra de Dios, serás bienaventurado y lleno de consola -"},{"t":"v","n":"3","x":"El Espíritu te llama y la iglesia te convida, diciéndote que de gracia bebas del agua de vida; Y si arrepentido vienes por la puerta tú entrarás, y su crees en Jesucristo bautizado tú se -"},{"t":"c","x":"ción. Vamos al alfolí de Dios, ¡cantemos ale -"}]},{"s":"Himnario congregacional","n":"282","t":"Ven, caminante cansado","p":"570–571","c":"","l":[{"t":"v","n":"1","x":"Ven, caminante cansado, ven a la fuente eternal; ven a saciarte ahora presto, Cristo agua viva te da. Tú que caminas senda de dolor, que el buen Señor te trazó, huellas de sangre divina él marcó, Ven al Oasis de Luz. Letra y Música: David González Navarro, ICIAR, Arm. Francisco Javier Corona Vázquez. mor de mi Señor Jesucristo, que con nosotros está; mira que te está esperando, su rostro sonrientes está, y es que abrazarte ya quiere y verte en su dulce comunión."},{"t":"v","n":"2","x":"¿Traes carga de desconsuelo o gimes por tu aflicción? déjalas aquí a sus plantas y sólo bebe su amor. Agua sin precio, purísima, da, del manantial de su ser, que salta fresca para eternidad, precioso Oasis de Luz."},{"t":"v","n":"3","x":"Cierra tus ojos y olvida; todo a pasado ya; luchas, tristezas y afanes, todos a quedado atrás. Hoy te encuentras protegido del sol del sufrimiento atroz del desierto de esta vida fugaz, diáfano Oasis de Luz."},{"t":"c","x":"Sacia, recuesta tu alma; descansa en el pecho de a-"}]},{"s":"Himnario congregacional","n":"283","t":"Se llegó la hora de tu valentía","p":"572","c":"","l":[{"t":"v","n":"1","x":"Sellegó la hora de tu valentía, en que tú publiques que Cristo vendrá; no importa la lluvia, ni el calor del día, ni la noche oscura, Dios te alumbratiene, pronto volverá; hablales de Cristo, diles que él los salva de la grande angustia que en la tierra habrá. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Id por todo el mundo dice mi Jesús, lleva el evangelio glorioso de luz; no lleves alforja, no te servirá, Dios dará su Espíritu, él te sosten-"},{"t":"c","x":"rá. Hablales de Cristo, diles que ya viene, que no se de-"}]},{"s":"Himnario congregacional","n":"284","t":"Seguiremos luchando","p":"573","c":"","l":[{"t":"v","n":"1","x":"Seguiremos luchando por ganar muchas almas, anunciando que Cristo tiene todo el poder. Seguiremos hablando del poder milagroso con que Cristo amoroso transformó nuestro ser. Seguiremos luchando aunque en distintos rumbos, por ganar muchas almas para Cristo el Señor. Seguiremos hablando de todas sus bondades. Seguiremos diciendo que en él sólo hay perdón. Letra y Música: Leonardo Flores Esparza, ICIAR."},{"t":"v","n":"2","x":"Por la causa de Cristo no me im porta la muerte, con tal de contemplar a mi Rey y Señor, que me dice amoroso basta sólo mi gracia, y yo en esto me apoyo por su inefable amor. A veces en las luchas nos sentimos tan solos, que parece que el alma ya va a desfallecer; pero oigo su palabra que conforta mi alma, y yo sigo Adelante aunque venga el dolor."}]},{"s":"Himnario congregacional","n":"285","t":"Sembraré la simiente preciosa","p":"574","c":"","l":[{"t":"v","n":"1","x":"Sembraré la simiente preciosa del glorioso evangelio de amor. Sembraré, sembraré mientras viva; dejaré el resultado al Semor; segaré, segaré, al hallarme en la casa de Dios. Letra y Música: George Coles Stebbins (1846–1945)"},{"t":"v","n":"2","x":"Sembraré en corazones sensibles, la doctrina del Dios de perdón. Sembraré, sembraré mientras viva; dejaré el resultado al Se-"},{"t":"v","n":"3","x":"Sembraré en corazones de mármol la bendita palabra de Dios. Sembraré, sembraré mientras viva; dejaré el resutado al Se-"},{"t":"c","x":"ñor. Sembraré, sembraré mientras viva, simiente de a-"}]},{"s":"Himnario congregacional","n":"286","t":"Marcha con gozo, pueblo del Señor","p":"575","c":"","l":[{"t":"v","n":"1","x":"Marcha con gozo, pueblo del Señor con alabanzas y glorias al Creador; mira a Cristo que humilde te invita que te regido, era esparcido por el mundo y el error; mas ahora, por piedad lo ha recogido, ven a recrearte en el banquete del amor. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Si tú quieres venir a Jesucristo, dejas este mundo y toda tentación; ven ahora a los pies del Dios bendito; goza de"},{"t":"v","n":"3","x":"Todos los santos que gozan esta dicha, dejaron todo por seguir a su Señor, porque el banquete es recuerdo de su muerte y la me -"},{"t":"c","x":"crees en el banquete del amor. dicha y también de su perdón. Este es el pueblo que Dios había escomoria de su bendita pasión."}]},{"s":"Himnario congregacional","n":"287","t":"Obediente a tu mandato","p":"576","c":"Letra:    James Montgomery (1771-1854), Trad. Merrel N. Hutchinson (1835-?), 1877; Música: A. Wishaw","l":[{"t":"v","n":"1","x":"Obediente a tu mandato participa hoy tu grey de tu cena; y con gozo acercámonos con fe; Lo que hiciste en el Calvario por el pobre pecador anunciamos en tu nombre, recordando tu amor. Letra: James Montgomery (1771-1854), Trad. Merrel N. Hutchinson (1835-?), 1877"},{"t":"v","n":"2","x":"Recordamos tus angustias ¡Oh Divino Redentor! y la copa de amargura que por todo pecador en el Gólgota apuraste despreciando tu dolor te pedimos que constantes te sigamos con valor. Música: A. Wishaw"},{"t":"v","n":"3","x":"En su cuerpo traspasado meditemos con piedad; en banquete tan sagrado su memoria renovad; y la sangre que a torrentes derramara el Salvador, recordemos reverentes en la cena del Señor."}]},{"s":"Himnario congregacional","n":"288","t":"Al sonar de la trompeta","p":"577","c":"Letra:    D. Bazan; Música: Dion de Marbella, Arr. Rufus Henry Cornelius (1872-1933)","l":[{"t":"v","n":"1","x":"Al sonar de la trompeta, nuestro corazón despierta, es Jesús que en las nubes viene ya; de mil ángeles rodeado, de vicmano, ¿estás listo? ¿vives tú ya salvo enCristo?¿Cuánta gloria, ¡Aleluya!se verá! voz de júbilo se oirá, En los cielos cantaremos, cuando vuelva Él en gloria, ¡Aleluya! Letra: D. Bazan"},{"t":"v","n":"2","x":"En las bodas del cordero, gozaremos en el cielo; para siempre estaremos con Jesús; no habrá lágrimas ni llanto, pues que Música: Dion de Marbella, Arr. Rufus Henry Cornelius (1872-1933)"},{"t":"v","n":"3","x":"A la mesa estaremos, y con Cristo cenaremos; ¡Cuán felices ya seremos con Jesús! por los siglos de los siglos, con los"},{"t":"c","x":"toria coronado, cuando velva él en gloria, ¡Aleluya! todo será canto, cuando vuelva él en gloria, ¡Aleluya! ¡Oh! herángeles y santos reinaremos en su gloria, ¡Aleluya!"}]},{"s":"Himnario congregacional","n":"289","t":"Cantan los ángeles con dulce voz","p":"578","c":"Letra:   Henry Cleophas Ball (1896-1989); Música: Frederick Messik, 1914","l":[{"t":"v","n":"1","x":"Cantan los ángeles con dulce voz, canten los hombres con sonora voz; Cristo vendrá, nuestro Rey vencedor, Cristo vendrá otra vez. ¡Viene otra vez, viene otra vez, En gloria viene al mundo otra vez! ¡Viene otra vez, viene otra vez, Él viene pronto a reinar. Letra: Henry Cleophas Ball (1896-1989)"},{"t":"v","n":"2","x":"Ved en la tierra, los aires y el mar, grandes señales cumpliendose ya, todo indicando que pronto vendrá, nuestro glorioso Señor. Música: Frederick Messik, 1914"},{"t":"v","n":"3","x":"Todos los muertos en Cristo saldrán de sus sepulcros, y alegres irán, para encontrár a su Rey subirán; Cristo vendrá otra vez."},{"t":"v","n":"4","x":"Ven en las nubes, ¡Oh, buen Salvador! ¡ven a la tierra te ruego, Señor! ¡ven, que tu iglesia te espera, Jesús! Cristo vendrá otra vez."}]},{"s":"Himnario congregacional","n":"290","t":"Día de victoria y gran resplandor","p":"579","c":"Letra:    Henry Cleophas Ball (1896-1989); Música: Lewis Edgar Jones (1865-1936)","l":[{"t":"v","n":"1","x":"Día de victoria y gran resplandor cuando Cristo volverá; qué glorioso encuentro con mi Salvador, ¡en las nubes se verá! Cristo el Salvador muy pronto volverá; ¡Un gran día sin igual! Letra: Henry Cleophas Ball (1896-1989)"},{"t":"v","n":"2","x":"Día de gran gozo, día sin igual, cuando Cristo volverá; de esta patria iremos a la celestial, Cristo allí nos honrará. Música: Lewis Edgar Jones (1865-1936)"},{"t":"v","n":"3","x":"Oye la trompeta que anunciando está la venida del Señor; ya no más dolores ni afán allá; ¡con Jesús triunfó el amor!"},{"t":"c","x":"En las nubes él vendrá, en aquel día final,"}]},{"s":"Himnario congregacional","n":"291","t":"Hay muchos que nunca comprenden por qué","p":"580","c":"","l":[{"t":"v","n":"1","x":"Hay muchos que nunca comprenden por qué estoy tan gozoso aquí, crucé el Jordán, llegué a Canaán. ¡Oh, sí, es un cielo aquí; crucé el Jordán, llegué a Canaán, ¡Oh, sí, es un cielo aquí! Letra y Música: J. E. French, 1903"},{"t":"v","n":"2","x":"Cuando alegres cantan los santos así, la gente no sabe por qué, pero es el Espíritu Santo de Dios que Cristo a mandado a -"},{"t":"v","n":"3","x":"Tonadas celestes oímos cantar por tierra, por aire y por mar, resuena el mensaje de Cristo el Señor que muy pronto ha de lle -"},{"t":"v","n":"4","x":"Veremos a Cristo que en gloria vendrá, el Cristo que en la cruz murió; a todos los suyos arrebatará, aquellos que él mismo com -"},{"t":"c","x":"quí. ¡Oh, sí, es un cielo aquí! ¡Oh sí, es un cielo a -"}]},{"s":"Himnario congregacional","n":"292","t":"¡Oh! dad al Rey la bienvenida","p":"581","c":"","l":[{"t":"v","n":"1","x":"¡Oh! dad al rey la bienvenida, Él viene en gloria, ¡tu luz debe estar encendida, pues Cristo pronto volverá! triunfo y victoria ¡Al mundo pronto volverá! Letra y Música: Desconocido"},{"t":"v","n":"2","x":"¡Oh! proclamad con alegría: \"Él viene en gloria\", a media noche o ya de día Jesús en gloria volverá."},{"t":"v","n":"3","x":"No desfallezcas ni desmayes, Él viene en gloria, ¡jamás la dulce nueva calles: en grande gloria volverá!"},{"t":"v","n":"4","x":"Con ángeles y serafines Él viene en gloria, rodeado de los querubines ¡Al mundo en gloria vieneya!"},{"t":"c","x":"Anuncia la historia: el Salvador en plena gloria, en"}]},{"s":"Himnario congregacional","n":"293","t":"Un día Cristo volverá","p":"582","c":"Letra:    Henry Cleophas Ball (1896-1989); Música: Liliuokalani","l":[{"t":"v","n":"1","x":"Un día Cristo volverá, promesa que no faltará; como se fue así vendrá, y su pueblo con gran gozo le vepueblo; ¡Velad! ¡Orad! el Rey vendrá, los suyos arrebatará. Letra: Henry Cleophas Ball (1896-1989)"},{"t":"v","n":"2","x":"Los mensajeros del Señor afirman que vendrá Jesús; y el fiel y buen Consolador las promesas ya sacó a plena pueblo le verá, así será. Música: Liliuokalani"},{"t":"v","n":"3","x":"¡Oh!, gloria sin comparación será a nuestro Rey mirar; preciosa y grande bendición que el cristiano está seguro en disfru - (Lydia Lili‘u Loloku Walania Wewehi Kamaka‘eha,"},{"t":"v","n":"4","x":"¡Oh, bienvenido Rey Jesús tu iglesia te espera aquí; muy pronto ha de ver tu faz y gozar de tus laureles siempre aReina de Hawai, 1838-1917), Arr. T. H."},{"t":"c","x":"luz. Muy pronto, sí, Jesús vendrá, y alegre le verá su"}]},{"s":"Himnario congregacional","n":"294","t":"Viene otra vez nuestro Salvador","p":"583","c":"Letra:    Desconocido; Música: Lelia (Mrs. C.H.) Morris (1862-1929)","l":[{"t":"v","n":"1","x":"Viene otra vez nuestro Salvador, ¡Oh, que si fuera hoy! para reinar con poder y amor, ¡Oh, que si fuera hoy! ya por su esposa viene otra vez purifica da en su grande amor, del mundo por la redondez, ¡Oh, que si fuera hoy! al coronarle Rey; ¡Gloria! ¡Gloria! la senda preparad, ¡Gloria! ¡Gloria! Cristo viene otravez. Letra: Desconocido"},{"t":"v","n":"2","x":"Terminará el poder de Satán, ¡Ojalá fuera hoy! no más tinieblas aquí serán, ¡Ojalá fuera hoy! todos los muertos en Cristo irán arrebatados por su Señor, ¿cuándo estas cosas sucederán? ¡Ojalá fuera hoy! Música: Lelia (Mrs. C.H.) Morris (1862-1929)"},{"t":"v","n":"3","x":"Fieles y leales nos debe hallar, si él viniera hoy; todos velando con gozo y paz, si él viniera hoy; multiplicadas señales hay, en el oriente se ve el albor; ya más cercano el tiempo está, ¡Ojalá fuera hoy!"},{"t":"c","x":"¡Gloria! ¡Gloria! gozo sin fin traerá, ¡Gloria! ¡Gloria!"}]},{"s":"Himnario congregacional","n":"295","t":"Yo espero el día alegre","p":"584","c":"Letra:    Henry W. Cragin (1885-1947), Música: James M. Kirk (1854-1945)","l":[{"t":"v","n":"1","x":"Yo espero el día alegre cuando Cristo volverá, pues vendrá al mundo pronto y nos arrebatará; ¡Oh, qué gozo este pensamiento sús vendrá al mundo otra vez, sí, Jesús vendrá al mundo otra vez, le veremos en las nubes con los ángeles de luz, cuando en gloria venga al mundo otra vez. Letra: Henry W. Cragin (1885-1947), Música: James M. Kirk (1854-1945)"},{"t":"v","n":"2","x":"La venida de Jesús será el remedio al dolor que aflige siempre a este pobre mundo pecador; toda lagrima se enjugará por"},{"t":"v","n":"3","x":"Llegarán los santos a Sión con gozo eternal, y en todo el santo monte nada daña ni hace mal, pues conocerán su amor entonces,"},{"t":"v","n":"4","x":"El pecado, pena y muerte en este mundo cesarán; mártires y santos con Jesús por siempre reinarán, cada alma gozará de paz per-"},{"t":"c","x":"a mi alma da; el que Cristo venga al mundo otra vez! nuestro Salvador; cuando en gloria venga al mundo otra vez. ¡Oh! Jetodos por igual, cuando Cristo venga al mundo otra vez. fecta, sin afán, cuando en gloria venga al mundo otra vez."}]},{"s":"Himnario congregacional","n":"296","t":"A Jesucristo ven sin tardar","p":"585","c":"","l":[{"t":"v","n":"1","x":"A Jesucristo ven sin tardar, que entre nosotros hoy él está, y te convida con dulce afán, tierno, diciendo \"ven\". contigo estemos en comunión gozando eterno bien. Letra y Música: George Frederick Root (1820-1895), Tr. Juan Bautista Cabrera Ivars (1837-1916)"},{"t":"v","n":"2","x":"Piensa que él sólo puede colmar tu triste pecho de gozo y paz; y porque anhela tu bienestar, vuelve a decirte \"ven\"."},{"t":"v","n":"3","x":"Su voz escucha sin vacilar y grato acepta lo que hoy te da; tal vez mañana no habrá lugar, no te detengas, ¡ven!."},{"t":"c","x":"¡Oh cuán grata nuestra reunión! cuando allá Señor en tu mansión,"}]},{"s":"Himnario congregacional","n":"297","t":"De Jesús escucha el tierno llamamiento","p":"586","c":"Letra:    Vicente Mendoza Polanco (1875-1955); Música: R. L. Blowers","l":[{"t":"v","n":"1","x":"De Jesús escucha el tierno llamamiento: \"Ven a mí, pecador\" quiere darte su perdón, paz y contento: \"ven a él, pecamir; oye del Señor el tierno llamamiento: \"ven a mí, ven a mí\". Letra: Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"De tus penas pronto puedes olvidarte, ven a él, ven a él; porque de ellas Cristo puede alivio darte, \"ven a él ven a Música: R. L. Blowers"},{"t":"v","n":"3","x":"Sólo él puede pleno gozo concederte, ven a él, ven a él; en odiosa cruz por eso vio la muerte, \"ven a él, ven a"},{"t":"v","n":"4","x":"No su voz de amor escuches con desprecio, ven a él, ven a él; por tu salvación pagó divino precio, \"ven a él, ven a"},{"t":"c","x":"él\". Te llama con un tierno acento, tu vida quiere redi -"}]},{"s":"Himnario congregacional","n":"298","t":"En pecados y temor el Salvador me vio","p":"587","c":"Letra:    Henry Cleophas Ball (1896-1989); Música: Howard E. Smith (1863-1918)","l":[{"t":"v","n":"1","x":"En pecados y temor el Salvador me vio, y aunque indigno pecador su mano me tendió; en el Gólgota al morir mi vida rescató. ¡Oh, pecador! él es tu amigo fiel, ven pecador; ven al Señor, él es amor, escucha su tierna voz; \"Ven pecador\" Letra: Henry Cleophas Ball (1896-1989)"},{"t":"v","n":"2","x":"De la tumba ya salió mi redentor Jesús, a la muerte ya venció dándome plena luz; te convida a gozar de esta bendición Música: Howard E. Smith (1863-1918)"},{"t":"v","n":"3","x":"A los cielos ascendió Cristo mi Salvador, a la diestra de Jehová está el mediador, intercede en tu favor, ven pronto pecador."},{"t":"c","x":"en la cruz salud por mí él consumó. que poseo yo también, la salvación. Ven al Señor, no desprecies esta voz, es del Señor."}]},{"s":"Himnario congregacional","n":"299","t":"Escuchad la voz de Dios","p":"588","c":"","l":[{"t":"v","n":"1","x":"Escuchad la voz de Dios llamando: ¡quién irá por mí a trabajar?, ¿quién rescatará a los perdidos?, ¿quién la senda estrecha mostrará? ré; dí, Señor, dime a mí; dí e iré doquiera: \"Heme aquí\". Letra y Música: George Bennard, 1911 (1873-1958)"},{"t":"v","n":"2","x":"Cuando el ángel, al profetapuso un carbón ardiendo del altar: ¿quién irá por mí? la voz decía, contestó: \"acudo a tu llamar\"."},{"t":"v","n":"3","x":"Mira hoy a miles que perecen, con tristeza oye su clamor, ve hermano, ve a socorreles di: \"Maestro, heme aquí, yo voy\"."},{"t":"c","x":"Dí, Señor, dí Señor, y luego yo responde -"}]},{"s":"Himnario congregacional","n":"300","t":"Habla Jesús Amante","p":"589","c":"Letra:      Henrik Schager; Música:   Leander Lycurgus Pikett (1859-1928), Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Habla Jesús amante, habla a mi corazón en tonos de licados de amor y de bondad, constante a la derecha lo siento estar de mí divino de tu voz, tu voz que alos cautivos concede libertad; yo quiero ahora mismo el dulce murmurar, que diga a mis oídos que no me has de dejar. Letra: Henrik Schager"},{"t":"v","n":"2","x":"Consérvame por siempre en plena santidad, radiante de alegría, de amor y de bondad, yo quiero consagrarte mi entero porvenir, Música: Leander Lycurgus Pikett (1859-1928), Arm. Francisco Javier Corona Vázquez"},{"t":"v","n":"3","x":"Habla Jesús amante, tu voz escucharé, tonos de amor desea radiante el corazón, ansiosa el alma mía tu voz escuchará,"},{"t":"c","x":"y quiero en mi a labanza muy cerca estar de ti. pues sé que a tu reinado muy pronto has de venir. Yo quiero oír el eco, y estando en tu presencia, mi voz te alabará."}]},{"s":"Himnario congregacional","n":"301","t":"Nos veremos en el río","p":"590","c":"","l":[{"t":"v","n":"1","x":"No veremos en el río cuyas aguas argentinas nacen puras cristalinas bajo el trono del Señor. de la vida verdadera que nace del trono de Dios."},{"t":"v","n":"2","x":"En las márgenes del río que frecuentan serafines y embellecen querubines da la dicha eterna Dios."},{"t":"v","n":"3","x":"El vergel que riega el río de Jesús es la morada, el mal nunca tiene entrada, allí sólo reina Dios."},{"t":"v","n":"4","x":"Antes de llegar al río nuestra carga dejaremos, libres todos estaremos por la gracia del Señor."},{"t":"v","n":"5","x":"Tiene faz risueña el río pues la de Jesús refleja, la que de su grey aleja todo mal todo dolor."},{"t":"c","x":"¡Oh, Sí!, nos congregaremos de ese río a la ribera,"}]},{"s":"Himnario congregacional","n":"302","t":"Oye pecador, la voz del Salvador","p":"590–591","c":"Letra:    Henry Cleophas Ball (1896-1989), Música: Charles Price Jones (1865-1949)","l":[{"t":"v","n":"1","x":"Oye pecador, la voz del Salvador: \"si estás cansado, ven a descansar; ¡ven! no te detengas, echa sobre mí, toda carga tuya, yo la llevaré\". to - - - ma hoy mi yugo yo te salvaré; man - - - so soy y humilde, tu amigo soy, ven, en mí confía, yo te salvaré. Letra: Henry Cleophas Ball (1896-1989), Música: Charles Price Jones (1865-1949)"},{"t":"v","n":"2","x":"Ven a él, hambriento, aunque pobre estés, hay maná del cielo, todo listo está; grande es la fiesta, gratis para ti, Cristo te invita, ven y cenarás. toma sobre tí mi yugo es suave, yo te salvaré sí, te salvaré cual manso Cordero muy paciente soy y amigo fiel, en fe, sí, confía en mí, Ven, ¡Oh, ven! y fiar en mi podrás, ten fe, yo te salvaré."},{"t":"v","n":"3","x":"¿Andas tú desviado, fuera del redil? en los montes densos hay peligros mil; deja de vagar, ¡Oh, ven al buen pastor! vuelve al rebaño y reposarás."},{"t":"v","n":"4","x":"Pon tu fe en Cristo, él te salvará, gozo y paz perfecta te concederá; nunca él rechaza al que acude a él, Cristo es compasivo, te recibirá."},{"t":"c","x":"Ven, ven a mí, y descansarás, Ven a mí sí, ven a mí tú descansarás, tú descansarás,"}]},{"s":"Himnario congregacional","n":"303","t":"Pecador, ven al dulce Jesús","p":"592","c":"Letra:    Henry Godden Jackson (1838-1914), Tr. Pedro Castro (1840-1887); Música: Joseph Philbrick Webster (1819-1875)","l":[{"t":"v","n":"1","x":"Pecador, ven al dulce Jesús y feliz para siempre serás, si en verdad le quisieres tener al divino Señor hallador; ven a él, ven a él, que te espera tu buen Salvador. Letra: Henry Godden Jackson (1838-1914), Tr. Pedro Castro (1840-1887)"},{"t":"v","n":"2","x":"Si cual hijo que necio pecó, vas buscando a sus pies compasión, tierno Padre en Jesús hallarás y tendrás en sus brazos perven a él, pecador, pecador, Música: Joseph Philbrick Webster (1819-1875)"},{"t":"v","n":"3","x":"Si enfermo te sientes morir, él será tu doctor celestial; y hallarás en su sangre también medicina que cure tu"},{"t":"v","n":"4","x":"Ovejuela que huyó del redil, ¡he aquí tu benigno Señor! en los hombros llevada serás de tan dulce y amante pas -"},{"t":"c","x":"dón. Ven a él, ven a él, que te espera tu buen Salvamal. pecador, ven a él, pecador,"}]},{"s":"Himnario congregacional","n":"304","t":"¿Quieres ser salvo de toda maldad?","p":"593","c":"","l":[{"t":"v","n":"1","x":"¿Quieres ser salvo de toda maldad? Tan sólo hay poder en mi Jesús; ¿Quieres vivir y gozar santidad? Tan sólo hay poder en Jesús. der, poder, sin igual poder en la sangre que Él vertió. Letra y Música: Lewis Edgar Jones (1865-1936), Tr. D. A. Mata"},{"t":"v","n":"2","x":"¿Quieres ser libre de orgullo y pasión? Tan sólo hay poder en mi Jesús ¿Quieres vencer toda cruel tentación? Tan sólo hay poder en Jesús."},{"t":"v","n":"3","x":"¿Quieres servir a tu Rey y Señor? Tan sólo hay poder en mi Jesús; Ven, y ser salvo podrás en su amor, Tan sólo hay poder en Jesús."},{"t":"c","x":"Hay poder, poder, sin igual poder en Jesús quien murió; Hay po -"}]},{"s":"Himnario congregacional","n":"305","t":"Si al cruel enemigo temes combatir","p":"594","c":"Letra:    Desconocido; Música: Charles Hutchinson Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Si al cruel enemigo temes combatir, si la duda agobia siempre tu existir, que la hermosa luz de Dios fulgure en ti, y serás feliz así. que la hermosa luz de Dios fulgurentí, y serás feliz así. Letra: Desconocido"},{"t":"v","n":"2","x":"Si te sientes desmayar en la aflicción, si respuesta no hallas en la oración, que la hermosa luz de Dios fulgure en ti, y serás feliz así. Música: Charles Hutchinson Gabriel (1856-1932)"},{"t":"v","n":"3","x":"Si feliz el cielo anhelas alcanzar, y del mal y las tinieblas escapar, que la hermosa luz de Dios fulgure en ti, y serás feliz así."},{"t":"v","n":"4","x":"Si anduviéremos en luz, divina luz, limpios nos hará la sangre de Jesús; claridad tendremos en el corazón, si vivimos en la luz."},{"t":"c","x":"Deja penetrar la luz, deja penetrar la luz, penetrar la luz, penetrar la luz,"}]},{"s":"Himnario congregacional","n":"306","t":"Si tú cansado ya estás de pecar","p":"595","c":"Letra:    Vicente Mendoza Polanco (1875-1955); Música: Lelia (Mrs. C.H.) Morris (1862-1929)","l":[{"t":"v","n":"1","x":"Si tú cansado ya estás de pecar, acepta el perdón de Jesús; si vida nueva quisieras hallar, acepta el perdón de Jesús. No más pecar, ven a él, su amor te muestra en la cruz; es tiempo, no seas infiel, acepta el perdón de Jesús. Letra: Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Si vida pura tú quieres tener, acepta el perdón de Jesús; él es la fuente que limpia tu ser, acepta el perdón de Jesús. Música: Lelia (Mrs. C.H.) Morris (1862-1929)"},{"t":"v","n":"3","x":"Si tú no puedes tus luchas calmar, acepta el perdón de Jesús; si tus anhelos no puedes lograr, acepta el perdón del Jesús."},{"t":"v","n":"4","x":"Si con los santos te quieres unir, acepta el perdón de Jesús; y si a los cielos aspiras a ir, acepta el perdón de Jesús."}]},{"s":"Himnario congregacional","n":"307","t":"Vida eterna prometió","p":"596","c":"","l":[{"t":"v","n":"1","x":"Vida eter - - - na prometió, prometió, el Señor al que en él quisiera creer, y morar allá con él; éstafue la promesa que dio. sús; y vivirás allá con él, vida eterna con él gozarás. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"Gloria de - - - mos al Señor, al Señor, por su amor que en la cruz él nos mostró; pues su sangre derramó por salvar al más vil pecador. Ven a la luz que te da Jesús, ven a la luz que te da Je-"},{"t":"v","n":"3","x":"Viene el tiem - - - po de aflicción, de aflicción, cuando ya, cuando ya no habrá lugar; mas ahora salvación Cristo vino a su pueblo a legar."},{"t":"v","n":"4","x":"No te tar - - - des pecador, pecador, en venir, en venir al Salvador; él te llama con amor, ¡apresúra te, ven al Señor!"}]},{"s":"Himnario congregacional","n":"308","t":"Yo tengo una mansión","p":"597","c":"","l":[{"t":"v","n":"1","x":"Yo tengo una mansión, mansión de gloria es, donde no existe sol, ni oscuridad, los días son de luz, de luz de gloria sí, porque Cristo nos apara vivir tienes que ser como Jesús, tu parecer, tiene que ser reflejo de él; para que muchos conozcan que tú estás en él. Letra y Música: Daniel Dávila"},{"t":"v","n":"2","x":"Cristo nos prometió, preparar un hogar do iremos a gozar en su presencia real, pero para llegar, tú tienes que luchar, si tú has ta el fin perse-"},{"t":"v","n":"3","x":"Cristo en gloria vendrá y vendrá por su grey, su iglesia gozará en ver así a su Rey; si tú le has sido fiel, él te arrebatará, y con él allá en el"},{"t":"c","x":"lumbra pues él es la luz. veras, con él estarás. Quieres vivir en la mansión, mansión de luz; cielo feliz estarás."}]},{"s":"Himnario congregacional","n":"309","t":"Bienvenido seáis hermanos","p":"598","c":"","l":[{"t":"v","n":"1","x":"Unid los cantos todos los santos con dulcevoz; ñor; hoy unidos nos gozamos al saber que nos une su amor. Recibid la bienvenida, que tengáis una gran bendicin, que la gracia de Dios esté siemprecon vos, y que llene vuestro corazón. Letray Música: Alberto G. Martínez, ICI"},{"t":"v","n":"2","x":"Con reverencia por que en presecia estáis de Dios."},{"t":"v","n":"3","x":"Todo cristiano ama ha su hermano de corazón;"},{"t":"v","n":"4","x":"No ve fronteras, va por do quiera sembrando amor."},{"t":"v","n":"5","x":"Muy pronto unidos los escogidos irán a Dios;"},{"t":"v","n":"6","x":"Y allá en el cielo tendrán el premio de su labor."},{"t":"c","x":"Bienvenidos seáis hermanos, en el nombre de Cristo el Se -"}]},{"s":"Himnario congregacional","n":"310","t":"Jubilosas nuestras voces","p":"599","c":"Letra:    Francisco S. Montelongo (1878-1941); Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"Jubilosasnuestrasvoces Elevemos con fervor, Para dar la la bienvenida A los siervos del Señor. Bienvenida no fingida La Congregación os dá. Letra: Francisco S. Montelongo (1878-1941)"},{"t":"v","n":"2","x":"Bienvenidos los campeo nes De la fe y de la verdad, A ellos nuestros corazones Hoy les brindan su amistad. Música: William James Kirkpatrick (1838-1921)"},{"t":"v","n":"3","x":"Bien venidos los soldados De las huestes de Jesús, Los que lu chan denonados Por el triunfo de la luz."},{"t":"v","n":"4","x":"Uno sólo es nuestro anhelo Trabajemos con tesón Por hacer que el Rey del cielo Reine en cada corazón."},{"t":"c","x":"¡Bienvenidos! ¡Bienvenidos! Adalides de Jehová;"}]},{"s":"Himnario congregacional","n":"311","t":"Te recibimos por Jesús","p":"600","c":"","l":[{"t":"v","n":"1","x":"Te recibimos por Jesús, Amado hermano nuestro sé Soldado firme de la cruz, Y redimido por la fe, Y redimido por la fe. Letra y Música: Thomas Martin Westrup (1837-1909)"},{"t":"v","n":"2","x":"Sé digno de tu vocación Con mansedumbre y humildad, Cuidando siempre de guardar Y promover la unidad, Y promover la unidad."},{"t":"v","n":"3","x":"De nuestro cuerpo miembro ya, Une con él tu voluntad; Es una nuestra vocación, Sea una nuestra caridad, Sea una nuestra caridad."},{"t":"v","n":"4","x":"No pienses en confiar en ti, Mas vela siempre en oración; Y Dios te quiera bendecir Llevándote a la perfección, Llevándote a la perfección."}]},{"s":"Himnario congregacional","n":"312","t":"Todos fuimos bautizados","p":"601","c":"","l":[{"t":"v","n":"1","x":"Todos fuimos bautizados como aquel siervo Naamán, Sepulmente, en el bautismo de Cristo Jesús, en la esperanza de su muerte, porque él es nuestra vida y nuestra luz. Letra y Música: Desconocido"},{"t":"v","n":"2","x":"En el mar y en la nube venos en Corintios diez, Todos"},{"t":"v","n":"3","x":"Y san Pedro nos recuerda que guardada por la fé, Fué sal -"},{"t":"v","n":"4","x":"4Bienvenido seas hermano bienvenido con amor, por ha -"},{"t":"c","x":"tada nuestra lepra en las aguas del Jordán. fuimos bautizados juntamente con Moises. Y sepultados juntavada de las aguas la familia de Noé. berte bautizado como manda el Sal -.vador."}]},{"s":"Himnario congregacional","n":"313","t":"Feliz, feliz cumpleaños","p":"602","c":"Letra:    Eliza Edmunds Hewitt (1851–1920), 1905, Trad. Severa Euresti (1872-1946); Música: Grant Colfax Tullar (1869-1950), 1905","l":[{"t":"v","n":"1","x":"Feliz, feliz cumpleaños deseamos para ti; que el Dios omni potente te quiera bendecir. tengas en la vida, y allá en la eternidad. Letra: Eliza Edmunds Hewitt (1851–1920), 1905, Trad. Severa Euresti (1872-1946)"},{"t":"v","n":"2","x":"A Dios rendimos gracias, que con sin par bondad al fin de este año hermoso te permitió llegar. Música: Grant Colfax Tullar (1869-1950), 1905"},{"t":"v","n":"3","x":"Oremos pues unidos, que te bendiga Dios, te colme en lo futuro de bien, prosperidad."},{"t":"v","n":"4","x":"Deseamos que en tu día Jesús contigo esté y de sus bendiciones por siempre él te dé."},{"t":"c","x":"Feliz, feliz cumple años, de Dios felicidad, que"}]},{"s":"Himnario congregacional","n":"314","t":"Dios os guarde en su santo amor","p":"603","c":"Letra:    Jeremiah Eames Rankin (1828-1904), 1880, Tr. P. Aguirre de la Barrera; Música: William Gould Tomer (1833-1896), 1880","l":[{"t":"v","n":"1","x":"Dios os guarde en su santo amor, hasta el día en que lleguemos, a la patria do estaremos para siempre con el Salvador. nidos todos seremos un redil con nuestro buen Pastor. Letra: Jeremiah Eames Rankin (1828-1904), 1880, Tr. P. Aguirre de la Barrera"},{"t":"v","n":"2","x":"Dios os guarde en su santo amor, en la senda peligrosa, de esta vida tormentosa, os conserve en paz y sin temor. Música: William Gould Tomer (1833-1896), 1880"},{"t":"v","n":"3","x":"Dios os guarde en su santo amor, os conduzca su bandera, y os esfuerce en gran manera con su Espíritu Consolador."},{"t":"v","n":"4","x":"Dios os guarde en su santo amor, con su gracia él os sostenga, hasta que el Maestro venga a fundar su reino en esplendor."},{"t":"c","x":"Al venir Jesús nos veremos, a los pies de nuestro Salvador; reu-"}]},{"s":"Himnario congregacional","n":"314b","t":"Hoy","p":"604–605","c":"","l":[{"t":"v","n":"1","x":"Hoy que la luz del sol se oculta es tarde Señor, un día más ha pasado en la tie - - - rra. Gracias te doy por mi vi - - - da que guardas en Letra y Música: Víctor González Corona, 1989 Ti ¡Oh Señor! un día más agradezco de dicha. No habrá temor, tú eres mi Paz, en ti confío Señor, mi Señor. Hasta mañana Ami - - go. Gracias te doy Dios, mi Dios; Je - - sús."},{"t":"v","n":"2","x":"Seré mejor para ti mañana si tú me permites la vida aquí en la tie - - - rra. Cuida a mis pa - - - dres y herma - - - nos, también a Copyright 1991Gamma y Gamma Ediciones, usado con permiso todos tus siervos protege en tus manos Oh Dios."}]},{"s":"Himnario congregacional","n":"315","t":"Danos un bello hogar","p":"606","c":"","l":[{"t":"v","n":"1","x":"Danos un bello hogar: donde la Biblia nos guíe fiel, donde tu amor bienestar nos dé, gar! ¡Danos un bello hogar! Letra y Música: Baylus Benjamin McKinney (1886-1952), 1949, Tr. Guillermo Blair."},{"t":"v","n":"2","x":"Danos un bello hogar: donde el padre es fuerte y fiel, y su ejemplo se pueda ver,"},{"t":"v","n":"3","x":"Danos un bello hogar: donde la madre con devoción, sepamostrarnos tu compasión,"},{"t":"v","n":"4","x":"Danos un bello hogar: donde los hijos con decisión, sigan a Cristo de corazón."},{"t":"c","x":"donde en ti todos tengan fe. donde tu amor reine en nuestro ser. ¡Danos un bello hodo todos vivan en comunión. do se respire tu bendición."}]},{"s":"Himnario congregacional","n":"316","t":"Hogar de mis Recuerdos","p":"607","c":"","l":[{"t":"v","n":"1","x":"Hogar de mis recuerdos a ti volver anhelo, no hay sitio bajo el cielo más dulce que el hogar; posara yo en palacios corriendo el mundo entero, a todos yo prefiero mi hogar! no hay sitio bajo el cielo más dulce que el hogar. Letra y Música: Henry Rowley Bishop (1786-1855), Tr. Vicente Mendoza Polanco (1875-1955)"},{"t":"v","n":"2","x":"Allí la luz del cielo desciende más serena, de mil delicias llena la dicha del hogar; allí las horas corren más breves y gozosas, allí todas las cosas re -"},{"t":"v","n":"3","x":"Más quiero que placeres, gozar en tierra extraña, volver a la cabaña de mi tranquilo hogar; allí los pajarillos me alegran con sus cantos, allí con mil encantos es -"},{"t":"c","x":"gar, midulce hogar. cuerdan sin cesar. ¡Hogar, hogar, mi dulce hotá la luz de Dios."}]},{"s":"Himnario congregacional","n":"316b","t":"Oración por el matrimonio","p":"608–609","c":"","l":[{"t":"v","n":"1","x":"Padre túque estás en los cielos, en toda la tierra y en todo lugar. Jesucristo hijo de Dios, mi Redentor mi amado Cristo. Espíritu Santo deDios, Consolador, hoy imploramos Que tomen en sus brazos de amor y protección a este matrimoLetra y Música: Isaí Torres Rivero nio, bendice desde hoy su hogar ¡oh Diosde a mor y Dios bondadoso! que siempre se refugien en ti y en oración siempre a ti clamen. Padre te lo rogamos en elNombredeTu Hijo Jesucristo. Amén, Amén Amén."}]},{"s":"Himnario congregacional","n":"317","t":"Dios bendiga las almas unidas","p":"610","c":"Letra:     Daniel Hall; Música: A. Almudévar","l":[{"t":"v","n":"1","x":"Dios bendiga las almas unidas por los lazos de amor sacrosanto, y los guarde de todo quebanto en el mundo, de espinas erial; que el hogar que aformarse comienza con la unión de estos dos corazónes goce siempre de mil bendiciones al amparo del Dios de Israel, Letra: Daniel Hall"},{"t":"v","n":"2","x":"Que el Señor con su dulce presencia, cariñoso estas bodas presida, y conduzca por senda de vida a los que hoy se prometen lealtad. les recuerde que nada en el mundo, es eterno que todo termina, y por tanto, con gracia divina cifrar deben la dicha en su Dios. Música: A. Almudévar"},{"t":"v","n":"3","x":"Que los dos que al altar se aproximan a ofrecerse su fe mutuamente, busquen siempre de Dios en la fuente el secreto de dicha inmortal; y si acaso de duelo y tristeza se empañasen sus sendas un día, en Jesús hallarán dulce guía que otra senda les muestre mejor."}]},{"s":"Himnario congregacional","n":"317b","t":"Lo nuestro tuyo es","p":"611","c":"Letra:    William Walsham How, Tr. Adolfo Robleto; Música: Mason and Webb en Cantica Laudis","l":[{"t":"v","n":"1","x":"Lo nuestro tuyo es, tu mano nos lo dio; por eso gloria, honra y prez te damos, oh buen Dios. Amén. Letra: William Walsham How, Tr. Adolfo Robleto"},{"t":"v","n":"2","x":"Lo nuestro tuyo es, tu mano nos lo dio; de gracia recibí, Señor, y en gratitud te doy. Música: Mason and Webb en Cantica Laudis"}]},{"s":"Himnario congregacional","n":"317c","t":"Padre, Dueño y Señor","p":"611","c":"","l":[{"t":"v","n":"1","x":"Padre, Dueño y Señor de todo lo que existe, acepta nuestra ofrenda que traemos; bendícela, conságrala para tu gloria, pues de lo tuyo te damos. Amén. Letra y Música: Eliezer Moreno Lira"}]},{"s":"Himnario congregacional","n":"317d","t":"Nuestra ofrenda","p":"612","c":"","l":[{"t":"v","n":"1","x":"Ofrenda humilde te damos Señor y en ella nuestra adoración. Del corazón es ofrenda de amor; recíbela con tu bendición. Amén. Letra y Música: Manuel V. Flores"}]},{"s":"Himnario congregacional","n":"318","t":"Adalides","p":"612–613","c":"","l":[{"t":"v","n":"1","x":"Varones de Cristo, mirad al rededor; al hombre que se pierde en este mar de error. Levantate y predica, no ceses de hablar; es Cristo quien redime, no hay que desmayar. Letra y Música: Rubén González Alvarado mor con fe y valor yo voy. Yo soy, yo soy, soldado del Señor."},{"t":"v","n":"2","x":"Le damos la honra, la gloria y el honor, al trino Dios bendito, que nos brinda su amor. Estamos enlistados en este batallón; con Cristo al frente victoriosos somos hoy."},{"t":"v","n":"3","x":"Los tiempos se cumplen, muy pronto volverá; en majestad y gloria el nos levantará. No cejes en tu esfuerzo, velando en oración; que grande galardón en gloria nos dará."},{"t":"c","x":"Yo soy, yo soy, adalid de Cristo el Salvador; luchando sin te -"}]},{"s":"Himnario congregacional","n":"319","t":"Amigas de Jesús","p":"613–614","c":"","l":[{"t":"v","n":"1","x":"Somos las Vanguardia \"Amigas de Jesús\" De Morelos traemos nuestro canto al Señor, Venimos con gran gozo, con el más grande triunfo, Pues en las grandes luchas, Dios nos muestra su aLetra y Música: Jacob Sánchez Lagunas (1925-1989), ICI, Arr. Emmanuel H. Cruz Gutiérrez mor. Cristo el mejor Amigo nos ha dado su mano, Y en la prueba más fuerte conservamos la paz; Esa paz tan hermosa que nos da nuestro Amigo, Y por eso cantamos con gran gozo al Senal 2. Adelante van -"},{"t":"v","n":"2","x":"guardia de mujeres cristianas, Cristo está con nosotras, nunca nos dejará; Pues Él es nuestro Amigo, y promete ayudarnos, Si lo que Él nos ordena sabemos conservar. Marchemos de la mano del Amigo Divino, Con su brazo potente nos guiará hasta el final Marchemos de la mano del Amigo Divino, Con su brazo potente nos guiará hasta el fiOh que dicha tan"},{"t":"v","n":"3","x":"grande que Él nos haya salvado, Ya nos dió nueva vida y también un hogar, Que antes de conocerlos era ruina y tragedia, Con su sangre preciosa lo vino a transformar. Ahora somos felices y cantamos con gozo, Al Amigo precioso, a Cristo el Salvador, Y si viene la prueba, Él nos da fortaleza, Y nos guiará seguras a su bella mansión."},{"t":"v","n":"4","x":"tianas sigamos adelante, La tormenta ha pasado, ahora brilla el sol, Hemos visto cuan grande ha sido su cariño, Él cuido nuestras almas en medio del dolor. Hoy te damos las gracias, Oh Amigo precioso, Y por eso aqui estamos para testificar, Que hay poder en tu sangre, en tu sangre preciosa, Adelante vanguardias, Cristo pronto venOh mujeres crisdrá."}]},{"s":"Himnario congregacional","n":"320","t":"Amigos de Dios","p":"615","c":"","l":[{"t":"v","n":"1","x":"Himno de la Alianza de Secundarios del Presbiterio de Misiones Juventud secundaria, alianza amigos de Dios, congran gozo se levanta en el nombre del Señor, a luchar contra el maligno, anunciando salvación, levandice elSalvador:\"Soisvosotros mis amigos si obedecéis mi voz\", por eso secundarios, vamos a trabajar, a luchar vigorosos con Cristo el Capitán. Letra y Música: Efraín Hernández, ICI"},{"t":"v","n":"2","x":"No busquéis tesoros vanos, nos indica nuestro Dios, mas buscad la vida eterna y la santificación; sé un ejemplo a tus hermanos cual lo fue tu salvador; apro-"},{"t":"v","n":"3","x":"Mu chas pruebas, ciertamen te, en el camino ha llarás, mas Jesús con brazo fuerte siempre te sostendrá; secundario la armadura de Dios has de tomar, y el Es -"},{"t":"c","x":"tando el estandarte, la bandera de la cruz. vecha hoy tu fuerza, guiado por el redentor. Oíd, juventud lo que píritu divino la victoria te dará."}]},{"s":"Himnario congregacional","n":"321","t":"He aquí unido el Santo Congreso","p":"616–617","c":"","l":[{"t":"v","n":"1","x":"He aquí unido el santo congreso, hoy se encuentra a tus plantas Señor, esperandotu voz amorosa para así descansar en tu amor; en este año problemas inmensos hemos tenido tú sabes Señor, y apesar de la lucha tan cruenta tú nos diste potencia y valor. Tú nos diste tus lluvias de gracia, en nuestros campos vimos tu poder, salvando, sanando a las gentes, bautiLetra y Música: Leonardo Flores, Arm. José Espinoza. zando con tu Espíritu trambién. Yo te pido divino Cordero me santifiques y me guardes del mal, para así estar en tu presencia, y gozar de tu gloria en el día final. Nuestro santuario se viste de gloria, hay muchas antorchas que irradiam ternura y divina luz; nosotros somos refulgentes antorchas que llevamos al mundo el glorioso evangelio de Cristo Jesús. Yo te"}]},{"s":"Himnario congregacional","n":"322","t":"Daniel victorioso en Dios","p":"618–619","c":"","l":[{"t":"v","n":"1","x":"Jóvenes leales y siempre decididos a servir a nuestro Dios, siempre apartándonos del mal, la victoria nos dará nuestro Señor en la oración. Estamos unidos en fraternidad espíritual del Salvador, fortalecidos en la fe, juntos en su amor, permite Señor, contemplar tu resplandor. Letra y Música: Ángel Alberto Ibarra Galindo, ICIAR, Arr. Isaac García Contreras dad, ayuno y oración. Digno es Jesús de recibir poder, gloria y majestad por la eternidad."},{"t":"v","n":"2","x":"Vamos juventud, que ya es tiempo de pelear por la nación que Dios nos dio; el enemigo temblará al escucharnos cantar con gran valor y fuerte voz. Juntos anunciemos a Cristo el redentor que nos salvó en una cruz, es el camino y es la luz, vida es Jesús, adoremos le con inmen sa gratitud."},{"t":"v","n":"3","x":"Nunca desmayemos, dispuestos estemos a vivir en santidad, guardando la integridad en amor, con dignidad, y así con Dios poder triunfar. A Cristo servimos y con su poder nos librará del fuego cruel, del mundo nos separará, él nos guiará cumpliremos sí, su preciosa voluntad."},{"t":"c","x":"La alianza Daniel es victoriosa en Dios, firme en santi -"}]},{"s":"Himnario congregacional","n":"323","t":"La alianza de Jesús así camina","p":"619","c":"","l":[{"t":"v","n":"1","x":"La alianza de Jesús así camina, así camina con mi Jesús. Su Espíritu divino nos anima a que hablemos que Jesús murió en la cruz. llena de valor. Adelante el evangelio, porque es potencia gloriosa del Señor. Letra y Música: Guadalupe Velasco."},{"t":"v","n":"2","x":"En Cristo las proesas son hermosas, son deliciosas todas sus obras. Si la mar embravecida nos provoca siempre hay
