ganza, el oro, un efod, un harén, un hijo llamado Abimelec, y el olvido de Israel cuando Gedeón muere.", "resumen": "Efraín reprende a Gedeón; él responde con suavidad y aplacan su enojo (8:1-3). Con trescientos hombres fatigosos persigue a Zeba y Zalmuna. Sucot y Peniel le niegan pan; Gedeón promete disciplina y, tras vencer, azota a los de Sucot y derriba la torre de Peniel. Interroga a los reyes sobre unos hombres que mataron en Tabor: eran sus hermanos, hijos de su madre. Los mata. El pueblo pide: «Sé nuestro señor, tú, también tu hijo, y tu nieto». Gedeón responde: «No seré señor sobre vosotros, ni mi hijo os señoreará: Jehová señoreará sobre vosotros» (8:23). Pide, en cambio, los zarcillos del botín, y con aquel oro hace un efod en Ofra. «Todo Israel se prostituyó tras de ese efod… y fue tropezadero a Gedeón y a su casa» (8:27). La tierra reposa cuarenta años. Gedeón tiene setenta hijos de muchas mujeres, y un hijo de una concubina en Siquem: Abimelec. Muere en buena vejez. Israel vuelve a los baales, sigue a Baal-berit y no se mostraron agradecidos con la casa de Jerobaal.", "versiculos": [{"ref": "Jueces 8:23", "texto": "Mas Gedeón respondió: No seré señor sobre vosotros, ni mi hijo os señoreará: Jehová señoreará sobre vosotros."}, {"ref": "Jueces 8:27", "texto": "Y Gedeón hizo de ellos un efod, el cual hizo guardar en su ciudad de Ofra; y todo Israel se prostituyó tras de ese efod en aquel lugar; y fue tropezadero a Gedeón y a su casa."}], "dificiles": "El efod, en Israel, era una vestidura asociada al sacerdocio y, a veces, a consultar a Dios (Éxodo 28; 1 Samuel 23). Aquí Gedeón hace un efod de oro que se convierte en objeto de prostitución espiritual. El texto no detalla el ritual; sí da el veredicto: fue tropezadero. Gedeón rehúsa el título de señor con una teología impecable (8:23), pero su vida toma rasgos de rey: oro, muchas mujeres, un hijo cuyo nombre, Abimelec, significa «mi padre es rey». El narrador no escribe esa etimología; el contraste entre las palabras de 8:23 y el nombre y el estilo de vida queda a la vista del lector. Las represalias contra Sucot y Peniel son duras; el texto las relata en el marco de una guerra y de una negativa a ayudar al ejército de Dios, sin convertirlas en una norma pastoral para hoy.", "conexiones": "Deuteronomio 17:14-20 (el retrato de un rey que no debe multiplicar oro ni mujeres: un eco de lectura, no una cita que Gedeón haga); Jueces 9 (Abimelec cumplirá, de modo terrible, la sombra de este capítulo); 1 Samuel 8 (el pueblo pedirá un rey); Éxodo 32 (oro del pueblo convertido en ídolo); Jueces 12 (Efraín otra vez ofendido). Hebreos 11:32 recuerda a Gedeón en la lista de la fe: el retrato bíblico completo incluye tanto la fe como el tropezadero.", "observacion": "Hay una respuesta teológica correcta (Jehová señoreará) y un objeto que el mismo hombre fabrica y que el narrador condena. Hay reposo de cuarenta años y, a la muerte del juez, olvido e ingratitud. El nombre Abimelec queda plantado en Siquem, listo para el capítulo 9.", "interpretacion": "Terminar bien una batalla no garantiza terminar bien una vida pública. Las palabras justas pueden convivir con prácticas que arrastran a todo Israel. El verdadero problema no es solo «pedir un rey», sino quién reina de hecho: si Jehová, o el oro, o la casa del libertador.", "doctrina": "Solo Jehová es el Señor de su pueblo. Un instrumento usado por Dios puede, después, convertirse en piedra de tropiezo. La fidelidad de Dios (el reposo, la victoria) no se anula por el fallo de Gedeón, pero el fallo tiene consecuencias para su casa y para el pueblo. La gratitud hacia los libertadores es un deber que Israel no cumple (8:35).", "aplicacion": "Cuidado con el «después» de una victoria: el ministerio, el concierto, el examen, la liberación. Allí se fabrican a veces efods de oro —memoriales que se vuelven ídolos, roles que se vuelven tronos. Puedes decir con los labios «Jehová señoreará» y vivir como si tu casa fuera la corona. Pide que tu trofeo no se vuelva tropezadero.", "preguntas": ["¿Qué hay de verdadero en la respuesta de Gedeón en 8:23, y qué tensión ves con el resto del capítulo?", "¿Qué dice exactamente el narrador acerca del efod, y qué no explica?", "¿Cómo prepara este capítulo, sin adelantar de más, lo que hará Abimelec?", "¿Qué «efod» podría estar fabricándose en tu vida después de una victoria?"], "oracion": "Señor, tú señorearás sobre nosotros. Guárdame después de las victorias: que el oro, el reconocimiento o mi propia casa no se vuelvan efod ni tropezadero. Quiero que mis palabras y mi vida digan lo mismo. En el nombre de Jesús, amén.", "quiz": [{"q": "Cuando el pueblo pide que Gedeón y su hijo señoreen, ¿qué responde él?", "opts": ["Acepta el trono", "«No seré señor… Jehová señoreará sobre vosotros»", "Nombra a Abimelec", "Pide un día para consultarlo"], "a": 1, "exp": "Jueces 8:23, RVR1960, es explícito."}, {"q": "¿Qué hizo Gedeón con los zarcillos de oro del botín?", "opts": ["Los devolvió al tabernáculo de Silo", "Hizo un efod en Ofra, que fue tropezadero", "Pagó a los de Sucot", "Los fundió para trompetas"], "a": 1, "exp": "8:24-27: el efod quedó en Ofra; Israel se prostituyó tras él; fue tropezadero a Gedeón y a su casa."}, {"q": "Abimelec era…", "opts": ["El juez que sucedió oficialmente a Gedeón", "Hijo de Gedeón y de una concubina de Siquem", "Rey de Madián", "Un profeta de Efraín"], "a": 1, "exp": "8:31: de una concubina en Siquem nació un hijo al que llamó Abimelec. El cap. 9 narrará lo que hizo."}, {"q": "Después de morir Gedeón, Israel…", "opts": ["Permaneció fiel cuarenta años más", "Volvió a los baales y no hizo misericordia con la casa de Jerobaal", "Coronó a Tola de inmediato", "Destruyó el efod"], "a": 1, "exp": "8:33-35 describe la recaída y la ingratitud, conforme al ciclo de Jueces 2."}]}, {"n": 9, "title": "Abimelec: cuando el abrojo reina", "teaser": "Setenta hermanos sobre una piedra, la fábula de Jotam, y una piedra de molino en Tebes: Dios paga el mal.", "contexto": "Abimelec, hijo de Gedeón y de una concubina siquemita, no es presentado con la fórmula habitual («Jehová levantó un libertador»). Se alza en Siquem, ciudad de gran memoria (Génesis 12; 33–34; Josué 24), asociada ahora al pacto con Baal-berit (8:33; 9:4). El capítulo cubre tres años de su «reinado» y su caída. Es uno de los relatos más oscuros de la sección de los ciclos, un puente de violencia interior antes de los llamados «jueces menores».", "resumen": "Abimelec convence a los de Siquem de que es mejor que los señoree un solo hombre, «hueso vuestro y carne vuestra», y no los setenta hijos de Jerobaal. Con plata del templo de Baal-berit contrata «hombres ociosos y vagabundos», mata a sus hermanos en Ofra sobre una misma piedra, y es declarado rey junto a la encina de Siquem. Se salva Jotam, el más joven, que desde el monte Gerizim pronuncia una fábula: el olivo, la higuera y la vid rehúsan ser rey; el abrojo acepta y amenaza con fuego. Jotam pide que haya lealtad sincera, o que fuego salga de Abimelec contra Siquem y de Siquem contra Abimelec. Dios envía un mal espíritu entre Abimelec y los de Siquem (9:23). Hay revuelta, Gaal, guerra, la ciudad destruida y sembrada de sal, un millar de hombres y mujeres quemados en la torre del templo de El-berit. En Tebes, una mujer deja caer una rueda de molino sobre la cabeza de Abimelec; él pide a su paje que lo atraviese, para que no se diga que una mujer lo mató. El narrador cierra: Dios pagó a Abimelec y a Siquem su maldad, y vino sobre ellos la maldición de Jotam (9:56-57).", "versiculos": [{"ref": "Jueces 9:56-57", "texto": "Así pagó Dios a Abimelec el mal que hizo contra su padre, matando a sus setenta hermanos. Y todo el mal de los hombres de Siquem lo hizo Dios volver sobre sus cabezas, y vino sobre ellos la maldición de Jotam hijo de Jerobaal."}], "dificiles": "El cierre de 9:56-57, en RVR1960, atribuye el desenlace a Dios: «Así pagó Dios a Abimelec el mal que hizo contra su padre, matando a sus setenta hermanos. Y todo el mal de los hombres de Siquem lo hizo Dios volver sobre sus cabezas, y vino sobre ellos la maldición de Jotam hijo de Jerobaal.» En 9:23, «Dios envió un mal espíritu entre Abimelec y los hombres de Siquem»: el narrador atribuye a Dios el desacuerdo que desemboca en juicio. No es aprobación de la violencia de ninguna de las partes; es justicia judicial. La fábula del abrojo no necesita alegorizarse pieza por pieza más allá de lo que Jotam mismo aplica: un gobierno indigno que termina en fuego mutuo. Abimelec quiere evitar la fama de haber muerto a manos de una mujer; el narrador, aún así, registra quién dejó caer la piedra. El texto no llama a Abimelec «juez» levantado por Jehová.", "conexiones": "Jueces 8:23 y 8:31 (la negativa de Gedeón y el nombre de su hijo); Josué 24 (Siquem como lugar de pacto con Jehová: el contraste es deliberado para el lector canónico); 2 Samuel 11:21 (el propio David oirá recordar «quién hirió a Abimelec… ¿no fue una mujer la que echó sobre él un pedazo de rueda de molino?»). La fábula de los árboles es una de las primeras parábolas extensas de la Biblia hebrea.", "observacion": "El narrador no es neutral al final: interpreta los hechos como pago divino y cumplimiento de la maldición de Jotam. La violencia parte de la casa del libertador y de un pacto pagano (Baal-berit). Una mujer, otra vez, interviene en el desenlace, como en el cap. 4, aunque aquí el marco es de juicio, no de liberación nacional típica.", "interpretacion": "Cuando las palabras «Jehová señoreará» se olvidan, el abrojo reina. Siquem, que debía ser memoria de pacto, financia un fratricidio con el tesoro de Baal. El capítulo muestra que Dios no está ausente aunque no «levante» a este hombre: está presente como juez.", "doctrina": "Dios es justo y paga el mal, aunque tarde tres años. Un liderazgo nacido de la ambición, de la sangre y de un culto falso no es el pastorado que Dios aprueba. La soberanía de Dios alcanza incluso los conflictos internos («un mal espíritu» de discordia) sin hacer a Dios autor del pecado de los hombres: Él juzga lo que ellos sembraron.", "aplicacion": "No todo el que se alza «de los nuestros» («hueso vuestro y carne vuestra») merece el sí de la comunidad. Pregunta con Jotam: ¿hay verdad y integridad en este nombramiento, o hay un abrojo que luego prenderá fuego? Y en lo personal: el mal hecho «sobre una misma piedra» no queda suelto delante de Dios.", "preguntas": ["¿En qué se diferencia el alzamiento de Abimelec de la fórmula «Jehová levantó un libertador»?", "¿Qué pide y qué anuncia Jotam con la fábula del olivo, la higuera, la vid y el abrojo?", "Según 9:56-57, ¿quién interpreta el desenlace, y cómo?", "¿Dónde estás tentado a apoyar un «abrojo» por conveniencia de clan o de ciudad?"], "oracion": "Dios justo, tú pagas el mal y no estás ausente cuando el abrojo quiere reinar. Dame integridad para no financiar, con mi silencio o con mi sí, un liderazgo nacido de la ambición. Que tú señorees, no la violencia ni el clan. En el nombre de Jesús, amén.", "quiz": [{"q": "¿Con qué financió Abimelec a los hombres que mataron a sus hermanos?", "opts": ["Con el oro del efod de Ofra", "Con plata del templo de Baal-berit", "Con tributo de Madián", "Con ofrendas de Silo"], "a": 1, "exp": "9:4: le dieron setenta piezas de plata del templo de Baal-berit."}, {"q": "En la fábula de Jotam, ¿quién acepta ser rey cuando el olivo, la higuera y la vid rehúsan?", "opts": ["El cedro del Líbano", "El abrojo", "El encino de Siquem", "La palmera de Débora"], "a": 1, "exp": "9:8-15: el abrojo acepta y amenaza con fuego."}, {"q": "¿Cómo muere Abimelec?", "opts": ["En batalla contra Madián", "Una mujer le deja caer una rueda de molino, y su paje lo atraviesa a petición suya", "Jotam lo ejecuta en Gerizim", "Muere de vejez como Gedeón"], "a": 1, "exp": "9:50-54, en Tebes. Él quiere evitar que se diga que una mujer lo mató; el narrador igualmente lo registra."}, {"q": "El narrador concluye que el fin de Abimelec y de Siquem fue…", "opts": ["Una coincidencia trágica", "El pago de Dios y el cumplimiento de la maldición de Jotam", "Un accidente de guerra civil sin sentido", "Castigo de los filisteos"], "a": 1, "exp": "9:56-57 interpreta los hechos como justicia de Dios y cumplimiento de lo anunciado por Jotam."}]}, {"n": 10, "title": "Tola, Jair y el clamor bajo Amón", "teaser": "Dos jueces de años quietos, una lista de dioses ajenos, y un Dios que se angustia por la aflicción de Israel.", "contexto": "Después del incendio de Abimelec, el narrador presenta a Tola (de Isacar, habitó en Samir, en el monte de Efraín, veintitrés años) y a Jair galaadita (veintidós años, treinta hijos, treinta asnos, treinta ciudades en Galaad llamadas Havot-jair). Son los llamados «jueces menores»: el texto da nombre, origen, duración y, a veces, un rasgo familiar, sin relatar una batalla. Luego el ciclo se reabre con una apostasía especialmente enumerada y con una doble opresión: filisteos y amonitas. Los amonitas, al este del Jordán, oprimen a Galaad dieciocho años y cruzan también a Judá, Benjamín y Efraín.", "resumen": "Tras Tola y Jair, Israel vuelve a hacer lo malo y sirve a los baales y a Astarot, y a los dioses de Siria, de Sidón, de Moab, de los hijos de Amón y de los filisteos; deja a Jehová y no le sirve (10:6). Se enciende el furor de Jehová. El pueblo clama: hemos pecado. Jehová responde recordando las liberaciones pasadas (Egipto, amorreos, amonitas, filisteos, sidonios, Amalec, Maón) y dice: «Clamad a los dioses que habéis elegido; que os libren ellos» (10:14). Israel confiesa de nuevo, quita los dioses ajenos y sirve a Jehová. El narrador añade que Él fue angustiado a causa de la aflicción de Israel (10:16). Los amonitas se reúnen en Galaad; los de Galaad se reúnen en Mizpa y buscan quién comenzará la guerra, prometiendo hacerlo cabeza de los moradores de Galaad. El escenario queda listo para Jefté.", "versiculos": [{"ref": "Jueces 10:13-16", "texto": "Mas vosotros me habéis dejado, y habéis servido a dioses ajenos; por tanto, yo no os libraré más. Andad y clamad a los dioses que os habéis elegido; que os libren ellos en el tiempo de vuestra aflicción. Y los hijos de Israel respondieron a Jehová: Hemos pecado; haz tú con nosotros como bien te parezca; solo te rogamos que nos libres en este día. Y quitaron de entre sí los dioses ajenos, y sirvieron a Jehová; y él fue angustiado a causa de la aflicción de Israel."}], "dificiles": "Jueces 10:13-16, en RVR1960, sostiene esa tensión con estas palabras exactas: Dios declara «yo no os libraré más» y remite al pueblo a los dioses que eligió; el pueblo confiesa («haz tú con nosotros como bien te parezca; solo te rogamos que nos libres en este día»), quita los ídolos y sirve a Jehová; «él fue angustiado a causa de la aflicción de Israel». Esta tensión es teológica, no un error: Dios confronta, el pueblo se arrepiente de hecho (quitan los dioses), y las entrañas de Dios se conmueven. No minimicemos ni la reprensión ni la compasión. De Tola y Jair no debemos inventar hazañas: el silencio del narrador es parte del texto. Las «treinta ciudades» de Jair se sitúan en Galaad; Josué 13:30 y Números 32:41 mencionan Havot-jair en tradiciones relacionadas — léanse juntas, sin forzar lo que este capítulo no detalla.", "conexiones": "Jueces 2:11-19 (el ciclo, ahora con una lista aún más larga de dioses); Éxodo 34 y Deuteronomio 32 (el celo de Dios); Oseas 11:8-9 (las entrañas de Dios ante Efraín: una conexión canónica posterior, no una cita de Jueces); Jueces 11 (Jefté responderá a la pregunta de 10:18). Los filisteos, mencionados aquí, preparan también el ciclo de Sansón (caps. 13–16).", "observacion": "El narrador da espacio a dos jueces sin drama bélico, luego enumera dioses con un catálogo casi exhaustivo, registra un diálogo duro entre Jehová y el pueblo, y cierra con una nota de dolor divino y con una asamblea que busca líder.", "interpretacion": "El arrepentimiento que el texto toma en serio no es solo el clamor («hemos pecado»), sino el quitar los dioses ajenos. Dios no es un autómata del ciclo: puede decir «no os libraré más» y, a la vez, angustiarse por su pueblo. El capítulo enseña que la misericordia no es barata y que no es fría.", "doctrina": "Jehová es el único Salvador de Israel; los dioses elegidos no libran (10:14). El arrepentimiento incluye actos concretos. El corazón de Dios no es indiferente al sufrimiento de su pueblo. El liderazgo humano (10:18) no sustituye esa verdad, aunque el pueblo lo busque.", "aplicacion": "¿A qué «dioses que os habéis elegido» clamas cuando hay aflicción: imagen, recurso, reputación, un plan B espiritual? El clamor sincero se verifica cuando se quitan. Y hay un consuelo inmenso: Dios no mira tu aflicción con despego. Puedes confesar y volver.", "preguntas": ["¿Qué añade el catálogo de dioses de 10:6 a lo que ya sabíamos por Jueces 2?", "¿Cómo combinas, sin anular ninguno de los dos, el «yo no os libraré más» y el «fue angustiado a causa de la aflicción de Israel»?", "¿Qué signo concreto de arrepentimiento registra 10:16?", "¿A quién o a qué sueles acudir primero en el día de la aflicción?"], "oracion": "Jehová, tú solo libras. He servido a dioses ajenos y tú tienes derecho a confrontarme. Angustiado por la aflicción de tu pueblo, recíbeme otra vez. Quita de en medio de mí lo que no eres tú, y enséñame a servirte de verdad. En el nombre de Jesús, amén.", "quiz": [{"q": "¿Cuántos años juzgó Tola a Israel, según el texto?", "opts": ["Siete", "Dieciocho", "Veintidós", "Veintitrés"], "a": 3, "exp": "Jueces 10:2: Tola juzgó a Israel veintitrés años. Jair, veintidós (10:3)."}, {"q": "Además de baales y Astarot, Israel sirvió a dioses de…", "opts": ["Solo de Egipto", "Siria, Sidón, Moab, Amón y los filisteos", "Solo de Roma", "Babilonia exclusivamente"], "a": 1, "exp": "10:6 enumera ese elenco: una apostasía de muchos frentes."}, {"q": "Cuando Israel clama, Jehová primero…", "opts": ["Levanta de inmediato a Jefté", "Los remite a los dioses que habían elegido", "Envía un ángel a Ofra", "Destruye a Amón sin condiciones"], "a": 1, "exp": "10:13-14: «Clamad a los dioses que os habéis elegido; que os libren ellos»."}, {"q": "¿Qué hizo el pueblo, y cómo describe el narrador a Jehová, en 10:16?", "opts": ["Pidieron un rey; Jehová se alejó", "Quitaron los dioses ajenos y sirvieron a Jehová; él fue angustiado a causa de su aflicción", "Hicieron un efod; Jehová calló", "Huyeron a Mizpa; Jehová envió fuego"], "a": 1, "exp": "El arrepentimiento se ve en hechos, y el narrador revela la compasión de Dios."}]}, {"n": 11, "title": "Jefté: fe, diplomacia y un voto terrible", "teaser": "Un hijo rechazado libra a Galaad; su voto, que nadie le pidió, deja una hija y una pregunta que el texto no suaviza.", "contexto": "Jefté galaadita, «hombre valiente», es hijo de una ramera. Los hijos legítimos lo echan para que no herede. Vive en tierra de Tob, y se juntan con él «hombres ociosos». Cuando Amón hace guerra, los ancianos de Galaad van a buscarlo y aceptan, bajo juramento ante Jehová en Mizpa, que sea cabeza si el Señor entrega al enemigo. El conflicto es territorial: los amonitas reclaman tierra que Israel ocupa desde el Arnón hasta el Jaboc y el Jordán.", "resumen": "Jefté envía mensajeros al rey de Amón con un alegato histórico: Israel no tomó tierra de Moab ni de Amón; tomó tierra del amorreo Sehón, que no dejó pasar a Israel (Números 21). Israel ha habitado esas ciudades trescientos años, y ¿por qué no se reclamaron antes? «Jehová, el Juez, juzgue hoy entre los hijos de Israel y los hijos de Amón» (11:27). El rey no escucha. El Espíritu de Jehová viene sobre Jefté. Entonces Jefté hace un voto: si Dios entrega a Amón, cualquiera que salga de las puertas de su casa a recibirlo será de Jehová y lo ofrecerá en holocausto (11:30-31). Jehová entrega a Amón. Al volver a Mizpa, su hija única sale con panderos y danzas. Jefté rasga sus vestidos. Ella acepta que cumpla lo prometido, y pide dos meses para llorar su virginidad por los montes. Pasados los dos meses, «hizo de ella conforme al voto que había hecho. Y ella nunca conoció varón» (11:39). Las doncellas de Israel van cada año a endecharla cuatro días.", "versiculos": [{"ref": "Jueces 11:30-31", "texto": "Y Jefté hizo voto a Jehová, diciendo: Si entregares a los amonitas en mis manos, cualquiera que saliere de las puertas de mi casa a recibirme, cuando regrese victorioso de los amonitas, será de Jehová, y lo ofreceré en holocausto."}, {"ref": "Jueces 11:39", "texto": "Pasados los dos meses volvió a su padre, quien hizo de ella conforme al voto que había hecho. Y ella nunca conoció varón."}], "dificiles": "Este es uno de los pasajes más difíciles del Antiguo Testamento. Lo que el texto dice: el voto incluye «lo ofreceré en holocausto»; Jefté lo hace «conforme al voto»; ella nunca conoció varón; hay un lamento anual. Lo que el texto no dice: que Dios haya pedido ese voto, que lo apruebe, o que el Espíritu (11:29) inspire la promesa (el Espíritu viene antes del voto, ligado a la campaña; el narrador no une el voto al Espíritu). Hay dos lecturas que lectores cuidadosos han sostenido: (1) un holocausto literal —el sentido más directo de la palabra—, lo cual sería una tragedia y una transgresión, porque la ley prohíbe el sacrificio humano (Deuteronomio 12:31; 18:10); (2) una dedicación de virginidad perpetua, apoyada en que ella llora su virginidad y en la frase «nunca conoció varón». El texto no resuelve el debate con una nota explicativa. Lo honesto es presentar ambas, no fingir certeza donde el narrador no la da, y afirmar con claridad lo que sí es seguro: Dios no aparece mandando esa promesa. Hebreos 11:32 nombra a Jefté entre los de la fe, en el contexto de conquistas y liberaciones, no como aval del voto.", "conexiones": "Números 21:21-35 y Deuteronomio 2 (Sehón y la tierra amorrea); Números 30:2 (el peso de un voto; la propia RVR1960 cruza 11:35 con este texto); Deuteronomio 12:31 y 18:10 (prohibición de quemar hijos); Eclesiastés 5:4-5 y Proverbios 20:25 (la imprudencia de votar de prisa); Hebreos 11:32-34. El cap. 12 mostrará el reverso de esta victoria: guerra con Efraín.", "observacion": "Jefté es a la vez expulsado y buscado, diplomático (su discurso es el más largo de un juez) y precipitado en el voto. El narrador da voz a la hija: ella habla con dignidad y piedad. Hay un memorial anual. Dios entrega a Amón; eso el texto lo afirma. El voto es de Jefté.", "interpretacion": "Se puede reconocer la fe de Jefté en cuanto a la liberación y, a la vez, llorar la temeridad de su promesa. No hace falta elegir entre «héroe impecable» y «villano». El libro entero nos ha preparado para libertadores imperfectos. La ambigüedad de 11:39 no es una licencia para suavizar el horror potencial ni para añadir detalles que no están.", "doctrina": "Dios oye y libra; no por eso autentica cada palabra que un siervo suyo promete bajo presión. Los votos no son juegos. La ley de Dios, ya dada a Israel, rechaza el sacrificio humano. La fe que Hebreos celebra no lava de crítica lo que Jueces deja trágico. La dignidad de la hija queda en el memorial: el texto no la borra.", "aplicacion": "No negociemos con Dios a la manera de un trato impetuoso: «si tú me das esto, yo te daré aquello», sobre todo cuando Él no lo ha pedido. Hay celo que no es obediencia. Y hay una palabra pastoral: si este relato te pesa, está bien que te pese. Léelo delante del Dios que no se deleita en la crueldad, y deja que te enseñe a temer un voto nevado de prisa y a honrar a quienes sufren las promesas ajenas.", "preguntas": ["¿Qué parte del discurso de Jefté a Amón es historia que el Pentateuco ya contó, y qué concluye él de esa historia?", "¿Qué une y qué no une el narrador entre el Espíritu de 11:29 y el voto de 11:30-31?", "¿Cuáles son las dos lecturas principales de 11:39, y qué debe quedar claro en ambas?", "¿Qué te enseña la voz de la hija, que el narrador se detiene a registrar?"], "oracion": "Señor, tú eres el Juez que juzga con verdad. Gracias porque libras; perdona nuestro celo precipitado y las promesas que tú no pediste. Enséñame a no usar tu nombre para tratos impetuosos. Consuela, tú, las heridas que el celo torcido deja en los más cercanos. En el nombre de Jesús, amén.", "quiz": [{"q": "Según el alegato de Jefté, la tierra en disputa había sido tomada a…", "opts": ["Amón directamente, por orden de Moisés", "El amorreo Sehón, que no dejó pasar a Israel", "Egipto", "Los filisteos"], "a": 1, "exp": "11:15-23: Israel no tomó tierra de Moab ni de Amón; tomó lo que había sido de Sehón el amorreo. Cf. Números 21."}, {"q": "El voto de Jefté se hace…", "opts": ["Porque Jehová se lo pide en un sueño", "Por iniciativa de Jefté, después de que el Espíritu vino sobre él, y el texto no dice que Dios lo pidiera", "Por orden de los ancianos", "En el templo de Baal-berit"], "a": 1, "exp": "11:29-31: el Espíritu se asocia a la campaña; el voto es palabra de Jefté. Dios no aparece solicitándolo."}, {"q": "¿Qué afirma 11:39, de hecho?", "opts": ["Que Jehová se agradó del voto", "Que Jefté hizo conforme al voto, y que ella nunca conoció varón", "Que la hija fue rescatada con un animal", "Que el voto se anuló por Números 30"], "a": 1, "exp": "Hay que quedarse primero en lo escrito. Las interpretaciones (holocausto o virginidad perpetua) parten de ahí, no al revés."}, {"q": "Hebreos 11:32 menciona a Jefté…", "opts": ["Para aprobar expresamente su voto", "En una lista de quienes por fe conquistaron y se hicieron fuertes en batallas", "Como ejemplo de cómo votar", "Para condenarlo"], "a": 1, "exp": "El contexto es la fe en medio de conquistas, justicia y debilidad. No es un comentario sobre el voto."}]}, {"n": 12, "title": "Shibolet: guerra entre hermanos", "teaser": "Efraín vuelve a quejarse; en los vados del Jordán una palabra distingue, y caen cuarenta y dos mil.", "contexto": "La tensión con Efraín ya había aparecido con Gedeón (8:1-3), y entonces se apaciguó con una respuesta suave. Ahora, después de la victoria de Jefté sobre Amón, Efraín cruza con amenaza de fuego. El escenario son los vados del Jordán, frontera entre Galaad (al este) y Efraín (al oeste). El capítulo cierra el ciclo de Jefté (seis años) y añade tres jueces «menores»: Ibzán de Belén (siete años), Elón zabulonita (diez) y Abdón de Piratón, en Efraín (ocho), con notas de hijos, hijas y asnos.", "resumen": "Los de Efraín se reúnen, pasan a Zafón y dicen a Jefté: ¿por qué fuiste a pelear contra Amón y no nos llamaste? Quemaremos tu casa. Jefté responde que su pueblo estuvo en gran rencilla y que los llamó, y no los salvaron; por eso él puso su alma en su mano, Jehová entregó a Amón, y ahora Efraín viene a pelear contra él (12:2-3). Se desata la guerra. Los galaaditas toman los vados. A quien quiere pasar le preguntan si es efrateo; si niega, le piden decir «Shibolet». Dice «Sibolet», porque no puede pronunciarlo correctamente, y lo degüellan. Mueren cuarenta y dos mil de Efraín (12:5-6). Jefté muere a los seis años. Luego Ibzán (treinta hijos, treinta hijas, treinta nueras), Elón y Abdón (cuarenta hijos, treinta nietos, setenta asnos) juzgan a Israel.", "versiculos": [{"ref": "Jueces 12:5-6", "texto": "Y los galaaditas tomaron los vados del Jordán a los de Efraín; y aconteció que cuando decían los fugitivos de Efraín: Quiero pasar, los de Galaad les preguntaban: ¿Eres tú efrateo? Si él respondía: No, entonces le decían: Ahora, pues, di Shibolet. Y él decía Sibolet; porque no podía pronunciarlo correctamente. Entonces le echaban mano, y le degollaban junto a los vados del Jordán. Y murieron entonces de los de Efraín cuarenta y dos mil."}], "dificiles": "La cifra de cuarenta y dos mil es devastadora: una matanza entre hermanos de alianza, no contra un opresor extranjero. El narrador la registra sin aplauso. «Shibolet» (espiga, o corriente) funciona aquí como prueba dialectal: el texto mismo explica que no podían pronunciarlo correctamente. No hace falta añadir teoría lingüística moderna como si el capítulo la enseñara. Ibzán es «de Belén» (12:8) sin precisar si es el Belén de Judá o el Belén de Zabulón (Josué 19:15); la honestidad es dejar la incertidumbre. La respuesta de Jefté (dice que sí los llamó) no puede verificarse con una escena previa que el narrador no escribió; quedémonos con lo que cada parte afirma y con el fruto: una guerra civil.", "conexiones": "Jueces 8:1-3 (Efraín y Gedeón: el mismo orgullo, distinto desenlace); Jueces 19–21 (otra guerra interior, aún más grave); Efesios 2 y Juan 17, para el lector cristiano, iluminan por contraste lo que aquí se destruye: la unidad del pueblo de Dios. Josué 22 (un conflicto intertribal que sí se resolvió con diálogo) ofrece un contrapunto canónico.", "observacion": "Una queja por no haber sido invitados termina en decenas de miles de muertos. El criterio de muerte es una palabra mal pronunciada. Después, el narrador pasa, casi en silencio litúrgico, a tres jueces y a cifras de familia, como si la vida siguiera bajo una herida abierta.", "interpretacion": "El libro muestra que el enemigo no siempre está fuera. El orgulio tribal, el «no nos llamaste», puede incendiar lo que Dios acaba de librar. Gedeón apagó una chispa parecida con mansedumbre; Jefté, herido y confrontado con amenaza de fuego, entra en una guerra que deja a Efraín diezmado. El contraste no está explicitado por un proverbio del narrador, pero el lector de ambos capítulos puede verlo.", "doctrina": "El pueblo de Dios puede destruirse a sí mismo. La justicia de una causa (Galaad fue amenazado) no santifica automáticamente toda la sangre derramada después. Las palabras importan —aquí, literalmente—, y el orgullo también. Dios había liberado de Amón; esta matanza no se atribuye a una orden suya.", "aplicacion": "¿Qué «no me invitaste» estás a punto de convertir en fuego? En un coro, una iglesia, una familia, las ofensas de honor son terreno fértil de Shibolet: pruebas para ver si el otro «pronuncia» como nosotros, y para excluirlo. Aprende de Gedeón la respuesta suave, y de este capítulo el costo de no hacerlo. La unidad del pueblo de Dios no es un adorno.", "preguntas": ["¿Qué semejanzas y diferencias ves entre Jueces 8:1-3 y 12:1-6?", "¿Qué revela el episodio de Shibolet acerca de las divisiones internas de Israel?", "¿Por qué importa no afirmar de qué Belén era Ibzán, si el texto no lo precisa?", "¿Dónde puedes hoy apagar una chispa tribal antes de que llegue al vado?"], "oracion": "Señor, tú libras de enemigos de fuera; líbranos también del orgullo que mata hacia dentro. Enséñame una respuesta suave, y que ninguna prueba de «shibolet» se convierta en mi manera de tratar a un hermano. Que tu pueblo no se diezme a sí mismo. En el nombre de Jesús, amén.", "quiz": [{"q": "¿Qué amenaza lanzó Efraín contra Jefté?", "opts": ["Lo entregarían a Amón", "Quemarían su casa", "Lo llevarían a Silo", "Le quitarían el voto"], "a": 1, "exp": "12:1: «Nosotros quemaremos tu casa contigo»."}, {"q": "¿Qué palabra usaron como prueba en los vados, y cómo la pronunciaban los de Efraín?", "opts": ["Shalom / Salom", "Shibolet / Sibolet", "Jehová / Elohim", "Galaad / Galeed"], "a": 1, "exp": "12:6, RVR1960: «di Shibolet. Y él decía Sibolet»."}, {"q": "¿Cuántos de Efraín murieron, según 12:6?", "opts": ["Cuatrocientos", "Cuarenta y dos mil", "Seiscientos", "Veintidós mil"], "a": 1, "exp": "«Y murieron entonces de los de Efraín cuarenta y dos mil.» El narrador no celebra la cifra."}, {"q": "Después de Jefté, el capítulo nombra a…", "opts": ["Sansón, Dalila y Manóah", "Ibzán, Elón y Abdón", "Tola y Jair otra vez", "Samuel y Elí"], "a": 1, "exp": "12:8-15: tres jueces con sus años y algunos rasgos familiares."}]}, {"n": 13, "title": "El nacimiento de Sansón: nazareo desde el vientre", "teaser": "Un ángel anuncia a una mujer estéril un hijo que comenzará a salvar a Israel de los filisteos.", "contexto": "Israel otra vez hace lo malo y Jehová lo entrega a los filisteos cuarenta años (13:1). Los filisteos ocupaban la costa suroeste (Gaza, Ascalón, Asdod, Ecrón, Gat) y en esta época dominaban a Israel (cf. 14:4; 15:11). El relato se sitúa en Zora, en la familia de un danita llamado Manoa. Dan, según el capítulo 1, había sido empujado al monte; más tarde, en el 18, parte de la tribu emigrará al norte. Sansón nacerá en esa franja de contacto con Filistea. El nazareato, descrito en Números 6, era normalmente un voto temporal y voluntario; aquí es un llamado desde el vientre, anunciado por el ángel de Jehová.", "resumen": "La mujer de Manoa es estéril. El ángel de Jehová se le aparece y anuncia un hijo: no beberá vino ni sidra, no comerá cosa inmunda, y navaja no pasará sobre su cabeza, «porque el niño será nazareo a Dios desde su nacimiento, y él comenzará a salvar a Israel de mano de los filisteos» (13:5). Ella se lo cuenta a su marido. Manoa ruega que el varón de Dios vuelva; el ángel aparece de nuevo a la mujer, ella llama a Manoa, y él pregunta por la regla del niño. Piden el nombre: «¿Por qué preguntas por mi nombre, que es admirable?» (13:18). Ofrecen un cabrito sobre una peña; la llama sube y el ángel sube en la llama. Manoa teme: «Ciertamente moriremos, porque a Dios hemos visto». Su mujer responde con sensatez: si Jehová quisiera matarlos, no habría aceptado la ofrenda ni mostrado aquello. La mujer da a luz a Sansón. El niño crece y Jehová lo bendice; el Espíritu de Jehová comienza a manifestarse en él en el campamento de Dan, entre Zora y Estaol.", "versiculos": [{"ref": "Jueces 13:5", "texto": "Pues he aquí que concebirás y darás a luz un hijo; y navaja no pasará sobre su cabeza, porque el niño será nazareo a Dios desde su nacimiento, y él comenzará a salvar a Israel de mano de los filisteos."}], "dificiles": "«Comenzará a salvar» (13:5) es una precisión del propio anuncio: la obra de Sansón no se presenta como liberación completa. Los capítulos 13–16 y el resto de la historia (1 Samuel) lo confirmarán. Manoa dice «a Dios hemos visto» (13:22) después de que el ángel de Jehová sube en la llama: el texto acerca al lector a una teofanía; conviene registrar esa identificación que hace el propio Manoa, sin construir un tratado que el capítulo no desarrolla. La mujer, que no es nombrada, entiende y responde con más calma que su marido: el narrador le da esa dignidad. El nazareato incluye, según Números 6, abstenerse de producto de la vid, no cortar el cabello y no acercarse a un cadáver; aquí se subrayan el cabello, el vino y lo inmundo, y se imponen también a la madre durante el embarazo. Lo que Sansón hará después con cadáveres y con su consagración debe leerse a esta luz, sin adelantar aún el cap. 14.", "conexiones": "Números 6:1-5 (la ley del nazareo; la propia RVR1960 lo cruza en 13:5); Lucas 1 (anuncios a madres de un hijo con vocación, una conexión canónica cristiana, no una cita de Jueces); Génesis 16 y 18 (anuncios a mujeres y varones acerca de un hijo); Jueces 6 (el ángel, el fuego de la ofrenda, el temor de haber visto al ángel de Jehová). 1 Samuel 1 (Samuel, también dedicado desde antes del nacimiento, en un tiempo aún marcado por esta época).", "observacion": "Dios toma la iniciativa en una casa estéril, en un tiempo de opresión. El llamado es de por vida y precede a cualquier hazaña. El Espíritu «comienza» a manifestarse. El nombre del ángel queda como «admirable». La madre es la primera destinataria de la palabra.", "interpretacion": "Sansón es un libertador anunciado con más claridad que casi cualquier otro juez, y sin embargo el anuncio ya limita su alcance: comenzará. La consagración es don y exigencia. El contraste entre ese origen santo y la vida que veremos no está todavía narrado, pero el lector queda advertido: lo que Dios aparta, Dios lo toma en serio.", "doctrina": "Los hijos son don de Dios. La vocación puede preceder a la conciencia del llamado. El Espíritu de Jehová es quien inicia la obra. Dios se reserva un nombre que el hombre no controla. La liberación de su pueblo es su proyecto, no un accidente de fuerza física.", "aplicacion": "Hay llamados que empiezan antes de que nosotros los organicemos. Si sirves, si estudias, si esperas un hijo o cuidas a uno: la consagración es de Dios, no un adorno. Y hay una palabra de esperanza en la mujer de Manoa: Dios no muestra su palabra para destruirnos, sino para cumplirla. Pide un corazón que escuche dos veces, como ella, y que no se quede solo en el temor de Manoa.", "preguntas": ["¿Qué significa, en 13:5, que Sansón «comenzará» a salvar, y no simplemente que «salvará»?", "¿Qué exigencias del nazareato se dan, y a quién se imponen antes del nacimiento?", "¿Cómo responde la mujer de Manoa al temor de su marido, y qué teología hay en su respuesta?", "¿Qué lugar tiene el Espíritu de Jehová al final del capítulo, antes de cualquier batalla?"], "oracion": "Señor, tú llamas y tú abres el vientre estéril. Conságrame a ti de verdad, no solo de nombre. Que tu Espíritu comience —y continúe— su obra en mí, y que yo no trate lo admirable como si fuera mío. En el nombre de Jesús, amén.", "quiz": [{"q": "Según el anuncio del ángel, Sansón…", "opts": ["Completaría la liberación de los filisteos", "Comenzaría a salvar a Israel de mano de los filisteos", "Sería rey de Dan", "Sería sacerdote en Silo"], "a": 1, "exp": "13:5: «él comenzará a salvar a Israel». La precisión es del propio anuncio."}, {"q": "El niño sería nazareo…", "opts": ["Por un voto de siete días, como en Números 6 típico", "A Dios desde su nacimiento, sin que navaja pasara sobre su cabeza", "Solo si Manoa lo aceptaba", "Después de su primer voto adulto"], "a": 1, "exp": "13:5, con el cruce de Nm. 6.1-5. Aquí el nazareato es desde el vientre."}, {"q": "Cuando Manoa pregunta el nombre del ángel, este responde que su nombre es…", "opts": ["Jehová-salom", "Admirable", "Emmanuel", "Micael"], "a": 1, "exp": "13:18: «¿Por qué preguntas por mi nombre, que es admirable?»."}, {"q": "¿A quién se apareció primero el ángel?", "opts": ["A Manoa en el campo", "A la mujer de Manoa", "A los ancianos de Dan", "A un sacerdote de Silo"], "a": 1, "exp": "13:3, y otra vez en 13:9: el ángel se aparece a la mujer; ella llama a su marido."}]}, {"n": 14, "title": "La boda en Timnat: una ocasión que venía de Jehová", "teaser": "Sansón desea una mujer filistea, un león, un enigma, y una frase difícil: «esto venía de Jehová».", "contexto": "Sansón baja a Timnat, población en la órbita filistea, cerca de la frontera de Dan. En aquel tiempo «los filisteos dominaban sobre Israel» (14:4). El relato entrelaza un matrimonio mixto, un banquete de siete días, un enigma y la primera explosión de su fuerza. El nazareato del capítulo 13 queda como telón de fondo: hay un cadáver de león y miel dentro de él.", "resumen": "Sansón ve en Timnat una mujer filistea y pide a sus padres que se la tomen por mujer. Ellos objetan: ¿no hay mujer entre las hijas de tus hermanos y en tu pueblo? El narrador interviene: «Mas su padre y su madre no sabían que esto venía de Jehová, porque él buscaba ocasión contra los filisteos» (14:4). En el camino, un león joven le sale al encuentro; el Espíritu de Jehová viene sobre él y lo despedaza como a un cabrito, sin decirlo a sus padres. Más tarde encuentra en el cadáver un enjambre de abejas y miel, come y da a sus padres, sin decirles de dónde. En el banquete propone un enigma sobre el león y la miel; las treinta compañeras no pueden resolverlo, presionan a la mujer, ella llora los siete días y le saca el secreto. Sansón responde: «Si no araseis con mi novilla…». El Espíritu viene otra vez sobre él; baja a Ascalón, mata a treinta hombres, toma sus vestidos y paga la deuda. Furioso, vuelve a la casa de su padre; la mujer es dada al compañero de Sansón que lo había acompañado.", "versiculos": [{"ref": "Jueces 14:4", "texto": "Mas su padre y su madre no sabían que esto venía de Jehová, porque él buscaba ocasión contra los filisteos; pues en aquel tiempo los filisteos dominaban sobre Israel."}], "dificiles": "14:4 es una frase de observación teológica del narrador, no un sello de aprobación moral sobre todos los deseos de Sansón. Dios puede buscar una «ocasión» contra un opresor y, a la vez, el carácter impulsivo de Sansón queda a la vista (ve, quiere, se enoja, mata). Distingue soberanía de Dios y bondad de las decisiones humanas: no son lo mismo. El contacto con el cadáver del león choca con la lógica del nazareato (Números 6:6-7); el texto no comenta expresamente esa tensión, pero el lector que viene del cap. 13 puede verla. No afirmes que Sansón «pecó oficialmente» más de lo que el narrador declara, ni que no hay tensión: señala la tensión. El enigma y la matanza en Ascalón se narran en un marco de dominio filisteo y de hostilidad; no son un modelo de matrimonio o de apuestas.", "conexiones": "Éxodo 34:16 y Deuteronomio 7:3-4 (la preocupación de los padres tiene base en la ley sobre unirse a pueblos de otros dioses); Números 6 (nazareo y cadáveres); Jueces 13:5 (el propósito de comenzar a salvar); Jueces 15 (la continuación inmediata de este conflicto matrimonial). Proverbios sobre el enojo y las palabras, como marco sapiencial, no como citas del capítulo.", "observacion": "El narrador da información que los padres no tienen: esto venía de Jehová. El Espíritu irrumpe dos veces, ligado a hazañas de fuerza. Sansón no comparte con sus padres ni lo del león ni lo de la miel. La mujer es presionada hasta romper la confidencia. El capítulo cierra con abandono y un matrimonio transferido a otro.", "interpretacion": "Dios está en movimiento contra Filistea incluso cuando el libertador no parece un modelo de discernimiento. Eso consuela y advierte: consuela, porque la opresión no tiene la última palabra; advierte, porque ser instrumento no iguala el carácter al de Dios. La «ocasión» no lava el enojo ni la falta de transparencia.", "doctrina": "La soberanía de Dios abarca también las grietas de sus siervos, sin hacer de esas grietas virtud. El Espíritu capacita; no es un aval automático de cada motivo. El matrimonio y la palabra dada importan: el capítulo muestra su quiebre, no su ideal.", "aplicacion": "No uses 14:4 para bendecir un impulso («Dios lo está usando, entonces está bien»). Usa 14:4 para temer y confiar a la vez: Dios puede trabajar en medio de un lío que tú no deberías haber armado, y aun así te llama a la santidad de tu consagración. Cuida también lo que no dices en casa, y las palabras que un banquete puede arrancarte.", "preguntas": ["¿Qué afirma 14:4, y qué no afirma, acerca de los deseos de Sansón?", "¿Dónde aparece el Espíritu de Jehová en este capítulo, y para qué?", "¿Qué tensión puede percibir un lector que viene de Jueces 13 y de Números 6 al leer lo del cadáver del león?", "¿Cómo respondes cuando un «esto viene de Jehová» se usa para justificar un carácter impaciente?"], "oracion": "Señor, tú buscas ocasión para librar a tu pueblo, y tus caminos no siempre se parecen a los míos. No dejes que tu soberanía me sirva de excusa. Santifica mis deseos, mi lengua y mi enojo, y que tu Espíritu me haga fiel, no solo fuerte. En el nombre de Jesús, amén.", "quiz": [{"q": "Según 14:4, el padre y la madre de Sansón no sabían que…", "opts": ["Sansón era nazareo", "Esto venía de Jehová, porque él buscaba ocasión contra los filisteos", "Los filisteos eran cinco ciudades", "Manoa se oponía"], "a": 1, "exp": "El narrador da esa clave teológica. No es lo mismo que aprobar cada gesto de Sansón."}, {"q": "¿De dónde sale la miel del enigma?", "opts": ["De un panal en un árbol de Timnat", "Del cadáver de un león que Sansón había despedazado", "De la casa de Manoa", "De una ofrenda en Silo"], "a": 1, "exp": "14:8-9, 14:14: «Del devorador salió comida, y del fuerte salió dulzura»."}, {"q": "¿Cómo obtiene Sansón los treinta vestidos del enigma?", "opts": ["Los compra en Gaza", "El Espíritu viene sobre él, mata a treinta hombres en Ascalón y toma sus despojos", "Su padre los paga", "Los de Timnat se los dan de buena gana"], "a": 1, "exp": "14:19. El capítulo no lo presenta como una escena edificante de bodas, sino como el estallido de un conflicto."}, {"q": "Al final del capítulo, la mujer de Timnat…", "opts": ["Huye a Zora", "Es dada al compañero que había acompañado a Sansón", "Se vuelve a Israel", "Muere en el banquete"], "a": 1, "exp": "14:20. El cap. 15 partirá de este hecho."}]}, {"n": 15, "title": "La quijada de burro: fuerza y sed", "teaser": "Zorros encendidos, una quijada en Lehi, y un libertador que por fin clama a Jehová porque tiene sed.", "contexto": "El capítulo continúa el conflicto del 14: Sansón vuelve a visitar a su mujer, en el tiempo de la siega del trigo, con un cabrito. El padre no lo deja entrar: se la ha dado a su compañero, y le ofrece la hermana menor. Estamos aún bajo dominio filisteo. Los hombres de Judá, en 15:11, dirán a Sansón que los filisteos los señorean, y le preguntarán por qué les ha hecho esto. El lugar de la gran matanza se llama Lehi («quijada»); la fuente que Dios abre se llama En-hacore («la fuente del que clama»).", "resumen": "Furioso por la pérdida de su mujer, Sansón ata teas a trescientas zorras (o chacales; el término hebreo cubre cánidos así) de dos en dos y suelta las colas en las mieses, viñas y olivares de los filisteos. Ellos queman a la mujer y a su padre. Sansón los hiere «cadera y muslo» y se instala en la peña de Etam. Los filisteos suben a Judá; los de Judá (tres mil) bajan a atar a Sansón y entregarlo, con su consentimiento, atado con dos cuerdas nuevas. En Lehi, el Espíritu de Jehová viene sobre él, las cuerdas se deshacen, y con una quijada de asno fresca mata a mil hombres. Pronuncia un dicho: «Con la quijada de un asno, un montón, dos montones…». Luego tiene una sed terrible y clama a Jehová: ¿vas a dar esta liberación y dejarme caer en mano de los incircuncisos? Dios abre una cuenca en la quijada (o en Lehi) y sale agua; su espíritu se restablece. «Y juzgó a Israel en los días de los filisteos veinte años» (15:20).", "versiculos": [{"ref": "Jueces 15:20", "texto": "Y juzgó a Israel en los días de los filisteos veinte años."}], "dificiles": "El número de zorras y la quema de mieses es una táctica de guerra agraria devastadora; el texto la relata, no la prescribe como método cristiano de resolución de conflictos. La mujer y su padre mueren quemados por los filisteos: una violencia que el propio ciclo de venganza alimenta. Sobre «zorras» o «chacales»: algunas traducciones lo señalan; no hace falta dogmatizar la especie. Sobre En-hacore: el narrador explica el nombre por el clamor de Sansón. La frase de 15:18 es la primera vez en estos capítulos en que Sansón se dirige a Jehová en una oración explícita; conviene notarlo sin romantizar todo lo anterior. 15:20 y 16:31 ambos dicen que juzgó veinte años: no son necesariamente dos períodos distintos; el 16:31 puede cerrar el relato repitiendo el dato.", "conexiones": "Jueces 14 (la causa inmediata); Jueces 16:28 (otra oración, al final de su vida); Jueces 13:5 («comenzará a salvar»: aquí hay liberación parcial, no el fin del dominio filisteo, «en los días de los filisteos»); Éxodo 17 y Números 20 (Dios que da agua al que clama en la sed, un eco de lectura). 15:11 muestra a Judá dispuesto a entregar a su libertador para conservar el statu quo.", "observacion": "Hay un ciclo de represalias que se acelera. El Espíritu irrumpe otra vez en Lehi. Sansón actúa solo, no con un ejército de Israel. Judá lo ata. Dios responde a un clamor por sed después de la victoria. El narrador da, por primera vez en este ciclo, la duración del juzgado: veinte años.", "interpretacion": "Un hombre puede ser usado con gran fuerza y, al mismo tiempo, estar profundamente solo y sediento. El clamor de 15:18 reconoce que la liberación fue de Dios («esta grande liberación») y pide no caer ahora. Es teología nacida de la necesidad, no de un tratado, y Dios oye. Judá, por su parte, ilustra cómo un pueblo oprimido puede preferir la paz del opresor a la incomodidad del libertador.", "doctrina": "Jehová es quien da la liberación y quien sostiene después de ella. El Espíritu capacita. El clamor del sediento no es indigno: es fe en estado de necesidad. La liberación «en los días de los filisteos» puede coexistir con un dominio que aún no ha terminado: Dios obra por etapas, como 13:5 anunció.", "aplicacion": "Hay victorias después de las cuales lo que más hace falta es agua, no un trofeo. ¿Clamas solo cuando estás al límite? Dios, aun así, oye. Pregúntate también si, como Judá, has preferido no incomodar al «filisteo» de turno antes que sostener a quien Dios está usando. Y cuida el ciclo de la venganza: este capítulo muestra su costo humano, no su heroísmo limpio.", "preguntas": ["¿Qué te dice 15:11 acerca de Judá y del dominio filisteo?", "¿Dónde aparece, por primera vez en la historia de Sansón, una oración explícita a Jehová?", "¿Cómo se relaciona 15:20 con lo anunciado en 13:5 («comenzará a salvar»)?", "¿Qué haces tú después de una «grande liberación»: te jactas, o pides agua?"], "oracion": "Señor, tú das la liberación y tú abres la fuente para el que clama. Perdona mis ciclos de venganza y mi orgullo después de vencer. Dame un pueblo que no entregue al hermano para quedar bien con el opresor, y una sed que te busque a ti. En el nombre de Jesús, amén.", "quiz": [{"q": "¿Por qué no deja el suegro a Sansón entrar con su mujer?", "opts": ["Porque era nazareo", "Se la había dado a su compañero, y le ofrece la hermana menor", "Porque Manoa lo prohibió", "Porque era tiempo de Pascua"], "a": 1, "exp": "15:1-2, continuación directa de 14:20."}, {"q": "¿Qué hacen los hombres de Judá cuando los filisteos suben contra ellos?", "opts": ["Se unen a Sansón para la batalla", "Atan a Sansón, con su consentimiento, para entregarlo", "Huyen a Etam", "Piden un rey"], "a": 1, "exp": "15:11-13: tres mil de Judá bajan a la peña de Etam y lo atan con dos cuerdas nuevas."}, {"q": "Después de la matanza de Lehi, Sansón…", "opts": ["Canta un cántico como Débora", "Tiene sed y clama a Jehová; Dios le da agua", "Construye un altar en Ofra", "Se rinde a los filisteos"], "a": 1, "exp": "15:18-19. El lugar se llama En-hacore, la fuente del que clama."}, {"q": "Según 15:20, Sansón juzgó a Israel…", "opts": ["Cuarenta años", "Siete años", "Veinte años, en los días de los filisteos", "Hasta que los filisteos fueron expulsados del todo"], "a": 2, "exp": "«Y juzgó a Israel en los días de los filisteos veinte años.» El dominio filisteo no termina aquí."}]}, {"n": 16, "title": "Dalila, Dagón y la última oración", "teaser": "Sansón descubre todo su corazón; no sabe que Jehová ya se ha apartado; y al final clama una vez más.", "contexto": "El capítulo reúne dos escenas en territorio filisteo: Gaza, una de las ciudades principales de la costa, y el valle de Sorec, donde aparece Dalila. Los «príncipes de los filisteos» (los líderes de sus ciudades) entran en el relato con una oferta de dinero. El templo de Dagón es el marco del desenlace: Dagón era una deidad filistea a la que atribuyen la entrega de Sansón (16:23-24). Sansón ha juzgado veinte años (15:20); este capítulo cuenta el fin de esa historia y repite, al cerrar, que juzgó veinte años (16:31).", "resumen": "Sansón va a Gaza y se llega a una ramera; lo rodean para matarlo al alba, pero a medianoche arranca las puertas de la ciudad y se las lleva hacia el monte frente a Hebrón. Después ama a una mujer en el valle de Sorec, Dalila. Los príncipes le ofrecen cada uno mil cien piezas de plata si averigua en qué está su gran fuerza. Tres veces él la engaña (cuerdas de verdugos, cuerdas nuevas, tejer las siete trenzas de su cabeza). «Tres veces me has engañado», dice ella, y lo presiona de día en día, hasta que «su alma fue contristada hasta la muerte». Entonces «le descubrió todo su corazón»: nunca llegó navaja a su cabeza, porque es nazareo de Dios desde el vientre de su madre; si fuere rapado, su fuerza se apartará (16:17). Ella lo adormece, llama a un hombre que le rapa las siete trenzas, y lo aflige. Él despierta pensando escapar como las otras veces, «pero él no sabía que Jehová ya se había apartado de él» (16:20). Lo atan, le sacan los ojos, lo hacen moler en Gaza. El cabello comienza a crecer. En un gran sacrificio a Dagón lo sacan para que les sirva de juego. Sansón pide al muchacho que lo acerca a las columnas, y clama: «Señor Jehová, acuérdate ahora de mí, y fortaléceme, te ruego, solamente esta vez…» (16:28). Se inclina, cae la casa, y los que mató al morir fueron muchos más que los que había matado en vida. Su familia lo sepulta entre Zora y Estaol, en el sepulcro de Manoa.", "versiculos": [{"ref": "Jueces 16:17", "texto": "Le descubrió, pues, todo su corazón, y le dijo: Nunca a mi cabeza llegó navaja; porque soy nazareo de Dios desde el vientre de mi madre. Si fuere rapado, mi fuerza se apartará de mí, y me debilitaré y seré como todos los hombres."}, {"ref": "Jueces 16:20", "texto": "Y le dijo: ¡Sansón, los filisteos sobre ti! Y luego que despertó él de su sueño, se dijo: Esta vez saldré como las otras y me escaparé. Pero él no sabía que Jehová ya se había apartado de él."}, {"ref": "Jueces 16:28", "texto": "Entonces clamó Sansón a Jehová, y dijo: Señor Jehová, acuérdate ahora de mí, y fortaléceme, te ruego, solamente esta vez, oh Dios, para que de una vez tome venganza de los filisteos por mis dos ojos."}], "dificiles": "La fuerza nunca fue «magia del cabello». El propio Sansón liga el cabello al nazareato: la consagración a Dios. Cuando esa señal es entregada, el narrador interpreta: Jehová se había apartado. Esa es la teología del texto, no una física del pelo. El texto no dice que Dalila fuera su esposa, ni afirma con certeza su origen étnico: está en el valle de Sorec y trata con los príncipes filisteos. No le añadamos un retrato de novela. La última oración mezcla el «acuérdate de mí» y la venganza por sus dos ojos: el narrador registra ambas cosas. Hebreos 11:32-34 lo nombra entre los que por fe «sacaron fuerzas de debilidad» y se hicieron fuertes en batallas: una lectura canónica que no borra el desastre de 16:20, sino que lo atraviesa. El suicidio de derribar la casa es, en el relato, un acto de guerra en el que muere con los enemigos de su pueblo; no es un tratado general sobre quitarse la vida, ni debe usarse así.", "conexiones": "Jueces 13:5 y 16:17 (el arco del nazareato: del anuncio a la confesión, al quiebre y al cabello que vuelve a crecer); Números 6; Jueces 15:18 (su oración anterior, por sed); Hebreos 11:32-34; 1 Samuel 5 (Dagón, más adelante, caerá delante del arca: otra escena de ese ídolo, en otro libro). Proverbios 4:23 («guarda tu corazón») es un eco sapiencial legítimo, no una cita que el narrador haga.", "observacion": "Tres engaños, una presión cotidiana, una revelación del corazón, una pérdida que Sansón no percibe al despertar, una humillación pública, un cabello que crece, una oración, una muerte que el narrador cuantifica como mayor que su vida. El sepulcro familiar cierra el ciclo danita de Zora y Estaol, donde el Espíritu había comenzado a manifestarse (13:25).", "interpretacion": "El verdadero drama no es que Dalila sea astuta: es que Sansón entrega el signo de una consagración que no le pertenecía del todo, y que no se da cuenta, al despertar, de la ausencia de Dios. La tragedia espiritual puede ser inconsciente un instante. La gracia, sin embargo, no queda fuera del capítulo: «acuérdate ahora de mí» es escuchada. Un final devastador puede convivir con un Dios que aún oye.", "doctrina": "La fuerza del siervo está en la presencia de Dios, no en el recurso visible. Jehová puede apartarse; también puede acordarse cuando un hombre ciego clama. La fe de Hebreos 11 no es la canonización de cada decisión de Sansón: es el reconocimiento de que, en medio de una vida quebrada, hubo confianza en Dios. Dagón no entregó a Sansón, aunque sus adoradores lo canten: el narrador ya dijo quién se había apartado, y quién responde a la oración.", "aplicacion": "¿Qué secreto de consagración estás a punto de poner en un regazo que no lo va a guardar? La presión «de día en día» desgasta más que un solo ataque. Y hay una esperanza para quien ya ha despertado tarde: todavía se puede clamar «solamente esta vez». No para repetir el mismo juego, sino para que la última fuerza sea de Dios, no tuya. El cabello que crece no es automatismo: es un recordatorio de que la historia con Dios puede tener un último acto distinto.", "preguntas": ["Según 16:17 y 16:20, ¿dónde estaba de verdad la fuerza de Sansón?", "¿Qué no sabía Sansón al despertar, y por qué esa frase es una de las más graves del libro?", "¿Cómo lees 16:28 junto a Hebreos 11:32-34, sin borrar ninguna de las dos voces?", "¿Qué presión «de día en día» está pidiendo que le descubras todo el corazón?"], "oracion": "Señor Jehová, no dejes que yo despierte y no sepa que tú te has apartado. Guarda mi consagración; no la entregue por cansancio. Y si ya he sido herido por mi propia locura, acuérdate de mí, fortaléceme esta vez, para que el final de mi historia honre tu nombre y no al ídolo de turno. En el nombre de Jesús, amén.", "quiz": [{"q": "¿Qué pide Dalila, y a cambio de qué?", "opts": ["Que Sansón se case con ella, a cambio de tierras", "Averiguar el secreto de su fuerza, a cambio de mil cien piezas de plata de cada príncipe", "Que él deje el nazareato, a cambio del templo de Dagón", "Que vaya a Zora, a cambio de paz"], "a": 1, "exp": "16:5: cada uno de los príncipes promete mil cien piezas de plata."}, {"q": "Cuando Sansón despierta después de ser rapado, el narrador dice que…", "opts": ["Rompió las cuerdas de inmediato", "No sabía que Jehová ya se había apartado de él", "Dalila se arrepintió", "El Espíritu vino sobre él como en Lehi"], "a": 1, "exp": "16:20, RVR1960: una de las frases más graves de Jueces."}, {"q": "La última oración de Sansón incluye…", "opts": ["Solo alabanza, sin mención de sus ojos", "«Acuérdate ahora de mí, y fortaléceme… esta vez», y la venganza por sus dos ojos", "Un voto como el de Jefté", "Una petición de reinar en Gaza"], "a": 1, "exp": "16:28 registra ambas cosas: el clamor a Dios y el motivo de sus ojos. Hay que leer el versículo completo."}, {"q": "Hebreos 11 menciona a Sansón entre quienes…", "opts": ["Nunca fallaron", "Por fe sacaron fuerzas de debilidad y se hicieron fuertes en batallas", "Fueron nazareos perfectos", "Escribieron la ley"], "a": 1, "exp": "Hebreos 11:32-34. Esa voz canónica no cancela Jueces 16; lo atraviesa."}]}, {"n": 17, "title": "Micaía y su ídolo: religión a la medida", "teaser": "Un ídolo hecho con plata dedicada a Jehová, un levita de alquiler, y el estribillo: no había rey en Israel.", "contexto": "Aquí comienza el epílogo del libro (capítulos 17–21), que ya no sigue el ciclo de un juez libertador. El narrador abre una ventana a la vida religiosa y, luego, moral de Israel cuando «no había rey». El escenario es el monte de Efraín y, en el cap. 18, la tribu de Dan. El santuario legítimo de la época estaba asociado a Silo, donde estaba la casa de Dios (18:31). Lo que Micaía arma en su casa es un culto privado, con imagen de talla, efod y terafines, en tensión abierta con Éxodo 20 y Deuteronomio 12.", "resumen": "Un hombre del monte de Efraín, Micaía, ha tomado mil cien piezas de plata de su madre. Ella había pronunciado un juramento, y al devolverle él el dinero, ella lo dedica a Jehová… para hacer una imagen de talla y de fundición. El artífice la hace; Micaía tiene casa de dioses, efod, terafines, y consagra a uno de sus hijos como sacerdote. El narrador interrumpe: «En aquellos días no había rey en Israel; cada uno hacía lo que bien le parecía» (17:6). Pasa un levita joven, de Belén de Judá, de la familia de Judá, que buscaba dónde vivir. Micaía lo contrata por diez piezas de plata al año, vestido y sustento, y lo llama padre y sacerdote. Micaía concluye: «Ahora sé que Jehová me prosperará, porque tengo un levita por sacerdote» (17:13).", "versiculos": [{"ref": "Jueces 17:6", "texto": "En aquellos días no había rey en Israel; cada uno hacía lo que bien le parecía."}, {"ref": "Jueces 17:13", "texto": "Y Micaía dijo: Ahora sé que Jehová me prosperará, porque tengo un levita por sacerdote."}], "dificiles": "La madre dedica la plata «a Jehová» para hacer una imagen: el nombre santo y la transgresión de la ley contra las imágenes (Éxodo 20:4-5) conviven en una misma frase. El narrador no necesita decir «esto está mal» con un adjetivo: el contraste con la ley ya dada y el estribillo de 17:6 hacen el juicio. El levita es de Belén de Judá, «de la familia de Judá»: el texto lo presenta así; en 18:30 se dará un linaje más preciso. Micaía interpreta la prosperidad como un automatismo sacramental («tengo un levita»). El capítulo no confirma que Jehová esté de acuerdo: al contrario, el cap. 18 mostrará que ese culto es robado y reinstalado en otro lugar. No convirtamos este relato en un manual de «cómo montar una capilla casera».", "conexiones": "Éxodo 20:4-5 y Deuteronomio 12 (un solo santuario, nada de imágenes); Jueces 18 (el desenlace de este ídolo y de este levita); Jueces 18:1, 19:1 y 21:25 (el mismo estribillo, que enmarca todo el epílogo); 1 Reyes 12:28-30 (el culto de Dan, más adelante, con becerros: una conexión canónica de lectura, no una cita de este capítulo). 17:6 y 21:25 se cruzan en la propia RVR1960.", "observacion": "Todo se hace con vocabulario piadoso: juramento, dedicación a Jehová, levita, sacerdote, prosperidad. Al mismo tiempo hay robo, imagen, terafines y un hijo (luego un levita) consagrado por un particular. El narrador inserta 17:6 justo en el centro de esa escena.", "interpretacion": "El problema no es solo la anarquía política; es la religión casera que usa el nombre de Jehová para bendecir lo que la Palabra ya prohibió. «Cada uno hacía lo que bien le parecía» incluye lo que bien le parece en el culto. Tener un levita no es lo mismo que tener a Dios. El epílogo empieza por el santuario, no por el crimen de Gabaa: la descomposición moral del 19 tiene un fondo espiritual que ya se ve aquí.", "doctrina": "Jehová determina cómo se le adora; el sincero celo de una madre o la contratación de un ministro no autorizan la imagen ni el santuario privado que contradice su Palabra. El oficio (levita, sacerdote) no santifica el ídolo. La ausencia de un rey fiel se siente, pero el criterio último no es el gusto, sino lo que Dios ha dicho.", "aplicacion": "Se puede ser muy religioso y estar muy perdido. Pregúntate si tu seguridad espiritual suena a Micaía: «ahora sé que Dios me prosperará porque tengo…» (un título, un ministerio, un ritual, una persona). El criterio no es «me parece bien» ni «lleva nombre santo», sino la Palabra. En el estudio, en el coro, en la casa: nada de ídolos con barniz de piedad.", "preguntas": ["¿Qué hay de piadoso, en apariencia, en las palabras de la madre y de Micaía, y qué contradice la ley ya dada?", "¿Qué función cumple 17:6 en medio de este relato?", "¿Por qué «tengo un levita» no garantiza la prosperidad que Micaía espera?", "¿Dónde estás tentado a fabricar un culto a tu medida, con el nombre de Jehová?"], "oracion": "Señor, no me dejes hacer lo que bien me parece y ponerle tu nombre. Quiero adorarte como tú has dicho, no como a mí me resulta útil. Librame de ídolos piadosos y de poner mi confianza en un título o en un ministro, y no en ti. En el nombre de Jesús, amén.", "quiz": [{"q": "¿Para qué dedica la madre la plata «a Jehová»?", "opts": ["Para el tabernáculo de Silo", "Para hacer una imagen de talla y de fundición", "Para pagar el tributo a los filisteos", "Para ayudar a Dan"], "a": 1, "exp": "17:3: el nombre de Jehová y la imagen prohibida en una misma dedicación."}, {"q": "El estribillo de 17:6 dice que, como no había rey en Israel…", "opts": ["El pueblo esperaba a Débora", "Cada uno hacía lo que bien le parecía", "Los jueces gobernaban con rectitud", "El levita debía ser rey"], "a": 1, "exp": "RVR1960: «En aquellos días no había rey en Israel; cada uno hacía lo que bien le parecía.» Igual en 21:25."}, {"q": "¿De dónde era el levita que Micaía contrata?", "opts": ["De Silo", "De Belén de Judá", "De Gabaa", "De Zora"], "a": 1, "exp": "17:7-8: un joven levita de Belén de Judá que buscaba dónde vivir."}, {"q": "¿Qué concluye Micaía en 17:13?", "opts": ["Que debe destruir el ídolo", "«Ahora sé que Jehová me prosperará, porque tengo un levita por sacerdote»", "Que irá a consultar a Silo", "Que el levita es un fraude"], "a": 1, "exp": "El capítulo no confirma esa conclusión. El 18 mostrará el destino de ese culto."}]}, {"n": 18, "title": "Dan, Lais y un sacerdocio ilegítimo", "teaser": "Seiscientos danitas se llevan el ídolo y al sacerdote; Lais cae, y el culto queda en pie mientras la casa de Dios está en Silo.", "contexto": "«En aquellos días no había rey en Israel» (18:1). La tribu de Dan buscaba posesión, porque hasta entonces no había tenido posesión entre las tribus: el dato enlaza con 1:34, donde los amorreos empujaron a Dan al monte. Los espías van de Zora y Estaol —los mismos pueblos de la historia de Sansón— hacia el norte. Lais (luego llamada Dan) está lejos, en la zona de las fuentes del Jordán, cerca de Sidón, un pueblo confiado y aislado. El santuario legítimo, dice el narrador al cerrar, estaba en Silo (18:31).", "resumen": "Cinco hombres de Dan, enviados a reconocer la tierra, se hospedan en casa de Micaía, reconocen la voz del levita y le piden que consulte a Dios. Él responde: «Id en paz; delante de Jehová está vuestro camino». Van a Lais, ven un pueblo tranquilo, y animan a los suyos: Dios ha entregado esa tierra. Seiscientos hombres armados parten. En casa de Micaía, los cinco toman la imagen, el efod, los terafines y la imagen de fundición, y persuaden al sacerdote: es mejor ser sacerdote de una tribu que de una sola casa. El levita se alegra y se va con ellos. Micaía los persigue; le responden con amenaza, y él, viéndose débil, vuelve. Los danitas hieren a Lais a filo de espada, queman la ciudad, la reedifican y la llaman Dan. Levantan la imagen. «Y Jonatán hijo de Gersón, hijo de Moisés, él y sus hijos fueron sacerdotes en la tribu de Dan, hasta el día del cautiverio de la tierra» (18:30). La imagen estuvo en pie todo el tiempo que la casa de Dios estuvo en Silo (18:31).", "versiculos": [{"ref": "Jueces 18:30-31", "texto": "Y los hijos de Dan levantaron para sí la imagen de talla; y Jonatán hijo de Gersón, hijo de Moisés, él y sus hijos fueron sacerdotes en la tribu de Dan, hasta el día del cautiverio de la tierra. Así tuvieron levantada entre ellos la imagen de talla que Micaía había hecho, todo el tiempo que la casa de Dios estuvo en Silo."}], "dificiles": "La RVR1960 traduce «hijo de Moisés» (18:30). En el texto masorético hay una peculiaridad conocida: una letra nun suspendida que permite leer «Manasés». Gersón era hijo de Moisés (Éxodo 2:22; 18:3). Muchos han visto en esa nun un gesto de respeto, para no asociar el nombre de Moisés a este culto ilegítimo. Es una observación textual, no un dogma, y conviene leer lo que la RVR1960 de hecho dice: Moisés. «El cautiverio de la tierra» no está datado aquí; se ha pensado en el exilio del norte o en otra desolación (incluso, algunos, en la captura del arca). El capítulo no precisa cuál: no lo afirmemos con certeza. La respuesta del levita a los espías («delante de Jehová está vuestro camino») suena a palabra de Dios; el narrador no confirma que Jehová la haya dicho: un sacerdote de un ídolo puede decir lo que la gente quiere oír. El pueblo de Lais es descrito como quieto y ajeno a tratos con Sidón: el texto no los acusa de un crimen que justifique la masacre como acto santo. Es una conquista que arrastra consigo un culto robado.", "conexiones": "Jueces 1:34 y 18:1 (Dan sin posesión segura en su heredad original); Jueces 17 (origen del ídolo y del sacerdote); Éxodo 2:22 (Gersón, hijo de Moisés); Deuteronomio 12 y Josué 18–19 (la tierra y el santuario); 18:31 frente a Silo; 1 Reyes 12:29-30 (Jeroboam pondrá un becerro en Dan: el lector de toda la Biblia puede oír un eco, como interpretación canónica, no como afirmación explícita de Jueces).", "observacion": "Una tribu entera santifica, con un «consulta a Dios», lo que era un culto doméstico ilegal. El sacerdote se alegra al subir de rango. Micaía pierde lo que había fabricado. Lais desaparece. El narrador cierra con dos duraciones: hasta el cautiverio de la tierra, y todo el tiempo que la casa de Dios estuvo en Silo. Ese contraste final es deliberado.", "interpretacion": "El éxito militar no prueba la aprobación divina. Dan «encuentra» tierra y, al mismo tiempo, instala una idolatría que dura. Tener un linaje ilustre (de Moisés, según RVR1960) no redime un sacerdocio puesto al servicio de una imagen. Silo sigue ahí: la alternativa fiel existía, y fue ignorada durante una generación entera de culto paralelo.", "doctrina": "No se consulta a Dios de veras desde un santuario que Él no pidió. El linaje y el éxito no justifican el ídolo. El pueblo de Dios puede convivir, por mucho tiempo, con una imagen «mientras» la casa de Dios está en otro lugar: esa convivencia no es neutral. Jehová no queda atado a las palabras de un sacerdote contratado.", "aplicacion": "Cuidado con las puertas abiertas que se «consultan» después de haber decidido, y con los ministerios que se aceptan porque son un ascenso («¿no es mejor ser sacerdote de una tribu…?»). Hay éxitos que instalan un ídolo para décadas. Pregunta si tu «Dan» está en paz con Silo —es decir, con la presencia y la Palabra verdaderas— o si has montado un culto paralelo que te funciona.", "preguntas": ["¿Cómo se relaciona 18:1 con lo que ya leímos en Jueces 1:34?", "¿Qué valor tiene, y qué no tiene, la palabra del levita a los espías?", "¿Por qué el narrador menciona Silo en el último versículo?", "Según la RVR1960, ¿de quién era hijo Gersón, y qué observación textual suele hacerse sobre ese nombre?"], "oracion": "Señor, no me dejes bautizar con tu nombre un camino que yo ya elegí, ni alegrarme de un ministerio que se lleva un ídolo consigo. Quiero estar del lado de tu casa, no de un culto paralelo, por mucho que «funcione» o dure. En el nombre de Jesús, amén.", "quiz": [{"q": "¿Por qué buscaba Dan posesión, según 18:1?", "opts": ["Porque Jehová se lo pidió en Silo", "Porque hasta entonces no había tenido posesión entre las tribus de Israel", "Porque Sansón se lo ordenó", "Porque Micaía los despojó"], "a": 1, "exp": "18:1, en continuidad con la presión de 1:34."}, {"q": "¿Qué hacen los seiscientos con el culto de Micaía?", "opts": ["Lo destruyen como Ezequías haría con una imagen", "Se llevan la imagen, el efod, los terafines y al sacerdote", "Lo envían a Silo", "Lo devuelven después de Lais"], "a": 1, "exp": "18:14-20. El sacerdote se alegra de pasar de una casa a una tribu."}, {"q": "Según la RVR1960, Jonatán, sacerdote en Dan, era hijo de Gersón, hijo de…", "opts": ["Manasés", "Moisés", "Aarón", "Samuel"], "a": 1, "exp": "18:30, RVR1960: «hijo de Moisés». Hay una nota textual hebrea (nun suspendida) que algunos leen como Manasés; la RVR1960 traduce Moisés."}, {"q": "La imagen de Dan estuvo en pie…", "opts": ["Solo un año", "Todo el tiempo que la casa de Dios estuvo en Silo", "Hasta el reinado de Débora", "Hasta que Sansón la derribó"], "a": 1, "exp": "18:31. El narrador contrapone el culto ilegítimo y el santuario de Silo."}]}, {"n": 19, "title": "Gabaa: la noche que expuso la degradación de Israel", "teaser": "Un levita, una concubina, una ciudad de Benjamín: el texto describe el horror y no lo aprueba.", "aviso": "Este capítulo narra violencia sexual y muerte. Lo tratamos con respeto pastoral, sin detallar más de lo necesario, porque el propio libro lo relata para mostrar hasta dónde había llegado la degradación, no para que nos detengamos en el morbo.", "contexto": "«En aquellos días, cuando no había rey en Israel» (19:1). Seguimos en el epílogo del libro, después de que Israel se estableciera en Canaán y antes de la monarquía. Un levita mora como forastero en la parte más remota del monte de Efraín; su concubina es de Belén de Judá. En el viaje de regreso, se hospedan en Gabaa, ciudad de la tribu de Benjamín, al norte de Jerusalén. Es importante la geografía: se trata de Gabaa, no de Gabaón (otra ciudad, también en la órbita de Benjamín, con su propia historia en Josué 9–10 y 2 Samuel). Confundir los nombres desvía el relato.", "resumen": "La concubina «le fue infiel» (así traduce la RVR1960 en 19:2; hay discusión sobre el verbo hebreo, que algunas versiones entienden como que ella se enojó; reportamos lo que dice la RVR1960 y que existe esa discusión) y se va a casa de su padre, a Belén, cuatro meses. El levita va a persuadirla a volver. El suegro lo retiene varios días con hospitalidad abundante. Salen tarde. El criado propone pasar la noche en Jebús (Jerusalén), todavía ciudad jebusea; el levita no quiere hospedarse en ciudad de extranjeros y sigue hasta Gabaa de Benjamín. Nadie los recibe en la plaza, hasta que un anciano, que también es del monte de Efraín, los acoge. De noche, hombres de la ciudad, «hombres perversos» (hijos de Belial), rodean la casa y piden que les saquen al varón para abusar de él. El anciano ofrece a su hija virgen y a la concubina. El levita toma a su concubina y la saca fuera. La violentan toda la noche. Al amanecer ella cae a la puerta, con las manos sobre el umbral. Él dice: «Levántate, y vámonos»; ella no responde. La pone sobre el asno, llega a su casa, divide el cuerpo en doce partes y las envía por todo el territorio de Israel. Quienes ven dicen que nunca tal se ha hecho desde que Israel subió de Egipto, y que hay que considerar y hablar.", "versiculos": [{"ref": "Jueces 19:1", "texto": "En aquellos días, cuando no había rey en Israel, hubo un levita que moraba como forastero en la parte más remota del monte de Efraín, el cual había tomado para sí mujer concubina de Belén de Judá."}, {"ref": "Salmos 19:7", "texto": "La ley de Jehová es perfecta, que convierte el alma;\nEl testimonio de Jehová es fiel, que hace sabio al sencillo."}], "dificiles": "Varias precisiones, porque este relato se cuenta a veces con añadidos que el texto no tiene. Primera: la ciudad es Gabaa de Benjamín, no Gabaón. Segunda: el texto bíblico no afirma que el levita estuviera borracho ni que sufriera una resaca; esa idea puede aparecer en una narración oral, pero no está en Jueces 19. Tercera: la Biblia no aprueba la conducta del levita, ni la del anciano, ni la de los hombres de Gabaa. Está describiendo hasta dónde había llegado la degradación moral del pueblo. El levita entrega a su concubina; al día siguiente su palabra es seca («Levántate, y vámonos»); en el capítulo 20 su discurso omitirá su propia cobardía. Cuarta: la escena evoca deliberadamente Génesis 19 (los hombres de Sodoma rodean la casa, piden al huésped, el anfitrión ofrece hijas). La gravedad, aquí, es que esto ocurre en una ciudad de Israel, no en una ciudad «extranjera» que el levita quiso evitar. Quinta: si ella muere en el umbral o después, el narrador dice que no responde (19:28) y, más tarde, el levita afirmará que la mataron (20:5). Léase lo que cada versículo dice, sin añadir una escena médica que el texto no escribe.", "conexiones": "Génesis 19 (el eco de Sodoma; la comparación es del propio desenlace narrativo, no un adorno nuestro). Jueces 1:21 y el tema de Jerusalén/Jebús: el levita evita la ciudad extranjera y encuentra peor hospitalidad en Israel. Oseas 9:9 y 10:9 («desde los días de Gabaa») recuerdan este crimen como herida duradera. Jueces 17:6; 18:1; 19:1; 21:25 (el estribillo que enmarca el epílogo). Salmo 19:7-11: «El testimonio de Jehová es fiel, que hace sabio al sencillo». La conexión que un pastor puede hacer —y que conviene oír con atención— es esta: Jueces muestra lo que sucede cuando cada uno hace lo que bien le parece; el Salmo 19 enseña por qué el pueblo necesita una palabra fiel, recta y verdadera que lo oriente. «Sencillo», en ese salmo, no significa necesariamente falta de estudios: se puede tener mucho conocimiento y aún así necesitar dirección y corrección espiritual. La Biblia, al no disimular siquiera los acontecimientos más vergonzosos de Israel, demuestra esa fidelidad del testimonio de Jehová.", "observacion": "Nadie, en este relato, aparece como modelo. El narrador da hechos: hospitalidad del suegro, cálculo del levita sobre dónde dormir, crimen de Gabaa, entrega de la mujer, el umbral, las doce partes. El pueblo que recibe esos restos dice que nunca tal se ha hecho. El capítulo no cierra con una moral en proverbio: deja el horror y la convocación a hablar.", "interpretacion": "Este es el retrato de un Israel sin freno: sin rey, y, más hondo, sin temor de Dios. La ironía es teológica: se evita Jebús por ser extranjera, y la ciudad hermana comete lo que el lector bíblico ya asocia con Sodoma. El envío de las doce partes es un grito que provocará la guerra de los capítulos 20–21. No hay que buscar en el levita un héroe agraviado puro: el texto también lo deja en evidencia.", "doctrina": "La Palabra de Dios es fiel también cuando denuncia. No santifica el abuso, la cobardía ni la violencia contra una mujer. Distinguir descripción de prescripción es aquí una obligación doctrinal, no un matiz opcional. El ser humano, dejado a «lo que bien le parece», no evoluciona hacia la sabiduría: este capítulo lo muestra. Por eso el testimonio de Jehová, que hace sabio al sencillo (Salmo 19:7), no es un adorno piadoso: es la alternativa a Gabaa. Dios ve a la víctima que el relato no nombra con un discurso largo: sus manos en el umbral quedan escritas.", "aplicacion": "Hay textos que no se leen para «sacar una lección práctica» barata. Se leen para temblar, para odiar el mal, para no entregar al débil, para no adornar una narración con lo que la Biblia no dice, y para pedir la sabiduría que no sale de nuestro criterio. Si alguien ha sufrido violencia, este capítulo no está para revictimizar: está para decir que Dios no llama bueno a aquello. Busca ayuda, y que la iglesia sea la casa que Gabaa no fue. Y si enseñas o cantas la Palabra, honra su fidelidad: no la suavices, no la espectacularices.", "preguntas": ["¿Qué diferencia hay entre lo que el texto dice y lo que a veces se añade al contarlo (por ejemplo, sobre Gabaón o sobre que el levita estuviera borracho)?", "¿Por qué importa afirmar que la Biblia describe este crimen y no lo aprueba?", "¿Qué ecos de Génesis 19 observas, y qué significa que esto ocurra en una ciudad de Israel?", "¿Cómo ilumina Salmo 19:7 («el testimonio de Jehová es fiel, que hace sabio al sencillo») la lectura de Jueces 19?"], "oracion": "Señor, tu testimonio es fiel y hace sabio al sencillo. Delante de un capítulo que nos duele, te pedimos un corazón que no se endurezca ni se deleite en el mal. Tú no apruebas lo que aquí se describe. Enséñanos a odiar la violencia, a proteger al que cae en el umbral, y a no gobernarnos por lo que bien nos parece, sino por tu Palabra perfecta, que convierte el alma. En el nombre de Jesús, amén.", "quiz": [{"q": "¿En qué ciudad se hospedan el levita y su concubina, y de qué tribu era?", "opts": ["Gabaón, de Judá", "Gabaa, de Benjamín", "Silo, de Efraín", "Jebús, de los jebuseos"], "a": 1, "exp": "Es Gabaa de Benjamín (19:12-16), no Gabaón. El levita evitó Jebús por ser ciudad extranjera."}, {"q": "¿Afirma el texto que el levita estaba borracho o tenía resaca?", "opts": ["Sí, en 19:11", "No: esa idea no está en el texto de Jueces 19", "Sí, por eso el suegro lo detiene", "Solo lo afirma el cap. 20"], "a": 1, "exp": "Precisión necesaria: el relato bíblico no lo dice. No hay que añadir lo que una narración oral a veces introduce."}, {"q": "¿Aprueba la Biblia la conducta del levita y de los hombres de Gabaa?", "opts": ["Sí, porque está en la Escritura", "No: describe la degradación; no la prescribe ni la santifica", "Solo aprueba al levita", "Solo aprueba al anciano"], "a": 1, "exp": "Estar en la Biblia no equivale a ser un modelo. El libro está mostrando hasta dónde había llegado el pueblo."}, {"q": "El Salmo 19:7 dice que el testimonio de Jehová es fiel y…", "opts": [
