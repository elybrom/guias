#bar select,#bar button,#bar a{font-size:14px;padding:7px 11px;border-radius:18px;border:0;background:#fffe;color:#222;text-decoration:none}
.hs{background:#fffe;border-radius:18px;padding:6px 10px;font:600 14px system-ui;color:#222;white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px #0006}
.pnlm-title-box{display:none!important}</style></head><body>

const v=pannellum.viewer('pano',{default:{firstScene:'social',sceneFadeDuration:500,autoLoad:true,showZoomCtrl:false},scenes:SC});
const sel=document.getElementById('sel');for(const k in SC){const o=document.createElement('option');o.value=k;o.textContent=SC[k].title;sel.appendChild(o)}
sel.onchange=()=>v.loadScene(sel.value);v.on('scenechange',k=>sel.value=k);
document.getElementById('gy').onclick=async()=>{try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){};v.isOrientationActive()?v.stopOrientation():v.startOrientation()};
