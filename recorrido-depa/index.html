<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Recorrido virtual · Depa Noguerón</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1c1814;font-family:system-ui,sans-serif;color:#f5ece0;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:8px;background:linear-gradient(#000a,#0000);z-index:5}
#top h1{font-size:15px;margin:0 6px 0 2px;font-weight:600;white-space:nowrap}
select,button{font-size:15px;border-radius:10px;border:0;padding:8px 10px;background:#f5ece0;color:#2b2118}
#map{position:fixed;right:8px;bottom:8px;width:150px;height:126px;background:#fffd;border-radius:10px;z-index:5}
#joy{position:fixed;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;z-index:5}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#f5ece0cc}
#lab{position:fixed;left:50%;transform:translateX(-50%);bottom:200px;background:#0008;padding:6px 12px;border-radius:12px;font-size:16px;z-index:5}
#help{position:fixed;top:52px;left:8px;font-size:12px;opacity:.8;z-index:5}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:9;background:#1c1814}
#VRButton{z-index:6}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body>
<div id="load">Cargando el depa…</div>
<div id="top"><h1>Depa Noguerón</h1><select id="sel"></select></div>
<div id="help">Arrastra para mirar · joystick para caminar · toca el piso para saltar ahí</div>
<canvas id="map" width="300" height="252"></canvas><div id="joy"><div id="knob"></div></div><div id="lab"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {VRButton} from 'three/addons/webxr/VRButton.js';
const ROOMS=[[0, 0, 3.3, 3.6, "Vestidor"], [3.3, 0, 4.4, 1.5, "WC"], [4.4, 0, 5.6, 1.5, "Regadera"], [3.3, 1.5, 5.6, 3.0, "Lavabos"], [0, 3.6, 5.6, 8.0, "Recámara principal"], [3.3, 3.0, 5.6, 3.6, ""], [0, 8.0, 5.6, 11.2, "Sala"], [5.6, 0, 9.3, 2.8, "Recámara 3"], [5.6, 2.8, 9.3, 4.0, "Pasillo"], [9.3, 0, 11.2, 3.0, "Patio de luz (tendedero)"], [9.3, 3.0, 11.2, 4.8, "Lavado y planchado"], [11.2, 0, 14, 3.6, "Recámara visitas"], [12.2, 3.6, 14, 6.0, "Baño completo"], [12.2, 6.0, 14, 8.4, "Bodega / blancos"], [12.2, 8.4, 14, 11.2, "Oficina (entrada directa)"], [11.2, 3.6, 12.2, 8.6, "Pa- sillo"], [5.6, 4.0, 9.3, 8.4, "Cocina + isla (4-5 bancos)"], [9.3, 4.8, 11.2, 8.4, "Hornos, refri y alacena"], [5.6, 8.4, 9.3, 11.2, "Comedor 6"], [9.3, 8.4, 12.2, 11.2, "Estar / chimenea + entrada"]];
const Z0=0.205, ZT=3.305, EYE=1.6;
const P={'Descanso':[14.75,11.8,11.0,11.0,0],'Entrada':[11.7,10.6,8,8,0],'Sala':[2.5,9.8,8,6,0],'Comedor':[7.4,9.8,7.4,5,0],'Cocina':[7.0,7.9,9.5,5,0],
'Recámara principal':[4.6,7.4,1,4,0],'Vestidor':[2.0,3.3,1.6,0,0],'Baño':[4.9,2.5,3.6,1.0,0],'Recámara 3':[7.5,2.3,6,0.5,0],'Visitas':[12.0,3.2,13.5,0.5,0],
'Oficina':[12.7,10.5,13.5,8.8,0],'Lavado':[10.5,4.4,10,1,0],'Balcón':[7.5,11.7,1,11.6,0],'Terraza':[4,3,12,8,1]};
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=0.8;r.outputColorSpace=THREE.SRGBColorSpace;r.xr.enabled=true;document.body.appendChild(r.domElement);
document.body.appendChild(VRButton.createButton(r));const vb=document.getElementById('VRButton');if(vb){vb.style.bottom='150px';const fx=()=>{const t=vb.textContent;const n=t.replace('ENTER VR','VER EN VR').replace('EXIT VR','SALIR DE VR').replace('VR NOT SUPPORTED','VR no disponible aquí').replace('WEBXR NOT AVAILABLE','VR no disponible aquí');if(n!==t)vb.textContent=n;};new MutationObserver(fx).observe(vb,{childList:true,characterData:true,subtree:true});fx();}
const sc=new THREE.Scene();sc.background=new THREE.Color(0xe9dcc8);sc.fog=new THREE.Fog(0xe9dcc8,40,120);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,300);const rig=new THREE.Group();rig.add(cam);sc.add(rig);
sc.add(new THREE.HemisphereLight(0xfff3e0,0x8a7560,1.4));const sun=new THREE.DirectionalLight(0xffe2b8,1.6);sun.position.set(10,30,25);sc.add(sun);
// warm interior lights per room
for(const q of ROOMS){const l=new THREE.PointLight(0xffc98a,2.5,5,1.8);l.position.set((q[0]+q[2])/2,ZT-0.3,(q[1]+q[3])/2);sc.add(l);}
const colliders=[];let floorY=Z0;
const dl=new DRACOLoader();dl.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const gl=new GLTFLoader();gl.setDRACOLoader(dl);
gl.load('depa.glb',g=>{g.scene.traverse(o=>{if(o.isMesh){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{m.side=THREE.DoubleSide;if(m.emissive&&m.emissiveIntensity>0)m.emissiveIntensity=2;});colliders.push(o);}});
sc.add(g.scene);const roof=new THREE.Mesh(new THREE.PlaneGeometry(14,11.1),new THREE.MeshStandardMaterial({color:0xd9cdb8,roughness:.9}));roof.rotation.x=-Math.PI/2;roof.position.set(7,ZT+0.12,5.56);roof.visible=false;sc.add(roof);colliders.push(roof);window.roof=roof;document.getElementById('load').remove();go('Descanso');},undefined,e=>{document.getElementById('load').textContent='No se pudo cargar el modelo';});
let yaw=0,pitch=0;const sel=document.getElementById('sel');Object.keys(P).forEach(k=>{const o=document.createElement('option');o.textContent=k;sel.appendChild(o)});
sel.onchange=()=>go(sel.value);
function go(k){const p=P[k];floorY=p[4]?ZT+0.12:Z0;if(window.roof)roof.visible=!!p[4];rig.position.set(p[0],floorY+(r.xr.isPresenting?0:EYE),p[1]);yaw=Math.atan2(-(p[2]-p[0]),-(p[3]-p[1]));pitch=p[4]?-0.35:0;sel.value=k;}
function here(){const x=rig.position.x,z=rig.position.z;if(floorY>1)return 'Terraza';for(const q of ROOMS)if(x>=q[0]&&x<=q[2]&&z>=q[1]&&z<=q[3]&&q[4])return q[4];if(z>11)return 'Balcón / descanso';return '';}
// look drag
let drag=null;const cv=r.domElement;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,t:performance.now(),moved:0}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*0.005;pitch=Math.max(-1.3,Math.min(1.3,pitch-dy*0.005));drag.x=e.clientX;drag.y=e.clientY});
cv.addEventListener('pointerup',e=>{if(drag&&drag.moved<8&&performance.now()-drag.t<400)tap(e);drag=null});
const ray=new THREE.Raycaster();
function tap(e){const v=new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v,cam);const h=ray.intersectObjects(colliders,false)[0];
 if(h&&h.face){const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);if(n.y>0.7&&Math.abs(h.point.y-floorY)<0.6){rig.position.x=h.point.x;rig.position.z=h.point.z;}}}
// joystick
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jv={x:0,y:0},jid=null;
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
joy.addEventListener('pointerup',()=>{jid=null;jv={x:0,y:0};knob.style.left='40px';knob.style.top='40px'});
function jm(e){const b=joy.getBoundingClientRect();let x=(e.clientX-b.left-60)/50,y=(e.clientY-b.top-60)/50;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}jv={x,y};knob.style.left=40+x*40+'px';knob.style.top=40+y*40+'px';e.stopPropagation()}
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function blocked(dir){ray.set(new THREE.Vector3(rig.position.x,floorY+0.9,rig.position.z),dir);ray.far=0.35;const h=ray.intersectObjects(colliders,false);ray.far=Infinity;return h.length>0}
const map=document.getElementById('map'),mx=map.getContext('2d');
function drawMap(){mx.clearRect(0,0,300,252);mx.save();mx.translate(10,10);const s=19;mx.lineWidth=1.5;
for(const q of ROOMS){mx.fillStyle='#efe4d2';mx.strokeStyle='#5a4a3a';mx.fillRect(q[0]*s,q[1]*s,(q[2]-q[0])*s,(Math.min(q[3],11.12)-q[1])*s);mx.strokeRect(q[0]*s,q[1]*s,(q[2]-q[0])*s,(Math.min(q[3],11.12)-q[1])*s);}
mx.fillStyle='#d6e8c8';mx.fillRect(2*s,11.1*s,7.3*s,1.2*s);mx.fillStyle='#d9cdb8';mx.fillRect(11.2*s,11.25*s,4.15*s,1*s);mx.fillRect(14.15*s,5.9*s,1.2*s,5.3*s);
const x=rig.position.x*s,z=rig.position.z*s;mx.fillStyle='#d0342c';mx.beginPath();mx.arc(x,z,6,0,7);mx.fill();
mx.strokeStyle='#d0342c';mx.lineWidth=3;mx.beginPath();mx.moveTo(x,z);mx.lineTo(x-Math.sin(yaw)*16,z-Math.cos(yaw)*16);mx.stroke();mx.restore();
mx.fillStyle='#2b2118';mx.font='bold 18px system-ui';mx.fillText('Estás aquí',10,248);}
const lab=document.getElementById('lab');let last=performance.now();
r.setAnimationLoop(t=>{const dt=Math.min(0.05,(t-last)/1000);last=t;
 let f=-jv.y+(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0),sd=jv.x+(keys['d']?1:0)-(keys['a']?1:0);
 if(keys['arrowleft'])yaw+=dt*1.5;if(keys['arrowright'])yaw-=dt*1.5;
 let y=yaw;if(r.xr.isPresenting){const e=new THREE.Euler().setFromQuaternion(cam.quaternion,'YXZ');y=e.y+rig.rotation.y;}
 if(f||sd){const fw=new THREE.Vector3(-Math.sin(y),0,-Math.cos(y)),rt=new THREE.Vector3(Math.cos(y),0,-Math.sin(y));const m=fw.multiplyScalar(f).add(rt.multiplyScalar(sd));
  const sp=1.4*dt;const mx_=new THREE.Vector3(Math.sign(m.x),0,0),mz=new THREE.Vector3(0,0,Math.sign(m.z));
  if(m.x&&!blocked(mx_))rig.position.x+=m.x*sp;if(m.z&&!blocked(mz))rig.position.z+=m.z*sp;}
 if(!r.xr.isPresenting){cam.rotation.set(pitch,yaw,0,'YXZ');rig.position.y=floorY+EYE}else{rig.position.y=floorY;}
 lab.textContent=here();drawMap();r.render(sc,cam);});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
