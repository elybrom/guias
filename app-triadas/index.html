  aum:{suf:'aum',name:'Aumentada',ints:['3M','5A'],stack:['3M','3M'],formula:'3M + 3M'},

};
const POS={fund:'Cerrada (fundamental)',inv1:'1ª inversión',inv2:'2ª inversión',abierta:'Abierta'};

function midi(n){return 12*(n.o+1)+NAT[n.l]+n.a;}

function pool(src){

function buildSession(mode,src,n=10){let qs=[];
  if(src==='errores'){qs=shuffle(S.mistakes).slice(0,n).map(m=>({...m}));}
  else{const p=pool(src);let bag=[];while(qs.length<n){if(!bag.length)bag=shuffle(p);const ch=bag.pop();qs.push(makeQ(ch,mode));}}
  return {mode,src,qs,i:0,right:0,fresh:true};}

function spellMidi(m,q){const tn=T.tones(q.root,q.type);const t=tn.find(x=>T.pc(x)===m%12);let l,a;if(t){l=t.l;a=t.a;}else{const fl=tn.some(x=>x.a<0)||(q.root.l===3&&q.root.a===0);[l,a]=(fl?FLN:SHN)[m%12];}const o=Math.round((m-T.NAT[l]-a)/12)-1;return {l,a,o};}
function stackUp(ns){let out=[],prev=null;ns.forEach(n=>{let x={l:n.l,a:n.a,o:4};if(prev)while(T.step(x)<=T.step(prev))x.o++;else{}out.push(x);prev=x;});return out;}

function vPrac(){return `<h2 class="sec">Practicar <em>con calma</em></h2><p class="lead">Rondas de 10. Si te equivocas, te enseño la corrección en el pentagrama, paso a paso.</p>

${PM.src==='todas'?`<div class="label">Nivel</div><div class="toggle"><button class="${S.level==='basico'?'on':''}" data-act="lvl" data-k="basico">Básico (♯ y ♭)</button><button class="${S.level==='pro'?'on':''}" data-act="lvl" data-k="pro">Pro (𝄪 y 𝄫)</button></div>`:''}

 return `<h2 class="sec">Mi <em>tarea</em></h2><p class="lead">Cada acorde en cerrada, 1ª inv., 2ª inv. y abierta. Toca cualquiera para oírlo.</p>

const LAB={root:{l:0,a:0},type:'M',pos:'fund'};
function vLab(){const v=T.voicing(LAB.root,LAB.type,LAB.pos);const bad=T.maxAcc(LAB.root,LAB.type)>2;
 return `<h2 class="sec">Explorar <em>acordes</em></h2><p class="lead">Elige fundamental, tipo y posición. Mira, escucha y lee la explicación.</p>

<div class="accs" style="grid-template-columns:repeat(3,1fr)">${[-1,0,1].map(a=>`<button class="chip ${LAB.root.a===a?'on':''}" data-act="labA" data-k="${a}">${a?T.ACC[a]:'♮'}</button>`).join('')}</div>
<div class="label">Tipo</div><div class="chips">${Object.keys(T.TYPES).map(k=>`<button class="chip ${LAB.type===k?'on':''}" data-act="labT" data-k="${k}">${T.TYPES[k].name}</button>`).join('')}</div>
<div class="label">Posición</div><div class="chips">${POSK.map(k=>`<button class="chip ${LAB.pos===k?'on':''}" data-act="labP" data-k="${k}">${T.POSS[k]}</button>`).join('')}</div></div>
${bad?`<div class="card center">Ese acorde necesitaría triple alteración 😅 Prueba otra fundamental.</div>`:`<div class="card"><div class="tape"></div><div class="center"><span style="font-family:var(--fs);font-size:44px;font-weight:700">${fullCif({root:LAB.root,type:LAB.type,pos:LAB.pos})}</span><div class="hand" style="font-size:19px">${T.TYPES[LAB.type].name} · ${T.POS[LAB.pos]}</div></div>
<div class="staffwrap">${staff([{notes:roleNotes(v,LAB.type),label:''}],{anim:true})}</div>
<div class="notes-list">${v.notes.map((n,i)=>`<div style="border-bottom:3px solid ${ROLEC[v.roles[i]]}"><b>${nm(n)}</b><small>${T.roles(LAB.type)[v.roles[i]]}</small></div>`).join('')}</div>
<div class="row"><button class="btn soft sm" data-act="playv" data-mode="arp">▶ Arpegio</button><button class="btn soft sm" data-act="playv" data-mode="block">▶ Acorde</button></div>
<div class="mt">${piano(marksFor(v))}</div>
<details class="exp mt"><summary>📖 ¿Cómo se arma? (paso a paso)</summary><ol class="steps">${T.explainBuild(LAB.root,LAB.type,LAB.pos,S.sys).map(s=>`<li>${s}</li>`).join('')}</ol></details></div>`}`;}
function vProg(){const acc=S.total?Math.round(100*S.right/S.total):0;
 const bars=(obj,keys,lab)=>keys.map(k=>{const s=obj[k]||{t:0,r:0};const p=s.t?Math.round(100*s.r/s.t):0;return `<div class="hbar"><span>${lab(k)}</span><div class="bar"><i style="width:${p}%"></i></div><em>${s.t?p+'%':'—'}</em></div>`;}).join('');
 return `<h2 class="sec">Tu <em>progreso</em></h2><p class="lead">Todo se guarda en este teléfono, sin cuentas ni contraseñas.</p>
<div class="stat"><div class="card"><div class="v">✨ ${S.points}</div><div class="t">puntos</div></div><div class="card"><div class="v">🔥 ${S.best}</div><div class="t">mejor racha</div></div><div class="card"><div class="v">${acc}%</div><div class="t">aciertos (${S.total})</div></div><div class="card"><div class="v">🌸 ${dayStreak()}</div><div class="t">días seguidos</div></div></div>
<div class="card mt"><div class="label" style="margin-top:0">Por tipo</div>${bars(S.byType,Object.keys(T.TYPES),k=>T.TYPES[k].name)}<div class="label">Por posición</div>${bars(S.byPos,POSK,k=>T.POSS[k])}</div>
<div class="card"><div class="tape"></div><div class="label" style="margin-top:0">Errores por repasar (${S.mistakes.length})</div>
${S.mistakes.length?S.mistakes.slice().reverse().slice(0,30).map(m=>`<div class="mist"><b>${qLabel(m)}</b><span>${T.POSS[m.pos]} · ${({build:'construir',id:'identificar',spell:'deletrear'})[m.mode]}${m.n>1?' · '+m.n+' veces':''}</span></div>`).join('')+`<button class="btn pri block mt" data-start="mix|errores">🩹 Repasar errores</button>`:'<p class="prose" style="color:var(--ink2)">Nada pendiente. ¡Bien hecho! 🌷</p>'}</div>
<button class="btn ghost block" data-act="reset">Borrar mi progreso</button>`;}

function vQuiz(){if(!Q)return vPrac();const q=Q.qs[Q.i];const pct=Math.round(100*Q.i/Q.qs.length);
 const top=`<div class="qtop"><button class="icon-btn" data-act="quit" aria-label="Salir">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="pill">${Q.i+1}/${Q.qs.length}</span></div>`;
 if(q.mode==='build')return top+qBuild(q);if(q.mode==='id')return top+qId(q);return top+qSpell(q);}
function promptCard(q,kind){const lab=qLabel(q);const v=T.voicing(q.root,q.type,q.pos);
 return `<div class="card prompt"><div class="tape ${kind==='spell'?'lav':kind==='build'?'':'sage'}"></div><div class="k">${kind==='build'?'Construye en el piano':'Escribe las notas, de abajo hacia arriba'}</div><div class="cif">${lab}</div>
 ${q.slash?`<div class="pos">¿qué posición es? 🤔</div><div class="hint">El bajo es ${nm(v.notes[0])}</div>`:`<div class="pos">${T.POS[q.pos]}</div>`}</div>`;}
function qBuild(q){const sel=A.sel||[];const sp=[...sel].sort((a,b)=>a-b).map(m=>({n:spellMidi(m,q),c:'#B9566D'}));const mk={};sel.forEach(m=>mk[m]='sel');
 return promptCard(q,'build')+`<div class="card" style="padding:10px"><div class="staffwrap" id="live">${staff([{notes:sp.length?sp:[],label:sp.length?sp.map(x=>nm(x.n)).join(' · '):'toca 3 teclas'}],{})}</div>
 <div class="mt">${piano(mk,{blabels:1})}</div><div class="row mt"><button class="btn soft sm" data-act="clear">Borrar</button><button class="btn soft sm" data-act="playsel" ${sel.length?'':'disabled'}>▶ Oír</button></div></div>
 <button class="btn pri block" data-act="check" ${sel.length===3?'':'disabled'}>Comprobar ${sel.length}/3</button>`;}
function idOptions(q){const ok=cif(q.root,q.type);const out=[{root:q.root,type:q.type}];const seen=new Set([ok]);
 const add=(r,t)=>{if(!r||out.length>=4)return;if(T.maxAcc(r,t)>2)return;const k=cif(r,t);if(seen.has(k))return;seen.add(k);out.push({root:{l:r.l,a:r.a},type:t});};
 for(const r of T.ALLROOTS)if(T.pc({...r,o:4})===T.pc({...q.root,o:4})&&r.l!==q.root.l){add(r,q.type);break;}
 const v=T.voicing(q.root,q.type,q.pos);if(q.pos!=='fund'&&q.pos!=='abierta'){const b=v.notes[0];add({l:b.l,a:b.a},q.type);}
 add(q.root,rnd(Object.keys(T.TYPES).filter(t=>t!==q.type)));
 let g=0;while(out.length<4&&g++<50)add(rnd(T.ALLROOTS),rnd(Object.keys(T.TYPES)));
 return shuffle(out);}
function qId(q){if(!A.opts)A.opts=idOptions(q);const v=T.voicing(q.root,q.type,q.pos);
 return `<div class="card prompt" style="padding-bottom:8px"><div class="tape sage"></div><div class="k">¿Qué acorde es y en qué posición?</div>
 <div class="staffwrap mt">${staff([{notes:v.notes.map(n=>({n}))}],{anim:true})}</div><button class="btn soft sm mt" data-act="playq">▶ Escuchar</button></div>
 <div class="label">Cifrado</div><div class="chips quizopt">${A.opts.map((o,k)=>`<button class="chip cif ${A.c===k?'on':''}" data-act="idc" data-k="${k}">${cif(o.root,o.type)}</button>`).join('')}</div>
 <div class="label">Posición</div><div class="chips quizopt">${POSK.map(k=>`<button class="chip ${A.p===k?'on':''}" data-act="idp" data-k="${k}">${T.POSS[k]}</button>`).join('')}</div>
 <button class="btn pri block mt" data-act="check" ${A.c!=null&&A.p?'':'disabled'}>Comprobar</button>`;}
function qSpell(q){const sl=A.slots||(A.slots=[null,null,null]);if(A.act==null)A.act=0;const rl=T.roles(q.type);
 const names=S.sys==='let'?T.LET:T.SOL;const filled=sl.filter(Boolean);
 return promptCard(q,'spell')+`<div class="card" style="padding:12px"><div class="slots">${sl.map((n,i)=>`<div class="nslot ${A.act===i?'act':''}" data-act="slot" data-k="${i}"><small>${['bajo','medio','arriba'][i]}</small>${n?nm(n):''}</div>`).join('')}</div>
 <div class="staffwrap mt">${staff([{notes:stackUp(filled).map(n=>({n,c:'#B9566D'}))}],{short:1})}</div>
 <div class="label">Letra</div><div class="letters">${names.map((x,l)=>`<button class="chip" data-act="spL" data-k="${l}">${x}</button>`).join('')}</div>
 <div class="label">Alteración (para la última nota)</div><div class="accs">${[-2,-1,0,1,2].map(a=>`<button class="chip" data-act="spA" data-k="${a}" title="${T.ACCW[a]}">${a?T.ACC[a]:'♮'}</button>`).join('')}</div></div>
 <button class="btn pri block" data-act="check" ${filled.length===3?'':'disabled'}>Comprobar</button>`;}
/* --- Comprobación y retroalimentación --- */
function evaluate(q){const v=T.voicing(q.root,q.type,q.pos);const rl=T.roles(q.type);const lab=qLabel(q);
 const R={ok:false,msgs:[],yours:[],correct:v.notes.map(n=>({n,c:'#4F9A6C'})),yourM:[],corrM:v.notes.map(T.midi)};
 if(q.mode==='build'){const s=[...A.sel].sort((a,b)=>a-b);const pcs=s.map(m=>m%12),exp=v.notes.map(T.pc);const set=new Set(exp);
   const bad=pcs.map((p,i)=>p!==exp[i]);let spanBad=false;if(!bad.some(Boolean)&&q.pos!=='abierta'&&s[2]-s[0]>=12){spanBad=true;bad[2]=true;}
   R.ok=!bad.some(Boolean);R.yourM=s;R.yours=s.map((m,i)=>({n:spellMidi(m,q),c:bad[i]?'#E05A78':'#2D3350',ring:bad[i]}));
   if(!R.ok){const allIn=pcs.every(p=>set.has(p))&&new Set(pcs).size===3;
     if(spanBad)R.msgs.push(`Tienes las notas y el orden bien, pero quedaron separadas más de una octava. En <b>${T.POSS[q.pos]}</b> (cerrada) van lo más juntas posible.`);
     else if(allIn)R.msgs.push(`¡Las 3 notas son de ${lab}! 👏 Solo el <b>orden</b> no: en ${T.POS[q.pos].toLowerCase()} el bajo debe ser la <b>${rl[v.roles[0]]}</b> (${nm(v.notes[0])}).`);
     else s.forEach((m,i)=>{if(!bad[i])return;const n=spellMidi(m,q);if(!set.has(m%12))R.msgs.push(`<b>${nm(n)}</b> no es parte de ${lab}. Sus notas son ${T.tones(q.root,q.type).map(nm).join(', ')}.`);else R.msgs.push(`<b>${nm(n)}</b> sí es del acorde, pero ahí (${['abajo','en medio','arriba'][i]}) va <b>${nm(v.notes[i])}</b>.`);});
     if(q.pos==='abierta'&&!allIn&&pcs.every(p=>set.has(p)))R.msgs.push('Recuerda: abierta = fund – 5ª – 3ª (la de en medio sube una octava).');}}
 else if(q.mode==='spell'){const sl=A.slots;const yours=stackUp(sl);R.yourM=yours.map(T.midi);
   const bad=sl.map((n,i)=>!T.same(n,v.notes[i]));R.ok=!bad.some(Boolean);R.yours=yours.map((n,i)=>({n,c:bad[i]?'#E05A78':'#2D3350',ring:bad[i]}));
   sl.forEach((n,i)=>{if(!bad[i])return;const c=v.notes[i];const pos=['El bajo','La de en medio','La de arriba'][i];
     if(T.pc(n)===T.pc(c))R.msgs.push(`${pos}: <b>${nm(n)}</b> suena igual que <b>${nm(c)}</b>, pero se escribe ${nm(c)}: la letra tiene que ser ${S.sys==='let'?T.LET[c.l]:T.SOL[c.l]} (letra sí, letra no).`);
     else if(n.l===c.l)R.msgs.push(`${pos}: la letra ${S.sys==='let'?T.LET[c.l]:T.SOL[c.l]} está bien 👍, pero la alteración no: es <b>${nm(c)}</b>, no ${nm(n)}.`);
     else if(T.tones(q.root,q.type).some(t=>T.same(t,n)))R.msgs.push(`${pos}: <b>${nm(n)}</b> sí es de ${lab}, pero no va ahí; va <b>${nm(c)}</b> (la ${rl[v.roles[i]]}).`);
     else R.msgs.push(`${pos}: <b>${nm(n)}</b> no es de ${lab}; va <b>${nm(c)}</b> (la ${rl[v.roles[i]]}).`);});}
 else{const o=A.opts[A.c];const cOk=T.same(o.root,q.root)&&o.type===q.type,pOk=A.p===q.pos;R.ok=cOk&&pOk;
   const yv=T.voicing(o.root,o.type,A.p);R.yourM=yv.notes.map(T.midi);R.yours=yv.notes.map((n,i)=>{const b=!(T.same(n,v.notes[i])&&T.step(n)===T.step(v.notes[i]));return {n,c:b?'#E05A78':'#2D3350',ring:b};});
   if(!cOk){const yt=T.tones(o.root,o.type).map(nm).join(' – ');R.msgs.push(`Elegiste <b>${cif(o.root,o.type)}</b>, que se escribe <b>${yt}</b>. Aquí las notas son <b>${T.tones(q.root,q.type).map(nm).join(' – ')}</b> → <b>${cif(q.root,q.type)}</b>.`);
     if(T.pc({...o.root,o:4})===T.pc({...q.root,o:4})&&o.type===q.type)R.msgs.push('Suenan igual, pero la ortografía manda: fíjate en las letras del pentagrama. 😉');}
   if(!pOk)R.msgs.push(`Posición: elegiste <b>${T.POSS[A.p]}</b>, pero el bajo es <b>${nm(v.notes[0])}</b> = la ${rl[v.roles[0]]}${q.pos==='abierta'?' y las notas pasan de una octava':''} → <b>${T.POSS[q.pos]}</b>.`);}
 R.steps=q.mode==='id'?T.explainIdentify(q.root,q.type,q.pos,S.sys):T.explainBuild(q.root,q.type,q.pos,S.sys);
 if(q.slash)R.steps.push(`Por eso <b>${lab}</b> es ${T.POS[q.pos].toLowerCase()}: lo de después de la “/” es el bajo.`);
 return R;}
function record(q,ok){const td=today();S.days[td]=(S.days[td]||0)+1;S.total++;
 const bt=S.byType[q.type]||(S.byType[q.type]={t:0,r:0});bt.t++;const bp=S.byPos[q.pos]||(S.byPos[q.pos]={t:0,r:0});bp.t++;
 const id=qid(q);const ix=S.mistakes.findIndex(m=>qid(m)===id);
 if(ok){S.right++;bt.r++;bp.r++;S.streak++;S.best=Math.max(S.best,S.streak);const pts=10+Math.min(S.streak,10);S.points+=pts;if(ix>=0)S.mistakes.splice(ix,1);Q.right++;save();return pts;}
 S.streak=0;if(ix>=0){S.mistakes[ix].n=(S.mistakes[ix].n||1)+1;}else S.mistakes.push({root:q.root,type:q.type,pos:q.pos,slash:q.slash,mode:q.mode,keepPos:true,n:1,ts:Date.now()});
 if(S.mistakes.length>80)S.mistakes.shift();save();return 0;}
function check(){const q=Q.qs[Q.i];const R=evaluate(q);const pts=record(q,R.ok);A.done=true;
 const lab=qLabel(q);const v=T.voicing(q.root,q.type,q.pos);
 let h;if(R.ok){h=`<div class="grab"></div><div class="fb-h ok"><div class="em">🌸</div><div><h3>¡Muy bien!</h3><p>+${pts} puntos · racha ${S.streak} 🔥</p></div></div>
  <div class="staffwrap">${staff([{notes:roleNotes(v,q.type),label:fullCif(q),sub:T.POSS[q.pos]}],{anim:true})}</div>
  <p class="prose center" style="margin:8px 0">${lab} = <b>${T.tones(q.root,q.type).map(nm).join(' – ')}</b>${q.pos!=='fund'?` · ${T.POS[q.pos].toLowerCase()}: <b>${v.notes.map(nm).join(' – ')}</b>`:''}</p>`;}
 else{h=`<div class="grab"></div><div class="fb-h bad"><div class="em">💗</div><div><h3>Casi… lo corregimos</h3><p>Así quedó la tuya y así va la correcta</p></div></div>
  <div class="staffwrap">${staff([{notes:R.yours,label:'la tuya',lc:'#E05A78',bg:'#FDF0F2'},{notes:R.correct,label:'correcta',lc:'#4F9A6C',bg:'#EFF7F0'}],{anim:true,slotW:110})}</div>
  <div class="legend"><span><i style="background:#E05A78"></i>nota equivocada</span><span><i style="background:#4F9A6C"></i>correcta</span></div>
  <div class="row"><button class="btn soft sm" data-act="pm1" data-m="${R.yourM.join(',')}">▶ La tuya</button><button class="btn sage sm" data-act="pm1" data-m="${R.corrM.join(',')}">▶ La correcta</button></div>
  <div class="oops"><ul style="margin:0;padding-left:18px">${R.msgs.map(m=>`<li>${m}</li>`).join('')}</ul></div>
  <div class="label">Paso a paso, súper fácil</div><ol class="steps">${R.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;}
 h+=`<button class="btn ${R.ok?'sage':'pri'} block mt" data-act="next">${Q.i+1<Q.qs.length?'Siguiente →':'Ver resultado 🌷'}</button>`;
 openSheet(h);
 if(R.ok){AU.play(R.corrM,'block');if(S.streak&&S.streak%5===0){petals(110);toast(`¡Racha de ${S.streak}! 🌸`);}}
 else{document.querySelector('#app .card')?.classList.add('shake');setTimeout(()=>AU.play(R.corrM,'both'),250);}
 const hdr=document.querySelector('.pills');if(hdr)hdr.outerHTML=header().match(/<div class="pills">[\s\S]*?<\/div>/)[0];}
function next(){closeSheet();Q.i++;A={};if(Q.i>=Q.qs.length){finish();return;}render();scrollTo({top:0,behavior:'smooth'});}
function finish(){const r=Q.right,n=Q.qs.length;const src=Q.src,mode=Q.mode;Q=null;
 openSheet(`<div class="grab"></div><div class="center"><svg width="120" height="90" viewBox="0 0 120 90">${GRADS}${blossom(60,46,34,12,'','','pk')}</svg><h3 style="font-family:var(--fs);font-size:34px;margin:4px 0">${r===n?'¡Perfecto!':r>=n*.7?'¡Muy bien, Eli!':'¡Vas creciendo!'}</h3>
 <p class="prose">${r} de ${n} correctas · ✨ ${S.points} puntos</p>${S.mistakes.length?`<p class="hand">Tienes ${S.mistakes.length} errores para repasar 🩹</p>`:''}</div>
 <div class="row mt">${S.mistakes.length?`<button class="btn soft" data-start="mix|errores">Repasar errores</button>`:''}<button class="btn pri" data-start="${mode}|${src==='errores'?'tarea':src}">Otra ronda</button></div><button class="btn ghost block mt" data-act="home">Ir al inicio</button>`);
 if(r>=n*.7)petals(r===n?160:90);location.hash='#prac';}
/* ===== Hojas, toasts, pétalos ===== */
function openSheet(h){$('#sheet').innerHTML=h;$('#sheet').scrollTop=0;$('#sheet').classList.add('open');$('#scrim').classList.add('open');}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').classList.remove('open');}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}
function petals(n){const cv=$('#petals'),ctx=cv.getContext('2d');const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;const cols=['#F7C8CC','#EFA7B1','#FBE0E0','#CDE0C9','#E8DDF1','#F2DDB6'];
 const P=Array.from({length:n},()=>({x:Math.random()*W,y:-Math.random()*H*.6,r:(6+Math.random()*8)*devicePixelRatio,vy:(1.5+Math.random()*2.5)*devicePixelRatio,vx:(Math.random()-.5)*2,a:Math.random()*6,va:(Math.random()-.5)*.12,s:Math.random()*6,c:rnd(cols)}));
 let t0=performance.now();(function f(t){ctx.clearRect(0,0,W,H);const el=t-t0;P.forEach(p=>{p.y+=p.vy;p.s+=.04;p.x+=p.vx+Math.sin(p.s)*1.2;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.max(0,1-el/3600);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.6,0,0,7);ctx.fill();ctx.restore();});if(el<3600)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H);})(t0);}
function settings(){openSheet(`<div class="grab"></div><h3 style="font-family:var(--fs);font-size:30px;margin:4px 0 10px">Ajustes</h3>
 <div class="label">Nombres de las notas</div><div class="toggle"><button class="${S.sys==='sol'?'on':''}" data-act="sys" data-k="sol">Do – Re – Mi</button><button class="${S.sys==='let'?'on':''}" data-act="sys" data-k="let">C – D – E</button></div>
 <div class="label">Nivel (todas las tonalidades)</div><div class="toggle"><button class="${S.level==='basico'?'on':''}" data-act="lvl" data-k="basico">Básico</button><button class="${S.level==='pro'?'on':''}" data-act="lvl" data-k="pro">Pro 𝄪 𝄫</button></div>
 <div class="label">Sonido</div><div class="toggle"><button class="${S.sound?'on':''}" data-act="snd" data-k="1">🔊 Con sonido</button><button class="${!S.sound?'on':''}" data-act="snd" data-k="0">🔇 Sin sonido</button></div>
 <div class="label">Meta diaria</div><div class="toggle">${[10,20,30].map(g=>`<button class="${S.goal===g?'on':''}" data-act="goal" data-k="${g}">${g} ejercicios</button>`).join('')}</div>
 <button class="btn pri block mt" data-act="close">Listo</button>`);}
/* ===== Render + router ===== */
function render(){if(!render._keep)document.body.classList.remove('still');const h=(location.hash||'#home').slice(1);let cur='home',body;
 if(h==='learn'){cur='learn';body=vLearn();}else if(h.startsWith('lesson/')){cur='learn';body=vLesson(+h.split('/')[1]||0);}
 else if(h==='prac'||h==='quiz'){cur='prac';body=Q?vQuiz():vPrac();}else if(h==='lab'){cur='lab';body=vLab();}else if(h==='prog'){cur='prog';body=vProg();}
 else if(h==='tarea'){cur='home';body=vTarea();}else body=vHome();
 $('#app').innerHTML=(Q&&cur==='prac'?'':header())+body;$('#nav').innerHTML=Q&&cur==='prac'?'':nav(cur);
 requestAnimationFrame(()=>{if(render._keep)return;const ms=[...document.querySelectorAll('.pianoWrap .r0,.pianoWrap .r1,.pianoWrap .r2')].map(e=>+e.dataset.m);scrollPiano(ms.length?Math.max(57,Math.min(...ms)-3):59);});}
function rerenderKeep(){const y=scrollY;const pw=document.querySelector('.pianoWrap');const sl=pw?pw.scrollLeft:0;document.body.classList.add('still');render._keep=1;render();render._keep=0;scrollTo(0,y);const p=document.querySelector('.pianoWrap');if(p)p.scrollLeft=sl;requestAnimationFrame(()=>{const p2=document.querySelector('.pianoWrap');if(p2)p2.scrollLeft=sl;});}
function start(mode,src){Q=buildSession(mode,src);A={};closeSheet();if(location.hash==='#quiz')render();else location.hash='#quiz';scrollTo(0,0);}
const ACT={
 play:d=>AU.play(d.m.split(',').map(Number)),pm1:d=>AU.play(d.m.split(',').map(Number),'both'),
 key:d=>{const m=+d.m;AU.play([m],'block');const q=Q&&Q.qs[Q.i];if(q&&q.mode==='build'&&!A.done&&location.hash==='#quiz'){A.sel=A.sel||[];const i=A.sel.indexOf(m);if(i>=0)A.sel.splice(i,1);else if(A.sel.length<3)A.sel.push(m);else{toast('Ya tienes 3 notas · toca una para quitarla');return;}rerenderKeep();}},
 clear:()=>{A.sel=[];rerenderKeep();},playsel:()=>AU.play(A.sel,'both'),
 playq:()=>{const q=Q.qs[Q.i];AU.play(T.voicing(q.root,q.type,q.pos).notes.map(T.midi),'both');},
 idc:d=>{A.c=+d.k;rerenderKeep();},idp:d=>{A.p=d.k;rerenderKeep();},
 slot:d=>{A.act=+d.k;rerenderKeep();},
 spL:d=>{const i=A.act??0;A.slots[i]={l:+d.k,a:0,o:4};A.last=i;const nx=A.slots.findIndex((x,j)=>!x&&j>i);A.act=nx>=0?nx:A.slots.findIndex(x=>!x);if(A.act<0)A.act=i;rerenderKeep();AU.play([T.midi(A.slots[i])],'block');},
 spA:d=>{const i=A.last??A.act;if(!A.slots[i]){toast('Primero elige la letra');return;}A.slots[i].a=+d.k;rerenderKeep();AU.play([T.midi(A.slots[i])],'block');},
 check:()=>{if(A.done)return;check();},next:()=>next(),quit:()=>{Q=null;A={};closeSheet();render();},
 lq:d=>{const l=LESSONS[+d.i],k=+d.k;const okk=k===l.quiz.a;document.querySelectorAll('#lq .chip').forEach((b,j)=>{b.classList.toggle('ok',j===l.quiz.a);b.classList.toggle('bad',j===k&&!okk);});
   $('#lqw').innerHTML=`<div class="${okk?'note-card':'oops'}" style="margin-top:10px">${okk?'🌸 ¡Exacto! ':'💗 Casi. '}${l.quiz.why}</div>`;if(okk){S.lessons[d.i]=1;save();petals(50);}},
 pm:d=>{PM.mode=d.k;render();},ps:d=>{if(d.k==='errores'&&!S.mistakes.length)return;PM.src=d.k;render();},startPM:()=>start(PM.mode,PM.src),
 lvl:d=>{S.level=d.k;save();if($('#sheet').classList.contains('open'))settings();render();},
 sys:d=>{S.sys=d.k;save();settings();render();},snd:d=>{S.sound=d.k==='1';save();settings();},goal:d=>{S.goal=+d.k;save();settings();render();},
 settings:()=>settings(),close:()=>closeSheet(),home:()=>{closeSheet();location.hash='#home';},
 reset:()=>{if(confirm('¿Borrar puntos, rachas y errores?')){localStorage.removeItem(KEY);location.reload();}},
 labL:d=>{LAB.root={l:+d.k,a:LAB.root.a};rerenderKeep();},labA:d=>{LAB.root={l:LAB.root.l,a:+d.k};rerenderKeep();},labT:d=>{LAB.type=d.k;rerenderKeep();},labP:d=>{LAB.pos=d.k;rerenderKeep();},
 playv:d=>AU.play(T.voicing(LAB.root,LAB.type,LAB.pos).notes.map(T.midi),d.mode)
};
document.addEventListener('click',e=>{AU.init();const s=e.target.closest('[data-start]');if(s){const [m,src]=s.dataset.start.split('|');start(m,src);return;}
 const g=e.target.closest('[data-go]');if(g){location.hash='#'+g.dataset.go;return;}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]&&!a.disabled){ACT[a.dataset.act](a.dataset);}});
$('#scrim').addEventListener('click',()=>{if(Q&&A.done)return;closeSheet();});
addEventListener('hashchange',()=>{if(location.hash!=='#quiz'&&location.hash!=='#prac'&&Q){Q=null;A={};}closeSheet();render();scrollTo(0,0);});
if(document.fonts)document.fonts.ready.then(()=>render());
render();
</script></body></html>
