hosanna! En cielo y tierra es del Señor La gloria y potestad; Y nos circunda con su amor la excelsa Trinidad. Alzad pues himnos de loor, Que es grato al sumo Bien, Y a Dios rindamos todo honor Ahora y siempre, Amén. A Dios rindamos todo honor, todo honor, todo honor, A Dios rindamos todo honor Ahora y siempre, Amén."}]},{"s":"Himnario congregacional","n":"11b","t":"A Nuestro Padre Dios","p":"241","c":"Letra: Henry Carey; Música: Recopilado del Himnario de Belén","l":[{"t":"v","n":"1","x":"A nuestro Padre Dios Alcemos nuestra voz, ¡Gloria a Él! Tal fue su amor que dio Al Hijo que murió, En quien confío yo ¡Gloria a Él!"},{"t":"v","n":"2","x":"A nuestro Salvador Demos con fe loor, ¡Gloria a Él! Su sangre derramó, Con ella me lavó El cielo me abrió ¡Gloria a Él!"},{"t":"v","n":"3","x":"Espíritu de Dios, Elevo a Ti mi voz; ¡Gloria a Ti! Con ce les tial fulgor Me muestras el amor de Cristo, mi Señor ¡Gloria a Ti!"},{"t":"v","n":"4","x":"Con gozo y amor, Cantemos con fervor; ¡Al trino Dios! En la eternidad Mora la Trinidad; ¡Por siempre alabad Al Trino Dios!"}],"w":1},{"s":"Himnario congregacional","n":"12","t":"¡Majestad!","p":"242–243","c":"Letra: Estr.1 Jack Hayford, 1981, Estr. 2-3 Comité de celebremos su gloria; Música: Jack Hayford, 1981, Arr. Augene Thomas; D.R. 1981 Trust Music Management","l":[{"t":"v","n":"1","x":"¡Majestad, excelsa majestad! tributadle la gloria y el honor; ¡Majestad! por siempre ensalzad al Salvador, digno Señor, el vencedor."},{"t":"v","n":"2","x":"¡Majestad, divina majestad! Dios eterno es Jesucristo, el Señor; ¡Majestad! de su poder cantad; él es Creador, Sustentador, Gobernador."},{"t":"v","n":"3","x":"¡Majestad, eterna majestad! al que era, que es y siempre será; ¡Majestad! su triunfo proclamad; pronto vendrá, nos llevará y reinará."},{"t":"c","x":"Alabad, engrandeced su santo Nombre, adorad, magnificad al gran Redentor. ¡Majestad! la gloria celebrad del Salvador, Cristo Jesús, Rey y Señor."}]},{"s":"Himnario congregacional","n":"13","t":"Más allá del sol","p":"244","c":"Letra y Música: Desconocido, Arm. Isaí Torres Rivero","l":[{"t":"v","n":"1","x":"Más allá del sol donde mora el Rey, el Rey, el Rey, existe un palacio de oro y de cristal. tal."},{"t":"v","n":"2","x":"Las calles son de oro las puertas de pertal."},{"t":"v","n":"3","x":"Veinticuatro an cianoscantaban: ¡Amén!, ¡Amén!, ¡Alas y un muro precioso de oro y de cristal. Dios. mén! y los querubines daban gloria a Dios."},{"t":"c","x":"¡Gloria, gloria, gloria, demos al Cordero! porque fue inmoG GC G (o bien: lado para nuestro bien. bien.)"}],"w":1},{"s":"Himnario congregacional","n":"14","t":"Nunca Dios mío","p":"245","c":"Letra: Juan Bautista Cabrera Ivars (1837-1916); Música: Friedrich F. Flemming (1778-1813), 1811","l":[{"t":"v","n":"1","x":"Nunca, Dios mío, cesará mi labio, De bendecirte, de cantar tu gloria, Porque conservo de tu amor inmenso Grata memoria."},{"t":"v","n":"2","x":"Cuando perdido en mundanal sendero No me cercaba sino niebla oscura, Tú me miraste, y alumbróme un rayo De tu luz pura."},{"t":"v","n":"3","x":"Cuando inclinaba mi abatida frente Del mal obrar el oneroso yugo, Dulce reposo y e fi caz alivio Darme te plugo."},{"t":"v","n":"4","x":"Cuando los dones malgasté a porfía Con que a mi alma pródigo adornaste, \"Padre, he pecado\", con dolor te dije, Y me abrazaste."},{"t":"v","n":"5","x":"Cuando en mis propios méritos fiaba, Nunca mi pecho con amor latía; Hoy de amor late, porque en tus bondades Sólo confío."},{"t":"v","n":"6","x":"¡Oh nunca, nunca! cesará mi labio De bendecirte, de cantar tu gloria, Porque conservo de tu amor inmenso Grata memoria."}],"w":1},{"s":"Himnario congregacional","n":"15","t":"¡Oh! cuán precioso es alabar a Jesucristo","p":"246","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"¡Oh! cuán precioso es alabar a Jesucristo, y meditar en la palabra del Señor, esperando con paciencia su venida para nuestra eternal consolación."},{"t":"v","n":"2","x":"¡Oh! cuán hermosa es la reunión de los creyentes que se bautizan en el nombre del Señor, esperando la promesa de su Padre que por Cristo nos tenía que mandar."},{"t":"v","n":"3","x":"En aquel día en que resplandezca la justicia, todos saldremos a ordenanza del Señor; libertados y comprados con su sangre, dando glorias y aleluyas al Señor."},{"t":"v","n":"4","x":"Mirad aquellas multitudes que están blancas ¿quiénes serán? vienen con palmas en sus manos, ellas pasaron por grandes tribulaciones, y la sangre del Cordero las limpió."},{"t":"c","x":"Y lo más precioso es volar al cielo, llegar con Cristo y rendirle honor. Y lo más precioso es volar al cielo, llegar con Cristo y quedarse allá."}]},{"s":"Himnario congregacional","n":"16","t":"¡Oh Padre, eterno Dios!","p":"247","c":"Letra: Felice de Giardini, Tr. Vicente Mendoza Polanco (1875-1955); Música: Felice de Giardini","l":[{"t":"v","n":"1","x":"¡Oh Padre, eterno Dios! Alzamos nuestra voz En gratitud; De cuanto Tú nos das Con sin igual amor, Hallando nuestra paz En Ti, Señor."},{"t":"v","n":"2","x":"¡Bendito Salvador! Te damos con amor El corazón, Y aquí nos puedes ver Que humildes a tu altar venimos a ofrecer precioso don. Amén."},{"t":"v","n":"3","x":"¡Espíritu de Dios! Escucha nuestra voz, Y tu bondad, Derrame en nuestro ser Divina claridad para poder vivir en santidad."}]},{"s":"Himnario congregacional","n":"17","t":"¡Salve! Cantad al Señor","p":"248","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: J. H. Wigmore","l":[{"t":"v","n":"1","x":"¡Salve! cantad al Señor, La gloria a su nombre dad; ¡Salve! cantad su loor, Que grande es su eterna bondad."},{"t":"v","n":"2","x":"¡Salve! digamos al Rey Del pueblo que salvo está; ¡Salve! guardemos su ley De amor que a los hombres Él da."},{"t":"v","n":"3","x":"¡Salve! Señor, tu poder Su límite nunca vio; ¡Salve! Maestro, doquier En hechos tu amor se mostró."},{"t":"c","x":"Cristo, tu nombre Es prenda de amor y paz; En nuestras almas sólo Tú reinarás."}],"w":1},{"s":"Himnario congregacional","n":"18","t":"¡Santo! ¡Santo! ¡Santo! Tu gloria llena","p":"249–250","c":"Letra y Música: F. González Valle | (18-2) Letra: F. González Valle; Música: Francisco Javier Corona Vázquez (variantes: 18-1, 18-2)","l":[{"t":"c","x":"¡Santo! ¡Santo! ¡Santo! Tu gloria llena cielos y tierra; ¡Hosanna! ¡Hosanna! ¡Gloria a Dios!"},{"t":"v","n":"1","x":"Te bendecimos, te adoramos, Glorificamos tu nombre ¡Oh Dios! ¡Oh Rey del cielo! oye clemente Nuestra ferviente y humilde voz."},{"t":"v","n":"2","x":"No veas del hombre la falta impía, Mira a tu hijo, mi Redentor; Ferviente entonces el alma mía Podrá alabarte con todo amor."},{"t":"v","n":"3","x":"Dignos seamos de bendecirte; El alma limpia de todo mal; Cielos y tierra canten tu nombre, ¡Oh Dios, Oh Padre! ¡Rey celestial!"}]},{"s":"Himnario congregacional","n":"18b","t":"Nada es comparable","p":"251","c":"Letra y Música: Melodía tradicional francesa","l":[{"t":"v","n":"1","x":"Nada es comparable a ti, mi Jesús, nada codiciable como tu favor; Señor adorable te abro el corazón. Nada es comparable a ti, mi Señor."},{"t":"v","n":"2","x":"Cuando te contemplo en tu humillación, todo el ser te ofrezco en adoración; amor sin ejemplo te abro el corazón; Nada es comparable a ti, mi Señor."},{"t":"v","n":"3","x":"Manantial fecundo, fuente de dulzor, inundaste al mundo con tu inmenso amor, bondad sin segundo, te abro el corazón. Nada es comparable a ti, mi Señor."}]},{"s":"Himnario congregacional","n":"19","t":"¡Santo! ¡Santo! ¡Santo!","p":"252","c":"Letra: Juan B. Cabrera; Música: John B. Dykes","l":[{"t":"v","n":"1","x":"¡Santo! ¡Santo! ¡Santo! Señor Omnipotente Siempre el labio mío loores te dará; ¡Santo! ¡Santo! ¡Santo! te adoro reverente, Dios en tres personas, bendita Trinidad."},{"t":"v","n":"2","x":"¡Santo! ¡Santo! ¡Santo! en numeroso coro, Santos escogidos te adoran con fervor, De alegría llenos y sus coronas de oro Rinden ante el trono glorioso del Señor."},{"t":"v","n":"3","x":"¡Santo! ¡Santo! ¡Santo! la inmensa muchedumbre De ángeles que cumplen tu santa voluntad, Ante ti se postra bañada con tu lumbre, Ante ti que has sido, que eres y serás. Amén."},{"t":"v","n":"4","x":"¡Santo! ¡Santo! ¡Santo! por más que estés velado e imposible sea tu gloria contemplar, Santo tú eres sólo, y nada hay a tu lado en poder perfecto, pureza y caridad."},{"t":"v","n":"5","x":"¡Santo! ¡Santo! ¡Santo! la gloria de tu nombre vemos en tus obras, en cielo, tierra y mar; ¡Santo! ¡Santo! ¡Santo! te adorará todo hombre; Dios en tres personas, bendita trinidad."}]},{"s":"Himnario congregacional","n":"20","t":"¡Santo! ¡Santo!¡Señor de los cielos!","p":"253","c":"Letra y Música: Autor desconocido","l":[{"t":"v","n":"1","x":"¡Santo! ¡Santo! ¡Señor de los cielos! ¿Quién podrá definir tu grandeza? ¿Quién decir tu poder dónde empieza, En qué espacio termina tu acción? Para Ti el infinito es un punto, mide el tiempo sus siglos en vano, Y las obras que brota tu mano Las arenas de un piélago son."},{"t":"v","n":"2","x":"¡Santo! ¡Santo! ¡Señor poderoso! Más y más crece en Ti mi confianza Para darte debida alabanza Cada objeto recibe una voz; Su rugir le has dado a los vientos, a las aves su canto sonoro, A los hijos de Adán el tesoro De una lengua que ensalce a su Dios."},{"t":"v","n":"3","x":"¡Salve! ¡Salve! ¡Señor increado! Manantial de perpetua delicia, Cetro eterno de paz y justicia, Fuente y fin de la excelsa virtud. En tu gran creación al insecto más humilde un amparo previenes; Cielos, orbes, publiquen tus bienes ¡Providencia Divina salud!"}]},{"s":"Himnario congregacional","n":"21","t":"Señor Jehová, Omnipotente Dios","p":"254","c":"Letra: Daniel C. Roberts, 1841-1907, Tr. Vicente Mendoza Polanco, 1875-1955; Música: George W. Warren 1828-1902","l":[{"t":"v","n":"1","x":"Señor Jehová, Omnipotente Dios, tú que los astros riges con poder, oye clemente nuestra humilde voz, nuestra canción hoy dígnate atender."},{"t":"v","n":"2","x":"Eterno Padre, nuestro corazón, a ti profesa un inefable amor; hazte presente en tu pueblo hoy; tiéndenos pues, tu brazo protector."},{"t":"v","n":"3","x":"A nuestra patria da tu bendición; enséñanos tus leyes a guardar; alumbra la conciencia y la razón: domina siempre tú en todo hogar."},{"t":"v","n":"4","x":"Defiéndenos del enemigo cruel; concede a nuestras faltas corrección; nuestro servicio sea siempre fiel; rodéanos de tu gran protección."}],"w":1},{"s":"Himnario congregacional","n":"21b","t":"Quiero cantar una linda canción","p":"255","c":"Letra y Música: Desconocido, Edgar Obed Pineda Fierro","l":[{"t":"v","n":"1","x":"Quiero cantar una linda canción de un hombre que me transformó, es mi amigo Jesús es mi amigo más"},{"t":"v","n":"2","x":"Quiero cantar una linda canción de aquel que mi vida cambió,"},{"t":"c","x":"fiel, el es Dios, el es Rey, es amor, y verdad; solo en Él encontré esa paz que busqué solo en Él encontré la felicidad."}],"w":1},{"s":"Himnario congregacional","n":"22","t":"Solemnes resuenen los férvidos cantos","p":"256–257","c":"Letra y Música: John R. Sweney, Buenos Aires.","l":[{"t":"v","n":"1","x":"Solemnes resuenen los férvidos cantos, Unámonos todos en voces de amor, Los ángeles puros, los fieles y santos De Dios, al cordero tributen loor. Coro menso al gran Creador. Canto de triunfo, canto de triunfo, Levántese inmenso al gran Creador."},{"t":"v","n":"2","x":"\"Es digno el Cordero\" los justos exclaman, \"Es digno el Cordero de eterno loor\" Repiten constante aquellos que le aman Al ver que su sangre vertió en su favor. Canto de triunfo, canto de triunfo, Levántese in Levántese inmenso Canto de triunfo, canto de triunfo Levántese inmenso."},{"t":"v","n":"3","x":"Postrados de hinojos, Jesús te adoramos, Pues nos rescataste de eterno dolor; La muerte sufriste porque no muramos; Dignísimo eres del más alto honor. Canto de triunfo, canto de triunfo,"},{"t":"v","n":"4","x":"Los cielos triunfantes, la tierra salvada, Su júbilo muestren; y al Santo Señor, El oro, el incienso, la mirra preciada le ofrezcan con puro, con férvido amor."}],"w":1},{"s":"Himnario congregacional","n":"22b","t":"Te alabaré en medio de la lucha","p":"257","c":"Letra y Música: Desconocido, Arm. Edgar Obed Pineda Fierro","l":[{"t":"v","x":"Te alabaré en medio de la lucha, te alabaré en medio del dolor, te exaltaré hoy en mi juventud y no tenga después que lamentar. Y si acaso en mi flaqueza humana, como Pedro, te llegara a negar, perdón Señor, pues de tu mano franca jamás me soltaré."}]},{"s":"Himnario congregacional","n":"23","t":"Sólo a ti Dios y Señor","p":"258","c":"Letra: Pedro Castro; Música: Easter Hymn, Lyra Davídica, 1708","l":[{"t":"v","n":"1","x":"Sólo a ti, Dios y Señor, Adoramos, adoramos, Y la gloria y el honor Tributamos, tributamos. Sólo a Cristo, nuestra Luz, Acudimos, acudimos; Por su muerte en la cruz Revivimos, revivimos."},{"t":"v","n":"2","x":"Un Espíritu, no más, Nos gobierna, nos gobierna, Y con él, Señor, nos das Paz eterna, paz eterna; Él es fuego celestial, Cuya llama, cuya llama En amor angelical Nos inflama, nos inflama."},{"t":"v","n":"3","x":"Disfrutamos tu favor Solamente, solamente; Por Jesús fuente de amor Permanente, permanente; Sólo él nos libertó De la muerte, de la muerte, Sólo él se declaró Nuestro fuerte, nuestro Fuerte."},{"t":"v","n":"4","x":"Sólo tú, oh Creador, Dios eterno, Dios eterno, Nos libraste del furor Del infierno, del infierno; Y por esto con placer Proclamamos, proclamamos Que tan sólo en tu poder Confiamos, confiamos."}]},{"s":"Himnario congregacional","n":"24","t":"Te loamos, ¡Oh, Dios!","p":"259","c":"Letra: William P. Mackay, 1863. Tr. H. W. Cragin; Música: Revive us again, John J. Husband, c.1820","l":[{"t":"v","n":"1","x":"Te loamos, ¡Oh, Dios! Con unánime voz, Que en Cristo tu Hijo nos diste perdón."},{"t":"v","n":"2","x":"Te loamos, Jesús, Que tu trono de luz Has dejado por darnos Salud en la cruz."},{"t":"v","n":"3","x":"Te damos loor, Santo Consolador, Que nos llenas de gozo y santo valor."},{"t":"v","n":"4","x":"Unidos load, A la gran Trinidad, Que es la fuente de gracia, virtud y verdad."},{"t":"c","x":"¡Aleluya! Te alabamos ¡Cuán grandes es tu amor, ¡Aleluya! Te adoramos, Bendito Señor."}]},{"s":"Himnario congregacional","n":"25","t":"Tiernas canciones alzad al Señor","p":"260–261","c":"Letra: Adam Geibel, Trad. Vicente Mendoza Polanco (1875-1955); Música: Adam Geibel, Arr. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Tiernas canciones alzad al Señor, himnos que lleven del alma la fe, Y hablen muy alto del férvido amor que hay en el pecho del hombre que cree. Vengan trayendo ferviente canción niños y ancianos de Dios al altar, Traigan a Él su corazón, Único don que podrá aceptar. Cielo y tierra canten al Señor de las naciones, Cielo y tierra canten al Señor de las naciones; Y los hombres todos con alegres corazones, Sirvan al Señor que vida y paz siempre les da."},{"t":"v","n":"2","x":"Él es la fuente de toda bondad, Él es la vida, la luz y el calor; Sólo Él nis libra de cruel ansiedad, Sólo Él aleja del alma el dolor; Digno es por tanto, que el hombre le dé Gloria y honor que resuenen doquier; Vamos a Él llenos de fe, Nos salvará con su gran poder. Cielo y tierra canten al Señor Cielo y tierra canten al Señor Y los hombres todos con a alegres corazones, Sirvan al Señor sirvan al Señor"}]},{"s":"Himnario congregacional","n":"26","t":"Alma triste que te siente abatida","p":"262","c":"Letra y Música: Aquiles Mireles Perales, ICIAR","l":[{"t":"v","n":"1","x":"Alma triste que te sientes abatida, Que pesares e inquietudes te circundan, Ven a Cristo que en verdad te da la vida, Pues Él es bueno y su amor es eternal."},{"t":"v","n":"2","x":"Alma triste que de penas estás llena, Que agobiada, con tu carga, desfalleces, Ven a Cristo, te dará su gracia plena, Pues Él es bueno y su amor es eternal."},{"t":"v","n":"3","x":"Alma triste que no tienes esperanza, Que caminas de este mundo en los placeres, Ven a Cristo, El te llama, ten confianza, Pues Él es bueno y su amor es eternal."},{"t":"c","x":"Es Jesús el verdadero amigo que su amor te brinda cada día; Si le aceptas, desde hoy será contigo, En tu senda para siempre te guiará."}]},{"s":"Himnario congregacional","n":"26b","t":"Tengo un amigo, Cristo el Señor","p":"263","c":"Letra: Vicente Mendoza; Música: Robert Harkness","l":[{"t":"v","n":"1","x":"Tengo un Amigo, Cristo el Señor. Yo le bendigo con mi loor, Porque en el mundo nadie como El CORO"},{"t":"v","n":"2","x":"Tengo un Refugio que en el turbión Del alma es siempre fiel protección; Con El seguro yo viviré, Es en mi vida paciente y fiel."},{"t":"v","n":"3","x":"Tengo un Maestro doquier yo voy Y sus senderos siguiendo estoy; En las tinieblas jamás iré, Porque a su amparo caminaré. Cristo, mi Amigo,"},{"t":"v","n":"4","x":"¡Oh, dulce Amigo! tu compasión Ha subyugado mi corazón; Jamás rebelde quiero yo ser, Porque sus luces y amor tendré. Has que obedezca yo tu querer."},{"t":"c","x":"ya tuyo soy; ¡Todo, rendido, contigo voy!"}],"w":1},{"s":"Himnario congregacional","n":"27","t":"Amor tan grande","p":"264–265","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras","l":[{"t":"v","x":"Amor tan grande, profundo y sublime, es el amor de mi Creador. No hay nada en el mundo que pueda igualarse al grande amor de mi Salvador. Dios de amor, Oh Dios de amor, sólo eres tú, el Dios de amor; No hay otro Dios como tú, fuera de ti no lo hay, no hay otro Dios como tú, no lo hay, guarda de todos los males que existen aquí; Por eso cantamos con toda el alma, pues nos ha dado Jesús dulce calma. Dios de amor, Oh Dios de amor, sólo eres tú, El Dios de amor, No hay otro Dios como tú, fuera de ti, no lo hay, No hay otro Dios como tú, no lo hay."}],"w":1},{"s":"Himnario congregacional","n":"28","t":"Cuando estés cansado y abatido","p":"266","c":"Letra: Jeremiah E. Rankin, 1988; Música: Edmund S. Lorenz, 1988","l":[{"t":"v","n":"1","x":"Cuando estés cansado y abatido, Dílo a Cristo, Dílo a Cristo;"},{"t":"v","n":"2","x":"Cuando estés de tentación cercado, Mira a Cristo, Mira a Cristo;"},{"t":"v","n":"3","x":"Si se apartan otros de la senda, Sigue a Cristo, sigue a Cristo;"},{"t":"v","n":"4","x":"Cuando llegue la final jornada, Fía en Cristo, fía en Cristo;"},{"t":"c","x":"Si te sientes débil, agobiado, Dilo a Cristo el Señor. Dilo a Cristo, Dilo a Cristo, él es tu amigo más fiel; No hay otro amigo como Cristo, Dilo tan sólo a él.\nCuando rujan huestes de pecado, Mira a Cristo el Señor. Mira a Cristo, Mira a Cristo, él es tu amigo más fiel; No hay otro amigo como Cristo, Mira tan sólo a él.\nSi acrecienta en torno la contienda, Sigue a Cristo el Señor. Sigue a Cristo, Sigue a Cristo, él es tu amigo más fiel; No hay otro amigo como Cristo, Sigue tan sólo a él.\nTe dará en el cielo franca entrada, Fía en Cristo el Señor. Fía en Cristo, fía en Cristo, él es tu amigo más fiel; No hay otro amigo como Cristo, Fía tan sólo en él."}],"w":1},{"s":"Himnario congregacional","n":"29","t":"En oscuridad sin Jesús me vi","p":"267","c":"Letra: H. C. Ball; Música: B. B. McKinney","l":[{"t":"v","n":"1","x":"En oscuridad sin Jesús me vi, Con mil penas y gran dolor; Mas Jesús me dijo: \"Oh, ven a mí, Quiero ser tu salvador\"."},{"t":"v","n":"2","x":"Por las grandes olas de la maldad Yo llevado fui más y más; Sin tener piloto en la tempestad, Hasta ver al buen Jesús."},{"t":"v","n":"3","x":"¿En la ruda lid combatido estás, Sin amigo y sin solaz? ¡Oh, no lloras más, sino ve la faz, Del amigo que es Jesús!"},{"t":"c","x":"En mi alma hay dulce paz, Desde que vine a Jesús; No hay noche nunca sino gozo y paz, Desde que vivo en su luz.\ndulce paz a Jesús; noche nunca sino gozo y paz, Desde que vivo en su luz."}],"w":1},{"s":"Himnario congregacional","n":"30","t":"Es Jesucristo mi amigo mejor","p":"268","c":"Letra y Música: Vicente Mendoza Polanco (1875-1955)","l":[{"t":"v","n":"1","x":"Es Jesucristo mi amigo mejor, Tierno y amante cual otro no habrá; Toda mi vida descansa en su amor, Tan sólo en Él segura estará."},{"t":"v","n":"2","x":"Él en mis pruebas desciende hasta mí, Y hace en mi pecho la dicha nacer; Nunca por El olvidado me vi, Nunca faltó su amor en mi ser."},{"t":"v","n":"3","x":"Él en mis dudas me inunda de luz, Y hallo el sendero que debo seguir; Todo en mi vida lo debo a Jesús, Sólo por Él yo puedo vivir."},{"t":"v","n":"4","x":"Él me conduce cual tierno Pastor, Lleva mi vida por sendas de paz; Él me rescata de todo temor Dándome el gozo de ver su faz."},{"t":"c","x":"¡Oh, dulce Amigo! cerca de Ti Mi senda quiero firme seguir, Sentir yo quiero que mora en mí Tu santa gracia para vivir."}]},{"s":"Himnario congregacional","n":"31","t":"Es Jesús el mejor amigo","p":"269","c":"Letra y Música: P. P. Bilho, Arm. Isaac García Contreras","l":[{"t":"c","x":"1. Es Jesús el mejor amigo, Cuando triste o tentado estés, Colmará de bendición Tu transido corazón. migo! ¡Es Jesús el mejor amigo! ¡Es Jesús el mejor amigo! El tus suplicas oirá, Y tu carga llevará; ¡Es Jesús el mejor amigo!\n2. En Jesús fiel amigo encuentro, Paz perfecta a mi alma da; Apoyado en él estoy, Sin temor mi ser le doy. ¡Es Jesús el mejor amigo! ¡Es Jesús el mejor amigo! ¡Es Jesús el mejor amigo! El tus suplicas oirá, Y tu carga llevará; ¡Es Jesús el mejor amigo!\n3. Cuando ande en algún peligro, O en sombra de la muerte esté, Ningún mal me alcanzará Pues Jesús me amparará. migo! ¡Es Jesús el mejor amigo! ¡Es Jesús el mejor amigo! El tus suplicas oirá, Y tu carga llevará; ¡Es Jesús el mejor amigo!\n4. Cuando estemos al fin reunidos Con los redimidos más allá, Cantaremos con fervor En presencia del Señor. migo! ¡Es Jesús el mejor amigo! ¡Es Jesús el mejor amigo! El tus suplicas oirá, Y tu carga llevará; ¡Es Jesús el mejor amigo!"}],"w":1},{"s":"Himnario congregacional","n":"32","t":"Hallé un buen amigo","p":"270","c":"Letra: Charles W. Fry, Trad. Enrique Turrall; Música: Williams S. Hays","l":[{"t":"v","n":"1","x":"Hallé un buen amigo, mi amado Salvador, Contaré lo que El ha hecho para mí; Hallandome perdido e indigno pecador, Me salvó y hoy me guarda para sí. Me salva del pecado, me guarda de Satán, Me promete estar conmigo hasta el fin; (¡Aleluya!) Consuela mi tristeza, me quita todo afán: ¡Grandes cosas Cristo ha hecho para mí!"},{"t":"v","n":"2","x":"Jesús jamás me falta, jamás me dejará, Es mi fuerte y poderoso protector; Del mundo me separo y de la vanidad, Para consagrar mi vida al Señor. Si el mundo me persigue, si sufro tentación, esperando en Cristo puedo resistir; (¡Aleluya!) La victoria es segura, elevo mi canción: ¡Grandes cosas Cristo ha hecho para mí!"},{"t":"v","n":"3","x":"Yo sé que Jesucristo muy pronto volverá, Y entre tanto me prepara un hogar En la casa de mi Padre, Mansión de luz y paz Do el creyente fiel con el ha de morar; Llegando yo a la gloria, ningún pesar tendré, Y contemplaré su rostro siempre allí; (¡Aleluya!) Con los santos redimidos gozoso cantaré: ¡Grandes cosas Cristo ha hecho para mí!"}]},{"s":"Himnario congregacional","n":"33","t":"Jesús, mi amigo es para mí","p":"271","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Jesús, mi Amigo, es para mí Perfecta paz y salvación; Será lo mismo para ti, El te brinda plena salva Coro"},{"t":"v","n":"2","x":"Por largo tiempo resistí La dulce voz de mi Señor; Mas El me dijo: \"ven a mí; Soy tu Amigo, pobre pecación."},{"t":"v","n":"3","x":"A su llamado acudí, A El le dí mi corazón; Mi vida a sus pies rendí, A mi Amigo elevo mi candor\". Yo sé que Cristo me salvó, Por mí su vida dio en la"},{"t":"v","n":"4","x":"¡Oh dulce Amigo, vengo a Ti, jamás tu senda dejaré; Mi anhelo es serte fiel aquí, Tu presencia pronto gozación. ré!"},{"t":"c","x":"cruz; Mi senda circundó de luz. ¡Es Amigo que jamás cambió!"}],"w":1},{"s":"Himnario congregacional","n":"34","t":"Oh Cristo mío, eres tú mi amigo fiel","p":"272","c":"Letra: Fanny J. Crosby, Trad. Isabel P. Balderas; Música: Melodía española, Arr. H.P. Main","l":[{"t":"v","n":"1","x":"¡Oh! Cristo mío, Eres tú mi amigo fiel; Seguro amparo Sólo en ti tendré, En mis aflicciones, Buen Jesús, iré a ti, Y consuelo y dicha Me darás ¡Oh! sí. CORO D A D"},{"t":"v","n":"2","x":"Cuando en la noche, Vea yo estrellas mil, Tu voz hermosa Pueda mi alma oír. Haz que yo medite En tu tierno y dulce amor, Y que yo te alabe Lleno de fervor. Cristo, ven más cerca; Paz perfecta en mi alma pon;"},{"t":"v","n":"3","x":"Cuando esta vida Tenga yo que abandonar, Corona hermosa Tú me ceñirás; Y con dulce canto Tu bondad alabaré, Y en mansión de gloria Siempre moraré."},{"t":"c","x":"Cerca, sí, más cerca, De mi corazón."}],"w":1},{"s":"Himnario congregacional","n":"35","t":"¡Oh que amigo nos es Cristo!","p":"273","c":"Letra: Joseph Scriven, 1855, Trad. Leandro Garza Mora; Música: Charles C. Converse","l":[{"t":"v","n":"1","x":"¡Oh, que amigo nos es Cristo! El llevó nuestro dolor, Y nos manda que llevemos Todo a Dios en oración. ¿Vive el hombre desprovisto De paz, gozo y santo amor? Esto es porque no llevamos Todo a Dios en oración."},{"t":"v","n":"2","x":"¿Vives débil y cargado De cuidados y temor? A Jesús, refugio eterno, Dile todo en oración. ¿Te desprecian tus amigos? Cuéntaselo en oración; En sus brazos de amor tierno Paz tendrá tu corazón."},{"t":"v","n":"3","x":"Jesucristo es nuestro amigo, De esto pruebas nos mostró Al sufrir el cruel castigo Que el culpable mereció. Y su pueblo redimido Hallará seguridad Fiando en este amigo eterno Y esperando en su bondad."}]},{"s":"Himnario congregacional","n":"36","t":"Por senderos oscuros","p":"274","c":"Letra y Música: Autor desconocido, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Por senderos oscuros triste andaba yo mientras que una luz me alumbraba mi corazón exclamó:"},{"t":"v","n":"2","x":"Alegre voy caminando con mi Salvador sabiendo que pronto llego a la mansión de luz."},{"t":"c","x":"Toma por favor mi mano Señor, contigo quiero ir, con sangre aquí, pagaste por mí, Te quiero hoy servir Anhelo poder lo malo vencer y en santidad vivir. Toma por favor, mi mano Señor, contigo quiero ir."}]},{"s":"Himnario congregacional","n":"36b","t":"¡Oh! amor que no me dejarás","p":"275","c":"Letra y Música: Gordon Young","l":[{"t":"v","n":"1","x":"¡Oh! amor que no me dejarás, descansa mi alma siempre en ti; es tuya y tú la guardarás, y en lo profundo de tu amor más rica al fin será, más rica al fin será."},{"t":"v","n":"2","x":"¡Oh! luz que en mi sendero vas, mi antorcha débil rindo a ti; su luz apaga el corazón, Seguro de encontrar en ti más bello resplandor, más bello resplandor."},{"t":"v","n":"3","x":"¡Oh! gozo que a buscarme a mí viniste con mortal dolor. tras la tormenta el arco vi, y ya el mañana ya lo sé. Sin lágrimas será, sin lágrimas será."},{"t":"v","n":"4","x":"¡Oh! cruz que miro sin cesar, mi orgullo, gloria y vanidad al polvo dejo, por hallar la vida que en su sangre dio Jesús, mi Salvador, Jesús mi Salvador."}]},{"s":"Himnario congregacional","n":"37","t":"Yo vivo feliz con mi Cristo","p":"276–277","c":"Letra y Música: Guadalupe Velasco, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Yo vivo feliz con mi Cristo, apasionado de Jesús estoy, porque en su amor infinito, él mis culpas ya perdonó, su gracia divina ha llenado de gozo mi corazón. Tú eres amor y contigo Jesús estoy."},{"t":"v","n":"2","x":"Te tengo abrazado tan fuerte, que nadie me podrá apartar; y si la muerte me sorprende, mi vivir en Jesús está. Yo sólo en ti vivo seguro de peligros, de todo mal. Tú eres amor y contigo Jesús estoy."},{"t":"c","x":"Trabé de Jesús; no te dejo, no te dejo, nunca te dejaré, hasta saciar de tu amor todo mi ser. Yo vivo feliz porque en mi vida permaneces fiel. Trabé de ti; no te dejo, no te dejaré."}]},{"s":"Himnario congregacional","n":"37b","t":"Aquí estoy, Señor","p":"277","c":"Letra y Música: Daniel L. Shutte, 1981","l":[{"t":"v","n":"1","x":"Yo el Señor del cielo y mar, a mi pueblo oí llorar; los que viven en mal dad, yo los salvaré."},{"t":"v","n":"2","x":"Yo el creador de estrellas mil, luz traeré a su vivir; ¿quién la luz les Yo el Señor de tempestad, he sentido el dolor; de mi pueblo y llevará, su pasión, y aun me niegan hoy. ¿Con quién la enviaré?"},{"t":"v","n":"3","x":"Cambiaré su corazón, lleno de amor será; mi palabra Yo el Señor del viento y luz, a los pobres sanaré; un banquete las traeré, les daré, y los amaré."},{"t":"v","n":"4","x":"El más fino pan les doy, y a su lado siempre estoy; yo mi vida les daré."},{"t":"c","x":"Aquí estoy, Señor, soy tu siervo, he escuchado tu voz al despertar. Yo iré, Señor, si me guías; serviré a tu pueblo con amor."}],"w":1},{"s":"Himnario congregacional","n":"38","t":"Un fiel amigo hallé","p":"278","c":"Letra: S.T. Edmund; Música: Arthur S. Sullivan","l":[{"t":"v","n":"1","x":"Un fiel amigo hallé: Mi buen Jesús, Su amor no perderé; Mi buen Jesús, Si amigos y solaz Aquí no encuentro más. Me ofrece eterna paz Mi buen Jesús."},{"t":"v","n":"2","x":"Dichoso yo seré, Mi buen Jesús, Tú sostendrás mi fe, Mi buen Jesús, Tú me socorrerás, Tu brazo cerca está; Tu graciame darás, Mi buen Jesús."},{"t":"v","n":"3","x":"Su propia vida dio, Mi buen Jesús, Pues en la cruz murió, Mi buen Jesús, Y yo salvado fui, Dióme su plena luz, te salvará a ti Mi buen Jesús."},{"t":"v","n":"4","x":"El mundo pasará, Mi buen Jesús, Mas al final vendrá, Mi buen Jesús, ¡Oh que placer sin par! será tu faz mirar, Tu gloria celebrar, Mi buen Jesús."}]},{"s":"Himnario congregacional","n":"39","t":"Mi Jesús ascendió","p":"279","c":"8ª; Letra y Música: Autor Desconocido, Arr. L. Domínguez","l":[{"t":"v","n":"1","x":"Mi Jesús ascendió a morar a la patria que fue a preparar, sentado a la diestra él está del Padre por la eternidad."},{"t":"v","n":"2","x":"Tú hiciste a los cojos andar, los sordos pudieron oír, los mudos pudieron hablar, diste vista a los ciegos también."},{"t":"v","n":"3","x":"Tú eres la fuente de amor, prometiste que estando tú allí, enviarías al consolador a morar con nosotros aquí."},{"t":"v","n":"4","x":"Hoy te damos las gracias, Señor, por la grande conmiseración, pues tú eres quien salvas aquí, y el que da a las almas perdón."},{"t":"c","x":"Cristo ascendió para reinar; ¡Con los ángeles está intercediendo por nosotros desde allá! ha de venir aquí a levantar su grey para morar allá con Él."}]},{"s":"Himnario congregacional","n":"40","t":"Oh Cordero Celestial","p":"280","c":"Letra y Música: Elam Ives Jr.","l":[{"t":"v","n":"1","x":"¡Oh, Cordero Celestial! Por mí muerto en la cruz, Paz, perdón, vida eternal En Ti hallo, mi Jesús. Compadécete de mí Ayudandome a creer; Humillado vengo a Ti, Lléname con tu poder."},{"t":"v","n":"2","x":"Ningún mérito hay en mí, Por tu cruz sólo hay salud, Mi esperanza alienta en Ti, Vísteme de tu virtud. Yo bien sé que sólo en Ti Hallo fortaleza y fe; Vuelve tu mirada a mí, Sólo en Ti yo confiaré."},{"t":"v","n":"3","x":"Aunque llore sin cesar Es el llanto sin valor, Solamente en Ti confiar vale para el pecador. Límpiame de todo mal, Sólo espero yo en Ti; ¡Oh, Cordero Celestial, Eres todo para mí!"}]},{"s":"Himnario congregacional","n":"41","t":"Si del pecado anhelas el perdón","p":"281","c":"Letra: H. G. Jackson; Música: James M. Black","l":[{"t":"v","n":"1","x":"Si del pecado anhelas el perdón, ¡Mira al Cordero de Dios!"},{"t":"v","n":"2","x":"En tentaciones, dudas y temor, ¡Mira al Cordero de Dios!"},{"t":"v","n":"3","x":"Si estás tú triste y falto de valor, ¡Mira al Cordero de Dios!"},{"t":"v","n":"4","x":"Si el enemigo hiere con afán, ¡Mira al Cordero de Dios!"},{"t":"c","x":"El con su muerte trajo redención, ¡Mira al Cordero de Dios! ¡Mira al Cordero de Dios! ¡Mira al Cordero de Dios! El solamente puede salvarte, ¡Mira al Cordero de Dios!\nEl con su fuerza te hará vencedor, ¡Mira al Cordero de Dios! ¡Mira al Cordero de Dios! ¡Mira al Cordero de Dios! El solamente puede salvarte, ¡Mira al Cordero de Dios!\nTu alma de gozo llenará su amor, ¡Mira al Cordero de Dios! ¡Mira al Cordero de Dios! ¡Mira al Cordero de Dios! El solamente puede salvarte, ¡Mira al Cordero de Dios!\nSiempre en las pruebas El te amparará, ¡Mira al Cordero de Dios! ¡Mira al Cordero de Dios! ¡Mira al Cordero de Dios! El solamente puede salvarte, ¡Mira al Cordero de Dios!"}],"w":1},{"s":"Himnario congregacional","n":"42","t":"En el monte calvario estaba una cruz","p":"282","c":"Letra: S. D. Athans; Música: Rev. Geo Bernard","l":[{"t":"v","n":"1","x":"En el monte Calvario estaba una cruz, emblema de afrenta y dolor, y en ella murió mi bendito Jesús por salvar al más vil pecador. siempre amaré a Jesús en sus triunfos mi gloria será; Y algún día en vez de una cruz mi corona Jesús me dará."},{"t":"v","n":"2","x":"Aunque el mundo desprecie el poder de Jesús, para mí tiene suma atracción; pues con el evito el Cordero de Dios de mi alma la condenación. ¡Oh! yo amaré a Jesús de una cruz"},{"t":"v","n":"3","x":"En la cruz que Jesús con su cuerpo trazó, hermosura contemplo sin par; con los brazos abiertos a él me llamó y mi ser pudo santificar."},{"t":"v","n":"4","x":"Yo seré siempre fiel a mi Cristo Jesús, sus desprecios con él llevaré; y en un día feliz con los santos en luz para siempre su gloria veré."}],"w":1},{"s":"Himnario congregacional","n":"42b","t":"Cabeza ensangrentada","p":"283","c":"Letra: Ascrito a Bernard de Clairvaux, Tr. George. P. Simmonds; Música: Hans Leo Hassler, Arm. J. S. Bach","l":[{"t":"v","n":"1","x":"Cabeza ensangrentada, herida por mi bien, de es pinas coronada, por fe mis ojos ven; de todos despreciada, mi eterno bien será; por todas las edades mi ser te adorará."},{"t":"v","n":"2","x":"Pues oprimida tu alma fue por el pecador, la transgresión fue mía, mas tuyo fue el dolor; hoy vengo contristado, merezco tu dolor, concédeme tu gracia, Oh, dame tu favor."},{"t":"v","n":"3","x":"Oh, cuánto gozo encuentro en este mundo aquí cuando en tu cuerpo herido me escondo Cristo en ti; Oh Salvador tu gloria hoy manifiesta en mí, junto a tu cruz espero, te entrego mi alma a ti."},{"t":"v","n":"4","x":"Te doy loor eterno, bendito Salvador, por tu dolor y muerte, por tu divino amor; Oh Salvador, deseo tu gracia conocer; junto a tu cruz espero, te entrego a ti mi ser."},{"t":"v","n":"5","x":"En la hora de la muerte enseñame tu cruz; de todos mis temores, Oh líbrame, Jesús; por fe verán mis ojos a Cristo el Salvador; quien muere en ti creyendo es salvo por tu amor."}]},{"s":"Himnario congregacional","n":"43","t":"En la Cruz del Calvario","p":"284–285","c":"Letra: Est. 1 y 3 Francisco Sánchez Muñíz, Est. 2 Aquiles Mireles Perales; Música: Francisco Sánchez Muñíz, ICIAR","l":[{"t":"v","n":"1","x":"En la cruz del Calvario fue muerto mi Señor, La Rosa de Sarón se deshojó; De los valles el Lirio su aroma perdió, Del Buen Pastor su cayado rodó."},{"t":"v","n":"2","x":"Inocente Cordero con toda humildad Mi maldad con su sangre él borró; Desde entonces cambió mi ser, por su bondad, Felicidad para siempre me dio."},{"t":"v","n":"3","x":"Mas ahora al andar del crucificado en pos, Esplendente la Rosa resurgió; De los valles el Lirio perfuma mi ser, Seguridad su cayado me da."},{"t":"c","x":"Fue tan solo por mí, Señor bendito, Por pagar lo que mi culpa mereció; Grande precio de amor diste por tu bondad, Señor Jesús, fue tan sólo por mí."}]},{"s":"Himnario congregacional","n":"44","t":"En medio de mortal dolor","p":"286","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: Edwin O. Excell","l":[{"t":"v","n":"1","x":"En medio de mortal dolor la cruenta cruz yo vi; y allí raudal de gracia hallé bastante para mí."},{"t":"v","n":"2","x":"Sufriendo fue mi corazón y apenas pude allí creer que gracia había de hallar; bastante para mí. para mí."},{"t":"v","n":"3","x":"Cuando en la cruz clavadas ya mis culpas yo sentí, raudal de gracia a mi alma entró; bastante para mí."},{"t":"v","n":"4","x":"Cuando en el cielo con Jesús alegra cante allí, diré que aquella gracia fue bastante para mí."},{"t":"c","x":"En la cruz fluye sin cesar, insondable cual es el mar, esa gracia que brota allí basta para mí.\nEn la cruz fluye sin cesar, cesar, insondable cual es el mar, el mar, esa gracia que brota allí, basta para mí, basta para mí."}],"w":1},{"s":"Himnario congregacional","n":"45","t":"En una cruz de cruel dolor","p":"287","c":"Letra y Música: Charles H. Gabriel, Trad. Eleazar Z. Pérez","l":[{"t":"v","n":"1","x":"En una cruz de cruel dolor Pendiente a Cristo contem"},{"t":"v","n":"2","x":"Tú me miraste, buen Señor, Ardiendo en santa compa"},{"t":"v","n":"3","x":"Perdido anduve en mal y error, Del dulce hogar errante"},{"t":"v","n":"4","x":"No más rebelde, mi Señor, Ni vil esclavo habré de"},{"t":"c","x":"plé; Perdido entonces me miré, ¡Divino amor! ¡Divino amor! tó; Tuyo será mi corazón, ¡Divino amor! ¡Divino amor!\nsión; Tu acento fue de salvación, ¡Divino amor! ¡Divino amor! ¡Divino amor! ¡Divino amor! Tu gran poder me conquistó; Tuyo será mi corazón, ¡Divino amor! ¡Divino amor!\nfui; Tu gran amor fue en pos de mí, ¡Divino amor! ¡Divino amor! tó; Tuyo será mi corazón, ¡Divino amor! ¡Divino amor!\nser; Acógeme en tu gran poder, ¡Divino amor! ¡Divino amor! tó; Tuyo será mi corazón, ¡Divino amor! ¡Divino amor!"}],"w":1},{"s":"Himnario congregacional","n":"46","t":"En una dura cruz","p":"288","c":"","l":[{"t":"v","n":"1","x":"En una dura cruz sufrió Jesús allí, murió por ti y por mí, por darnos plena luz."},{"t":"v","n":"2","x":"La sangre de Jesús nos da la salvación; su refulgente luz dará a tu corazón."},{"t":"v","n":"3","x":"Acércate al altar, allí está Jesús; te quiere perdonar, llenarte con su luz."},{"t":"v","n":"4","x":"Acepta el perdón que hoy él te dará, rinde tu corazón, tus manchas lavará."},{"t":"c","x":"Ven a la luz, ven a la luz, Jesús te espera, ven a la luz, ven a la luz, ven a la luz, Jesús te espera, ven a la luz."}]},{"s":"Himnario congregacional","n":"47","t":"Fuiste Clavado en la Cruz","p":"288–289","c":"Letra y Música: Autor desconocido; Letra y Música: Compositor desconocido, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Fuiste clavado en la cruz Por causa de mi pecar,"},{"t":"v","n":"2","x":"Tú sufriste cruel penar Por tan grande pecador,"},{"t":"v","n":"3","x":"Con tu refulgente luz, Glorioso al resucitar"},{"t":"v","n":"4","x":"Cuando vengas otra vez Con tus ángeles de luz,"},{"t":"c","x":"Y por eso mi Jesús, Vengo humilde al altar. Por mis falta humillado Hoy imploro tu perdón; Tú que borras el pecado Dame plena salvación. Yo no tengo qué ofrecerte Por este precioso don, Pero humilde vengo a darte Mi contrito corazón, Mi contrito corazón.\nPor venirme a salvar Tú sentiste gran dolor. Por mis falta humillado Hoy imploro tu perdón; Tú que borras el pecado Dame plena salvación. Yo no tengo qué ofrecerte Por este precioso don, Pero humilde vengo a darte Mi contrito corazón, Mi contrito corazón.\nNos legaste ¡Oh, Jesús! Perfecta Vida Eternal. Por mis falta humillado Hoy imploro tu perdón; Tú que borras el pecado Dame plena salvación. Yo no tengo qué ofrecerte Por este precioso don, Pero humilde vengo a darte Mi contrito corazón, Mi contrito corazón.\nEstaré allí a tus pies Por tu muerte en la cruz. Por mis falta humillado Hoy imploro tu perdón; Tú que borras el pecado Dame plena salvación. Yo no tengo qué ofrecerte Por este precioso don, Pero humilde vengo a darte Mi contrito corazón, Mi contrito corazón."}],"w":1},{"s":"Himnario congregacional","n":"48","t":"Cristo tan sólo pudo amarme","p":"290","c":"Letra y Música: Norman J. Clayton, 1943, Trad. Honorato Reza","l":[{"t":"v","n":"1","x":"Cristo tan sólo pudo amarme, nada podrá de él separarme,"},{"t":"v","n":"2","x":"Antes vivía en el pecado, mi corazón de Dios alejado;"},{"t":"v","n":"3","x":"Mi ser rebosa de pleno gozo, Dios me liberta, me da reposo,"},{"t":"c","x":"pues con su sangre me redimió, ahora soy de él. Ahora soy de Cristo, mío también es él; puedo gozar de su amistad por la eternidad.\nmas mi vergüenza él me quitó, ya pertenezco a él. Ahora soy de Cristo, mío también es él; puedo gozar de su amistad por la eternidad.\npues con su sangre me redimió: ahora soy de él. Ahora soy de Cristo, mío también es él; puedo gozar de su amistad por la eternidad."}],"w":1},{"s":"Himnario congregacional","n":"49","t":"Al clavario sólo Jesús ascendió","p":"291","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: Charles H. Gabriel","l":[{"t":"v","n":"1","x":"Al calvario Sólo Jesús ascendió llevando pesada cruz, y al morir en ella al mortal dejó un fanal de gloriosa luz."},{"t":"v","n":"2","x":"En Jesús el alma tan sólo hallará la fuente de inspiración; inefable don que sólo obtendrás si le buscas en oración."},{"t":"v","n":"3","x":"Yo por él ya voy a mi hogar celestial, el rumbo marcado está; en mi oscura vida será el fanal y en su luz mi alma siempre irá."},{"t":"c","x":"Jesucristo me guiará, Jesucristo me guiará; Al hogar de paz y de eterno amor, Jesús sólo me guiará.\nguiará, guiará;"}],"w":1},{"s":"Himnario congregacional","n":"50","t":"Alabado el gran manantial","p":"292–293","c":"Letra: Thomás Martin Westrup, S.XIX; Música: Henry Southwick Perkins, S. XIX","l":[{"t":"v","n":"1","x":"Alabado el gran manantial que de sangre Dios nos mostró; Alabado el Rey que murió, su pasión nos libra del mal. Lejos del redil de mi dueño vime misero, pequeño, vil, El Cordero sangre vertió, me limpia sólo este raudal."},{"t":"v","n":"2","x":"La punzante insignia llevó en la cruz dejó de vivir; Grandes males quiso sufrir, no en vano, empero sufrió. Al gran manantial conducido, Que de mi maldad ha sido fin, \"Lavame\", le pude decir, y nívea blancura me dio."},{"t":"v","n":"3","x":"Padre, de ti lejos vagué, extravióse mi corazón; Como grana mis culpas son, no con agua limpio seré. A tu fuente magna acudí tu promesa creo, Oh Jesús; La eficaz virtud de tu don la nívea blancura me dé."},{"t":"c","x":"Sé que sólo así emblanqueceré, Láveme en su sangre Jesús y nívea blancura me dé.\nSé que sólo así emblanqueceré Sé que sólo así emblan.queceré, mi Jesús"}],"w":1},{"s":"Himnario congregacional","n":"51","t":"Comprado con sangre por Cristo","p":"294","c":"Letra: Fanny Jane Crosby; Música: William James Kirkpatrick","l":[{"t":"v","n":"1","x":"Comprado con sangre por Cristo con gozo al cielo yo voy; librado por gracia infinita ya sé que su hijo yo soy."},{"t":"v","n":"2","x":"Soy libre de pena y culpa, su gozo él me hace sentir; él llena de gracia mi alma, con él es tan dulce vivir."},{"t":"v","n":"3","x":"En Cristo yo siempre medito y nunca lo puedo olvidar; callar sus favores no quiero, voy siempre a Jesús a alabar."},{"t":"v","n":"4","x":"Seguro sé que la belleza del gran Rey yo voy a mirar; ahora me guarda y me guía y siempre me quiere ayudar."},{"t":"v","n":"5","x":"Yo sé que me espera corona, la cual a los fieles dará Jesús, Salvador; en el cielo mi alma con él estará."},{"t":"c","x":"Lo sé, lo sé, comprado con sangre yo soy, lo sé, lo sé, con Cristo al cielo yo voy."}]},{"s":"Himnario congregacional","n":"52","t":"Dulces momentos consoladores","p":"295","c":"Letra: Juan B. Cabrera; Música: Samuel Webbe","l":[{"t":"v","n":"1","x":"¡Dulces momentos consoladores, lo que me paso junto a la cruz! Allí sufriendo crueles dolores miro al Cordero, Cristo Jesús."},{"t":"v","n":"2","x":"Miro sus brazos de amor abiertos que me convidan a ir a él; Y haciendo suyos mis desaciertos, por mí sus labios gustan la hiel."},{"t":"v","n":"3","x":"De sus heridas la viva fuente de pura sangre veo manar; Y salpicando mi impura frente, la infame culpa logra borrar."},{"t":"v","n":"4","x":"Miro su angustia ya terminada, hecha la ofrenda de la expiación; Su noble frente, mustia, inclinada, y consumada mi redención."},{"t":"v","n":"5","x":"¡Dulces momentos, ricos en dones, de paz y gracia, de vida y luz; Sólo hay consuelo y bendiciones cerca de Cristo, junto ala cruz."}]},{"s":"Himnario congregacional","n":"53","t":"¿Has hallado en Cristo plena salvación?","p":"296","c":"Letra: H. W. Cragin; Música: Rev. Elisha A. Hoffman","l":[{"t":"v","n":"1","x":"¿Has hallado en Cristo plena salvación por la sangre vertida en la cruz? Toda mancha lava de tu corazón ¿Eres limpio en la sangre eficaz?"},{"t":"v","n":"2","x":"¿Vives siempre al lado de tu salvador por la sangre que él derramó? ¿Del pecado eres siempre vencedor? ¿Eres limpio en la sangre eficaz?"},{"t":"v","n":"3","x":"¿Tendrás ropas blancas al venir Jesús? ¿eres limpio en la fuente de amor? ¿Estás liso para la mansión de luz? ¿Eres limpio en la sangre eficaz?"},{"t":"v","n":"4","x":"Cristo ofrece hoy pureza y poder, ¡Oh, acude a la cruz del Señor! Es la fuente Él que limpiará tu ser, ¡Oh, acude a su sangre eficaz?"},{"t":"c","x":"¿Eres limpio en la sangre, en la sangre de Cristo Jesús? ¿Es tu corazón más blanco que la nieve? ¿Eres limpio en la sangre eficaz?\n¿Eres limpio en la sangre de Jesús?"}],"w":1},{"s":"Himnario congregacional","n":"54","t":"Hay un precioso manantial","p":"297","c":"Letra: William Cowper, trad. M. N. Hutchinson; Música: Melidía americana, arreg. Lowell Mason, 1830","l":[{"t":"v","n":"1","x":"Hay un precioso manantial, manantial, manantial, hay un precioso manantial de sangre del Señor; Que purifica a todo aquel, a todo aquel, a todo aquel, que purifica a todo aquel que se sumerge en él."},{"t":"v","n":"2","x":"El malhechor se convirtió, se convirtió, se convirtió, el malhechor se convirtió pendiente de una cruz; Él vio la fuente y se lavó, y se lavó y se lavó, él vio la fuente y se lavó creyendo en Jesús."},{"t":"v","n":"3","x":"Y yo también mi pobre ser, mi pobre ser, mi pobre ser, y yo también mi pobre ser allí logré lavar; La gloria de su gran poder, su gran poder, su gran poder, la gloria de su gran poder me gozo en ensalzar."},{"t":"c","x":"¡Oh célica fuente, fuente carmesí en la que un día yo lavado fui!"}],"w":1},{"s":"Himnario congregacional","n":"55","t":"Junto a la cruz do Jesús murió","p":"298","c":"Letra: Elisha A. Hoffman, Trad. Vicente Mendoza Polanco (1875-1955); Música: John H. Stockton","l":[{"t":"v","n":"1","x":"Junto a la cruz do Jesús murió, junto a la cruz do salud pedí,"},{"t":"v","n":"2","x":"Junto a la cruz donde le busqué, ¡cuán admirable perdón me dio!"},{"t":"v","n":"3","x":"Fuente preciosa de salvación, que grande gozo yo pude hallar,"},{"t":"v","n":"4","x":"Tú, pecador que perdido estás, hoy esta fuente ven a buscar,"},{"t":"c","x":"Ya mis maldades Él perdonó, ¡A su nombre gloria! ¡A su nombre gloria! ¡A su nombre gloria! Ya mis maldades Él perdonó, ¡A su nombre gloria!\nYa con Jesús siempre viviré, ¡A su nombre gloria! ¡A su nombre gloria! ¡A su nombre gloria! Ya mis maldades Él perdonó, ¡A su nombre gloria!\nAl encontrar en Jesús perdón, ¡A su nombre gloria! ¡A su nombre gloria! ¡A su nombre gloria! Ya mis maldades Él perdonó, ¡A su nombre gloria!\npaz y perdón encontrar podrás, ¡A su nombre gloria! ¡A su nombre gloria! ¡A su nombre gloria! Ya mis maldades Él perdonó, ¡A su nombre gloria!"}],"w":1},{"s":"Himnario congregacional","n":"56","t":"Me hirió el pecado fui a Jesús","p":"299","c":"Letra: Isaac Watts, Trad. Pedro Grado; Música: Ralph E. Hudson","l":[{"t":"v","n":"1","x":"Me hirió el pecado, fui a Jesús, mostrele mi dolor; perdido, errante, vi su luz, bendíjome en su amor."},{"t":"v","n":"2","x":"En una cruz mi buen Señor su sangre derramó por este pobre pecador a quien así salvó."},{"t":"v","n":"3","x":"Venció a la muerte con poder y el Padre lo exaltó, confiar en Él es mi placer, morir no temo yo."},{"t":"v","n":"4","x":"Aunque Él se fue conmigo está el gran Consolador Por Él entrada tengo ya al Reino Celestial."},{"t":"c","x":"En la cruz, en la cruz, do primero vi la luz, y las manchas de mi alma yo lavé; Fue allí por la fe do vi a Jesús, y siempre feliz por el seré. (o bien: yo lavé;)"}],"w":1},{"s":"Himnario congregacional","n":"57","t":"¡Oh! Que gozo siento yo en mi corazón","p":"300","c":"Letra: H. C. Ball; Música: J. Edwin Mc Connell","l":[{"t":"v","n":"1","x":"¡Oh! que gozo yo siento en mi corazón no hay más oscuridad! en Jesús he hallado gran bendición, borró ya mi maldad."},{"t":"v","n":"2","x":"Alabad al Señor nuestro Redentor, su gloria desciende aquí; ha lavado las culpas del pecador su sangre carmesí."},{"t":"v","n":"3","x":"¡Qué merced, qué amor el Señor mostró muriendo en dura cruz! ya las puertas abrió el buen Redentor al cielo de eterna luz."},{"t":"c","x":"Si creyeres Él te salvará, él te salvará, sí, Él te salvará; si creyeres Él te salvará, Él tus manchas lavará."}]},{"s":"Himnario congregacional","n":"58","t":"Orando al Padre está Jesús","p":"301","c":"Letra y Música: Alberto G. Martínez, ICI, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Orando al Padre está Jesús, ¡Getsemaní, vedle sufrir! Y en su rostro refulgente sudor de sangre hallaréis."},{"t":"v","n":"2","x":"El alma de mi buen Jesús hasta la muerte triste está, Bebiendo el cáliz de amargura para salvar al pecador. ¡Getsemaní! hondo recuerdo; ¡Getsemaní! lugar her"},{"t":"v","n":"3","x":"¡Oh! cuán intenso es el dolor que embarga el alma del Señor Al ver la humanidad perdida, perdido el pobre pecador."},{"t":"v","n":"4","x":"Al Padre oraba el Salvador: \"Haz esta copa ya pasar, Pero esto no como yo quiero más como sea tu voluntad."},{"t":"c","x":"moso; Allí contemplo arrodillado al Hijo Eterno de mi Dios."}],"w":1},{"s":"Himnario congregacional","n":"59","t":"Por el mundo brilla luz","p":"302","c":"Letra y Música: Autor Desconocido","l":[{"t":"v","n":"1","x":"Por el mundo brilla luz desde que murió Jesús por nosotros en la cruz del calvario; los pecados Él llevó, de la culpa nos libró, con la sangre que manó del calvario."},{"t":"v","n":"2","x":"Antes todo fue temor, mas ahora es amor, porque comprendí el valor del calvario, yo viví en perdición, hoy poseo salvación por la grande redención del calvario. Por la"},{"t":"v","n":"3","x":"¿Eres grande pecador? ¡He aquí tu salvador! tema del predicador: el calvario; salvación a cada cual que padece por su mal, Dios ofrece gracia tal, por la sangre."},{"t":"c","x":"sangre, por la sangre somos redimidos, sí, por la sangre carmesí; por la sangre, por la sangre, por la sangre de Jesús del calvario."}],"w":1},{"s":"Himnario congregacional","n":"60","t":"¡Que grande salvación!","p":"303","c":"Letra y Música: Francisco Sánchez Muñíz, 07/11/1957, ICIAR, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"¡Qué grande salvación! por la sangre de Cristo Jesús, ¡Qué grande salvación! por la sangre vertida en la cruz; Divina salvación, Admirable y sublime perdón Ya me dio mi Jesús por su muerte en la cruz; ¡Aleluya! que gran salvación."},{"t":"v","n":"2","x":"¡Cuánta felicidad! por la sangre de Cristo Jesús, ¡Cuánta felicidad! por la sangre vertida en la cruz; Vida de amor y paz Escondida con Cristo en Dios Ya me dio mi Jesús por su muerte en la cruz; ¡Aleluya! que felicidad."},{"t":"c","x":"Gloria, gloria sin fin, De uno a otro confín, Démosle a una voz Al Cordero de Dios; Con su sangre eficaz nos lavó, nos compró, ¡Aleluya por siempre jamás!"}]},{"s":"Himnario congregacional","n":"61","t":"¿Qué me puede dar perdón?","p":"304","c":"Letra y Música: Robert Lowry, 1876, Trad. Howard W. Cragin","l":[{"t":"v","n":"1","x":"¿Qué me puede dar perdón? sólo de Jesús la sangre;"},{"t":"v","n":"2","x":"Fue el rescate eficaz, sólo de Jesús la sangre;"},{"t":"v","n":"3","x":"Veo para mi salud, sólo de Jesús la sangre;"},{"t":"v","n":"4","x":"Cantaré junto a sus pies, sólo de Jesús la sangre;"},{"t":"c","x":"¿y un nuevo corazón? sólo de Jesús la sangre. Precioso es el raudal que limpia todo mal, no hay otro manantial, sólo de Jesús la sangre.\ntrajo santidad y paz, sólo de Jesús la sangre. Precioso es el raudal que limpia todo mal, no hay otro manantial, sólo de Jesús la sangre.\ntiene de sanar virtud, sólo de Jesús la sangre. Precioso es el raudal que limpia todo mal, no hay otro manantial, sólo de Jesús la sangre.\nel Cordero digno es, sólo de Jesús la sangre. Precioso es el raudal que limpia todo mal, no hay otro manantial, sólo de Jesús la sangre."}],"w":1},{"s":"Himnario congregacional","n":"62","t":"Venid, cantad de gozo en plenitud","p":"305","c":"Letra: Thomas Martin Westrup; Música: James Mc Granahan","l":[{"t":"v","n":"1","x":"Venid, cantad, de gozo en plenitud, y dad loor al que su sangre dio; y luego en ella nos lavó, de nuestra lepra nos limpió, y nos libró de la esclavitud."},{"t":"v","n":"2","x":"Oh Dios de amor, que vienes a sufrir, llevando en ti toda la maldición; y en vez de eterna perdición, nos proporcionas salvación, que sin ti nadie puede adquirir."},{"t":"v","n":"3","x":"Jesús, Jesús fue quien por nos murió, y a Él, y a Él debemos alabar; nuestros pecados ya limpió para poder un día llegar al bello hogar que Él nos preparó."},{"t":"v","n":"4","x":"Honor y gloria en todo su esplendor serán el fin de quien sigue a Jesús; y en pos de Él toma su cruz, y guiado siempre por su luz lleva las marcas de su buen Señor."},{"t":"c","x":"Él nos libro de culpabilidad, y nos limpió para la eternidad; con ángeles y arcángeles nos igualó, precioso Salvador, el que por nos murió."}]},{"s":"Himnario congregacional","n":"63","t":"Yo confío en Jesús","p":"306","c":"Letra y Música: Autor Desconocido, Estrella de Belén.","l":[{"t":"v","n":"1","x":"Yo confío en Jesús y salvado soy; por su muerte en la cruz a la gloria voy."},{"t":"v","n":"2","x":"Todo fue pagado ya, nada debo yo; salvación perfecta da quien por mí murió."},{"t":"v","n":"3","x":"Todo hizo mi Señor, me salvó ya Él; Con ternura y amor Él me guarda fiel."},{"t":"v","n":"4","x":"Mi perfecta salvación eres ¡Oh Jesús! mi completa redención, mi gloriosa luz."},{"t":"c","x":"Cristo dio por mí, sangre carmesí, y por su muerte en la cruz la vida me dio Jesús."}],"w":1},{"s":"Himnario congregacional","n":"63b","t":"Cada día que pasa","p":"307","c":"Letra y Música: Jorge Díaz Mora","l":[{"t":"v","n":"1","x":"Cada día que pasa yo me siento mucho más agradecido a Dios, y al sentir su amor inmenso yo comprendo todo el bien que el hizo por mí."},{"t":"v","n":"2","x":"Cada día que pasa yo me siento mucho más agradecido a él, y por eso yo le sigo y procuro cada día serle más"},{"t":"c","x":"fiel. Murió en la cruz por mí, por darme salvación; vertió su sangre allí, por darme redención, y ahora canto yo con gran satisfacción, yo salvo soy; tengo el perdón, tengo el perdón, tengo el perdón."}],"w":1},{"s":"Himnario congregacional","n":"63c","t":"Tierra bendita y divina","p":"308","c":"Letra y Música: Desconocido, Melodía Cubana.","l":[{"t":"v","n":"1","x":"Tierra bendita y divina es la de Palestina, donde nació Jesús; eres de las naciones cumbre bañada con tu lumbre que derramó su luz."},{"t":"v","n":"2","x":"Cuenta la historia del pasado que en tu seno sagrado vivió el Salvador; que en sus hermosos olivares habló a los millares la palabra de amor."},{"t":"v","n":"3","x":"Quedan en ti testigos mudos, que son los viejos muros de la Jerusalén, viejas paredes destruidas, que si tuvieran vida nos hablarían también."},{"t":"c","x":"Eres la historia inolvidable porque en tu seno se derramó la sangre, preciosa sangre del unigénito hijo de Dios. La Dios."}]},{"s":"Himnario congregacional","n":"64","t":"La tierna voz del salvador","p":"309","c":"Letra: William Hunter, Tr. Pedro Castro; Música: John H. Stockton","l":[{"t":"v","n":"1","x":"La tierna voz del Salvador Nos dice conmovida: \"Oíd al Médico de amor, Que da a los muertos vida\"."},{"t":"v","n":"2","x":"Cordero manso, gloria a Ti, Por Salvador te aclamo; Tu dulce nombre es para mí La joya que más amo."},{"t":"v","n":"3","x":"La amarga copa del dolor, Jesús, fue tu bebida; En cambio has dado al pecador El agua de la vida."},{"t":"v","n":"4","x":"Y cuando al cielo del Señor Con Él nos elevemos, Arrebatados en amor, Su gloria cantaremos."},{"t":"c","x":"Él tiene toda potestad, Puede sanar la enfermedad; Lleno de gracia y de poder Es nuestro Jesucristo."}]},{"s":"Himnario congregacional","n":"65","t":"Admirable es el nombre de Cristo","p":"310","c":"Letra y Música: Francisco Sánchez Muñíz, ICIAR.","l":[{"t":"v","n":"1","x":"Admirable es el nombre de Cristo, Su poder y virtud sin igual, Es el nombre que Dios ha provisto Para dar vida eterna al mortal. Es su nombre cual mirra fragante, Que perfuma y embarga mi ser; Y en la lucha me hace constante Por su augusta virtud y poder."},{"t":"v","n":"2","x":"Me constriñe el amor admirable De Jesús mi precioso Señor; Ya que sólo su amor insondable Pudo amar a tan vil pecador. En su amor mi esperanza reposa Aunque el mundo me ofrezca placer; Ya mi vida con Cristo es dichosa Y hoy le amo con todo mi ser. Soy feliz por Jesús, el Cordero, Quien por mí se inmoló en la"},{"t":"v","n":"3","x":"¿Quién habrá como Tú tan amable, Que perdonas y olvidas el mal? Sólo Tú, oh Cordero adorable, Inmolado en madero fatal. Aceptando con gozo admirable Al que acude contrito a tu cruz; Tú lo llenas de paz inefable Y le das vida eterna y luz."},{"t":"c","x":"cruz, Y con sangre marcó el sendero Y me dio vida eterna y luz."}],"w":1},{"s":"Himnario congregacional","n":"66","t":"Castillo fuerte es nuestro Dios","p":"311","c":"Letra y Música: Martín Lutero, Tr. Juan Bautista Cabrera","l":[{"t":"v","n":"1","x":"Castillo fuerte es nuestro Dios, Defensa y buen escudo. Con su poder nos librará En este trance agudo. Con furia y con afán Acósanos Satán; Por armas deja ver Astucia y gran poder; Cual él no hay en la tierra."},{"t":"v","n":"2","x":"Nuestro valor es nada aquí, Con él todo es perdido; Mas por nosotro luchará De Dios el escogido. ¿Sabéis quién es Jesús?, El que venció en la cruz, Señor de Sabaoth. Y pues él sólo es Dios, Él triunfa en la batalla."},{"t":"v","n":"3","x":"Aunque estén demonios mil, Prontos a devorarnos, No temeremos porque Dios Sabrá aún prosperarnos. Que muestre su vigor, Satán y su furor; Dañarnos no podrá; Pues condenado es ya, Por la Palabra Santa."}],"w":1},{"s":"Himnario congregacional","n":"67","t":"Maravillosa gracia","p":"312–313","c":"Letra y Música: Haldor Lillenas (1885-1959), Tr. W.R. Adell","l":[{"t":"v","n":"1","x":"Maravillosa gracia, vino Jesús a dar, más alta que los cielos, más honda que la mar, más grande que mis culpas clavadas en la cruz es la maravillosa gracia de Jesús. la divina gracia, más profunda mar. Es suficiente de rescatar. de rescatar perdonando todos mis errores Cristo me limpió de mi maldad; a"},{"t":"v","n":"2","x":"Maravillosa gracia, gracia de compasión, gracia que sacia el alma con plena salvación, gracia que lleva al cielo, gracia de paz y luz es la maravillosa gracia de Jesús. Inefable es la divina gracia, es inmensurable cual la mar, como clara fuente, siempre suficiente a los pecadores rescatar. errores, todos de mi maldad;"},{"t":"v","n":"3","x":"Maravillosa gracia, llama con dulce voz, llámanos a ser hechos hijos de nuestro Dios; colma de su consuelo, nos llena de virtud esta maravillosa gracia de Jesús."},{"t":"c","x":"labaré su dulce nombre por la eternidad."}],"w":1},{"s":"Himnario congregacional","n":"67b","t":"Dios nos envió, a su Hijo Cristo","p":"314–315","c":"Letra y música: William y Gloria Gaither, 1971","l":[{"t":"v","n":"1","x":"Dios nos envió a su Hijo Cristo él es amor, paz y perdón. Por mí murió en el calvario, mas de la tumba con poder resucitó. Coro D"},{"t":"v","n":"2","x":"Con esa paz que hay en un niño Quiero confiar en mi Señor; Sé que vendrán días de prueba Mas nada me apartará de mi Señor. Porque Él vive No temo al mañana;"},{"t":"v","n":"3","x":"Se acabará mi vida un día, enfrentaré muerte y dolor, mas a Jesús veré en la gloria y reinaré con mi triunfante Salvador."},{"t":"c","x":"Él vive en mí, seguro estoy Pues se muy bien que el tiempo está en sus manos, Y que mi vida vale porque él vive en mí."}],"w":1},{"s":"Himnario congregacional","n":"67c","t":"Noble sostén","p":"316","c":"Letra y Música: Desconocido, México, Arr. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Noble sostén de la esperanza mía, fuente bendita de vida eterna, tan sólo el alma que en tu fuerza fía tiene paz, tiene paz."},{"t":"v","n":"2","x":"Yo soy muy débil, pero en ti soy fuerte; nunca en la lucha desmayar podré; si tú estás conmigo, ni ala misma muerte temeré, no temeré."},{"t":"v","n":"3","x":"Dura es la lucha, difícil la tarea, mas tú me dotas de tu gran poder; mi espíritu renuevas con la idea nueva de vencer, de vencer."},{"t":"c","x":"Mi sostén es Jesús, nunca en la lucha desmayar podré; Mi sostén es Jesús, nunca en la lucha desmayar podré."}],"w":1},{"s":"Himnario congregacional","n":"68","t":"Ángeles cantando están","p":"317","c":"Letra y Música: Villancico Francés, Trd, George P. Simmonds","l":[{"t":"v","n":"1","x":"Ángeles cantando están tan dulcísima canción Las montañas su eco dan como fiel contestación."},{"t":"v","n":"2","x":"Los pasto res sin cesar sus loores dan a Dios Cuan glorioso es el cantar de su melodiosa voz."},{"t":"v","n":"3","x":"Oh venid pronto a Belén para contemplar con fe A Jesús autor de bien al recién nacido Rey."},{"t":"c","x":"Gloria a Dios en lo alto Gloria a Dios en lo alto."}]},{"s":"Himnario congregacional","n":"69","t":"Gloria a Dios en las alturas","p":"318","c":"Letra: Juan B. Cabrera; Música: George Elvey","l":[{"t":"v","n":"1","x":"¡Gloria a Dios! en las alturas, Que mostró su grande amor, Dando a humanas ciaturas ¡Un potente Salvador! Con los himnos de los santos Hagan coros nuestros cantos De alabanza y gratitud, Por la divinal salud Y digamos a una voz ¡En los cielos Gloria a Dios!"},{"t":"v","n":"2","x":"¡Gloria a Dios! la tierra cante, Al gozar de su bondad, Pues le brinda paz constante En su buena voluntad, Toda tribu y lenguas todas Al excelso eleven todas Por el Rey Emanuel, Que les vino de Israel, Y prorrumpan a una voz ¡En los cielos Gloria a Dios!"},{"t":"v","n":"3","x":"¡Gloria a Dios! la Iglesia entone Rota al ver su esclavitud Por Jesús que es su corona Su cabeza y plenitud, Vigilante siempre vive Y a la lucha se apercibe Mientras llega su solaz, En la gloria y plena paz, Donde exclame a una voz ¡En los cielos Gloria a Dios!"}],"w":1},{"s":"Himnario congregacional","n":"70","t":"¡Noche de paz, Noche de amor!","p":"319","c":"Letra: Joseph Morh; Música: Franz Gruber","l":[{"t":"v","n":"1","x":"¡Noche de paz, noche de amor! Todo duerme en derredor; Entre los astros que esparcen su luz, Bella anunciando al niñito Jesús Brilla la estrella de paz, Brilla la estrella de paz."},{"t":"v","n":"2","x":"¡Noche de paz, noche de amor! Oye humilde el fiel pastor, Coros celestes que anuncian salud, Gracias y glorias en gran plenitud, Por nuestro buen Redentor, Por nuestro buen Redentor."},{"t":"v","n":"3","x":"¡Noche de paz, noche de amor! Ved que bello resplandor, Luce en el rostro del niño Jesús, En el pesebre del mundo la luz, Astro de eterno fulgor, Astro de eterno fulgor."}]},{"s":"Himnario congregacional","n":"71","t":"¡Oh Santísimo, felicísimo!","p":"320","c":"Letra: Johann D. Falk, Trad. Fritz Fliedner; Música: Himno Siciliano","l":[{"t":"v","x":"16. ¡Oh santísimo, felicísimo, Grato tiempo de Navidad! Cristo el prometido ha por fin venido, Al mortal perdido Cristole ha nacido, Coros celestiales oyen los mortales Cántenle loores magos y pastores, Tan dichosa nueva al mortal conmueva, Príncipe del cielo, danos tu consuelo, ¡Alegría, Alegría, Cristiandad!"}],"w":1},{"s":"Himnario congregacional","n":"72","t":"Oíd un son en alta esfera","p":"321","c":"Letra: Charles Wesley, Trad. Martín Madán; Música: Félix Mendelssohn","l":[{"t":"v","n":"1","x":"Oíd un son en alta esfera; \"¡En los cielos gloria a Dios, Y al mortal paz en la tierra!\" Canta la celeste voz. Con los cielos alabemos Al Eterno Rey, cantemos A Jesús que es nuestro bien, Con el coro de Belén; Canta"},{"t":"v","n":"2","x":"El Señor de los señores, El Ungido Celestial, A salvar los pecadores Vino al seno virginal. Gloria al Verbo encarnado, En humanidad velado; Gloria al Santo de Israel Cuyo nombre es Emmanuel; Canta"},{"t":"v","n":"3","x":"Príncipe de paz eterna, Gloria a Ti, Señor Jesús; Entregando el alma tierna Tú nos traes vida y luz. Haz tu majestad dejado, y buscarnos te has dignado; Para darnos el vivir A la muerte quieres ir; Canta"},{"t":"c","x":"la celeste voz: \"¡En los cielos gloria a Dios!\""}],"w":1},{"s":"Himnario congregacional","n":"73","t":"Suenen dulces himnos","p":"322","c":"Letra: William O. Cushing, Trad. Juan B. Cabrera; Música: George F. Root, 1875","l":[{"t":"v","n":"1","x":"Suenen dulces himnos, gratos al Señor, Y óiganse en concierto universal; Desde el alto cielo baja el Salvador Para beneficio del mortal."},{"t":"v","n":"2","x":"Montes y collados fluyan leche y miel, Y abundancia esparzan y solaz; Gócense los pueblos, gócese Israel, Que a la tierra viene ya la paz."},{"t":"v","n":"3","x":"Salte de alegría lleno el corazón, De la triste y pobre humanidad; Dios se compadece viendo su aflicción, Y le muestra buena voluntad."},{"t":"v","n":"4","x":"Lata en nuestro pecho noble gratitud Hacia El que nos brinda redención; A Jesús el Cristo que nos da salud, Tributemos nuestra adoración."},{"t":"c","x":"¡Gloria! ¡gloria sea a nuestro Dios! ¡Gloria! si, cantemos a una voz; Y el cantar de gloria, que se oyó en Belén sea nuestro cántico también"}],"w":1},{"s":"Himnario congregacional","n":"74","t":"Tú dejaste tu trono y corona por mi","p":"323","c":"Letra: Emily E.S. Elliot; Música: Ira D. Sankey","l":[{"t":"v","n":"1","x":"Tú dejaste, tu trono y corona por mí, Al venir a Belén a nacer; Mas a ti no fue dado el entrar al mesón Y en pesebre te hicieron nacer."},{"t":"v","n":"2","x":"Siempre pueden las zorras sus cuevas tener Y las aves sus nidos también; Mas el Hijo del hombre no tuvo un lugar En el cual reclinara su sien."},{"t":"v","n":"3","x":"Tú viniste, Señor, con tu gran bendición Para dar libertad y salud; Mas con odio y desprecio te hicieron morir, Aunque vieron tu amor y virtud."},{"t":"v","n":"4","x":"Alabanzas sublimes los cielos darán, Cuando vengas glorioso de allí, Y tu voz entre nubes dirá \"Ven a Mí, que hay lugar junto a Mí para ti\""},{"t":"c","x":"Ven a mi corazón ¡Oh Cristo! Pues en él hay lugar para Ti; Ven a mi corazón ¡Oh Cristo, ven! Pues en él hay lugar para Ti."}]},{"s":"Himnario congregacional","n":"75","t":"Ama el Pastor sus ovejas","p":"324–325","c":"Letra: Mary B. Wingate, Trad.Epigmenio Velasco; Música: William J. Kirkpatrick","l":[{"t":"v","n":"1","x":"Ama el Pastor sus ovejas con un amor paternal; ama el Pastor su rebaño con un amor sin igual; ama el Pastor a las otras, que descarriadas están y conmovido las busca por dondequiera que van."},{"t":"v","n":"2","x":"Ama el Pastor sus corderos, los ama el tierno Pastor; a los que a veces, perdidos, se oyen gemir de dolor. Ved al Pastor conmovido, por los collados buscar; y a los corderos en hombros, vedlo llevando al hogar."},{"t":"v","n":"3","x":"Ama las noventa y nueve, que en el aprisco guardó; ama las que descarriadas, por el desierto dejó; ¡Oh mis ovejas perdidas! clama doliente el Pastor; ¿Quienes vendrán en mi ayuda para salvarlas, Señor?"},{"t":"v","n":"4","x":"Son delicados tus pastos, y quietas las aguas son; henos aquí, ¡Oh maestro! danos hoy tu comisión. Haz que sirvamos fervientes, llénanos de un santo amor por las ovejas perdidas, de tu redil, buen Señor."},{"t":"c","x":"Por el desierto, errabundas, se ven sufrir penas mil, y al encontrarlas, en hombros las lleva tierno al redil."}]},{"s":"Himnario congregacional","n":"76","t":"Cristo me guía es mi pastor","p":"325","c":"Letra y Música: Vicente Mendoza","l":[{"t":"v","n":"1","x":"Cristo me guía, es mi Pastor, Nada me falta yendo con él; Tengo su fuerza, tengo su amor Si en sus caminos le sigo fiel."},{"t":"v","n":"2","x":"En mis tristezas, nadie como él Rompe los hierros de mi dolor; Y si la vida se muestra cruel Sólo me inunda de paz y amor."},{"t":"v","n":"3","x":"Si estoy enfermo, El es salud De cuerpo y alma, todo a la vez; En mis tormentas, él es quietud, Y en mis tinieblas, es brillantez."},{"t":"v","n":"4","x":"En el conflicto tan desigual Que contra el malo librando estoy, él bien comprende todo mi mal, él bien conoce cuán débil soy."},{"t":"v","n":"5","x":"¿Qué significa pues el dolor? ¿Qué las tinieblas, si voy con él? Es el apoyo de mi valor, Siendo conmigo paciente y fiel."},{"t":"c","x":"Seguro amparo, firme sostén Encuentro siempre con mi Pastor; Vino él al mundo para mi bien, Y a darme vida con su dolor."}]},{"s":"Himnario congregacional","n":"77","t":"Al huerto van a visitar","p":"326–327","c":"Letra: Ernesto Barocio; Música: J. Lincoln Hall","l":[{"t":"v","n":"1","x":"Al huerto van a visitar la tumba en que su cuerpo está, mujeres son que a ungirlo van, mas ¿quién la piedra quitará? Oh,"},{"t":"v","n":"2","x":"Clavado fue en dura cruz, y allí su vida dio Jesús; sus pies, sus manos besarán; mas ¿quién la piedra quitará? Oh,"},{"t":"v","n":"3","x":"¿Habéis perdido lo que amáis? ¿vuestra esperanza se acabó? ¿de un Cristo muerto en busca váis? ¡Ya Dios la piedra removió! Sí,"},{"t":"c","x":"¿quién, (Oh, ¿quién?) la quitará? Nada temáis, id al huerto, ¡ved su tumba abierta ya! El que buscáis no está muerto, ¡Resucitado ha! Nada temáis vive y reina El Maestro y Señor; ¡Vencedor, (vencedor) vencedor, (vencedor) del sepulcro vencedor!\nDios, (Mi Dios) la removió. Nada temáis, id al huerto, ¡ved su tumba abierta ya! El que buscáis no está muerto, ¡Resucitado ha! Nada temáis vive y reina El Maestro y Señor; ¡Vencedor, (vencedor) vencedor, (vencedor) del sepulcro vencedor!"}],"w":1},{"s":"Himnario congregacional","n":"78","t":"Del sepulcro tenebroso","p":"328","c":"Letra y Música: Germán Luders","l":[{"t":"v","n":"1","x":"Del sepulcro tenebroso el Señor se levantó, y las ligas de la muerte poderoso destrozó. No temáis, que el buen Maestro ha tornado a vivir, y no sólo Él, más todos los que le hayan de seguir."},{"t":"v","n":"2","x":"Como el grano de semilla en la tierra debe entrar, nuestros cuerpos igualmente, en la tumba habrá de estar. Esperando el grande día, en las nubes la señal, cuando la final trompeta llame a todos por igual."},{"t":"v","n":"3","x":"A los fieles Cristo llama a su lado siempre estar, y con Él por las edades en los cielos a morar. No temáis, que el buen Maestro a la vida retornó, y no sólo Él, más todos los que aquí su amor salvó."},{"t":"c","x":"Abierta está la tumba, vacío el lugar en donde amigos fieles le hicieron descansar."}]},{"s":"Himnario congregacional","n":"78b","t":"A Dios obedecen el rayo y el viento","p":"329","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"A Dios obedecen el rayo y el viento, Lo anuncian los astros, proclámalo el mar; Con un leve soplo pudiera su aliento Hacer de la tierra los ejes temblar; Las nubes inmensas en el firmamento, los mares bravíos, escuchan su voz; Y las tempestades, y los elementos La voz obedecen tan sólo de Dios. Coro"},{"t":"v","n":"2","x":"Cuán torpe aquel pueblo que insano se atreva A alzarse enemigo del pueblo de Dios, Será como el tamo que el viento se lleva, Ni leve vestigio dejándole en pos; Más grande, glorioso y feliz se presenta El pueblo dichoso que a Cristo aceptó; Lo escuda la mano que al orbe sustenta, Que al ángel de muerte su espada quitó. No hay otro Dios que nuestro Dios, Dios es el Dios de la verdad;"},{"t":"c","x":"El es el Rey del mar y el sol, En cielo y tierra Él es Jehová."}],"w":1},{"s":"Himnario congregacional","n":"79","t":"El vive, resucitó","p":"330–331","c":"Letra y Música: Francisco Sánchez Muñíz, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Él vive, resucitó, A la muerte ya venció; Él vive, resucitó, Al sepulcro destrozó; Él vive, resucitó, Las tinieblas disipó, Vencedor se levantó Nuestro Señor Cristo Jesús."},{"t":"v","n":"2","x":"Al cielo Él ascendió, Santo Espíritu envió, Allá en Pentecostés Su poder manifestó; Un viento recio corrió, Fuego santo apareció, Nuevas lenguas pronunciaron Todos llenos de poder."},{"t":"v","n":"3","x":"El Santo Consolador; El Espíritu de Dios, El fuego Consumidor Con nosotros hoy está; Llenando con su Poder A todo el que cree en Él, porque la promesa es Para cuantos llamare Dios."},{"t":"c","x":"\"He aquí Yo estoy con vosotros hasta el fin\" Resuena la voz De uno a otro confín; Es Cristo Jesús El victorioso Rey Que delante va De su preciosa grey."}],"w":1},{"s":"Himnario congregacional","n":"80","t":"Hace tres días que yerto está","p":"332–333","c":"Letra y Música: Evangelina Lango, ICIAR","l":[{"t":"v","n":"1","x":"Hace tres días que yerto está el blanco lirio que perfumó los verdes campos de la Judá que con sus risas le amorta"},{"t":"v","n":"2","x":"Manos preciosas que lastimé aunque gloriosas me hicieron bien, en mi ignorancia te desdeñé y con espinas clavé tu"},{"t":"v","n":"3","x":"¡Oh Cristo mío con cuanto amor tu vivida diste en dura cruz para rescate del pecador! yo te bendigo, ¡Oh, mi Je"},{"t":"c","x":"jó; ya no está. ¡Aleluya! ¡Aleluya! ¡el Señor resucitó! ¡Aleluya! ¡Aleluya! ¡el Señor resucitó! con poder se levantó, el sepulcro solo está, y el temor a la muerte para siempre el borró; ¡Aleluya, amén! ¡Aleluya, amén!\nsien: ¿Dónde su cuerpo pusisteis hoy? que en la tumba ya no está. ¡Aleluya! ¡Aleluya! ¡el Señor resucitó! ¡Aleluya! ¡Aleluya! ¡el Señor resucitó! con poder se levantó, el sepulcro solo está, y el temor a la muerte para siempre el borró; ¡Aleluya, amén! ¡Aleluya, amén!\nsús! ya no está. ¡Aleluya! ¡Aleluya! ¡el Señor resucitó! ¡Aleluya! ¡Aleluya! ¡el Señor resucitó! con poder se levantó, el sepulcro solo está, y el temor a la muerte para siempre el borró; ¡Aleluya, amén! ¡Aleluya, amén!"}],"w":1},{"s":"Himnario congregacional","n":"81","t":"Hora de triunfo llena de luz","p":"334","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: F. S. Howard","l":[{"t":"v","n":"1","x":"Hora de triunfo, llena de luz, día de victoria del Salvador; huye la sombra de inicua cruz, No reina ya el dolor."},{"t":"v","n":"2","x":"Hora de triunfo, gloria y poder cuando la tumba se iluminó, y en dulce y quieto amanecer Cristo resucitó."},{"t":"v","n":"3","x":"Marcha triunfal los suyos con él yendo a los cielos todos harán; albos vestidos, dignos del fiel todos luciendo irán."},{"t":"v","n":"4","x":"¡Gloria Aleluya! todos cantad, sobre la vida Cristo el Señor reina glorioso; todos alzad himnos en su loor."},{"t":"c","x":"Canten hosannas todos al Rey ¡suba a los cielos nuestra canción! ¡Salve! ¡Aleluya! Cristo el Señor triunfó."}],"w":1},{"s":"Himnario congregacional","n":"82","t":"¡Resucitó! La nueva dad","p":"335","c":"Letra: Elsie Duncan Yale, Tr. Ernesto Barocio; Música: J. Lincoln Hall","l":[{"t":"v","n":"1","x":"¡Resucitó! la nueva dad al mundo que su muerte"},{"t":"v","n":"2","x":"Le vieron tristes sepultar cuantos en él tuvieron"},{"t":"v","n":"3","x":"Más el sepulcro no logró en sus prisiones rete"},{"t":"v","n":"4","x":"¡Resucitó! ya no tendrá la tumba sombras para el"},{"t":"c","x":"vio; tomó en la cruz nuestro lugar, más del sepulcro revivió. tá; no le lloréis; cantad, reíd, ¡Y proclamad que Cristo vive y reina ya!\nfe, y su esperanza muerta ya creyeron sepultar con él. ¡Porqué buscáis al Cristo aquí? entre los muertos ya no es no le lloréis; cantad reíd,\nner al Cristo Rey, que vencedor se levantó con su poder. ¿por qué buscáis al Cristo aquí?\nfiel; aun cuando muera vivirá el que creyere sólo en él."}],"w":1},{"s":"Himnario congregacional","n":"83","t":"Cantaré a Jesús, de mi alma Rey","p":"336–337","c":"Letra: S. D. Athans; Música: De Loss Smith","l":[{"t":"v","n":"1","x":"Cantaré a Jesús, de mi alma Rey, al Rey de gloria ensalzaré; trajo al mundo paz, y al mortal, buena voluntad; alegres nuevas por doquiera proclamad."},{"t":"v","n":"2","x":"En la cruz del calvario por mi sufrió, allí la amarga copa bebió; y al expirar, el sol de luto se cubrió; mas vencedor, nuestro Señor resucitó."},{"t":"v","n":"3","x":"Ascendió a la gloria mi Salvador, por mí intercede con tierno amor, pronto volverá, con sus santos para reinar, dicha indecible será alla con Él morar."},{"t":"v","n":"4","x":"¿Qué será en aquella mansión de luz, al ver el rostro de mi Jesús, y con Él gozar, las grandezas que allí habrá, y los placeres que el fiel disfrutará?"},{"t":"c","x":"Yo soy feliz con mi Cristo, porque mi alma salvó; ángeles cantan alegres, por cuantos Él redimió, ¡Oh, cuan hermosa es la vida, dulce, serena de fe! soy peregrino en la tierra, mas ando con Cristo, de mi alma Rey."}],"w":1},{"s":"Himnario congregacional","n":"84","t":"El Señor entró triunfante","p":"338–339","c":"Letra y Música: Leonardo Flores Esparza, ICIAR.","l":[{"t":"v","n":"1","x":"El Señor entró triunfante a la gran Jerusalén, Hoy rendimos homenaje al sublime y santo Rey; Palmas y ramos de olivo le tendieron a sus pies, El Señor hizo su entrada a la gran Jerusalén."},{"t":"v","n":"2","x":"El Señor entró triunfante a la gran Jerusalén, Hoy rendimos homenaje al sublime y santo Rey; Ya las gentes se preguntan; ¿A quién rinden tanto honor? A Jesús que hoy ha venido en el nombre del Señor."},{"t":"v","n":"3","x":"El Señor entró triunfante a la gran Jerusalén, Hoy rendimos homenaje al sublime y santo Rey; Quiera Dios que en este día haga su entrada triunfal A todos los corazones, por toda la eternidad."},{"t":"c","x":"Grandes voces de júbilo se escuchan Proclamando al santo Rey, Diciendo así con célico fervor: Hosanna, hosanna, bendito el que viene En el nombre del Señor."}]},{"s":"Himnario congregacional","n":"85","t":"Jesús es mi Rey soberano","p":"340","c":"Letra y Música: Vicente Mendoza Polanco (1875-1955)","l":[{"t":"v","n":"1","x":"Jesús es mi Rey soberano, mi gozo es cantar su loor, es Rey y me ve cual hermano, es Rey y me imparte su amor, dejando su trono de gloria me vino asa car de la escoria, y yo soy feliz, y yo soy feliz por Él."},{"t":"v","n":"2","x":"Jesús es mi amigo anhelado, y en sombras y en luz siempre va, paciente y humilde a mi lado, su ayuda y consuelo me da, por eso constante los sigo porque Él es mi Rey y mi amigo, y yo soy feliz, y yo soy feliz por Él."},{"t":"v","n":"3","x":"¿Señor qué pudiera yo darte, por tanta bondad para mí? ¿Me basta servirte y amarte, es todo entregarme yo a Ti? entonces acepta mi vida que a Ti solo queda rendida, pues yo soy feliz, pues yo soy feliz por Ti."}]},{"s":"Himnario congregacional","n":"86","t":"Loores dad a Cristo el Rey","p":"341","c":"Letra: Edward Perronet, Trad. Thomas M. Westrup; Música: Oliver Holden","l":[{"t":"v","n":"1","x":"F C F C F C d F C Loores dad a Cristo el Rey suprema potestad, de su divino amor la ley postrados grey, loores dad a Emanuel y proclaaceptad, de su divino amadle Rey, loores dad a mor la ley postrados aceptad. Emanuel y proclamadle Rey."},{"t":"v","n":"2","x":"Vosotros hijos de Israel residuo de la ley, de gracia y de santidad y proclamadle Rey, de gracia y de santidad y proclamadle Rey."},{"t":"v","n":"3","x":"Naciones todas escuchad y obedeced sudor, cantemos por la eternidad a Cristo el Salvador, cantemos por la eternidad a Cristo el Salvador."},{"t":"v","n":"4","x":"Dios quiera que con los que están del trono en derre"}],"w":1},{"s":"Himnario congregacional","n":"87","t":"Por mil arpas y mil voces","p":"342","c":"Letra: Thomas Kelley; Música: Lowell Mason","l":[{"t":"v","n":"1","x":"Por mil arpas y mil voces se alcen notas de loor, Cristo reina el cielo goza Cristo reina el Dios de amor, ved su trono ocupa ya, solo el mundo regirá. ¡Ale"},{"t":"v","n":"2","x":"Rey de gloria reina siempre reina con tu potestad, nadie de tu mano arranque los que son tu propiedad, dicha tiene el escogido, que contemplará su faz."},{"t":"v","n":"3","x":"Apresura tu venida en las nubes ¡oh Señor! nuevos cielos nueva vida danos Cristo por tu amor, arpas de oro de tu grey, gloria entonarán ¡oh Rey!"},{"t":"c","x":"luya, aleluya, aleluya! ¡Amén!"}],"w":1},{"s":"Himnario congregacional","n":"88","t":"Ved al Cristo, Rey de gloria","p":"343","c":"Letra: Thomas Kelley; Música: George C. Stebbins","l":[{"t":"v","n":"1","x":"Ved al Cristo, Rey de gloria, Es del mundo el vencedor;"},{"t":"v","n":"2","x":"Exaltadlo, exaltadlo, Ricos triunfos trae Jesús;"},{"t":"v","n":"3","x":"Si los malos se burlaron, Coronando al Salvador;"},{"t":"v","n":"4","x":"Escuchad las alabanzas, Que se elevan hacia Él."},{"t":"c","x":"Es de Cristo la victoria. Todos démosle loor.
