delidad! ¡Oh, tu fidelidad! Cada momento la veo en mí; nada me falta, pues todo provees. ¡Grande, Señor, es tu fidelidad!"}]},{"s":"Himnario congregacional","n":"253","t":"Qué dulces promesas son","p":"536–537","c":"Letra y Música: Desconocido, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Qué dulces promesas son las de mi Jesús mi buen Salvador, ellas me llenan de paz y me satisfacen el corazón. Todos debemos buscar más de su amor e inspiración, para que él nos pueda usar en está congregación."},{"t":"v","n":"2","x":"Que dulces momentos son cuando te alabamos mi buen Jesús, pones tu paz en nosotros, gozo contento, vida y amor. Nos das tu Espíritu Santo y alegría en el corazón, cuando andábamos vagando diste a nuestra alma salvación."},{"t":"v","n":"3","x":"Te pedimos Padre Santo que si hay aquí algún pecador, tráelo a los pies de Cristo para que él le de salvación; que hoy se arrepienta y te entregue su corazón deje sus iniquidades que le llevan a perdición."},{"t":"c","x":"Recibe Señor el canto de este grupo juvenil, telo ofrecemos ahora con amor y gratitud. Tú nos diste salvación y escogiste para ti darnos una bendición para servirte mejor."}],"w":1},{"s":"Himnario congregacional","n":"253b","t":"Señor Jesús, la luz del día se fue","p":"538","c":"Letra y Música: William Henry Monk","l":[{"t":"v","n":"1","x":"Señor Jesús, la luz del día se fue, la noche cierra ya, conmigo sé; sin otro amparo, Tú, por compasión, al desvalido da consolación."},{"t":"v","n":"2","x":"Veloz el día nuestro huyendova, su gloria, sus ensueños pasan ya: mudanza y muerte miro en derredor, conmigo sé, bendito Salvador."},{"t":"v","n":"3","x":"Tu gracia en todo el día he menester. ¿quién otro al tentador podrá vencer? ¿cuál otro amante guía encontraré? en sombra o sol, Señor, conmigo sé."},{"t":"v","n":"4","x":"Vea yo al fin en mi postrer visión de luz la senda que me lleve a Sión, do alegre cantaré al triunfar la fe: \"Jesús conmigo en vida y muerte fue\"."}],"w":1},{"s":"Himnario congregacional","n":"254","t":"Tras la tormenta el arcoiris","p":"539","c":"Letra y Música: Bentley De Forest Ackley (1872-1958), Tr. Ernesto Barocio (1876-1948)","l":[{"t":"v","n":"1","x":"Tras la tormenta el arco iris, y tras la oscuridad la luz; tras la amargura la alegría que a los creyentes da Jesús."},{"t":"v","n":"2","x":"Tras el invierno, primavera, tras el combate rudo, paz; tras triste valle, excelsa cumbre, tras cautiverio, libertad."},{"t":"v","n":"3","x":"Tras cuánto vemos, Dios el Padre, su amor que nunca faltará; tras este mundo el cielo a donde Jesús nos ha de trasladar."},{"t":"c","x":"Alegre canto el alma eleva al cielo donde Cristo está; así mi gozo se renueva, pues he de ver su augusta faz."}]},{"s":"Himnario congregacional","n":"255","t":"Vida feliz de incomparable paz","p":"540–541","c":"Letra y Música: Francisco Sánchez Muñiz.","l":[{"t":"v","n":"1","x":"Vida feliz de incomparable paz llena de amor, bendición, solaz, gozo y placer celestial, divina luz, gloria eternal me da mi Jesús."},{"t":"v","n":"2","x":"Como a Naamán en las aguas del Jordán diste salud, perennal virtud, yo, mi Señor, por tu sangre salvo soy, y soy feliz, muy feliz, mi Dios."},{"t":"v","n":"3","x":"Cantemos, sí, al Señor nueva canción al celebrar su divino amor; Él nos dotó de un nuevo corazón, gloria sin fin demos al Señor."},{"t":"c","x":"Qué felicidad con Jesús morar, dicha singular su faz contemplar; su presencia da gozo sin igual, su perfume sutil satura mi ser."}]},{"s":"Himnario congregacional","n":"256","t":"¡Aleluya! que el Señor tiene grande salvalción","p":"542","c":"Letra: L. Avella; Música: Barney Elliott Warren (1867-1951)","l":[{"t":"v","n":"1","x":"¡Aleluya!, que el Señor tiene grande salvación, libertad, libertad, nuestro Dios tiene poder para a Satanás vencer; libertad, libertad."},{"t":"v","n":"2","x":"Yo confío en Jesús, él me da la santidad, libertad, libertad, tengo paz y gozo ya desde que él me salvó, libertad, libertad. Liber"},{"t":"v","n":"3","x":"Hablaremos siempre aquí, ensalzando a nuestro Rey, liberlibertad, libertad, llama hijos de él, libertad, libertad, libertad. libertad,"},{"t":"v","n":"4","x":"Cantaremos siempre allí al dejar el mundo aquí, libertad, libertad, porque bondadoso y fiel, él nos tad, libertad, alabando al Señor, cantaremos con fervor, libertad, libertad."},{"t":"c","x":"tad y redención, ¡Aleluya! Cristo ya, me amó y me salvó; ¡Gloria! ¡Gloria! ¡Aleluya! Él es todo en todo es Él.\nlibertad, y redención, luya! Él es todo en todo es Él."}],"w":1},{"s":"Himnario congregacional","n":"257","t":"Cansado y triste vine al Salvador","p":"543","c":"C. Final; Letra y Música: Mrs. Margaret Jenkins Harris (1865-1919), Tr. Henry Cleophas Ball (1896-1989)","l":[{"t":"v","n":"1","x":"Cansado y triste vine al Salvador, mi culpa él llevó, mi culpa él llevó; mi eterna dicha hallé en su amor, mi culpa él llevó."},{"t":"v","n":"2","x":"Borrados todos mis pecados son, mi culpa él llevó, mi culpa él llevó; a él feliz elevo mi canción, mi culpa él llevó."},{"t":"v","n":"3","x":"Ya vivo libre de condenación, mi culpa él llevó, mi culpa él llevó; su dulce paz tengo en mi corazón, mi culpa él llevó."},{"t":"v","n":"4","x":"Si hoy a Cristo vienes pecador, tu culpa llevará, tu culpa llevará; perdón tendrás si acudes al Señor, tu culpa llevará."},{"t":"c","x":"Mi culpa él llevó, mi culpa él llevó, alegre siempre cantaré. Al Señor gozoso alabaré, porque él me salvó.\nTu culpa llevará, tu culpa llevará, y limpiará tu corazón; y dirás feliz en tu canción: \"Mi culpa él llevó\"."}],"w":1},{"s":"Himnario congregacional","n":"258","t":"De mi tierno Salvador","p":"544","c":"Letra y Música: William James Kirkpatrick","l":[{"t":"v","n":"1","x":"De mi tierno Salvador cantaré el inmenso amor, gloriareme en el favor de Jesús; de tinieblas me llamó, de cadenas me libró, de la muerte me salvó mi Jesús."},{"t":"v","n":"2","x":"¡Oh, qué triste condición del impío corazón! me salvó de perdición, mi Jesús; del pecado, el perdón; de la ruina salvación; por tristeza, bendición dio Jesús."},{"t":"v","n":"3","x":"En el mundo al vagar solitario y sin hogar, no sabía qué dulce paz da Jesús; mas las lágrimas de ayer han pasado, y qué placer ya comienzo a tener en Jesús."},{"t":"v","n":"4","x":"De lo falso a la verdad, de lo inmundo, a santidad, ya me trajo la bondad de Jesús; somos fuertes en virtud de su perennal salud; ¡himnos dad de gratitud a Jesús."},{"t":"c","x":"¡Mi Jesús! ¡Mi Jesús! ¡Cuán glorioso es el nombre de Jesús! con su sangre me limpió, de su gozo me llenó, de su vida me dotó, mi Jesús."}]},{"s":"Himnario congregacional","n":"259","t":"Dulce comunión la que gozo ya","p":"545","c":"Letra: Elisha Albright Hoffman (1839-1929), Pedro Grado (1862-1923); Música: Anthony Johnson Showalter (1858-1924)","l":[{"t":"v","n":"1","x":"Dulce comunión la que gozo ya en los brazos de mi Salvador; ¡qué gran bendición en su paz me da! ¡Oh! yo siento en mí su tierno amor."},{"t":"v","n":"2","x":"¡Cuán dulce Es vivir, cuán dulces es gozar en los brazos de mi Salvador! allí quiero ir y con él morar, siendo objeto de su tierno amor."},{"t":"v","n":"3","x":"No hay que temer, ni que desconfiar en los brazos de mi Salvador; por su gran poder él me guardará de los lazos del engañador."},{"t":"c","x":"Libre, salvo, del pecado y del temor; Libre, salvo, en los brazos de mi Salvador.\nLibre de penas, salvo de dudas, Libre de penas, salvo de dudas,"}],"w":1},{"s":"Himnario congregacional","n":"260","t":"El sol brilló en su esplendor","p":"546","c":"Letra y Música: Francisco Sánchez Muñíz, Arm. Isaac García Contreras","l":[{"t":"v","n":"1","x":"El sol brilló en su esplendor y las tinieblas disipó, mi pobre ser se iluminó de vivo y célico fulgor cuando escuchó mi corazón maravillosa y dulce voz De mi Señor, mi buen Jesús: \"Borrados tus pecados son\""},{"t":"v","n":"2","x":"La vida es de plenitud estando en Cristo mi Señor; Lleno de fe, de su virtud, de su poder y santo amor; la exclamación del corazón del hombre cual san Pablo es: \"Ahora ya no vivo yo, Más vive y reina Cristo en mí\""},{"t":"v","n":"3","x":"El sol brilló en su esplendor en el cenit del cielo azul el cielo de la comunión llenando a todo corazón de vida y luz, fuerza y vigor en un raudal de bendición De mi Señor, mi buen Jesús Sol de justicia, paz y luz."},{"t":"c","x":"Cuán grande amor de mi Señor que me salvó, me perdonó; su inmenso amor me dio la redención, también un nuevo corazón."}]},{"s":"Himnario congregacional","n":"261","t":"En las olas inmensas","p":"547","c":"Letra y Música: Lewis Edgar Jones (1865-1936), Tr. M. Lechuga","l":[{"t":"v","n":"1","x":"En las olas inmensas de embravecido mar, que asaltan de mi alma lapo bre embarcación, de rodillas a Cristo clamé y el huracán, deshecho fue al instante a la voz de Dios."},{"t":"v","n":"2","x":"Me guarda de peligros, de pruebas, de dolor, él manda que los vientos no agiten tempestad; los mares se detienen, la ola reposó, y en Cristo fijo el ancla confiando más."},{"t":"v","n":"3","x":"Mi dulce Salvador, sí, mi hermoso amigo y Dios que libra de tristeza y aleja amarga hiel; por fe yo iré al cielo, mansión del ser de a mor, la fuente inagotable de dicha y bien."},{"t":"c","x":"Es Cristo la Roca, el ancla de mi fe, los males, lamentos y ayes de temor, terminan por siempre con mi supremo Rey; es Jesucristo mi refugio."}],"w":1},{"s":"Himnario congregacional","n":"262","t":"En negro fango yo estaba hundido","p":"548","c":"Letra y Música: Alberto G. Martínez. ICI","l":[{"t":"v","n":"1","x":"En negro fango yo estaba hundido, allí perdido Jesús me halló, y con su brazo fuerte, extendido, de aquel peligro me rescató."},{"t":"v","n":"2","x":"Por eso mi alma agradecida aquí rendida le da loor, por esa llama que está encendida y que me infunde un santo ardor."},{"t":"v","n":"3","x":"Si estás caído como yo estaba y tu alma vaga lejos de Dios, Cristo es tu amigo, dale tu carga, que sólo él salva y da perdón."},{"t":"v","n":"4","x":"Muy pronto unidos los escogidos allí estaremos con el Señor, de gracia llenos, siendo testigos que por los siglos es Dios de amor."},{"t":"c","x":"Soy redimido esto es muy cierto, un Cristo vivo llevo en mi pecho; si estoy caído él está presto a levantarme con su poder."}]},{"s":"Himnario congregacional","n":"263","t":"Grande gozo hay en mi alma hoy","p":"549","c":"Letra: Eliza Edmunds Hewitt (1851-1920); Música: John Robson Sweney (1837-1899)","l":[{"t":"v","n":"1","x":"Grande gozo hay en mi alma hoy, pues Jesús conmigo está, y su paz que ya gozando estoy, por siempre durará."},{"t":"v","n":"2","x":"Hay un canto en mi alma hoy, melodías a mi Rey; en su amor feliz y libre soy, y salvo por la fe."},{"t":"v","n":"3","x":"Paz divina hay en mi alma hoy, porque Cristo me salvó; las cadenas rotas ya están, Jesús me libertó."},{"t":"v","n":"4","x":"Gratitud hay en mi alma hoy, y alabanzas a Jesús; por su gracia a la gloria voy, gozándome en la luz."},{"t":"c","x":"¡Grande gozo, cuán hermoso! paso todo el tiempo muy feliz, porque veo de Cristo la sonriente faz, ¡Grande gozo siento en mí! (o bien: tiempo bien feliz)"}],"w":1},{"s":"Himnario congregacional","n":"264","t":"Grande gozo yo tengo hoy","p":"550","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Grande gozo yo tengo hoy porque Cristo me redimió, las cadenas él ya rompió y mi alma salvó."},{"t":"v","n":"2","x":"Gratitud en mi alma hay, y con gozo yo cantaré alabanzas al Salvador; ¡Gloria yo le daré!"},{"t":"v","n":"3","x":"Él me guarda del tentador y me ayuda todo a vencer; él me imparte su protección con su grande poder."},{"t":"v","n":"4","x":"De su amor quiero predicar a los que por tinieblas van, quiero darles a comprender que él los quiere salvar."},{"t":"v","n":"5","x":"Cuando esté en la gloria yo, donde reina el amor de Dios, la corona él me dará; ¡Oh, qué felicidad!"},{"t":"c","x":"Gloria, gloria al Señor Jesús, de su gozo me concedió; él me dio refulgente luz en la cruz, do por mí murió."}]},{"s":"Himnario congregacional","n":"265","t":"Hay cosas que no comprenderé","p":"551","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Hay cosas que no comprenderé, lugares hay do yo no sé, pero sí sé que salvo soy, Mi Dios es real porque lo siento en mi ser."},{"t":"v","n":"2","x":"No podré olvidar como me sentí cuando Jesús me perdonó, pero sí sé que salvo soy, Mi Dios es real porque lo siento en mi"},{"t":"v","n":"3","x":"Soy muy feliz la senda al seguir, pues el Señor conmigo va; porque yo sé que salvo soy, Mi Dios es real porque lo siento en mi"},{"t":"v","n":"4","x":"Un día estaré en el cielo azul con mi Jesús, mi Salvador, porque yo sé que salvo soy, Mi Dios es real porque lo siento en mi"},{"t":"c","x":"Mi Dios es real, real en mi ser, me ha lavado con su sangre carmesí; su dulce amor es para mí, Mi Dios es real porque lo siento en mi ser."}]},{"s":"Himnario congregacional","n":"266","t":"Hay un canto nuevo en mi ser","p":"552","c":"Letra y Música: Luther Burgess Bridgers (1884-1948), Tr. H. Cotto Reyes","l":[{"t":"v","n":"1","x":"Hay un canto nuevo en mi ser, es la voz de mi Jesús"},{"t":"v","n":"2","x":"Náufrago en pecado me encontré, sin paz en mi corazón,"},{"t":"v","n":"3","x":"Tengo de su gracia celestial bajo sus alas de amor;"},{"t":"v","n":"4","x":"Por las aguas hondas me llevó, pruebas en mi senda hallé;"},{"t":"v","n":"5","x":"Cristo en las nubes volverá bajo el bello cielo azul;"},{"t":"c","x":"que me dice: \"ven a descansar\", tu paz conquisté en la cruz. Cristo, Cristo, Cristo, nombre sin igual; llena siempre mi alma, de esa nota celestial.\nmas en Cristo mi Señor hallé dulce paz y protección. Cristo, Cristo, Cristo, nombre sin igual; llena siempre mi alma, de esa nota celestial.\nriquezas que fluyen a raudal desde el trono del Señor. Cristo, Cristo, Cristo, nombre sin igual; llena siempre mi alma, de esa nota celestial.\npor sendero áspero me guió, mas sus huellas seguiré. Cristo, Cristo, Cristo, nombre sin igual; llena siempre mi alma, de esa nota celestial.\nél entonces mi alma llevará; a vivir en gloria y luz. Cristo, Cristo, Cristo, nombre sin igual; llena siempre mi alma, de esa nota celestial."}],"w":1},{"s":"Himnario congregacional","n":"267","t":"Lejos de mi Padre Dios","p":"553","c":"Letra y Música: William Howard Doane (1832-1915), Tr. Frances Jane Crosby (1832-1915)","l":[{"t":"v","n":"1","x":"Lejos de mi Padre Dios por Jesús fui hallado, por su gracia y por su amor sólo fui salvado."},{"t":"v","n":"2","x":"En Jesús, mi Salvador pongo mi confianza, toda mi necesidad suple en abundancia."},{"t":"v","n":"3","x":"Cerca de mi buen Pastor vivo cada día, toda gracia en mi Señor halla el alma mía."},{"t":"v","n":"4","x":"¡Guárdame, Señor Jesús, para que no caiga! como sarmiento en la vid, vida de ti traiga."},{"t":"c","x":"En Jesús, mi Señor, sea mi gloria eterna; él me amó y me salvó en su gracia tierna."}]},{"s":"Himnario congregacional","n":"268","t":"Mi Salvador en su bondad","p":"554","c":"Letra y Música: Charles Hutchinson Gabriel (1856-1932), Tr. Vicente Mendoza Polanco (1875–1955)","l":[{"t":"v","n":"1","x":"Mi Salvador en su bondad al mundo malo descendió, de hondo abismo de maldad mi alma levantó."},{"t":"v","n":"2","x":"Su voz constante resistí aunque él amante me llamó, mas su palabra recibí y fiel me levantó."},{"t":"v","n":"3","x":"Tortura cruel sufrió por mí cuando a la cruz él ascendió tan sólo así salvado fui y fiel me levantó."},{"t":"v","n":"4","x":"Que soy feliz yo bien lo sé con esta vida que él me dio, mas no comprendo aún por qué Jesús me levantó."},{"t":"c","x":"Seguridad me dio Jesús, cuando su mano me tendió; estando en sombra, a plena luz, en su bondad me levantó."}]},{"s":"Himnario congregacional","n":"269","t":"Mis culpas todas borró Jesús","p":"555","c":"Letra y Música: Jack P. Scholfield (1882-1972), Tr. Vicente Mendoza Polanco (1875–1955)","l":[{"t":"v","n":"1","x":"Mis culpas todas borró Jesús con infinito a"},{"t":"v","n":"2","x":"En densas sombras anduve yo cuando en maldad vi"},{"t":"v","n":"3","x":"Gloriosa vida de libertad disfruto yo por"},{"t":"v","n":"4","x":"Eterno canto en mi corazón elevo al Reden"},{"t":"c","x":"mor; cargó con ellas en cruenta cruz, en medio de mortal dolor. su poder, a vida nueva Jesús me ha llamado; ¡Ya salvo soy!\nvi, y mi alma nunca la paz halló, ni gozo alguno yo sentí. Salvo por él yo soy, salvo por su poder, a vida nueva Jesús me ha llamado; ¡Ya salvo soy!\nél; ya no hay temores, no hay ansiedad, porque él me guarda siempre fiel. su poder, a vida nueva Jesús me ha llamado; ¡Ya salvo soy!\ntor; negar no puedo su salvación, negar, no puedo, no, su amor. su poder, a vida nueva Jesús me ha llamado; ¡Ya salvo soy!"}],"w":1},{"s":"Himnario congregacional","n":"270","t":"¿No sabes tú, hermano, que Dios es todo amor?","p":"556","c":"Letra y Música: Emilio Juárez Aranda, ICI, Himno de la convención de 1944.","l":[{"t":"v","n":"1","x":"¿No sabes tú, hermano, que Dios es todo amor, que dio a su Hijo amado para tu salvación? dejó su trono y gloria el divino Señor, para ofrecerte vida, eterna salvación."},{"t":"v","n":"2","x":"Tú pensarás: soy bueno, a nadie le hago mal; tú pensarás que vives una vida moral; pero si estás sin Cristo, esto te perderá; no le desprecies nunca, te ofrece libertad."},{"t":"v","n":"3","x":"El tiempo ya se acerca, Cristo viene otra vez, tus obras no te salvan, sólo el poder de Dios; deja la vana gloria, déjate de vagar, acéptale ahora mismo, nunca te pesará."},{"t":"c","x":"Sólo el poder de Dios puede cambiar tu ser, la prueba yo te doy, él me cambió a mí; ¿No ves que soy feliz? ¿No ves el cambio en mí? Nueva criatura soy, pues él me rescató."}]},{"s":"Himnario congregacional","n":"271","t":"¡Oh! mi corazón reboza ya de gozo","p":"557","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"¡Oh! mi corazón rebosa ya de gozo porque Dios me perdonó con gran amor; sirviendo a mi Jesús estoy dichoso, voy al cielo donde está mi Salvador. pera; voy subiendo en clara luz voy subiendo con Jesús, alabanzas cantaré a Dios a"},{"t":"v","n":"2","x":"Cada día quiero amarle más constante, quiero serle cada día más leal, ayudado por su gracia, que abundante nos concede nuestro Padre celestial, Voy subiendo al cielo en áura escalera, voy subiendo do corona me es(2a Vez) voy su"},{"t":"v","n":"3","x":"Hallo gran placer trayendo pecadores, pecadores de cualquiera condición, a Jesús que en cruenta cruz sufrió dolores para dar a todos plena salvación."},{"t":"c","x":"llá. Voy subiendo al celeste hogar, me voy con Cristo al celeste hogar."}],"w":1},{"s":"Himnario congregacional","n":"272","t":"¿Quieres tú saber porqué vivo gozoso?","p":"558–559","c":"Letra y Música: Leonardo Flores Esparza, ICIAR","l":[{"t":"v","n":"1","x":"¿Quieres tú saber porqué vivo gozoso? Es que Cristo mis pecados perdonó; ¿Quieres tú saber por qué hay gozo en mi alma? es que Cristo mi alma salvó, es que Cristo mi alD g"},{"t":"v","n":"2","x":"Deja ya de vagar por esos caminos que conducen a una eterna perdición, Cristo dice: \"Yo soy el mejor camino que conduce a la célica man sión, que conduce a lama salvó."},{"t":"v","n":"3","x":"Si este mundo donde sólo hay falsedades ha hecho a tu alma en el abismo sucumbir, Cristo allá en dura cruz pagó con sangre la mansión gloriosa donde hoy puedes ir, La mansión gloriosa célica mansión."},{"t":"c","x":"D G a la fuente de agua viva que es Jesús; él convierte tu tristeza en grande gozo; y tus tinieblas se convertirán en luz.\nHoy te invito a la fuente inagotable, a la fuente de agua viva que es Jesús; él convierte tu tristeza en grande gozo; y tus tinieblas se convertirán en luz."}],"w":1},{"s":"Himnario congregacional","n":"273","t":"¿Saber quieres?","p":"559","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"¿Saber quieres por qué canto tan alegre, como el ave que bendice a su Creador, en el prado y en el bosque deliciosos? Porque Dios me perdonó con gran amor."},{"t":"v","n":"2","x":"¿Saber quieres por qué vivo tan confiado, aunque ruja en derredor la tempestad? el Señor Jesús está siempre a mi lado, su presencia me da paz, seguridad."},{"t":"v","n":"3","x":"¿Saber quieres por qué vivo apartado, de las fuentes de delicia mundanal? Jesucristo, por su muerte, me ha salvado y en él hallo paz, delicia celestial."},{"t":"c","x":"Aleluya, aleluya; toda culpa perdonó el Redentor. Cuán glorioso es Cristo, en el alma tengo el gozo de su amor."}]},{"s":"Himnario congregacional","n":"274","t":"Sin fe, sin esperanza, sin luz y sin calor","p":"560–561","c":"Letra: Francisco Sánchez Muñiz/Raúl Morales Zamora, ICI; Música: Francisco Sánchez Muñiz, ICI","l":[{"t":"v","n":"1","x":"Sin fe, si esperanza, sin luz y sin calor, llevando sin descanso la carga del dolor; De penas doblegado, así vagaba yo, errante en este mundo de afán y de Aflicción."},{"t":"v","n":"2","x":"Lavado fui de culpas, mi carga él quitó, consuelo, paz y gozo puso en mi corazón; de alegría radiante, hoy sirvo a mi Señor, y arde en mi constante el fuego de su amor."},{"t":"v","n":"3","x":"Si esclavo del pecado te encuentras con horror, contrito y humillado acércate al Señor, te salvará piadoso con infinito amor, te dará paz y gozo, será tu protector."},{"t":"c","x":"Un rayo luminoso cubrióme con su luz, radiante, esplendoroso, partiendo de una cruz; en ella estaba Cristo diciendo en dulce voz: \"Tus culpas he pagado, perdón tienes de Dios\"."}]},{"s":"Himnario congregacional","n":"275","t":"Tengo mucho gozo en mi corazón","p":"561","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Tengo mucho gozo en mi corazón, gloria a mi Cristo por su redención;"},{"t":"v","n":"2","x":"He dejado al mundo con su falsedad por seguir a Cristo, pues es la verdad;"},{"t":"v","n":"3","x":"Cristo en un momento mi cuerpo sanó, mis enfermedades todas él llevó;"},{"t":"v","n":"4","x":"Nada ofrece el mundo sino perdición, solamente en Cristo hay grande salvación;"},{"t":"v","n":"5","x":"Cristo en las nubes pronto volverá, y en mansión gloriosa mi alma vivirá;"},{"t":"c","x":"Bendito sea por su grande amor pues él me libertó."}],"w":1},{"s":"Himnario congregacional","n":"276","t":"Toda mi vida en el pecado, ha terminado","p":"562–563","c":"Letra y Música: Aquiles Mireles Perales y Abdiel Mayo, ICI","l":[{"t":"v","n":"1","x":"Toda mi vida en el pecado, ha terminado al encontrar a Jesús bendito crucificado, todas mis manchas él ha borrado, me dio vida eternal por su grande bondad para mí, tan pecador. Por su gracia fui salvado, él sufrió por mí la cruz, mi pecado fue limpiado con la sangre de Jesús; vivo hoy agradecido, quiero seguir la senda que por mí trazó, decir a la humanidad que Cristo es mi Salvador, mi precioso Consolador."},{"t":"v","n":"2","x":"En el pecado mi triste vida se deslizaba, densas tinieblas, escura noche me circundaba, mas de repente luz refulgente en mi derredor brilló; era Cristo Jesús que mi vida transformó. ¡Oh qué cambio tan hermoso en mi senda yo sentí; hoy camino muy gozoso, gracia plena recibí; transformada fue mi vida, y nunca más, jamás al mundo volveré; a mi Señor serviré con todo mi corazón por su grande transformación."}]},{"s":"Himnario congregacional","n":"277","t":"Ya la noche con sus sombra se alejó","p":"564","c":"Letra y Música: Alfred Henry Ackley (1887-1960), Tr. Vicente Mendoza Polanco (1875-1955)","l":[{"t":"v","n":"1","x":"Ya la noche con su sombra se alejó, la mañana vino ya; y vi"},{"t":"v","n":"2","x":"Hizo Cristo un mundo nuevo para mí, la mañana vino ya; y por"},{"t":"v","n":"3","x":"Una vida esplendorosa viviré, la mañana vino ya; porque en"},{"t":"c","x":"viendo en plena luz me encuentro yo, la mañana vino ya; La mañana reina ya en mi corazón, toda mancha ha borrado mi Señor, ya cantando alegre voy, porque con Jesús estoy; la mañana reina ya en mi corazón.\nél y en él la vida es grande aquí, la mañana vino ya; corazón, mi buen Señor, tando alegre voy, porque con Jesús estoy; la mañana reina ya en mi corazón.\nCristo mi Señor me apoyaré, la mañana vino ya; tando alegre voy, porque con Jesús estoy; la mañana reina ya en mi corazón."}],"w":1},{"s":"Himnario congregacional","n":"278","t":"Ya no es mi vida cual antes fue","p":"565","c":"Letra: A. Mejia; Música: Thoro Harris (1874-1955)","l":[{"t":"v","n":"1","x":"Ya no es mi vida cual antes fue, borrado el pecado está; hoy canto feliz ¡Aleluya! y voy feliz al dulce hogar."},{"t":"v","n":"2","x":"Mi vida fue cruel desilusión, un amigo fiel no hallé, mas luz y muy grato consuelo, hallé en mi buen Salvador."},{"t":"v","n":"3","x":"Ya no más luto ni cruel pesar, cual nubes huyeron ya; al cielo yo miro gozoso, do hay gloria, gloria eternal."},{"t":"c","x":"La senda es muy estrecha mas la sigo, la sigo, la sigo, la senda es muy estrecha mas la sigo; yo la sigo por las huellas de Jesús.\nla sigo, la sigo, la sigo, por las huellas de Jesús."}],"w":1},{"s":"Himnario congregacional","n":"279","t":"Ya se oye silbar el tren","p":"566","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Ya se oye silvar el tren, ya no tardará en llegar, es un tren muy especial al reinado celestial; donde viene mi Jesús, que nos viene a llevar."},{"t":"v","n":"2","x":"Este tren espiritual, es un tren muy especial, que viene llegando ya ¿no oyes que silvidos da? son los tiempos ya cumplidos en que Cristo volverá."},{"t":"v","n":"3","x":"Venid luego peregrinos, a la central estación; los ministros de mi Cristo se encuentran en procesión repartiendo los boletos a la gran ciudad de Sión."},{"t":"v","n":"4","x":"El boleto no te cuesta, más que dar tu corazón y servirle a Jesucristo el que obró en tu corazón, y el boleto está arreglado hasta la ciudad de Sión."},{"t":"v","n":"5","x":"Cuando ya el tren se acerca la campana sonará, el que no tenga boleto de seguro que no irá; a disfrutar con mi Cristo a la gran ciudad de Sión."},{"t":"v","n":"6","x":"La central de la estación, es la iglesia espiritual donde se encuentra gozosa toda esta embarcación, con el boleto en la mano para marchar hasta Sión."},{"t":"v","n":"7","x":"Este tren espiritual, es un tren muy especial, es Jesús el conductor, los boletos va a checar, la defensa de este tren es la guardia celestial."},{"t":"v","n":"8","x":"Este tren corre muy fuerte y a muy gran velocidad, las líneas están directas, no hay ninguna desviación; este es el tren directo, que va a la ciudad de Sión."}],"w":1},{"s":"Himnario congregacional","n":"280","t":"Yo tengo un himno de loor","p":"567","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: Edwin Othello Excell (1851-1921)","l":[{"t":"v","n":"1","x":"Yo tengo un himno de loor desde que salvo estoy, para mi Rey, mi Salvador, desde que salvo estoy. él me gloriaré, desde que salvo estoy, en mi Salvador me gloriaré."},{"t":"v","n":"2","x":"Yo tengo un Cristo, y mi ansiedad desde que salvo estoy, está en cumplir su voluntad desde que salvo estoy. Desde que salvo estoy, desde que salvo estoy sólo en desde que salvo estoy, desde que salvo estoy,"},{"t":"v","n":"3","x":"Yo tengo un gozo que él me dio desde que salvo estoy, cuando en su sangre me lavó, desde que salvo estoy. Desde que salvo estoy, desde que salvo estoy,"},{"t":"v","n":"4","x":"Con mi Señor yo viviré porque ya limpio estoy, y allí seguro estaré porque ya salvo soy."}],"w":1},{"s":"Himnario congregacional","n":"281","t":"El alfolí de Dios","p":"568–569","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Las Sagradas Escrituras son el buen aventador las que guardan bien el trigo y el agua de salud. también la iglesia de Cristo es el alfolí de Dios, porque guarda bien el trigo y el agua de salud."},{"t":"v","n":"2","x":"Si alguno oyere del Padre, venga al alfolí de Dios, Cristo le da de comer como me está dando a mí. Si hambre tienes de justicia, oye palabra de Dios, serás bienaventurado y lleno de consolación."},{"t":"v","n":"3","x":"El Espíritu te llama y la iglesia te convida, diciéndote que de gracia bebas del agua de vida; Y si arrepentido vienes por la puerta tú entrarás, y su crees en Jesucristo bautizado tú serás."},{"t":"c","x":"Vamos al alfolí de Dios, ¡cantemos aleluya! que el viento ya está soplando y el trigo se está apartando Vamos al alfolí de Dios, ¡cantemos aleluya! que ha preparado banquete para los que van entrando, sopla viento, sopla más, y el trigo se apartará; sopla viento, sopla más y la paja volará."}]},{"s":"Himnario congregacional","n":"282","t":"Ven, caminante cansado","p":"570–571","c":"Letra y Música: David González Navarro, ICIAR, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"Ven, caminante cansado, ven a la fuente eternal; ven a saciarte ahora presto, Cristo agua viva te da. Tú que caminas senda de dolor, que el buen Señor te trazó,"},{"t":"v","n":"2","x":"¿Traes carga de desconsuelo o gimes por tu aflicción? déjalas aquí a sus plantas y sólo bebe su amor. Agua sin precio, purísima, da, del manantial de su ser,"},{"t":"v","n":"3","x":"Cierra tus ojos y olvida; todo a pasado ya; luchas, tristezas y afanes, todos a quedado atrás. Hoy te encuentras protegido del sol del sufrimiento atroz"},{"t":"c","x":"huellas de sangre divina él marcó, Ven al Oasis de Luz. Sacia, recuesta tu alma; descansa en el pecho de amor de mi Señor Jesucristo, que con nosotros está; mira que te está esperando, su rostro sonrientes está, y es que abrazarte ya quiere y verte en su dulce comunión.\nque salta fresca para eternidad, precioso Oasis de Luz. Sacia, recuesta tu alma; descansa en el pecho de amor de mi Señor Jesucristo, que con nosotros está; mira que te está esperando, su rostro sonrientes está, y es que abrazarte ya quiere y verte en su dulce comunión.\ndel desierto de esta vida fugaz, diáfano Oasis de Luz. Sacia, recuesta tu alma; descansa en el pecho de amor de mi Señor Jesucristo, que con nosotros está; mira que te está esperando, su rostro sonrientes está, y es que abrazarte ya quiere y verte en su dulce comunión."}],"w":1},{"s":"Himnario congregacional","n":"283","t":"Se llegó la hora de tu valentía","p":"572","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Se llegó la hora de tu valentía, en que tú publiques que Cristo ven"},{"t":"v","n":"2","x":"Id por todo el mundo dice mi Jesús, lleva el evangelio glorioso de"},{"t":"c","x":"drá; no importa la lluvia, ni el calor del día, ni la noche oscura, Dios te alumbrará. Hablales de Cristo, diles que ya viene, que no se detiene, pronto volverá; hablales de Cristo, diles que él los salva de la grande angustia que en la tierra habrá.\nluz; no lleves alforja, no te servirá, Dios dará su Espíritu, él te sostendrá. tiene, pronto volverá; hablales de Cristo, diles que él los salva de la grande angustia que en la tierra habrá."}],"w":1},{"s":"Himnario congregacional","n":"284","t":"Seguiremos luchando","p":"573","c":"Letra y Música: Leonardo Flores Esparza, ICIAR.","l":[{"t":"v","n":"1","x":"Seguiremos luchando por ganar muchas almas, anunciando que Cristo tiene todo el poder. Seguiremos hablando del poder milagroso con que Cristo amoroso transformó nuestro ser. Seguiremos luchando aunque en distintos rumbos, por ganar muchas almas para Cristo el Señor. Seguiremos hablando de todas sus bondades. Seguiremos diciendo que en él sólo hay perdón."},{"t":"v","n":"2","x":"Por la causa de Cristo no me importa la muerte, con tal de contemplar a mi Rey y Señor, que me dice amoroso basta sólo mi gracia, y yo en esto me apoyo por su inefable amor. A veces en las luchas nos sentimos tan solos, que parece que el alma ya va a desfallecer; pero oigo su palabra que conforta mi alma, y yo sigo Adelante aunque venga el dolor."}]},{"s":"Himnario congregacional","n":"285","t":"Sembraré la simiente preciosa","p":"574","c":"Letra y Música: George Coles Stebbins (1846–1945)","l":[{"t":"v","n":"1","x":"Sembraré la simiente preciosa del glorioso evangelio de a"},{"t":"v","n":"2","x":"Sembraré en corazones sensibles, la doctrina del Dios de per"},{"t":"v","n":"3","x":"Sembraré en corazones de mármol la bendita palabra de"},{"t":"c","x":"mor. Sembraré, sembraré mientras viva; dejaré el resultado al Señor. mor; segaré, segaré, al hallarme en la casa de Dios.\ndón. Sembraré, sembraré mientras viva; dejaré el resultado al Señor. Sembraré, sembraré mientras viva, simiente de amor; segaré, segaré, al hallarme en la casa de Dios.\nDios. Sembraré, sembraré mientras viva; dejaré el resultado al Señor. mor; segaré, segaré, al hallarme en la casa de Dios."}],"w":1},{"s":"Himnario congregacional","n":"286","t":"Marcha con gozo, pueblo del Señor","p":"575","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Marcha con gozo, pueblo del Señor con alabanzas y glorias al Creador; mira a Cristo que humilde te invita que te recrees en el banquete del amor."},{"t":"v","n":"2","x":"Si tú quieres venir a Jesucristo, dejas este mundo y toda tentación; ven ahora a los pies del Dios bendito; goza de dicha y también de su perdón."},{"t":"v","n":"3","x":"Todos los santos que gozan esta dicha, dejaron todo por seguir a su Señor, porque el banquete es recuerdo de su muerte y la memoria de su bendita pasión."},{"t":"c","x":"Este es el pueblo que Dios había escogido, era esparcido por el mundo y el error; mas ahora, por piedad lo ha recogido, ven a recrearte en el banquete del amor."}]},{"s":"Himnario congregacional","n":"287","t":"Obediente a tu mandato","p":"576","c":"Letra: James Montgomery (1771-1854), Trad. Merrel N. Hutchinson (1835-?), 1877; Música: A. Wishaw","l":[{"t":"v","n":"1","x":"Obediente a tu mandato participa hoy tu grey de tu cena; y con gozo acercámonos con fe; Lo que hiciste en el Calvario por el pobre pecador anunciamos en tu nombre, recordando tu amor."},{"t":"v","n":"2","x":"Recordamos tus angustias ¡Oh Divino Redentor! y la copa de amargura que por todo pecador en el Gólgota apuraste despreciando tu dolor te pedimos que constantes te sigamos con valor."},{"t":"v","n":"3","x":"En su cuerpo traspasado meditemos con piedad; en banquete tan sagrado su memoria renovad; y la sangre que a torrentes derramara el Salvador, recordemos reverentes en la cena del Señor."}]},{"s":"Himnario congregacional","n":"288","t":"Al sonar de la trompeta","p":"577","c":"Letra: D. Bazan; Música: Dion de Marbella, Arr. Rufus Henry Cornelius (1872-1933)","l":[{"t":"v","n":"1","x":"Al sonar de la trompeta, nuestro corazón despierta, es Jesús que en las nubes viene ya; de mil ángeles rodeado, de victoria coronado, cuando velva él en gloria, ¡Aleluya!"},{"t":"v","n":"2","x":"En las bodas del cordero, gozaremos en el cielo; para siempre estaremos con Jesús; no habrá lágrimas ni llanto, pues que todo será canto, cuando vuelva él en gloria, ¡Aleluya!"},{"t":"v","n":"3","x":"A la mesa estaremos, y con Cristo cenaremos; ¡Cuán felices ya seremos con Jesús! por los siglos de los siglos, con los ángeles y santos reinaremos en su gloria, ¡Aleluya!"},{"t":"c","x":"¡Oh! hermano, ¿estás listo? ¿vives tú ya salvo en Cristo? ¿Cuánta gloria, ¡Aleluya! se verá! voz de júbilo se oirá, En los cielos cantaremos, cuando vuelva Él en gloria, ¡Aleluya!"}],"w":1},{"s":"Himnario congregacional","n":"289","t":"Cantan los ángeles con dulce voz","p":"578","c":"Letra: Henry Cleophas Ball (1896-1989); Música: Frederick Messik, 1914","l":[{"t":"v","n":"1","x":"Cantan los ángeles con dulce voz, canten los hombres con sonora voz; Cristo vendrá, nuestro Rey vencedor, Cristo vendrá otra vez."},{"t":"v","n":"2","x":"Ved en la tierra, los aires y el mar, grandes señales cumpliendose ya, todo indicando que pronto vendrá, nuestro glorioso Señor."},{"t":"v","n":"3","x":"Todos los muertos en Cristo saldrán de sus sepulcros, y alegres irán, para encontrar a su Rey subirán; Cristo vendrá otra vez."},{"t":"v","n":"4","x":"Ven en las nubes, ¡Oh, buen Salvador! ¡ven a la tierra te ruego, Señor! ¡ven, que tu iglesia te espera, Jesús! Cristo vendrá otra vez."},{"t":"c","x":"¡Viene otra vez, viene otra vez, En gloria viene al mundo otra vez! ¡Viene otra vez, viene otra vez, Él viene pronto a reinar."}],"w":1},{"s":"Himnario congregacional","n":"290","t":"Día de victoria y gran resplandor","p":"579","c":"Letra: Henry Cleophas Ball (1896-1989); Música: Lewis Edgar Jones (1865-1936)","l":[{"t":"v","n":"1","x":"Día de victoria y gran resplandor cuando Cristo volverá; qué glorioso encuentro con mi Salvador, ¡en las nubes se verá!"},{"t":"v","n":"2","x":"Día de gran gozo, día sin igual, cuando Cristo volverá; de esta patria iremos a la celestial, Cristo allí nos honrará."},{"t":"v","n":"3","x":"Oye la trompeta que anunciando está la venida del Señor; ya no más dolores ni afán allá; ¡con Jesús triunfó el amor!"},{"t":"c","x":"En las nubes él vendrá, en aquel día final, Cristo el Salvador muy pronto volverá; ¡Un gran día sin igual!"}]},{"s":"Himnario congregacional","n":"291","t":"Hay muchos que nunca comprenden por qué","p":"580","c":"Letra y Música: J. E. French, 1903","l":[{"t":"v","n":"1","x":"Hay muchos que nunca comprenden por qué estoy tan gozoso aquí, crucé el Jordán, llegué a Canaán. ¡Oh, sí, es un cielo aquí!"},{"t":"v","n":"2","x":"Cuando alegres cantan los santos así, la gente no sabe por qué, pero es el Espíritu Santo de Dios que Cristo a mandado aquí."},{"t":"v","n":"3","x":"Tonadas celestes oímos cantar por tierra, por aire y por mar, resuena el mensaje de Cristo el Señor que muy pronto ha de llegar."},{"t":"v","n":"4","x":"Veremos a Cristo que en gloria vendrá, el Cristo que en la cruz murió; a todos los suyos arrebatará, aquellos que él mismo compró."},{"t":"c","x":"¡Oh, sí, es un cielo aquí! ¡Oh sí, es un cielo aquí; crucé el Jordán, llegué a Canaán, ¡Oh, sí, es un cielo aquí!"}]},{"s":"Himnario congregacional","n":"292","t":"¡Oh! dad al Rey la bienvenida","p":"581","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"¡Oh! dad al rey la bienvenida, Él viene en gloria, ¡tu luz debe estar encendida, pues Cristo pronto volverá!"},{"t":"v","n":"2","x":"¡Oh! proclamad con alegría: \"Él viene en gloria\", a media noche o ya de día Jesús en gloria volverá."},{"t":"v","n":"3","x":"No desfallezcas ni desmayes, Él viene en gloria, ¡jamás la dulce nueva calles: en grande gloria volverá!"},{"t":"v","n":"4","x":"Con ángeles y serafines Él viene en gloria, rodeado de los querubines ¡Al mundo en gloria viene ya!"},{"t":"c","x":"Anuncia la historia: el Salvador en plena gloria, en triunfo y victoria ¡Al mundo pronto volverá!"}]},{"s":"Himnario congregacional","n":"293","t":"Un día Cristo volverá","p":"582","c":"Letra: Henry Cleophas Ball (1896-1989); Música: Liliuokalani; (Lydia Lili‘u Loloku Walania Wewehi Kamaka‘eha,; Reina de Hawai, 1838-1917), Arr. T. H.","l":[{"t":"v","n":"1","x":"Un día Cristo volverá, promesa que no faltará; como se fue así vendrá, y su pueblo con gran gozo le verá."},{"t":"v","n":"2","x":"Los mensajeros del Señor afirman que vendrá Jesús; y el fiel y buen Consolador las promesas ya sacó a plena luz."},{"t":"v","n":"3","x":"¡Oh!, gloria sin comparación será a nuestro Rey mirar; preciosa y grande bendición que el cristiano está seguro en disfrutar."},{"t":"v","n":"4","x":"¡Oh, bienvenido Rey Jesús tu iglesia te espera aquí; muy pronto ha de ver tu faz y gozar de tus laureles siempre allí."},{"t":"c","x":"Muy pronto, sí, Jesús vendrá, y alegre le verá su pueblo; ¡Velad! ¡Orad! el Rey vendrá, los suyos arrebatará. (o bien: pueblo le verá, así será.)"}],"w":1},{"s":"Himnario congregacional","n":"294","t":"Viene otra vez nuestro Salvador","p":"583","c":"Letra: Desconocido; Música: Lelia (Mrs. C.H.) Morris (1862-1929)","l":[{"t":"v","n":"1","x":"Viene otra vez nuestro Salvador, ¡Oh, que si fuera hoy! para reinar con poder y amor, ¡Oh, que si fuera hoy! ya por su esposa viene otra vez purifica da en su grande amor, del mundo por la redondez, ¡Oh, que si fuera hoy!"},{"t":"v","n":"2","x":"Terminará el poder de Satán, ¡Ojalá fuera hoy! no más tinieblas aquí serán, ¡Ojalá fuera hoy! todos los muertos en Cristo irán arrebatados por su Señor, ¿cuándo estas cosas sucederán? ¡Ojalá fuera hoy!"},{"t":"v","n":"3","x":"Fieles y leales nos debe hallar, si él viniera hoy; todos velando con gozo y paz, si él viniera hoy; multiplicadas señales hay, en el oriente se ve el albor; ya más cercano el tiempo está, ¡Ojalá fuera hoy!"},{"t":"c","x":"¡Gloria! ¡Gloria! gozo sin fin traerá, ¡Gloria! ¡Gloria! al coronarle Rey; ¡Gloria! ¡Gloria! la senda preparad, ¡Gloria! ¡Gloria! Cristo viene otra vez."}]},{"s":"Himnario congregacional","n":"295","t":"Yo espero el día alegre","p":"584","c":"Letra: Henry W. Cragin (1885-1947), Música: James M. Kirk (1854-1945)","l":[{"t":"v","n":"1","x":"Yo espero el día alegre cuando Cristo volverá, pues vendrá al mundo pronto y nos arrebatará; ¡Oh, qué gozo este pensamiento a mi alma da; el que Cristo venga al mundo otra vez!"},{"t":"v","n":"2","x":"La venida de Jesús será el remedio al dolor que aflige siempre a este pobre mundo pecador; toda lagrima se enjugará por nuestro Salvador; cuando en gloria venga al mundo otra vez."},{"t":"v","n":"3","x":"Llegarán los santos a Sión con gozo eternal, y en todo el santo monte nada daña ni hace mal, pues conocerán su amor entonces, todos por igual, cuando Cristo venga al mundo otra vez."},{"t":"v","n":"4","x":"El pecado, pena y muerte en este mundo cesarán; mártires y santos con Jesús por siempre reinarán, cada alma gozará de paz perfecta, sin afán, cuando en gloria venga al mundo otra vez."},{"t":"c","x":"¡Oh! Jesús vendrá al mundo otra vez, sí, Jesús vendrá al mundo otra vez, le veremos en las nubes con los ángeles de luz, cuando en gloria venga al mundo otra vez."}]},{"s":"Himnario congregacional","n":"296","t":"A Jesucristo ven sin tardar","p":"585","c":"Letra y Música: George Frederick Root (1820-1895), Tr. Juan Bautista Cabrera Ivars (1837-1916)","l":[{"t":"v","n":"1","x":"A Jesucristo ven sin tardar, que entre nosotros hoy él está,"},{"t":"v","n":"2","x":"Piensa que él sólo puede colmar tu triste pecho de gozo y paz;"},{"t":"v","n":"3","x":"Su voz escucha sin vacilar y grato acepta lo que hoy te da;"},{"t":"c","x":"y te convida con dulce afán, tierno, diciendo \"ven\". ¡Oh cuán grata nuestra reunión! cuando allá Señor en tu mansión, contigo estemos en comunión gozando eterno bien.\ny porque anhela tu bienestar, vuelve a decirte \"ven\". ¡Oh cuán grata nuestra reunión! cuando allá Señor en tu mansión, contigo estemos en comunión gozando eterno bien.\ntal vez mañana no habrá lugar, no te detengas, ¡ven! ¡Oh cuán grata nuestra reunión! cuando allá Señor en tu mansión, contigo estemos en comunión gozando eterno bien."}],"w":1},{"s":"Himnario congregacional","n":"297","t":"De Jesús escucha el tierno llamamiento","p":"586","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: R. L. Blowers","l":[{"t":"v","n":"1","x":"De Jesús escucha el tierno llamamiento: \"Ven a mí, pecador\" quiere darte su perdón, paz y contento: \"ven a él, pecador\"."},{"t":"v","n":"2","x":"De tus penas pronto puedes olvidarte, ven a él, ven a él; porque de ellas Cristo puede alivio darte, \"ven a él ven a él\"."},{"t":"v","n":"3","x":"Sólo él puede pleno gozo concederte, ven a él, ven a él; en odiosa cruz por eso vio la muerte, \"ven a él, ven a él\"."},{"t":"v","n":"4","x":"No su voz de amor escuches con desprecio, ven a él, ven a él; por tu salvación pagó divino precio, \"ven a él, ven a él\"."},{"t":"c","x":"Te llama con un tierno acento, tu vida quiere rediC E A D /A A D E A (o bien: mir; oye del Señor el tierno llamamiento: \"ven a mí, ven a mí\".)"}],"w":1},{"s":"Himnario congregacional","n":"298","t":"En pecados y temor el Salvador me vio","p":"587","c":"Letra: Henry Cleophas Ball (1896-1989); Música: Howard E. Smith (1863-1918)","l":[{"t":"v","n":"1","x":"En pecados y temor el Salvador me vio, y aunque indigno pecador su mano me tendió; en el Gólgota al morir mi vida rescató. en la cruz salud por mí él consumó."},{"t":"v","n":"2","x":"De la tumba ya salió mi redentor Jesús, a la muerte ya venció dándome plena luz; te convida a gozar de esta bendición que poseo yo también, la salvación."},{"t":"v","n":"3","x":"A los cielos ascendió Cristo mi Salvador, a la diestra de Jehová está el mediador, intercede en tu favor, ven pronto pecador. no desprecies esta voz, es del Señor."},{"t":"c","x":"Ven al Señor, ¡Oh, pecador! él es tu amigo fiel, ven pecador; ven al Señor, él es amor, escucha su tierna voz; \"Ven pecador\""}]},{"s":"Himnario congregacional","n":"299","t":"Escuchad la voz de Dios","p":"588","c":"Letra y Música: George Bennard, 1911 (1873-1958)","l":[{"t":"v","n":"1","x":"Escuchad la voz de Dios llamando: ¡quién irá por mí a trabajar?,"},{"t":"v","n":"2","x":"Cuando el ángel, al profeta puso un carbón ardiendo del altar:"},{"t":"v","n":"3","x":"Mira hoy a miles que perecen, con tristeza oye su clamor,"},{"t":"c","x":"¿quién rescatará a los perdidos?, ¿quién la senda estrecha mostrará? Dí, Señor, dí Señor, y luego yo responderé; dí, Señor, dime a mí; dí e iré doquiera: \"Heme aquí\".\n¿quién irá por mí? la voz decía, contestó: \"acudo a tu llamar\". Dí, Señor, dí Señor, y luego yo responderé; dí, Señor, dime a mí; dí e iré doquiera: \"Heme aquí\".\nve hermano, ve a socorreles di: \"Maestro, heme aquí, yo voy\". Dí, Señor, dí Señor, y luego yo responderé; dí, Señor, dime a mí; dí e iré doquiera: \"Heme aquí\"."}],"w":1},{"s":"Himnario congregacional","n":"300","t":"Habla Jesús Amante","p":"589","c":"Letra: Henrik Schager; Música: Leander Lycurgus Pikett (1859-1928), Arm. Francisco Javier Corona Vázquez","l":[{"t":"v","n":"1","x":"Habla Jesús amante, habla a mi corazón en tonos delicados de amor y de bondad, constante a la derecha lo siento estar de mí y quiero en mi alabanza muy cerca estar de ti."},{"t":"v","n":"2","x":"Consérvame por siempre en plena santidad, radiante de alegría, de amor y de bondad, yo quiero consagrarte mi entero porvenir, pues sé que a tu reinado muy pronto has de venir."},{"t":"v","n":"3","x":"Habla Jesús amante, tu voz escucharé, tonos de amor desea radiante el corazón, ansiosa el alma mía tu voz escuchará, y estando en tu presencia, mi voz te alabará."},{"t":"c","x":"Yo quiero oír el eco, divino de tu voz, tu voz que a los cautivos concede libertad; yo quiero ahora mismo el dulce murmurar, que diga a mis oídos que no me has de dejar."}]},{"s":"Himnario congregacional","n":"301","t":"Nos veremos en el río","p":"590","c":"","l":[{"t":"v","n":"1","x":"No veremos en el río cuyas aguas argentinas nacen puras cristalinas bajo el trono del Señor."},{"t":"v","n":"2","x":"En las márgenes del río que frecuentan serafines y embellecen querubines da la dicha eterna Dios."},{"t":"v","n":"3","x":"El vergel que riega el río de Jesús es la morada, el mal nunca tiene entrada, allí sólo reina Dios."},{"t":"v","n":"4","x":"Antes de llegar al río nuestra carga dejaremos, libres todos estaremos por la gracia del Señor."},{"t":"v","n":"5","x":"Tiene faz risueña el río pues la de Jesús refleja, la que de su grey aleja todo mal todo dolor."},{"t":"c","x":"¡Oh, Sí!, nos congregaremos de ese río a la ribera, de la vida verdadera que nace del trono de Dios."}]},{"s":"Himnario congregacional","n":"302","t":"Oye pecador, la voz del Salvador","p":"590–591","c":"Letra y Música: Robert Lowry (1826–1899), Arm. Isaac García Contreras.; Letra: Henry Cleophas Ball (1896-1989), Música: Charles Price Jones (1865-1949)","l":[{"t":"v","n":"1","x":"Oye pecador, la voz del Salvador: \"si estás cansado, ven a descansar; ¡ven! no te detengas, echa sobre mí, toda carga tuya, yo la llevaré\"."},{"t":"v","n":"2","x":"Ven a él, hambriento, aunque pobre estés, hay maná del cielo, todo listo está; grande es la fiesta, gratis para ti, Cristo te invita, ven y cenarás."},{"t":"v","n":"3","x":"¿Andas tú desviado, fuera del redil? en los montes densos hay peligros mil; deja de vagar, ¡Oh, ven al buen pastor! vuelve al rebaño y reposarás."},{"t":"v","n":"4","x":"Pon tu fe en Cristo, él te salvará, gozo y paz perfecta te concederá; nunca él rechaza al que acude a él, Cristo es compasivo, te recibirá."},{"t":"c","x":"Ven, ven a mí, y descansarás, toma hoy mi yugo yo te salvaré; manso soy y humilde, tu amigo soy, ven, en mí confía, yo te salvaré.\nVen a mí sí, ven a mí tú descansarás, tú descansarás, toma sobre ti mi yugo es suave, yo te salvaré sí, te salvaré cual manso Cordero muy paciente soy y amigo fiel, en fe, sí, confía en mí, Ven, ¡Oh, ven! y fiar en mi podrás, ten fe, yo te salvaré."}],"w":1},{"s":"Himnario congregacional","n":"303","t":"Pecador, ven al dulce Jesús","p":"592","c":"Letra: Henry Godden Jackson (1838-1914), Tr. Pedro Castro (1840-1887); Música: Joseph Philbrick Webster (1819-1875)","l":[{"t":"v","n":"1","x":"Pecador, ven al dulce Jesús y feliz para siempre serás, si en verdad le quisieres tener al divino Señor hallarás."},{"t":"v","n":"2","x":"Si cual hijo que necio pecó, vas buscando a sus pies compasión, tierno Padre en Jesús hallarás y tendrás en sus brazos perdón."},{"t":"v","n":"3","x":"Si enfermo te sientes morir, él será tu doctor celestial; y hallarás en su sangre también medicina que cure tu mal."},{"t":"v","n":"4","x":"Ovejuela que huyó del redil, ¡he aquí tu benigno Señor! en los hombros llevada serás de tan dulce y amante pastor."},{"t":"c","x":"Ven a él, ven a él, que te espera tu buen Salvador; ven a él, ven a él, que te espera tu buen Salvador.\npecador, ven a él, pecador, ven a él, pecador, pecador,"}],"w":1},{"s":"Himnario congregacional","n":"304","t":"¿Quieres ser salvo de toda maldad?","p":"593","c":"Letra y Música: Lewis Edgar Jones (1865-1936), Tr. D. A. Mata","l":[{"t":"v","n":"1","x":"¿Quieres ser salvo de toda maldad? Tan sólo hay poder en mi Jesús; ¿Quieres vivir y gozar santidad? Tan sólo hay poder en Jesús."},{"t":"v","n":"2","x":"¿Quieres ser libre de orgullo y pasión? Tan sólo hay poder en mi Jesús ¿Quieres vencer toda cruel tentación? Tan sólo hay poder en Jesús."},{"t":"v","n":"3","x":"¿Quieres servir a tu Rey y Señor? Tan sólo hay poder en mi Jesús; Ven, y ser salvo podrás en su amor, Tan sólo hay poder en Jesús."},{"t":"c","x":"Hay poder, poder, sin igual poder en Jesús quien murió; Hay poder, poder, sin igual poder en la sangre que Él vertió."}]},{"s":"Himnario congregacional","n":"305","t":"Si al cruel enemigo temes combatir","p":"594","c":"Letra: Desconocido; Música: Charles Hutchinson Gabriel (1856-1932)","l":[{"t":"v","n":"1","x":"Si al cruel enemigo temes combatir, si la duda agobia siempre tu existir,"},{"t":"v","n":"2","x":"Si te sientes desmayar en la aflicción, si respuesta no hallas en la oración,"},{"t":"v","n":"3","x":"Si feliz el cielo anhelas alcanzar, y del mal y las tinieblas escapar,"},{"t":"v","n":"4","x":"Si anduviéremos en luz, divina luz, limpios nos hará la sangre de Jesús;"},{"t":"c","x":"que la hermosa luz de Dios fulgure en ti, y serás feliz así. Deja penetrar la luz, deja penetrar la luz, que la hermosa luz de Dios fulgurentí, y serás feliz así.\nque la hermosa luz de Dios fulgure en ti, y serás feliz así. penetrar la luz, penetrar la luz, que la hermosa luz de Dios fulgurentí, y serás feliz así.\nque la hermosa luz de Dios fulgure en ti, y serás feliz así. que la hermosa luz de Dios fulgurentí, y serás feliz así.\nclaridad tendremos en el corazón, si vivimos en la luz. que la hermosa luz de Dios fulgurentí, y serás feliz así."}],"w":1},{"s":"Himnario congregacional","n":"306","t":"Si tú cansado ya estás de pecar","p":"595","c":"Letra: Vicente Mendoza Polanco (1875-1955); Música: Lelia (Mrs. C.H.) Morris (1862-1929)","l":[{"t":"v","n":"1","x":"Si tú cansado ya estás de pecar, acepta el perdón de Jesús; si vida nueva quisieras hallar, acepta el perdón de Jesús."},{"t":"v","n":"2","x":"Si vida pura tú quieres tener, acepta el perdón de Jesús; él es la fuente que limpia tu ser, acepta el perdón de Jesús."},{"t":"v","n":"3","x":"Si tú no puedes tus luchas calmar, acepta el perdón de Jesús; si tus anhelos no puedes lograr, acepta el perdón del Jesús."},{"t":"v","n":"4","x":"Si con los santos te quieres unir, acepta el perdón de Jesús; y si a los cielos aspiras a ir, acepta el perdón de Jesús."},{"t":"c","x":"No más pecar, ven a él, su amor te muestra en la cruz; es tiempo, no seas infiel, acepta el perdón de Jesús."}],"w":1},{"s":"Himnario congregacional","n":"307","t":"Vida eterna prometió","p":"596","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Vida eterna prometió, prometió, el Señor al que en él quisiera creer, y morar allá con él; ésta fue la promesa que dio."},{"t":"v","n":"2","x":"Gloria demos al Señor, al Señor, por su amor que en la cruz él nos mostró; pues su sangre derramó por salvar al más vil pecador. Ven a la luz que te da Jesús, ven a la luz que te da Je"},{"t":"v","n":"3","x":"Viene el tiempo de aflicción, de aflicción, cuando ya, cuando ya no habrá lugar; mas ahora salvación Cristo vino a su pueblo a legar."},{"t":"v","n":"4","x":"No te tardes pecador, pecador, en venir, en venir al Salvador; él te llama con amor, ¡apresúrate, ven al Señor!"},{"t":"c","x":"sús; y vivirás allá con él, vida eterna con él gozarás."}],"w":1},{"s":"Himnario congregacional","n":"308","t":"Yo tengo una mansión","p":"597","c":"Letra y Música: Daniel Dávila","l":[{"t":"v","n":"1","x":"Yo tengo una mansión, mansión de gloria es, donde no existe sol, ni oscuridad, los días son de luz, de luz de gloria sí, porque Cristo nos alumbra pues él es la luz."},{"t":"v","n":"2","x":"Cristo nos prometió, preparar un hogar do iremos a gozar en su presencia real, pero para llegar, tú tienes que luchar, si tú has ta el fin perseveras, con él estarás."},{"t":"v","n":"3","x":"Cristo en gloria vendrá y vendrá por su grey, su iglesia gozará en ver así a su Rey; si tú le has sido fiel, él te arrebatará, y con él allá en el cielo feliz estarás."},{"t":"c","x":"Quieres vivir en la mansión, mansión de luz; para vivir tienes que ser como Jesús, tu parecer, tiene que ser reflejo de él; para que muchos conozcan que tú estás en él."}]},{"s":"Himnario congregacional","n":"309","t":"Bienvenido seáis hermanos","p":"598","c":"Letray Música: Alberto G. Martínez, ICI","l":[{"t":"v","n":"1","x":"Unid los cantos todos los santos con dulce voz; E B C F B"},{"t":"v","n":"2","x":"Con reverencia por que en presencia estáis de Dios. Todo cristiano ama ha su hermano de corazón; cin, que la gracia de Dios esté siempre con vos, y que llene vuestro corazón."},{"t":"v","n":"3","x":"No ve fronteras, va por do quiera sembrando amor. Muy pronto unidos los escogidos irán a Dios;"},{"t":"v","n":"4","x":"Y allá en el cielo tendrán el premio de su labor."},{"t":"c","x":"Bienvenidos seáis hermanos, en el nombre de Cristo el Señor; hoy unidos nos gozamos al saber que nos une su amor. Recibid la bienvenida, que tengáis una gran bendi"}],"w":1},{"s":"Himnario congregacional","n":"310","t":"Jubilosas nuestras voces","p":"599","c":"Letra: Francisco S. Montelongo (1878-1941); Música: William James Kirkpatrick (1838-1921)","l":[{"t":"v","n":"1","x":"Jubilosas nuestras voces Elevemos con fervor,"},{"t":"v","n":"2","x":"Bienvenidos los campeones De la fe y de la verdad,"},{"t":"v","n":"3","x":"Bien venidos los soldados De las huestes de Jesús,"},{"t":"v","n":"4","x":"Uno sólo es nuestro anhelo Trabajemos con tesón"},{"t":"c","x":"Para dar la la bienvenida A los siervos del Señor. ¡Bienvenidos! ¡Bienvenidos! Adalides de Jehová; Bienvenida no fingida La Congregación os da.\nA ellos nuestros corazones Hoy les brindan su amistad. ¡Bienvenidos! ¡Bienvenidos! Adalides de Jehová; Bienvenida no fingida La Congregación os da.\nLos que luchan denonados Por el triunfo de la luz. ¡Bienvenidos! ¡Bienvenidos! Adalides de Jehová; Bienvenida no fingida La Congregación os da.\nPor hacer que el Rey del cielo Reine en cada corazón. ¡Bienvenidos! ¡Bienvenidos! Adalides de Jehová; Bienvenida no fingida La Congregación os da."}],"w":1},{"s":"Himnario congregacional","n":"311","t":"Te recibimos por Jesús","p":"600","c":"Letra y Música: Thomas Martin Westrup (1837-1909)","l":[{"t":"v","n":"1","x":"Te recibimos por Jesús, Amado hermano nuestro sé Soldado firme de la cruz, Y redimido por la fe, Y redimido por la fe."},{"t":"v","n":"2","x":"Sé digno de tu vocación Con mansedumbre y humildad, Cuidando siempre de guardar Y promover la unidad, Y promover la unidad."},{"t":"v","n":"3","x":"De nuestro cuerpo miembro ya, Une con él tu voluntad; Es una nuestra vocación, Sea una nuestra caridad, Sea una nuestra caridad."},{"t":"v","n":"4","x":"No pienses en confiar en ti, Mas vela siempre en oración; Y Dios te quiera bendecir Llevándote a la perfección, Llevándote a la perfección."}],"w":1},{"s":"Himnario congregacional","n":"312","t":"Todos fuimos bautizados","p":"601","c":"Letra y Música: Desconocido","l":[{"t":"v","n":"1","x":"Todos fuimos bautizados como aquel siervo Naamán, Sepultada nuestra lepra en las aguas del Jor"},{"t":"v","n":"2","x":"En el mar y en la nube venos en Corintios diez, Todos fuimos bautizados juntamente con Moisés."},{"t":"v","n":"3","x":"Y san Pedro nos recuerda que guardada por la fe, Fue salvada de las aguas la familia de Noé."},{"t":"v","n":"4","x":"4Bienvenido seas hermano bienvenido con amor, por haberte bautizado como manda el Sal.va"},{"t":"c","x":"dan. mente, en el bautismo de Cristo Jesús, en la esperanza de su muerte, porque él es nuestra vida y nuestra luz.\nY sepultados juntamente, en el bautismo de Cristo Jesús, en la esperanza de su muerte, porque él es nuestra vida y nuestra luz.\ndor. mente, en el bautismo de Cristo Jesús, en la esperanza de su muerte, porque él es nuestra vida y nuestra luz."}],"w":1},{"s":"Himnario congregacional","n":"313","t":"Feliz, feliz cumpleaños","p":"602","c":"Letra: Eliza Edmunds Hewitt (1851–1920), 1905, Trad. Severa Euresti (1872-1946); Música: Grant Colfax Tullar (1869-1950), 1905","l":[{"t":"v","n":"1","x":"Feliz, feliz cumpleaños deseamos para ti; que el Dios omnipotente te quiera bendecir."},{"t":"v","n":"2","x":"A Dios rendimos gracias, que con sin par bondad al fin de este año hermoso te permitió llegar."},{"t":"v","n":"3","x":"Oremos pues unidos, que te bendiga Dios, te colme en lo futuro de bien, prosperidad."},{"t":"v","n":"4","x":"Deseamos que en tu día Jesús contigo esté y de sus bendiciones por siempre él te dé."},{"t":"c","x":"Feliz, feliz cumple años, de Dios felicidad, que tengas en la vida, y allá en la eternidad."}]},{"s":"Himnario congregacional","n":"314","t":"Dios os guarde en su santo amor","p":"603","c":"Letra: Jeremiah Eames Rankin (1828-1904), 1880, Tr. P. Aguirre de la Barrera; Música: William Gould Tomer (1833-1896), 1880","l":[{"t":"v","n":"1","x":"Dios os guarde en su santo amor, hasta el día en que lleguemos, a la patria do estaremos para siempre con el Salvador."},{"t":"v","n":"2","x":"Dios os guarde en su santo amor, en la senda peligrosa, de esta vida tormentosa, os conserve en paz y sin temor."},{"t":"v","n":"3","x":"Dios os guarde en su santo amor, os conduzca su bandera, y os esfuerce en gran manera con su Espíritu Consolador."},{"t":"v","n":"4","x":"Dios os guarde en su santo amor, con su gracia él os sostenga, hasta que el Maestro venga a fundar su reino en esplendor."},{"t":"c","x":"Al venir Jesús nos veremos, a los pies de nuestro Salvador; reunidos todos seremos un redil con nuestro buen Pastor."}]},{"s":"Himnario congregacional","n":"314b","t":"Hoy","p":"604–605","c":"Letra y Música: Víctor González Corona, 1989; Copyright 1991Gamma y Gamma Ediciones, usado con permiso","l":[{"t":"v","n":"1","x":"Hoy que la luz del sol se oculta es tarde Señor, un día más ha pasado en la tierra. Gracias te doy por mi vida que guardas en Ti ¡Oh Señor! un día más agradezco de dicha."},{"t":"v","n":"2","x":"Seré mejor para ti mañana si tú me permites la vida aquí en la tierra. Cuida a mis padres y hermanos, también a todos tus siervos protege en tus manos Oh Dios."},{"t":"c","x":"No habrá temor, tú eres mi Paz, en ti confío Señor, mi Señor. Hasta mañana Amigo. Gracias te doy Dios, mi Dios; Jesús."}],"w":1},{"s":"Himnario congregacional","n":"315","t":"Danos un bello hogar","p":"606","c":"Letra y Música: Baylus Benjamin McKinney (1886-1952), 1949, Tr. Guillermo Blair.","l":[{"t":"v","n":"1","x":"Danos un bello hogar: donde la Biblia nos guíe fiel, donde tu amor bienestar nos dé, donde en ti todos tengan fe."},{"t":"v","n":"2","x":"Danos un bello hogar: donde el padre es fuerte y fiel, y su ejemplo se pueda ver, donde tu amor reine en nuestro ser."},{"t":"v","n":"3","x":"Danos un bello hogar: donde la madre con devoción, sepa mostrarnos tu compasión, do todos vivan en comunión."},{"t":"v","n":"4","x":"Danos un bello hogar: donde los hijos con decisión, sigan a Cristo de corazón. do se respire tu bendición."},{"t":"c","x":"¡Danos un bello hogar! ¡Danos un bello hogar!"}]},{"s":"Himnario congregacional","n":"316","t":"Hogar de mis Recuerdos","p":"607","c":"Letra y Música: Henry Rowley Bishop (1786-1855), Tr. Vicente Mendoza Polanco (1875-1955)","l":[{"t":"v","n":"1","x":"Hogar de mis recuerdos a ti volver anhelo, no hay sitio bajo el cielo más dulce que el hogar; posara yo en palacios corriendo el mundo entero, a todos yo prefiero mi hogar, mi dulce hogar."},{"t":"v","n":"2","x":"Allí la luz del cielo desciende más serena, de mil delicias llena la dicha del hogar; allí las horas corren más breves y gozosas, allí todas las cosas recuerdan sin cesar."},{"t":"v","n":"3","x":"Más quiero que placeres, gozar en tierra extraña, volver a la cabaña de mi tranquilo hogar; allí los pajarillos me alegran con sus cantos, allí con mil encantos está la luz de Dios."},{"t":"c","x":"¡Hogar, hogar, mi dulce hogar! no hay sitio bajo el cielo más dulce que el hogar."}]},{"s":"Himnario congregacional","n":"316b","t":"Oración por el matrimonio","p":"608–609","c":"Letra y Música: Isaí Torres Rivero","l":[{"t":"v","x":"Padre tú que estás en los cielos, en toda la tierra y en todo lugar. Jesucristo hijo de Dios, mi Redentor mi amado Cristo. Espíritu Santo de Dios, Consolador, hoy imploramos Que tomen en sus brazos de amor y protección a este matrimonio, bendice desde hoy su hogar ¡oh Dios de a mor y Dios bondadoso! que siempre se refugien en ti y en oración siempre a ti clamen. Padre te lo rogamos en el Nombre de Tu Hijo Jesucristo. Amén, Amén Amén."}]},{"s":"Himnario congregacional","n":"317","t":"Dios bendiga las almas unidas","p":"610","c":"Letra: Daniel Hall; Música: A. Almudévar","l":[{"t":"v","n":"1","x":"Dios bendiga las almas unidas por los lazos de amor sacrosanto, y los guarde de todo quebranto en el mundo, de espinas erial; que el hogar que a formarse comienza con la unión de estos dos corazones goce siempre de mil bendiciones al amparo del Dios de Israel,"},{"t":"v","n":"2","x":"Que el Señor con su dulce presencia, cariñoso estas bodas presida, y conduzca por senda de vida a los que hoy se prometen lealtad. les recuerde que nada en el mundo, es eterno que todo termina, y por tanto, con gracia divina cifrar deben la dicha en su Dios."},{"t":"v","n":"3","x":"Que los dos que al altar se aproximan a ofrecerse su fe mutuamente, busquen siempre de Dios en la fuente el secreto de dicha inmortal; y si acaso de duelo y tristeza se empañasen sus sendas un día, en Jesús hallarán dulce guía que otra senda les muestre mejor."}]},{"s":"Himnario congregacional","n":"317b","t":"Lo nuestro tuyo es","p":"611","c":"Letra: William Walsham How, Tr. Adolfo Robleto","l":[{"t":"v","n":"1","x":"Lo nuestro tuyo es, tu mano nos lo dio; por eso gloria, honra y prez te damos, oh buen Dios. Amén."},{"t":"v","n":"2","x":"Lo nuestro tuyo es, tu mano nos lo dio; de gracia recibí, Señor, y en gratitud te doy."}]},{"s":"Himnario congregacional","n":"317c","t":"Padre, Dueño y Señor","p":"611","c":"Música: Mason and Webb en Cantica Laudis; Letra y Música: Eliezer Moreno Lira","l":[{"t":"v","x":"Padre, Dueño y Señor de todo lo que existe, acepta nuestra ofrenda que traemos; bendícela, conságrala para tu gloria, pues de lo tuyo te damos. Amén."}]},{"s":"Himnario congregacional","n":"317d","t":"Nuestra ofrenda","p":"612","c":"Letra y Música: Manuel V. Flores","l":[{"t":"v","x":"Ofrenda humilde te damos Señor y en ella nuestra adoración. Del corazón es ofrenda de amor; recíbela con tu bendición. Amén."}]},{"s":"Himnario congregacional","n":"318","t":"Adalides","p":"612–613","c":"Letra y Música: Rubén González Alvarado","l":[{"t":"v","n":"1","x":"Varones de Cristo, mirad al rededor; al hombre que se pierde en este mar de error. Levantate y predica, no ceses de hablar; es Cristo quien redime, no hay que desmayar."},{"t":"v","n":"2","x":"Le damos la honra, la gloria y el honor, al trino Dios bendito, que nos brinda su amor. Estamos enlistados en este batallón; con Cristo al frente victoriosos somos hoy."},{"t":"v","n":"3","x":"Los tiempos se cumplen, muy pronto volverá; en majestad y gloria el nos levantará. No cejes en tu esfuerzo, velando en oración; que grande galardón en gloria nos dará."},{"t":"c","x":"Yo soy, yo soy, adalid de Cristo el Salvador; luchando sin temor con fe y valor yo voy. Yo soy, yo soy, soldado del Señor."}]},{"s":"Himnario congregacional","n":"319","t":"Amigas de Jesús","p":"613–614","c":"Letra y Música: Jacob Sánchez Lagunas (1925-1989), ICI, Arr. Emmanuel H. Cruz Gutiérrez","l":[{"t":"v","n":"1","x":"Somos las Vanguardia \"Amigas de Jesús\" De Morelos traemos nuestro canto al Señor, Venimos con gran gozo, con el más grande triunfo, Pues en las grandes luchas, Dios nos muestra su amor. Cristo el mejor Amigo nos ha dado su mano, Y en la prueba más fuerte conservamos la paz; Esa paz tan hermosa que nos da nuestro Amigo, Y por eso cantamos con gran gozo al Señor."},{"t":"v","n":"2","x":"Adelante vanguardia de mujeres cristianas, Cristo está con nosotras, nunca nos dejará; Pues Él es nuestro Amigo, y promete ayudarnos, Si lo que Él nos ordena sabemos conservar. Marchemos de la mano del Amigo Divino, Con su brazo potente nos guiará hasta el final Marchemos de la mano del Amigo Divino, Con su brazo potente nos guiará hasta el final"},{"t":"v","n":"3","x":"Oh que dicha tan grande que Él nos haya salvado, Ya nos dio nueva vida y también un hogar, Que antes de conocerlos era ruina y tragedia, Con su sangre preciosa lo vino a transformar. Ahora somos felices y cantamos con gozo, Al Amigo precioso, a Cristo el Salvador, Y si viene la prueba, Él nos da fortaleza, Y nos guiará seguras a su bella mansión."},{"t":"v","n":"4","x":"Oh mujeres crisdrá. tianas sigamos adelante, La tormenta ha pasado, ahora brilla el sol, Hemos visto cuan grande ha sido su cariño, Él cuido nuestras almas en medio del dolor. Hoy te damos las gracias, Oh Amigo precioso, Y por eso aquí estamos para testificar, Que hay poder en tu sangre, en tu sangre preciosa, Adelante vanguardias, Cristo pronto ven"}],"w":1},{"s":"Himnario congregacional","n":"320","t":"Amigos de Dios","p":"615","c":"Himno de la Alianza de Secundarios del Presbiterio de Misiones; Letra y Música: Efraín Hernández, ICI","l":[{"t":"v","n":"1","x":"Juventud secundaria, alianza amigos de Dios, con gran gozo se levanta en el nombre del Señor, a luchar contra el maligno, anunciando salvación, levantando el estandarte, la bandera de la cruz."},{"t":"v","n":"2","x":"No busquéis tesoros vanos, nos indica nuestro Dios, mas buscad la vida eterna y la santificación; sé un ejemplo a tus hermanos cual lo fue tu salvador; aprovecha hoy tu fuerza, guiado por el redentor."},{"t":"v","n":"3","x":"Mu chas pruebas, ciertamente, en el camino hallarás, mas Jesús con brazo fuerte siempre te sostendrá; secundario la armadura de Dios has de tomar, y el Espíritu divino la victoria te dará."},{"t":"c","x":"Oíd, juventud lo que dice el Salvador:\"Sois vosotros mis amigos si obedecéis mi voz\", por eso secundarios, vamos a trabajar, a luchar vigorosos con Cristo el Capitán."}]},{"s":"Himnario congregacional","n":"321","t":"He aquí unido el Santo Congreso","p":"616–617","c":"Letra y Música: Leonardo Flores, Arm. José Espinoza.","l":[{"t":"v","x":"He aquí unido el santo congreso, hoy se encuentra a tus plantas Señor, esperando tu voz amorosa para así descansar en tu amor; en este año problemas inmensos hemos tenido tú sabes Señor, y a pesar de la lucha tan cruenta tú nos diste potencia y valor. Tú nos diste tus lluvias de gracia, en nuestros campos vimos tu poder, salvando, sanando a las gentes, bautizando con tu Espíritu trambién. Yo te pido divino Cordero me santifiques y me guardes del mal, para así estar en tu presencia, y gozar de tu gloria en el día final. Nuestro santuario se viste de gloria, hay muchas antorchas que irradian ternura y divina luz; nosotros somos refulgentes antorchas que llevamos al mundo el glorioso evangelio de Cristo Jesús. Yo te"}],"w":1},{"s":"Himnario congregacional","n":"322","t":"Daniel victorioso en Dios","p":"618–619","c":"Letra y Música: Ángel Alberto Ibarra Galindo, ICIAR, Arr. Isaac García Contreras","l":[{"t":"v","n":"1","x":"Jóvenes leales y siempre decididos a servir a nuestro Dios, siempre apartándonos del mal, la victoria nos dará nuestro Señor en la oración. Estamos unidos en fraternidad espiritual del Salvador, fortalecidos en la fe, juntos en su amor, permite Señor, contemplar tu resplandor."},{"t":"v","n":"2","x":"Vamos juventud, que ya es tiempo de pelear por la nación que Dios nos dio; el enemigo temblará al escucharnos cantar con gran valor y fuerte voz. Juntos anunciemos a Cristo el redentor que nos salvó en una cruz, es el camino y es la luz, vida es Jesús, adoremos le con inmensa gratitud."},{"t":"v","n":"3","x":"Nunca desmayemos, dispuestos estemos a vivir en santidad, guardando la integridad en amor, con dignidad, y así con Dios poder triunfar. A Cristo servimos y con su poder nos librará del fuego cruel, del mundo nos separará, él nos guiará cumpliremos sí, su preciosa voluntad."},{"t":"c","x":"La alianza Daniel es victoriosa en Dios, firme en santidad, ayuno y oración. Digno es Jesús de recibir poder, gloria y majestad por la eternidad."}]},{"s":"Himnario congregacional","n":"323","t":"La alianza de Jesús así camina","p":"619","c":"Letra y Música: Guadalupe Velasco.","l":[{"t":"v","n":"1","x":"La alianza de Jesús así camina, así camina con mi Jesús. Su Espíritu divino nos anima a que hablemos que Jesús murió en la cruz."},{"t":"v","n":"2","x":"En Cristo las promesas son hermosas, son deliciosas todas sus obras. Si la mar embravecida nos provoca siempre hay fieles pescadores en Jesús."},{"t":"v","n":"3","x":"David y Jonathán es nuestro lema; siempre se amaron con toda el alma. La alianza de Jesús a Cristo le ama y se unifica en un mismo corazón."},{"t":"c","x":"Adelante va esta alianza y su Espíritu de amor que nos llena de valor. Adelante el evangelio, porque es potencia gloriosa del Señor."}]},{"s":"Himnario congregacional","n":"324","t":"Esta es la alianza juvenil","p":"620–621","c":"Himno de la alianza de jovenes \"Discipulos del divino Maestro\"; Letra y Música: Francisco Sánchez Muñiz, Arm. Isaac García Contreras.","l":[{"t":"v","n":"1","x":"Esta es la alianza juvenil que se formó inspiración gloriosa de Cristo Jesús, quien desde el árbol esplendente de la cruz con dulce acento a sus filas nos llamó de las tinieblas a su admirable luz, para servirle todos llenos de amor. como dis"},{"t":"v","n":"2","x":"Hoy esta alianza juvenil avanza ya, en medio de la tempestad marchando va, siguiendo en pos de su bendito adalid para pelear en lo más rudo de la lid; luchando en contra de las huestes de Satán, confiando en Cristo su glorioso capitán. como dis"},{"t":"c","x":"cipulos del divino Maestro esta alianza marcha ya, llena de santo fervor. Basta al discípulo ser como su Maestro. Seguir sus pasos inflamados de amor, llenar su vida de la vida que manó de la preciosa sangre que en la cruz vertió; y pregonar con fe y llenos de valor, las buenas nuevas del bendito Salvador que vino al mundo a salvar a todo aquel que humillado en verdad sólo quiera creer en él."}],"w":1},{"s":"Himnario congregacional","n":"325","t":"Ejercito victorioso de Jesucristo","p":"622–623","c":"Letra y Música: Gamaliel Mora Sánchez, Arm. Isaí Torres Rivero","l":[{"t":"v","n":"1","x":"Sur oriente valle de México presbiterio que Dios levantó. Damos gracias a Jesús el Señor por la vanguardia que de aquí Él llamó. Y seremos ejército de Cristo luchando por todo pecador anun"},{"t":"v","n":"2","x":"La vanguardia ejército de Cristo, marcha firme, llena de poder. Y su Espíritu Santo nos guía a pelear la batalla de la fe. Y obtendremos la victoria contra el mundo lleno de pecado y de maldad, con la"},{"t":"v","n":"3","x":"El ejército victorioso lucha siempre al lado de su Rey. Pues oímos la voz que llama a valientes a alegrarnos con la gloria del Señor. Y se escucha el estruendo en los montes, como de mucho pueblo a combatir, pues Je"},{"t":"c","x":"ciando que Cristo el Señor en la cruz por nosotros murió No tememos seguir a Cristo Él su gran bendición nos dará. Lucharemos, predicaremos pues su gran bendición nos dará. Y si en medio de la lucha alguna de nosotras pudiera morir, la corona de vida en los cielos nuestro Dios con gozo nos dará.\nfe puesta en nuestro Señor la victoria segura será. No tememos seguir a Cristo Él su gran bendición nos dará. Lucharemos, predicaremos pues su gran bendición nos dará. Y si en medio de la lucha alguna de nosotras pudiera morir, la corona de vida en los cielos nuestro Dios con gozo nos dará.\nsús pasa revista a su ejército para ir a la balla a luchar. No tememos seguir a Cristo Él su gran bendición nos dará. Lucharemos, predicaremos pues su gran bendición nos dará. Y si en medio de la lucha alguna de nosotras pudiera morir, la corona de vida en los cielos nuestro Dios con gozo nos dará."}],"w":1},{"s":"Himnario congregacional","n":"326","t":"Fraternidad de Varones Emanuel","p":"624–625","c":"Letra y Música: Desconocido, Arr. Emmanuel H. Cruz Gutiérrez","l":[{"t":"v","n":"1","x":"Fraternidad de varones, Unidos en Cristo Jesús, dispuestos a luchar, Porque Cristo al frente va. Arrancando siempre almas De las garras de Satán; Triun"},{"t":"v","n":"2","x":"Los varones del sureste Nos rendimos a Jesús. Para poder llevar Nuestra vida en santidad. Nuestro anhelo es ser llenos Del Espíritu de Dios, Triun"},{"t":"c","x":"far siempre es el lema Por que Cristo es el capitán. Fraternidad de \"Emanuel\", Que del sureste siempre saldrá Anunciando a to do hombre Que Cristo vino a salvar.\nfar siempre podremos Nues trorefugio es El Dios de Jacob. Fra ternidad de \"Emanuel\", Que del sureste siempre saldrá Anunciando a to do hombre Que Cristo vino a salvar."}],"w":1},{"s":"Himnario congregacional","n":"327","t":"Embajadores del gran Rey","p":"626–627","c":"Letra y Música: Desconocido, Arm. Francisco Javier Corona Vázquez.","l":[{"t":"v","n":"1","x":"De la sangre de Cristo ha nacido una alianza llena de poder; esta alianza va siempre adelante llevando el mensaje del Rey, siempre del Rey. Esta alianza no teme al enemigo pues Jesús con ellos va; el nombre que lleva esta alianza: \"Embajadores del gran Rey\"."},{"t":"v","n":"2","x":"Oh, joven que en el mundo vives perdido sin Dios y sin fe, escucha su voz amorosa ven a él descansarás, descansarás. Él dio su sangre por salvarte allí en dura cruz; sigamos siempre sus pisadas \"Embajadores del gran Rey\"."},{"t":"v","n":"3","x":"Si Dios siempre es con nosotros contra nosotros ¿quién puede ser? revestidos de su potencia para a Satanás vencer, ¡lo venceré! Confiando siempre en su promesa no lo dejaré; si siempre le seguimos fieles, una corona nos dará."},{"t":"c","x":"Adelante va esta alianza con Cristo por capitán; adelante, siempre adelante; en Cristo hay poder, siempre anunciando el evangelio de paz y salvación; ¡Oh! jóvenes, adelante, \"Embajadores del gran Rey\"."}]},{"s":"Himnario congregacional","n":"328","t":"En el fango y el error","p":"628–629","c":"Letra: Francisco Sanchéz Muñiz/Pedro Ontiveros; Música: Francisco Sanchéz Muñiz/Navor. Zepeda, ICI","l":[{"t":"v","n":"1","x":"En el fango y el error, En la densa obscuridad, Una viva luz brilló, Luz potente, celestial; Las tinieblas disipó, Negro fango extinguió, Y pujante \"Nueva Raza\" Sin igual surgió."},{"t":"v","n":"2","x":"Por el rico manantial De la sangre de Jesús, Derramó como raudal Desde el ábol de la cruz, Con potencia ya nació Célica Fraternidad De varones \"Nueva Raza\" Que el Señor formó."},{"t":"v","n":"3","x":"Al llenarnos ¡Oh Señor! De tu Santo Espíritu, Tu nos diste plenitud Y poder y gran virtud; Es por eso, mi Jesús, Que esta gran Fraternidad De varones hoy trabaja Diligente y fiel"},{"t":"c","x":"Señor Jesucristo He aquí la \"Fraternidad Nacional de Varones\" Humillados a tus pies; Queremos servirte En espíritu y verdad, Llenos nuestros corazones De Potencia Celestial."}],"w":1},{"s":"Himnario congregacional","n":"329","t":"Es la vanguardia femenil de misiones","p":"630","c":"Letra y Música: Francisco Sánchez Muñiz. ICIAR","l":[{"t":"v","n":"1","x":"Es la vanguardia femenil de la iglesia del Señor, que fue comprada con su amor, precio de sangre carmesí. Su redentor, Cristo Jesús, le dio un nuevo corazón, puso en su ser nueva canción y por tinieblas le dio luz."},{"t":"v","n":"2","x":"Para el Señor, bello pensil, es la vanguardia femenil, que hoy trabaja con fervor unida por un santo amor. \"En un Señor, en una fe, un sacramento bautismal, una esperanza sin igual, un Dios y Padre celestial."},{"t":"c","x":"Hermanas venid, con fervor marchemos, con gozo sigamos a nuestro adalid; porque he aquí, el va delante de nosotras ya, adelante con valor."}]},{"s":"Himnario congregacional","n":"330","t":"Es la Vanguardia Femenil que marcha","p":"631","c":"Letra y Música: Francisco Sánchez Muñíz","l":[{"t":"v","n":"1","x":"Es la Vanguardia Femenil que marcha con paso firme inflamada de valor. Que sin cesar llena de fe trabaja en tu siasta en la obra del Señor ¡Quiero servirte mi Señor bendito, servirte con todo mi amor! ¡\"Porque a pesar de todo, te amo con toda el alma mi Señor\"!"},{"t":"v","n":"2","x":"Aquí me tienes en tu altar postrada con reverencia a tus plantas mi Señor. Para buscar tu rostro humillada y la gloria inefable de tu amor. ¡Señor Jesús de corazón te ofrezco mi adoración, mi fe, mi amor! ¡\"Porque a pesar de todo, te amo con toda el alma mi Señor\"!"},{"t":"c","x":"Como dijo el apóstol San Pedro, hoy exclamo con tierno fervor: ¡\"Que a pesar de todo, te amo; con toda el alma mi Señor\"!"}],"w":1},{"s":"Himnario congregacional","n":"331","t":"Buscad a nuestro Dios","p":"632","c":"Letra y Música: Francisco Sánchez Muñiz, ICIAR.","l":[{"t":"v","n":"1","x":"Buscad a nuestro Dios en espíritu y verdad; en toda integridad su palabra anunciad. Es lema santo y fiel de nuestra alianza juvenil, servir a nuestro Dios en espíritu y verdad."},{"t":"v","n":"2","x":"Soldados de Jesús es ya tiempo de luchar, y llenos de su luz, las tinieblas disipar. Marchemos juventud en pos de nuestro capitán; con Cristo y su virtud venceremos a Satán."},{"t":"v","n":"3","x":"Si lucho con valor en espíritu y verdad, sembrando con amor, con gozo y fidelidad, con Cristo reinaré allá en la patria celestial, con Cristo viviré por toda la eternidad."},{"t":"c","x":"Escuchad la voz de Cristo: \"testimonio habéis de dar, porque estáis siempre conmigo desde el principio al fin. Por eso con valor anunciamos su verdad."}]},{"s":"Himnario congregacional","n":"332","t":"Fraternidad, fraternidad","p":"633","c":"Letra y Música: Julio Nuñez, ICIAR,; Arr. Emmanuel H. Cruz Gutiérrez.","l":[{"t":"v","n":"1","x":"Fraternidad, Fraternidad es la orden que Cristo da, Fraternidad, Fraternidad es la oración, en humildad. En el amor que mi Jesús en el Calvario nos mostró; Y convivir en santidad, siempre buscando la fraternidad."},{"t":"v","n":"2","x":"Fraternidad con el Señor para vivir en comunión, La humanidad podrá mirar que en realidad El nos salvó. Viviendo así en fraternidad, las almas le aceptarán; Y llegaremos al final, nuestra meta en el cielo será."},{"t":"v","n":"3","x":"Fraternidad al predicar el evangelio del amor, Cual Pablo y Silas anunciar la gran promesa del Señor, Que si tu crees en Jesús, tu hogar también salvo sera; Y andando en sombras o en lu
